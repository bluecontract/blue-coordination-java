name: Set up release tools
description: Pin the canonical compiler and selected test runtime for a release job.
inputs:
  test-java:
    description: Test runtime, 25
    required: true
runs:
  using: composite
  steps:
    - name: Configure Gradle user home
      shell: bash
      run: echo "GRADLE_USER_HOME=$RUNNER_TEMP/coordination-release-gradle" >> "$GITHUB_ENV"

    - name: Set up Java 25
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '25'
        architecture: x64
        check-latest: false

    - name: Restrict Gradle to the pinned JDKs
      shell: bash
      env:
        TEST_JAVA: ${{ inputs.test-java }}
      run: |
        set -euo pipefail
        test "$TEST_JAVA" = "25"
        toolchain_paths="$JAVA_HOME_25_X64"
        mkdir -p "$GRADLE_USER_HOME"
        {
          echo "org.gradle.java.installations.auto-detect=false"
          echo "org.gradle.java.installations.auto-download=false"
          echo "org.gradle.java.installations.paths=$toolchain_paths"
        } >> "$GRADLE_USER_HOME/gradle.properties"

    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@v4

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
