name: Release RC

on:
  push:
    branches: [next]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coordination-release-rc
  cancel-in-progress: false

jobs:
  release:
    if: >-
      ${{ github.ref == 'refs/heads/next'
        && !startsWith(github.event.head_commit.message || '', 'chore: release ') }}
    runs-on: ubuntu-24.04
    env:
      CI: true
      ORG_GRADLE_PROJECT_testMaxParallelForks: '4'
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_PAT }}

      - name: Configure Gradle user home
        run: echo "GRADLE_USER_HOME=$RUNNER_TEMP/coordination-release-gradle" >> "$GITHUB_ENV"

      - name: Fetch base and tags
        run: git fetch origin main:refs/remotes/origin/main --tags

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17.0.19+10'
          architecture: x64
          check-latest: false

      - name: Set up Java 21 test JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21.0.11+10.0.LTS'
          architecture: x64
          check-latest: false

      - name: Restrict Gradle to the pinned JDKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GRADLE_USER_HOME"
          {
            echo "org.gradle.java.installations.auto-detect=false"
            echo "org.gradle.java.installations.auto-download=false"
            echo "org.gradle.java.installations.paths=$JAVA_HOME_17_X64,$JAVA_HOME_21_X64"
          } >> "$GRADLE_USER_HOME/gradle.properties"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify release automation
        run: node --test .github/scripts/*.test.js

      - name: Require release credentials
        shell: bash
        env:
          WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
          MAVENCENTRAL_USERNAME: ${{ secrets.MAVENCENTRAL_USERNAME }}
          MAVENCENTRAL_PASSWORD: ${{ secrets.MAVENCENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
        run: |
          set -euo pipefail
          for name in WORKFLOW_PAT MAVENCENTRAL_USERNAME \
              MAVENCENTRAL_PASSWORD GPG_PASSPHRASE \
              GPG_PUBLIC_KEY GPG_SECRET_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required release secret ${name} is missing"
              exit 1
            fi
          done

      - name: Configure release identity
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Prepare RC version
        id: version
        run: node .github/scripts/prepare-rc-release.js

      - name: Commit and tag RC version
        run: |
          if ! git diff --quiet -- .cz.toml; then
            git add .cz.toml
            git commit -m "chore: release ${{ steps.version.outputs.version }}"
          fi
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release ${{ steps.version.outputs.version }}"

      - name: Verify release ref permissions
        run: >-
          git push --dry-run --no-follow-tags origin HEAD:refs/heads/next
          "v${{ steps.version.outputs.version }}"

      - name: Verify published dependency availability
        run: |
          set -euo pipefail
          ./gradlew --no-daemon dependencyPreflight \
            -PblueDependencyMode=published-artifact

      - name: Verify the Java 21 release gate
        run: >-
          ./gradlew --no-daemon --no-build-cache clean releaseCheck
          -PblueDependencyMode=published-artifact
          -PtestJavaVersion=21

      - name: Build and stage from published dependencies
        run: |
          set -euo pipefail
          JAVA_HOME="$JAVA_HOME_17_X64" \
            ./gradlew --no-daemon --no-build-cache clean stageRelease \
            -PblueDependencyMode=published-artifact \
            -PtestJavaVersion=17

      - name: Push verified release commit
        run: git push --no-follow-tags origin HEAD:refs/heads/next

      - name: Publish to Maven Central
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.MAVENCENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.MAVENCENTRAL_PASSWORD }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
          JRELEASER_REPRODUCIBLE: true
        run: |
          set -euo pipefail
          JAVA_HOME="$JAVA_HOME_17_X64" \
            ./gradlew --no-daemon --no-build-cache jreleaserDeploy \
            -PblueDependencyMode=published-artifact \
            -PtestJavaVersion=17

      - name: Push published release tag
        run: git push --no-follow-tags origin "refs/tags/v${{ steps.version.outputs.version }}"

      - name: Archive release evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coordination-rc-release
          path: |
            build/libs/**
            build/distributions/**
            build/publications/**
            build/reports/**
            build/test-results/**
            build/rooted-evidence/**
            build/staging-deploy/**
            build/jreleaser/**
