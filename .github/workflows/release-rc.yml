name: Release RC

on:
  push:
    branches: [next]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: >-
    ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message || '', 'chore: release ') && format('coordination-release-rc-skip-{0}', github.run_id) || 'coordination-release-rc' }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      ${{ github.ref == 'refs/heads/next'
        && !startsWith(github.event.head_commit.message || '', 'chore: release ') }}
    uses: ./.github/workflows/release-candidate.yml
    with:
      channel: rc
    secrets: inherit
