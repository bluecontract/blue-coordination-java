name: Release RC

on:
  push:
    branches: [next]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coordination-release-rc
  cancel-in-progress: false

jobs:
  release:
    if: "${{ !startsWith(github.event.head_commit.message || '', 'chore: release ') }}"
    runs-on: ubuntu-latest
    env:
      CI: true
      GRADLE_USER_HOME: ${{ runner.temp }}/coordination-release-gradle
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_PAT }}

      - name: Fetch base and tags
        run: git fetch origin main:refs/remotes/origin/main --tags

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure release identity
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Prepare RC version
        id: version
        run: node .github/scripts/prepare-rc-release.js

      - name: Commit and tag RC version
        run: |
          if ! git diff --quiet -- .cz.toml; then
            git add .cz.toml
            git commit -m "chore: release ${{ steps.version.outputs.version }}"
          fi
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release ${{ steps.version.outputs.version }}"

      - name: Verify published dependency availability
        run: |
          set -euo pipefail
          ./gradlew --no-daemon dependencyPreflight \
            -PblueDependencyMode=published-artifact

      - name: Build and stage from published dependencies
        run: >-
          ./gradlew --no-daemon clean stageRelease
          -PblueDependencyMode=published-artifact

      - name: Publish to Maven Central
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.MAVENCENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.MAVENCENTRAL_PASSWORD }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
          JRELEASER_REPRODUCIBLE: true
        run: >-
          ./gradlew --no-daemon jreleaserDeploy
          -PblueDependencyMode=published-artifact

      - name: Push release commit and tag
        run: git push origin HEAD:next --follow-tags

      - name: Archive release evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coordination-rc-release
          path: |
            build/libs/**
            build/publications/**
            build/reports/**
            build/test-results/**
            build/staging-deploy/**
            build/jreleaser/**
