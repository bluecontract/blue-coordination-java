name: RC verification timing experiment (no publication)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: coordination-rc-timing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    if: github.ref == 'refs/heads/codex/ci/coordination-release-experiment'
    name: ${{ matrix.lane }} / Java ${{ matrix.java }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        lane: [baseline, core, archive]
        java: ['25']
    env:
      CI: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
      EXPERIMENT_LANE: ${{ matrix.lane }}
      ORG_GRADLE_PROJECT_testMaxParallelForks: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin toolchains and isolate Gradle state
        env:
          TEST_JAVA: ${{ matrix.java }}
        run: |
          set -euo pipefail
          gradle_home="$RUNNER_TEMP/coordination-experiment-gradle"
          mkdir -p "$gradle_home"
          test "$TEST_JAVA" = "25"
          paths="$JAVA_HOME_25_X64"
          {
            echo 'org.gradle.java.installations.auto-detect=false'
            echo 'org.gradle.java.installations.auto-download=false'
            echo "org.gradle.java.installations.paths=$paths"
          } > "$gradle_home/gradle.properties"
          echo "GRADLE_USER_HOME=$gradle_home" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - uses: gradle/actions/wrapper-validation@v4
      - name: Bootstrap Gradle before timing
        run: |
          for attempt in 1 2 3; do
            if ./gradlew --version; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Verify experiment and release tooling
        run: |
          python3 -m unittest discover -s .github/scripts -p test_ci_release_experiment.py
          node --test .github/scripts/*.test.js
      - name: Measure complete verification lane
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_JAVA: ${{ matrix.java }}
        run: python3 .github/scripts/ci-release-experiment.py measure "$EXPERIMENT_LANE" "$TEST_JAVA" "$RUNNER_TEMP/coordination-timing-output"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coordination-timing-${{ github.run_attempt }}-${{ matrix.lane }}-${{ matrix.java }}
          path: ${{ runner.temp }}/coordination-timing-output/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coordination-reports-${{ github.run_attempt }}-${{ matrix.lane }}-${{ matrix.java }}
          path: |
            build/reports/**
            build/test-results/**
            build/rooted-evidence/**
            build/staging-deploy/**
          if-no-files-found: warn

  compare:
    name: Verify coverage and compare complete RC gates
    needs: measure
    if: always() && github.ref == 'refs/heads/codex/ci/coordination-release-experiment'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: coordination-timing-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/coordination-timing-artifacts
      - name: Reject incomplete evidence and compare
        run: python3 .github/scripts/ci-release-experiment.py compare "$RUNNER_TEMP/coordination-timing-artifacts"
