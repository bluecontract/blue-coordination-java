name: Release stable

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coordination-release-stable
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/release-candidate.yml
    with:
      channel: stable
    secrets: inherit
