name: Release stable

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coordination-release-stable
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Gradle user home
        run: echo "GRADLE_USER_HOME=$RUNNER_TEMP/coordination-release-gradle" >> "$GITHUB_ENV"

      - name: Require main and a stable version
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' .cz.toml)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify published dependency availability
        run: >-
          ./gradlew --no-daemon dependencyPreflight
          -PblueDependencyMode=published-artifact

      - name: Build and stage from published dependencies
        run: >-
          ./gradlew --no-daemon clean stageRelease
          -PblueDependencyMode=published-artifact

      - name: Publish to Maven Central
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.MAVENCENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.MAVENCENTRAL_PASSWORD }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
          JRELEASER_REPRODUCIBLE: true
        run: >-
          ./gradlew --no-daemon jreleaserDeploy
          -PblueDependencyMode=published-artifact

      - name: Archive release evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coordination-stable-release
          path: |
            build/libs/**
            build/distributions/**
            build/publications/**
            build/reports/**
            build/test-results/**
            build/staging-deploy/**
            build/jreleaser/**
