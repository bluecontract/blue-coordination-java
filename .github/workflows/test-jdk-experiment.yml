name: Experimental test JDK comparison

on:
  push:
    branches: [codex/ci/coordination-test-jdk25-experiment]

permissions:
  contents: read

jobs:
  tests:
    name: Compiler 17 / tests ${{ matrix.java }} / 2x2
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '25']
    env:
      CI: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
      BENCHMARK_JAVA: ${{ matrix.java }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/wrapper-validation@v4
      - name: Pin daemon and compiler 17, expose both test runtimes
        shell: bash
        run: |
          set -euo pipefail
          test "$JAVA_HOME" = "$JAVA_HOME_17_X64"
          export GRADLE_USER_HOME="$RUNNER_TEMP/benchmark-gradle"
          echo "GRADLE_USER_HOME=$GRADLE_USER_HOME" >> "$GITHUB_ENV"
          mkdir -p "$GRADLE_USER_HOME"
          {
            echo "org.gradle.java.home=$JAVA_HOME_17_X64"
            echo "org.gradle.java.installations.auto-detect=false"
            echo "org.gradle.java.installations.auto-download=false"
            echo "org.gradle.java.installations.paths=$JAVA_HOME_17_X64,$JAVA_HOME_25_X64"
          } > "$GRADLE_USER_HOME/gradle.properties"
      - name: Run the complete test inventory without publication
        run: python3 .github/scripts/test-jdk-experiment.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-jdk-${{ matrix.java }}-${{ github.run_attempt }}
          path: |
            benchmark-output/
            build/test-results/**/*.xml
            build/reports/test-execution-scope/**
            build/reports/topology-identity-evidence/**
          if-no-files-found: error
