name: Build and validate

on:
  push:
    branches:
      - main
      - next
      - 'feature/**'
      - 'fix/**'
      - 'hotfix/**'
      - 'release/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coordination-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Java ${{ matrix.test-java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test-java: ['17', '21']
    env:
      CI: true
    defaults:
      run:
        working-directory: blue-coordination-java
    steps:
      - name: Check out Coordination
        uses: actions/checkout@v4
        with:
          path: blue-coordination-java
          fetch-depth: 0

      - name: Configure Gradle user home
        run: echo "GRADLE_USER_HOME=$RUNNER_TEMP/coordination-gradle-${{ matrix.test-java }}" >> "$GITHUB_ENV"

      - name: Set up test JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.test-java }}

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Verify release-version selection
        run: node --test .github/scripts/prepare-rc-release.test.js

      - name: Verify published dependency availability
        run: >-
          ./gradlew --no-daemon dependencyPreflight
          -PblueDependencyMode=published-artifact

      - name: Run clean RC verification
        run: >-
          ./gradlew --no-daemon clean releaseCheck
          -PblueDependencyMode=published-artifact
          -PtestJavaVersion=${{ matrix.test-java }}

      - name: Archive verification evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coordination-java-${{ matrix.test-java }}-evidence
          path: |
            blue-coordination-java/build/libs/**
            blue-coordination-java/build/publications/**
            blue-coordination-java/build/reports/**
            blue-coordination-java/build/test-results/**
            blue-coordination-java/build/staging-deploy/**
