name: Build and validate

on:
  # Pushes to next are verified by Release RC; keep PR validation below.
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'hotfix/**'
      - 'release/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: coordination-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    uses: ./.github/workflows/prepare-verification-source.yml

  verify:
    name: Java 17 verification
    needs: prepare
    uses: ./.github/workflows/verification.yml
    with:
      commit: ${{ needs.prepare.outputs.commit }}
      version: ${{ needs.prepare.outputs.version }}
      bundle-sha: ${{ needs.prepare.outputs.bundle-sha }}
      source-artifact: coordination-verification-source
      scope: build
      channel: build
