name: Build and validate

on:
  push:
    branches:
      - main
      - next
      - 'feature/**'
      - 'fix/**'
      - 'hotfix/**'
      - 'release/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coordination-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Java 25
    runs-on: ubuntu-24.04
    env:
      CI: true
      ORG_GRADLE_PROJECT_testMaxParallelForks: '4'
    defaults:
      run:
        working-directory: blue-coordination-java
    steps:
      - name: Check out Coordination
        uses: actions/checkout@v4
        with:
          path: blue-coordination-java
          fetch-depth: 0

      - name: Configure Gradle user home
        run: echo "GRADLE_USER_HOME=$RUNNER_TEMP/coordination-gradle-25" >> "$GITHUB_ENV"

      - name: Set up canonical build JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          architecture: x64
          check-latest: false

      - name: Restrict Gradle to the pinned JDKs
        shell: bash
        run: |
          set -euo pipefail
          toolchain_paths="$JAVA_HOME_25_X64"
          mkdir -p "$GRADLE_USER_HOME"
          {
            echo "org.gradle.java.installations.auto-detect=false"
            echo "org.gradle.java.installations.auto-download=false"
            echo "org.gradle.java.installations.paths=$toolchain_paths"
          } >> "$GRADLE_USER_HOME/gradle.properties"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Verify release automation
        run: node --test .github/scripts/*.test.js

      - name: Prepare RC version for verification
        # Release commits on next already contain the version being verified.
        if: >-
          ${{ !(github.event_name == 'push'
            && github.ref == 'refs/heads/next'
            && startsWith(github.event.head_commit.message || '', 'chore: release ')) }}
        run: node .github/scripts/prepare-rc-release.js

      - name: Seal prepared RC verification worktree
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- .cz.toml; then
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git add .cz.toml
            git commit -m "chore: prepare RC verification"
          fi
          test -z "$(git status --porcelain)"

      - name: Verify published dependency availability
        run: >-
          ./gradlew --no-daemon dependencyPreflight
          -PblueDependencyMode=published-artifact

      - name: Run clean RC verification
        run: >-
          ./gradlew --no-daemon --no-build-cache clean releaseCheck
          -PblueDependencyMode=published-artifact
          -PtestJavaVersion=25

      - name: Verify RC staging readiness
        run: >-
          ./gradlew --no-daemon --no-build-cache verifyRcReadiness
          -PblueDependencyMode=published-artifact
          -PtestJavaVersion=25

      - name: Archive verification evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coordination-java-25-evidence
          path: |
            blue-coordination-java/build/libs/**
            blue-coordination-java/build/publications/**
            blue-coordination-java/build/reports/**
            blue-coordination-java/build/test-results/**
            blue-coordination-java/build/rooted-evidence/**
            blue-coordination-java/build/staging-deploy/**
