schedule: blue-coordination/host-quotas/1.0
status: nonportable-diagnostic
portableProcessGas: false
description: Projection, splitter, indexed-planning, and Mandate host work occur outside PROCESS and never contribute to the portable process gas trace.
counters:
- name: splitterCatalogEntryVisited
  unit: one effective fragmentation-catalog entry inspected
- name: splitterFragmentAdmitted
  unit: one exact ordinary Blue fragment admitted
- name: splitterCutValidated
  unit: one declared split boundary validated
- name: mandatePredicateEvaluated
  unit: one feeder/provider Mandate eligibility guard evaluated
- name: responderMandateCandidateTested
  unit: one provider-side Document Responder Mandate candidate tested
- name: subscriptionOccurrenceProjected
  unit: one immutable subscription occurrence admitted
- name: indexedCandidateValidated
  unit: one caller-supplied indexed candidate inspected
- name: prefetchIdentityConstructed
  unit: one unique deterministic prefetch identity admitted
- name: fragmentEdgeMetadataProduced
  unit: one canonical fragment edge occurrence admitted
limits:
  maxSplitterCuts: 16384
  maxMandateCandidatesPerDecision: 4096
  maxSplitterCatalogEntriesPerSplit: 65536
  maxSplitterFragmentsPerSplit: 65536
  maxFragmentEdgeOccurrencesPerSplit: 262144
  maxSubscriptionOccurrencesPerProjection: 65536
  maxIndexedCandidatesPerPlan: 65536
  maxPrefetchIdentitiesPerPlan: 65536
