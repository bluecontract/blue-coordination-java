documentId: nba-lifecycle-game
name: NBA Lifecycle Game
status: Scheduled
homeTeam: MIN
awayTeam: LAL
homeScore: 0
awayScore: 0
playCount: 0
initializationCount: 0
contracts:
  lifecycleChannel:
    type:
      blueId: 2ukJitzzDKQWHJ5EVUtn3t4FXieGmNA1NdwFSqG8qcfo
    order: 0
    event:
      type:
        blueId: Gck5z8qnbcUvJNkawzKPghj14dJBw8GxkC9mh6cL5e5C
  onProcessingInitiated:
    type: Coordination/Sequential Workflow
    channel: lifecycleChannel
    order: 0
    steps:
      - type: Coordination/Compute
        do:
          - $appendChange:
              op: replace
              path: /initializationCount
              val: {$add: [$document: /initializationCount, 1]}
          - $appendEvent:
              type: Coordination/Event
              kind: NBA/Game Initialized
              gameDocumentId: {$document: /documentId}
          - $return: true
  gameFeed:
    type: Coordination/Timeline Channel
    timeline:
      type: MyOS/MyOS Timeline
      timelineId: examples/round12/nba/game
    actor:
      type: MyOS/Principal Actor
      accountId: nba-feed
  startGame:
    type: Coordination/Sequential Workflow Operation
    channel: gameFeed
    request: {}
    steps:
      - type: Coordination/Compute
        do:
          - $appendChange: {op: replace, path: /status, val: Live}
          - $appendEvent:
              type: Coordination/Event
              kind: NBA/Game Started
          - $return: true
  homeScores:
    type: Coordination/Sequential Workflow Operation
    channel: gameFeed
    request:
      points: {type: Integer}
    steps:
      - type: Coordination/Compute
        do:
          - $appendChange:
              op: replace
              path: /homeScore
              val: {$add: [$document: /homeScore, $binding: event/message/request/points]}
          - $appendChange:
              op: replace
              path: /playCount
              val: {$add: [$document: /playCount, 1]}
          - $appendEvent:
              type: Coordination/Event
              kind: NBA/Scoring Play
              team: MIN
              points: {$binding: event/message/request/points}
          - $return: true
  awayScores:
    type: Coordination/Sequential Workflow Operation
    channel: gameFeed
    request:
      points: {type: Integer}
    steps:
      - type: Coordination/Compute
        do:
          - $appendChange:
              op: replace
              path: /awayScore
              val: {$add: [$document: /awayScore, $binding: event/message/request/points]}
          - $appendChange:
              op: replace
              path: /playCount
              val: {$add: [$document: /playCount, 1]}
          - $appendEvent:
              type: Coordination/Event
              kind: NBA/Scoring Play
              team: LAL
              points: {$binding: event/message/request/points}
          - $return: true
  endGame:
    type: Coordination/Sequential Workflow Operation
    channel: gameFeed
    request: {}
    steps:
      - type: Coordination/Compute
        do:
          - $appendChange: {op: replace, path: /status, val: Final}
          - $appendEvent:
              type: Coordination/Event
              kind: NBA/Game Ended
              gameDocumentId: {$document: /documentId}
              homeScore: {$document: /homeScore}
              awayScore: {$document: /awayScore}
          - $return: true
