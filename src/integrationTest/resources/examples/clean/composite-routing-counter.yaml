documentId: composite-routing-counter
name: Composite Routing Counter
counter: 0
contracts:
  aliceChannel:
    type: Coordination/Timeline Channel
    timeline:
      type: MyOS/MyOS Timeline
      timelineId: examples/routing/alice
    actor:
      type: MyOS/Principal Actor
      accountId: alice
  bobChannel:
    type: Coordination/Timeline Channel
    timeline:
      type: MyOS/MyOS Timeline
      timelineId: examples/routing/bob
    actor:
      type: MyOS/Principal Actor
      accountId: bob
  aggregateChannel:
    type: Coordination/Composite Timeline Channel
    channels:
      - aliceChannel
      - bobChannel
  add:
    type: Coordination/Sequential Workflow Operation
    channel: aggregateChannel
    request:
      amount: {type: Integer}
    steps:
      - type: Coordination/Compute
        do:
          - $appendChange:
              op: replace
              path: /counter
              val:
                $add:
                  - $document: /counter
                  - $binding: event/message/request/amount
          - $return: true
