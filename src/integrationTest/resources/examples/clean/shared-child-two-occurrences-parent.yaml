documentId: shared-child-two-occurrences-parent
name: Shared Child Two Occurrences Parent
contracts:
  ownerChannel:
    type: Coordination/Timeline Channel
    timeline:
      type: MyOS/MyOS Timeline
      timelineId: examples/embedded/two-occurrences-parent
    actor:
      type: MyOS/Principal Actor
      accountId: bob
  coordinationEmbeddedChannel:
    type: Coordination/Timeline Channel
    timeline:
      type: MyOS/MyOS Timeline
      timelineId: coordination/internal/shared-child-two-occurrences-parent
    actor:
      type: MyOS/Principal Actor
      accountId: coordination
  embedded:
    type: Process Embedded
    paths: [/left, /right]
  attachTwice:
    type: Coordination/Sequential Workflow Operation
    channel: ownerChannel
    request:
      document:
        documentId: {type: Text}
    steps:
      - type: Coordination/Compute
        do:
          - $appendChange:
              op: add
              path: /left
              val: {$binding: event/message/request/document}
          - $appendChange:
              op: add
              path: /right
              val: {$binding: event/message/request/document}
          - $return: true
  coordinationApplyEmbeddedRevision:
    type: Coordination/Sequential Workflow Operation
    channel: coordinationEmbeddedChannel
    request:
      occurrencePath: {type: Text}
      after:
        documentId: {type: Text}
    steps:
      - type: Coordination/Compute
        do:
          - $appendChange:
              op: replace
              path: {$binding: event/message/request/occurrencePath}
              val: {$binding: event/message/request/after}
          - $return: true
