documentId: embedded-collection-parent
name: Embedded Collection Parent
ordinaryPayload:
  summary: retained inline
  nested:
    value: 42
games: {}
contracts:
  ownerChannel:
    type: Coordination/Timeline Channel
    timeline:
      type: MyOS/MyOS Timeline
      timelineId: examples/embedded/collection-parent
    actor:
      type: MyOS/Principal Actor
      accountId: bob
  coordinationEmbeddedChannel:
    type: Coordination/Timeline Channel
    timeline:
      type: MyOS/MyOS Timeline
      timelineId: coordination/internal/embedded-collection-parent
    actor:
      type: MyOS/Principal Actor
      accountId: coordination
  embedded:
    type: Process Embedded
    collectionPaths: [/games]
  attachGameA:
    type: Coordination/Sequential Workflow Operation
    channel: ownerChannel
    request:
      document:
        documentId: {type: Text}
    steps:
      - type: Coordination/Compute
        do:
          - $appendChange:
              op: add
              path: /games/game-a
              val: {$binding: event/message/request/document}
          - $return: true
  attachEscapedGame:
    type: Coordination/Sequential Workflow Operation
    channel: ownerChannel
    request:
      document:
        documentId: {type: Text}
    steps:
      - type: Coordination/Compute
        do:
          - $appendChange:
              op: add
              path: /games/game~1a~0b
              val: {$binding: event/message/request/document}
          - $return: true
  removeGameA:
    type: Coordination/Sequential Workflow Operation
    channel: ownerChannel
    request: {}
    steps:
      - type: Coordination/Compute
        do:
          - $appendChange: {op: remove, path: /games/game-a}
          - $return: true
  coordinationApplyEmbeddedRevision:
    type: Coordination/Sequential Workflow Operation
    channel: coordinationEmbeddedChannel
    request:
      occurrencePath: {type: Text}
      after:
        documentId: {type: Text}
    steps:
      - type: Coordination/Compute
        do:
          - $appendChange:
              op: replace
              path: {$binding: event/message/request/occurrencePath}
              val: {$binding: event/message/request/after}
          - $return: true
