contracts:
  ownerChannel:
    type: Coordination/Timeline Channel
    timeline:
      type: MyOS/MyOS Timeline
      timelineId: examples/large-order/alice
    actor:
      type: MyOS/Principal Actor
      accountId: alice
  merchantChannel:
    type: Coordination/Timeline Channel
    timeline:
      type: MyOS/MyOS Timeline
      timelineId: examples/large-order/bob
    actor:
      type: MyOS/Principal Actor
      accountId: bob
  coordinationEmbeddedChannel:
    type: Coordination/Timeline Channel
    timeline:
      type: MyOS/MyOS Timeline
      timelineId: coordination/internal/large-order-host
    actor:
      type: MyOS/Principal Actor
      accountId: coordination
  embedded:
    type: Process Embedded
    paths: [/payNote]
  attachPayNote:
    type: Coordination/Sequential Workflow Operation
    channel: ownerChannel
    request:
      document:
        documentId: {type: Text}
    steps:
      - type: Coordination/Compute
        do:
          - $appendChange:
              op: add
              path: /payNote
              val: {$binding: event/message/request/document}
          - $appendChange: {op: replace, path: /hostStatus, val: PayNote Attached}
          - $appendChange:
              op: replace
              path: /hostOperationCount
              val: {$add: [$document: /hostOperationCount, 1]}
          - $return: true
  touchHost:
    type: Coordination/Sequential Workflow Operation
    channel: merchantChannel
    request:
      note: {type: Text}
    steps:
      - type: Coordination/Compute
        do:
          - $appendChange:
              op: replace
              path: /hostRevision
              val: {$add: [$document: /hostRevision, 1]}
          - $appendChange:
              op: replace
              path: /hostOperationCount
              val: {$add: [$document: /hostOperationCount, 1]}
          - $appendChange: {op: replace, path: /hostStatus, val: Host Updated}
          - $return: true
  coordinationApplyEmbeddedRevision:
    type: Coordination/Sequential Workflow Operation
    channel: coordinationEmbeddedChannel
    request:
      childDocumentId: {type: Text}
      childEpoch: {type: Integer}
      after:
        documentId: {type: Text}
    steps:
      - type: Coordination/Compute
        do:
          - $appendChange:
              op: replace
              path: /payNote
              val: {$binding: event/message/request/after}
          - $appendChange:
              op: replace
              path: /observedPayNoteStatus
              val: {$binding: event/message/request/after/status}
          - $appendChange:
              op: replace
              path: /observedAuthorizationCount
              val: {$binding: event/message/request/after/authorizationCountState}
          - $appendChange:
              op: replace
              path: /payNoteRevisionCount
              val: {$add: [$document: /payNoteRevisionCount, 1]}
          - $return: true
  unrelatedWorkflow01:
    type: Coordination/Sequential Workflow Operation
    channel: merchantChannel
    request: {}
    steps:
      - type: Coordination/Compute
        do:
