name: Chronology observer A
counterB: Unset
observed: Unset
contracts:
  ownerChannel:
    type: Coordination/Timeline Channel
    timeline:
      type: MyOS/MyOS Timeline
      timelineId: poc/chronology/a
    actor:
      type: MyOS/Principal Actor
      accountId: alice
  embedded:
    type: Process Embedded
    paths: [/child]
  attach:
    type: Coordination/Sequential Workflow Operation
    channel: ownerChannel
    request:
      child: {}
    steps:
      - type: Coordination/Compute
        do:
          - $appendChange:
              op: add
              path: /child
              val: {$binding: event/message/request/child}
          - $return: true
  fromChild:
    type: Embedded Node Channel
    sourcePath: /child
    event:
      type: Coordination/Event
      kind: Chronology/Counter Changed
  reflectChild:
    type: Coordination/Sequential Workflow
    channel: fromChild
    event:
      type: Coordination/Event
      kind: Chronology/Counter Changed
    steps:
      - type: Coordination/Compute
        do:
          - $appendChange:
              op: replace
              path: /counterB
              val: {$document: /child/counter}
          - $return: true
  observe:
    type: Coordination/Sequential Workflow Operation
    channel: ownerChannel
    request: {}
    steps:
      - type: Coordination/Compute
        do:
          - $appendChange:
              op: replace
              path: /observed
              val: {$document: /counterB}
          - $return: true
