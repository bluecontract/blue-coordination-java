pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'blue-coordination-staged-sdk-consumer'

def stagedRepository = providers.gradleProperty('stagedRepository').orNull
if (stagedRepository == null || stagedRepository.isBlank()) {
    throw new GradleException(
            'The extracted SDK consumer requires '
                    + '-PstagedRepository=/absolute/path')
}
def stagedRepositoryPath = new File(stagedRepository)
if (!stagedRepositoryPath.isAbsolute()) {
    throw new GradleException('stagedRepository must be an absolute path')
}
def stagedRepositoryDirectory = stagedRepositoryPath.canonicalFile
if (!stagedRepositoryDirectory.isDirectory()) {
    throw new GradleException(
            'stagedRepository is not a Maven repository: '
                    + stagedRepositoryDirectory)
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        exclusiveContent {
            forRepository {
                maven {
                    name = 'stagedBlueRepository'
                    url = stagedRepositoryDirectory.toURI()
                    metadataSources {
                        gradleMetadata()
                        mavenPom()
                        artifact()
                    }
                }
            }
            filter {
                includeGroup 'blue.coordination'
                includeGroup 'blue.language'
                includeGroup 'blue.repo'
                includeGroup 'blue.bex'
            }
        }
        mavenCentral()
    }
}
