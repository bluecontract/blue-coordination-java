plugins {
    id 'application'
}

group = 'blue.coordination.consumer'
version = '1.0.0'

def coordinationVersion = providers.gradleProperty(
        'coordinationVersion').getOrElse('3.0.0-rc.2')
def testJavaVersion = providers.gradleProperty(
        'testJavaVersion').getOrElse('17') as int
def stagedRepository = file(providers.gradleProperty(
        'stagedRepository').get()).canonicalFile
def consumerReport = file(providers.gradleProperty(
        'consumerReport').getOrElse(
        layout.buildDirectory.file('reports/sdk-consumer.json')
                .get().asFile.absolutePath))

if (coordinationVersion != '3.0.0-rc.2') {
    throw new GradleException(
            'The SDK freeze consumer is pinned to 3.0.0-rc.2')
}
if (!(testJavaVersion in [17, 21])) {
    throw new GradleException(
            'The SDK freeze consumer supports only Java 17 or Java 21')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(testJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.compilerArgs.addAll(['-Xlint:all', '-Werror'])
}

dependencies {
    implementation "blue.coordination:blue-coordination-java:${coordinationVersion}"
}

application {
    mainClass = 'blue.coordination.consumer.StagedSdkConsumer'
}

def expectedBlueCoordinates = [
        'blue.coordination:blue-coordination-java': coordinationVersion,
        'blue.language:blue-language-model': '3.1.0-rc.20',
        'blue.language:blue-language-core': '3.1.0-rc.20',
        'blue.language:blue-language-mapping': '3.1.0-rc.20',
        'blue.language:blue-language-ipfs': '3.1.0-rc.20',
        'blue.language:blue-language-java': '3.1.0-rc.20',
        'blue.language:blue-contracts-core': '3.1.0-rc.20',
        'blue.repo:blue-repo-java': '3.0.0-rc.21',
        'blue.bex:blue-bex-core': '1.1.0-rc.3',
        'blue.bex:blue-bex-contracts': '1.1.0-rc.3'
]

def verifyGraph = tasks.register('verifyStagedSdkConsumerGraph') {
    group = 'verification'
    description = 'Proves the extracted consumer resolves only the exact staged Blue graph.'
    inputs.files('settings.gradle', 'build.gradle')
    inputs.property('coordinationVersion', coordinationVersion)
    outputs.upToDateWhen { false }
    doLast {
        def failures = []
        String settingsScript = file('settings.gradle').getText('UTF-8')
        String localRepositoryCall = 'maven' + 'Local()'
        String compositeBuildCall = 'include' + 'Build('
        if (settingsScript.contains(localRepositoryCall)
                || settingsScript.contains(compositeBuildCall)) {
            failures << 'consumer settings permit a local user repository or composite build'
        }
        def components = configurations.runtimeClasspath
                .incoming.resolutionResult.allComponents
        def leakedProjects = components.findAll { component ->
            component.id instanceof
                    org.gradle.api.artifacts.component.ProjectComponentIdentifier
                    && component.id.projectPath != ':'
        }.collect { component -> component.id.displayName }.sort()
        if (!leakedProjects.empty) {
            failures << "project substitution leaked into consumer graph: ${leakedProjects}"
        }
        def selectedBlue = components.findAll { component ->
            component.id instanceof
                    org.gradle.api.artifacts.component.ModuleComponentIdentifier
                    && ['blue.coordination', 'blue.language',
                        'blue.repo', 'blue.bex'].contains(component.id.group)
        }.collectEntries { component ->
            [(component.id.group + ':' + component.id.module):
                     component.id.version]
        }
        def missing = (expectedBlueCoordinates.keySet()
                - selectedBlue.keySet())
        def unexpected = (selectedBlue.keySet()
                - expectedBlueCoordinates.keySet())
        if (!missing.empty) {
            failures << 'missing exact Blue modules ' + missing.sort()
        }
        if (!unexpected.empty) {
            failures << 'unexpected Blue modules ' + unexpected.sort()
        }
        expectedBlueCoordinates.each { coordinate, expectedVersion ->
            if (selectedBlue[coordinate] != null
                    && selectedBlue[coordinate] != expectedVersion) {
                failures << ("${coordinate} resolved "
                        + "${selectedBlue[coordinate]}; expected ${expectedVersion}")
            }
        }
        def snapshots = components.findAll { component ->
            component.id instanceof
                    org.gradle.api.artifacts.component.ModuleComponentIdentifier
                    && component.id.version.toUpperCase(
                    java.util.Locale.ROOT).contains('SNAPSHOT')
        }.collect { component -> component.id.displayName }.sort()
        if (!snapshots.empty) {
            failures << 'snapshot modules resolved: ' + snapshots
        }
        def coordinationArtifact = configurations.runtimeClasspath
                .resolvedConfiguration.resolvedArtifacts.find { artifact ->
            artifact.moduleVersion.id.group == 'blue.coordination'
                    && artifact.name == 'blue-coordination-java'
        }
        if (coordinationArtifact == null
                || coordinationArtifact.moduleVersion.id.version
                != coordinationVersion
                || coordinationArtifact.file.name
                != "blue-coordination-java-${coordinationVersion}.jar") {
            failures << 'consumer did not resolve the exact Coordination candidate JAR'
        }
        if (!failures.empty) {
            throw new GradleException(
                    'Extracted SDK consumer graph failed:\n - '
                            + failures.join('\n - '))
        }
    }
}

def runConsumer = tasks.register('runStagedSdkConsumer', JavaExec) {
    group = 'verification'
    description = 'Runs an SDK-only workflow from the staged candidate graph.'
    dependsOn tasks.named('classes'), verifyGraph
    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(testJavaVersion)
    }
    outputs.upToDateWhen { false }
}

tasks.register('verifyStagedSdkConsumer') {
    group = 'verification'
    description = 'Runs the staged SDK consumer and writes a machine-readable receipt.'
    dependsOn runConsumer
    inputs.property('javaVersion', testJavaVersion)
    inputs.property('coordinationVersion', coordinationVersion)
    outputs.file(consumerReport)
    outputs.upToDateWhen { false }
    doLast {
        def coordinationArtifact = configurations.runtimeClasspath
                .resolvedConfiguration.resolvedArtifacts.find { artifact ->
            artifact.moduleVersion.id.group == 'blue.coordination'
                    && artifact.name == 'blue-coordination-java'
        }
        if (coordinationArtifact == null) {
            throw new GradleException('Candidate JAR disappeared after execution')
        }
        String jarSha256 = java.security.MessageDigest
                .getInstance('SHA-256')
                .digest(coordinationArtifact.file.bytes)
                .encodeHex().toString()
        consumerReport.parentFile.mkdirs()
        consumerReport.setText(groovy.json.JsonOutput.prettyPrint(
                groovy.json.JsonOutput.toJson([
                        schemaId: 'blue-coordination-sdk-consumer-v1',
                        status: 'PASS',
                        dependencyMode: 'staged-artifact',
                        coordination: "blue.coordination:blue-coordination-java:${coordinationVersion}",
                        candidateJarSha256: jarSha256,
                        javaRuntime: testJavaVersion,
                        javaRelease: 17,
                        repository: stagedRepository.absolutePath,
                        blueGraph: expectedBlueCoordinates
                ])) + '\n', 'UTF-8')
    }
}
