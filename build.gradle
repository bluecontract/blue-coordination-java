    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifact tasks.named('testFixturesJar')
            pom {
                name = 'Blue Coordination Java'
                description = 'Deterministic whole-object document coordination runtime.'
                url = 'https://github.com/bluecontract/blue-coordination-java'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/license/mit'
                    }
                }
                developers {
                    developer {
                        name = 'Blue'
                        email = 'devsupport@timeline.blue'
                        organization = 'Blue Company'
                    }
                }
                scm {
                    url = 'https://github.com/bluecontract/blue-coordination-java'
                    connection = 'scm:git:https://github.com/bluecontract/blue-coordination-java.git'
                    developerConnection = 'scm:git:ssh://git@github.com/bluecontract/blue-coordination-java.git'
                }
                issueManagement {
                    system = 'GitHub Issues'
