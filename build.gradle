def coordinationSourceArchive = tasks.register(
        'coordinationSourceArchive', Zip) {
    group = 'distribution'
    description = 'Creates the self-contained Coordination source archive.'
    archiveFileName = "blue-coordination-java-${version}-source.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    includeEmptyDirs = false
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    duplicatesStrategy = org.gradle.api.file.DuplicatesStrategy.FAIL
    into("blue-coordination-java-${version}") {
        from(rootDir) {
            include sourceArchiveIncludes
            exclude sourceArchiveExcludes
            filesMatching('gradlew') { permissions { unix(0755) } }
        }
    }
