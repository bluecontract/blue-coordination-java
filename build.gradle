                    failures << "Duplicate Round 13 evidence surface remains: ${duplicate}"
                }
            }
            if (!failures.empty) {
                throw new GradleException(failures.join('\n'))
            }
            return
        }
        if (evidence.schemaVersion == '3.0.0'
