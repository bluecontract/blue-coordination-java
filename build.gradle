    nestedFile.withInputStream {
        nested.load(it)
    }
    def expectedGraph = [
            configuration:
                    'runtimeClasspath',
            remoteBlueModuleCount:
                    '0',
            schema:
                    'blue.coordination/local-composite-dependency-graph/1.0',
            selectedBlueComponentCount:
                    '3',
            status:
                    'verified',
            'selected.language.buildPath':
                    ':blue-language-java',
            'selected.language.buildTreePath':
                    ':blue-language-java',
            'selected.language.coordinate':
                    'blue.language:blue-language-java:'.concat(
                            effectiveLocalProjectVersion(
                                    blueLanguageVersion)),
            'selected.language.projectPath':
                    ':',
            'selected.language.type':
                    'project',
            'selected.bex.buildPath':
                    ':blue-bex-java',
            'selected.bex.buildTreePath':
                    ':blue-bex-java',
            'selected.bex.coordinate':
                    'blue.bex:blue-bex-java:'.concat(
                            effectiveLocalProjectVersion(
                                    blueBexVersion)),
            'selected.bex.projectPath':
                    ':',
            'selected.bex.type':
                    'project',
            'selected.repository.buildPath':
                    ':blue-repository-java',
            'selected.repository.buildTreePath':
                    ':blue-repository-java',
            'selected.repository.coordinate':
                    'blue.repo:blue-repo-java:'.concat(
                            effectiveLocalProjectVersion(
                                    blueRepositoryVersion)),
            'selected.repository.projectPath':
                    ':',
            'selected.repository.type':
                    'project',
            'edge.bexToLanguage.selected.buildPath':
                    ':blue-language-java',
            'edge.bexToLanguage.selected.buildTreePath':
                    ':blue-language-java',
            'edge.bexToLanguage.selected.coordinate':
                    'blue.language:blue-language-java:'.concat(
                            effectiveLocalProjectVersion(
                                    blueLanguageVersion)),
            'edge.bexToLanguage.selected.projectPath':
                    ':',
            'edge.repositoryToLanguage.requested':
                    'blue.language:blue-language-java:3.0.0',
            'edge.repositoryToLanguage.selected.buildPath':
                    ':blue-language-java',
            'edge.repositoryToLanguage.selected.buildTreePath':
                    ':blue-language-java',
            'edge.repositoryToLanguage.selected.coordinate':
                    'blue.language:blue-language-java:'.concat(
                            effectiveLocalProjectVersion(
                                    blueLanguageVersion)),
            'edge.repositoryToLanguage.selected.projectPath':
                    ':'
    ]
    def expectedNested = [
            'consumer.buildPath':
                    ':blue-bex-java',
            'consumer.projectPath':
                    ':',
            'provenance.status':
                    'not-applicable-local-composite',
            schema:
                    'blue.coordination/local-composite-bex-language-edge/1.0',
            'selected.buildPath':
                    ':blue-language-java',
            'selected.buildTreePath':
                    ':blue-language-java',
            'selected.coordinate':
                    'blue.language:blue-language-java:'.concat(
                            effectiveLocalProjectVersion(
                                    blueLanguageVersion)),
            'selected.projectPath':
                    ':',
            status:
                    'verified',
            'validation.sameArtifactAsRoot':
                    'true'
    ]
    String nestedRequest =
            nested.getProperty(
                    'requested.coordinate')
    if (nestedRequest == null
            || !(nestedRequest
            ==~ /blue\.language:blue-language-java:[^:\s]+/)
            || graph.getProperty(
            'edge.bexToLanguage.requested')
            != nestedRequest) {
        throw new GradleException(
                "Normalized BEX-to-Language requested coordinate "
                        + "is inconsistent")
    }
    def expectedGraphKeys =
            new TreeSet<String>(
                    expectedGraph.keySet())
    expectedGraphKeys.add(
            'edge.bexToLanguage.requested')
    if ((graph.keySet() as Set)
            != expectedGraphKeys) {
        throw new GradleException(
                "Local-composite graph evidence has unexpected keys: "
                        + graph.keySet())
    }
    def expectedNestedKeys =
            new TreeSet<String>(
                    expectedNested.keySet())
    expectedNestedKeys.addAll([
            'artifact.bytes',
            'artifact.sha256',
            'requested.coordinate'
    ])
    if ((nested.keySet() as Set)
            != expectedNestedKeys
            || !(nested.getProperty(
            'artifact.bytes')
            ==~ /[1-9][0-9]*/)
            || !(nested.getProperty(
            'artifact.sha256')
            ==~ /[0-9a-f]{64}/)) {
        throw new GradleException(
                "Normalized BEX-to-Language evidence is not exact")
    }
    expectedGraph.each { key, value ->
        if (graph.getProperty(
                key.toString()) != value) {
            throw new GradleException(
                    "Local-composite graph evidence mismatch for "
                            + key + ": "
                            + graph.getProperty(
                            key.toString()))
        }
    }
    expectedNested.each { key, value ->
        if (nested.getProperty(
                key.toString()) != value) {
            throw new GradleException(
                    "Normalized BEX-to-Language evidence mismatch for "
                            + key + ": "
                            + nested.getProperty(
                            key.toString()))
        }
    }
    return [
            graph : graph,
            nested: nested
    ]
}

/*
 * Small deterministic validator for the JSON-Schema vocabulary used by this
 * repository's two release-evidence schemas. Keeping it in the build avoids a
 * network-only validator dependency while still applying the checked-in
 * schemas, rather than merely hashing them.
 */
def validateJsonSchema
validateJsonSchema = {
    Object value, Map schema, Map rootSchema, String location ->
        if (schema.containsKey('$ref')) {
            String reference = schema.get('$ref')
            if (!reference.startsWith('#/')) {
                throw new GradleException(
                        "Unsupported JSON-Schema reference ${reference} "
                                + "at ${location}")
            }
            Object resolved = rootSchema
            reference.substring(2)
                    .split('/')
                    .each { token ->
                        String key = token
                                .replace('~1', '/')
                                .replace('~0', '~')
                        if (!(resolved instanceof Map)
                                || !resolved.containsKey(key)) {
                            throw new GradleException(
                                    "Unresolved JSON-Schema reference "
                                            + reference + " at "
                                            + location)
                        }
                        resolved = resolved.get(key)
                    }
            if (!(resolved instanceof Map)) {
                throw new GradleException(
                        "JSON-Schema reference ${reference} at "
                                + "${location} is not an object")
            }
            validateJsonSchema(
                    value,
                    (Map) resolved,
                    rootSchema,
                    location)
            return
        }

        if (schema.containsKey('allOf')) {
            if (!(schema.allOf instanceof List)) {
                throw new GradleException(
                        "JSON-Schema allOf at ${location} must be an array")
            }
            schema.allOf.eachWithIndex {
                candidate, index ->
                    if (!(candidate instanceof Map)) {
                        throw new GradleException(
                                "JSON-Schema allOf[${index}] at "
                                        + "${location} must be an object")
                    }
                    validateJsonSchema(
                            value,
                            (Map) candidate,
                            rootSchema,
                            location)
            }
        }

        if (schema.containsKey('const')
                && value != schema.get('const')) {
            throw new GradleException(
                    "${location} must equal ${schema.get('const')}, "
                            + "found ${value}")
        }
        if (schema.containsKey('enum')) {
            if (!(schema.get('enum') instanceof List)
                    || !schema.get('enum').contains(value)) {
                throw new GradleException(
                        "${location} must be one of "
                                + schema.get('enum')
                                + ", found ${value}")
            }
        }

        String type = schema.get('type')
        if (type != null) {
            boolean matchesType
            switch (type) {
                case 'object':
                    matchesType = value instanceof Map
                    break
                case 'array':
                    matchesType = value instanceof List
                    break
                case 'string':
                    matchesType = value instanceof String
                    break
                case 'integer':
                    matchesType = value instanceof Number
                            && new BigDecimal(
                                    value.toString())
                                    .stripTrailingZeros()
                                    .scale() <= 0
                    break
                case 'number':
                    matchesType = value instanceof Number
                    break
                case 'boolean':
                    matchesType = value instanceof Boolean
                    break
                case 'null':
                    matchesType = value == null
                    break
                default:
                    throw new GradleException(
                            "Unsupported JSON-Schema type ${type} "
                                    + "at ${location}")
            }
            if (!matchesType) {
                throw new GradleException(
                        "${location} must have JSON type ${type}, "
                                + "found "
                                + (value == null
                                ? 'null'
                                : value.getClass().name))
            }
        }

        if (value instanceof Map) {
            Map object = (Map) value
            if (schema.containsKey('minProperties')
                    && object.size()
                    < ((Number) schema.minProperties)
                            .intValue()) {
                throw new GradleException(
                        "${location} has fewer than "
                                + schema.minProperties
                                + " properties")
            }
            if (schema.containsKey('required')) {
                if (!(schema.required instanceof List)) {
                    throw new GradleException(
                            "JSON-Schema required at ${location} "
                                    + "must be an array")
                }
                def missing = schema.required.findAll {
                    !object.containsKey(it)
                }
                if (!missing.isEmpty()) {
                    throw new GradleException(
                            "${location} is missing required fields "
                                    + missing)
                }
            }
            Map properties = schema.properties instanceof Map
                    ? (Map) schema.properties
                    : Collections.emptyMap()
            object.each { key, child ->
                if (properties.containsKey(key)) {
                    Object childSchema =
                            properties.get(key)
                    if (!(childSchema instanceof Map)) {
                        throw new GradleException(
                                "JSON-Schema property ${key} at "
                                        + "${location} is not an object")
                    }
                    validateJsonSchema(
                            child,
                            (Map) childSchema,
                            rootSchema,
                            "${location}.${key}")
                } else if (schema.additionalProperties == false) {
                    throw new GradleException(
                            "${location} contains unknown field ${key}")
                } else if (schema.additionalProperties
                        instanceof Map) {
                    validateJsonSchema(
                            child,
                            (Map) schema.additionalProperties,
                            rootSchema,
                            "${location}.${key}")
                }
            }
        }

        if (value instanceof List) {
            List array = (List) value
            if (schema.containsKey('minItems')
                    && array.size()
                    < ((Number) schema.minItems)
                            .intValue()) {
                throw new GradleException(
                        "${location} has fewer than "
                                + schema.minItems + " items")
            }
            if (schema.containsKey('maxItems')
                    && array.size()
                    > ((Number) schema.maxItems)
                            .intValue()) {
                throw new GradleException(
                        "${location} has more than "
                                + schema.maxItems + " items")
            }
            if (schema.uniqueItems == true) {
                def identities = array.collect {
                    groovy.json.JsonOutput.toJson(it)
                }
                if ((identities as Set).size()
                        != identities.size()) {
                    throw new GradleException(
                            "${location} contains duplicate items")
                }
            }
            if (schema.items instanceof Map) {
                array.eachWithIndex { child, index ->
                    validateJsonSchema(
                            child,
                            (Map) schema.items,
                            rootSchema,
                            "${location}[${index}]")
                }
            }
        }

        if (value instanceof String) {
            String text = (String) value
            if (schema.containsKey('minLength')
                    && text.length()
                    < ((Number) schema.minLength)
                            .intValue()) {
                throw new GradleException(
                        "${location} is shorter than "
                                + schema.minLength)
            }
            if (schema.containsKey('pattern')
                    && !java.util.regex.Pattern
                    .compile(schema.pattern.toString())
                    .matcher(text)
                    .find()) {
                throw new GradleException(
                        "${location} does not match "
                                + schema.pattern)
            }
        }

        if (value instanceof Number
                && schema.containsKey('minimum')
                && new BigDecimal(value.toString())
                .compareTo(
                        new BigDecimal(
                                schema.minimum.toString()))
                < 0) {
            throw new GradleException(
                    "${location} is below minimum "
                            + schema.minimum)
        }

        if (schema.containsKey('if')) {
            if (!(schema.get('if') instanceof Map)) {
                throw new GradleException(
                        "JSON-Schema if at ${location} "
                                + "must be an object")
            }
            boolean conditionMatches
            try {
                validateJsonSchema(
                        value,
                        (Map) schema.get('if'),
                        rootSchema,
                        location)
                conditionMatches = true
            } catch (GradleException ignored) {
                conditionMatches = false
            }
            if (conditionMatches
                    && schema.get('then') instanceof Map) {
                validateJsonSchema(
                        value,
                        (Map) schema.get('then'),
                        rootSchema,
                        location)
            } else if (!conditionMatches
                    && schema.get('else') instanceof Map) {
                validateJsonSchema(
                        value,
                        (Map) schema.get('else'),
                        rootSchema,
                        location)
            }
        }
}

def requireJsonSchema = {
    Object value, File schemaFile, String label ->
        if (!schemaFile.isFile()) {
            throw new GradleException(
                    "${label} JSON schema is missing: ${schemaFile}")
        }
        def schema = new groovy.json.JsonSlurper()
                .parse(schemaFile)
        if (!(schema instanceof Map)) {
            throw new GradleException(
                    "${label} JSON schema must be an object")
        }
        validateJsonSchema(
                value,
                (Map) schema,
                (Map) schema,
                '$')
}

