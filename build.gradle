tasks.named('jar') {
    manifest {
        attributes(
                'Automatic-Module-Name': 'blue.coordination',
                'Implementation-Title': 'Blue Coordination Java',
                'Implementation-Version': project.version,
                'Implementation-Vendor': 'Blue Company')
    }
}

signing {
    def signingKey = providers.gradleProperty('signingKey').orNull
    def signingPassword = providers.gradleProperty(
            'signingPassword').orNull
    required = { signingKey != null }
    if (signingKey != null) {
        useInMemoryPgpKeys(signingKey, signingPassword)
    }
    sign publishing.publications.mavenJava
}

if (System.getenv('CI') != null) {
    jreleaser {
        strict = true
        signing {
            pgp {
                active = 'ALWAYS'
                armored = true
            }
        }
        project {
            description = 'Deterministic whole-object document coordination runtime.'
            copyright = 'Copyright 2026 Blue Company. Licensed under the MIT License'
            languages {
                java {
                    version = '17'
                }
            }
        }
        deploy {
            maven {
                mavenCentral {
                    sonatype {
                        active = 'RELEASE'
                        url = 'https://central.sonatype.com/api/v1/publisher'
                        applyMavenCentralRules = true
                        snapshotSupported = false
                        stagingRepository('build/staging-deploy')
                    }
                }
            }
        }
    }
}

def productionSources = fileTree('src/main/java') { include '**/*.java' }
def forbiddenArchitectureTokens = [
        'AutonomousLink', 'TemporalWave', 'ConsistencyMode',
        'ObservingLink', 'CoherentLink', 'SccScheduler',
        'SCCScheduler', 'WeakComponentPlanner'
]

tasks.register('validateProductionShape') {
    group = 'verification'
    description = 'Enforces the production class, line, API, and architecture budgets.'
    inputs.files(productionSources)
    doLast {
        def sources = productionSources.files.sort()
        int classes = sources.size()
        long lines = sources.sum { it.readLines('UTF-8').size() } ?: 0L
        def apiSources = fileTree('src/main/java/blue/coordination/api') {
            include '**/*.java'
        }.files
        def failures = []
        if (classes > 115) failures << "production classes ${classes} > 115"
        // Round 13 transparently retains a bounded 252-line revision for the
        // occurrence-path audit receipt, closed retry-counter vocabulary and
        // retry-monitor producers, timestamp-consumption and attachment-
        // timestamp guards, committed-input recovery evidence, deterministic
        // invalid-entry preflight and terminalization, and injective binding
        // identities. Do not minify or hide this deliberate semantic work.
        if (lines > 25_952L) failures << "production lines ${lines} > 25952"
        if (apiSources.size() > 16) {
            failures << "public API types ${apiSources.size()} > 16"
        }
        ['engine', 'fastpath'].each { legacy ->
            if (file("src/main/java/blue/coordination/${legacy}").exists()) {
                failures << "legacy package remains: ${legacy}"
            }
        }
        sources.each { source ->
            String relative = projectDir.toPath().relativize(
                    source.toPath()).toString().replace('\\', '/')
            String body = source.getText('UTF-8')
            if (relative.contains('/basic/') || relative.contains('/test/')) {
                failures << "test-named production package: ${relative}"
            }
            if (source.name.contains('Basic') || source.name.contains('Test')) {
                failures << "test-named production type: ${relative}"
            }
            if (body.contains('org.junit')
                    || body.contains('CoordinationDocumentSplitter')) {
                failures << "test or splitter dependency in ${relative}"
            }
            forbiddenArchitectureTokens.each { token ->
                if (body.contains(token)) {
                    failures << "forbidden architecture token ${token} in ${relative}"
                }
            }
        }
        fileTree('src/main/resources').files.each { resource ->
            String body = resource.getText('UTF-8')
            forbiddenArchitectureTokens.each { token ->
                if (body.contains(token)) {
                    failures << "forbidden architecture token ${token} in ${resource}"
                }
            }
        }
        if (!failures.empty) throw new GradleException(failures.join('; '))
        logger.lifecycle(
                "Production shape: ${classes} classes, ${lines} lines, "
                        + "${apiSources.size()} public API types")
    }
}

tasks.register('verifyPublicApiBoundary') {
    group = 'verification'
    description = 'Rejects public signatures that expose implementation packages.'
    dependsOn tasks.named('compileJava')
    doLast {
        def violations = []
        fileTree('src/main/java/blue/coordination/api') {
            include '**/*.java'
        }.each { source ->
            source.eachLine('UTF-8') { line, number ->
                if (!line.stripLeading().startsWith('import ')
                        && line.contains('blue.coordination.internal')) {
                    violations << "${source}:${number}"
                }
            }
        }
        fileTree('src/main/java/blue/coordination/internal') {
            include '**/*.java'
            exclude 'DefaultCoordinationEngine.java'
        }.each { source ->
            String body = source.getText('UTF-8')
            if (body =~ /(?m)^public\s+(?:final\s+|abstract\s+)?(?:class|interface|record|enum)\s+/) {
                violations << "public implementation type ${source}"
            }
        }
        if (!violations.empty) {
            throw new GradleException(
                    "Internal API leakage: ${violations.join(', ')}")
        }
    }
}

tasks.register('dependencyPreflight') {
    group = 'verification'
    description = 'Resolves every release dependency from published repositories.'
    doLast {
        if (dependencyMode != 'published-artifact') {
            throw new GradleException(
                    'dependencyPreflight requires '
                            + '-PblueDependencyMode=published-artifact')
        }
        def releaseDependencies = configurations.detachedConfiguration(
                dependencies.create(
                        'blue.language:blue-contracts-core:3.1.0-rc.20'),
                dependencies.create('blue.repo:blue-repo-java:3.0.0-rc.21'),
                dependencies.create('blue.bex:blue-bex-core:1.1.0-rc.3'),
                dependencies.create(
                        'blue.bex:blue-bex-contracts:1.1.0-rc.3'),
                dependencies.create('org.bouncycastle:bcprov-jdk18on:1.78.1'))
        releaseDependencies.transitive = true
        releaseDependencies.resolutionStrategy.failOnVersionConflict()
        releaseDependencies.resolve()
        logger.lifecycle('All published release dependencies resolved.')
    }
}

tasks.register('verifyArtifactContents') {
    group = 'verification'
    description = 'Rejects legacy, test, and fixture classes in the production JAR.'
    dependsOn tasks.named('jar')
    doLast {
        def forbidden = [
                'blue/coordination/basic/',
                'blue/coordination/test/',
                'blue/coordination/engine/',
                'blue/coordination/fastpath/',
                'myosDemoTest',
                'CoordinationTestControl'
        ] + forbiddenArchitectureTokens
        def violations = []
        zipTree(tasks.named('jar').get().archiveFile).visit { details ->
            if (!details.directory && forbidden.any {
                details.path.contains(it)
            }) {
                violations << details.path
            }
        }
        if (!violations.empty) {
            throw new GradleException(
                    "Unsupported production JAR entries: ${violations}")
        }
    }
}

tasks.register('verifyPublicationPom') {
    group = 'verification'
    dependsOn 'generatePomFileForMavenJavaPublication'
    doLast {
        String pom = layout.buildDirectory.file(
                'publications/mavenJava/pom-default.xml')
                .get().asFile.getText('UTF-8')
        def scopes = [:]
        pom.split('</dependency>').each { block ->
            def groups = (block =~ /<groupId>([^<]+)<\/groupId>/)
                    .collect { it[1] }
            def artifacts = (block =~ /<artifactId>([^<]+)<\/artifactId>/)
                    .collect { it[1] }
            def scope = (block =~ /<scope>([^<]+)<\/scope>/)
            if (!groups.empty && !artifacts.empty) {
                scopes[groups.last() + ':' + artifacts.last()] =
                        scope.find() ? scope.group(1) : 'compile'
            }
        }
        ['blue.language:blue-contracts-core', 'blue.bex:blue-bex-core',
         'blue.bex:blue-bex-contracts']
                .each { coordinate ->
                    if (scopes[coordinate] != 'compile') {
                        throw new GradleException(
                                "${coordinate} must be compile scoped because public APIs expose its types")
                    }
                }
        ['blue.repo:blue-repo-java', 'org.bouncycastle:bcprov-jdk18on']
                .each { coordinate ->
                    if (scopes[coordinate] != 'runtime') {
                        throw new GradleException(
                                "${coordinate} must be runtime scoped")
                    }
                }
        def expectedVersions = [
                'blue.language:blue-contracts-core': '3.1.0-rc.20',
                'blue.repo:blue-repo-java': '3.0.0-rc.21',
                'blue.bex:blue-bex-core': '1.1.0-rc.3',
                'blue.bex:blue-bex-contracts': '1.1.0-rc.3',
                'org.bouncycastle:bcprov-jdk18on': '1.78.1'
        ]
        expectedVersions.each { coordinate, expectedVersion ->
            String artifact = coordinate.substring(
                    coordinate.indexOf(':') + 1)
            def dependency = pom.split('</dependency>').find { block ->
                block.contains("<artifactId>${artifact}</artifactId>")
            }
            if (dependency == null
                    || !dependency.contains(
                    "<version>${expectedVersion}</version>")) {
                throw new GradleException(
                        "${coordinate} must use ${expectedVersion}")
            }
        }
        ['MIT License', '<developers>', '<scm>', '<issueManagement>']
                .each { marker ->
                    if (!pom.contains(marker)) {
                        throw new GradleException(
                                "Publication POM is missing ${marker}")
                    }
                }
        [
                '<url>https://github.com/bluecontract/blue-coordination-java</url>',
                '<connection>scm:git:https://github.com/bluecontract/blue-coordination-java.git</connection>',
                '<developerConnection>scm:git:ssh://git@github.com/bluecontract/blue-coordination-java.git</developerConnection>',
                '<url>https://github.com/bluecontract/blue-coordination-java/issues</url>'
        ].each { marker ->
            if (!pom.contains(marker)) {
                throw new GradleException(
                        "Publication POM is missing canonical repository metadata ${marker}")
            }
        }
        if (pom.contains('github.com/bluecontract/blue-contract-java')) {
            throw new GradleException(
                    'Publication POM contains the obsolete repository URL')
        }
        if (pom.contains('SNAPSHOT') || pom.contains('junit')) {
            throw new GradleException(
                    'Release POM contains a snapshot or test dependency')
        }
    }
}

tasks.register('verifyReleaseMetadata') {
    group = 'verification'
    description = 'Validates version, legal metadata, docs, and release artifacts.'
    dependsOn 'jar', 'sourcesJar', 'javadocJar',
            'generatePomFileForMavenJavaPublication'
    String configuredReleaseVersion = version.toString()
    doLast {
        String releaseVersion = configuredReleaseVersion
        if (!(releaseVersion ==~ /\d+\.\d+\.\d+(?:-rc\.\d+)?/)) {
            throw new GradleException(
                    "Version is not a release or RC: ${releaseVersion}")
        }
        if (!file('LICENSE').getText('UTF-8').startsWith('MIT License')) {
            throw new GradleException('LICENSE must contain the MIT License')
        }
        [
                'README.md',
                'START-HERE.md',
                'CHANGELOG.md',
                'CONTRIBUTING.md',
                'SECURITY.md',
                'docs/development/build-and-test.md',
                'docs/development/test-strategy.md',
                'docs/development/releasing.md',
                'docs/releases/3.0.0-rc.1-test-report.md',
                'docs/releases/3.0.0-rc.1-evidence.json',
                'docs/releases/round11-verification.schema.json',
                'docs/releases/round12-verification.schema.json',
                'docs/releases/round13-verification.schema.json',
                'scripts/round13-ab-evidence.mjs',
                'scripts/round13-published-dependencies.gradle',
                'scripts/run-round13-same-machine-ab.sh',
                'docs/reference/public-api.md',
                'docs/reference/metrics.md',
                'docs/operations/failure-model.md'
        ].each { required ->
            if (!file(required).isFile()) {
                throw new GradleException(
                        "Required RC document is missing: ${required}")
            }
        }
        def mainEntries = zipTree(tasks.named('jar').get().archiveFile)
        if (!mainEntries.matching {
            include 'META-INF/LICENSE'
        }.singleFile.isFile()) {
            throw new GradleException('Main JAR is missing META-INF/LICENSE')
        }
        def javadocEntries = zipTree(
                tasks.named('javadocJar').get().archiveFile)
        if (javadocEntries.matching {
            include 'blue/coordination/api/CoordinationEngine.html'
        }.isEmpty() || javadocEntries.matching {
            include 'blue/coordination/processor/CoordinationProcessors.html'
        }.isEmpty()) {
            throw new GradleException(
                    'Javadoc JAR must cover API and processor surfaces')
        }
    }
}

tasks.register('verifyDocumentation') {
    group = 'verification'
    description = 'Validates maintained docs and canonical release evidence.'
    inputs.files(fileTree('docs') { include '**/*.md' },
            'README.md', 'START-HERE.md', 'CHANGELOG.md',
            'CONTRIBUTING.md', 'SECURITY.md',
            'docs/releases/3.0.0-rc.1-evidence.json',
            'docs/releases/round11-verification.schema.json',
            'docs/releases/round12-verification.schema.json',
            'docs/releases/round13-verification.schema.json',
            'scripts/round13-ab-evidence.mjs',
            'scripts/round13-published-dependencies.gradle',
            'scripts/run-round13-same-machine-ab.sh',
            productionSources)
    doLast {
        def failures = []
        inputs.files.files.findAll { it.name.endsWith('.md') }.each { source ->
            String markdown = source.getText('UTF-8')
            def links = markdown =~ /\[[^\]]*\]\(([^)]+)\)/
            links.each { match ->
                String raw = match[1].trim()
                if (raw.startsWith('http://') || raw.startsWith('https://')
                        || raw.startsWith('mailto:') || raw.startsWith('#')) {
                    return
                }
                String path = raw.split('#', 2)[0]
                File target = new File(source.parentFile, path)
                if (!target.exists()) {
                    failures << "${source}: broken link ${raw}"
                }
            }
        }
        if (!failures.empty) {
            throw new GradleException(failures.join('\n'))
        }
        def evidenceFile = file(
                'docs/releases/3.0.0-rc.1-evidence.json')
        def evidence = new groovy.json.JsonSlurper().parse(evidenceFile)
        if (evidence.schemaVersion == '4.1.0'
                && evidence.profile
                == 'ROUND13_PLAYGROUND_FIVE_OCCURRENCE') {
            def schemaFile = file(
                    'docs/releases/round13-verification.schema.json')
            def schema = new groovy.json.JsonSlurper().parse(schemaFile)
            if (evidence.'$schema' != 'round13-verification.schema.json'
                    || !['INTERIM', 'FINAL'].contains(
                    evidence.evidenceState)
                    || schema.'$id' != 'round13-verification.schema.json'
                    || schema.properties.profile.const
                    != 'ROUND13_PLAYGROUND_FIVE_OCCURRENCE'
                    || schema.properties.status.properties
                            .providerBackedReady.const != 'OUT_OF_SCOPE'
                    || schema.properties.status.properties
                            .mandateAgentReady.const != 'OUT_OF_SCOPE') {
                failures << 'Canonical evidence has an invalid Round 13 profile or schema'
            }

            def expectedStatuses = [
                    'temporalArchitectureReady',
                    'inMemoryEngineWorkingReady',
                    'playgroundCoreReady',
                    'playgroundLatencyReady',
                    'providerBackedReady',
                    'mandateAgentReady',
                    'publicRcReady'
            ] as Set
            def allowedReadiness = [
                    'PASS', 'PASS_HARD_GATE', 'PENDING_VERIFICATION',
                    'PASS_WITH_KNOWN_PERFORMANCE_LIMITATION',
                    'BLOCKED', 'FAIL', 'OUT_OF_SCOPE'
            ] as Set
            def allowedExecution = [
                    'PASS', 'PENDING_VERIFICATION', 'FAIL'
            ] as Set
            if ((evidence.status.keySet() as Set) != expectedStatuses) {
                failures << 'Round 13 evidence must contain exactly seven readiness statuses'
            } else {
                evidence.status.each { key, value ->
                    if (!allowedReadiness.contains(value)) {
                        failures << "Invalid Round 13 readiness ${key}=${value}"
                    }
                }
                if (evidence.status.providerBackedReady != 'OUT_OF_SCOPE'
                        || evidence.status.mandateAgentReady
                        != 'OUT_OF_SCOPE') {
                    failures << 'Round 13 provider and Mandate readiness must be OUT_OF_SCOPE'
                }
            }
            if (!allowedReadiness.contains(evidence.verdict)) {
                failures << "Invalid Round 13 verdict ${evidence.verdict}"
            }
            def expectedLimitedRcPolicy = [
                    mode: 'RC_WITH_KNOWN_PERFORMANCE_LIMITATION',
                    exactRelease: '3.0.0-rc.1',
                    decision: 'PASS_WITH_KNOWN_PERFORMANCE_LIMITATION',
                    performanceReleaseBlocking: false,
                    stableReleaseEligible: false,
                    nonPerformanceGatesRequired: true,
                    explicitWorkflowOptInRequired: true
            ]
            boolean limitedRcPolicy = version.toString() == '3.0.0-rc.1'
                    && evidence.release == version.toString()
                    && evidence.releasePolicy == expectedLimitedRcPolicy
            if (!limitedRcPolicy) {
                failures << 'Round 13 RC limitation policy is missing or invalid'
            }

            Closure<String> sha256 = { byte[] bytes ->
                java.security.MessageDigest.getInstance('SHA-256')
                        .digest(bytes).encodeHex().toString()
            }
            Closure<String> relativePath = { File source ->
                rootDir.toPath().relativize(source.toPath()).toString()
                        .replace(File.separator, '/')
            }
            List<File> manifestSources = productionSources.files.sort {
                source -> relativePath(source)
            }
            String manifest = manifestSources.collect { source ->
                "${relativePath(source)} ${sha256(source.bytes)}"
            }.join('\n')
            String actualManifestSha256 = sha256(
                    manifest.getBytes(java.nio.charset.StandardCharsets.UTF_8))
            if (evidence.source.mainSourceManifestSha256
                    != actualManifestSha256
                    || evidence.executionBinding.mainSourceManifestSha256
                    != actualManifestSha256) {
                failures << 'Round 13 main-source manifest is stale or execution binding differs'
            }

            def actualShape = [
                    productionClasses: productionSources.files.size(),
                    productionLines: productionSources.files.sum {
                        it.readLines('UTF-8').size()
                    } ?: 0L,
                    publicApiSourceTypes: fileTree(
                            'src/main/java/blue/coordination/api') {
                        include '**/*.java'
                    }.files.size()
            ]
            def expectedLimits = [
                    productionClasses: 115,
                    productionLines: 25_952,
                    publicApiSourceTypes: 16
            ]
            if (evidence.shape.status != 'PASS'
                    || evidence.shape.basis != 'STATIC_WORKTREE_SNAPSHOT'
                    || evidence.shape.limits != expectedLimits) {
                failures << 'Round 13 static shape or declared limits are invalid'
            }
            actualShape.each { key, actual ->
                if (evidence.shape[key] != actual) {
                    failures << "Round 13 shape ${key} is ${evidence.shape[key]}; actual is ${actual}"
                }
                if (actual > evidence.shape.limits[key]) {
                    failures << "Round 13 shape ${key} exceeds its declared limit"
                }
            }
            String limitReason = evidence.shape.limitRevisionReason ?: ''
            ['25,700', '25,952', 'occurrence-path', 'retry-counter',
             'retry-monitor', 'timestamp-consumption',
             'attachment-timestamp', 'committed-input recovery',
             'invalid-entry preflight', 'terminalization',
             'injective binding identities'].each { marker ->
                if (!limitReason.contains(marker)) {
                    failures << "Round 13 line-limit reason lacks ${marker}"
                }
            }

            def suiteRoots = [
                    'test': 'src/test/java',
                    'integrationTest': 'src/integrationTest/java',
                    'consumerTest': 'src/consumerTest/java',
                    'scenarioTest': 'src/scenarioTest/java'
            ]
            def actualSuites = suiteRoots.collectEntries { name, path ->
                def annotated = fileTree(path) { include '**/*.java' }.files
                        .collect { source ->
                            [file: source, tests: (source.getText('UTF-8')
                                    =~ /(?m)^\s*@Test\b/).count]
                        }.findAll { it.tests > 0 }
                [(name): [
                        tests: annotated.sum { it.tests } ?: 0,
                        classes: annotated.size()
                ]]
            }
            if (evidence.tests.inventoryBasis != 'STATIC_SOURCE_INVENTORY'
                    || evidence.tests.finalTreeRequired != true
                    || !allowedExecution.contains(
                    evidence.tests.executionStatus)
                    || (evidence.tests.suites.collect { it.name } as Set)
                    != (suiteRoots.keySet() as Set)) {
                failures << 'Round 13 test inventory has an invalid shape'
            }
            actualSuites.each { name, actual ->
                def recorded = evidence.tests.suites.find {
                    it.name == name.toString()
                }
                if (recorded == null
                        || recorded.tests != actual.tests
                        || recorded.classes != actual.classes
                        || !allowedExecution.contains(recorded.status)) {
                    failures << "Round 13 ${name} source inventory is stale"
                }
            }
            long actualTests = actualSuites.values().sum { it.tests } ?: 0L
            long actualClasses = actualSuites.values().sum {
                it.classes
            } ?: 0L
            if (evidence.tests.tests != actualTests
                    || evidence.tests.classes != actualClasses) {
                failures << 'Round 13 aggregate source inventory is stale'
            }
            def outcomeFields = ['failures', 'errors', 'skipped']
            if (evidence.tests.executionStatus == 'PENDING_VERIFICATION') {
                if (outcomeFields.any { evidence.tests[it] != null }
                        || evidence.tests.suites.any { suite ->
                            outcomeFields.any { suite[it] != null }
                                    || suite.status != 'PENDING_VERIFICATION'
                        }) {
                    failures << 'Pending Round 13 tests must not contain outcome claims'
                }
            } else {
                outcomeFields.each { field ->
                    if (!(evidence.tests[field] instanceof Number)
                            || evidence.tests.suites.any {
                                !(it[field] instanceof Number)
                            }
                            || evidence.tests.suites.sum {
                                (it[field] as Number).longValue()
                            } != (evidence.tests[field]
                                    as Number).longValue()) {
                        failures << "Round 13 ${field} outcomes are incomplete or inconsistent"
                    }
                }
            }

            if ((evidence.runtimes.collect { it.java } as Set)
                    != (['17', '21'] as Set)) {
                failures << 'Round 13 requires exactly Java 17 and Java 21 lanes'
            }
            evidence.runtimes.each { runtime ->
                ['test', 'integrationTest', 'consumerTest', 'scenarioTest',
                 'releaseCheck', '--rerun-tasks',
                 "-PtestJavaVersion=${runtime.java}"].each { marker ->
                    if (!runtime.gate.contains(marker)) {
                        failures << "Java ${runtime.java} gate lacks ${marker}"
                    }
                }
                if (!allowedExecution.contains(runtime.status)
                        || (runtime.status == 'PENDING_VERIFICATION'
                        && runtime.durationSeconds != null)
                        || (runtime.status == 'PASS'
                        && !(runtime.durationSeconds instanceof Number))) {
                    failures << "Java ${runtime.java} execution record is inconsistent"
                }
            }

            def expectedProofs = [
                    'five-occurrence-three-session-reuse': [
                            'scenarioTest',
                            'blue.coordination.integration.PlaygroundFiveOccurrenceInitializationTest',
                            'fiveOccurrencesReuseThreeSessionsAndForwardFiveInitializationEvents',
                            'scenarioTest'],
                    'five-occurrence-five-parent-events': [
                            'scenarioTest',
                            'blue.coordination.integration.PlaygroundFiveOccurrenceInitializationTest',
                            'fiveOccurrencesReuseThreeSessionsAndForwardFiveInitializationEvents',
                            'scenarioTest'],
                    'five-occurrence-canonical-path-order': [
                            'scenarioTest',
                            'blue.coordination.integration.PlaygroundFiveOccurrenceDeterminismScenarioTest',
                            'reverseRequestInsertionOrderPreservesBlueIdsHistoriesAndEvents',
                            'scenarioTest'],
                    'five-occurrence-retry-exactly-once': [
                            'integrationTest',
                            'blue.coordination.integration.PlaygroundFiveOccurrenceRetryTest',
                            'retryCompletesFiveOccurrenceFanoutWithoutReinitializingChildren',
                            'integrationTest'],
                    'five-occurrence-public-JAR-consumer': [
                            'consumerTest',
                            'blue.coordination.consumer.PublishedArtifactConsumerTest',
                            'fiveEmbeddedOccurrencesReuseThreeManagedDocuments',
                            'consumerTest'],
                    'five-occurrence-no-generic-fragmentation': [
                            'scenarioTest',
                            'blue.coordination.integration.PlaygroundFiveOccurrenceInitializationTest',
                            'fiveOccurrencesReuseThreeSessionsAndForwardFiveInitializationEvents',
                            'scenarioTest'],
                    'five-occurrence-host-versus-frozen-time': [
                            'performance', null, null,
                            'round13PlaygroundSample']
            ]
            if ((evidence.proofs.collect { it.id } as Set)
                    != (expectedProofs.keySet() as Set)) {
                failures << 'Round 13 proof set must contain the exact seven rows'
            }
            String buildText = file('build.gradle').getText('UTF-8')
            evidence.proofs.each { proof ->
                def expected = expectedProofs[proof.id]
                if (expected != null
                        && [proof.sourceSet, proof.testClass,
                            proof.testMethod, proof.task] != expected) {
                    failures << "Round 13 proof binding differs: ${proof.id}"
                }
                if (proof.sourceSet == 'performance') {
                    if (!buildText.contains(
                            "tasks.register('round13PlaygroundSample'")
                            || !file('src/scenarioTest/java/blue/coordination/integration/PlaygroundFiveOccurrenceEvidence.java')
                                    .isFile()) {
                        failures << 'Round 13 performance proof target is missing'
                    }
                } else {
                    String proofRoot = suiteRoots[proof.sourceSet]
                    File proofSource = proofRoot == null ? null : file(
                            proofRoot + '/'
                                    + proof.testClass.replace('.', '/')
                                    + '.java')
                    if (proofSource == null || !proofSource.isFile()
                            || !proofSource.getText('UTF-8').contains(
                            proof.testMethod + '(')) {
                        failures << "Round 13 proof target is missing: ${proof.id}"
                    }
                }
                if (!allowedExecution.contains(proof.status)) {
                    failures << "Round 13 proof has invalid status: ${proof.id}"
                }
            }

            def campaign = evidence.performance.round13Campaign
            def campaignStatuses = [
                    'PASS', 'PASS_HARD_GATE',
                    'PENDING_VERIFICATION', 'FAIL'
            ] as Set
            String expectedBaselineHash =
                    '2f303afd9435937145ce7fe09eb655ff1a05ee6ed7484faea62d93544a3ccf3e'
            if (!campaignStatuses.contains(campaign.status)
                    || campaign.comparison != 'SAME_MACHINE_INTERLEAVED_AB'
                    || campaign.baselineArchive != 'Archive.zip'
                    || campaign.baselineSha256 != expectedBaselineHash
                    || campaign.candidateTask != 'round13PlaygroundSample'
                    || campaign.warmups != 3
                    || campaign.requiredSamples < 30
                    || campaign.measuredSamples < 0) {
                failures << 'Round 13 performance campaign has invalid metadata'
            }
            def campaignOutputs = [campaign.runtimeMarkdown,
                                   campaign.runtimeJson,
                                   campaign.runtimeProvenanceJson]
            if (campaign.status == 'PENDING_VERIFICATION') {
                if (campaign.measuredSamples != 0
                        || campaignOutputs.any { it != null }
                        || campaign.pendingReason == null) {
                    failures << 'Pending Round 13 campaign must not contain final outputs'
                }
            } else {
                def expectedCampaignOutputs = [
                        'docs/releases/evidence/round13/five-occurrence-runtime.md',
                        'docs/releases/evidence/round13/five-occurrence-runtime.json',
                        'docs/releases/evidence/round13/runtime-provenance.json'
                ]
                if (campaign.measuredSamples != 30
                        || campaignOutputs != expectedCampaignOutputs
                        || campaignOutputs.any { !file(it).isFile() }
                        || campaign.pendingReason != null) {
                    failures << 'Measured Round 13 campaign is incomplete'
                } else {
                    List<String> command = [
                            'node',
                            file('scripts/round13-ab-evidence.mjs')
                                    .absolutePath,
                            '--verify',
                            '--candidate', rootDir.absolutePath,
                            '--runtime', file(campaign.runtimeJson)
                                    .absolutePath,
                            '--provenance',
                            file(campaign.runtimeProvenanceJson)
                                    .absolutePath,
                            '--markdown', file(campaign.runtimeMarkdown)
                                    .absolutePath
                    ]
                    Process process = new ProcessBuilder(command)
                            .directory(rootDir)
                            .redirectErrorStream(true).start()
                    String verification = process.inputStream
                            .getText('UTF-8')
                    if (process.waitFor() != 0
                            || !verification.contains(
                            "ROUND13_AB_VERIFIED=${campaign.status}")) {
                        failures << ('Round 13 runtime receipt failed recomputation: '
                                + verification.trim())
                    }
                }
            }
            def historical = evidence.performance.historicalRound12
            if (historical.classification != 'HISTORICAL_ONLY'
                    || historical.decisionBasis != false
                    || !(historical.summary instanceof String)
                    || historical.summary.isBlank()) {
                failures << 'Round 12 measurements must remain historical only'
            }

            def expectedCounters = [
                    'REQUEST_FRAGMENTS',
                    'TIMELINE_ENTRY_FRAGMENTS',
                    'ORDINARY_NODE_FRAGMENTS',
                    'FULL_ENVIRONMENT_SCANS',
                    'SOURCE_REPLAYS_PER_PARENT',
                    'POST_PROCESS_FULL_PROJECTIONS',
                    'PARENT_PROCESS_RERUNS_ON_GRAPH_RETRY',
                    'CHILD_PROCESS_RERUNS_ON_PARENT_RETRY'
            ] as Set
            def counters = evidence.structuralEvidence.requiredZeroCounters
            if ((counters.keySet() as Set) != expectedCounters
                    || evidence.structuralEvidence.finalTreeRequired != true
                    || !allowedExecution.contains(
                    evidence.structuralEvidence.status)) {
                failures << 'Round 13 structural evidence must contain the exact eight counters'
            } else if (evidence.structuralEvidence.status
                    == 'PENDING_VERIFICATION') {
                if (counters.any { key, value -> value != null }) {
                    failures << 'Pending Round 13 counters must remain unset'
                }
            } else if (evidence.structuralEvidence.status == 'PASS'
                    && counters.any { key, value -> value != 0 }) {
                failures << 'Passing Round 13 structural counters must all equal zero'
            }

            def artifactHashes = [
                    'mainJarSha256', 'sourcesJarSha256',
                    'javadocJarSha256', 'testFixturesJarSha256'
            ]
            String sha256Pattern = /^[0-9a-f]{64}$/
            if (!allowedExecution.contains(evidence.artifacts.status)
                    || evidence.artifacts.finalTreeRequired != true) {
                failures << 'Round 13 artifact evidence has an invalid status'
            } else if (evidence.artifacts.status
                    == 'PENDING_VERIFICATION'
                    && artifactHashes.any {
                        evidence.artifacts[it] != null
                    }) {
                failures << 'Pending Round 13 artifacts must not retain hashes'
            } else if (evidence.artifacts.status == 'PASS'
                    && artifactHashes.any {
                        !(evidence.artifacts[it] ==~ sha256Pattern)
                    }) {
                failures << 'Passing Round 13 artifacts require four hashes'
            }

            def archive = evidence.sourceArchive
            def expectedArchiveFields = [
                    configuration: 'CONFIGURED',
                    finalTreeRequired: true,
                    authoritativeVersionFile: '.cz.toml',
                    authoritativeVersionFileIncluded: true,
                    reproducibleFileOrder: true,
                    preserveFileTimestamps: false,
                    duplicatesStrategy: 'FAIL'
            ]
            expectedArchiveFields.each { key, value ->
                if (archive[key] != value) {
                    failures << "Round 13 source archive ${key} must be ${value}"
                }
            }
            def expectedArchiveReceipt = [
                    schemaId: 'blue-coordination-round13-source-archive-verification-v1',
                    path: 'build/reports/round13/source-archive-verification.json'
            ]
            def expectedArchiveChecksum = [
                    mode: 'DETACHED_SHA256_SIDECAR',
                    path: 'build/distributions/blue-coordination-java-3.0.0-rc.1-source.zip.sha256',
                    digest: null
            ]
            if (archive.verificationReceipt != expectedArchiveReceipt
                    || archive.checksum != expectedArchiveChecksum) {
                failures << 'Round 13 source archive must use external receipt and detached checksum authority'
            }
            def archiveExecutionFields = [
                    'extractedConfiguration', 'focusedTestsStatus',
                    'publishedArtifactSmokeBuild'
            ]
            if (archiveExecutionFields.any {
                !['PASS', 'PENDING_VERIFICATION', 'FAIL',
                  'BLOCKED_UPSTREAM'].contains(archive[it])
            }) {
                failures << 'Round 13 source archive has an invalid execution status'
            }
            if (archiveExecutionFields.any {
                archive[it] == 'PENDING_VERIFICATION'
            }) {
                if (archive.pendingReason == null) {
                    failures << 'Pending Round 13 archive must explain why'
                }
            } else if (archive.pendingReason != null) {
                failures << 'Completed Round 13 archive must have no pending reason'
            }
            if (!['PASS', 'PENDING_VERIFICATION', 'FAIL',
                  'BLOCKED_UPSTREAM'].contains(
                    evidence.publicationEvidence.status)) {
                failures << 'Round 13 publication evidence has an invalid status'
            }

            String report = file(
                    'docs/releases/3.0.0-rc.1-test-report.md')
                    .getText('UTF-8')
            evidence.status.each { key, value ->
                if (!report.contains("| `${key}` | `${value}` |")) {
                    failures << "Canonical report differs from status ${key}"
                }
            }
            expectedProofs.keySet().each { proofId ->
                if (!report.contains("`${proofId}`")) {
                    failures << "Canonical report lacks proof row ${proofId}"
                }
            }
            if (!report.contains(actualManifestSha256)
                    || !report.contains("**${actualClasses}**")
                    || !report.contains("**${actualTests}**")) {
                failures << 'Canonical report lacks current manifest or aggregate inventory'
            }

            if (evidence.evidenceState == 'INTERIM') {
                def baseInterimStatuses = [
                        temporalArchitectureReady: 'PENDING_VERIFICATION',
                        inMemoryEngineWorkingReady: 'PENDING_VERIFICATION',
                        playgroundCoreReady: 'PENDING_VERIFICATION',
                        providerBackedReady: 'OUT_OF_SCOPE',
                        mandateAgentReady: 'OUT_OF_SCOPE',
                        publicRcReady: 'BLOCKED'
                ]
                boolean baseStatusesMatch = baseInterimStatuses.every {
                    key, value -> evidence.status[key] == value
                }
                String expectedLatency = campaign.status
                        == 'PENDING_VERIFICATION'
                        ? 'PENDING_VERIFICATION' : campaign.status
                if (!baseStatusesMatch
                        || evidence.status.playgroundLatencyReady
                        != expectedLatency
                        || evidence.verdict != 'PENDING_VERIFICATION'
                        || evidence.source.candidateCommit != null
                        || evidence.source.binding
                        != 'BASE_COMMIT_PLUS_DIRTY_WORKTREE_MANIFEST'
                        || evidence.source.worktree != 'DIRTY'
                        || evidence.source.dirtyReason == null
                        || evidence.executionBinding.candidateCommit != null
                        || evidence.executionBinding.reason == null
                        || !report.contains(
                        'ROUND13_INTERIM_VERIFICATION: PENDING_VERIFICATION')
                        || report.contains('ROUND13_FINAL_VERIFICATION:')) {
                    failures << 'Round 13 INTERIM evidence overclaims or lacks its marker'
                }
                if (evidence.executionBinding.kind == 'PENDING') {
                    if (evidence.tests.executionStatus
                            != 'PENDING_VERIFICATION'
                            || evidence.runtimes.any {
                                it.status != 'PENDING_VERIFICATION'
                            }
                            || evidence.proofs.any {
                                it.status != 'PENDING_VERIFICATION'
                            }
                            || evidence.structuralEvidence.status
                            != 'PENDING_VERIFICATION') {
                        failures << 'Pending Round 13 binding cannot carry execution outcomes'
                    }
                } else if (evidence.executionBinding.kind
                        == 'WORKTREE_EXECUTION') {
                    if (evidence.tests.executionStatus
                            == 'PENDING_VERIFICATION'
                            || evidence.runtimes.any {
                                it.status == 'PENDING_VERIFICATION'
                                        || !(it.durationSeconds
                                        instanceof Number)
                            }
                            || evidence.proofs.any {
                                it.status == 'PENDING_VERIFICATION'
                            }
                            || evidence.structuralEvidence.status
                            == 'PENDING_VERIFICATION') {
                        failures << 'Round 13 WORKTREE_EXECUTION must contain complete lane outcomes'
                    }
                } else {
                    failures << 'Round 13 INTERIM execution binding must be PENDING or WORKTREE_EXECUTION'
                }
            } else {
                def publishableLatency = [
                        'PASS', 'PASS_HARD_GATE'
                ] as Set
                boolean normalLatencyDecision = evidence.verdict == 'PASS'
                        && publishableLatency.contains(
                        evidence.status.playgroundLatencyReady)
                        && evidence.status.publicRcReady == 'PASS'
                        && publishableLatency.contains(campaign.status)
                        && evidence.proofs.every { it.status == 'PASS' }
                        && report.contains(
                        'ROUND13_FINAL_VERIFICATION: PASS')
                boolean limitedLatencyDecision = limitedRcPolicy
                        && evidence.verdict
                        == 'PASS_WITH_KNOWN_PERFORMANCE_LIMITATION'
                        && evidence.status.playgroundLatencyReady
                        == 'PASS_WITH_KNOWN_PERFORMANCE_LIMITATION'
                        && evidence.status.publicRcReady
                        == 'PASS_WITH_KNOWN_PERFORMANCE_LIMITATION'
                        && campaign.status == 'PENDING_VERIFICATION'
                        && campaign.measuredSamples == 0
                        && campaign.runtimeMarkdown == null
                        && campaign.runtimeJson == null
                        && campaign.runtimeProvenanceJson == null
                        && campaign.pendingReason instanceof String
                        && !campaign.pendingReason.isBlank()
                        && evidence.proofs.every {
                            it.status == 'PASS'
                                    || (it.id
                                    == 'five-occurrence-host-versus-frozen-time'
                                    && it.status == 'PENDING_VERIFICATION')
                        }
                        && report.contains(
                        'ROUND13_FINAL_VERIFICATION: '
                                + 'PASS_WITH_KNOWN_PERFORMANCE_LIMITATION')
                if (!(normalLatencyDecision || limitedLatencyDecision)
                        || evidence.source.candidateCommit == null
                        || evidence.source.binding != 'CANDIDATE_COMMIT'
                        || evidence.source.worktree != 'CLEAN'
                        || evidence.source.dirtyReason != null
                        || evidence.executionBinding.kind
                        != 'CANDIDATE_COMMIT_EXECUTION'
                        || evidence.executionBinding.candidateCommit
                        != evidence.source.candidateCommit
                        || evidence.status.temporalArchitectureReady != 'PASS'
                        || evidence.status.inMemoryEngineWorkingReady != 'PASS'
                        || evidence.status.playgroundCoreReady != 'PASS'
                        || evidence.status.providerBackedReady != 'OUT_OF_SCOPE'
                        || evidence.status.mandateAgentReady != 'OUT_OF_SCOPE'
                        || evidence.tests.executionStatus != 'PASS'
                        || evidence.tests.failures != 0
                        || evidence.tests.errors != 0
                        || evidence.tests.skipped != 0
                        || evidence.tests.suites.any {
                            it.status != 'PASS' || it.failures != 0
                                    || it.errors != 0 || it.skipped != 0
                        }
                        || evidence.runtimes.any { it.status != 'PASS' }
                        || evidence.structuralEvidence.status != 'PASS'
                        || evidence.artifacts.status != 'PASS'
                        || archiveExecutionFields.any {
                            archive[it] != 'PASS'
                        }
                        || evidence.publicationEvidence.status != 'PASS'
                        || report.contains('ROUND13_INTERIM_VERIFICATION:')) {
                    failures << 'Round 13 FINAL evidence is incomplete'
                }
            }
            [
                    'docs/releases/3.0.0-rc.1-round13-test-report.md',
                    'docs/releases/3.0.0-rc.1-round13-evidence.json'
            ].each { duplicate ->
                if (file(duplicate).exists()) {
                    failures << "Duplicate Round 13 evidence surface remains: ${duplicate}"
                }
            }
            if (!failures.empty) {
                throw new GradleException(failures.join('\n'))
            }
            return
        }
        if (evidence.schemaVersion == '3.0.0'
                && evidence.profile == 'ROUND12_INITIALIZATION_LIFECYCLE') {
            if (evidence.'$schema' != 'round12-verification.schema.json'
                    || !['INTERIM', 'FINAL'].contains(
                    evidence.evidenceState)) {
                failures << 'Canonical evidence has an invalid Round 12 profile'
            }
            def expectedStatuses = [
                    'temporalArchitectureReady',
                    'inMemoryEngineWorkingReady',
                    'providerBackedReady',
                    'mandateAgentReady',
                    'playgroundLatencyReady',
                    'publicRcReady'
            ] as Set
            def allowedStatuses = [
                    'PASS', 'PASS_HARD_GATE', 'PENDING_VERIFICATION',
                    'BLOCKED', 'BLOCKED_SCOPE', 'BLOCKED_UPSTREAM', 'FAIL'
            ] as Set
            def allowedExecutionStatuses = [
                    'PASS', 'PENDING_VERIFICATION', 'FAIL'
            ] as Set
            if ((evidence.status.keySet() as Set) != expectedStatuses) {
                failures << 'Round 12 evidence must contain six readiness statuses'
            } else {
                evidence.status.each { key, value ->
                    if (!allowedStatuses.contains(value)) {
                        failures << "Invalid readiness status ${key}=${value}"
                    }
                }
            }
            if (!allowedStatuses.contains(evidence.verdict)) {
                failures << "Invalid Round 12 verdict ${evidence.verdict}"
            }

            Closure<String> sha256 = { byte[] bytes ->
                java.security.MessageDigest.getInstance('SHA-256')
                        .digest(bytes).encodeHex().toString()
            }
            Closure<String> relativePath = { File source ->
                rootDir.toPath().relativize(source.toPath()).toString()
                        .replace(File.separator, '/')
            }
            List<File> manifestSources = productionSources.files.sort {
                source -> relativePath(source)
            }
            String manifest = manifestSources.collect { source ->
                "${relativePath(source)} ${sha256(source.bytes)}"
            }.join('\n')
            String actualManifestSha256 = sha256(
                    manifest.getBytes(java.nio.charset.StandardCharsets.UTF_8))
            if (evidence.source.mainSourceManifestSha256
                    != actualManifestSha256) {
                failures << 'Round 12 main-source manifest is stale'
            }

            def actualShape = [
                    productionClasses: productionSources.files.size(),
                    productionLines: productionSources.files.sum {
                        it.readLines('UTF-8').size()
                    } ?: 0L,
                    publicApiSourceTypes: fileTree(
                            'src/main/java/blue/coordination/api') {
                        include '**/*.java'
                    }.files.size()
            ]
            if (evidence.shape.status != 'PASS'
                    || evidence.shape.basis != 'STATIC_WORKTREE_SNAPSHOT') {
                failures << 'Round 12 static worktree shape must PASS'
            }
            actualShape.each { key, actual ->
                if (evidence.shape[key] != actual) {
                    failures << "Production shape ${key} is "
                            + "${evidence.shape[key]}; actual is ${actual}"
                }
                if (actual > evidence.shape.limits[key]) {
                    failures << "Production shape ${key} exceeds its limit"
                }
            }

            def suiteRoots = [
                    test: 'src/test/java',
                    integrationTest: 'src/integrationTest/java',
                    consumerTest: 'src/consumerTest/java',
                    scenarioTest: 'src/scenarioTest/java'
            ]
            def actualSuites = suiteRoots.collectEntries { name, path ->
                def annotated = fileTree(path) { include '**/*.java' }.files
                        .collect { source ->
                            [file: source, tests: (source.getText('UTF-8')
                                    =~ /(?m)^\s*@Test\b/).count]
                        }.findAll { it.tests > 0 }
                [(name): [
                        tests: annotated.sum { it.tests } ?: 0,
                        classes: annotated.size()
                ]]
            }
            if (evidence.tests.inventoryBasis != 'STATIC_SOURCE_INVENTORY'
                    || evidence.tests.finalTreeRequired != true
                    || !allowedExecutionStatuses.contains(
                    evidence.tests.executionStatus)
                    || (evidence.tests.suites.collect { it.name } as Set)
                    != (suiteRoots.keySet() as Set)) {
                failures << 'Round 12 test inventory has an invalid shape'
            }
            actualSuites.each { name, actual ->
                def recorded = evidence.tests.suites.find {
                    it.name == name.toString()
                }
                if (recorded == null
                        || recorded.tests != actual.tests
                        || recorded.classes != actual.classes) {
                    failures << "Round 12 ${name} inventory is stale"
                }
            }
            long actualTests = actualSuites.values().sum { it.tests } ?: 0L
            long actualClasses = actualSuites.values().sum { it.classes } ?: 0L
            if (evidence.tests.tests != actualTests
                    || evidence.tests.classes != actualClasses) {
                failures << 'Round 12 aggregate test inventory is stale'
            }
            def testOutcomeFields = ['failures', 'errors', 'skipped']
            if (evidence.tests.executionStatus != 'PENDING_VERIFICATION') {
                testOutcomeFields.each { field ->
                    if (evidence.tests[field] instanceof Number
                            && evidence.tests.suites.every {
                                it[field] instanceof Number
                            }) {
                        long total = evidence.tests.suites.sum {
                            (it[field] as Number).longValue()
                        }
                        if (total != (evidence.tests[field]
                                as Number).longValue()) {
                            failures << "Round 12 ${field} total is inconsistent"
                        }
                    }
                }
            }

            if ((evidence.runtimes.collect { it.java } as Set)
                    != (['17', '21'] as Set)) {
                failures << 'Round 12 requires Java 17 and Java 21 lanes'
            }
            evidence.runtimes.each { runtime ->
                if (!allowedExecutionStatuses.contains(runtime.status)) {
                    failures << "Java ${runtime.java} has invalid status"
                } else if (!runtime.gate.contains(
                        "-PtestJavaVersion=${runtime.java}")) {
                    failures << "Java ${runtime.java} gate lacks its toolchain"
                }
            }

            def expectedProofs = [
                    'shared-game-single-initialization': [
                            'scenarioTest',
                            'blue.coordination.integration.NbaSharedGameLifecycleAcrossHostsTest',
                            'laterAndPostFinalHostsReuseGameAndReceiveRetainedLifecycleEvents'],
                    'later-host-receives-initialization-event': [
                            'scenarioTest',
                            'blue.coordination.integration.NbaSharedGameLifecycleAcrossHostsTest',
                            'laterAndPostFinalHostsReuseGameAndReceiveRetainedLifecycleEvents'],
                    'dynamic-path-activation': [
                            'integrationTest',
                            'blue.coordination.integration.DynamicProcessEmbeddedPathActivationTest',
                            'addingProcessEmbeddedPathInitializesExistingInlineDocument'],
                    'dynamic-collection-activation': [
                            'scenarioTest',
                            'blue.coordination.integration.DynamicProcessEmbeddedCollectionActivationTest',
                            'collectionMembersInitializeByCanonicalPathNotInsertionOrBlueIdOrder'],
                    'canonical-code-point-order': [
                            'test',
                            'blue.coordination.internal.EmbeddingBindingCanonicalOrderTest',
                            'supplementaryCodePointUsesCanonicalTextOrderRatherThanUtf16Order'],
                    'initialization-retry-idempotency': [
                            'integrationTest',
                            'blue.coordination.integration.InitializationRetryIdempotencyTest',
                            'retryPublishesOneChildInitializationWithoutRepeatingParentOperation']
            ]
            if ((evidence.proofs.collect { it.id } as Set)
                    != (expectedProofs.keySet() as Set)) {
                failures << 'Round 12 proof set must contain the exact six rows'
            }
            evidence.proofs.each { proof ->
                def expected = expectedProofs[proof.id]
                if (expected != null
                        && [proof.sourceSet, proof.testClass,
                            proof.testMethod] != expected) {
                    failures << "Round 12 proof binding differs: ${proof.id}"
                }
                String proofRoot = suiteRoots[proof.sourceSet]
                File proofSource = proofRoot == null ? null : file(
                        proofRoot + '/' + proof.testClass.replace('.', '/')
                                + '.java')
                if (proofSource == null || !proofSource.isFile()
                        || !proofSource.getText('UTF-8').contains(
                        proof.testMethod + '(')) {
                    failures << "Round 12 proof target is missing: ${proof.id}"
                }
                if (!allowedExecutionStatuses.contains(proof.status)) {
                    failures << "Round 12 proof has invalid status: ${proof.id}"
                }
            }

            def historical = evidence.performance.historicalRound11Baseline
            def campaign = evidence.performance.round12Campaign
            def nbaEvidence = campaign.nbaLifecycleEvidence
            def sameScenarioP95 = campaign.sameScenarioP95
            def performanceStatuses = [
                    'PASS', 'PASS_HARD_GATE', 'PENDING_VERIFICATION', 'FAIL'
            ] as Set
            if (!performanceStatuses.contains(campaign.status)
                    || !allowedExecutionStatuses.contains(nbaEvidence.status)
                    || !performanceStatuses.contains(sameScenarioP95.status)
                    || campaign.preferredHostP95RegressionPercent
                    > campaign.hardHostP95RegressionPercent) {
                failures << 'Round 12 performance has invalid status'
            }
            def publishablePerformance = ['PASS', 'PASS_HARD_GATE'] as Set
            String expectedCampaignStatus
            if (nbaEvidence.status == 'FAIL'
                    || sameScenarioP95.status == 'FAIL') {
                expectedCampaignStatus = 'FAIL'
            } else if (nbaEvidence.status == 'PASS'
                    && publishablePerformance.contains(
                    sameScenarioP95.status)) {
                expectedCampaignStatus = sameScenarioP95.status
            } else {
                expectedCampaignStatus = 'PENDING_VERIFICATION'
            }
            if (campaign.status != expectedCampaignStatus) {
                failures << 'Round 12 aggregate performance status is inconsistent'
            }
            if (historical.classification != 'HISTORICAL_BASELINE_ONLY'
                    || historical.profile != 'ROUND11_READINESS_CLOSURE'
                    || historical.sameSourceAsRound12 != false) {
                failures << 'Round 11 performance must remain historical baseline only'
            }
            def retainedHostBaselines = [
                    warmOrdinary: 15.571d,
                    warmPayNotePlusParent: 46.645d,
                    threeLayerRestaurantProduct: 54.696d
            ]
            def round11ObservedHosts = [
                    warmOrdinary: 19.537833d,
                    warmPayNotePlusParent: 53.719583d,
                    threeLayerRestaurantProduct: 61.540792d
            ]
            retainedHostBaselines.each { key, baseline ->
                if (Math.abs((historical
                        .promptRetainedBaselineSingleRunMs[key].host as double)
                        - baseline) > 0.000001d
                        || Math.abs((historical
                        .round11ObservedSingleRunMs[key].host as double)
                        - round11ObservedHosts[key]) > 0.000001d) {
                    failures << "Historical host baseline differs: ${key}"
                }
            }
            if (sameScenarioP95.repeatedP95Rows != null) {
                if ((sameScenarioP95.repeatedP95Rows.keySet() as Set)
                        != (retainedHostBaselines.keySet() as Set)) {
                    failures << 'Round 12 p95 requires the exact three scenarios'
                }
                boolean preferredPass = true
                boolean hardPass = true
                retainedHostBaselines.each { key, baseline ->
                    def row = sameScenarioP95.repeatedP95Rows[key]
                    if (row == null || !(row.round12P95Ms instanceof Number)
                            || !(row.baselineHostMs instanceof Number)
                            || Math.abs((row.baselineHostMs as double)
                            - baseline) > 0.000001d) {
                        failures << "Round 12 p95 row is incomplete: ${key}"
                        preferredPass = false
                        hardPass = false
                    } else {
                        double regression = ((row.round12P95Ms as double)
                                / baseline - 1.0d) * 100.0d
                        String preferred = regression
                                <= campaign.preferredHostP95RegressionPercent
                                ? 'PASS' : 'MISS'
                        String hard = regression
                                <= campaign.hardHostP95RegressionPercent
                                ? 'PASS' : 'FAIL'
                        if (!(row.regressionPercent instanceof Number)
                                || Math.abs(regression
                                - (row.regressionPercent as double)) > 0.0001d
                                || row.preferredGate != preferred
                                || row.hardGate != hard) {
                            failures << "Round 12 p95 gate differs: ${key}"
                        }
                        preferredPass &= preferred == 'PASS'
                        hardPass &= hard == 'PASS'
                    }
                }
                String measuredStatus = !hardPass ? 'FAIL'
                        : preferredPass ? 'PASS' : 'PASS_HARD_GATE'
                if (sameScenarioP95.status != measuredStatus) {
                    failures << 'Round 12 p95 aggregate status differs'
                }
            }
            historical.evidenceFiles.each { key, reference ->
                File retained = new File(evidenceFile.parentFile,
                        reference.path.toString())
                if (!retained.isFile()
                        || sha256(retained.bytes)
                        != reference.sha256) {
                    failures << "Historical Round 11 evidence differs: "
                            + reference.path
                }
            }
            Closure<List<File>> verifyEvidenceFiles = {
                references, String label ->
                    references.collect { reference ->
                        File measured = new File(evidenceFile.parentFile,
                                reference.path.toString())
                        if (!measured.isFile()
                                || sha256(measured.bytes)
                                != reference.sha256) {
                            failures << "${label} evidence differs: "
                                    + reference.path
                        }
                        measured
                    }
            }
            List<File> nbaFiles = verifyEvidenceFiles(
                    nbaEvidence.evidenceFiles, 'Round 12 NBA')
            verifyEvidenceFiles(sameScenarioP95.evidenceFiles,
                    'Round 12 p95')
            if (nbaEvidence.status != 'PENDING_VERIFICATION') {
                nbaFiles.findAll { it.isFile() }.each { measured ->
                    def nba = new groovy.json.JsonSlurper().parse(measured)
                    if (nba.schemaVersion != 'round12-nba-evidence-v1'
                            || nba.status != 'MEASURED_SINGLE_SCENARIO'
                            || nba.sourceState.mainSourceManifestSha256
                            != evidence.source.mainSourceManifestSha256
                            || (nbaEvidence.status == 'PASS'
                            && nba.forbiddenCounters.any {
                                key, value -> value != 0
                            })) {
                        failures << 'Round 12 NBA evidence is inconsistent: '
                                + measured
                    }
                }
            }

            def expectedZeroCounters = [
                    'REQUEST_FRAGMENTS', 'TIMELINE_ENTRY_FRAGMENTS',
                    'ORDINARY_NODE_FRAGMENTS', 'FULL_ENVIRONMENT_SCANS',
                    'SOURCE_REPLAYS_PER_PARENT',
                    'POST_PROCESS_FULL_PROJECTIONS',
                    'PARENT_PROCESS_RERUNS_ON_GRAPH_RETRY',
                    'CHILD_PROCESS_RERUNS_ON_PARENT_RETRY'
            ] as Set
            if ((evidence.structuralEvidence.requiredZeroCounters.keySet()
                    as Set) != expectedZeroCounters) {
                failures << 'Round 12 structural evidence needs eight counters'
            }
            if (!allowedExecutionStatuses.contains(
                    evidence.structuralEvidence.status)
                    || !allowedExecutionStatuses.contains(
                    evidence.artifacts.status)) {
                failures << 'Round 12 structural/artifact status is invalid'
            }
            def artifactHashes = [
                    'mainJarSha256', 'sourcesJarSha256',
                    'javadocJarSha256', 'testFixturesJarSha256'
            ]
            def sha256Pattern = ~/[0-9a-f]{64}/
            def expectedArchiveTests = [
                    'blue.coordination.api.DocumentRevisionInitializationCausalityTest',
                    'blue.coordination.internal.DocumentAdmissionCauseTest',
                    'blue.coordination.internal.EmbeddedEpochInputInitializationCausalityTest',
                    'blue.coordination.internal.EmbeddingBindingCanonicalOrderTest'
            ] as Set
            if (evidence.sourceArchive.configuration != 'CONFIGURED'
                    || evidence.sourceArchive.authoritativeVersionFile
                    != '.cz.toml'
                    || evidence.sourceArchive.authoritativeVersionFileIncluded
                    != true
                    || evidence.sourceArchive.reproducibleFileOrder != true
                    || evidence.sourceArchive.preserveFileTimestamps != false
                    || evidence.sourceArchive.duplicatesStrategy != 'FAIL'
                    || (evidence.sourceArchive.focusedTests as Set)
                    != expectedArchiveTests
                    || evidence.sourceArchive.detachedHashEvidence.mode
                    != 'DETACHED_POST_BUILD_SIDECAR'
                    || evidence.sourceArchive.detachedHashEvidence
                    .embeddedInSourceArchive != false
                    || evidence.sourceArchive.detachedHashEvidence.sidecarPath
                    != "build/distributions/blue-coordination-java-${version}"
                    + '-source.zip.sha256') {
                failures << 'Round 12 source-archive configuration is incomplete'
            }

            def timelineCapability = evidence.capabilities.find {
                it.id == 'generic-timeline-entry-document-target'
            }
            if (timelineCapability == null
                    || timelineCapability.blocker != false
                    || evidence.blockers.any {
                        it.id == 'generic-timeline-entry-document-target'
                    }) {
                failures << 'Generic Timeline targeting must remain optional'
            }
            if (!evidence.blockers.any {
                it.id == 'provider-mandate-resolver'
            }) {
                failures << 'Provider-backed Mandate resolver must remain a blocker'
            }

            String report = file(
                    'docs/releases/3.0.0-rc.1-test-report.md')
                    .getText('UTF-8')
            expectedStatuses.each { key ->
                if (!report.contains(
                        "| `${key}` | `${evidence.status[key]}` |")) {
                    failures << "Canonical report/evidence status differs for ${key}"
                }
            }
            expectedProofs.keySet().each { proof ->
                if (!report.contains("`${proof}`")) {
                    failures << "Canonical report omits proof ${proof}"
                }
            }
            List<String> reportLines = report.readLines()
            evidence.proofs.each { proof ->
                String row = reportLines.find {
                    it.contains("| `${proof.id}` |")
                }
                if (row == null
                        || !row.endsWith("| `${proof.status}` |")) {
                    failures << "Canonical proof status differs: ${proof.id}"
                }
            }
            evidence.runtimes.each { runtime ->
                String row = reportLines.find {
                    it.startsWith("| Java ${runtime.java} |")
                }
                if (row == null || !row.contains("| `${runtime.status}` |")) {
                    failures << "Canonical runtime status differs: Java "
                            + runtime.java
                }
            }
            evidence.tests.suites.each { suite ->
                String row = reportLines.find {
                    it.contains("(`${suite.name}`)")
                }
                if (row == null
                        || !row.contains("| ${suite.classes} | ${suite.tests} |")
                        || !row.endsWith("| `${suite.status}` |")) {
                    failures << "Canonical test inventory differs: ${suite.name}"
                }
            }
            String totalRow = reportLines.find { it.startsWith('| **Total** |') }
            if (totalRow == null
                    || !totalRow.contains("**${evidence.tests.classes}**")
                    || !totalRow.contains("**${evidence.tests.tests}**")
                    || !totalRow.contains(
                    "**`${evidence.tests.executionStatus}`**")) {
                failures << 'Canonical aggregate test inventory differs'
            }
            if (!report.contains(evidence.source.mainSourceManifestSha256)) {
                failures << 'Canonical report omits the main-source manifest'
            }

            boolean interim = evidence.evidenceState == 'INTERIM'
            if (interim) {
                def requiredInterimStatuses = [
                        temporalArchitectureReady: 'PENDING_VERIFICATION',
                        inMemoryEngineWorkingReady: 'PENDING_VERIFICATION',
                        providerBackedReady: 'BLOCKED_SCOPE',
                        mandateAgentReady: 'BLOCKED_UPSTREAM',
                        playgroundLatencyReady: 'PENDING_VERIFICATION',
                        publicRcReady: 'BLOCKED'
                ]
                if (evidence.verdict != 'PENDING_VERIFICATION'
                        || evidence.status != requiredInterimStatuses) {
                    failures << 'Round 12 INTERIM verdict/status set is inconsistent'
                }
                if (evidence.source.candidateCommit != null
                        || evidence.source.binding
                        != 'BASE_COMMIT_PLUS_DIRTY_WORKTREE_MANIFEST'
                        || evidence.source.worktree != 'DIRTY'
                        || !evidence.source.dirtyReason) {
                    failures << 'Round 12 INTERIM source binding is inconsistent'
                }
                def executionStatuses = [
                        evidence.tests.executionStatus,
                        evidence.performance.round12Campaign.status,
                        evidence.performance.round12Campaign
                                .nbaLifecycleEvidence.status,
                        evidence.performance.round12Campaign
                                .sameScenarioP95.status,
                        evidence.structuralEvidence.status,
                        evidence.artifacts.status,
                        evidence.sourceArchive.extractedConfiguration,
                        evidence.sourceArchive.focusedTestsStatus,
                        evidence.sourceArchive.publishedArtifactSmokeBuild,
                        evidence.sourceArchive.detachedHashEvidence.status,
                        evidence.publicationEvidence.status
                ] + evidence.runtimes.collect { it.status }
                executionStatuses.addAll(evidence.proofs.collect { it.status })
                boolean hasWorktreeResults = executionStatuses.any {
                    it != 'PENDING_VERIFICATION'
                }
                if (evidence.executionBinding.kind == 'PENDING') {
                    if (hasWorktreeResults
                            || evidence.executionBinding
                            .mainSourceManifestSha256 != null
                            || evidence.executionBinding.candidateCommit != null) {
                        failures << 'Pending execution binding contains results'
                    }
                } else if (evidence.executionBinding.kind
                        == 'WORKTREE_EXECUTION') {
                    if (evidence.executionBinding.mainSourceManifestSha256
                            != evidence.source.mainSourceManifestSha256
                            || evidence.executionBinding.candidateCommit != null) {
                        failures << 'Worktree results are not manifest-bound'
                    }
                } else {
                    failures << 'INTERIM evidence has an invalid execution binding'
                }
                def resultFields = ['failures', 'errors', 'skipped']
                if (evidence.tests.executionStatus
                        == 'PENDING_VERIFICATION') {
                    if (resultFields.any { evidence.tests[it] != null }
                            || evidence.tests.suites.any {
                                it.status != 'PENDING_VERIFICATION'
                                        || resultFields.any { field ->
                                            it[field] != null
                                        }
                            }) {
                        failures << 'Pending test results contain measurements'
                    }
                } else if (resultFields.any {
                    !(evidence.tests[it] instanceof Number)
                } || evidence.tests.suites.any { suite ->
                    suite.status == 'PENDING_VERIFICATION'
                            || resultFields.any {
                                !(suite[it] instanceof Number)
                            }
                }) {
                    failures << 'Measured worktree test results are incomplete'
                } else if (evidence.tests.executionStatus == 'PASS'
                        && (resultFields.any { evidence.tests[it] != 0 }
                        || evidence.tests.suites.any { suite ->
                            suite.status != 'PASS'
                                    || resultFields.any { suite[it] != 0 }
                        })) {
                    failures << 'Passing worktree test results are inconsistent'
                }
                if (evidence.runtimes.any { runtime ->
                    runtime.status == 'PENDING_VERIFICATION'
                            ? runtime.durationSeconds != null
                            : !(runtime.durationSeconds instanceof Number)
                            || runtime.durationSeconds <= 0
                }) {
                    failures << 'Worktree runtime duration/status is inconsistent'
                }
                if (nbaEvidence.status == 'PENDING_VERIFICATION'
                        ? !nbaEvidence.evidenceFiles.empty
                        : nbaEvidence.evidenceFiles.empty) {
                    failures << 'Round 12 NBA evidence status is inconsistent'
                }
                if (sameScenarioP95.status == 'PENDING_VERIFICATION') {
                    if (sameScenarioP95.singleRunMs != null
                            || sameScenarioP95.repeatedP95Rows != null
                            || !sameScenarioP95.evidenceFiles.empty) {
                        failures << 'Pending Round 12 p95 evidence is not empty'
                    }
                } else if (sameScenarioP95.singleRunMs == null
                        || sameScenarioP95.repeatedP95Rows == null
                        || sameScenarioP95.evidenceFiles.empty) {
                    failures << 'Measured Round 12 p95 evidence is incomplete'
                }
                if (evidence.structuralEvidence.status
                        == 'PENDING_VERIFICATION') {
                    if (evidence.structuralEvidence.requiredZeroCounters.any {
                        key, value -> value != null
                    }) {
                        failures << 'Pending structural counters are not null'
                    }
                } else if (evidence.structuralEvidence
                        .requiredZeroCounters.any {
                            key, value -> !(value instanceof Number)
                        }) {
                    failures << 'Measured structural counters are incomplete'
                } else if (evidence.structuralEvidence.status == 'PASS'
                        && evidence.structuralEvidence.requiredZeroCounters.any {
                            key, value -> value != 0
                        }) {
                    failures << 'Passing structural counters are not zero'
                }
                if (evidence.artifacts.status == 'PENDING_VERIFICATION') {
                    if (artifactHashes.any {
                        evidence.artifacts[it] != null
                    }) {
                        failures << 'Pending artifact hashes are not null'
                    }
                } else if (artifactHashes.any {
                    !(evidence.artifacts[it] ==~ sha256Pattern)
                }) {
                    failures << 'Measured artifact hashes are incomplete'
                }
                def archiveStatuses = [
                        evidence.sourceArchive.extractedConfiguration,
                        evidence.sourceArchive.focusedTestsStatus,
                        evidence.sourceArchive.publishedArtifactSmokeBuild,
                        evidence.sourceArchive.detachedHashEvidence.status
                ]
                if (archiveStatuses.any { it == 'PENDING_VERIFICATION' }
                        ? !evidence.sourceArchive.pendingReason
                        : evidence.sourceArchive.pendingReason != null) {
                    failures << 'Worktree source-archive state is inconsistent'
                }
                if (evidence.publicationEvidence.status
                        == 'PENDING_VERIFICATION'
                        ? evidence.publicationEvidence.durationSeconds != null
                        : !(evidence.publicationEvidence.durationSeconds
                        instanceof Number)) {
                    failures << 'Worktree publication result is inconsistent'
                }
                if (!report.contains(
                        'ROUND12_INTERIM_VERIFICATION: PENDING_VERIFICATION')
                        || report.contains('ROUND12_FINAL_VERIFICATION:')) {
                    failures << 'Canonical report lacks the INTERIM marker'
                }
            } else {
                def sha1Pattern = ~/[0-9a-f]{40}/
                if (!(evidence.source.candidateCommit ==~ sha1Pattern)
                        || evidence.source.binding != 'CANDIDATE_COMMIT'
                        || evidence.source.worktree != 'CLEAN'
                        || evidence.source.dirtyReason != null
                        || evidence.executionBinding.kind
                        != 'CANDIDATE_COMMIT_EXECUTION'
                        || evidence.executionBinding.candidateCommit
                        != evidence.source.candidateCommit
                        || evidence.executionBinding.mainSourceManifestSha256
                        != evidence.source.mainSourceManifestSha256) {
                    failures << 'Round 12 FINAL source binding is inconsistent'
                }
                def resultFields = ['failures', 'errors', 'skipped']
                if (evidence.tests.executionStatus
                        == 'PENDING_VERIFICATION'
                        || resultFields.any {
                            !(evidence.tests[it] instanceof Number)
                        } || evidence.tests.suites.any { suite ->
                            suite.status == 'PENDING_VERIFICATION'
                                    || resultFields.any {
                                        !(suite[it] instanceof Number)
                                    }
                        }) {
                    failures << 'Round 12 FINAL test results are incomplete'
                }
                if (evidence.runtimes.any {
                    it.status == 'PENDING_VERIFICATION'
                            || !(it.durationSeconds instanceof Number)
                            || it.durationSeconds <= 0
                } || evidence.proofs.any {
                    it.status == 'PENDING_VERIFICATION'
                }) {
                    failures << 'Round 12 FINAL lanes/proofs are incomplete'
                }
                if (campaign.status == 'PENDING_VERIFICATION'
                        || nbaEvidence.status == 'PENDING_VERIFICATION'
                        || nbaEvidence.evidenceFiles.empty
                        || sameScenarioP95.status == 'PENDING_VERIFICATION'
                        || sameScenarioP95.singleRunMs == null
                        || sameScenarioP95.repeatedP95Rows == null
                        || sameScenarioP95.evidenceFiles.empty) {
                    failures << 'Round 12 FINAL performance is incomplete'
                }
                if (evidence.structuralEvidence.status
                        == 'PENDING_VERIFICATION'
                        || evidence.structuralEvidence.requiredZeroCounters.any {
                            key, value -> !(value instanceof Number)
                        }) {
                    failures << 'Round 12 FINAL counters are incomplete'
                }
                if (evidence.artifacts.status == 'PENDING_VERIFICATION'
                        || artifactHashes.any {
                            !(evidence.artifacts[it] ==~ sha256Pattern)
                        }) {
                    failures << 'Round 12 FINAL artifact hashes are incomplete'
                }
                if ([evidence.sourceArchive.extractedConfiguration,
                     evidence.sourceArchive.focusedTestsStatus,
                     evidence.sourceArchive.publishedArtifactSmokeBuild,
                     evidence.sourceArchive.detachedHashEvidence.status]
                        .any { it == 'PENDING_VERIFICATION' }
                        || evidence.sourceArchive.pendingReason != null) {
                    failures << 'Round 12 FINAL source archive is incomplete'
                }
                if (evidence.publicationEvidence.status
                        == 'PENDING_VERIFICATION'
                        || !(evidence.publicationEvidence.durationSeconds
                        instanceof Number)) {
                    failures << 'Round 12 FINAL publication is incomplete'
                }
                if (!report.contains(
                        "ROUND12_FINAL_VERIFICATION: ${evidence.verdict}")
                        || report.contains('ROUND12_INTERIM_VERIFICATION:')) {
                    failures << 'Canonical report lacks the FINAL marker'
                }
            }
            [
                    'docs/releases/3.0.0-rc.1-round11-test-report.md',
                    'docs/releases/3.0.0-rc.1-round11-evidence.json',
                    'docs/releases/3.0.0-rc.1-round12-test-report.md',
                    'docs/releases/3.0.0-rc.1-round12-evidence.json'
            ].each { duplicate ->
                if (file(duplicate).exists()) {
                    failures << "Duplicate release evidence surface remains: ${duplicate}"
                }
            }
            if (!failures.empty) {
                throw new GradleException(failures.join('\n'))
            }
            return
        }
        failures << 'Canonical evidence must use the Round 12 profile'
        if (!failures.empty) {
            throw new GradleException(failures.join('\n'))
        }
    }
}

tasks.register('verifySourceArchiveHygiene') {
    group = 'verification'
    description = 'Protects the self-contained source-release boundary.'
    inputs.files('.cz.toml', '.gitattributes', 'build.gradle')
    String configuredArchiveVersion = version.toString()
    doLast {
        String versionSource = file('.cz.toml').getText('UTF-8')
        def declaredVersions = versionSource =~
                /(?m)^version = "([^"]+)"$/
        if (!declaredVersions.find()
                || declaredVersions.group(1) != configuredArchiveVersion
                || declaredVersions.find()) {
            throw new GradleException(
                    '.cz.toml must contain one authoritative project version')
        }
        String attributes = file('.gitattributes').getText('UTF-8')
        [
                '*.zip export-ignore',
                'build/** export-ignore',
                '.gradle/** export-ignore',
                '__MACOSX/** export-ignore',
                '._* export-ignore',
                '*.jfr export-ignore',
                '*.hprof export-ignore'
        ].each { rule ->
            if (!attributes.contains(rule)) {
                throw new GradleException(
                        "Source archive rule is missing: ${rule}")
            }
        }
    }
}

