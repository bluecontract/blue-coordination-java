def junitTaskCounts = { String taskName ->
    File resultDirectory =
            layout.buildDirectory.dir(
                    "test-results/${taskName}")
                    .get().asFile
    def resultFiles = fileTree(resultDirectory) {
        include 'TEST-*.xml'
    }.files.sort { left, right ->
        left.name <=> right.name
    }
    if (resultFiles.isEmpty()) {
        throw new GradleException(
                "Required JUnit XML is missing for ${taskName}")
    }
    def counts = [
            total  : 0L,
            failed : 0L,
            skipped: 0L,
            cases  : new ArrayList<String>()
    ]
    resultFiles.each { resultFile ->
        def suite = new groovy.xml.XmlSlurper(
                false, false).parse(resultFile)
        counts.total += suite.@tests.toString().toLong()
        counts.failed +=
                (suite.@failures.toString() ?: '0').toLong()
        counts.failed +=
                (suite.@errors.toString() ?: '0').toLong()
        counts.skipped +=
                (suite.@skipped.toString() ?: '0').toLong()
        suite.testcase.each { testCase ->
            counts.cases.add(
                    testCase.@classname.toString()
                            + '#'
                            + testCase.@name.toString())
        }
    }
    counts.cases =
            new ArrayList<String>(
                    new TreeSet<String>(counts.cases))
    counts.passed =
            counts.total - counts.failed - counts.skipped
    if (counts.total <= 0L
            || counts.failed != 0L
            || counts.skipped != 0L) {
        throw new GradleException(
                "Required suite ${taskName} is not completely green: "
                        + counts)
    }
    return counts
}

def exactFinalReportConformanceEvidence = {
    File receiptFile ->
        if (!receiptFile.isFile()) {
            throw new GradleException(
                    "Final report conformance receipt is missing: "
                            + receiptFile)
        }
        def receipt =
                new groovy.json.JsonSlurper()
                        .parse(receiptFile)
        if (!(receipt instanceof Map)
                || !(receipt.executionCases
                instanceof List)) {
            throw new GradleException(
                    "Final report conformance receipt has no executable "
                            + "case evidence")
        }
        String specification =
                receipt.coordinationSpecification
                        ?.toString()
        String manifestSpecification =
                yamlScalar(
                        new File(
                                coordinationConformancePackageDirectory,
                                'manifest.yaml'),
                        'coordinationSpecification')
        if (specification
                != manifestSpecification
                || specification
                != 'blue-coordination/1.0') {
            throw new GradleException(
                    "Final report Coordination specification identity "
                            + "does not match the same-run receipt and "
                            + "fixture manifest")
        }

        def executionResult = { String kind ->
            def matching =
                    receipt.executionCases.findAll { item ->
                        item instanceof Map
                                && item.kind == kind
                    }
            long passed =
                    matching.count { item ->
                        item.status == 'passed'
                    }
            return [
                    required: (long) matching.size(),
                    passed  : passed
            ]
        }
        def behavior =
                executionResult('behavior')
        def portableGas =
                executionResult('portable-gas')
        def hostQuota =
                executionResult('host-quota')
        def total = [
                required:
                        (long) receipt.executionCases.size(),
                passed  :
                        (long) receipt.executionCases.count {
                            item ->
                                item instanceof Map
                                        && item.status == 'passed'
                        }
        ]
        def exactExpected = [
                behavior   : 65L,
                portableGas: 14L,
                hostQuota  : 7L,
                total      : 86L
        ]
        def observed = [
                behavior   : behavior,
                portableGas: portableGas,
                hostQuota  : hostQuota,
                total      : total
        ]
        def incomplete = observed.find { name, result ->
            long expected =
                    exactExpected.get(name)
            result.required != expected
                    || result.passed != expected
        }
        if (incomplete != null
                || receipt.executionCaseCount
                != total.required
                || receipt.passed
                != total.passed
                || receipt.failures != 0
                || receipt.skips != 0) {
            throw new GradleException(
                    "Final report requires exact green Coordination "
                            + "conformance evidence; observed="
                            + observed)
        }
        return [
                coordinationSpecification:
                        specification,
                behavior                  :
                        behavior,
                portableGas               :
                        portableGas,
                hostQuota                 :
                        hostQuota,
                total                     :
                        total
        ]
}

def exactFinalReportFlagshipEvidence = {
    Map<String, Object> taskCounts,
    Map<String, Object> exactEvidence ->
        if (taskCounts == null
                || taskCounts.total <= 0L
                || taskCounts.passed
                != taskCounts.total
                || taskCounts.failed != 0L
                || taskCounts.skipped != 0L) {
            throw new GradleException(
                    "Final report requires a green same-run flagship suite")
        }
        def matrix =
                exactEvidence.orderedStreams
                        ?.get(
                        'representationProviderMatrix')
        if (!(matrix instanceof List)
                || matrix.size() != 32) {
            throw new GradleException(
                    "Final report requires all 32 exact flagship "
                            + "representation/provider runs")
        }
        long forbiddenDemandCount = 0L
        [
                'descendants-only',
                'Root D1,D2'
        ].each { variant ->
            def requested =
                    new LinkedHashSet<String>(
                            exactEvidence.identitySets
                                    .get(
                                    variant
                                            + '/Provider requested BlueIds'))
            requested.retainAll(
                    exactEvidence.identitySets
                            .get(
                            variant
                                    + '/Forbidden BlueIds'))
            forbiddenDemandCount +=
                    requested.size()
        }
        if (forbiddenDemandCount != 0L) {
            throw new GradleException(
                    "Final report rejected forbidden flagship provider "
                            + "demands: " + forbiddenDemandCount)
        }
        return [
                runs:
                        [
                                required: 32L,
                                passed  : (long) matrix.size()
                        ],
                forbiddenProviderDemandCount:
                        forbiddenDemandCount
        ]
}

def exactFinalReportMaximumRuntimeTraceEntries = {
    Map<String, Object> taskCounts ->
        String scalingCase =
                'blue.coordination.processor.'
                        + 'CoordinationRuntimeGasScalingTest'
                        + '#shouldRetainTheFullTraceForA129MemberCompositeScan()'
        if (taskCounts == null
                || taskCounts.total <= 0L
                || taskCounts.passed
                != taskCounts.total
                || taskCounts.cases.count {
                    it == scalingCase
                } != 1) {
            throw new GradleException(
                    "Final report requires the green 129-member runtime "
                            + "trace scaling test")
        }
        File resultDirectory =
                layout.buildDirectory.dir(
                        'test-results/coordinationRuntimeGasTest')
                        .get().asFile
        String scalingClass =
                'blue.coordination.processor.'
                        + 'CoordinationRuntimeGasScalingTest'
        String metricPrefix =
                'coordination.maximumRuntimeTraceEntriesObserved='
        def metricValues =
                new ArrayList<String>()
        def scalingSuites =
                new ArrayList<String>()
        fileTree(resultDirectory) {
            include 'TEST-*.xml'
        }.files.sort { left, right ->
            left.name <=> right.name
        }.each { resultFile ->
            def suite =
                    new groovy.xml.XmlSlurper(
                            false, false)
                            .parse(resultFile)
            if (suite.@name.toString()
                    == scalingClass) {
                scalingSuites.add(
                        resultFile.name)
                suite.'system-out'.text()
                        .readLines()
                        .findAll {
                            it.startsWith(
                                    metricPrefix)
                        }
                        .each { metricLine ->
                            metricValues.add(
                                    metricLine.substring(
                                            metricPrefix.length()))
                        }
            }
        }
        if (scalingSuites.size() != 1
                || metricValues.size() != 1) {
            throw new GradleException(
                    "Final report requires exactly one same-run runtime "
                            + "scaling metric; suites=" + scalingSuites
                            + ", values=" + metricValues)
        }
        File gasFixtureEvidence =
                new File(
                        coordinationConformancePackageDirectory,
                        'gas-fixtures.yaml')
        long required
        long observed
        try {
            required =
                    Long.parseLong(
                            yamlScalar(
                                    gasFixtureEvidence,
                                    'compositeProofRequiredTraceEntries'))
            observed =
                    Long.parseLong(
                            metricValues[0])
        } catch (NumberFormatException invalid) {
            throw new GradleException(
                    "Final report runtime scaling evidence is not an "
                            + "exact integer",
                    invalid)
        }
        long fixtureObserved
        try {
            fixtureObserved =
                    Long.parseLong(
                            yamlScalar(
                                    gasFixtureEvidence,
                                    'compositeProofObservedTraceEntries'))
        } catch (NumberFormatException invalid) {
            throw new GradleException(
                    "Final report runtime scaling fixture cross-check is "
                            + "not an exact integer",
                    invalid)
        }
        if (required != 516L
                || observed != required
                || fixtureObserved != observed) {
            throw new GradleException(
                    "Final report requires the green scaling proof to "
                            + "retain exactly 516 runtime trace entries; "
                            + "required=" + required
                            + ", observed=" + observed
                            + ", fixtureObserved=" + fixtureObserved)
        }
        return observed
}

def readExactReleaseCheckEvidence = {
    File evidenceFile, String label ->
        if (!evidenceFile.isFile()) {
            throw new GradleException(
                    "${label} evidence is missing: ${evidenceFile}")
        }
        def values =
                new LinkedHashMap<String, List<String>>()
        evidenceFile.readLines('UTF-8').eachWithIndex {
            line, index ->
                int separator =
                        line.indexOf('=')
                if (line.trim().isEmpty()
                        || separator <= 0
                        || separator
                        == line.length() - 1) {
                    throw new GradleException(
                            "${label} evidence line ${index + 1} is not "
                                    + "an exact key=value record")
                }
                String key =
                        line.substring(0, separator)
                String value =
                        line.substring(separator + 1)
                if (!(key
                        ==~ /[A-Za-z][A-Za-z0-9.]*/)
                        || value.trim() != value) {
                    throw new GradleException(
                            "${label} evidence contains a non-canonical "
                                    + "record: " + line)
                }
                if (!values.containsKey(key)) {
                    values.put(
                            key,
                            new ArrayList<String>())
                }
                values.get(key).add(value)
        }
        if (values.isEmpty()) {
            throw new GradleException(
                    "${label} evidence is empty")
        }
        return values
}

def exactReleaseCheckValue = {
    Map<String, List<String>> evidence,
    String key,
    String label ->
        def values =
                evidence.get(key)
        if (!(values instanceof List)
                || values.size() != 1
                || values[0].isEmpty()) {
            throw new GradleException(
                    "${label} evidence must contain exactly one ${key}")
        }
        return values[0]
}

def exactFinalReportBinaryApiResult = {
    File reportFile, File currentJar ->
        def evidence =
                readExactReleaseCheckEvidence(
                        reportFile,
                        'Binary API')
        def allowedKeys = [
                'baseline',
                'baselineJar',
                'expectedBaselineSha256',
                'baselineSha256',
                'currentJar',
                'baselineApiClasses',
                'currentApiClasses',
                'compatible',
                'documentedPreFinalRemoval',
                'problem'
        ] as Set
        String expectedBaseline =
                exactReleaseCheckValue(
                        evidence,
                        'expectedBaselineSha256',
                        'Binary API')
        String baselineJarName =
                exactReleaseCheckValue(
                        evidence,
                        'baselineJar',
                        'Binary API')
        long baselineApiClasses
        long currentApiClasses
        try {
            baselineApiClasses =
                    Long.parseLong(
                            exactReleaseCheckValue(
                                    evidence,
                                    'baselineApiClasses',
                                    'Binary API'))
            currentApiClasses =
                    Long.parseLong(
                            exactReleaseCheckValue(
                                    evidence,
                                    'currentApiClasses',
                                    'Binary API'))
        } catch (NumberFormatException invalid) {
            throw new GradleException(
                    "Binary API evidence contains a non-integer class "
                            + "count",
                    invalid)
        }
        if (!(allowedKeys.containsAll(
                evidence.keySet()))
                || exactReleaseCheckValue(
                evidence,
                'baseline',
                'Binary API')
                != 'blue.coordination:blue-coordination-java:'
                .concat(
                        binaryCompatibilityBaselineVersion)
                || exactReleaseCheckValue(
                evidence,
                'currentJar',
                'Binary API')
                != currentJar.name
                || !baselineJarName.endsWith('.jar')
                || baselineApiClasses <= 0L
                || currentApiClasses <= 0L
                || expectedBaseline
                != binaryCompatibilityBaselineSha256
                || exactReleaseCheckValue(
                evidence,
                'baselineSha256',
                'Binary API')
                != expectedBaseline
                || exactReleaseCheckValue(
                evidence,
                'compatible',
                'Binary API')
                != 'true'
                || evidence.containsKey('problem')) {
            throw new GradleException(
                    "Final report rejected the same-run Binary API "
                            + "compatibility result")
        }
        return 'compatible'
}

def exactFinalReportJava8BytecodeResult = {
    File reportFile, File currentJar ->
        def evidence =
                readExactReleaseCheckEvidence(
                        reportFile,
                        'Java 8 bytecode')
        def expectedKeys = [
                'jar',
                'classCount',
                'maximumAllowedMajorVersion',
                'maximumObservedMajorVersion',
                'compatible'
        ] as Set
        long classCount
        long maximumAllowed
        long maximumObserved
        try {
            classCount =
                    Long.parseLong(
                            exactReleaseCheckValue(
                                    evidence,
                                    'classCount',
                                    'Java 8 bytecode'))
            maximumAllowed =
                    Long.parseLong(
                            exactReleaseCheckValue(
                                    evidence,
                                    'maximumAllowedMajorVersion',
                                    'Java 8 bytecode'))
            maximumObserved =
                    Long.parseLong(
                            exactReleaseCheckValue(
                                    evidence,
                                    'maximumObservedMajorVersion',
                                    'Java 8 bytecode'))
        } catch (NumberFormatException invalid) {
            throw new GradleException(
                    "Java 8 bytecode evidence contains a non-integer "
                            + "class or version count",
                    invalid)
        }
        if ((evidence.keySet() as Set)
                != expectedKeys
                || exactReleaseCheckValue(
                evidence,
                'jar',
                'Java 8 bytecode')
                != currentJar.name
                || classCount <= 0L
                || maximumAllowed != 52L
                || maximumObserved <= 0L
                || maximumObserved > maximumAllowed
                || exactReleaseCheckValue(
                evidence,
                'compatible',
                'Java 8 bytecode')
                != 'true'
                || evidence.containsKey('problem')) {
            throw new GradleException(
                    "Final report rejected the same-run Java 8 bytecode "
                            + "result")
        }
        return 'compatible'
}

def exactFinalReportArchiveReproducibilityResult = {
    File reportFile, Map<String, File> primaryArchives ->
        def evidence =
                readExactReleaseCheckEvidence(
                        reportFile,
                        'Archive reproducibility')
        def expectedKeys =
                new LinkedHashSet<String>()
        primaryArchives.keySet().each { name ->
            expectedKeys.add("${name}.primary")
            expectedKeys.add("${name}.independent")
            expectedKeys.add("${name}.reproducible")
        }
        if ((evidence.keySet() as Set)
                != expectedKeys) {
            throw new GradleException(
                    "Archive reproducibility evidence has an unexpected "
                            + "record inventory: " + evidence.keySet())
        }
        primaryArchives.each { name, archive ->
            String primary =
                    exactReleaseCheckValue(
                            evidence,
                            "${name}.primary",
                            'Archive reproducibility')
            String independent =
                    exactReleaseCheckValue(
                            evidence,
                            "${name}.independent",
                            'Archive reproducibility')
            if (!(primary ==~ /[0-9a-f]{64}/)
                    || primary
                    != sha256File(archive)
                    || independent != primary
                    || exactReleaseCheckValue(
                    evidence,
                    "${name}.reproducible",
                    'Archive reproducibility')
                    != 'true') {
                throw new GradleException(
                        "Final report rejected same-run reproducibility "
                                + "evidence for " + name)
            }
        }
        return 'reproducible'
}

def gitText = { File directory, String... arguments ->
    def command = new ArrayList<String>()
    command.add('git')
    command.addAll(Arrays.asList(arguments))
    Process process = new ProcessBuilder(command)
            .directory(directory)
            .redirectErrorStream(true)
            .start()
    String output = process.inputStream.getText('UTF-8').trim()
    int exitCode = process.waitFor()
    if (exitCode != 0) {
        throw new GradleException(
                "Git command failed in ${directory}: "
                        + command + "\n" + output)
    }
    return output
}

def gitBytes = { File directory, String... arguments ->
    def command = new ArrayList<String>()
    command.add('git')
    command.addAll(Arrays.asList(arguments))
    Process process = new ProcessBuilder(command)
            .directory(directory)
            .start()
    byte[] output = process.inputStream.bytes
    String diagnostic =
            process.errorStream.getText('UTF-8')
    int exitCode = process.waitFor()
    if (exitCode != 0) {
        throw new GradleException(
                "Git command failed in ${directory}: "
                        + command + "\n" + diagnostic.trim())
    }
    return output
}

def protectedRepositoryBaselineEvidence = {
    if (!coordinationReleaseBaselineFile.isFile()) {
        throw new GradleException(
                "Coordination release baseline is missing: "
                        + coordinationReleaseBaselineFile)
    }
    def releaseBaseline =
            new groovy.json.JsonSlurper()
                    .parse(
                            coordinationReleaseBaselineFile)
    def expected =
            releaseBaseline
                    .repositories
                    .repository
    byte[] trackedDiff =
            gitBytes(
                    blueRepositorySourceRoot,
                    'diff',
                    '--binary',
                    'HEAD')
    String trackedDiffSha256 =
            sha256Bytes(
                    trackedDiff)
    int trackedChangeCount =
            new String(
                    gitBytes(
                            blueRepositorySourceRoot,
                            'diff',
                            '--name-only',
                            '-z',
                            'HEAD'),
                    java.nio.charset.StandardCharsets.UTF_8)
                    .split('\u0000', -1)
                    .findAll { !it.isEmpty() }
                    .size()
    int untrackedPathCount =
            new String(
                    gitBytes(
                            blueRepositorySourceRoot,
                            'ls-files',
                            '--others',
                            '--exclude-standard',
                            '-z'),
                    java.nio.charset.StandardCharsets.UTF_8)
                    .split('\u0000', -1)
                    .findAll { !it.isEmpty() }
                    .size()
    if (expected.commit?.toString()
            != siblingSourceLock.getProperty(
                    'blueRepositoryCommit')
            || trackedDiffSha256
            != expected.trackedBinaryDiffSha256
            ?.toString()
            || trackedChangeCount
            != (expected.trackedChangeCount as int)
            || untrackedPathCount
            != (expected.untrackedPathCount as int)) {
        throw new GradleException(
                "Protected Repository state changed from the saved "
                        + "pre-implementation baseline: commit="
                        + expected.commit
                        + ", trackedChangeCount="
                        + trackedChangeCount
                        + ", untrackedPathCount="
                        + untrackedPathCount
                        + ", trackedBinaryDiffSha256="
                        + trackedDiffSha256)
    }
    return [
            trackedBinaryDiffSha256:
                    trackedDiffSha256,
            trackedChangeCount:
                    trackedChangeCount,
            untrackedPathCount:
                    untrackedPathCount
    ]
}

