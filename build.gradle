def yamlScalar = { File source, String key ->
    if (!source.isFile()) {
        throw new GradleException(
                "Required YAML evidence is missing: ${source}")
    }
    String prefix = "${key}:"
    def matches = source.readLines('UTF-8').findAll {
        it.startsWith(prefix)
    }
    if (matches.size() != 1) {
        throw new GradleException(
                "Expected exactly one ${key} in ${source}, "
                        + "found ${matches.size()}")
    }
    String value = matches[0].substring(prefix.length()).trim()
    if ((value.startsWith("'") && value.endsWith("'"))
            || (value.startsWith('"') && value.endsWith('"'))) {
        value = value.substring(1, value.length() - 1)
    }
    if (value.isEmpty()) {
        throw new GradleException(
                "Required YAML value ${key} is empty in ${source}")
    }
    return value
}

def yamlScalarAnywhere = { File source, String key ->
    if (!source.isFile()) {
        throw new GradleException(
                "Required YAML evidence is missing: ${source}")
    }
    String prefix = "${key}:"
    def matches = source.readLines('UTF-8').collect {
        it.trim()
    }.findAll {
        it.startsWith(prefix)
    }
    if (matches.size() != 1) {
        throw new GradleException(
                "Expected exactly one ${key} in ${source}, "
                        + "found ${matches.size()}")
    }
    String value =
            matches[0].substring(prefix.length()).trim()
    if ((value.startsWith("'") && value.endsWith("'"))
            || (value.startsWith('"') && value.endsWith('"'))) {
        value = value.substring(1, value.length() - 1)
    }
    if (value.isEmpty()) {
        throw new GradleException(
                "Required YAML value ${key} is empty in ${source}")
    }
    return value
}

def yamlTopLevelSequence = {
    File source, String key ->
        if (!source.isFile()) {
            throw new GradleException(
                    "Required YAML evidence is missing: ${source}")
        }
        def lines = source.readLines('UTF-8')
        String header = "${key}:"
        def indexes = (0..<lines.size()).findAll {
            lines[it] == header
        }
        if (indexes.size() != 1) {
            throw new GradleException(
                    "Expected exactly one top-level ${key} sequence in "
                            + source + ", found " + indexes.size())
        }
        def result = new ArrayList<String>()
        for (int index = indexes[0] + 1;
             index < lines.size();
             index++) {
            String line = lines[index]
            if (line.startsWith('- ')) {
                String value = line.substring(2).trim()
                if ((value.startsWith("'")
                        && value.endsWith("'"))
                        || (value.startsWith('"')
                        && value.endsWith('"'))) {
                    value = value.substring(
                            1, value.length() - 1)
                }
                if (value.isEmpty()) {
                    throw new GradleException(
                            "Empty ${key} item in ${source}")
                }
                result.add(value)
            } else if (!line.trim().isEmpty()) {
                break
            }
        }
        if (result.isEmpty()
                || (result as Set).size()
                != result.size()) {
            throw new GradleException(
                    "Top-level ${key} sequence in ${source} must "
                            + "be non-empty and unique")
        }
        return result
}

def yamlInputVariantNames = { File source ->
    if (!source.isFile()) {
        throw new GradleException(
                "Required YAML evidence is missing: ${source}")
    }
    def lines = source.readLines('UTF-8')
    def indexes = (0..<lines.size()).findAll {
        lines[it] == '  variants:'
    }
    if (indexes.isEmpty()) {
        return ['default']
    }
    if (indexes.size() != 1) {
        throw new GradleException(
                "Expected at most one input.variants sequence in "
                        + source + ", found " + indexes.size())
    }
    def result = new ArrayList<String>()
    for (int index = indexes[0] + 1;
         index < lines.size();
         index++) {
        String line = lines[index]
        if (!line.trim().isEmpty()
                && !line.startsWith('  ')) {
            break
        }
        if (line.startsWith('  - name: ')) {
            String value = line.substring(
                    '  - name: '.length()).trim()
            if ((value.startsWith("'")
                    && value.endsWith("'"))
                    || (value.startsWith('"')
                    && value.endsWith('"'))) {
                value = value.substring(
                        1, value.length() - 1)
            }
            if (value.isEmpty()) {
                throw new GradleException(
                        "Empty input.variants name in ${source}")
            }
            result.add(value)
        }
    }
    if (result.isEmpty()
            || (result as Set).size()
            != result.size()) {
        throw new GradleException(
                "input.variants in ${source} must be non-empty "
                        + "and unique")
    }
    return result
}

def yamlMappingSection = {
    File source, String section ->
        if (!source.isFile()) {
            throw new GradleException(
                    "Required YAML evidence is missing: ${source}")
        }
        def lines = source.readLines('UTF-8')
        String header = "${section}:"
        def indexes = (0..<lines.size()).findAll {
            lines[it] == header
        }
        if (indexes.size() != 1) {
            throw new GradleException(
                    "Expected exactly one top-level ${section} mapping in "
                            + source + ", found " + indexes.size())
        }
        def result = new LinkedHashMap<String, String>()
        for (int index = indexes[0] + 1;
             index < lines.size();
             index++) {
            String line = lines[index]
            if (line.trim().isEmpty()) {
                continue
            }
            if (!line.startsWith('  ')) {
                break
            }
            def match =
                    (line =~ /^  ([A-Za-z][A-Za-z0-9]*):\s*(.+)$/)
            if (!match.matches()) {
                throw new GradleException(
                        "Unsupported ${section} entry in ${source}: "
                                + line)
            }
            String key = match.group(1)
            String value = match.group(2).trim()
            if ((value.startsWith("'")
                    && value.endsWith("'"))
                    || (value.startsWith('"')
                    && value.endsWith('"'))) {
                value = value.substring(
                        1, value.length() - 1)
            }
            if (value.isEmpty()
                    || result.put(key, value) != null) {
                throw new GradleException(
                        "Invalid duplicate or empty ${section}.${key} "
                                + "in ${source}")
            }
        }
        if (result.isEmpty()) {
            throw new GradleException(
                    "Top-level ${section} mapping is empty in ${source}")
        }
        return result
}

def requireYamlValues = {
    File source, Map<String, String> expected,
    boolean allowIndented ->
        expected.each { String key, String required ->
            String actual = allowIndented
                    ? yamlScalarAnywhere(source, key)
                    : yamlScalar(source, key)
            if (actual != required) {
                throw new GradleException(
                        "Closed Coordination metadata ${source}.${key} "
                                + "must be ${required}, found ${actual}")
            }
        }
}

def authoredCoordinationConformanceCases = {
    File vectorCoverageFile =
            new File(
                    coordinationConformancePackageDirectory,
                    'vector-coverage.yaml')
    def coverageEntries =
            new ArrayList<Map<String, Object>>()
    Map<String, Object> current = null
    boolean inBehaviorVectors = false
    boolean inCases = false
    def finishCoverageEntry = {
        if (current == null) {
            return
        }
        if (!(current.vector instanceof String)
                || !(current.fixture instanceof String)
                || !(current.cases instanceof List)
                || current.cases.isEmpty()) {
            throw new GradleException(
                    "Incomplete behavior vector entry in "
                            + vectorCoverageFile + ": " + current)
        }
        coverageEntries.add(current)
        current = null
        inCases = false
    }
    vectorCoverageFile.readLines('UTF-8').each {
        String line ->
            if (line == 'behaviorVectors:') {
                if (inBehaviorVectors) {
                    throw new GradleException(
                            "Duplicate behaviorVectors section in "
                                    + vectorCoverageFile)
                }
                inBehaviorVectors = true
                return
            }
            if (line == 'sharedGasVector:') {
                finishCoverageEntry()
                inBehaviorVectors = false
                return
            }
            if (!inBehaviorVectors) {
                return
            }
            if (line.startsWith('- vector: ')) {
                finishCoverageEntry()
                current = [
                        vector :
                                line.substring(
                                        '- vector: '.length())
                                        .trim(),
                        fixture: null,
                        cases  :
                                new ArrayList<String>()
                ]
                return
            }
            if (current == null) {
                if (!line.trim().isEmpty()) {
                    throw new GradleException(
                            "Unexpected behaviorVectors entry in "
                                    + vectorCoverageFile + ": " + line)
                }
                return
            }
            if (line.startsWith('  fixture: ')) {
                current.fixture =
                        line.substring(
                                '  fixture: '.length())
                                .trim()
                return
            }
            if (line == '  cases:') {
                inCases = true
                return
            }
            if (inCases && line.startsWith('  - ')) {
                current.cases.add(
                        line.substring(4).trim())
                return
            }
            if (!line.trim().isEmpty()) {
                throw new GradleException(
                        "Unexpected behaviorVectors entry in "
                                + vectorCoverageFile + ": " + line)
            }
    }
    finishCoverageEntry()

    def sharedGas =
            yamlMappingSection(
                    vectorCoverageFile,
                    'sharedGasVector')
    if ((sharedGas.keySet() as Set)
            != ([
            'vector',
            'portableFixtureCount',
            'hostQuotaFixtureCount'
    ] as Set)
            || sharedGas.portableFixtureCount != '14'
            || sharedGas.hostQuotaFixtureCount != '7') {
        throw new GradleException(
                "Invalid sharedGasVector metadata in "
                        + vectorCoverageFile + ": " + sharedGas)
    }
    String sharedGasVector = sharedGas.vector

    def expected =
            new TreeMap<String, Map<String, Object>>()
    coverageEntries.each { entry ->
        String fixture = entry.fixture
        File fixtureSource =
                new File(
                        coordinationConformancePackageDirectory,
                        fixture)
        String fixtureId =
                yamlScalar(fixtureSource, 'id')
        String operation =
                yamlScalar(fixtureSource, 'operation')
        def fixtureVectors =
                yamlTopLevelSequence(
                        fixtureSource,
                        'vectors')
        if (fixtureVectors
                != [entry.vector]) {
            throw new GradleException(
                    "Behavior vector metadata disagrees with "
                            + fixture + ": coverage="
                            + entry.vector + ", fixture="
                            + fixtureVectors)
        }
        def fixtureVariants =
                yamlInputVariantNames(fixtureSource)
        def coverageVariants =
                entry.cases.collect { caseIdValue ->
                    String caseId =
                            caseIdValue.toString()
                    int separator =
                            caseId.lastIndexOf('@')
                    separator >= 0
                            ? caseId.substring(
                                    separator + 1)
                            : ''
                }
        if (coverageVariants != fixtureVariants) {
            throw new GradleException(
                    "Behavior variant metadata disagrees with "
                            + fixture + ": coverage="
                            + coverageVariants + ", fixture="
                            + fixtureVariants)
        }
        entry.cases.each { caseIdValue ->
            String caseId = caseIdValue.toString()
            int separator = caseId.lastIndexOf('@')
            if (separator <= 0
                    || separator == caseId.length() - 1
                    || caseId.substring(0, separator)
                    != fixtureId) {
                throw new GradleException(
                        "Behavior case identity disagrees with "
                                + fixture + ": " + caseId)
            }
            def authored = [
                    id       : caseId,
                    fixture  : fixture,
                    kind     : 'behavior',
                    operation: operation,
                    variant  :
                            caseId.substring(
                                    separator + 1),
                    vectors  :
                            new ArrayList<String>(
                                    fixtureVectors)
            ]
            if (expected.put(caseId, authored) != null) {
                throw new GradleException(
                        "Duplicate authored Coordination case id: "
                                + caseId)
            }
        }
    }

    File gasInventory =
            new File(
                    coordinationConformancePackageDirectory,
                    'gas-fixtures.yaml')
    def gasFixtures = gasInventory.readLines('UTF-8')
            .findAll {
                it.startsWith('  resource: ')
            }
            .collect {
                it.substring(
                        '  resource: '.length())
                        .trim()
            }
    if ((gasFixtures as Set).size()
            != gasFixtures.size()) {
        throw new GradleException(
                "Duplicate gas fixture resource in "
                        + gasInventory)
    }
    gasFixtures.each { fixture ->
        String kind
        if (fixture.startsWith('fixtures/gas-micro/')) {
            kind = 'portable-gas'
        } else if (fixture.startsWith(
                'fixtures/host-quota/')) {
            kind = 'host-quota'
        } else {
            throw new GradleException(
                    "Unknown gas fixture ownership: "
                            + fixture)
        }
        File fixtureSource =
                new File(
                        coordinationConformancePackageDirectory,
                        fixture)
        String fixtureId =
                yamlScalar(fixtureSource, 'id')
        String caseId = fixtureId
        def authored = [
                id       : caseId,
                fixture  : fixture,
                kind     : kind,
                operation:
                        yamlScalar(
                                fixtureSource,
                                'operation'),
                variant  : 'default',
                vectors  :
                        [sharedGasVector]
        ]
        if (expected.put(caseId, authored) != null) {
            throw new GradleException(
                    "Duplicate authored Coordination case id: "
                            + caseId)
        }
    }

    def expectedKinds =
            expected.values()
                    .countBy { it.kind }
    def expectedVectors =
            expected.values()
                    .collectMany { it.vectors }
                    .toSet()
    if (expected.size()
            != requiredCoordinationConformanceCounts
                    .executionCaseCount
            || expectedKinds.behavior != 65
            || expectedKinds['portable-gas'] != 14
            || expectedKinds['host-quota'] != 7
            || expectedVectors.size()
            != requiredCoordinationConformanceCounts
                    .vectorCount) {
        throw new GradleException(
                "Authored Coordination case matrix is not the "
                        + "closed 86-case inventory: cases="
                        + expected.size() + ", kinds="
                        + expectedKinds + ", vectors="
                        + expectedVectors.size())
    }
    return expected
}

def calculatedCoordinationConformanceIdentity = {
    File packageDirectory ->
        if (!packageDirectory.isDirectory()) {
            throw new GradleException(
                    "Coordination conformance package is missing: "
                            + packageDirectory)
        }
        def entries = fileTree(packageDirectory).files.collect { source ->
            String relative = packageDirectory.toPath()
                    .relativize(source.toPath())
                    .toString()
                    .replace(
                            java.io.File.separatorChar,
                            '/' as char)
            [source: source, relative: relative]
        }.sort { left, right ->
            left.relative <=> right.relative
        }
        if (entries.isEmpty()) {
            throw new GradleException(
                    "Coordination conformance package is empty: "
                            + packageDirectory)
        }
        def digest =
                java.security.MessageDigest.getInstance('SHA-256')
        entries.each { entry ->
            byte[] content = entry.source.bytes
            if (entry.relative == 'manifest.yaml') {
                String original =
                        new String(content, 'UTF-8')
                String normalized = original.replaceAll(
                        '(?m)^packageIdentity:.*$',
                        'packageIdentity: null')
                if (normalized == original) {
                    throw new GradleException(
                            "Conformance manifest has no packageIdentity")
                }
                content = normalized.getBytes('UTF-8')
            }
            digest.update(entry.relative.getBytes('UTF-8'))
            digest.update(0 as byte)
            digest.update(content)
            digest.update(0 as byte)
        }
        String value = digest.digest().collect {
            String.format('%02x', it & 0xff)
        }.join()
        return "sha256:${value}"
}

def requiredReceiptGitCommit = {
    File directory, String label ->
        def command = [
                'git',
                'rev-parse',
                'HEAD'
        ]
        Process process = new ProcessBuilder(command)
                .directory(directory)
                .redirectErrorStream(true)
                .start()
        String output =
                process.inputStream
                        .getText('UTF-8')
                        .trim()
        int exitCode = process.waitFor()
        if (exitCode != 0
                || !(output ==~ /[0-9a-f]{40}/)) {
            throw new GradleException(
                    "Coordination conformance receipt requires an exact "
                            + "${label} Git commit, found ${output}")
        }
        return output
}

def requiredReceiptArtifact = {
    String groupId,
    String artifactId,
    String expectedVersion,
    String expectedBuildPath,
    File expectedProjectDirectory ->
        def matches =
                configurations.runtimeClasspath
                        .resolvedConfiguration
                        .resolvedArtifacts
                        .findAll { artifact ->
                            artifact.moduleVersion.id.group
                                    == groupId
                                    && artifact.name
                                    == artifactId
                                    && artifact.extension
                                    == 'jar'
                        }
        if (matches.size() != 1) {
            throw new GradleException(
                    "Coordination conformance receipt requires exactly "
                            + "one ${groupId}:${artifactId} JAR, found "
                            + matches.size())
        }
        def match = matches[0]
        def component =
                match.id.componentIdentifier
        File artifact =
                match.file.canonicalFile
        File expectedDirectory =
                expectedProjectDirectory.canonicalFile
        if (match.moduleVersion.id.version
                != expectedVersion
                || !(component instanceof
                org.gradle.api.artifacts.component.ProjectComponentIdentifier)
                || component.build.buildPath
                != expectedBuildPath
                || component.projectPath != ':'
                || component.buildTreePath
                != expectedBuildPath
                || !artifact.isFile()
                || !artifact.toPath()
                .startsWith(expectedDirectory.toPath())) {
            throw new GradleException(
                    "Coordination conformance receipt rejected unknown "
                            + "${groupId}:${artifactId} artifact identity: "
                            + match.moduleVersion.id + " / "
                            + component + " / " + artifact)
        }
        return artifact
}

