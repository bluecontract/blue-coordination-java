buildscript {
    dependencies {
        classpath 'org.apache.groovy:groovy-toml:4.0.22'
    }
}

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    id 'org.jreleaser' version '1.24.0'
    id 'me.champeau.jmh' version '0.7.3'
}

group = 'blue.coordination'
version = determineProjectVersion()

def requiredLocalProjectVersion = { String relativeProject ->
    def versionFile = file("${relativeProject}/.cz.toml")
    if (!versionFile.isFile()) {
        throw new GradleException(
                "Required local project version file is missing: ${versionFile}")
    }
    def parsed = new groovy.toml.TomlSlurper().parse(versionFile)
    def value = parsed.tool?.commitizen?.version?.toString()
    if (value == null || value.trim().isEmpty()) {
        throw new GradleException(
                "Required local project version is missing from ${versionFile}")
    }
    return value
}
def blueRepositorySourceRoot =
        file('../blue-repository-java')
                .canonicalFile
def blueRepositoryCompositePath =
        providers.gradleProperty(
                'blueRepositoryCompositePath')
                .orNull
        ?: System.getProperty(
                'org.gradle.project.blueRepositoryCompositePath')
if (blueRepositoryCompositePath == null
        || blueRepositoryCompositePath.trim().isEmpty()) {
    throw new GradleException(
            "settings.gradle did not export the exact immutable local "
                    + "Repository composite path")
}
def blueRepositoryCompositeRoot =
        file(
                blueRepositoryCompositePath)
                .canonicalFile
def blueLanguageVersion =
        requiredLocalProjectVersion('../blue-language-java')
def blueBexVersion =
        requiredLocalProjectVersion('../blue-bex-java')
def blueRepositoryVersion =
        requiredLocalProjectVersion(
                blueRepositoryCompositeRoot
                        .absolutePath)
def effectiveLocalProjectVersion = { String declaredVersion ->
    return declaredVersion
            .concat(!System.getenv('CI') ? '-SNAPSHOT' : '')
}
def siblingSourceLockFile =
        file('gradle/blue-sibling-lock.properties')
def coordinationReleaseBaselineFile =
        file('gradle/coordination-release-baseline.json')
if (!siblingSourceLockFile.isFile()) {
    throw new GradleException(
            "Required sibling source lock is missing: "
                    + siblingSourceLockFile)
}
def siblingSourceLock = new Properties()
siblingSourceLockFile.withInputStream {
    siblingSourceLock.load(it)
}
def requiredSiblingSourceLockKeys = [
        'blueLanguageCommit',
        'blueBexCommit',
        'blueRepositoryCommit'
] as Set
if ((siblingSourceLock.keySet() as Set)
        != requiredSiblingSourceLockKeys) {
    throw new GradleException(
            "Sibling source lock must contain exactly "
                    + requiredSiblingSourceLockKeys)
}
requiredSiblingSourceLockKeys.each { key ->
    if (!(siblingSourceLock.getProperty(key)
            ==~ /[0-9a-f]{40}/)) {
        throw new GradleException(
                "Sibling source lock ${key} must be an exact Git SHA")
    }
}
def currentLanguageSourceCommit = {
    def command = [
            'git',
            '-C',
            file('../blue-language-java').absolutePath,
            'rev-parse',
            'HEAD'
    ]
    def process = new ProcessBuilder(command)
            .redirectErrorStream(true)
            .start()
    def output = process.inputStream.getText('UTF-8').trim()
    def exitCode = process.waitFor()
    if (exitCode != 0
            || !(output ==~ /[0-9a-f]{40}/)) {
        throw new GradleException(
                "Cannot resolve the exact current Language source commit: "
                        + output)
    }
    return output
}.call()
def binaryCompatibilityBaselineVersion = '2.0.0-rc.4'
def binaryCompatibilityBaselineSha256 =
        'e9a7988d347856e0b0d350d456931b5ba947b3852f0117b9f97f93198398a4c4'
def requestedBinaryCompatibilityBaseline =
        providers.gradleProperty(
                'binaryCompatibilityBaselineVersion').orNull
if (requestedBinaryCompatibilityBaseline != null
        && requestedBinaryCompatibilityBaseline
        != binaryCompatibilityBaselineVersion) {
    throw new GradleException(
            "binaryCompatibilityBaselineVersion is pinned to "
                    + binaryCompatibilityBaselineVersion
                    + "; requested "
                    + requestedBinaryCompatibilityBaseline)
}

base {
    archivesName = 'blue-coordination-java'
}

repositories {
    mavenCentral {
        content {
            // Blue modules are mandatory sibling composite builds. Excluding
            // their groups here prevents any silent remote fallback.
            excludeGroup 'blue.language'
            excludeGroup 'blue.bex'
            excludeGroup 'blue.repo'
        }
    }
    exclusiveContent {
        forRepository {
            ivy {
                name = 'releasedCoordinationBaseline'
                url = uri('https://repo1.maven.org/maven2')
                patternLayout {
                    artifact 'blue/coordination/blue-coordination-java/[revision]/blue-coordination-java-[revision].[ext]'
                }
                metadataSources {
                    artifact()
                }
            }
        }
        filter {
            includeModule 'blue.coordination.baseline', 'blue-coordination-java'
        }
    }
}

java {
    withSourcesJar()
    withJavadocJar()
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 8
}

tasks.withType(Javadoc).configureEach {
    javadocTool.set(
            javaToolchains.javadocToolFor {
                languageVersion =
                        JavaLanguageVersion.of(8)
            })
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.docEncoding = 'UTF-8'
    options.addBooleanOption('notimestamp', true)
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

def requiredRepositoryClosureSourceRoot =
        layout.buildDirectory.dir(
                'generated/sources/'
                        + 'coordinationRequiredRepositoryClosure/'
                        + 'java/main')
def requiredRepositoryClosureJava =
        requiredRepositoryClosureSourceRoot.map {
            it.file(
                    'blue/coordination/processor/'
                            + 'CoordinationRequiredRepositoryClosure.java')
        }
def requiredRepositoryClosureGenerationReport =
        layout.buildDirectory.file(
                'reports/coordination-release/'
                        + 'required-repository-closure-generation.json')
def verifyCoordinationRequiredRepositoryClosureGenerator =
        tasks.register(
                'verifyCoordinationRequiredRepositoryClosureGenerator',
                Exec) {
    group = 'verification'
    description = (
            'Exercises direct runtime roots, transitive edges, and complete '
                    + 'cyclic-set expansion in the Repository closure '
                    + 'generator.')
    inputs.files(
            'tools/generate-coordination-required-repository-closure.js',
            'tools/test-generate-coordination-required-repository-closure.js')
    commandLine(
            providers.environmentVariable(
                    'NODE_BINARY')
                    .orElse('node')
                    .get(),
            file('tools/'
                    + 'test-generate-coordination-required-repository-closure.js')
                    .absolutePath)
}
def generateCoordinationRequiredRepositoryClosure =
        tasks.register(
                'generateCoordinationRequiredRepositoryClosure',
                Exec) {
    group = 'build'
    description = (
            'Generates the immutable transitive fixed-Repository closure '
                    + 'from exact Coordination source and fixture usage.')
    dependsOn(
            verifyCoordinationRequiredRepositoryClosureGenerator)
    inputs.file(
            'tools/generate-coordination-required-repository-closure.js')
    inputs.files(
            fileTree('src/main'),
            fileTree('src/test'),
            fileTree('src/jmh'))
    inputs.property(
            'repositoryCommit',
            siblingSourceLock.getProperty(
                    'blueRepositoryCommit'))
    inputs.property(
            'languageCommit',
            currentLanguageSourceCommit)
    outputs.file(
            requiredRepositoryClosureJava)
    outputs.file(
            requiredRepositoryClosureGenerationReport)
    outputs.upToDateWhen { false }
    commandLine(
            providers.environmentVariable(
                    'NODE_BINARY')
                    .orElse('node')
                    .get(),
            file('tools/'
                    + 'generate-coordination-required-repository-closure.js')
                    .absolutePath,
            '--project-root',
            projectDir.absolutePath,
            '--repository-root',
            blueRepositorySourceRoot
                    .absolutePath,
            '--language-root',
            file('../blue-language-java')
                    .absolutePath,
            '--repository-commit',
            siblingSourceLock.getProperty(
                    'blueRepositoryCommit'),
            '--language-commit',
            currentLanguageSourceCommit,
            '--java-output',
            requiredRepositoryClosureJava
                    .get().asFile.absolutePath,
            '--report-output',
            requiredRepositoryClosureGenerationReport
                    .get().asFile.absolutePath)
}
sourceSets.main.java.srcDir(
        requiredRepositoryClosureSourceRoot)

tasks.named('compileJava', JavaCompile) {
    dependsOn(
            generateCoordinationRequiredRepositoryClosure)
    options.compilerArgs.addAll([
            '-Xlint:deprecation',
            '-Xlint:-options',
            '-Werror'
    ])
}
tasks.named('sourcesJar') {
    dependsOn(
            generateCoordinationRequiredRepositoryClosure)
}
tasks.named('javadoc') {
    dependsOn(
            generateCoordinationRequiredRepositoryClosure)
}

configurations {
    binaryCompatibilityBaseline {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

dependencies {
    api "blue.language:blue-language-java:${blueLanguageVersion}"
    api "blue.repo:blue-repo-java:${blueRepositoryVersion}"
    api "blue.bex:blue-bex-java:${blueBexVersion}"

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Alias the released artifact so Gradle never substitutes the current root project.
    binaryCompatibilityBaseline "blue.coordination.baseline:blue-coordination-java:${binaryCompatibilityBaselineVersion}"
}

compileTestJava {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

test {
    dependsOn tasks.named('jar'), tasks.named('sourcesJar'),
            'sourceArchive'
    maxHeapSize = '2g'
    maxParallelForks = 1
    forkEvery = 0L
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(8)
    }
    useJUnitPlatform()
    reports {
        junitXml.required = true
        html.required = true
    }
    testLogging {
        events 'PASSED', 'FAILED', 'SKIPPED'
        showStandardStreams = true
    }
}

def testJfrEnabled = providers.gradleProperty('testJfr')
        .map { !'false'.equalsIgnoreCase(it == null ? '' : it.trim()) }
        .getOrElse(false)

def configureFocusedTest = { Test focusedTest, List<String> includedTests ->
    focusedTest.group = 'verification'
    focusedTest.testClassesDirs = sourceSets.test.output.classesDirs
    focusedTest.classpath = sourceSets.test.runtimeClasspath
    focusedTest.dependsOn tasks.named('testClasses')
    focusedTest.useJUnitPlatform()
    focusedTest.maxHeapSize = '2g'
    focusedTest.maxParallelForks = 1
    focusedTest.forkEvery = 0L
    focusedTest.filter {
        includedTests.each { includeTestsMatching(it) }
    }
    focusedTest.reports {
        junitXml.required = true
        html.required = true
    }
    focusedTest.testLogging {
        events 'PASSED', 'FAILED', 'SKIPPED'
        showStandardStreams = true
    }
    if (testJfrEnabled) {
        def recording = layout.buildDirectory.file("reports/jfr/${focusedTest.name}.jfr").get().asFile
        focusedTest.doFirst {
            recording.parentFile.mkdirs()
            if (recording.exists() && !recording.delete()) {
                throw new GradleException("Could not replace JFR recording: ${recording}")
            }
        }
        focusedTest.jvmArgs "-XX:StartFlightRecording=filename=${recording.absolutePath},settings=profile,dumponexit=true"
    } else {
        focusedTest.javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(8)
        }
    }
}

