def nestedBexDependencyEvidence = file(
        '../blue-bex-java/build/reports/bex-release/dependency-resolution.properties')
def normalizedNestedBexDependencyEvidence =
        layout.buildDirectory.file(
                'reports/local-composite/bex-language-edge.properties')
def localCompositeDependencyGraphEvidence =
        layout.buildDirectory.file(
                'reports/local-composite/dependency-graph.properties')
def publishedDependencyAlignmentEvidence =
        layout.buildDirectory.file(
                'reports/local-composite/published-version-alignment.properties')
def verifyNestedLocalCompositeDependencies =
        tasks.register('verifyNestedLocalCompositeDependencies') {
    group = 'verification'
    description = 'Proves that the included BEX build also compiles against the required local Language sibling.'
    dependsOn gradle.includedBuild('blue-bex-java')
            .task(':writeDependencyResolutionEvidence')
    inputs.file('../blue-bex-java/settings.gradle.kts')
    inputs.file('../blue-bex-java/build.gradle.kts')
    outputs.file(normalizedNestedBexDependencyEvidence)
    outputs.upToDateWhen { false }
    doFirst {
        delete(
                normalizedNestedBexDependencyEvidence
                        .get().asFile)
    }
    doLast {
        if (!nestedBexDependencyEvidence.isFile()) {
            throw new GradleException(
                    "BEX dependency evidence is missing: "
                            + nestedBexDependencyEvidence)
        }
        def evidence = new Properties()
        nestedBexDependencyEvidence.withInputStream {
            evidence.load(it)
        }
        File expectedLanguage =
                file('../blue-language-java').canonicalFile
        String artifactPath =
                evidence.getProperty('artifact.path', '')
        String compositePath =
                evidence.getProperty('composite.path', '')
        File evidencedArtifact =
                artifactPath.isEmpty()
                        ? null
                        : file(artifactPath).canonicalFile
        def rootLanguageArtifacts =
                configurations.runtimeClasspath
                        .resolvedConfiguration
                        .resolvedArtifacts
                        .findAll { artifact ->
                            artifact.moduleVersion.id.group
                                    == 'blue.language'
                                    && artifact.name
                                    == 'blue-language-java'
                                    && artifact.extension == 'jar'
                        }
        if (rootLanguageArtifacts.size() != 1) {
            throw new GradleException(
                    "Expected one root-resolved local Language artifact, "
                            + "found " + rootLanguageArtifacts)
        }
        File rootLanguageArtifact =
                rootLanguageArtifacts[0].file
                        .canonicalFile
        def rootLanguageComponent =
                rootLanguageArtifacts[0]
                        .id.componentIdentifier
        def exactSha256 = { File artifact ->
            def digest =
                    java.security.MessageDigest
                            .getInstance('SHA-256')
            artifact.withInputStream { input ->
                byte[] buffer = new byte[8192]
                int read
                while ((read = input.read(buffer)) >= 0) {
                    if (read > 0) {
                        digest.update(
                                buffer, 0, read)
                    }
                }
            }
            digest.digest().collect {
                String.format('%02x', it & 0xff)
            }.join()
        }
        if (evidence.getProperty('status') != 'resolved'
                || evidence.getProperty('mode') != 'local-composite'
                || compositePath.isEmpty()
                || file(compositePath).canonicalFile
                        != expectedLanguage
                || artifactPath.isEmpty()
                || evidencedArtifact == null
                || !evidencedArtifact.isFile()
                || !evidencedArtifact.toPath()
                        .startsWith(expectedLanguage.toPath())
                || evidencedArtifact != rootLanguageArtifact
                || evidence.getProperty('effective.group')
                        != 'blue.language'
                || evidence.getProperty('effective.name')
                        != 'blue-language-java'
                || evidence.getProperty('effective.version')
                        != effectiveLocalProjectVersion(
                        blueLanguageVersion)
                || evidence.getProperty('artifact.bytes')
                        != String.valueOf(
                        evidencedArtifact.length())
                || evidence.getProperty('artifact.sha256')
                        != exactSha256(evidencedArtifact)
                || evidence.getProperty('provenance.status')
                        != 'not-applicable-local-composite') {
            throw new GradleException(
                    "BEX did not resolve Language from the required local "
                            + "composite build: " + evidence)
        }
        if (!(rootLanguageComponent instanceof
                org.gradle.api.artifacts.component.ProjectComponentIdentifier)
                || rootLanguageComponent
                        .build.buildPath
                        != ':blue-language-java'
                || rootLanguageComponent.projectPath != ':'
                || rootLanguageComponent.buildTreePath
                        != ':blue-language-java') {
            throw new GradleException(
                    "Root Language artifact is not the exact included-build "
                            + "project: " + rootLanguageComponent)
        }

        def normalized =
                new TreeMap<String, String>()
        normalized.put(
                'artifact.bytes',
                String.valueOf(
                        rootLanguageArtifact.length()))
        normalized.put(
                'artifact.sha256',
                exactSha256(rootLanguageArtifact))
        normalized.put(
                'consumer.buildPath',
                ':blue-bex-java')
        normalized.put(
                'consumer.projectPath',
                ':')
        normalized.put(
                'provenance.status',
                'not-applicable-local-composite')
        normalized.put(
                'requested.coordinate',
                evidence.getProperty(
                        'declared.coordinate'))
        normalized.put(
                'schema',
                'blue.coordination/local-composite-bex-language-edge/1.0')
        normalized.put(
                'selected.buildPath',
                rootLanguageComponent
                        .build.buildPath)
        normalized.put(
                'selected.buildTreePath',
                rootLanguageComponent
                        .buildTreePath)
        normalized.put(
                'selected.coordinate',
                [
                        evidence.getProperty(
                                'effective.group'),
                        evidence.getProperty(
                                'effective.name'),
                        evidence.getProperty(
                                'effective.version')
                ].join(':'))
        normalized.put(
                'selected.projectPath',
                rootLanguageComponent.projectPath)
        normalized.put(
                'status',
                'verified')
        normalized.put(
                'validation.sameArtifactAsRoot',
                'true')
        File normalizedFile =
                normalizedNestedBexDependencyEvidence
                        .get().asFile
        normalizedFile.parentFile.mkdirs()
        normalizedFile.setText(
                normalized.collect { key, value ->
                    if (value == null
                            || value.indexOf('\n') >= 0
                            || value.indexOf('\r') >= 0) {
                        throw new GradleException(
                                "Invalid normalized BEX dependency "
                                        + "evidence value for ${key}")
                    }
                    key + '=' + value
                }.join('\n') + '\n',
                'UTF-8')
    }
}

def verifyPublishedDependencyAlignment =
        tasks.register('verifyPublishedDependencyAlignment') {
    group = 'verification'
    description = 'Requires BEX publication metadata to request the exact Language release locked and tested by Coordination.'
    dependsOn verifyNestedLocalCompositeDependencies
    inputs.file(normalizedNestedBexDependencyEvidence)
    outputs.file(publishedDependencyAlignmentEvidence)
    outputs.upToDateWhen { false }
    doFirst {
        delete(
                publishedDependencyAlignmentEvidence
                        .get().asFile)
    }
    doLast {
        def nested = new Properties()
        normalizedNestedBexDependencyEvidence
                .get().asFile
                .withInputStream {
                    nested.load(it)
                }
        String expected =
                'blue.language:blue-language-java:'
                        .concat(blueLanguageVersion)
        String requested =
                nested.getProperty(
                        'requested.coordinate',
                        '')
        boolean matches = expected == requested
        def normalized =
                new TreeMap<String, String>()
        normalized.put(
                'expected.coordinate',
                expected)
        normalized.put(
                'requested.coordinate',
                requested)
        normalized.put(
                'schema',
                'blue.coordination/published-dependency-alignment/1.0')
        normalized.put(
                'status',
                matches ? 'verified' : 'mismatch')
        File output =
                publishedDependencyAlignmentEvidence
                        .get().asFile
        output.parentFile.mkdirs()
        output.setText(
                normalized.collect { key, value ->
                    key + '=' + value
                }.join('\n') + '\n',
                'UTF-8')
        if (!matches) {
            throw new GradleException(
                    "BEX published Language coordinate "
                            + requested
                            + " does not match the exact locked/tested "
                            + "Language release "
                            + expected)
        }
    }
}

def writeLocalCompositeDependencyEvidence =
        tasks.register(
                'writeLocalCompositeDependencyEvidence') {
    group = 'verification'
    description = 'Proves the complete selected Blue dependency graph uses exact local included-build projects.'
    dependsOn verifyNestedLocalCompositeDependencies
    outputs.file(localCompositeDependencyGraphEvidence)
    outputs.upToDateWhen { false }
    doFirst {
        delete(
                localCompositeDependencyGraphEvidence
                        .get().asFile)
    }
    doLast {
        def resolution =
                configurations.runtimeClasspath
                        .incoming.resolutionResult
        def expectedComponents = [
                'blue.language:blue-language-java': [
                        label          : 'language',
                        version        :
                                effectiveLocalProjectVersion(
                                        blueLanguageVersion),
                        buildPath      :
                                ':blue-language-java',
                        buildTreePath  :
                                ':blue-language-java'
                ],
                'blue.bex:blue-bex-java'          : [
                        label          : 'bex',
                        version        :
                                effectiveLocalProjectVersion(
                                        blueBexVersion),
                        buildPath      :
                                ':blue-bex-java',
                        buildTreePath  :
                                ':blue-bex-java'
                ],
                'blue.repo:blue-repo-java'        : [
                        label          : 'repository',
                        version        :
                                effectiveLocalProjectVersion(
                                        blueRepositoryVersion),
                        buildPath      :
                                ':blue-repository-java',
                        buildTreePath  :
                                ':blue-repository-java'
                ]
        ]
        def blueGroups = [
                'blue.language',
                'blue.bex',
                'blue.repo'
        ] as Set
        def blueComponents =
                resolution.allComponents.findAll {
                    component ->
                    component.moduleVersion != null
                            && blueGroups.contains(
                            component.moduleVersion.group)
                }
        def remotelySelectedBlue =
                blueComponents.findAll {
                    component ->
                    component.id instanceof
                            org.gradle.api.artifacts.component.ModuleComponentIdentifier
                }
        if (!remotelySelectedBlue.isEmpty()) {
            throw new GradleException(
                    "Selected remote Blue modules are forbidden: "
                            + remotelySelectedBlue.collect {
                        it.id.displayName
                    }.sort())
        }
        def selectedByCoordinate =
                blueComponents.groupBy {
                    component ->
                    [
                            component.moduleVersion.group,
                            component.moduleVersion.name
                    ].join(':')
                }
        if ((selectedByCoordinate.keySet() as Set)
                != (expectedComponents.keySet() as Set)) {
            throw new GradleException(
                    "Selected Blue components differ from the exact "
                            + "local graph: "
                            + selectedByCoordinate.keySet())
        }

        def exactComponents =
                new LinkedHashMap<String, Object>()
        expectedComponents.each {
            coordinate, expectation ->
            def matches =
                    selectedByCoordinate.get(coordinate)
            if (matches == null || matches.size() != 1) {
                throw new GradleException(
                        "Expected one selected ${coordinate} component, "
                                + "found " + matches)
            }
            def component = matches[0]
            if (!(component.id instanceof
                    org.gradle.api.artifacts.component.ProjectComponentIdentifier)) {
                throw new GradleException(
                        "${coordinate} is not a local project component: "
                                + component.id)
            }
            def projectId = component.id
            if (component.moduleVersion.version
                    != expectation.version
                    || projectId.build.buildPath
                    != expectation.buildPath
                    || projectId.projectPath != ':'
                    || projectId.buildTreePath
                    != expectation.buildTreePath) {
                throw new GradleException(
                        "Unexpected local project identity for "
                                + coordinate + ": "
                                + component.moduleVersion
                                + " / " + projectId)
            }
            exactComponents.put(
                    coordinate,
                    component)
        }

        def languageComponent =
                exactComponents.get(
                        'blue.language:blue-language-java')
        def requiredEdges = [
                [
                        key       : 'bexToLanguage',
                        consumer  :
                                exactComponents.get(
                                        'blue.bex:blue-bex-java')
                ],
                [
                        key       : 'repositoryToLanguage',
                        consumer  :
                                exactComponents.get(
                                        'blue.repo:blue-repo-java')
                ]
        ]
        def normalized =
                new TreeMap<String, String>()
        normalized.put(
                'configuration',
                'runtimeClasspath')
        normalized.put(
                'remoteBlueModuleCount',
                '0')
        normalized.put(
                'schema',
                'blue.coordination/local-composite-dependency-graph/1.0')
        normalized.put(
                'selectedBlueComponentCount',
                String.valueOf(
                        exactComponents.size()))
        normalized.put(
                'status',
                'verified')
        expectedComponents.each {
            coordinate, expectation ->
            def component =
                    exactComponents.get(coordinate)
            def id = component.id
            String prefix =
                    'selected.'.concat(
                            expectation.label.toString())
            normalized.put(
                    prefix + '.buildPath',
                    id.build.buildPath)
            normalized.put(
                    prefix + '.buildTreePath',
                    id.buildTreePath)
            normalized.put(
                    prefix + '.coordinate',
                    component.moduleVersion
                            .toString())
            normalized.put(
                    prefix + '.projectPath',
                    id.projectPath)
            normalized.put(
                    prefix + '.type',
                    'project')
        }
        requiredEdges.each { edge ->
            def unresolvedBlueEdges =
                    edge.consumer.dependencies
                            .findAll { dependency ->
                                dependency instanceof
                                        org.gradle.api.artifacts.result.UnresolvedDependencyResult
                                        && dependency.requested instanceof
                                        org.gradle.api.artifacts.component.ModuleComponentSelector
                                        && dependency.requested.group
                                        == 'blue.language'
                                        && dependency.requested.module
                                        == 'blue-language-java'
                            }
            if (!unresolvedBlueEdges.isEmpty()) {
                throw new GradleException(
                        "Unresolved local Language edge from "
                                + edge.key + ": "
                                + unresolvedBlueEdges)
            }
            def matches =
                    edge.consumer.dependencies
                            .findAll { dependency ->
                                dependency instanceof
                                        org.gradle.api.artifacts.result.ResolvedDependencyResult
                                        && dependency.requested instanceof
                                        org.gradle.api.artifacts.component.ModuleComponentSelector
                                        && dependency.requested.group
                                        == 'blue.language'
                                        && dependency.requested.module
                                        == 'blue-language-java'
                            }
            if (matches.size() != 1) {
                throw new GradleException(
                        "Expected one authored Language edge for "
                                + edge.key + ", found "
                                + matches.collect {
                            it.requested.displayName
                        })
            }
            def dependency = matches[0]
            if (dependency.selected.id
                    != languageComponent.id
                    || dependency.selected.moduleVersion
                    != languageComponent.moduleVersion) {
                throw new GradleException(
                        "The ${edge.key} edge did not select the exact "
                                + "Language included-build project: "
                                + dependency.selected.id)
            }
            String prefix =
                    'edge.' + edge.key
            normalized.put(
                    prefix + '.requested',
                    [
                            dependency.requested.group,
                            dependency.requested.module,
                            dependency.requested.version
                    ].join(':'))
            normalized.put(
                    prefix + '.selected.buildPath',
                    dependency.selected.id
                            .build.buildPath)
            normalized.put(
                    prefix + '.selected.buildTreePath',
                    dependency.selected.id
                            .buildTreePath)
            normalized.put(
                    prefix + '.selected.coordinate',
                    dependency.selected
                            .moduleVersion.toString())
            normalized.put(
                    prefix + '.selected.projectPath',
                    dependency.selected.id
                            .projectPath)
        }
        File output =
                localCompositeDependencyGraphEvidence
                        .get().asFile
        output.parentFile.mkdirs()
        output.setText(
                normalized.collect { key, value ->
                    if (value == null
                            || value.indexOf('\n') >= 0
                            || value.indexOf('\r') >= 0) {
                        throw new GradleException(
                                "Invalid normalized dependency-graph "
                                        + "value for ${key}")
                    }
                    key + '=' + value
                }.join('\n') + '\n',
                'UTF-8')
    }
}

