        'coordinationJavadocJarSha256',
        'coordinationSourceArchiveSha256',
        'coordinationSpecification',
        'portableGasSchedule',
        'portableGasManifestIdentity',
        'portableGasManifestSha256',
        'hostQuotaSchedule',
        'hostQuotaManifestSha256'
] as Set

def exactCoordinationConformanceReceiptIdentities = {
        File conformanceManifest =
                new File(
                        coordinationConformancePackageDirectory,
                        'manifest.yaml')
        File portableGasManifest =
                file(
                        'src/main/resources/blue/coordination/processor/'
                                + 'coordination-gas-1.0.yaml')
        File hostQuotaManifest =
                file(
                        'src/main/resources/blue/coordination/processor/'
                                + 'coordination-host-quotas-1.0.yaml')
        File fixedRepositoryManifest =
                new File(
                        blueRepositoryCompositeRoot,
                        'src/main/resources/blue/repo/manifest.json')
        [
                conformanceManifest,
                portableGasManifest,
                hostQuotaManifest,
                fixedRepositoryManifest
        ].each { identitySource ->
            if (!identitySource.isFile()) {
                throw new GradleException(
                        "Coordination conformance receipt identity source "
                                + "is missing: " + identitySource)
            }
        }

        String languageCommit =
                requiredReceiptGitCommit(
                        file('../blue-language-java'),
                        'Language')
        String bexCommit =
                requiredReceiptGitCommit(
                        file('../blue-bex-java'),
                        'BEX')
        String repositoryCommit =
                requiredReceiptGitCommit(
                        blueRepositoryCompositeRoot,
                        'Repository')
        def lockedCommits = [
                blueLanguageCommit  : languageCommit,
                blueBexCommit       : bexCommit,
                blueRepositoryCommit: repositoryCommit
        ]
        lockedCommits.each { key, actual ->
            String locked =
                    siblingSourceLock.getProperty(
                            key.toString())
            if (locked == null
                    || locked != actual) {
                throw new GradleException(
                        "Coordination conformance receipt rejected "
                                + "${key}=${actual}; source lock requires "
                                + locked)
            }
        }

        File languageJar =
                requiredReceiptArtifact(
                        'blue.language',
                        'blue-language-java',
                        effectiveLocalProjectVersion(
                                blueLanguageVersion),
                        ':blue-language-java',
                        file('../blue-language-java'))
        File bexJar =
                requiredReceiptArtifact(
                        'blue.bex',
                        'blue-bex-java',
                        effectiveLocalProjectVersion(
                                blueBexVersion),
                        ':blue-bex-java',
                        file('../blue-bex-java'))
        File repositoryJar =
                requiredReceiptArtifact(
                        'blue.repo',
                        'blue-repo-java',
                        effectiveLocalProjectVersion(
                                blueRepositoryVersion),
                        ':blue-repository-java',
                        blueRepositoryCompositeRoot)
        File coordinationJar =
                tasks.named('jar')
                        .get()
                        .archiveFile
                        .get()
                        .asFile
                        .canonicalFile
        File coordinationSourcesJar =
                tasks.named('sourcesJar')
                        .get()
                        .archiveFile
                        .get()
                        .asFile
                        .canonicalFile
        File coordinationJavadocJar =
                tasks.named('javadocJar')
                        .get()
                        .archiveFile
                        .get()
                        .asFile
                        .canonicalFile
        File coordinationSourceArchive =
                tasks.named('sourceArchive')
                        .get()
                        .archiveFile
                        .get()
                        .asFile
                        .canonicalFile
        File coordinationBuildDirectory =
                layout.buildDirectory
                        .get()
                        .asFile
                        .canonicalFile
        [
                binary            : coordinationJar,
                sources           : coordinationSourcesJar,
                javadoc           : coordinationJavadocJar,
                sourceDistribution: coordinationSourceArchive
        ].each { label, artifact ->
            if (!artifact.isFile()
                    || !artifact.toPath()
                    .startsWith(
                            coordinationBuildDirectory.toPath())) {
                throw new GradleException(
                        "Coordination conformance receipt requires the "
                                + "same-run Coordination ${label} "
                                + "artifact, found " + artifact)
            }
        }

        byte[] fixedRepositoryManifestBytes =
                fixedRepositoryManifest.bytes
        def repositoryManifest =
                new groovy.json.JsonSlurper()
                        .parse(
                                fixedRepositoryManifest)
        if (!(repositoryManifest instanceof Map)
                || !(repositoryManifest.repositoryVersion
                instanceof String)
                || repositoryManifest.repositoryVersion
                .trim().isEmpty()
                || !(repositoryManifest.repositoryVersionBlueId
                instanceof String)
                || repositoryManifest.repositoryVersionBlueId
                .trim().isEmpty()) {
            throw new GradleException(
                    "Fixed Repository manifest identity is missing or "
                            + "unknown")
        }
        def repositoryArchive =
                new java.util.jar.JarFile(
                        repositoryJar)
        byte[] embeddedRepositoryManifestBytes
        try {
            def entry =
                    repositoryArchive.getJarEntry(
                            'blue/repo/manifest.json')
            if (entry == null) {
                throw new GradleException(
                        "Fixed Repository JAR has no manifest identity")
            }
            embeddedRepositoryManifestBytes =
                    repositoryArchive
                            .getInputStream(entry)
                            .bytes
        } finally {
            repositoryArchive.close()
        }
        if (!java.util.Arrays.equals(
                fixedRepositoryManifestBytes,
                embeddedRepositoryManifestBytes)) {
            throw new GradleException(
                    "Fixed Repository JAR manifest bytes differ from "
                            + "the locked source manifest")
        }

        String fixedRepositoryVersion =
                repositoryManifest.repositoryVersion
                        .toString()
        String fixedRepositoryVersionBlueId =
                repositoryManifest.repositoryVersionBlueId
                        .toString()
        if (yamlScalar(
                conformanceManifest,
                'fixedRepositoryVersion')
                != fixedRepositoryVersion
                || yamlScalar(
                conformanceManifest,
                'fixedRepositoryVersionBlueId')
                != fixedRepositoryVersionBlueId) {
            throw new GradleException(
                    "Coordination fixture package uses an unknown fixed "
                            + "Repository manifest identity")
        }

        String fixtureSpecification =
                yamlScalar(
                        conformanceManifest,
                        'coordinationSpecification')
        String fixturePackageIdentity =
                calculatedCoordinationConformanceIdentity(
                        coordinationConformancePackageDirectory)
        if (fixtureSpecification
                != 'blue-coordination/1.0'
                || yamlScalar(
                conformanceManifest,
                'packageIdentity')
                != fixturePackageIdentity) {
            throw new GradleException(
                    "Coordination fixture specification or package "
                            + "identity is missing or unknown")
        }

        String portableGasSchedule =
                yamlScalar(
                        portableGasManifest,
                        'schedule')
        String portableGasManifestIdentity =
                yamlScalar(
                        portableGasManifest,
                        'packageIdentity')
        String portableGasManifestSha256 =
                sha256File(
                        portableGasManifest)
        if (portableGasSchedule
                != 'blue-coordination/gas/1.0'
                || !(portableGasManifestIdentity
                ==~ /sha256:[0-9a-f]{64}/)
                || yamlScalar(
                conformanceManifest,
                'gasPackageIdentity')
                != portableGasManifestIdentity
                || yamlScalar(
                conformanceManifest,
                'portableGasRawSha256')
                != portableGasManifestSha256) {
            throw new GradleException(
                    "Coordination portable gas schedule or manifest "
                            + "identity is missing or unknown")
        }
        String hostQuotaSchedule =
                yamlScalar(
                        hostQuotaManifest,
                        'schedule')
        String hostQuotaManifestSha256 =
                sha256File(
                        hostQuotaManifest)
        if (hostQuotaSchedule
                != 'blue-coordination/host-quotas/1.0'
                || yamlScalar(
                conformanceManifest,
                'hostQuotaRawSha256')
                != hostQuotaManifestSha256) {
            throw new GradleException(
                    "Coordination host-quota schedule or manifest "
                            + "identity is missing or unknown")
        }

        def identities =
                new LinkedHashMap<String, String>()
        identities.put(
                'blueLanguageCommit',
                languageCommit)
        identities.put(
                'blueLanguageJarSha256',
                sha256File(languageJar))
        identities.put(
                'blueBexCommit',
                bexCommit)
        identities.put(
                'blueBexJarSha256',
                sha256File(bexJar))
        identities.put(
                'fixedRepositoryManifestSha256',
                sha256File(fixedRepositoryManifest))
        identities.put(
                'fixturePackageIdentity',
                fixturePackageIdentity)
        identities.put(
                'fixedRepositoryVersion',
                fixedRepositoryVersion)
        identities.put(
                'fixedRepositoryVersionBlueId',
                fixedRepositoryVersionBlueId)
        identities.put(
                'blueRepositoryCommit',
                repositoryCommit)
        identities.put(
                'blueRepositoryJarSha256',
                sha256File(repositoryJar))
        identities.put(
                'blueCoordinationCommit',
                requiredReceiptGitCommit(
                        projectDir,
                        'Coordination'))
        identities.put(
                'coordinationJarSha256',
                sha256File(coordinationJar))
        identities.put(
                'coordinationSourcesJarSha256',
                sha256File(coordinationSourcesJar))
        identities.put(
                'coordinationJavadocJarSha256',
                sha256File(coordinationJavadocJar))
        identities.put(
                'coordinationSourceArchiveSha256',
                sha256File(coordinationSourceArchive))
        identities.put(
                'coordinationSpecification',
                fixtureSpecification)
        identities.put(
                'portableGasSchedule',
                portableGasSchedule)
        identities.put(
                'portableGasManifestIdentity',
                portableGasManifestIdentity)
        identities.put(
                'portableGasManifestSha256',
                portableGasManifestSha256)
        identities.put(
                'hostQuotaSchedule',
                hostQuotaSchedule)
        identities.put(
                'hostQuotaManifestSha256',
                hostQuotaManifestSha256)
        if ((identities.keySet() as Set)
                != coordinationConformanceReceiptIdentityKeys
                || identities.any { key, value ->
                    value == null
                            || value.trim().isEmpty()
                }) {
            throw new GradleException(
                    "Coordination conformance receipt identity set is "
                            + "missing or unknown: " + identities)
        }
        return identities
}

def verifyCoordinationConformanceReceiptIdentities =
        tasks.register(
                'verifyCoordinationConformanceReceiptIdentities') {
    group = 'verification'
    description = 'Resolves and verifies every exact identity required by the same-run Coordination conformance receipt.'
    dependsOn tasks.named('jar'),
            tasks.named('sourcesJar'),
            tasks.named('javadocJar'),
            tasks.named('sourceArchive')
    outputs.upToDateWhen { false }
    doLast {
        exactCoordinationConformanceReceiptIdentities()
    }
}

def validateCoordinationConformanceReceipt = {
    File receiptFile, boolean requireFinalReleaseMetadata ->
        File manifestFile =
                new File(
                        coordinationConformancePackageDirectory,
                        'manifest.yaml')
        String calculatedPackageIdentity =
                calculatedCoordinationConformanceIdentity(
                        coordinationConformancePackageDirectory)
        String declaredPackageIdentity =
                yamlScalar(manifestFile, 'packageIdentity')
        if (declaredPackageIdentity
                != calculatedPackageIdentity) {
            throw new GradleException(
                    "Stale Coordination conformance package identity: "
                            + "manifest declares "
                            + declaredPackageIdentity
                            + " but actual files derive "
                            + calculatedPackageIdentity)
        }
        String packageStatus =
                yamlScalar(
                        manifestFile,
                        'status')
        def packageStates = [
                candidate: [
                        manifest: [
                                status                    : 'candidate',
                                releaseEligible           : 'false',
                                normativeExecutionComplete:
                                        'false',
                                receiptWritten            : 'false',
                                executedBehaviorCaseCount :
                                        '0',
                                executedPortableGasCaseCount:
                                        '14',
                                executedHostQuotaCaseCount:
                                        '0'
                        ],
                        behavior: [
                                status                    : 'candidate',
                                normativeExecutionComplete:
                                        'false',
                                executedNormativeFixtureCount:
                                        '0',
                                receiptWritten            : 'false'
                        ],
                        gas     : [
                                status                    : 'candidate',
                                normativeExecutionComplete:
                                        'false',
                                portableExecutionComplete :
                                        'true',
                                hostQuotaExecutionComplete:
                                        'false'
                        ],
                        vectors : [
                                status                    : 'candidate',
                                normativeExecutionComplete:
                                        'false',
                                behaviorPassed            : '0',
                                portableGasPassed         : '14',
                                hostQuotaPassed           : '0',
                                receiptWritten            : 'false'
                        ]
                ],
                complete : [
                        manifest: [
                                status                    : 'complete',
                                releaseEligible           : 'true',
                                normativeExecutionComplete:
                                        'true',
                                receiptWritten            : 'true',
                                executedBehaviorCaseCount :
                                        '65',
                                executedPortableGasCaseCount:
                                        '14',
                                executedHostQuotaCaseCount:
                                        '7'
                        ],
                        behavior: [
                                status                    : 'complete',
                                normativeExecutionComplete:
                                        'true',
                                executedNormativeFixtureCount:
                                        '55',
                                receiptWritten            : 'true'
                        ],
                        gas     : [
                                status                    : 'complete',
                                normativeExecutionComplete:
                                        'true',
                                portableExecutionComplete :
                                        'true',
                                hostQuotaExecutionComplete:
                                        'true'
                        ],
                        vectors : [
                                status                    : 'complete',
                                normativeExecutionComplete:
                                        'true',
                                behaviorPassed            : '65',
                                portableGasPassed         : '14',
                                hostQuotaPassed           : '7',
                                receiptWritten            : 'true'
                        ]
                ]
        ]
        def packageState =
                packageStates.get(
                        packageStatus)
        if (packageState == null) {
            throw new GradleException(
                    "Coordination conformance package status must be "
                            + "candidate or complete, found "
                            + packageStatus)
        }
        requireYamlValues(
                manifestFile,
                packageState.manifest + [
                        blueLanguageVersion                 :
                                blueLanguageVersion,
                        blueBexVersion                      :
                                blueBexVersion,
                        blueRepositoryArtifactVersion       :
                                blueRepositoryVersion,
                        authoredBehaviorFixtureCount        :
                                '55',
                        expandedBehaviorExecutionCaseCount  :
                                '65',
                        authoredPortableGasFixtureCount     :
                                '14',
                        authoredHostQuotaFixtureCount       :
                                '7',
                        authoredFixtureFileCount            :
                                '76',
                        authoredExecutionCaseCount          :
                                '86',
                        authoredVectorCount                 :
                                '56',
                        requiredFinalBehaviorFixtureCount   :
                                '55',
                        requiredFinalPortableGasFixtureCount:
                                '14',
                        requiredFinalHostQuotaFixtureCount  :
                                '7',
                        requiredFinalFixtureFileCount       :
                                '76',
                        requiredFinalExecutionCaseCount     :
                                '86',
                        requiredFinalVectorCount            :
                                '56'
                ],
                false)
        File behaviorInventoryFile =
                new File(
                        coordinationConformancePackageDirectory,
                        'behavior-fixtures.yaml')
        requireYamlValues(
                behaviorInventoryFile,
                packageState.behavior + [
                        authoredFixtureCount        : '55',
                        expandedExecutionCaseCount  : '65',
                        requiredFinalFixtureCount   : '55',
                        requiredFinalExecutionCaseCount:
                                '65',
                        behaviorVectorCount         : '55'
                ],
                false)
        File gasInventoryFile =
                new File(
                        coordinationConformancePackageDirectory,
                        'gas-fixtures.yaml')
        requireYamlValues(
                gasInventoryFile,
                packageState.gas + [
                        executablePortableFixtureCount:
                                '14',
                        hostQuotaFixtureCount         : '7',
                        requiredFinalPortableFixtureCount:
                                '14',
                        requiredFinalHostQuotaFixtureCount:
                                '7',
                        requiredFinalGasFixtureCount  : '21'
                ],
                false)
        File vectorCoverageFile =
                new File(
                        coordinationConformancePackageDirectory,
                        'vector-coverage.yaml')
        requireYamlValues(
                vectorCoverageFile,
                packageState.vectors + [
                        behaviorFixtureFiles      : '55',
                        behaviorExecutionCases    : '65',
                        portableGasFixtureFiles   : '14',
                        portableGasExecutionCases : '14',
                        hostQuotaFixtureFiles     : '7',
                        hostQuotaExecutionCases   : '7',
                        totalFixtureFiles         : '76',
                        totalExecutionCases       : '86',
                        distinctVectors           : '56'
                ],
                true)
        if (requireFinalReleaseMetadata
                && packageStatus != 'complete') {
            throw new GradleException(
                    "Final Coordination release requires complete, "
                            + "normative, release-eligible conformance "
                            + "metadata with all 86 executions recorded; "
                            + "found " + packageStatus)
        }

        if (!receiptFile.isFile()) {
            throw new GradleException(
                    "Executable Coordination conformance receipt is "
                            + "missing at ${receiptFile}; structural package "
                            + "checks are not release evidence")
        }
        def receipt = new groovy.json.JsonSlurper()
                .parse(receiptFile)
        if (!(receipt instanceof Map)) {
            throw new GradleException(
                    "Coordination conformance receipt must be a JSON object")
        }
        requireJsonSchema(
                receipt,
                coordinationConformanceReceiptSchemaFile,
                'Coordination conformance receipt')
        def exactReceiptIdentities =
                exactCoordinationConformanceReceiptIdentities()
        def allowedReceiptKeys = [
                'schema',
                'status',
                'vectorCount',
                'behaviorFixtureCount',
                'portableGasFixtureCount',
                'hostQuotaFixtureCount',
                'fixtureFileCount',
                'executionCaseCount',
                'passed',
                'failures',
                'skips',
                'executionCases'
        ] as Set
        allowedReceiptKeys.addAll(
                exactReceiptIdentities.keySet())
        if ((receipt.keySet() as Set) != allowedReceiptKeys) {
            throw new GradleException(
                    "Coordination conformance receipt fields do not "
                            + "exactly match the closed result schema")
        }

        def requiredText = { Map value,
                             String key ->
            def actual = value.get(key)
            if (!(actual instanceof String)
                    || actual.trim().isEmpty()) {
                throw new GradleException(
                        "Coordination conformance receipt ${key} "
                                + "must be non-empty text")
            }
            return actual
        }
        def requireExactInteger = { Map value,
                                    String key,
                                    long expected ->
            def actual = value.get(key)
            boolean integerValue =
                    actual instanceof Byte
                            || actual instanceof Short
                            || actual instanceof Integer
                            || actual instanceof Long
                            || actual instanceof java.math.BigInteger
            if (!integerValue
                    || actual.longValue() != expected) {
                throw new GradleException(
                        "Coordination conformance receipt ${key} "
                                + "must be ${expected}, found ${actual}")
            }
        }

        if (requiredText(receipt, 'schema')
                != 'blue.coordination/conformance-result/1.0'
                || requiredText(receipt, 'status')
                != 'complete') {
            throw new GradleException(
                    "Coordination conformance receipt is not a "
                            + "complete 1.0 executable result")
        }
        exactReceiptIdentities.each { key, expected ->
            String actual =
                    requiredText(
                            receipt,
                            key.toString())
            if (actual != expected) {
                throw new GradleException(
                        "Coordination conformance receipt uses stale or "
                                + "unknown ${key}: expected ${expected}, "
                                + "found ${actual}")
            }
        }
        requiredCoordinationConformanceCounts.each {
            key, expected ->
                requireExactInteger(
                        receipt,
                        key,
                        expected)
        }

        def executionCases = receipt.executionCases
        if (!(executionCases instanceof List)
                || executionCases.size()
                != requiredCoordinationConformanceCounts
                        .executionCaseCount) {
            throw new GradleException(
                    "Coordination conformance receipt must contain "
                            + requiredCoordinationConformanceCounts
                                    .executionCaseCount
                            + " executable case records")
        }
        def authoredExecutionCases =
                authoredCoordinationConformanceCases()

        def caseIds = new TreeSet<String>()
        def observedExecutionCases =
                new TreeMap<String, Map<String, Object>>()
        def fixtureFiles = new TreeSet<String>()
        def behaviorFixtures = new TreeSet<String>()
        def portableGasFixtures = new TreeSet<String>()
        def hostQuotaFixtures = new TreeSet<String>()
        def vectors = new TreeSet<String>()
        def allowedCaseKeys = [
                'id',
                'fixture',
                'kind',
                'operation',
                'variant',
                'vectors',
                'status'
        ] as Set
        executionCases.eachWithIndex { item, index ->
            if (!(item instanceof Map)) {
                throw new GradleException(
                        "Coordination conformance case ${index} "
                                + "must be an object")
            }
            if ((item.keySet() as Set) != allowedCaseKeys) {
                throw new GradleException(
                        "Coordination conformance case ${index} fields "
                                + "do not exactly match the closed result "
                                + "schema")
            }
            String caseId =
                    requiredText(item, 'id')
            String fixture =
                    requiredText(item, 'fixture')
            String kind =
                    requiredText(item, 'kind')
            String operation =
                    requiredText(item, 'operation')
            String variant =
                    requiredText(item, 'variant')
            if (requiredText(item, 'status') != 'passed') {
                throw new GradleException(
                        "Coordination conformance case ${caseId} "
                                + "did not pass")
            }
            if (!caseIds.add(caseId)) {
                throw new GradleException(
                        "Duplicate Coordination conformance case id: "
                                + caseId)
            }
            if (fixture.startsWith('/')
                    || fixture.contains('\\')
                    || fixture.tokenize('/').contains('..')
                    || !fixture.startsWith('fixtures/')
                    || !fixture.endsWith('.yaml')) {
                throw new GradleException(
                        "Coordination conformance fixture path is not "
                                + "portable: ${fixture}")
            }
            File fixtureSource =
                    new File(
                            coordinationConformancePackageDirectory,
                            fixture).canonicalFile
            if (!fixtureSource.toPath().startsWith(
                    coordinationConformancePackageDirectory
                            .canonicalFile.toPath())
                    || !fixtureSource.isFile()) {
                throw new GradleException(
                        "Coordination conformance case ${caseId} names "
                                + "a missing package fixture: ${fixture}")
            }
            fixtureFiles.add(fixture)
            if (kind == 'behavior') {
                behaviorFixtures.add(fixture)
            } else if (kind == 'portable-gas') {
                portableGasFixtures.add(fixture)
            } else if (kind == 'host-quota') {
                hostQuotaFixtures.add(fixture)
            } else {
                throw new GradleException(
                        "Coordination conformance case ${caseId} has "
                                + "unknown kind ${kind}")
            }
            def caseVectors = item.vectors
            if (!(caseVectors instanceof List)
                    || caseVectors.isEmpty()) {
                throw new GradleException(
                        "Coordination conformance case ${caseId} "
                                + "must name at least one vector")
            }
            if ((caseVectors as Set).size()
                    != caseVectors.size()) {
                throw new GradleException(
                        "Coordination conformance case ${caseId} "
                                + "contains duplicate vectors")
            }
            caseVectors.each { vector ->
                if (!(vector instanceof String)
                        || vector.trim().isEmpty()) {
                    throw new GradleException(
                            "Coordination conformance case ${caseId} "
                                    + "has an empty vector")
                }
                vectors.add(vector)
            }
            observedExecutionCases.put(
                    caseId,
                    [
                            id       : caseId,
                            fixture  : fixture,
                            kind     : kind,
                            operation: operation,
                            variant  : variant,
                            vectors  :
                                    new ArrayList<Object>(
                                            caseVectors)
                    ])
        }

        if (observedExecutionCases
                != authoredExecutionCases) {
            def missingCaseIds =
                    new TreeSet<String>(
                            authoredExecutionCases.keySet())
            missingCaseIds.removeAll(
                    observedExecutionCases.keySet())
            def unexpectedCaseIds =
                    new TreeSet<String>(
                            observedExecutionCases.keySet())
            unexpectedCaseIds.removeAll(
                    authoredExecutionCases.keySet())
            def mismatchedCaseIds =
                    new TreeSet<String>()
            authoredExecutionCases.keySet()
                    .intersect(
                            observedExecutionCases.keySet())
                    .each { caseId ->
                        if (authoredExecutionCases.get(caseId)
                                != observedExecutionCases.get(caseId)) {
                            mismatchedCaseIds.add(caseId)
                        }
                    }
            throw new GradleException(
                    "Coordination conformance receipt does not exactly "
                            + "match the authored 86-case matrix: missing="
                            + missingCaseIds + ", unexpected="
                            + unexpectedCaseIds + ", mismatched="
                            + mismatchedCaseIds)
        }

        def exactDistinctCount = { Collection values,
                                   String label,
                                   long expected ->
            if (values.size() != expected) {
                throw new GradleException(
                        "Coordination conformance receipt ${label} "
                                + "must contain ${expected} distinct "
                                + "values, found ${values.size()}")
            }
        }
        exactDistinctCount(
                fixtureFiles,
                'fixture files',
                requiredCoordinationConformanceCounts
                        .fixtureFileCount)
        exactDistinctCount(
                behaviorFixtures,
                'behavior fixtures',
                requiredCoordinationConformanceCounts
                        .behaviorFixtureCount)
        exactDistinctCount(
                portableGasFixtures,
                'portable gas fixtures',
                requiredCoordinationConformanceCounts
                        .portableGasFixtureCount)
        exactDistinctCount(
                hostQuotaFixtures,
                'host quota fixtures',
                requiredCoordinationConformanceCounts
                        .hostQuotaFixtureCount)
        exactDistinctCount(
                vectors,
                'vectors',
                requiredCoordinationConformanceCounts
                        .vectorCount)
        def packagedFixtureFiles =
                fileTree(
                        coordinationConformancePackageDirectory) {
                    include 'fixtures/**/*.yaml'
                }.files.collect { source ->
                    coordinationConformancePackageDirectory
                            .toPath()
                            .relativize(source.toPath())
                            .toString()
                            .replace(
                                    java.io.File.separatorChar,
                                    '/' as char)
                } as Set
        if (packagedFixtureFiles != fixtureFiles) {
            throw new GradleException(
                    "Coordination conformance receipt fixture inventory "
                            + "does not exactly match the declared package")
        }
        if (!Collections.disjoint(
                behaviorFixtures,
                portableGasFixtures)
                || !Collections.disjoint(
                        behaviorFixtures,
                        hostQuotaFixtures)
                || !Collections.disjoint(
                        portableGasFixtures,
                        hostQuotaFixtures)) {
            throw new GradleException(
                    "A Coordination conformance fixture cannot claim "
                            + "multiple evidence ownership kinds")
        }

        return [
                receipt       : receipt,
                packageStatus : packageStatus,
                packageIdentity:
                        calculatedPackageIdentity,
                caseIds       :
                        new ArrayList<String>(caseIds)
        ]
}

def writeCoordinationConformanceReceiptFromJUnit = {
    File resultsDirectory, File receiptFile ->
        def observedTests =
                new ArrayList<Map<String, Object>>()
        fileTree(resultsDirectory) {
            include 'TEST-*.xml'
        }.files.sort().each { resultFile ->
            def suite = new groovy.xml.XmlSlurper(
                    false, false).parse(resultFile)
            suite.testcase.each { testCase ->
                observedTests.add([
                        className:
                                testCase.@classname
                                        .toString(),
                        name     :
                                testCase.@name
                                        .toString(),
                        failed   :
                                testCase.failure.size() > 0
                                        || testCase.error.size() > 0,
                        skipped  :
                                testCase.skipped.size() > 0
                ])
            }
        }
        if (observedTests.isEmpty()) {
            throw new GradleException(
                    "Coordination conformance JUnit XML is missing from "
                            + resultsDirectory)
        }

        def authored =
                authoredCoordinationConformanceCases()
        def observedCaseIds =
                new TreeSet<String>()
        def claimedTestIdentities =
                new LinkedHashSet<String>()
        authored.each { caseId, authoredCase ->
            String className
            String exactNamePattern
            if (authoredCase.kind == 'behavior') {
                className =
                        'blue.coordination.processor.'
                                .concat(
                                        'CoordinationBehaviorFixtureHarnessTest')
                exactNamePattern =
                        [
                                '^[0-9]+: ',
                                java.util.regex.Pattern.quote(caseId),
                                '$'
                        ].join()
            } else if (authoredCase.kind
                    == 'portable-gas') {
                className =
                        'blue.language.processor.'
                                .concat(
                                        'CoordinationDirectPortableGasMicrofixtureTest')
                exactNamePattern =
                        [
                                '^shouldExecuteDirectPortableGasMicrofixture',
                                '\\[[0-9]+\\] ',
                                java.util.regex.Pattern.quote(
                                        'coordination/conformance/'
                                                .concat(
                                                        authoredCase.fixture)),
                                '$'
                        ].join()
            } else if (authoredCase.kind
                    == 'host-quota') {
                className =
                        'blue.coordination.processor.'
                                .concat(
                                        'CoordinationHostQuotaFixtureTest')
                String fixtureName =
                        authoredCase.fixture.substring(
                                authoredCase.fixture
                                        .lastIndexOf('/') + 1)
                exactNamePattern =
                        [
                                '^',
                                java.util.regex.Pattern.quote(
                                        [
                                                caseId,
                                                ' [',
                                                fixtureName,
                                                ']'
                                        ].join()),
                                '$'
                        ].join()
            } else {
                throw new GradleException(
                        "Unknown authored Coordination case kind: "
                                + authoredCase)
            }
            def matching = observedTests.findAll { observed ->
                observed.className == className
                        && observed.name
                        ==~ exactNamePattern
            }
            if (matching.size() != 1) {
                throw new GradleException(
                        "Authored Coordination case ${caseId} must bind "
                                + "to exactly one JUnit execution; pattern="
                                + exactNamePattern + ", matches="
                                + matching.collect { it.name })
            }
            String testIdentity =
                    [
                            matching[0].className,
                            matching[0].name
                    ].join('#')
            if (!claimedTestIdentities.add(
                    testIdentity)) {
                throw new GradleException(
                        "JUnit execution ${testIdentity} was already bound "
                                + "to another authored Coordination case")
            }
            if (matching[0].failed
                    || matching[0].skipped) {
                throw new GradleException(
                        "Authored Coordination case ${caseId} did not "
                                + "complete successfully in JUnit")
            }
            observedCaseIds.add(caseId)
        }
        if (observedCaseIds
                != (authored.keySet()
                as Set)
                || claimedTestIdentities.size()
                != authored.size()) {
            throw new GradleException(
                    "Observed Coordination conformance case inventory "
                            + "does not equal the one-to-one authored "
                            + "86-case matrix")
        }

        def executionCases =
                authored.values().collect { authoredCase ->
                    def observed =
                            new LinkedHashMap<String, Object>()
                    observed.putAll(authoredCase)
                    observed.put('status', 'passed')
                    observed
                }
        File manifestFile =
                new File(
                        coordinationConformancePackageDirectory,
                        'manifest.yaml')
        if (!manifestFile.isFile()) {
            throw new GradleException(
                    "Coordination conformance manifest is missing: "
                            + manifestFile)
        }
        def receipt =
                new LinkedHashMap<String, Object>()
        receipt.put(
                'schema',
                'blue.coordination/conformance-result/1.0')
        receipt.put(
                'status',
                'complete')
        receipt.putAll(
                exactCoordinationConformanceReceiptIdentities())
        receipt.put(
                'vectorCount',
                requiredCoordinationConformanceCounts
                        .vectorCount)
        receipt.put(
                'behaviorFixtureCount',
                requiredCoordinationConformanceCounts
                        .behaviorFixtureCount)
        receipt.put(
                'portableGasFixtureCount',
                requiredCoordinationConformanceCounts
                        .portableGasFixtureCount)
        receipt.put(
                'hostQuotaFixtureCount',
                requiredCoordinationConformanceCounts
                        .hostQuotaFixtureCount)
        receipt.put(
                'fixtureFileCount',
                requiredCoordinationConformanceCounts
                        .fixtureFileCount)
        receipt.put(
                'executionCaseCount',
                requiredCoordinationConformanceCounts
                        .executionCaseCount)
        receipt.put(
                'passed',
                requiredCoordinationConformanceCounts
                        .passed)
        receipt.put(
                'failures',
                requiredCoordinationConformanceCounts
                        .failures)
        receipt.put(
                'skips',
                requiredCoordinationConformanceCounts
                        .skips)
        receipt.put(
                'executionCases',
                executionCases)
        receiptFile.parentFile.mkdirs()
        receiptFile.setText(
                groovy.json.JsonOutput.prettyPrint(
                        groovy.json.JsonOutput.toJson(
                                receipt)) + '\n',
                'UTF-8')
}

tasks.named(
        'coordinationClosedConformanceTest',
        Test) { conformanceTest ->
    dependsOn verifyCoordinationConformanceReceiptIdentities
    outputs.file(coordinationConformanceReceipt)
    doFirst {
        delete(
                coordinationConformanceReceipt
                        .get().asFile)
    }
    doLast {
        writeCoordinationConformanceReceiptFromJUnit(
                layout.buildDirectory.dir(
                        "test-results/${conformanceTest.name}")
                        .get().asFile,
                coordinationConformanceReceipt
                        .get().asFile)
        validateCoordinationConformanceReceipt(
                coordinationConformanceReceipt
                        .get().asFile,
                false)
    }
}

def readExactFlagshipEvidence = { File traceFile ->
    if (!traceFile.isFile()) {
        throw new GradleException(
                "Flagship evidence is missing: ${traceFile}")
    }
    String source = traceFile.getText('UTF-8')
    List<String> sourceLines = source.readLines()
    [
            '- Public-event variants: `2`',
            '- Descendants-only PROCESS runs: `16`',
            '- Root D1,D2 PROCESS runs: `16`',
            '- Total PROCESS runs: `32`'
    ].each { summaryLine ->
        if (sourceLines.count {
            it == summaryLine
        } != 1) {
            throw new GradleException(
                    "Flagship evidence must contain one exact summary line: "
                            + summaryLine)
        }
    }
    def exactNumericSummary = {
        String label ->
            def pattern =
                    java.util.regex.Pattern.compile(
                            '^- '
                                    + java.util.regex.Pattern.quote(label)
                                    + ': `([0-9]+)`$')
            def values = sourceLines.collect { line ->
                def matcher = pattern.matcher(line)
                matcher.matches()
                        ? Long.valueOf(
                        Long.parseLong(
                                matcher.group(1)))
                        : null
            }.findAll { it != null }
            if (values.size() != 2
                    || values.any { it <= 0L }) {
                throw new GradleException(
                        "Flagship evidence must contain two exact positive "
                                + "${label} summaries")
            }
            return values
    }
    def storedFragmentBytes =
            exactNumericSummary(
                    'Total stored fragment bytes')
    def forbiddenFragmentBytes =
            exactNumericSummary(
                    'Forbidden decoy fragment bytes')
    def selectedBodyBytes =
            exactNumericSummary(
                    'Selected body bytes')
    for (int index = 0; index < 2; index++) {
        if (forbiddenFragmentBytes[index]
                >= storedFragmentBytes[index]
                || selectedBodyBytes[index]
                >= storedFragmentBytes[index]) {
            throw new GradleException(
                    "Forbidden and selected flagship bytes must each be "
                            + "positive strict subsets of total stored bytes")
        }
    }
    def storedBytesByVariant = [
            'descendants-only': storedFragmentBytes[0],
            'Root D1,D2'      : storedFragmentBytes[1]
    ]
    def forbiddenBytesByVariant = [
            'descendants-only': forbiddenFragmentBytes[0],
            'Root D1,D2'      : forbiddenFragmentBytes[1]
    ]
    def selectedBodyBytesByVariant = [
            'descendants-only': selectedBodyBytes[0],
            'Root D1,D2'      : selectedBodyBytes[1]
    ]
    String matrixHeader =
            '| Variant | Entry | Cache | Provider | Status | '
                    + 'Requested | Backend loaded | Backend trips | '
                    + 'Requested bytes | Backend-loaded bytes | '
                    + 'Selected bodies | Selected bytes | Gas |'
    String matrixSeparator =
            '|---|---|---|---|---|---:|---:|---:|'
                    + '---:|---:|---:|---:|---:|'
    if (sourceLines.count {
        it == matrixHeader
    } != 1
            || sourceLines.count {
        it == matrixSeparator
    } != 1
            || sourceLines.count {
        it == '## Combined representation/provider matrix'
    } != 1) {
        throw new GradleException(
                "Flagship evidence must contain one exact combined "
                        + "representation/provider matrix header")
    }

    def orderedStreams =
            new TreeMap<String, List<String>>()
    def identitySets =
            new TreeMap<String, List<String>>()
    def expectedVariants = [
            'descendants-only',
            'Root D1,D2'
    ]
    def orderedHeadings = [
            'External delivery order',
            'Handler order',
            'Effect order',
            'Event enqueue order',
            'Event dequeue order',
            'Event delivery order',
            'Checkpoint order',
            'Root-only public events',
            'Gas trace',
            'Semantic demands'
    ]
    def identityHeadingOrder = [
            'Selected body BlueIds',
            'Provider requested BlueIds',
            'Provider backend-loaded BlueIds',
            'Forbidden BlueIds'
    ]
    def identityHeadings =
            new LinkedHashSet<String>(
                    identityHeadingOrder)
    def expectedHeadings =
            new ArrayList<String>(
                    orderedHeadings)
    expectedHeadings.addAll(identityHeadingOrder)
    def expectedBlockKeys =
            new ArrayList<String>()
    expectedVariants.each { variant ->
        expectedHeadings.each { heading ->
            expectedBlockKeys.add(
                    variant + '/' + heading)
        }
    }
    def observedVariants =
            new ArrayList<String>()
    def declaredBlockKeys =
            new ArrayList<String>()
    def observedBlockKeys =
            new ArrayList<String>()
    def explicitEmptyBlocks =
            new LinkedHashSet<String>()
    String observedVariant = null
    String observedHeading = null
    String observedBlockKey = null
    boolean inObservedBlock = false
    sourceLines.each { line ->
        if (inObservedBlock) {
            def destination =
                    identityHeadings.contains(
                            observedHeading)
                            ? identitySets
                            : orderedStreams
            if (line == '```') {
                boolean explicitlyEmpty =
                        explicitEmptyBlocks.contains(
                                observedBlockKey)
                boolean actuallyEmpty =
                        destination.get(
                                observedBlockKey)
                                .isEmpty()
                if (explicitlyEmpty
                        != actuallyEmpty) {
                    throw new GradleException(
                            "Empty flagship evidence block must use exactly "
                                    + "one (none) marker: "
                                    + observedBlockKey)
                }
                inObservedBlock = false
            } else if (line == '```text'
                    || line.startsWith('## ')
                    || line.startsWith('### ')) {
                throw new GradleException(
                        "Flagship evidence block is missing its closing "
                                + "fence before: " + line)
            } else if (line == '(none)') {
                if (!destination.get(
                        observedBlockKey).isEmpty()
                        || !explicitEmptyBlocks.add(
                        observedBlockKey)) {
                    throw new GradleException(
                            "Invalid empty flagship evidence block: "
                                    + observedBlockKey)
                }
            } else {
                if (line.isEmpty()
                        || explicitEmptyBlocks.contains(
                        observedBlockKey)) {
                    throw new GradleException(
                            "Invalid flagship evidence line in "
                                    + observedBlockKey)
                }
                destination.get(
                        observedBlockKey).add(line)
            }
        } else if (line.startsWith('## Variant: ')) {
            observedVariant =
                    line.substring(
                            '## Variant: '.length())
            if (!expectedVariants.contains(
                    observedVariant)
                    || observedVariants.contains(
                    observedVariant)) {
                throw new GradleException(
                        "Unexpected or duplicate flagship variant: "
                                + observedVariant)
            }
            observedVariants.add(
                    observedVariant)
            observedHeading = null
            observedBlockKey = null
        } else if (line.startsWith('## ')) {
            observedVariant = null
            observedHeading = null
            observedBlockKey = null
        } else if (line.startsWith('### ')) {
            if (observedVariant == null) {
                throw new GradleException(
                        "Flagship evidence heading is outside a variant: "
                                + line)
            }
            observedHeading =
                    line.substring('### '.length())
            observedBlockKey =
                    [
                            observedVariant,
                            observedHeading
                    ].join('/')
            if (!expectedHeadings.contains(
                    observedHeading)
                    || declaredBlockKeys.contains(
                    observedBlockKey)) {
                throw new GradleException(
                        "Unexpected or duplicate flagship evidence heading: "
                                + observedBlockKey)
            }
            declaredBlockKeys.add(observedBlockKey)
            inObservedBlock = false
        } else if (line == '```text') {
            if (observedVariant == null
                    || observedHeading == null
                    || observedBlockKey == null
                    || observedBlockKeys.contains(
                    observedBlockKey)) {
                throw new GradleException(
                        "Unexpected or duplicate flagship evidence block: "
                                + observedBlockKey)
            }
            observedBlockKeys.add(observedBlockKey)
            def destination =
                    identityHeadings.contains(
                            observedHeading)
                            ? identitySets
                            : orderedStreams
                destination.put(
                    observedBlockKey,
                    new ArrayList<String>())
            inObservedBlock = true
        } else if (line == '```') {
            throw new GradleException(
                    "Flagship evidence contains an unmatched fence")
        }
    }
    if (inObservedBlock
            || observedVariants != expectedVariants
            || declaredBlockKeys != expectedBlockKeys
            || observedBlockKeys != expectedBlockKeys) {
        throw new GradleException(
                "Flagship evidence must contain the exact per-variant "
                        + "observed block inventory; variants="
                        + observedVariants + ", headings="
                        + declaredBlockKeys + ", blocks="
                        + observedBlockKeys)
    }
    identitySets.each { key, identities ->
        if (identities.isEmpty()
                || identities
                != new ArrayList<String>(
                        new TreeSet<String>(
                                identities))
                || identities.any {
            !(it ==~ /[1-9A-HJ-NP-Za-km-z]{32,64}/)
        }) {
            throw new GradleException(
                    "Flagship identity set ${key} must be non-empty, "
                            + "canonical Base58, unique, and lexically sorted")
        }
    }
    expectedVariants.each { variant ->
        def selectedIdentities =
                identitySets.get(
                        variant
                                + '/Selected body BlueIds')
        def requestedIdentities =
                identitySets.get(
                        variant
                                + '/Provider requested BlueIds')
        def backendLoadedIdentities =
                identitySets.get(
                        variant
                                + '/Provider backend-loaded BlueIds')
        def forbiddenIdentities =
                identitySets.get(
                        variant
                                + '/Forbidden BlueIds')
        if (!backendLoadedIdentities.containsAll(
                requestedIdentities)
                || !Collections.disjoint(
                        selectedIdentities,
                        forbiddenIdentities)
                || !Collections.disjoint(
                        requestedIdentities,
                        forbiddenIdentities)
                || !Collections.disjoint(
                        backendLoadedIdentities,
                        forbiddenIdentities)) {
            throw new GradleException(
                    "Flagship selected/provider identity evidence violates "
                            + "selection/demand/prefetch locality for "
                            + variant)
        }
    }

    def matrixTableLines =
            sourceLines.findAll { line ->
                line.startsWith('|')
            }
    if (matrixTableLines.size() != 34
            || matrixTableLines[0] != matrixHeader
            || matrixTableLines[1] != matrixSeparator) {
        throw new GradleException(
                "Flagship evidence must contain exactly one 32-row matrix "
                        + "and no unexpected table rows")
    }
    def matrixRows =
            new ArrayList<String>(
                    matrixTableLines.subList(
                            2,
                            matrixTableLines.size()))
    def expectedTuples = new ArrayList<String>()
    [
            'descendants-only',
            'Root D1,D2'
    ].each { variant ->
        [
                'INLINE',
                'REFERENCES',
                'PARTIAL',
                'SPLITTER'
        ].each { entry ->
            ['COLD', 'WARM'].each { cache ->
                [
                        'ONE_FRAGMENT',
                        'BOUNDED_BATCH'
                ].each { provider ->
                    expectedTuples.add(
                            "${variant}|${entry}|${cache}|${provider}")
                }
            }
        }
    }
    def observedTuples = new ArrayList<String>()
    def rowPattern = java.util.regex.Pattern.compile(
            '^\\| (descendants-only|Root D1,D2) '
                    + '\\| (INLINE|REFERENCES|PARTIAL|SPLITTER) '
                    + '\\| (COLD|WARM) '
                    + '\\| (ONE_FRAGMENT|BOUNDED_BATCH) '
                    + '\\| SUCCESS '
                    + '\\| ([0-9]+) \\| ([0-9]+) \\| ([0-9]+) '
                    + '\\| ([0-9]+) \\| ([0-9]+) \\| ([0-9]+) '
                    + '\\| ([0-9]+) \\| ([0-9]+) \\|$')
    matrixRows.each { row ->
        def match = rowPattern.matcher(row)
        if (!match.matches()) {
            throw new GradleException(
                    "Invalid flagship matrix row: ${row}")
        }
        String tuple =
                [
                        match.group(1),
                        match.group(2),
                        match.group(3),
                        match.group(4)
                ].join('|')
        if (observedTuples.contains(tuple)) {
            throw new GradleException(
                    "Duplicate flagship matrix tuple: ${tuple}")
        }
        observedTuples.add(tuple)
        String variant =
                match.group(1)
        String cache =
                match.group(3)
        String provider =
                match.group(4)
        long requested =
                Long.parseLong(match.group(5))
        long backendLoaded =
                Long.parseLong(match.group(6))
        long backendTrips =
                Long.parseLong(match.group(7))
        long requestedBytes =
                Long.parseLong(match.group(8))
        long backendLoadedBytes =
                Long.parseLong(match.group(9))
        long selectedBodyCount =
                Long.parseLong(match.group(10))
        long selectedBytes =
                Long.parseLong(match.group(11))
        long gas =
                Long.parseLong(match.group(12))
        long storedBytes =
                storedBytesByVariant.get(
                        variant)
        long forbiddenBytes =
                forbiddenBytesByVariant.get(
                        variant)
        long expectedSelectedBytes =
                selectedBodyBytesByVariant.get(
                        variant)
        int expectedSelectedBodyCount =
                identitySets.get(
                        variant
                                + '/Selected body BlueIds')
                        .size()
        boolean inconsistentRequestedBytes =
                (requested == 0L)
                        != (requestedBytes == 0L)
        boolean inconsistentBackendBytes =
                (backendLoaded == 0L)
                        != (backendLoadedBytes == 0L)
        boolean impossibleTripCount =
                backendTrips > requested
        boolean impossibleByteSelection =
                requestedBytes > storedBytes
                        || backendLoadedBytes > storedBytes
                        || requestedBytes >= forbiddenBytes
                        || backendLoadedBytes >= forbiddenBytes
        boolean inconsistentLogicalSelection =
                selectedBodyCount
                        != expectedSelectedBodyCount
                        || selectedBytes
                        != expectedSelectedBytes
                        || selectedBodyCount <= 0L
                        || selectedBytes <= 0L
                        || selectedBytes >= storedBytes
        boolean warmCachePerformedBackendWork =
                cache == 'WARM'
                        && (backendLoaded != 0L
                        || backendTrips != 0L
                        || backendLoadedBytes != 0L)
        boolean demandFreeRunPerformedBackendWork =
                requested == 0L
                        && (backendLoaded != 0L
                        || backendTrips != 0L
                        || backendLoadedBytes != 0L)
        boolean coldDemandSkippedBackendWork =
                cache == 'COLD'
                        && requested > 0L
                        && (backendLoaded == 0L
                        || backendTrips == 0L)
        boolean invalidOneFragmentMetrics =
                provider == 'ONE_FRAGMENT'
                        && (backendLoaded != backendTrips
                        || backendLoaded > requested
                        || backendLoadedBytes > requestedBytes)
        boolean exceedsBoundedBatchSize =
                backendTrips > Long.MAX_VALUE / 8L
                        || backendLoaded > backendTrips * 8L
        boolean invalidBoundedBatchMetrics =
                provider == 'BOUNDED_BATCH'
                        && (backendLoaded < backendTrips
                        || exceedsBoundedBatchSize)
        if (inconsistentRequestedBytes
                || inconsistentBackendBytes
                || impossibleTripCount
                || impossibleByteSelection
                || inconsistentLogicalSelection
                || warmCachePerformedBackendWork
                || demandFreeRunPerformedBackendWork
                || coldDemandSkippedBackendWork
                || invalidOneFragmentMetrics
                || invalidBoundedBatchMetrics
                || gas <= 0L) {
            throw new GradleException(
                    "Impossible flagship selection/provider/gas metrics: "
                            + row)
        }
    }
    if (matrixRows.size() != 32
            || observedTuples != expectedTuples) {
        throw new GradleException(
                "Flagship evidence must contain the exact unique 2x4x2x2 "
                        + "representation/provider matrix; observed="
                        + observedTuples)
    }
    orderedStreams.put(
            'representationProviderMatrix',
            new ArrayList<String>(matrixRows))
    return [
            orderedStreams: orderedStreams,
            identitySets  : identitySets,
            localityBytes : [
                    storedFragmentBytes:
                            storedBytesByVariant,
                    forbiddenDecoyFragmentBytes:
                            forbiddenBytesByVariant,
                    selectedBodyBytes:
                            selectedBodyBytesByVariant
            ]
    ]
}

def readExactLoopEvidence = { File traceFile ->
    if (!traceFile.isFile()) {
        throw new GradleException(
                "Infinite-loop evidence is missing: ${traceFile}")
    }
    def strictLoopEvidenceMapper =
            new com.fasterxml.jackson.databind.ObjectMapper()
    strictLoopEvidenceMapper.enable(
            com.fasterxml.jackson.core.JsonParser.Feature
                    .STRICT_DUPLICATE_DETECTION)
    strictLoopEvidenceMapper.enable(
            com.fasterxml.jackson.databind.DeserializationFeature
                    .FAIL_ON_TRAILING_TOKENS)
    def parsed
    try {
        parsed =
                strictLoopEvidenceMapper.readValue(
                        traceFile,
                        Map)
    } catch (IOException invalidJson) {
        throw new GradleException(
                "Infinite-loop evidence is not strict JSON",
                invalidJson)
    }
    if (!(parsed instanceof Map)
            || (parsed.keySet() as Set)
            != (['schema', 'cases'] as Set)
            || parsed.schema
            != 'coordination-loop-evidence/1.0'
            || !(parsed.cases instanceof List)
            || parsed.cases.size() != 8) {
        throw new GradleException(
                "Infinite-loop evidence is not the exact eight-case object")
    }
    def expectedCases = [
            'cross-scope-update-event-loop',
            'document-update-self-loop',
            'embedded-child-ancestor-event-loop',
            'large-finite-bex-parent-child-budget',
            'multi-source-logical-delivery-loop',
            'nested-compute-event-loop',
            'parent-bound-bex-exhaustion',
            'triggered-event-self-loop'
    ]
    def observedCases = new ArrayList<String>()
    def orderedStreams =
            new TreeMap<String, List<String>>()
    def requiredCaseKeys = [
            'case',
            'status',
            'gasLimit',
            'totalGas',
            'gasEntryCount',
            'recordCount',
            'gasPrefix',
            'recordPrefix',
            'rollback'
    ] as Set
    def requiredRollbackKeys = [
            'exactInputRoot',
            'publicEventsEmpty',
            'checkpointAbsent',
            'rejectedChargeAbsent',
            'noWorkAfterRejection'
    ] as Set
    def exactNonNegativeLong = {
        Object value, String label ->
            if (!(value instanceof Byte)
                    && !(value instanceof Short)
                    && !(value instanceof Integer)
                    && !(value instanceof Long)
                    && !(value
                    instanceof java.math.BigInteger)
                    && !(value
                    instanceof java.math.BigDecimal)) {
                throw new GradleException(
                        "${label} must be an exact JSON integer")
            }
            try {
                java.math.BigDecimal decimal =
                        new java.math.BigDecimal(
                                value.toString())
                java.math.BigInteger integer =
                        decimal.toBigIntegerExact()
                long exact = integer.longValueExact()
                if (exact < 0L) {
                    throw new ArithmeticException(
                            'negative')
                }
                return exact
            } catch (ArithmeticException
                     | NumberFormatException invalid) {
                throw new GradleException(
                        "${label} must be a non-negative 64-bit integer",
                        invalid)
            }
    }
    def validateGasPrefix = {
        List values, Long count, String caseName ->
            if (values.size()
                    != Math.min(
                    count.longValue(), 32L)) {
                throw new GradleException(
                        "${caseName} gasPrefix must contain exactly "
                                + "min(gasEntryCount, 32) entries")
            }
            java.math.BigInteger admittedPrefix =
                    java.math.BigInteger.ZERO
            values.eachWithIndex { value, index ->
                if (!(value instanceof String)
                        || value.isEmpty()
                        || value.contains('\n')
                        || value.contains('\r')) {
                    throw new GradleException(
                            "${caseName} gasPrefix[${index}] "
                                    + "must be one non-empty line")
                }
                String[] fields =
                        value.split('\\|', -1)
                if (fields.length != 10
                        || fields[0]
                        != String.valueOf(index)
                        || fields[1].isEmpty()
                        || fields[2].isEmpty()
                        || !(fields[3] ==~ /[0-9]+/)
                        || !(fields[4] ==~ /[0-9]+/)
                        || !(fields[5] ==~ /[0-9]+/)
                        || fields[6].isEmpty()
                        || fields[7].isEmpty()
                        || fields[8].isEmpty()
                        || fields[9].isEmpty()
                        || fields[6..9].any {
                    it.contains('\n')
                            || it.contains('\r')
                }) {
                    throw new GradleException(
                            "${caseName} gasPrefix[${index}] "
                                    + "is not an exact gas projection")
                }
                java.math.BigInteger quantity =
                        new java.math.BigInteger(
                                fields[3])
                java.math.BigInteger weight =
                        new java.math.BigInteger(
                                fields[4])
                java.math.BigInteger subtotal =
                        new java.math.BigInteger(
                                fields[5])
                if (quantity.multiply(weight)
                        != subtotal
                        || subtotal.compareTo(
                        java.math.BigInteger
                                .valueOf(Long.MAX_VALUE)) > 0) {
                    throw new GradleException(
                            "${caseName} gasPrefix[${index}] "
                                    + "contains impossible gas arithmetic")
                }
                admittedPrefix =
                        admittedPrefix.add(subtotal)
            }
            return admittedPrefix
    }
    def validateRecordPrefix = {
        List values, Long count, String caseName ->
            if (values.size()
                    != Math.min(
                    count.longValue(), 24L)) {
                throw new GradleException(
                        "${caseName} recordPrefix must contain exactly "
                                + "min(recordCount, 24) entries")
            }
            values.eachWithIndex { value, index ->
                if (!(value instanceof String)
                        || value.isEmpty()
                        || value.contains('\n')
                        || value.contains('\r')) {
                    throw new GradleException(
                            "${caseName} recordPrefix[${index}] "
                                    + "must be one non-empty line")
                }
                String[] fields =
                        value.split('\\|', -1)
                def decodeCanonicalField = {
                    String field, String label ->
                        if (field == '~') {
                            return null
                        }
                        if (field == '.') {
                            return ''
                        }
                        if (!(field
                                ==~ /[A-Za-z0-9_-]+/)) {
                            throw new GradleException(
                                    "${label} is not canonical Base64URL")
                        }
                        try {
                            byte[] decoded =
                                    java.util.Base64
                                            .getUrlDecoder()
                                            .decode(field)
                            String decodedText =
                                    new String(
                                            decoded,
                                            java.nio.charset
                                                    .StandardCharsets.UTF_8)
                            String canonical =
                                    java.util.Base64
                                            .getUrlEncoder()
                                            .withoutPadding()
                                            .encodeToString(decoded)
                            if (decodedText.isEmpty()
                                    || canonical != field) {
                                throw new IllegalArgumentException(
                                        'non-canonical encoding')
                            }
                            return decodedText
                        } catch (IllegalArgumentException invalid) {
                            throw new GradleException(
                                    "${label} is not canonical Base64URL",
                                    invalid)
                        }
                }
                if (fields.length != 7
                        || fields[0]
                        != String.valueOf(index)
                        || !(fields[1]
                        ==~ /[A-Z][A-Z_]*/)
                        || !(fields[6] == '~'
                        || fields[6]
                        ==~ /[1-9A-HJ-NP-Za-km-z]{32,64}/)) {
                    throw new GradleException(
                            "${caseName} recordPrefix[${index}] "
                                    + "is not an exact seven-field record "
                                    + "projection")
                }
                String scope =
                        decodeCanonicalField(
                                fields[2],
                                "${caseName} recordPrefix[${index}] scope")
                decodeCanonicalField(
                        fields[3],
                        "${caseName} recordPrefix[${index}] contract")
                decodeCanonicalField(
                        fields[4],
                        "${caseName} recordPrefix[${index}] logicalPath")
                decodeCanonicalField(
                        fields[5],
                        "${caseName} recordPrefix[${index}] details")
                if (scope != null
                        && !scope.startsWith('/')) {
                    throw new GradleException(
                            "${caseName} recordPrefix[${index}] "
                                    + "contains a non-absolute scope path")
                }
            }
    }
    parsed.cases.each { loopCase ->
        if (!(loopCase instanceof Map)
                || (loopCase.keySet() as Set)
                != requiredCaseKeys
                || !(loopCase.get('case')
                instanceof String)
                || observedCases.contains(
                        loopCase.get('case'))
                || loopCase.status
                        != 'GAS_LIMIT_EXCEEDED'
                || !(loopCase.gasPrefix
                instanceof List)
                || !(loopCase.recordPrefix
                instanceof List)
                || !(loopCase.rollback
                instanceof Map)
                || (loopCase.rollback.keySet()
                as Set) != requiredRollbackKeys
                || loopCase.rollback.values()
                .any { it != true }) {
            throw new GradleException(
                    "Invalid exact infinite-loop case evidence: "
                            + loopCase)
        }
        String caseName = loopCase.get('case')
        observedCases.add(caseName)
        long gasLimit =
                exactNonNegativeLong(
                        loopCase.gasLimit,
                        "${caseName}.gasLimit")
        long totalGas =
                exactNonNegativeLong(
                        loopCase.totalGas,
                        "${caseName}.totalGas")
        long gasEntryCount =
                exactNonNegativeLong(
                        loopCase.gasEntryCount,
                        "${caseName}.gasEntryCount")
        long recordCount =
                exactNonNegativeLong(
                        loopCase.recordCount,
                        "${caseName}.recordCount")
        if (gasLimit <= 0L
                || totalGas > gasLimit
                || gasEntryCount <= 0L
                || gasEntryCount > Integer.MAX_VALUE
                || recordCount <= 0L
                || recordCount > Integer.MAX_VALUE) {
            throw new GradleException(
                    "Invalid exact infinite-loop counts for "
                            + caseName)
        }
        java.math.BigInteger prefixGas =
                validateGasPrefix(
                        loopCase.gasPrefix,
                        gasEntryCount,
                        caseName)
        validateRecordPrefix(
                loopCase.recordPrefix,
                recordCount,
                caseName)
        if (gasEntryCount <= 32L
                && prefixGas
                != java.math.BigInteger
                .valueOf(totalGas)) {
            throw new GradleException(
                    "${caseName} complete gas prefix does not sum "
                            + "to totalGas")
        }
        orderedStreams.put(
                caseName + '/gasPrefix',
                new ArrayList<String>(
                        loopCase.gasPrefix))
        orderedStreams.put(
                caseName + '/recordPrefix',
                new ArrayList<String>(
                        loopCase.recordPrefix))
    }
    if (observedCases != expectedCases
            || orderedStreams.keySet().size() != 16) {
        throw new GradleException(
                "Infinite-loop evidence case matrix is incomplete: "
                        + observedCases)
    }
    return [
            cases         : parsed.cases,
            orderedStreams: orderedStreams
    ]
}

