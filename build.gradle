                                        + 'coalesced multi-source logical delivery loop, finite hosted BEX parent/child budget, '
                                        + 'and parent-bound hosted BEX exhaustion',
                        rollback:
                                'exact input Root, empty public events, absent checkpoint, rejected charge absent, and no work after rejection'
                ],
                'root-emb1-emb2-emb3-flagship': [
                        causalScopes:
                                'Emb3 -> Emb2 -> Emb1 -> Root',
                        providerLocality:
                                'strict provider, forbidden-demand exclusion, and byte-selective evidence'
                ],
                'local-fixed-repository-compatibility': [
                        dependencyMode:
                                'mandatory exact local immutable-HEAD composite build',
                        repositoryManifest:
                                'repo.blue '
                                        + repositoryManifest
                                        .repositoryVersion
                                        + ' / '
                                        + repositoryManifest
                                        .repositoryVersionBlueId
                ],
                'closed-coordination-conformance': [
                        fixtureLanguage:
                                'closed schema, closed controls, exact authored Blue inputs, and same-run receipt'
                ]
        ]

        def sections = new ArrayList<Map<String, Object>>()
        finalCoordinationSectionTasks.each {
            sectionId, taskName ->
            Map<String, Object> counts =
                    taskCounts.get(taskName)
            def facts = new TreeMap<String, String>()
            def caseIds =
                    new ArrayList<String>(counts.cases)
            facts.put('gradleTask', taskName)
            facts.put('result', 'passed')
            def sectionFactValues =
                    standardSectionFacts.containsKey(sectionId)
                            ? standardSectionFacts.get(sectionId)
                            : Collections.emptyMap()
            sectionFactValues.each { key, value ->
                        facts.put(
                                key.toString(),
                                value.toString())
            }
            def orderedStreams =
                    new TreeMap<String, List<String>>()
            def identitySets =
                    new TreeMap<String, List<String>>()
            if (sectionId
                    == 'root-emb1-emb2-emb3-flagship') {
                facts.put(
                        'derivedTraceSha256',
                        sha256File(flagshipTrace))
                facts.put(
                        'representationProviderRuns',
                        '32')
                facts.put(
                        'rootOnlyEventVariants',
                        'none; D1,D2')
                orderedStreams.putAll(
                        flagshipOrderedStreams)
                identitySets.putAll(
                        flagshipIdentitySets)
            } else if (sectionId
                    == 'infinite-loop-rollback') {
                facts.put(
                        'derivedTracePrefixesSha256',
                        sha256File(loopTrace))
                facts.put(
                        'derivedLoopCaseCount',
                        parsedLoopEvidence.cases
                                .size()
                                .toString())
                orderedStreams.putAll(
                        loopOrderedStreams)
            } else if (sectionId
                    == 'timeline-projection-and-subtypes') {
                facts.put(
                        'projectionVersion',
                        'blue.coordination/1.0/timeline-entry-projection-v3')
                facts.put(
                        'maximumEventProjectionKeys',
                        '9')
            } else if (sectionId
                    == 'runtime-gas-and-hosted-bex') {
                facts.put(
                        'portableCoordinationCounters',
                        '14')
                facts.put(
                        'hostQuotaCounters',
                        '5')
            } else if (sectionId
                    == 'closed-coordination-conformance') {
                caseIds = conformanceEvidence.caseIds
                facts.put(
                        'fixturePackageIdentity',
                        conformanceEvidence.packageIdentity)
                facts.put(
                        'fixtureFileCount',
                        requiredCoordinationConformanceCounts
                                .fixtureFileCount.toString())
                facts.put(
                        'portableGasFixtureCount',
                        requiredCoordinationConformanceCounts
                                .portableGasFixtureCount.toString())
                facts.put(
                        'hostQuotaFixtureCount',
                        requiredCoordinationConformanceCounts
                                .hostQuotaFixtureCount.toString())
                facts.put(
                        'executionCaseCount',
                        requiredCoordinationConformanceCounts
                                .executionCaseCount.toString())
                facts.put(
                        'vectorCount',
                        requiredCoordinationConformanceCounts
                                .vectorCount.toString())
            }
            def metrics = new TreeMap<String, Long>()
            metrics.put('tests', counts.total)
            metrics.put('passed', counts.passed)
            metrics.put('failed', counts.failed)
            metrics.put('skipped', counts.skipped)
            sections.add([
                    id            : sectionId,
                    status        : 'passed',
                    caseCount     : caseIds.size(),
                    cases         : caseIds,
                    facts         : facts,
                    metrics       : metrics,
                    orderedStreams: orderedStreams,
                    identitySets  : identitySets
            ])
        }

        def report = [
                schema           :
                        'urn:blue:coordination:selective-processing-report:1',
                schemaVersion    : 1,
                status           : 'complete',
                coordinationSpecification:
                        exactConformanceResults
                                .coordinationSpecification,
                behaviorConformance:
                        exactConformanceResults
                                .behavior,
                portableGasConformance:
                        exactConformanceResults
                                .portableGas,
                hostQuotaConformance:
                        exactConformanceResults
                                .hostQuota,
                totalConformance :
                        exactConformanceResults
                                .total,
                flagshipRuns     :
                        exactFlagshipResults
                                .runs,
                maximumRuntimeTraceEntriesObserved:
                        maximumRuntimeTraceEntriesObserved,
                forbiddenProviderDemandCount:
                        exactFlagshipResults
                                .forbiddenProviderDemandCount,
                binaryApiResult  :
                        binaryApiResult,
                java8BytecodeResult:
                        java8BytecodeResult,
                archiveReproducibilityResult:
                        archiveReproducibilityResult,
                identities       : identities,
                testCountScope   :
                        'Release-gating Gradle task invocations; a test selected by both the full and a focused suite is counted once per task invocation.',
                testCounts       : [
                        total  : total,
                        passed : passed,
                        failed : 0,
                        skipped: 0
                ],
                sections         : sections,
                unavailableSuites: []
        ]
        File jsonFile = jsonReport.get().asFile
        jsonFile.parentFile.mkdirs()
        jsonFile.setText(
                groovy.json.JsonOutput.prettyPrint(
                        groovy.json.JsonOutput.toJson(
                                report)) + '\n',
                'UTF-8')

        File markdownFile =
                markdownReport.get().asFile
        markdownFile.parentFile.mkdirs()
        markdownFile.withWriter('UTF-8') { writer ->
            writer.writeLine(
                    '# Blue Coordination final verification')
            writer.writeLine('')
            writer.writeLine(
                    '**Status:** complete')
            writer.writeLine('')
            writer.writeLine(
                    '## Closed release results')
            writer.writeLine('')
            writer.writeLine(
                    "- Coordination specification: `${exactConformanceResults.coordinationSpecification}`")
            writer.writeLine(
                    "- Behavior conformance: `${exactConformanceResults.behavior.passed}/${exactConformanceResults.behavior.required}`")
            writer.writeLine(
                    "- Portable-gas conformance: `${exactConformanceResults.portableGas.passed}/${exactConformanceResults.portableGas.required}`")
            writer.writeLine(
                    "- Host-quota conformance: `${exactConformanceResults.hostQuota.passed}/${exactConformanceResults.hostQuota.required}`")
            writer.writeLine(
                    "- Total conformance: `${exactConformanceResults.total.passed}/${exactConformanceResults.total.required}`")
            writer.writeLine(
                    "- Flagship representation/provider runs: `${exactFlagshipResults.runs.passed}/${exactFlagshipResults.runs.required}`")
            writer.writeLine(
                    "- Maximum runtime trace entries observed: `${maximumRuntimeTraceEntriesObserved}`")
            writer.writeLine(
                    "- Forbidden provider demands: `${exactFlagshipResults.forbiddenProviderDemandCount}`")
            writer.writeLine(
                    "- Binary API: `${binaryApiResult}`")
            writer.writeLine(
                    "- Java 8 bytecode: `${java8BytecodeResult}`")
            writer.writeLine(
                    "- Archive reproducibility: `${archiveReproducibilityResult}`")
            writer.writeLine('')
            writer.writeLine(
                    'This report is generated from the JUnit XML and release artifacts produced in the same clean Gradle graph.')
            writer.writeLine('')
            writer.writeLine('## Test totals')
            writer.writeLine('')
            writer.writeLine(
                    "| Gradle task | Total | Passed | Failed | Skipped |")
            writer.writeLine(
                    '|---|---:|---:|---:|---:|')
            taskCounts.each { taskName, counts ->
                writer.writeLine(
                        "| ${taskName} | ${counts.total} | ${counts.passed} | ${counts.failed} | ${counts.skipped} |")
            }
            writer.writeLine(
                    "| **Release-gating invocations** | **${total}** | **${passed}** | **0** | **0** |")
            writer.writeLine('')
            writer.writeLine('## Exact identities')
            writer.writeLine('')
            identities.each { key, value ->
                writer.writeLine("- `${key}`: `${value}`")
            }
            writer.writeLine('')
            writer.writeLine(
                    '## Runtime registrations')
            writer.writeLine('')
            writer.writeLine(
                    '- Timeline Channel; host-chosen subtypes use the generic explicit registration API')
            writer.writeLine(
                    '- Composite Timeline Channel and All Timelines Channel')
            writer.writeLine(
                    '- Operation, Chat Workflow Operation, Sequential Workflow, and Sequential Workflow Operation')
            writer.writeLine('')
            writer.writeLine(
                    '## Executable evidence')
            writer.writeLine('')
            sections.each { section ->
                writer.writeLine(
                        "### `${section.id}`")
                writer.writeLine('')
                writer.writeLine(
                        "- Status: `passed`")
                writer.writeLine(
                        "- Observed tests: `${section.metrics.tests}`")
                writer.writeLine(
                        "- Observed cases: `${section.caseCount}`")
                section.facts.each { key, value ->
                    writer.writeLine(
                            "- `${key}`: `${value}`")
                }
                writer.writeLine('')
                writer.writeLine('Cases:')
                writer.writeLine('')
                section.cases.each { caseId ->
                    writer.writeLine(
                            "- `${caseId}`")
                }
                if (!section.orderedStreams.isEmpty()) {
                    writer.writeLine('')
                    writer.writeLine(
                            'Ordered evidence streams:')
                    writer.writeLine('')
                    section.orderedStreams.each {
                        streamName, values ->
                        writer.writeLine(
                                "- `${streamName}`: `${values.size()}` entries")
                    }
                }
                if (!section.identitySets.isEmpty()) {
                    writer.writeLine('')
                    writer.writeLine(
                            'Identity sets:')
                    writer.writeLine('')
                    section.identitySets.each {
                        setName, values ->
                        writer.writeLine(
                                "- `${setName}`: `${values.size()}` identities")
                    }
                }
                writer.writeLine('')
            }
            writer.writeLine(
                    '- Flagship exact order and the 32-run representation/provider matrix are derived in `build/reports/coordination-flagship/trace.md`.')
            writer.writeLine(
                    '- Infinite-loop rollback prefixes are derived in `build/reports/coordination-loops/trace-prefixes.json`.')
            writer.writeLine('')
            writer.writeLine(
                    '## Release checks')
            writer.writeLine('')
            binaryCompatibilityReport.get().asFile
                    .eachLine('UTF-8') { line ->
                        writer.writeLine(
                                "- Binary API: `${line}`")
                    }
            java8BytecodeReport.get().asFile
                    .eachLine('UTF-8') { line ->
                        writer.writeLine(
                                "- Java 8: `${line}`")
                    }
            reproducibilityReport.get().asFile
                    .eachLine('UTF-8') { line ->
                        writer.writeLine(
                                "- Reproducibility: `${line}`")
                    }
            writer.writeLine('')
            writer.writeLine(
                    '## Known limitations')
            writer.writeLine('')
            writer.writeLine(
                    'None in the required Coordination release surface. Preparation-only feeder persistence, global ordering, CAS, outbox, and provider networking remain intentionally outside this library.')
        }
    }
}

def legacyAllGreenCoordinationVerification =
        tasks.register('legacyAllGreenCoordinationVerification') {
    group = 'verification'
    description = 'Runs a clean release graph and requires complete exact Coordination evidence.'
    dependsOn tasks.named('clean'),
            finalCoordinationReport
    doLast {
        File reportFile = layout.buildDirectory.file(
                'reports/coordination-final/report.json')
                .get().asFile
        if (!reportFile.isFile()) {
            throw new GradleException(
                    "Final Coordination report is missing")
        }
        def report = new groovy.json.JsonSlurper()
                .parse(reportFile)
        if (!(report instanceof Map)) {
            throw new GradleException(
                    "Final Coordination report must be a JSON object")
        }
        requireJsonSchema(
                report,
                coordinationFinalReportSchemaFile,
                'Final Coordination report')
        def conformanceEvidence =
                validateCoordinationConformanceReceipt(
                        coordinationConformanceReceipt
                                .get().asFile,
                        true)
        def localCompositeEvidence =
                exactLocalCompositeEvidence()
        File localCompositeGraph =
                localCompositeDependencyGraphEvidence
                        .get().asFile
        File normalizedBexLanguageEdge =
                normalizedNestedBexDependencyEvidence
                        .get().asFile
        def independentlyObservedTaskCounts =
                new LinkedHashMap<String, Map<String, Object>>()
        long independentlyObservedTotal = 0L
        long independentlyObservedPassed = 0L
        finalCoordinationTestTasks.each { taskName ->
            def counts = junitTaskCounts(taskName)
            independentlyObservedTaskCounts.put(
                    taskName,
                    counts)
            independentlyObservedTotal += counts.total
            independentlyObservedPassed += counts.passed
        }
        def sections = report.sections
        def sectionIds = sections instanceof List
                ? sections.collect { it.id } as Set
                : Collections.emptySet()
        def expectedSectionIds =
                finalCoordinationSectionTasks.keySet() as Set
        def invalidSection = sections instanceof List
                ? sections.find { section ->
                    section.status != 'passed'
                            || !(section.cases
                                    instanceof List)
                            || section.cases.isEmpty()
                            || section.caseCount
                                    != section.cases.size()
                }
                : true
        def closedSection = sections instanceof List
                ? sections.find {
                    it.id == 'closed-coordination-conformance'
                }
                : null
        def flagshipSection = sections instanceof List
                ? sections.find {
                    it.id == 'root-emb1-emb2-emb3-flagship'
                }
                : null
        def loopSection = sections instanceof List
                ? sections.find {
                    it.id == 'infinite-loop-rollback'
                }
                : null
        String receiptSha256 = sha256File(
                coordinationConformanceReceipt
                        .get().asFile)
        File finalFlagshipTrace =
                layout.buildDirectory.file(
                        'reports/coordination-flagship/trace.md')
                        .get().asFile
        File finalLoopTrace =
                layout.buildDirectory.file(
                        'reports/coordination-loops/trace-prefixes.json')
                        .get().asFile
        def exactFlagshipEvidence =
                readExactFlagshipEvidence(
                        finalFlagshipTrace)
        def exactLoopEvidence =
                readExactLoopEvidence(
                        finalLoopTrace)
        def exactConformanceResults =
                exactFinalReportConformanceEvidence(
                        coordinationConformanceReceipt
                                .get().asFile)
        def exactFlagshipResults =
                exactFinalReportFlagshipEvidence(
                        independentlyObservedTaskCounts
                                .get(
                                'coordinationFlagshipTest'),
                        exactFlagshipEvidence)
        long exactMaximumRuntimeTraceEntriesObserved =
                exactFinalReportMaximumRuntimeTraceEntries(
                        independentlyObservedTaskCounts
                                .get(
                                'coordinationRuntimeGasTest'))
        File finalCurrentJar =
                tasks.named('jar').get()
                        .archiveFile.get().asFile
        File finalCurrentSourcesJar =
                tasks.named('sourcesJar').get()
                        .archiveFile.get().asFile
        File finalCurrentJavadocJar =
                tasks.named('javadocJar').get()
                        .archiveFile.get().asFile
        File finalCurrentSourceArchive =
                tasks.named('sourceArchive').get()
                        .archiveFile.get().asFile
        File finalLanguageJar =
                requiredReceiptArtifact(
                        'blue.language',
                        'blue-language-java',
                        effectiveLocalProjectVersion(
                                blueLanguageVersion),
                        ':blue-language-java',
                        file('../blue-language-java'))
        File finalBexJar =
                requiredReceiptArtifact(
                        'blue.bex',
                        'blue-bex-java',
                        effectiveLocalProjectVersion(
                                blueBexVersion),
                        ':blue-bex-java',
                        file('../blue-bex-java'))
        File finalRepositoryJar =
                requiredReceiptArtifact(
                        'blue.repo',
                        'blue-repo-java',
                        effectiveLocalProjectVersion(
                                blueRepositoryVersion),
                        ':blue-repository-java',
                        blueRepositoryCompositeRoot)
        File finalBinaryCompatibilityBaseline =
                configurations.binaryCompatibilityBaseline
                        .singleFile
        File finalGasManifest =
                file(
                        'src/main/resources/blue/coordination/processor/'
                                + 'coordination-gas-1.0.yaml')
        File finalHostQuotaManifest =
                file(
                        'src/main/resources/blue/coordination/processor/'
                                + 'coordination-host-quotas-1.0.yaml')
        File finalConformanceManifest =
                file(
                        'src/test/resources/coordination/conformance/'
                                + 'manifest.yaml')
        String exactBinaryApiResult =
                exactFinalReportBinaryApiResult(
                        binaryCompatibilityReport
                                .get().asFile,
                        finalCurrentJar)
        String exactJava8BytecodeResult =
                exactFinalReportJava8BytecodeResult(
                        java8BytecodeReport
                                .get().asFile,
                        finalCurrentJar)
        String exactArchiveReproducibilityResult =
                exactFinalReportArchiveReproducibilityResult(
                        reproducibilityReport
                                .get().asFile,
                        [
                                binary            :
                                        finalCurrentJar,
                                sources           :
                                        finalCurrentSourcesJar,
                                javadoc           :
                                        finalCurrentJavadocJar,
                                sourceDistribution:
                                        finalCurrentSourceArchive
                        ])
        def independentlyObservedArtifactIdentities = [
                binaryCompatibilityBaselineSha256:
                        sha256File(
                                finalBinaryCompatibilityBaseline),
                blueSiblingSourceLockSha256:
                        sha256File(
                                siblingSourceLockFile),
                blueLanguageJarSha256:
                        sha256File(
                                finalLanguageJar),
                blueBexJarSha256:
                        sha256File(
                                finalBexJar),
                blueBexLanguageDependencyEvidenceSha256:
                        sha256File(
                                normalizedBexLanguageEdge),
                blueLocalCompositeDependencyGraphSha256:
                        sha256File(
                                localCompositeGraph),
                blueRepositoryJarSha256:
                        sha256File(
                                finalRepositoryJar),
                coordinationJarSha256:
                        sha256File(
                                finalCurrentJar),
                coordinationSourcesJarSha256:
                        sha256File(
                                finalCurrentSourcesJar),
                coordinationJavadocJarSha256:
                        sha256File(
                                finalCurrentJavadocJar),
                coordinationSourceArchiveSha256:
                        sha256File(
                                finalCurrentSourceArchive),
                coordinationGasManifestSha256:
                        sha256File(
                                finalGasManifest),
                coordinationHostQuotaManifestSha256:
                        sha256File(
                                finalHostQuotaManifest),
                coordinationConformanceManifestSha256:
                        sha256File(
                                finalConformanceManifest),
                coordinationConformanceReceiptSchemaSha256:
                        sha256File(
                                coordinationConformanceReceiptSchemaFile),
                coordinationFinalReportSchemaSha256:
                        sha256File(
                                coordinationFinalReportSchemaFile),
                coordinationConformanceReceiptSha256:
                        receiptSha256,
                flagshipTraceSha256:
                        sha256File(
                                finalFlagshipTrace),
                infiniteLoopTraceSha256:
                        sha256File(
                                finalLoopTrace)
        ]
        def invalidArtifactIdentity =
                independentlyObservedArtifactIdentities
                        .find { key, expected ->
                            report.identities.get(
                                    key.toString())
                                    != expected
                        }
        def matchesExecutionResult = {
            Object reported, Map<String, Long> exact ->
                reported instanceof Map
                        && (reported.keySet() as Set)
                        == ([
                        'required',
                        'passed'
                ] as Set)
                        && reported.required
                        == exact.required
                        && reported.passed
                        == exact.passed
        }
        if (report.schema
                != 'urn:blue:coordination:selective-processing-report:1'
                || report.schemaVersion != 1
                || report.status != 'complete'
                || report.coordinationSpecification
                        != exactConformanceResults
                                .coordinationSpecification
                || !matchesExecutionResult(
                report.behaviorConformance,
                exactConformanceResults
                        .behavior)
                || !matchesExecutionResult(
                report.portableGasConformance,
                exactConformanceResults
                        .portableGas)
                || !matchesExecutionResult(
                report.hostQuotaConformance,
                exactConformanceResults
                        .hostQuota)
                || !matchesExecutionResult(
                report.totalConformance,
                exactConformanceResults
                        .total)
                || !matchesExecutionResult(
                report.flagshipRuns,
                exactFlagshipResults
                        .runs)
                || report.maximumRuntimeTraceEntriesObserved
                        != exactMaximumRuntimeTraceEntriesObserved
                || report.forbiddenProviderDemandCount
                        != exactFlagshipResults
                                .forbiddenProviderDemandCount
                || report.binaryApiResult
                        != exactBinaryApiResult
                || report.java8BytecodeResult
                        != exactJava8BytecodeResult
                || report.archiveReproducibilityResult
                        != exactArchiveReproducibilityResult
                || !(report.unavailableSuites instanceof List)
                || !report.unavailableSuites.isEmpty()
                || report.testCounts.total
                        != independentlyObservedTotal
                || report.testCounts.passed
                        != independentlyObservedPassed
                || report.testCounts.failed != 0
                || report.testCounts.skipped != 0
                || report.testCounts.total <= 0
                || sectionIds != expectedSectionIds
                || invalidSection != null
                || closedSection == null
                || closedSection.caseCount
                        != requiredCoordinationConformanceCounts
                                .executionCaseCount
                || (closedSection.cases as Set)
                        != (conformanceEvidence.caseIds as Set)
                || report.identities.blueCoordinationVersion
                        != project.version.toString()
                || report.identities.blueCoordinationCommit
                        != requiredReceiptGitCommit(
                                projectDir,
                                'Coordination')
                || report.identities.blueLanguageVersion
                        != blueLanguageVersion
                || report.identities.blueLanguageDependencyMode
                        != 'local-composite:../blue-language-java'
                || report.identities.blueLanguageCommit
                        != siblingSourceLock.getProperty(
                                'blueLanguageCommit')
                || report.identities.blueBexVersion
                        != blueBexVersion
                || report.identities.blueBexDependencyMode
                        != 'local-composite:../blue-bex-java'
                || report.identities.blueBexCommit
                        != siblingSourceLock.getProperty(
                                'blueBexCommit')
                || report.identities
                        .blueBexLanguageDependencyMode
                        != 'local-composite'
                || report.identities
                        .blueBexLanguageCompositePath
                        != '../blue-language-java'
                || report.identities
                        .blueBexLanguageRequestedCoordinate
                        != localCompositeEvidence.nested
                                .getProperty(
                                'requested.coordinate')
                || report.identities
                        .blueBexLanguageDependencyEvidenceSha256
                        != independentlyObservedArtifactIdentities
                                .blueBexLanguageDependencyEvidenceSha256
                || report.identities
                        .blueLanguageJarSha256
                        != independentlyObservedArtifactIdentities
                                .blueLanguageJarSha256
                || localCompositeEvidence.nested
                        .getProperty(
                        'artifact.sha256')
                        != independentlyObservedArtifactIdentities
                                .blueLanguageJarSha256
                || report.identities
                        .blueRepositoryArtifactVersion
                        != blueRepositoryVersion
                || report.identities
                        .blueRepositoryDependencyMode
                        != 'local-composite:immutable-repository-head'
                || report.identities.blueRepositoryCommit
                        != siblingSourceLock.getProperty(
                                'blueRepositoryCommit')
                || report.identities
                        .blueRepositoryLanguageDependencyMode
                        != 'local-composite'
                || report.identities
                        .blueRepositoryLanguageCompositePath
                        != '../blue-language-java'
                || report.identities
                        .blueRepositoryLanguageRequestedCoordinate
                        != localCompositeEvidence.graph
                                .getProperty(
                                'edge.repositoryToLanguage.requested')
                || report.identities
                        .blueLocalCompositeDependencyGraphSha256
                        != independentlyObservedArtifactIdentities
                                .blueLocalCompositeDependencyGraphSha256
                || report.identities
                        .blueSiblingSourceLockSha256
                        != independentlyObservedArtifactIdentities
                                .blueSiblingSourceLockSha256
                || report.identities.fixedRepositoryVersion
                        != repositoryManifest
                        .repositoryVersion
                        .toString()
                || report.identities.fixedRepositoryVersionBlueId
                        != repositoryManifest
                        .repositoryVersionBlueId
                        .toString()
                || report.identities.blueCoordinationSourceState
                        != 'clean'
                || report.identities.blueLanguageSourceState
                        != 'clean'
                || report.identities.blueBexSourceState
                        != 'clean'
                || report.identities.blueRepositorySourceState
                        != 'clean'
                || report.identities
                        .binaryCompatibilityBaselineVersion
                        != binaryCompatibilityBaselineVersion
                || report.identities
                        .binaryCompatibilityBaselineSha256
                        != independentlyObservedArtifactIdentities
                                .binaryCompatibilityBaselineSha256
                || independentlyObservedArtifactIdentities
                        .binaryCompatibilityBaselineSha256
                        != binaryCompatibilityBaselineSha256
                || invalidArtifactIdentity != null
                || report.identities
                        .coordinationConformancePackageIdentity
                        != conformanceEvidence.packageIdentity
                || report.identities
                        .coordinationGasPackageIdentity
                        != yamlScalar(
                                finalGasManifest,
                                'packageIdentity')
                || flagshipSection == null
                || flagshipSection.orderedStreams
                        != exactFlagshipEvidence
                                .orderedStreams
                || flagshipSection.identitySets
                        != exactFlagshipEvidence
                                .identitySets
                || loopSection == null
                || loopSection.orderedStreams
                        != exactLoopEvidence
                                .orderedStreams) {
            throw new GradleException(
                    "Final Coordination report is not complete; "
                            + "publication remains blocked")
        }
    }
}

/*
 * The always-truthful release receipt reuses the authoritative focused-task
 * inventory and strict flagship parser.  Exporting these two read-only build
 * contracts prevents the applied release script from maintaining a drifting
 * second inventory or parser.
 */
ext.coordinationReleaseFocusedTaskNames =
        Collections.unmodifiableList(
                new ArrayList<String>(
                        finalCoordinationTestTasks))
ext.coordinationReleaseReadExactFlagshipEvidence =
        readExactFlagshipEvidence

apply from: 'gradle/coordination-release.gradle'
apply from: 'gradle/coordination-working.gradle'

/*
 * `clean` is itself part of the hard release graph. Order every other root
 * task after it whenever both are selected so generated resources cannot be
 * deleted after Gradle has already considered them up to date.
 */
tasks.configureEach { candidate ->
    if (candidate.name != 'clean') {
        candidate.mustRunAfter(tasks.named('clean'))
    }
}

def stageLocalMaven = tasks.register('stageLocalMaven') {
    group = 'publishing'
    description = 'Publishes the current Coordination artifact into build/staging-deploy.'
    dependsOn tasks.named('publishMavenPublicationToMavenRepository')
}

tasks.withType(
        org.gradle.api.publish.maven.tasks
                .PublishToMavenRepository)
        .configureEach {
    dependsOn tasks.named('finalCoordinationVerification')
}

tasks.withType(
        org.gradle.api.publish.maven.tasks
                .PublishToMavenLocal)
        .configureEach {
    dependsOn tasks.named('finalCoordinationVerification')
}

tasks.named('publish') {
    dependsOn tasks.named('finalCoordinationVerification')
}

tasks.matching {
    it.name.startsWith('jreleaser')
}.configureEach {
    dependsOn tasks.named('finalCoordinationVerification')
    dependsOn stageLocalMaven
}

if (System.getenv('CI')) {
    jreleaser {
        signing {
            active = 'ALWAYS'
            armored = true
        }
        project {
            description = 'Java processors for executable Blue repository contracts.'
            copyright = 'Copyright 2026 Blue Company. Licensed under the MIT License'
        }

        deploy {
            maven {
                mavenCentral {
                    sonatype {
                        active = 'ALWAYS'
                        url = 'https://central.sonatype.com/api/v1/publisher'
                        applyMavenCentralRules = true
                        snapshotSupported = true
                        stagingRepository('build/staging-deploy')
                    }
                }
            }
        }
    }
}

def determineProjectVersion() {
    def tomlFile = file('.cz.toml')
    if (tomlFile.exists()) {
        def toml = new groovy.toml.TomlSlurper().parse(tomlFile)
        return toml.tool.commitizen.version + (!System.getenv('CI') ? '-SNAPSHOT' : '')
    }
    return '0.0.0' + (!System.getenv('CI') ? '-SNAPSHOT' : '')
}
