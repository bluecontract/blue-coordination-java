plugins {
    id 'java-library'
    id 'java-test-fixtures'
    id 'maven-publish'
    id 'signing'
    id 'org.jreleaser' version '1.25.0'
}

group = 'blue.coordination'
def versionMatches = file('.cz.toml').getText('UTF-8') =~
        /(?m)^version = "([^"]+)"$/
if (!versionMatches.find()) {
    throw new GradleException('Missing version in .cz.toml')
}
version = versionMatches.group(1)

def dependencyMode = providers.gradleProperty('blueDependencyMode')
        .getOrElse('published-artifact')
        .trim()
def localDependencies = dependencyMode == 'local-composite'
def publishedRepository = providers.gradleProperty(
        'bluePublishedRepository').orNull

base {
    archivesName = 'blue-coordination-java'
}

repositories {
    if (!localDependencies && publishedRepository != null) {
        exclusiveContent {
            forRepository {
                maven {
                    name = 'publishedBlueRepository'
                    url = uri(publishedRepository)
                    metadataSources { artifact() }
                }
            }
            filter {
                includeModule 'blue.repo', 'blue-repo-java'
                includeModule 'blue.bex', 'blue-bex-core'
                includeModule 'blue.bex', 'blue-bex-contracts'
            }
        }
    }
    mavenCentral()
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
    withSourcesJar()
    withJavadocJar()
}

sourceSets {
    integrationTest
    scenarioTest {
        resources.setSrcDirs(['src/integrationTest/resources'])
    }
    consumerTest {
        resources.setSrcDirs(['src/integrationTest/resources'])
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
    scenarioTestImplementation.extendsFrom testImplementation
    scenarioTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencyLocking {
    lockAllConfigurations()
    if (!localDependencies) {
        lockFile = layout.projectDirectory.file(
                'gradle/published-artifact.lockfile')
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.compilerArgs.addAll([
            '-Xlint:all',
            '-Xlint:-serial',
            '-Xlint:-processing',
            '-Werror'
    ])
}

tasks.withType(Javadoc).configureEach {
    source = fileTree('src/main/java') {
        include 'blue/coordination/api/**/*.java'
        include 'blue/coordination/processor/**/*.java'
    }
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.docEncoding = 'UTF-8'
    options.addBooleanOption('notimestamp', true)
    options.addBooleanOption('Xdoclint:all,-missing', true)
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.withType(Jar).configureEach {
    includeEmptyDirs = false
    from('LICENSE') { into 'META-INF' }
}

dependencies {
    api 'blue.language:blue-contracts-core:3.1.0-rc.20'
    implementation 'blue.repo:blue-repo-java:3.0.0-rc.21'
    api 'blue.bex:blue-bex-core:1.1.0-rc.3'
    api 'blue.bex:blue-bex-contracts:1.1.0-rc.3'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'

    testImplementation platform('org.junit:junit-bom:5.14.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    integrationTestImplementation sourceSets.main.output
    integrationTestImplementation sourceSets.testFixtures.output

    scenarioTestImplementation sourceSets.main.output
    scenarioTestImplementation sourceSets.testFixtures.output
    scenarioTestImplementation sourceSets.integrationTest.output

    consumerTestImplementation files(tasks.named('jar'))
    consumerTestImplementation 'blue.language:blue-contracts-core:3.1.0-rc.20'
    consumerTestImplementation platform('org.junit:junit-bom:5.14.1')
    consumerTestImplementation 'org.junit.jupiter:junit-jupiter'
    consumerTestRuntimeOnly files(configurations.runtimeClasspath)
    consumerTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

components.java.withVariantsFromConfiguration(
        configurations.testFixturesApiElements) { skip() }
components.java.withVariantsFromConfiguration(
        configurations.testFixturesRuntimeElements) { skip() }

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(
                providers.gradleProperty('testJavaVersion')
                        .getOrElse('17') as int)
    }
    maxParallelForks = 1
    maxHeapSize = '2g'
    reports {
        junitXml.required = true
        html.required = true
    }
}

def registerVerificationSuite = {
        String taskName, SourceSet suite, String taskDescription ->
    tasks.register(taskName, Test) {
        group = 'verification'
        description = taskDescription
        testClassesDirs = suite.output.classesDirs
        classpath = suite.runtimeClasspath
        dependsOn tasks.named(suite.classesTaskName)
        shouldRunAfter tasks.named('test')
    }
}

def integrationTest = registerVerificationSuite(
        'integrationTest', sourceSets.integrationTest,
        'Runs the complete compact-engine correctness and atomicity suite.')
def consumerTest = registerVerificationSuite(
        'consumerTest', sourceSets.consumerTest,
        'Runs public-API scenarios compiled against the built JAR only.')
def scenarioTest = registerVerificationSuite(
        'scenarioTest', sourceSets.scenarioTest,
        'Runs realistic NBA and large-host/PayNote convergence scenarios.')
scenarioTest.configure {
    shouldRunAfter integrationTest, consumerTest
}

def playgroundSmokeTest = tasks.register('playgroundSmokeTest', Test) {
    group = 'verification'
    description = 'Runs the fast Counter, whole-request, embedded, and five-occurrence Playground smoke lane.'
    testClassesDirs = files(
            sourceSets.integrationTest.output.classesDirs,
            sourceSets.scenarioTest.output.classesDirs)
    classpath = sourceSets.scenarioTest.runtimeClasspath
    dependsOn tasks.named(sourceSets.integrationTest.classesTaskName),
            tasks.named(sourceSets.scenarioTest.classesTaskName)
    filter {
        includeTestsMatching(
                'blue.coordination.integration.CoreBehaviorIntegrationTest.counterRoutesAliceAndBobExactlyOnceWithoutGenericSplitting')
        includeTestsMatching(
                'blue.coordination.integration.CoreBehaviorIntegrationTest.ordinaryPayNoteIsOneWholeInlineValue')
        includeTestsMatching(
                'blue.coordination.integration.ProcessEmbeddedCollectionPathsIntegrationTest.discoversAddsAndRemovesCanonicalMapMembersWithoutOrdinarySplitting')
        includeTestsMatching(
                'blue.coordination.integration.PlaygroundFiveOccurrenceInitializationTest.fiveOccurrencesReuseThreeSessionsAndForwardFiveInitializationEvents')
    }
}

def round13SourceArchiveUnitTest = tasks.register(
        'round13SourceArchiveUnitTest', Test) {
    group = 'verification'
    description = 'Runs the four focused Round 13 source-archive unit proofs.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    dependsOn tasks.named(sourceSets.test.classesTaskName)
    filter {
        includeTestsMatching(
                'blue.coordination.api.DocumentRevisionInitializationCausalityTest')
        includeTestsMatching(
                'blue.coordination.internal.DocumentAdmissionCauseTest')
        includeTestsMatching(
                'blue.coordination.internal.EmbeddedEpochInputInitializationCausalityTest')
        includeTestsMatching(
                'blue.coordination.internal.EmbeddingBindingCanonicalOrderTest')
    }
}

def round13SourceArchiveIntegrationTest = tasks.register(
        'round13SourceArchiveIntegrationTest', Test) {
    group = 'verification'
    description = 'Runs the focused Round 13 recovery, retry, and five-occurrence correctness proofs.'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    dependsOn tasks.named(sourceSets.integrationTest.classesTaskName)
    filter {
        includeTestsMatching(
                'blue.coordination.internal.EmbeddedReceiptRetryIdentityIntegrationTest')
        includeTestsMatching(
                'blue.coordination.integration.PlaygroundFiveOccurrenceCorrectnessIntegrationTest')
        includeTestsMatching(
                'blue.coordination.integration.PlaygroundFiveOccurrenceRetryTest.retryCompletesFiveOccurrenceFanoutWithoutReinitializingChildren')
    }
}

def round13SourceArchiveScenarioTest = tasks.register(
        'round13SourceArchiveScenarioTest', Test) {
    group = 'verification'
    description = 'Runs the focused Round 13 five-occurrence scenario proof.'
    testClassesDirs = sourceSets.scenarioTest.output.classesDirs
    classpath = sourceSets.scenarioTest.runtimeClasspath
    dependsOn tasks.named(sourceSets.scenarioTest.classesTaskName)
    filter {
        includeTestsMatching(
                'blue.coordination.integration.PlaygroundFiveOccurrenceInitializationTest.fiveOccurrencesReuseThreeSessionsAndForwardFiveInitializationEvents')
    }
}

def round13SourceArchiveConsumerTest = tasks.register(
        'round13SourceArchiveConsumerTest', Test) {
    group = 'verification'
    description = 'Runs the public-JAR five-occurrence consumer proof.'
    testClassesDirs = sourceSets.consumerTest.output.classesDirs
    classpath = sourceSets.consumerTest.runtimeClasspath
    dependsOn tasks.named(sourceSets.consumerTest.classesTaskName),
            tasks.named('jar')
    filter {
        includeTestsMatching(
                'blue.coordination.consumer.PublishedArtifactConsumerTest.fiveEmbeddedOccurrencesReuseThreeManagedDocuments')
    }
}

tasks.register('round13SourceArchiveSmoke') {
    group = 'verification'
    description = 'Runs all focused Round 13 proofs required after archive extraction.'
    dependsOn round13SourceArchiveUnitTest,
            round13SourceArchiveIntegrationTest,
            round13SourceArchiveScenarioTest,
            round13SourceArchiveConsumerTest
}

def configureRound13EvidenceRuntime = { JavaExec task ->
    task.group = 'verification'
    task.classpath = sourceSets.scenarioTest.runtimeClasspath
    task.mainClass =
            'blue.coordination.integration.PlaygroundFiveOccurrenceEvidence'
    task.dependsOn tasks.named(sourceSets.scenarioTest.classesTaskName)
    task.javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(
                providers.gradleProperty('testJavaVersion')
                        .getOrElse('17') as int)
    }
    task.jvmArgs '-Xmx2g'
    task.outputs.upToDateWhen { false }
}

tasks.register('round13PlaygroundSample', JavaExec) {
    configureRound13EvidenceRuntime(delegate)
    description = 'Writes one warmed five-occurrence JSON sample to -Dblue.coordination.round13.sample.'
    args 'sample'
    doFirst {
        def output = providers.systemProperty(
                'blue.coordination.round13.sample').orNull
        if (output == null || output.isBlank()) {
            throw new GradleException(
                    'round13PlaygroundSample requires '
                            + '-Dblue.coordination.round13.sample=/path/sample.json')
        }
        systemProperty 'blue.coordination.round13.sample', output
        systemProperty 'blue.coordination.round13.warmups',
                providers.systemProperty(
                        'blue.coordination.round13.warmups')
                        .getOrElse('3')
    }
}

tasks.register('playgroundRuntimeCampaign', JavaExec) {
    configureRound13EvidenceRuntime(delegate)
    description = 'Runs the opt-in 30-sample five-occurrence candidate campaign.'
    args 'campaign'
    doFirst {
        systemProperty 'blue.coordination.round13.campaign',
                providers.systemProperty(
                        'blue.coordination.round13.campaign')
                        .getOrElse(layout.buildDirectory.dir(
                                'reports/round13/playground-runtime')
                                .get().asFile.absolutePath)
        systemProperty 'blue.coordination.round13.warmups',
                providers.systemProperty(
                        'blue.coordination.round13.warmups')
                        .getOrElse('3')
        systemProperty 'blue.coordination.round13.samples',
                providers.systemProperty(
                        'blue.coordination.round13.samples')
                        .getOrElse('30')
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifact tasks.named('testFixturesJar')
            pom {
                name = 'Blue Coordination Java'
                description = 'Deterministic whole-object document coordination runtime.'
                url = 'https://github.com/bluecontract/blue-coordination-java'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/license/mit'
                    }
                }
                developers {
                    developer {
                        name = 'Blue'
                        email = 'devsupport@timeline.blue'
                        organization = 'Blue Company'
                    }
                }
                scm {
                    url = 'https://github.com/bluecontract/blue-coordination-java'
                    connection = 'scm:git:https://github.com/bluecontract/blue-coordination-java.git'
                    developerConnection = 'scm:git:ssh://git@github.com/bluecontract/blue-coordination-java.git'
                }
