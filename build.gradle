// Minimal class-file reader used by the verification tasks below. Keeping this
// in the build avoids adding a release plugin solely for two deterministic
// checks, and compares JVM descriptors rather than source formatting.
def parseBinaryApiClass = { byte[] bytecode ->
    def input = new DataInputStream(new ByteArrayInputStream(bytecode))
    if (input.readInt() != (0xCAFEBABE as int)) {
        throw new GradleException('Invalid class-file magic')
    }
    int minorVersion = input.readUnsignedShort()
    int majorVersion = input.readUnsignedShort()
    int constantPoolCount = input.readUnsignedShort()
    Object[] constantPool = new Object[constantPoolCount]
    for (int index = 1; index < constantPoolCount; index++) {
        int tag = input.readUnsignedByte()
        if (tag == 1) {
            constantPool[index] = input.readUTF()
        } else if (tag == 3 || tag == 4) {
            input.readInt()
        } else if (tag == 5 || tag == 6) {
            input.readLong()
            index++
        } else if (tag == 7) {
            constantPool[index] = Integer.valueOf(input.readUnsignedShort())
        } else if (tag == 8 || tag == 16 || tag == 19 || tag == 20) {
            input.readUnsignedShort()
        } else if (tag == 9 || tag == 10 || tag == 11 || tag == 12
                || tag == 17 || tag == 18) {
            input.readUnsignedShort()
            input.readUnsignedShort()
        } else if (tag == 15) {
            input.readUnsignedByte()
            input.readUnsignedShort()
        } else {
            throw new GradleException("Unsupported constant-pool tag ${tag}")
        }
    }

    def utf8 = { int index ->
        Object value = constantPool[index]
        if (!(value instanceof String)) {
            throw new GradleException("Invalid UTF-8 constant-pool index ${index}")
        }
        (String) value
    }
    def className = { int index ->
        if (index == 0) {
            return null
        }
        Object nameIndex = constantPool[index]
        if (!(nameIndex instanceof Integer)) {
            throw new GradleException("Invalid class constant-pool index ${index}")
        }
        utf8(((Integer) nameIndex).intValue()).replace('/', '.')
    }
    def skipAttributes = { DataInputStream stream ->
        int attributeCount = stream.readUnsignedShort()
        for (int attributeIndex = 0; attributeIndex < attributeCount; attributeIndex++) {
            stream.readUnsignedShort()
            long remaining = ((long) stream.readInt()) & 0xffffffffL
            while (remaining > 0L) {
                long skipped = stream.skip(remaining)
                if (skipped <= 0L) {
                    if (stream.read() < 0) {
                        throw new EOFException('Truncated class-file attribute')
                    }
                    skipped = 1L
                }
                remaining -= skipped
            }
        }
    }
    def readMembers = { DataInputStream stream ->
        def members = new TreeMap<String, Integer>()
        int memberCount = stream.readUnsignedShort()
        for (int memberIndex = 0; memberIndex < memberCount; memberIndex++) {
            int access = stream.readUnsignedShort()
            String name = utf8(stream.readUnsignedShort())
            String descriptor = utf8(stream.readUnsignedShort())
            skipAttributes(stream)
            if ((access & (0x0001 | 0x0004)) != 0 && name != '<clinit>') {
                members.put(name + descriptor, Integer.valueOf(access))
            }
        }
        members
    }

    int access = input.readUnsignedShort()
    String name = className(input.readUnsignedShort())
    String superName = className(input.readUnsignedShort())
    int interfaceCount = input.readUnsignedShort()
    def interfaces = new TreeSet<String>()
    for (int interfaceIndex = 0; interfaceIndex < interfaceCount; interfaceIndex++) {
        interfaces.add(className(input.readUnsignedShort()))
    }
    Map<String, Integer> fields = readMembers(input)
    Map<String, Integer> methods = readMembers(input)
    skipAttributes(input)
    [
            name        : name,
            access      : access,
            superName   : superName,
            interfaces  : interfaces,
            fields      : fields,
            methods     : methods,
            minorVersion: minorVersion,
            majorVersion: majorVersion
    ]
}

def readBinaryApi = { File archive ->
    def classes = new TreeMap<String, Map<String, Object>>()
    def zip = new java.util.zip.ZipFile(archive)
    try {
        def entries = Collections.list(zip.entries())
                .findAll { entry ->
                    !entry.directory
                            && entry.name.endsWith('.class')
                            && !entry.name.startsWith('META-INF/versions/')
                            && !entry.name.endsWith('/module-info.class')
                            && entry.name != 'module-info.class'
                }
                .sort { left, right -> left.name <=> right.name }
        entries.each { entry ->
            Map<String, Object> parsed = zip.getInputStream(entry).withCloseable { stream ->
                parseBinaryApiClass(stream.bytes)
            }
            if ((((Integer) parsed.access).intValue() & (0x0001 | 0x0004)) != 0) {
                classes.put((String) parsed.name, parsed)
            }
        }
    } finally {
        zip.close()
    }
    classes
}

def coordinationPublicApiJson =
        layout.buildDirectory.file(
                'reports/coordination-release/api.json')
def coordinationPublicApiMarkdown =
        layout.buildDirectory.file(
                'reports/coordination-release/api.md')
def generateCoordinationPublicApiReport =
        tasks.register('generateCoordinationPublicApiReport') {
    group = 'verification'
    description = 'Writes the canonical public/protected Coordination JVM API inventory and digest.'
    dependsOn tasks.named('jar')
    inputs.file(tasks.named('jar').flatMap { it.archiveFile })
    outputs.files(
            coordinationPublicApiJson,
            coordinationPublicApiMarkdown)
    outputs.upToDateWhen { false }
    doLast {
        File currentJar =
                tasks.named('jar').get()
                        .archiveFile.get().asFile
        Map<String, Map<String, Object>> binaryApi =
                readBinaryApi(currentJar)
        def classes = new ArrayList<Map<String, Object>>()
        binaryApi.each { String className,
                         Map<String, Object> description ->
            def fields = new ArrayList<Map<String, Object>>()
            ((Map<String, Integer>) description.fields)
                    .each { String signature, Integer access ->
                        fields.add([
                                signature: signature,
                                access   : access
                        ])
                    }
            def methods = new ArrayList<Map<String, Object>>()
            ((Map<String, Integer>) description.methods)
                    .each { String signature, Integer access ->
                        methods.add([
                                signature: signature,
                                access   : access
                        ])
                    }
            classes.add([
                    name      : className,
                    access    : description.access,
                    superName : description.superName,
                    interfaces:
                            new ArrayList<String>(
                                    (Set<String>) description.interfaces),
                    fields    : fields,
                    methods   : methods
            ])
        }
        def digestInput = [
                schema : 'blue.coordination/public-api/1.0',
                classes: classes
        ]
        byte[] canonicalBytes =
                groovy.json.JsonOutput.toJson(
                        digestInput).getBytes('UTF-8')
        byte[] digestBytes =
                java.security.MessageDigest
                        .getInstance('SHA-256')
                        .digest(canonicalBytes)
        String digest = digestBytes.collect {
            String.format(
                    java.util.Locale.ROOT,
                    '%02x',
                    it & 0xff)
        }.join()
        def report = new LinkedHashMap<String, Object>()
        report.putAll(digestInput)
        report.put('classCount', classes.size())
        report.put('publicApiDigest', 'sha256:' + digest)
        File jsonFile =
                coordinationPublicApiJson.get().asFile
        jsonFile.parentFile.mkdirs()
        jsonFile.setText(
                groovy.json.JsonOutput.prettyPrint(
                        groovy.json.JsonOutput.toJson(report))
                        + '\n',
                'UTF-8')
        File markdownFile =
                coordinationPublicApiMarkdown.get().asFile
        markdownFile.parentFile.mkdirs()
        markdownFile.withWriter('UTF-8') { writer ->
            writer.writeLine('# Blue Coordination public API')
            writer.writeLine('')
            writer.writeLine(
                    "- Canonical digest: `${report.publicApiDigest}`")
            writer.writeLine(
                    "- Public/protected classes: `${classes.size()}`")
            writer.writeLine('')
            writer.writeLine(
                    'This inventory is generated from JVM descriptors in the release JAR; method bodies and source formatting do not affect its digest.')
            writer.writeLine('')
            classes.each { apiClass ->
                writer.writeLine(
                        "## `${apiClass.name}`")
                writer.writeLine('')
                writer.writeLine(
                        "- Superclass: `${apiClass.superName}`")
                writer.writeLine(
                        "- Interfaces: `${apiClass.interfaces}`")
                writer.writeLine(
                        "- Public/protected fields: `${apiClass.fields.size()}`")
                writer.writeLine(
                        "- Public/protected methods: `${apiClass.methods.size()}`")
                writer.writeLine('')
            }
        }
    }
}

def visibilityCompatible = { int oldAccess, int newAccess ->
    boolean oldPublic = (oldAccess & 0x0001) != 0
    boolean newPublic = (newAccess & 0x0001) != 0
    boolean newProtected = (newAccess & 0x0004) != 0
    oldPublic ? newPublic : (newPublic || newProtected)
}

def incompatibleModifierChanges = { int oldAccess, int newAccess, boolean method ->
    def changes = new ArrayList<String>()
    if (((oldAccess ^ newAccess) & 0x0008) != 0) {
        changes.add('static modifier changed')
    }
    if ((oldAccess & 0x0010) == 0 && (newAccess & 0x0010) != 0) {
        changes.add('became final')
    }
    if (method && (oldAccess & 0x0400) == 0 && (newAccess & 0x0400) != 0) {
        changes.add('became abstract')
    }
    changes
}

