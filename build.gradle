def reproducibilityReport = layout.buildDirectory.file(
        'reports/reproducibility/archives.txt')
def verifyReproducibleArchives =
        tasks.register('verifyReproducibleArchives') {
    group = 'verification'
    description = 'Requires independently assembled binary, sources, Javadoc, and source-distribution archives to be byte-identical.'
    dependsOn tasks.named('jar'), tasks.named('sourcesJar'),
            tasks.named('javadocJar'),
            tasks.named('sourceArchive'),
            reproducibilityBinaryJar,
            reproducibilitySourcesJar,
            reproducibilityJavadocJar,
            reproducibilitySourceArchive
    inputs.files(
            tasks.named('jar').flatMap { it.archiveFile },
            tasks.named('sourcesJar').flatMap { it.archiveFile },
            tasks.named('javadocJar').flatMap { it.archiveFile },
            tasks.named('sourceArchive').flatMap {
                it.archiveFile
            },
            reproducibilityBinaryJar.flatMap {
                it.archiveFile
            },
            reproducibilitySourcesJar.flatMap {
                it.archiveFile
            },
            reproducibilityJavadocJar.flatMap {
                it.archiveFile
            },
            reproducibilitySourceArchive.flatMap {
                it.archiveFile
            })
    outputs.file(reproducibilityReport)
    doLast {
        def pairs = [
                binary: [
                        tasks.named('jar').get()
                                .archiveFile.get().asFile,
                        reproducibilityBinaryJar.get()
                                .archiveFile.get().asFile
                ],
                sources: [
                        tasks.named('sourcesJar').get()
                                .archiveFile.get().asFile,
                        reproducibilitySourcesJar.get()
                                .archiveFile.get().asFile
                ],
                javadoc: [
                        tasks.named('javadocJar').get()
                                .archiveFile.get().asFile,
                        reproducibilityJavadocJar.get()
                                .archiveFile.get().asFile
                ],
                sourceDistribution: [
                        tasks.named('sourceArchive').get()
                                .archiveFile.get().asFile,
                        reproducibilitySourceArchive.get()
                                .archiveFile.get().asFile
                ]
        ]
        def failures = new ArrayList<String>()
        File report = reproducibilityReport.get().asFile
        report.parentFile.mkdirs()
        report.withWriter('UTF-8') { writer ->
            pairs.each { name, archives ->
                String primary = sha256File(archives[0])
                String independent = sha256File(archives[1])
                boolean matches = primary == independent
                writer.writeLine("${name}.primary=${primary}")
                writer.writeLine("${name}.independent=${independent}")
                writer.writeLine("${name}.reproducible=${matches}")
                if (!matches) {
                    failures.add(name)
                }
            }
        }
        if (!failures.isEmpty()) {
            throw new GradleException(
                    "Archive reproducibility failed for ${failures}; see ${report}")
        }
    }
}

tasks.named('check') {
    dependsOn verifyReproducibleArchives
    dependsOn verifyNestedLocalCompositeDependencies
}

