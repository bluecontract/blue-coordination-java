def buildPropertiesVersion = project.version.toString()
def sourceDateEpoch = providers.environmentVariable(
        'SOURCE_DATE_EPOCH').orElse('0')
task generateBuildProperties {
    ext.buildPropertiesFile = file("$genResourcesDir/blue/coordination/build.properties")
    inputs.property('buildVersion', buildPropertiesVersion)
    inputs.property('sourceDateEpoch', sourceDateEpoch)
    outputs.file(buildPropertiesFile)
    doLast {
        String rawEpoch = sourceDateEpoch.get()
        long epochSeconds
        try {
            epochSeconds = Long.parseLong(rawEpoch)
        } catch (NumberFormatException ex) {
            throw new GradleException(
                    "SOURCE_DATE_EPOCH must be a non-negative integer", ex)
        }
        if (epochSeconds < 0L) {
            throw new GradleException(
                    "SOURCE_DATE_EPOCH must be a non-negative integer")
        }
        String buildTimestamp = new Date(
                Math.multiplyExact(epochSeconds, 1000L)).format(
                "yyyy-MM-dd'T'HH:mm:ss'Z'",
                TimeZone.getTimeZone('UTC'))
        buildPropertiesFile.text = ("blue-coordination-java.build.version=" + buildPropertiesVersion + "\n"
                + "blue-coordination-java.build.timestamp=" + buildTimestamp + "\n")
    }
}
