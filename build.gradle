plugins {
    id 'java-library'
    id 'java-test-fixtures'
    id 'maven-publish'
    id 'signing'
    id 'org.jreleaser' version '1.25.0'
}

group = 'blue.coordination'
def dependencyMode = providers.gradleProperty('blueDependencyMode')
        .getOrElse('published-artifact')
        .trim()
def immutableStagedContracts =
        dependencyMode == 'immutable-staged-contracts'
def publishedLanguageVersion = '3.1.0-rc.22'
def immutableStagedLanguageVersion = providers.gradleProperty(
        'blueContractsVersion').getOrElse('3.1.0-rc.23')
def activeLanguageVersion = immutableStagedContracts
        ? immutableStagedLanguageVersion
        : publishedLanguageVersion
def stagedContractsRepositoryValue = providers.gradleProperty(
        'blueContractsRepository').orNull
def stagedContractsManifestIdentity = providers.gradleProperty(
        'blueContractsManifestSha256').orNull
def versionMatches = file('.cz.toml').getText('UTF-8') =~
        /(?m)^version = "([^"]+)"$/
if (!versionMatches.find()) {
    throw new GradleException('Missing version in .cz.toml')
}
def declaredProjectVersion = versionMatches.group(1)
version = declaredProjectVersion

def publishedBlueCoordinates = [
        'blue.language:blue-language-model': publishedLanguageVersion,
        'blue.language:blue-language-core': publishedLanguageVersion,
        'blue.language:blue-language-mapping': publishedLanguageVersion,
        'blue.language:blue-language-ipfs': publishedLanguageVersion,
        'blue.language:blue-language-java': publishedLanguageVersion,
        'blue.language:blue-contracts-core': publishedLanguageVersion,
        'blue.repo:blue-repo-java': '3.0.0-rc.21',
        'blue.bex:blue-bex-core': '1.1.0-rc.4',
        'blue.bex:blue-bex-contracts': '1.1.0-rc.4'
]
def immutableStagedBlueCoordinates = publishedBlueCoordinates.collectEntries {
    coordinate, expectedVersion ->
        [(coordinate): coordinate.startsWith('blue.language:')
                ? immutableStagedLanguageVersion
                : expectedVersion]
}
def activeBlueCoordinates = immutableStagedContracts
        ? immutableStagedBlueCoordinates
        : publishedBlueCoordinates
def acceptedDependencyModes = [
        'published-artifact',
        'immutable-staged-contracts'
] as Set
if (!acceptedDependencyModes.contains(dependencyMode)) {
    throw new GradleException(
            'blueDependencyMode must be published-artifact or '
                    + 'immutable-staged-contracts')
}

def stagedContractsArtifacts = [
        'blue-language-model',
        'blue-language-core',
        'blue-language-mapping',
        'blue-language-ipfs',
        'blue-contracts-core',
        'blue-conformance',
        'blue-language-java'
] as Set

base {
    archivesName = 'blue-coordination-java'
}

repositories {
    if (immutableStagedContracts) {
        exclusiveContent {
            forRepository {
                maven {
                    name = 'immutableStagedContracts'
                    url = uri(file(stagedContractsRepositoryValue)
                            .canonicalFile)
                    metadataSources {
                        mavenPom()
                        artifact()
                    }
                }
            }
            filter {
                includeGroup 'blue.language'
            }
        }
    }
    mavenCentral()
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
    withSourcesJar()
    withJavadocJar()
}

sourceSets {
    testSupport
    integrationTest
    scenarioTest {
        resources.setSrcDirs([
                'src/scenarioTest/resources',
                'src/integrationTest/resources'
        ])
    }
    consumerTest {
        resources.setSrcDirs([
                'src/consumerTest/resources',
                'src/integrationTest/resources'
        ])
    }
}

configurations {
    testSupportImplementation.extendsFrom testImplementation
    testSupportRuntimeOnly.extendsFrom testRuntimeOnly
    integrationTestImplementation.extendsFrom testSupportImplementation
    integrationTestRuntimeOnly.extendsFrom testSupportRuntimeOnly
    scenarioTestImplementation.extendsFrom testSupportImplementation
    scenarioTestRuntimeOnly.extendsFrom testSupportRuntimeOnly
}

dependencyLocking {
    lockAllConfigurations()
    lockFile = layout.projectDirectory.file(
            immutableStagedContracts
                    ? 'gradle/immutable-staged-contracts.lockfile'
                    : 'gradle/published-artifact.lockfile')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.compilerArgs.addAll([
            '-Xlint:all',
            '-Xlint:-serial',
            '-Xlint:-processing',
            '-Werror'
    ])
}

tasks.withType(Javadoc).configureEach {
    source = fileTree('src/main/java') {
        include 'blue/coordination/api/**/*.java'
        include 'blue/coordination/sdk/**/*.java'
        include 'blue/coordination/processor/**/*.java'
    }
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.docEncoding = 'UTF-8'
    options.addBooleanOption('notimestamp', true)
    options.addBooleanOption('Xdoclint:all,-missing', true)
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.withType(Jar).configureEach {
    includeEmptyDirs = false
    from('LICENSE') { into 'META-INF' }
}

dependencies {
    api "blue.language:blue-contracts-core:${activeLanguageVersion}"
    implementation "blue.language:blue-language-java:${activeLanguageVersion}"
    implementation('blue.repo:blue-repo-java:3.0.0-rc.21') {
        // Repository rc.21 was published against Language rc.20. Coordination
        // owns the active pinned Language runtime and excludes that stale edge.
        exclude group: 'blue.language', module: 'blue-language-java'
    }
    api('blue.bex:blue-bex-core:1.1.0-rc.4') {
        exclude group: 'blue.language'
    }
    api('blue.bex:blue-bex-contracts:1.1.0-rc.4') {
        exclude group: 'blue.language'
    }
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    implementation 'io.github.erdtman:java-json-canonicalization:1.1'

    testImplementation platform('org.junit:junit-bom:5.14.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testSupportImplementation sourceSets.main.output
    testSupportImplementation sourceSets.testFixtures.output

    integrationTestImplementation sourceSets.main.output
    integrationTestImplementation sourceSets.testFixtures.output
    integrationTestImplementation sourceSets.testSupport.output

    scenarioTestImplementation sourceSets.main.output
    scenarioTestImplementation sourceSets.testFixtures.output
    scenarioTestImplementation sourceSets.testSupport.output

    consumerTestImplementation files(tasks.named('jar'))
    consumerTestImplementation \
            "blue.language:blue-contracts-core:${activeLanguageVersion}"
    consumerTestImplementation platform('org.junit:junit-bom:5.14.1')
    consumerTestImplementation 'org.junit.jupiter:junit-jupiter'
    consumerTestRuntimeOnly files(configurations.runtimeClasspath)
    consumerTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

components.java.withVariantsFromConfiguration(
        configurations.testFixturesApiElements) { skip() }
components.java.withVariantsFromConfiguration(
        configurations.testFixturesRuntimeElements) { skip() }

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(
                providers.gradleProperty('testJavaVersion')
                        .getOrElse('17') as int)
    }
    maxParallelForks = 1
    maxHeapSize = '2g'
    reports {
        junitXml.required = true
        html.required = true
    }
}

def registerVerificationSuite = {
        String taskName, SourceSet suite, String taskDescription ->
    tasks.register(taskName, Test) {
        group = 'verification'
        description = taskDescription
        testClassesDirs = suite.output.classesDirs
        classpath = suite.runtimeClasspath
        dependsOn tasks.named(suite.classesTaskName)
        shouldRunAfter tasks.named('test')
    }
}

def integrationTest = registerVerificationSuite(
        'integrationTest', sourceSets.integrationTest,
        'Runs the complete compact-engine correctness and atomicity suite.')
def consumerTest = registerVerificationSuite(
        'consumerTest', sourceSets.consumerTest,
        'Runs public-API scenarios compiled against the built JAR only.')
def scenarioTest = registerVerificationSuite(
        'scenarioTest', sourceSets.scenarioTest,
        'Runs realistic NBA and large-host/PayNote convergence scenarios.')
scenarioTest.configure {
    shouldRunAfter integrationTest, consumerTest
}

def playgroundSmokeTest = tasks.register('playgroundSmokeTest', Test) {
    group = 'verification'
    description = 'Runs the fast Counter, whole-request, embedded, and five-occurrence Playground smoke lane.'
    testClassesDirs = files(
            sourceSets.integrationTest.output.classesDirs,
            sourceSets.scenarioTest.output.classesDirs)
    classpath = files(
            sourceSets.integrationTest.runtimeClasspath,
            sourceSets.scenarioTest.runtimeClasspath)
    dependsOn tasks.named(sourceSets.integrationTest.classesTaskName),
            tasks.named(sourceSets.scenarioTest.classesTaskName)
    filter {
        includeTestsMatching(
                'blue.coordination.integration.CoreBehaviorIntegrationTest.counterRoutesAliceAndBobExactlyOnceWithoutGenericSplitting')
        includeTestsMatching(
                'blue.coordination.integration.CoreBehaviorIntegrationTest.ordinaryPayNoteIsOneWholeInlineValue')
        includeTestsMatching(
                'blue.coordination.integration.ProcessEmbeddedCollectionPathsIntegrationTest.discoversAddsAndRemovesCanonicalMapMembersWithoutOrdinarySplitting')
        includeTestsMatching(
                'blue.coordination.integration.PlaygroundFiveOccurrenceInitializationTest.fiveOccurrencesReuseThreeSessionsAndForwardFiveInitializationEvents')
    }
}


def configureRound13EvidenceRuntime = { JavaExec task ->
    task.group = 'verification'
    task.classpath = sourceSets.scenarioTest.runtimeClasspath
    task.mainClass =
            'blue.coordination.integration.PlaygroundFiveOccurrenceEvidence'
    task.dependsOn tasks.named(sourceSets.scenarioTest.classesTaskName)
    task.javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(
                providers.gradleProperty('testJavaVersion')
                        .getOrElse('17') as int)
    }
    task.jvmArgs '-Xmx2g'
    task.outputs.upToDateWhen { false }
}

tasks.register('round13PlaygroundSample', JavaExec) {
    configureRound13EvidenceRuntime(delegate)
    description = 'Writes one warmed five-occurrence JSON sample to -Dblue.coordination.round13.sample.'
    args 'sample'
    doFirst {
        def output = providers.systemProperty(
                'blue.coordination.round13.sample').orNull
        if (output == null || output.isBlank()) {
            throw new GradleException(
                    'round13PlaygroundSample requires '
                            + '-Dblue.coordination.round13.sample=/path/sample.json')
        }
        systemProperty 'blue.coordination.round13.sample', output
        systemProperty 'blue.coordination.round13.warmups',
                providers.systemProperty(
                        'blue.coordination.round13.warmups')
                        .getOrElse('3')
    }
}

tasks.register('playgroundRuntimeCampaign', JavaExec) {
    configureRound13EvidenceRuntime(delegate)
    description = 'Runs the opt-in 30-sample five-occurrence candidate campaign.'
    args 'campaign'
    doFirst {
        systemProperty 'blue.coordination.round13.campaign',
                providers.systemProperty(
                        'blue.coordination.round13.campaign')
                        .getOrElse(layout.buildDirectory.dir(
                                'reports/round13/playground-runtime')
                                .get().asFile.absolutePath)
        systemProperty 'blue.coordination.round13.warmups',
                providers.systemProperty(
                        'blue.coordination.round13.warmups')
                        .getOrElse('3')
        systemProperty 'blue.coordination.round13.samples',
                providers.systemProperty(
                        'blue.coordination.round13.samples')
                        .getOrElse('30')
    }
}

tasks.register('cyclicPerformanceAcceptance', JavaExec) {
    group = 'verification'
    description = 'Writes the dedicated Java 17 cyclic correctness and performance acceptance report.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass =
            'blue.coordination.internal.CyclicPerformanceAcceptance'
    dependsOn tasks.named(sourceSets.test.classesTaskName)
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
    jvmArgs '-Xms2g',
            '-Xmx2g',
            '-XX:+UseG1GC',
            '-Duser.language=en',
            '-Duser.country=US',
            '-Duser.timezone=UTC'
    outputs.upToDateWhen { false }
    outputs.doNotCacheIf(
            'Cyclic performance evidence is intentionally non-cacheable') {
        true
    }
    doFirst {
        systemProperty 'user.language', 'en'
        systemProperty 'user.country', 'US'
        systemProperty 'user.timezone', 'UTC'
        systemProperty 'blue.coordination.cyclicPerformance.output',
                providers.systemProperty(
                        'blue.coordination.cyclicPerformance.output')
                        .getOrElse(layout.buildDirectory.dir(
                                'reports/cyclic-performance')
                                .get().asFile.absolutePath)
        systemProperty 'blue.coordination.cyclicPerformance.warmups',
                providers.systemProperty(
                        'blue.coordination.cyclicPerformance.warmups')
                        .getOrElse('20')
        systemProperty 'blue.coordination.cyclicPerformance.samples',
                providers.systemProperty(
                        'blue.coordination.cyclicPerformance.samples')
                        .getOrElse('50')
    }
}

