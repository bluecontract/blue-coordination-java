}

def productionSources = fileTree('src/main/java') { include '**/*.java' }
def publicBoundarySources = files(
        fileTree('src/main/java/blue/coordination/api') {
            include '**/*.java'
        },
        fileTree('src/main/java/blue/coordination/sdk') {
            include '**/*.java'
        })
// Retained managed-epoch maintainability guardrails. These are deliberately
// bounded caps over the frozen rc.4 SDK baseline plus the reviewed receipt,
// matching, occurrence-plan, barrier, application, readiness, audit, and
// recovery responsibilities plus the reviewed host-driven fair-selection and
// unsupported nested-new publication boundary: currently 218 production
// sources, 64,601 lines and 79 public api+sdk source types. These are not
// historical Round 13 counts and are not performance evidence.
def currentProductionShapeLimits = [
        classes: 218,
        lines: 64_601L,
        publicApiTypes: 79,
        maxLinesPerRetainedManagedEpochSource: 1_166L
]
def retainedManagedEpochProductionSources = [
        'src/main/java/blue/coordination/api/ManagedCatchUpBarrier.java',
        'src/main/java/blue/coordination/api/ManagedCatchUpBarrierStatus.java',
        'src/main/java/blue/coordination/api/ManagedCatchUpStatus.java',
        'src/main/java/blue/coordination/api/ManagedDocumentReadiness.java',
        'src/main/java/blue/coordination/api/ManagedEpochApplicationAttempt.java',
        'src/main/java/blue/coordination/api/ManagedEpochApplicationReceipt.java',
        'src/main/java/blue/coordination/api/ManagedEpochApplicationWork.java',
        'src/main/java/blue/coordination/api/ManagedEpochEvidenceFailure.java',
        'src/main/java/blue/coordination/api/ManagedEpochReceipt.java',
        'src/main/java/blue/coordination/api/ManagedEventOccurrence.java',
        'src/main/java/blue/coordination/api/ManagedIdentity.java',
        'src/main/java/blue/coordination/api/ManagedOccurrenceCatchUpPlan.java',
        'src/main/java/blue/coordination/api/ProcessingAvailability.java',
        'src/main/java/blue/coordination/api/ProcessingSelection.java',
        'src/main/java/blue/coordination/internal/CatchUpPlanStore.java',
        'src/main/java/blue/coordination/internal/ContractsManagedEpochSelectionPlan.java',
        'src/main/java/blue/coordination/internal/ManagedCatchUpPlanIndex.java',
        'src/main/java/blue/coordination/internal/ManagedCatchUpPlanner.java',
        'src/main/java/blue/coordination/internal/ManagedCatchUpWorkIndex.java',
        'src/main/java/blue/coordination/internal/ManagedEpochApplicationExecutor.java',
        'src/main/java/blue/coordination/internal/ManagedEpochEvidenceException.java',
        'src/main/java/blue/coordination/internal/ManagedEpochInvocationCapturer.java',
        'src/main/java/blue/coordination/internal/ManagedEpochReceiptMapper.java',
        'src/main/java/blue/coordination/internal/ManagedEpochReceiptStore.java',
        'src/main/java/blue/coordination/internal/ManagedEpochSourceEvidenceVerifier.java',
        'src/main/java/blue/coordination/internal/UnsupportedNestedNewLineageException.java',
        'src/main/java/blue/coordination/internal/PersistentMinimumMap.java',
        'src/main/java/blue/coordination/sdk/DrainBudget.java',
        'src/main/java/blue/coordination/sdk/ManagedEpochApplicationAttempt.java',
        'src/main/java/blue/coordination/sdk/ManagedEpochApplicationReceipt.java',
        'src/main/java/blue/coordination/sdk/ManagedEpochApplicationWork.java',
        'src/main/java/blue/coordination/sdk/ManagedEpochEvidenceFailure.java',
        'src/main/java/blue/coordination/sdk/ManagedEpochReceipt.java',
        'src/main/java/blue/coordination/sdk/ManagedEpochSelector.java',
        'src/main/java/blue/coordination/sdk/ManagedEventOccurrence.java',
        'src/main/java/blue/coordination/sdk/SourceOrder.java'
]
def forbiddenArchitectureTokens = [
        'AutonomousLink', 'TemporalWave', 'ConsistencyMode',
        'ObservingLink', 'CoherentLink', 'SccScheduler',
        'SCCScheduler', 'WeakComponentPlanner'
]

tasks.register('validateProductionShape') {
    group = 'verification'
    description = 'Enforces current Contracts 1.0 maintainability and architecture guardrails.'
    inputs.files(productionSources, publicBoundarySources)
    doLast {
        def sources = productionSources.files.sort()
        int classes = sources.size()
        long lines = sources.sum { it.readLines('UTF-8').size() } ?: 0L
        def publicTypePattern = ~/(?m)^public\s+(?:(?:final|abstract|sealed|non-sealed)\s+)?(?:class|interface|record|enum)\s+/
        def apiSources = publicBoundarySources.files.findAll { source ->
            source.getText('UTF-8') =~ publicTypePattern
        }
        def failures = []
        if (classes > currentProductionShapeLimits.classes) {
            failures << ("production classes ${classes} > "
                    + currentProductionShapeLimits.classes)
        }
        if (lines > currentProductionShapeLimits.lines) {
            failures << ("production lines ${lines} > "
                    + currentProductionShapeLimits.lines)
        }
        if (apiSources.size() > currentProductionShapeLimits.publicApiTypes) {
            failures << ("public API types ${apiSources.size()} > "
                    + currentProductionShapeLimits.publicApiTypes)
        }
        long maximumRetainedManagedEpochSourceLines = 0L
        retainedManagedEpochProductionSources.each { relative ->
            File source = file(relative)
            if (!source.isFile()) {
                failures << "reviewed retained managed-epoch source is missing: ${relative}"
                return
            }
            long sourceLines = source.readLines('UTF-8').size()
            maximumRetainedManagedEpochSourceLines = Math.max(
                    maximumRetainedManagedEpochSourceLines, sourceLines)
            if (sourceLines > currentProductionShapeLimits
                    .maxLinesPerRetainedManagedEpochSource) {
                failures << ("retained managed-epoch source ${relative} has "
                        + "${sourceLines} lines > "
                        + currentProductionShapeLimits
                                .maxLinesPerRetainedManagedEpochSource)
            }
        }
        ['engine', 'fastpath'].each { legacy ->
            if (file("src/main/java/blue/coordination/${legacy}").exists()) {
                failures << "legacy package remains: ${legacy}"
            }
        }
        sources.each { source ->
            String relative = projectDir.toPath().relativize(
                    source.toPath()).toString().replace('\\', '/')
            String body = source.getText('UTF-8')
            if (relative.contains('/basic/') || relative.contains('/test/')) {
                failures << "test-named production package: ${relative}"
            }
            if (source.name.contains('Basic') || source.name.contains('Test')) {
                failures << "test-named production type: ${relative}"
            }
            if (body.contains('org.junit')
                    || body.contains('CoordinationDocumentSplitter')) {
                failures << "test or splitter dependency in ${relative}"
            }
            forbiddenArchitectureTokens.each { token ->
                if (body.contains(token)) {
                    failures << "forbidden architecture token ${token} in ${relative}"
                }
            }
        }
        fileTree('src/main/resources').files.each { resource ->
            String body = resource.getText('UTF-8')
            forbiddenArchitectureTokens.each { token ->
                if (body.contains(token)) {
                    failures << "forbidden architecture token ${token} in ${resource}"
                }
            }
        }
        if (!failures.empty) throw new GradleException(failures.join('; '))
        logger.lifecycle(
                "Production shape: ${classes} classes, ${lines} lines, "
                        + "${apiSources.size()} public API types; retained "
                        + "managed-epoch max source "
                        + "${maximumRetainedManagedEpochSourceLines}/"
                        + currentProductionShapeLimits
                                .maxLinesPerRetainedManagedEpochSource
                        + " lines")
    }
}

tasks.register('verifyPublicApiBoundary') {
    group = 'verification'
    description = 'Rejects public signatures that expose implementation packages.'
    dependsOn tasks.named('compileJava')
    doLast {
        def violations = []
        fileTree('src/main/java/blue/coordination/api') {
            include '**/*.java'
        }.each { source ->
            source.eachLine('UTF-8') { line, number ->
                if (!line.stripLeading().startsWith('import ')
                        && line.contains('blue.coordination.internal')) {
                    violations << "${source}:${number}"
                }
            }
        }
        def allowedPublicInternalSources = [
                'src/main/java/blue/coordination/internal/DefaultCoordinationEngine.java',
                'src/main/java/blue/coordination/internal/BundledContracts10Release.java',
                'src/main/java/blue/coordination/internal/Contracts10AuthoredClosureCompiler.java',
                'src/main/java/blue/coordination/internal/Contracts10StaticEmbeddedAdmissionCompiler.java',
                'src/main/java/blue/coordination/internal/ContractsManagedDraftPlan.java',
                'src/main/java/blue/coordination/internal/ContractsManagedEpochSelectionPlan.java'
        ] as Set
        fileTree('src/main/java/blue/coordination/internal') {
            include '**/*.java'
        }.each { source ->
            String body = source.getText('UTF-8')
            String sourcePath = rootDir.toPath().relativize(
                    source.toPath()).toString().replace('\\', '/')
            if ((body =~ /(?m)^public\s+(?:(?:final|abstract|sealed|non-sealed)\s+)?(?:class|interface|record|enum)\s+/)
                    && !allowedPublicInternalSources.contains(sourcePath)) {
                violations << "public implementation type ${source}"
            }
        }
        if (!violations.empty) {
            throw new GradleException(
                    "Internal API leakage: ${violations.join(', ')}")
        }
    }
}

tasks.register('verifySdkPublicApiBoundary') {
    group = 'verification'
    description = 'Allows only DocumentId from the compatibility API and rejects every implementation dependency in normal SDK signatures.'
    dependsOn tasks.named('compileJava')
    inputs.files(fileTree('src/main/java/blue/coordination/sdk') {
        include '**/*.java'
    }, sourceSets.main.output.classesDirs)
    def inspectionLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
    doLast {
        File sdkClasses = layout.buildDirectory.dir(
                'classes/java/main/blue/coordination/sdk').get().asFile
        if (!sdkClasses.isDirectory()) {
            throw new GradleException(
                    'Compiled SDK classes are missing: ' + sdkClasses)
        }
        String executableName = System.getProperty('os.name')
                .toLowerCase(java.util.Locale.ROOT).contains('windows')
                ? 'javap.exe' : 'javap'
        File javap = inspectionLauncher.get().metadata.installationPath
                .file('bin/' + executableName).asFile
        if (!javap.isFile()) {
            throw new GradleException('Java API inspector is missing: ' + javap)
        }
        def inspectClass = { String className, String visibility ->
            Process process = new ProcessBuilder(
                    javap.absolutePath,
                    visibility,
                    '-classpath',
                    sourceSets.main.output.classesDirs.asPath
                            + File.pathSeparator
                            + configurations.compileClasspath.asPath,
                    className)
                    .redirectErrorStream(true)
                    .start()
            String signature = process.inputStream.getText('UTF-8')
            if (process.waitFor() != 0) {
                throw new GradleException(
                        "javap failed for ${className}: ${signature}")
            }
            signature
        }
        def forbiddenSignaturePrefixes = [
                'blue.coordination.internal.',
                'blue.coordination.processor.',
                'blue.coordination.api.',
                'blue.language.',
                'blue.bex.'
        ]
        def violations = []
        def packagePrivateHelpers = [
                'SdkCoordinationRuntime',
                'SdkDrainResultMapper',
                'SdkPreconditions'
        ]
        packagePrivateHelpers.each { helper ->
            File source = file(
                    "src/main/java/blue/coordination/sdk/${helper}.java")
            if (!source.isFile()) {
                violations << "missing SDK package-private helper ${helper}"
                return
            }
            def sourcePublicDeclaration = java.util.regex.Pattern.compile(
                    '(?m)^\\s*public\\s+(?:(?:final|abstract|sealed|non-sealed)\\s+)*'
                            + '(?:class|interface|record|enum)\\s+'
                            + java.util.regex.Pattern.quote(helper)
                            + '\\b')
            if (sourcePublicDeclaration.matcher(
                    source.getText('UTF-8')).find()) {
                violations << "SDK helper ${helper} is public in source"
            }
            String className = "blue.coordination.sdk.${helper}"
            String binaryDeclaration = inspectClass(className, '-p')
            def binaryPublicDeclaration = java.util.regex.Pattern.compile(
                    '(?m)^public\\s+.*\\b(?:class|interface|enum)\\s+'
                            + java.util.regex.Pattern.quote(className)
                            + '(?:\\s|\\{|<)')
            if (binaryPublicDeclaration.matcher(binaryDeclaration).find()) {
                violations << "SDK helper ${helper} is public in bytecode"
            }
        }
        fileTree(sdkClasses) { include '**/*.class' }.files.sort().each {
            File classFile ->
                String relative = sdkClasses.toPath().relativize(
                        classFile.toPath()).toString().replace('\\', '/')
                String className = "blue.coordination.sdk.${relative
                        .substring(0, relative.length() - 6)
                        .replace('/', '.')}"
                if (className == 'blue.coordination.sdk.AdvancedCoordination'
                        || className.startsWith(
                        'blue.coordination.sdk.AdvancedCoordination$')
                        || packagePrivateHelpers.any { helper ->
                    className == "blue.coordination.sdk.${helper}"
                            || className.startsWith(
                            "blue.coordination.sdk.${helper}\$")
                }) {
                    return
                }
                String signature = inspectClass(className, '-public')
                def publicDeclaration = java.util.regex.Pattern.compile(
                        '(?m)^public\\s+.*\\b(?:class|interface|enum)\\s+'
                                + java.util.regex.Pattern.quote(className)
                                + '(?:\\s|\\{|<)')
                if (!publicDeclaration.matcher(signature).find()) {
                    return
                }
                String normalSignature = signature.replaceAll(
                        /blue\.coordination\.api\.DocumentId\b/, '')
                forbiddenSignaturePrefixes.findAll {
                    normalSignature.contains(it)
                }.each { forbidden ->
                    violations << "${className} exposes ${forbidden}"
                }
        }
        if (!violations.empty) {
            throw new GradleException(
                    'Normal SDK signature leakage: '
                            + violations.join(', '))
        }
    }
}

def sha256Identity = { File input ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    input.withInputStream { stream ->
        byte[] buffer = new byte[8192]
        int count
        while ((count = stream.read(buffer)) != -1) {
            digest.update(buffer, 0, count)
        }
    }
    'sha256:' + digest.digest().encodeHex().toString()
}

def inspectImmutableStagedContractsRepository = {
    if (!immutableStagedContracts) {
        throw new GradleException(
                'Immutable staged Contracts verification requires '
                        + '-PblueDependencyMode=immutable-staged-contracts')
    }
    File repository = file(stagedContractsRepositoryValue).canonicalFile
    File manifestFile = new File(repository, 'artifact-manifest.json')
    File manifestChecksum = new File(
            repository, 'artifact-manifest.json.sha256')
    def failures = []
    def regularFile = { File candidate ->
        java.nio.file.Files.isRegularFile(candidate.toPath(),
                java.nio.file.LinkOption.NOFOLLOW_LINKS)
                && !java.nio.file.Files.isSymbolicLink(candidate.toPath())
    }
    if (!repository.isDirectory()) {
        failures << "staged repository is not a directory ${repository}"
    }
    if (repository.toPath().startsWith(rootDir.canonicalFile.toPath())) {
        failures << 'staged repository must be outside the Coordination source tree'
    }
    if (!regularFile(manifestFile) || !regularFile(manifestChecksum)) {
        failures << 'regular artifact manifest and checksum companion are required'
    }
    if (!failures.empty) {
        throw new GradleException(
                'Immutable staged Contracts repository failed:\n - '
                        + failures.join('\n - '))
    }

    String actualManifestIdentity = sha256Identity(manifestFile)
    if (actualManifestIdentity != stagedContractsManifestIdentity) {
        failures << ('manifest identity is ' + actualManifestIdentity
                + '; expected ' + stagedContractsManifestIdentity)
    }
    String expectedManifestChecksum = actualManifestIdentity.substring(
            'sha256:'.length()) + '  artifact-manifest.json\n'
    if (manifestChecksum.getText('UTF-8') != expectedManifestChecksum) {
        failures << 'artifact manifest checksum companion differs'
    }

    def manifest
    try {
        manifest = new groovy.json.JsonSlurper().parse(manifestFile)
    } catch (RuntimeException exception) {
        throw new GradleException(
                'Cannot parse immutable staged Contracts manifest', exception)
    }
    if (manifest.schema != 'blue-staged-dependency-repository/1.0') {
        failures << "unexpected manifest schema ${manifest.schema}"
    }
    if (manifest.groupId != 'blue.language') {
        failures << "unexpected staged group ${manifest.groupId}"
    }
    if (manifest.version != immutableStagedLanguageVersion) {
        failures << "unexpected staged Contracts version ${manifest.version}"
    }
    if (!(manifest.sourceCommit instanceof String)
            || !(manifest.sourceCommit ==~ /[0-9a-f]{40}|[0-9a-f]{64}/)) {
        failures << 'manifest sourceCommit is not an exact Git identity'
    }
    [
            'contractsSpecificationIdentity',
            'contractsFixturePackageIdentity',
            'contractsReleaseIdentity'
    ].each { field ->
        if (!(manifest[field] instanceof String)
                || !(manifest[field] ==~ /sha256:[0-9a-f]{64}/)) {
            failures << "manifest ${field} is not a SHA-256 identity"
        }
    }
    if (!(manifest.artifacts instanceof List)) {
        failures << 'manifest artifacts must be a list'
    }

    def kinds = [
            javadoc: '-javadoc.jar',
            pom: '.pom',
            runtime: '.jar',
            sources: '-sources.jar'
    ]
    def expectedRecords = []
    stagedContractsArtifacts.toList().sort().each { artifact ->
        kinds.keySet().toList().sort().each { kind ->
            String base = 'blue/language/' + artifact + '/' +
                    immutableStagedLanguageVersion + '/' + artifact + '-' +
                    immutableStagedLanguageVersion
            expectedRecords << [
                    key: artifact + ':' + kind,
                    coordinate: 'blue.language:' + artifact +
                            ':' + immutableStagedLanguageVersion,
                    kind: kind,
                    path: base + kinds[kind]
            ]
        }
    }
    def records = manifest.artifacts instanceof List
            ? manifest.artifacts : []
    def recordKeys = records.collect { record ->
        String.valueOf(record.coordinate) + ':' +
                String.valueOf(record.kind)
    }
    if (recordKeys != recordKeys.toList().sort()) {
        failures << 'manifest artifact records are not canonically ordered'
    }
    if (recordKeys.toSet().size() != recordKeys.size()) {
        failures << 'manifest contains duplicate artifact records'
    }
    def recordsByKey = records.collectEntries { record ->
        [(String.valueOf(record.coordinate) + ':'
                + String.valueOf(record.kind)): record]
    }
    def expectedFiles = [
            'artifact-manifest.json',
            'artifact-manifest.json.sha256'
    ] as Set
    expectedRecords.each { expected ->
        String lookup = expected.coordinate + ':' + expected.kind
        def record = recordsByKey[lookup]
        if (record == null) {
            failures << "missing manifest artifact record ${lookup}"
            return
        }
        if (record.path != expected.path
                || record.checksumPath != expected.path + '.sha256') {
            failures << "noncanonical manifest paths for ${lookup}"
            return
        }
        expectedFiles.add(expected.path)
        expectedFiles.add(expected.path + '.sha256')
        File payload = new File(repository, expected.path).canonicalFile
        File checksum = new File(
                repository, expected.path + '.sha256').canonicalFile
        if (!payload.toPath().startsWith(repository.toPath())
                || !checksum.toPath().startsWith(repository.toPath())) {
            failures << "artifact path escapes repository for ${lookup}"
            return
        }
        if (!regularFile(payload) || !regularFile(checksum)) {
            failures << "missing regular payload/checksum for ${lookup}"
            return
        }
        String payloadIdentity = sha256Identity(payload)
        if (record.sha256 != payloadIdentity) {
            failures << "payload identity differs for ${lookup}"
        }
        if (!(record.bytes instanceof Number)
                || record.bytes.longValue() != payload.length()) {
            failures << "payload byte count differs for ${lookup}"
        }
        String expectedChecksum = payloadIdentity.substring(
                'sha256:'.length()) + '  ' + payload.name + '\n'
        if (checksum.getText('UTF-8') != expectedChecksum) {
            failures << "payload checksum companion differs for ${lookup}"
        }
    }
    if (records.size() != expectedRecords.size()) {
        failures << ('manifest has ' + records.size()
                + ' artifact records; expected ' + expectedRecords.size())
    }

    def actualFiles = [] as Set
    def stream = java.nio.file.Files.walk(repository.toPath())
    try {
        stream.forEach { path ->
            if (path == repository.toPath()) {
                return
            }
            if (java.nio.file.Files.isSymbolicLink(path)) {
                failures << ('symbolic link in staged repository '
                        + repository.toPath().relativize(path))
                return
            }
            if (java.nio.file.Files.isRegularFile(path,
                    java.nio.file.LinkOption.NOFOLLOW_LINKS)) {
                actualFiles.add(repository.toPath().relativize(path)
                        .toString().replace(File.separator, '/'))
            }
        }
    } finally {
        stream.close()
    }
    if (actualFiles != expectedFiles) {
        failures << ('staged repository closure differs; missing '
                + (expectedFiles - actualFiles).toList().sort()
                + ', unexpected '
                + (actualFiles - expectedFiles).toList().sort())
    }
    if (!failures.empty) {
        throw new GradleException(
                'Immutable staged Contracts repository failed:\n - '
                        + failures.join('\n - '))
    }
    manifest
}

def immutableStagedContractsRepository = tasks.register(
        'verifyImmutableStagedContractsRepository') {
    group = 'verification'
    description = 'Verifies the manifest-pinned, closed Contracts repository before dependency resolution.'
    if (immutableStagedContracts) {
        inputs.dir(file(stagedContractsRepositoryValue))
        inputs.property('blueContractsManifestSha256',
                stagedContractsManifestIdentity)
    }
    doLast {
        def manifest = inspectImmutableStagedContractsRepository()
        logger.lifecycle(
                'Immutable staged Contracts repository verified: {} from {}',
                stagedContractsManifestIdentity, manifest.sourceCommit)
    }
}

if (immutableStagedContracts) {
    tasks.named('compileJava') {
        dependsOn immutableStagedContractsRepository
    }
}

tasks.register('dependencyPreflight') {
    group = 'verification'
    description = 'Resolves every release dependency from the selected isolated lane.'
    if (immutableStagedContracts) {
        dependsOn immutableStagedContractsRepository
    }
    doLast {
        def repositoryDependency = dependencies.create(
                'blue.repo:blue-repo-java:3.0.0-rc.21')
        repositoryDependency.exclude(
                group: 'blue.language', module: 'blue-language-java')
        def bexCoreDependency = dependencies.create(
                'blue.bex:blue-bex-core:1.1.0-rc.4')
        bexCoreDependency.exclude(group: 'blue.language')
        def bexContractsDependency = dependencies.create(
                'blue.bex:blue-bex-contracts:1.1.0-rc.4')
        bexContractsDependency.exclude(group: 'blue.language')
        def releaseDependencies = configurations.detachedConfiguration(
                dependencies.create(
                        'blue.language:blue-contracts-core:' +
                                activeLanguageVersion),
                dependencies.create(
                        'blue.language:blue-language-java:' +
                                activeLanguageVersion),
                repositoryDependency,
                bexCoreDependency,
                bexContractsDependency,
                dependencies.create('org.bouncycastle:bcprov-jdk18on:1.78.1'))
        releaseDependencies.transitive = true
        releaseDependencies.resolutionStrategy.failOnVersionConflict()
        releaseDependencies.resolve()
        def selectedBlue = releaseDependencies.incoming.resolutionResult
                .allComponents.findAll { component ->
            component.id instanceof
                    org.gradle.api.artifacts.component.ModuleComponentIdentifier
                    && ['blue.language', 'blue.bex', 'blue.repo'].contains(
                    component.id.group)
        }.collectEntries { component ->
            [(component.id.group + ':' + component.id.module):
                     component.id.version]
        }
        if (selectedBlue != activeBlueCoordinates) {
            throw new GradleException(
                    'Selected Blue dependency graph differs from the active '
                            + "pin: ${selectedBlue}")
        }
        logger.lifecycle(
                'All {} release dependencies resolved at exact pins.',
                dependencyMode)
    }
}

tasks.register('verifyArtifactContents') {
    group = 'verification'
    description = 'Rejects legacy, test, and fixture classes in the production JAR.'
    dependsOn tasks.named('jar')
    doLast {
        def forbidden = [
                'blue/coordination/basic/',
                'blue/coordination/test/',
                'blue/coordination/engine/',
                'blue/coordination/fastpath/',
                'myosDemoTest',
                'CoordinationTestControl'
        ] + forbiddenArchitectureTokens
        def violations = []
        def artifactTree = zipTree(
                tasks.named('jar').get().archiveFile)
        artifactTree.visit { details ->
            if (!details.directory && forbidden.any {
                details.path.contains(it)
            }) {
                violations << details.path
            }
        }
        [
                'blue/coordination/sdk/BlueCoordination.class',
                'blue/coordination/sdk/EntryDisposition.class',
                'blue/coordination/sdk/contracts-1.0-release.properties'
        ].each { required ->
            if (artifactTree.matching { include required }.isEmpty()) {
                violations << "missing required SDK entry ${required}"
            }
        }
        if (!violations.empty) {
            throw new GradleException(
                    "Unsupported production JAR entries: ${violations}")
        }
    }
}

tasks.register('verifyPublicationPom') {
    group = 'verification'
    dependsOn 'generatePomFileForMavenJavaPublication'
    doLast {
        String pom = layout.buildDirectory.file(
                'publications/mavenJava/pom-default.xml')
                .get().asFile.getText('UTF-8')
        def scopes = [:]
        pom.split('</dependency>').each { block ->
            int dependencyStart = block.lastIndexOf('<dependency>')
            String dependencyBlock = dependencyStart >= 0
                    ? block.substring(dependencyStart) : ''
            def groups = (dependencyBlock
                    =~ /<groupId>([^<]+)<\/groupId>/)
                    .collect { it[1] }
            def artifacts = (dependencyBlock
                    =~ /<artifactId>([^<]+)<\/artifactId>/)
                    .collect { it[1] }
            def scope = (dependencyBlock =~ /<scope>([^<]+)<\/scope>/)
            if (!groups.empty && !artifacts.empty) {
                scopes[groups.first() + ':' + artifacts.first()] =
                        scope.find() ? scope.group(1) : 'compile'
            }
        }
        ['blue.language:blue-contracts-core', 'blue.bex:blue-bex-core',
         'blue.bex:blue-bex-contracts']
                .each { coordinate ->
                    if (scopes[coordinate] != 'compile') {
                        throw new GradleException(
                                "${coordinate} must be compile scoped because public APIs expose its types")
                    }
                }
        ['blue.language:blue-language-java',
         'blue.repo:blue-repo-java', 'org.bouncycastle:bcprov-jdk18on']
                .each { coordinate ->
                    if (scopes[coordinate] != 'runtime') {
                        throw new GradleException(
                                "${coordinate} must be runtime scoped")
                    }
                }
        def expectedVersions = [
                'blue.language:blue-contracts-core': activeLanguageVersion,
                'blue.language:blue-language-java': activeLanguageVersion,
                'blue.repo:blue-repo-java': '3.0.0-rc.21',
                'blue.bex:blue-bex-core': '1.1.0-rc.4',
                'blue.bex:blue-bex-contracts': '1.1.0-rc.4',
                'org.bouncycastle:bcprov-jdk18on': '1.78.1'
        ]
        expectedVersions.each { coordinate, expectedVersion ->
            String artifact = coordinate.substring(
                    coordinate.indexOf(':') + 1)
            def dependency = pom.split('</dependency>').find { block ->
                block.contains("<artifactId>${artifact}</artifactId>")
            }
            if (dependency == null
                    || !dependency.contains(
                    "<version>${expectedVersion}</version>")) {
                throw new GradleException(
                        "${coordinate} must use ${expectedVersion}")
            }
        }
        def repositoryDependency = pom.split('</dependency>').find { block ->
            block.contains('<groupId>blue.repo</groupId>')
                    && block.contains(
                    '<artifactId>blue-repo-java</artifactId>')
        }
        if (repositoryDependency == null
                || !repositoryDependency.contains(
                '<groupId>blue.language</groupId>')
                || !repositoryDependency.contains(
                '<artifactId>blue-language-java</artifactId>')) {
            throw new GradleException(
                    'Repository rc.21 must exclude its stale Language rc.20 edge')
        }
        ['MIT License', '<developers>', '<scm>', '<issueManagement>']
                .each { marker ->
                    if (!pom.contains(marker)) {
                        throw new GradleException(
                                "Publication POM is missing ${marker}")
                    }
                }
        [
                '<url>https://github.com/bluecontract/blue-coordination-java</url>',
                '<connection>scm:git:https://github.com/bluecontract/blue-coordination-java.git</connection>',
                '<developerConnection>scm:git:ssh://git@github.com/bluecontract/blue-coordination-java.git</developerConnection>',
                '<url>https://github.com/bluecontract/blue-coordination-java/issues</url>'
        ].each { marker ->
            if (!pom.contains(marker)) {
                throw new GradleException(
                        "Publication POM is missing canonical repository metadata ${marker}")
            }
        }
        if (pom.contains('github.com/bluecontract/blue-contract-java')) {
            throw new GradleException(
                    'Publication POM contains the obsolete repository URL')
        }
        if (pom.contains('SNAPSHOT') || pom.contains('junit')) {
            throw new GradleException(
                    'Release POM contains a snapshot or test dependency')
        }
    }
}

tasks.register('verifyReleaseMetadata') {
    group = 'verification'
    description = 'Validates version, legal metadata, docs, and release artifacts.'
    dependsOn 'jar', 'sourcesJar', 'javadocJar',
            'generatePomFileForMavenJavaPublication'
    String configuredReleaseVersion = version.toString()
    doLast {
