def sourceArchiveChecksum = tasks.register(
        'coordinationSourceArchiveChecksum') {
    group = 'distribution'
    description = 'Writes the source archive SHA-256 sidecar.'
    dependsOn coordinationSourceArchive
    def archive = coordinationSourceArchive.flatMap { it.archiveFile }
    def sidecar = archive.map { it.asFile.toPath().resolveSibling(
            it.asFile.name + '.sha256').toFile() }
    inputs.file(archive)
    outputs.file(sidecar)
    doLast {
        File sourceArchive = archive.get().asFile
        String hash = java.security.MessageDigest.getInstance('SHA-256')
                .digest(sourceArchive.bytes).encodeHex().toString()
        sidecar.get().setText("${hash}  ${sourceArchive.name}\n", 'UTF-8')
    }
}

def extractedSourceArchive = tasks.register('verifyExtractedSourceArchive') {
    group = 'verification'
    description = 'Extracts, configures, and runs the focused Round 13 archive proofs.'
    dependsOn sourceArchiveChecksum
    inputs.file(coordinationSourceArchive.flatMap { it.archiveFile })
    inputs.property('dependencyMode', dependencyMode)
    inputs.property('testJavaVersion', providers.gradleProperty(
            'testJavaVersion').getOrElse('17'))
    outputs.dir(layout.buildDirectory.dir('source-archive-smoke'))
    def verificationReceipt = layout.buildDirectory.file(
            'reports/round13/source-archive-verification.json')
    outputs.file(verificationReceipt)
    doLast {
        File sourceArchive = coordinationSourceArchive.get()
                .archiveFile.get().asFile
        def zip = new java.util.zip.ZipFile(sourceArchive)
        try {
            java.util.Collections.list(zip.entries()).each { entry ->
                String path = entry.name.replace('\\', '/')
                List<String> segments = path.split('/').findAll()
                String leaf = segments.empty ? '' : segments.last()
                String lower = path.toLowerCase(java.util.Locale.ROOT)
                if (lower.endsWith('.zip')
                        || lower.endsWith('.class')
                        || segments.any { segment ->
                            ['build', 'out', '.gradle', '__macosx'].contains(
                                    segment.toLowerCase(
                                            java.util.Locale.ROOT))
                        }
                        || leaf.startsWith('._')
                        || leaf.equalsIgnoreCase('.DS_Store')) {
                    throw new GradleException(
                            "Forbidden source-archive entry: ${path}")
                }
            }
        } finally {
            zip.close()
        }
        File smokeRoot = layout.buildDirectory.dir(
                'source-archive-smoke').get().asFile
        delete smokeRoot
        copy {
            from zipTree(coordinationSourceArchive.get()
                    .archiveFile.get().asFile)
            into smokeRoot
        }
        File extracted = new File(
                smokeRoot, "blue-coordination-java-${version}")
        if (!new File(extracted, '.cz.toml').isFile()) {
            throw new GradleException(
                    'Extracted source archive is missing .cz.toml')
        }
        def forbidden = fileTree(extracted) {
            include '**/*.zip', '**/__MACOSX/**', '**/._*',
                    '**/.DS_Store', '**/build/**'
        }.files
        if (!forbidden.empty) {
            throw new GradleException(
                    "Forbidden source-archive entries: ${forbidden}")
        }
        boolean windows = System.getProperty('os.name').toLowerCase(
                java.util.Locale.ROOT).contains('windows')
        File wrapper = new File(extracted, windows ? 'gradlew.bat' : 'gradlew')
        if (!windows && !wrapper.canExecute()) {
            throw new GradleException(
                    'Extracted source archive gradlew is not executable')
        }
        List<String> command = windows
                ? ['cmd', '/d', '/c', wrapper.absolutePath]
                : [wrapper.absolutePath]
        command.addAll([
                '--no-daemon', '--max-workers=1',
                'help', 'round13SourceArchiveSmoke',
                '-PtestJavaVersion=' + providers.gradleProperty(
                        'testJavaVersion').getOrElse('17')
        ])
        if (localDependencies) {
            command.addAll([
                    '-PblueDependencyMode=local-composite',
                    '-PblueBexCompositePath=' + file(providers.gradleProperty(
                            'blueBexCompositePath').getOrElse(
                            '../blue-bex-java')).canonicalPath,
                    '-PblueRepositoryCompositePath=' + file(
                            providers.gradleProperty(
                                    'blueRepositoryCompositePath').getOrElse(
                                    '../blue-repository-java')).canonicalPath
            ])
        } else {
            command.add('-PblueDependencyMode=published-artifact')
            if (publishedRepository != null) {
                command.add('-PbluePublishedRepository='
                        + uri(publishedRepository).toString())
            }
        }
        Process process = new ProcessBuilder(command)
                .directory(extracted).redirectErrorStream(true).start()
        process.inputStream.eachLine { logger.lifecycle(it) }
        if (process.waitFor() != 0) {
            throw new GradleException(
                    'Extracted source archive smoke build failed')
        }
        File sidecar = new File(
                sourceArchive.parentFile, sourceArchive.name + '.sha256')
        String archiveHash = java.security.MessageDigest
                .getInstance('SHA-256').digest(sourceArchive.bytes)
                .encodeHex().toString()
        if (!sidecar.isFile() || !sidecar.getText('UTF-8')
                .startsWith(archiveHash + '  ' + sourceArchive.name)) {
            throw new GradleException(
                    'Extracted source archive detached checksum differs')
        }
        File receipt = verificationReceipt.get().asFile
        receipt.parentFile.mkdirs()
        def receiptValue = [
                schemaId: 'blue-coordination-round13-source-archive-verification-v1',
                archiveName: sourceArchive.name,
                archiveSha256: archiveHash,
                checksumMode: 'DETACHED_SHA256_SIDECAR',
                checksumPath: rootDir.toPath().relativize(
                        sidecar.toPath()).toString().replace('\\', '/'),
                dependencyMode: dependencyMode,
                java: providers.gradleProperty(
                        'testJavaVersion').getOrElse('17'),
                extractedConfiguration: 'PASS',
                focusedTestsStatus: 'PASS',
                publishedArtifactSmokeBuild: localDependencies
                        ? 'PENDING_VERIFICATION' : 'PASS',
                focusedTasks: [
                        'round13SourceArchiveUnitTest',
                        'round13SourceArchiveIntegrationTest',
                        'round13SourceArchiveScenarioTest',
                        'round13SourceArchiveConsumerTest'
                ]
        ]
        receipt.setText(groovy.json.JsonOutput.prettyPrint(
                groovy.json.JsonOutput.toJson(receiptValue)) + '\n',
                'UTF-8')
    }
}

tasks.register('verifyPublishedModeIsolation') {
    group = 'verification'
    description = 'Proves published mode is the default and has no Git or sibling checks.'
    inputs.files('settings.gradle', 'build.gradle')
    doLast {
        String settings = file('settings.gradle').getText('UTF-8')
        String buildScript = file('build.gradle').getText('UTF-8')
        if (settings.contains('ProcessBuilder') || settings.contains("'git'")) {
            throw new GradleException(
                    'Ordinary settings must not execute Git')
        }
        if (!settings.contains(".getOrElse('published-artifact')")
                || !buildScript.contains(
                ".getOrElse('published-artifact')")) {
            throw new GradleException(
                    'Published artifacts must remain the default dependency mode')
        }
        if (!settings.contains("dependencyMode == 'local-composite'")) {
            throw new GradleException(
                    'Local composite inclusion is not mode-gated')
        }
    }
}

tasks.register('verifyTestArchitecture') {
    group = 'verification'
    description = 'Protects release-owned test depth and JAR-only consumer isolation.'
    def suites = [
            unit: fileTree('src/test/java') { include '**/*Test.java' },
            integration: fileTree('src/integrationTest/java') {
                include '**/*Test.java'
            },
            consumer: fileTree('src/consumerTest/java') {
                include '**/*Test.java'
            },
            scenario: fileTree('src/scenarioTest/java') {
                include '**/*Test.java'
            }
    ]
    inputs.files(suites.values())
    inputs.file('build.gradle')
    dependsOn tasks.named('jar')
    doLast {
        def minimumTests = [unit: 175, integration: 24,
                            consumer: 5, scenario: 2]
        def failures = []
        suites.each { name, sources ->
            int methods = sources.files.sum { source ->
                (source.getText('UTF-8') =~ /(?m)^\s*@Test\b/).count
            } ?: 0
            if (methods < minimumTests[name]) {
                failures << "${name} has ${methods} @Test methods; "
                        + "minimum is ${minimumTests[name]}"
            }
            logger.lifecycle(
                    "${name} tests: ${sources.files.size()} classes, "
                            + "${methods} methods")
        }

        String integrationSources = fileTree('src/integrationTest/java') {
            include '**/*.java'
        }.files.collect { it.getText('UTF-8') }.join('\n')
        ['BasicTestMetrics', 'RuntimeComparisonWriter', 'LatencySeries']
                .each { historical ->
                    if (integrationSources.contains(historical)) {
                        failures << "release tests depend on historical metric "
                                + "support ${historical}"
                    }
                }
        if (integrationSources.contains('blue.coordination.basic')) {
            failures << 'release tests retain the historical basic package'
        }

        fileTree('src/consumerTest/java') { include '**/*.java' }
                .each { source ->
                    String body = source.getText('UTF-8')
                    ['blue.coordination.internal',
                     'blue.coordination.processor',
                     'blue.coordination.integration']
                            .each { forbidden ->
                                if (body.contains(forbidden)) {
                                    failures << "consumer imports ${forbidden}: "
                                            + source
                                }
                            }
                }
        Set<File> mainOutputs = sourceSets.main.output.files.collect {
            it.canonicalFile
        } as Set
        Set<File> consumerClasspath = sourceSets.consumerTest
                .compileClasspath.files.collect { it.canonicalFile } as Set
        if (!mainOutputs.intersect(consumerClasspath).empty) {
            failures << 'consumer compile classpath contains main source outputs'
        }
        File mainJar = tasks.named('jar').get().archiveFile.get().asFile
                .canonicalFile
        if (!consumerClasspath.contains(mainJar)) {
            failures << 'consumer compile classpath does not contain the built JAR'
        }
        String historicalProject = '../blue-' + 'basic'
        if (file('build.gradle').getText('UTF-8').contains(
                historicalProject)) {
            failures << "release build depends on ${historicalProject}"
        }
        if (!failures.empty) {
            throw new GradleException(failures.join('; '))
        }
    }
}

