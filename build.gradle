                    || timelineCapability.blocker != false
                    || evidence.blockers.any {
                        it.id == 'generic-timeline-entry-document-target'
                    }) {
                failures << 'Generic Timeline targeting must remain optional'
            }
            if (!evidence.blockers.any {
                it.id == 'provider-mandate-resolver'
            }) {
                failures << 'Provider-backed Mandate resolver must remain a blocker'
            }

            String report = file(
                    'docs/releases/3.0.0-rc.1-test-report.md')
                    .getText('UTF-8')
            expectedStatuses.each { key ->
                if (!report.contains(
                        "| `${key}` | `${evidence.status[key]}` |")) {
                    failures << "Canonical report/evidence status differs for ${key}"
                }
            }
            expectedProofs.keySet().each { proof ->
                if (!report.contains("`${proof}`")) {
                    failures << "Canonical report omits proof ${proof}"
                }
            }
            List<String> reportLines = report.readLines()
            evidence.proofs.each { proof ->
                String row = reportLines.find {
                    it.contains("| `${proof.id}` |")
                }
                if (row == null
                        || !row.endsWith("| `${proof.status}` |")) {
                    failures << "Canonical proof status differs: ${proof.id}"
                }
            }
            evidence.runtimes.each { runtime ->
                String row = reportLines.find {
                    it.startsWith("| Java ${runtime.java} |")
                }
                if (row == null || !row.contains("| `${runtime.status}` |")) {
                    failures << "Canonical runtime status differs: Java "
                            + runtime.java
                }
            }
            evidence.tests.suites.each { suite ->
                String row = reportLines.find {
                    it.contains("(`${suite.name}`)")
                }
                if (row == null
                        || !row.contains("| ${suite.classes} | ${suite.tests} |")
                        || !row.endsWith("| `${suite.status}` |")) {
                    failures << "Canonical test inventory differs: ${suite.name}"
                }
            }
            String totalRow = reportLines.find { it.startsWith('| **Total** |') }
            if (totalRow == null
                    || !totalRow.contains("**${evidence.tests.classes}**")
                    || !totalRow.contains("**${evidence.tests.tests}**")
                    || !totalRow.contains(
                    "**`${evidence.tests.executionStatus}`**")) {
                failures << 'Canonical aggregate test inventory differs'
            }
            if (!report.contains(evidence.source.mainSourceManifestSha256)) {
                failures << 'Canonical report omits the main-source manifest'
            }

            boolean interim = evidence.evidenceState == 'INTERIM'
            if (interim) {
                def requiredInterimStatuses = [
                        temporalArchitectureReady: 'PENDING_VERIFICATION',
                        inMemoryEngineWorkingReady: 'PENDING_VERIFICATION',
                        providerBackedReady: 'BLOCKED_SCOPE',
                        mandateAgentReady: 'BLOCKED_UPSTREAM',
                        playgroundLatencyReady: 'PENDING_VERIFICATION',
                        publicRcReady: 'BLOCKED'
                ]
                if (evidence.verdict != 'PENDING_VERIFICATION'
                        || evidence.status != requiredInterimStatuses) {
                    failures << 'Round 12 INTERIM verdict/status set is inconsistent'
                }
                if (evidence.source.candidateCommit != null
                        || evidence.source.binding
                        != 'BASE_COMMIT_PLUS_DIRTY_WORKTREE_MANIFEST'
                        || evidence.source.worktree != 'DIRTY'
                        || !evidence.source.dirtyReason) {
                    failures << 'Round 12 INTERIM source binding is inconsistent'
                }
                def executionStatuses = [
                        evidence.tests.executionStatus,
                        evidence.performance.round12Campaign.status,
                        evidence.performance.round12Campaign
                                .nbaLifecycleEvidence.status,
                        evidence.performance.round12Campaign
                                .sameScenarioP95.status,
                        evidence.structuralEvidence.status,
                        evidence.artifacts.status,
                        evidence.sourceArchive.extractedConfiguration,
                        evidence.sourceArchive.focusedTestsStatus,
                        evidence.sourceArchive.publishedArtifactSmokeBuild,
                        evidence.sourceArchive.detachedHashEvidence.status,
                        evidence.publicationEvidence.status
                ] + evidence.runtimes.collect { it.status }
                executionStatuses.addAll(evidence.proofs.collect { it.status })
                boolean hasWorktreeResults = executionStatuses.any {
                    it != 'PENDING_VERIFICATION'
                }
                if (evidence.executionBinding.kind == 'PENDING') {
                    if (hasWorktreeResults
                            || evidence.executionBinding
                            .mainSourceManifestSha256 != null
                            || evidence.executionBinding.candidateCommit != null) {
                        failures << 'Pending execution binding contains results'
                    }
                } else if (evidence.executionBinding.kind
                        == 'WORKTREE_EXECUTION') {
                    if (evidence.executionBinding.mainSourceManifestSha256
                            != evidence.source.mainSourceManifestSha256
                            || evidence.executionBinding.candidateCommit != null) {
                        failures << 'Worktree results are not manifest-bound'
                    }
                } else {
                    failures << 'INTERIM evidence has an invalid execution binding'
                }
                def resultFields = ['failures', 'errors', 'skipped']
                if (evidence.tests.executionStatus
                        == 'PENDING_VERIFICATION') {
                    if (resultFields.any { evidence.tests[it] != null }
                            || evidence.tests.suites.any {
                                it.status != 'PENDING_VERIFICATION'
                                        || resultFields.any { field ->
                                            it[field] != null
                                        }
                            }) {
                        failures << 'Pending test results contain measurements'
                    }
                } else if (resultFields.any {
                    !(evidence.tests[it] instanceof Number)
                } || evidence.tests.suites.any { suite ->
                    suite.status == 'PENDING_VERIFICATION'
                            || resultFields.any {
                                !(suite[it] instanceof Number)
                            }
                }) {
                    failures << 'Measured worktree test results are incomplete'
                } else if (evidence.tests.executionStatus == 'PASS'
                        && (resultFields.any { evidence.tests[it] != 0 }
                        || evidence.tests.suites.any { suite ->
                            suite.status != 'PASS'
                                    || resultFields.any { suite[it] != 0 }
                        })) {
                    failures << 'Passing worktree test results are inconsistent'
                }
                if (evidence.runtimes.any { runtime ->
                    runtime.status == 'PENDING_VERIFICATION'
                            ? runtime.durationSeconds != null
                            : !(runtime.durationSeconds instanceof Number)
                            || runtime.durationSeconds <= 0
                }) {
                    failures << 'Worktree runtime duration/status is inconsistent'
                }
                if (nbaEvidence.status == 'PENDING_VERIFICATION'
                        ? !nbaEvidence.evidenceFiles.empty
                        : nbaEvidence.evidenceFiles.empty) {
                    failures << 'Round 12 NBA evidence status is inconsistent'
                }
                if (sameScenarioP95.status == 'PENDING_VERIFICATION') {
                    if (sameScenarioP95.singleRunMs != null
                            || sameScenarioP95.repeatedP95Rows != null
                            || !sameScenarioP95.evidenceFiles.empty) {
                        failures << 'Pending Round 12 p95 evidence is not empty'
                    }
                } else if (sameScenarioP95.singleRunMs == null
                        || sameScenarioP95.repeatedP95Rows == null
                        || sameScenarioP95.evidenceFiles.empty) {
                    failures << 'Measured Round 12 p95 evidence is incomplete'
                }
                if (evidence.structuralEvidence.status
                        == 'PENDING_VERIFICATION') {
                    if (evidence.structuralEvidence.requiredZeroCounters.any {
                        key, value -> value != null
                    }) {
                        failures << 'Pending structural counters are not null'
                    }
                } else if (evidence.structuralEvidence
                        .requiredZeroCounters.any {
                            key, value -> !(value instanceof Number)
                        }) {
                    failures << 'Measured structural counters are incomplete'
                } else if (evidence.structuralEvidence.status == 'PASS'
                        && evidence.structuralEvidence.requiredZeroCounters.any {
                            key, value -> value != 0
                        }) {
                    failures << 'Passing structural counters are not zero'
                }
                if (evidence.artifacts.status == 'PENDING_VERIFICATION') {
                    if (artifactHashes.any {
                        evidence.artifacts[it] != null
                    }) {
                        failures << 'Pending artifact hashes are not null'
                    }
                } else if (artifactHashes.any {
                    !(evidence.artifacts[it] ==~ sha256Pattern)
                }) {
                    failures << 'Measured artifact hashes are incomplete'
                }
                def archiveStatuses = [
                        evidence.sourceArchive.extractedConfiguration,
                        evidence.sourceArchive.focusedTestsStatus,
                        evidence.sourceArchive.publishedArtifactSmokeBuild,
                        evidence.sourceArchive.detachedHashEvidence.status
                ]
                if (archiveStatuses.any { it == 'PENDING_VERIFICATION' }
                        ? !evidence.sourceArchive.pendingReason
                        : evidence.sourceArchive.pendingReason != null) {
                    failures << 'Worktree source-archive state is inconsistent'
                }
                if (evidence.publicationEvidence.status
                        == 'PENDING_VERIFICATION'
                        ? evidence.publicationEvidence.durationSeconds != null
                        : !(evidence.publicationEvidence.durationSeconds
                        instanceof Number)) {
                    failures << 'Worktree publication result is inconsistent'
                }
                if (!report.contains(
                        'ROUND12_INTERIM_VERIFICATION: PENDING_VERIFICATION')
                        || report.contains('ROUND12_FINAL_VERIFICATION:')) {
                    failures << 'Canonical report lacks the INTERIM marker'
                }
            } else {
                def sha1Pattern = ~/[0-9a-f]{40}/
                if (!(evidence.source.candidateCommit ==~ sha1Pattern)
                        || evidence.source.binding != 'CANDIDATE_COMMIT'
                        || evidence.source.worktree != 'CLEAN'
                        || evidence.source.dirtyReason != null
                        || evidence.executionBinding.kind
                        != 'CANDIDATE_COMMIT_EXECUTION'
                        || evidence.executionBinding.candidateCommit
                        != evidence.source.candidateCommit
                        || evidence.executionBinding.mainSourceManifestSha256
                        != evidence.source.mainSourceManifestSha256) {
                    failures << 'Round 12 FINAL source binding is inconsistent'
                }
                def resultFields = ['failures', 'errors', 'skipped']
                if (evidence.tests.executionStatus
                        == 'PENDING_VERIFICATION'
                        || resultFields.any {
                            !(evidence.tests[it] instanceof Number)
                        } || evidence.tests.suites.any { suite ->
                            suite.status == 'PENDING_VERIFICATION'
                                    || resultFields.any {
                                        !(suite[it] instanceof Number)
                                    }
                        }) {
                    failures << 'Round 12 FINAL test results are incomplete'
                }
                if (evidence.runtimes.any {
                    it.status == 'PENDING_VERIFICATION'
                            || !(it.durationSeconds instanceof Number)
                            || it.durationSeconds <= 0
                } || evidence.proofs.any {
                    it.status == 'PENDING_VERIFICATION'
                }) {
                    failures << 'Round 12 FINAL lanes/proofs are incomplete'
                }
                if (campaign.status == 'PENDING_VERIFICATION'
                        || nbaEvidence.status == 'PENDING_VERIFICATION'
                        || nbaEvidence.evidenceFiles.empty
                        || sameScenarioP95.status == 'PENDING_VERIFICATION'
                        || sameScenarioP95.singleRunMs == null
                        || sameScenarioP95.repeatedP95Rows == null
                        || sameScenarioP95.evidenceFiles.empty) {
                    failures << 'Round 12 FINAL performance is incomplete'
                }
                if (evidence.structuralEvidence.status
                        == 'PENDING_VERIFICATION'
                        || evidence.structuralEvidence.requiredZeroCounters.any {
                            key, value -> !(value instanceof Number)
                        }) {
                    failures << 'Round 12 FINAL counters are incomplete'
                }
                if (evidence.artifacts.status == 'PENDING_VERIFICATION'
                        || artifactHashes.any {
                            !(evidence.artifacts[it] ==~ sha256Pattern)
                        }) {
                    failures << 'Round 12 FINAL artifact hashes are incomplete'
                }
                if ([evidence.sourceArchive.extractedConfiguration,
                     evidence.sourceArchive.focusedTestsStatus,
                     evidence.sourceArchive.publishedArtifactSmokeBuild,
                     evidence.sourceArchive.detachedHashEvidence.status]
                        .any { it == 'PENDING_VERIFICATION' }
                        || evidence.sourceArchive.pendingReason != null) {
                    failures << 'Round 12 FINAL source archive is incomplete'
                }
                if (evidence.publicationEvidence.status
                        == 'PENDING_VERIFICATION'
                        || !(evidence.publicationEvidence.durationSeconds
                        instanceof Number)) {
                    failures << 'Round 12 FINAL publication is incomplete'
                }
                if (!report.contains(
                        "ROUND12_FINAL_VERIFICATION: ${evidence.verdict}")
                        || report.contains('ROUND12_INTERIM_VERIFICATION:')) {
                    failures << 'Canonical report lacks the FINAL marker'
                }
            }
            [
                    'docs/releases/3.0.0-rc.1-round11-test-report.md',
                    'docs/releases/3.0.0-rc.1-round11-evidence.json',
                    'docs/releases/3.0.0-rc.1-round12-test-report.md',
                    'docs/releases/3.0.0-rc.1-round12-evidence.json'
            ].each { duplicate ->
                if (file(duplicate).exists()) {
                    failures << "Duplicate release evidence surface remains: ${duplicate}"
                }
            }
            if (!failures.empty) {
                throw new GradleException(failures.join('\n'))
            }
            return
        }
        failures << 'Canonical evidence must use the Round 12 profile'
        if (!failures.empty) {
            throw new GradleException(failures.join('\n'))
        }
    }
}

tasks.register('verifySourceArchiveHygiene') {
    group = 'verification'
    description = 'Protects the self-contained source-release boundary.'
    inputs.files('.cz.toml', '.gitattributes', 'build.gradle')
    String configuredArchiveVersion = version.toString()
    doLast {
        String versionSource = file('.cz.toml').getText('UTF-8')
        def declaredVersions = versionSource =~
                /(?m)^version = "([^"]+)"$/
        if (!declaredVersions.find()
                || declaredVersions.group(1) != declaredProjectVersion
                || declaredVersions.find()) {
            throw new GradleException(
                    '.cz.toml must contain one authoritative project version')
        }
        if (configuredArchiveVersion != declaredProjectVersion) {
            throw new GradleException(
                    'Configured source archive version does not match .cz.toml')
        }
        String attributes = file('.gitattributes').getText('UTF-8')
        [
                '*.zip export-ignore',
                'build/** export-ignore',
                '.gradle/** export-ignore',
                '__MACOSX/** export-ignore',
                '._* export-ignore',
                '*.jfr export-ignore',
                '*.hprof export-ignore'
        ].each { rule ->
            if (!attributes.contains(rule)) {
                throw new GradleException(
                        "Source archive rule is missing: ${rule}")
            }
        }
    }
}

def sourceArchiveIncludes = [
        '.cz.toml', '.gitattributes', '.github/**', '.gitignore',
        'CHANGELOG.md', 'CONTRIBUTING.md', 'LICENSE', 'README.md',
        'SECURITY.md', 'START-HERE.md', 'build.gradle', 'docs/**',
        'gradle/**', 'gradle.properties', 'gradlew',
        'gradlew.bat', 'scripts/**', 'settings.gradle', 'smoke-tests/**', 'src/**',
        'stabilization/cyclic-topology-rc3-final/**'
]
def sourceArchiveExcludes = [
        '**/.git/**', '**/.gradle/**', '**/.idea/**', '**/build/**',
        '**/out/**', '**/*.zip', '**/__MACOSX/**', '**/._*',
        '**/.DS_Store', '**/*.class', '**/*.jfr', '**/*.hprof',
        '**/hs_err_pid*.log', '**/replay_pid*.log'
]

def coordinationSourceArchive = tasks.register(
        'coordinationSourceArchive', Zip) {
    group = 'distribution'
    description = 'Creates the self-contained Coordination source archive.'
    archiveFileName = "blue-coordination-java-${version}-source.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    includeEmptyDirs = false
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    duplicatesStrategy = org.gradle.api.file.DuplicatesStrategy.FAIL
    into("blue-coordination-java-${version}") {
        from(rootDir) {
            include sourceArchiveIncludes
            exclude sourceArchiveExcludes
            filesMatching('gradlew') { permissions { unix(0755) } }
        }
    }
}

def sourceArchiveChecksum = tasks.register(
        'coordinationSourceArchiveChecksum') {
    group = 'distribution'
    description = 'Writes the source archive SHA-256 sidecar.'
    dependsOn coordinationSourceArchive
    def archive = coordinationSourceArchive.flatMap { it.archiveFile }
    def sidecar = archive.map { it.asFile.toPath().resolveSibling(
            it.asFile.name + '.sha256').toFile() }
    inputs.file(archive)
    outputs.file(sidecar)
    doLast {
        File sourceArchive = archive.get().asFile
        String hash = java.security.MessageDigest.getInstance('SHA-256')
                .digest(sourceArchive.bytes).encodeHex().toString()
        sidecar.get().setText("${hash}  ${sourceArchive.name}\n", 'UTF-8')
    }
}

def extractedSourceArchive = tasks.register('verifyExtractedSourceArchive') {
    group = 'verification'
    description = 'Verifies the extracted archive against the selected isolated dependency lane.'
    dependsOn sourceArchiveChecksum
    inputs.file(coordinationSourceArchive.flatMap { it.archiveFile })
    inputs.property('dependencyMode', dependencyMode)
    inputs.property('testJavaVersion', providers.gradleProperty(
            'testJavaVersion').getOrElse('17'))
    if (immutableStagedContracts) {
        inputs.dir(file(stagedContractsRepositoryValue))
        inputs.property('blueContractsManifestSha256',
                stagedContractsManifestIdentity)
    }
    outputs.dir(layout.buildDirectory.dir('source-archive-smoke'))
    def verificationReceipt = layout.buildDirectory.file(
            'reports/contracts10/source-archive-verification.json')
    outputs.file(verificationReceipt)
    doLast {
        File sourceArchive = coordinationSourceArchive.get()
                .archiveFile.get().asFile
        def zip = new java.util.zip.ZipFile(sourceArchive)
        try {
            java.util.Collections.list(zip.entries()).each { entry ->
                String path = entry.name.replace('\\', '/')
                List<String> segments = path.split('/').findAll()
                String leaf = segments.empty ? '' : segments.last()
                String lower = path.toLowerCase(java.util.Locale.ROOT)
                if (lower.endsWith('.zip')
                        || lower.endsWith('.class')
                        || segments.any { segment ->
                            ['build', 'out', '.gradle', '__macosx'].contains(
                                    segment.toLowerCase(
                                            java.util.Locale.ROOT))
                        }
                        || leaf.startsWith('._')
                        || leaf.equalsIgnoreCase('.DS_Store')) {
                    throw new GradleException(
                            "Forbidden source-archive entry: ${path}")
                }
            }
        } finally {
            zip.close()
        }
        File smokeRoot = layout.buildDirectory.dir(
                'source-archive-smoke').get().asFile
        delete smokeRoot
        copy {
            from zipTree(coordinationSourceArchive.get()
                    .archiveFile.get().asFile)
            into smokeRoot
        }
        File extracted = new File(
                smokeRoot, "blue-coordination-java-${version}")
        if (!new File(extracted, '.cz.toml').isFile()) {
            throw new GradleException(
                    'Extracted source archive is missing .cz.toml')
        }
        def forbidden = fileTree(extracted) {
            include '**/*.zip', '**/__MACOSX/**', '**/._*',
                    '**/.DS_Store', '**/build/**'
        }.files
        if (!forbidden.empty) {
            throw new GradleException(
                    "Forbidden source-archive entries: ${forbidden}")
        }
        boolean windows = System.getProperty('os.name').toLowerCase(
                java.util.Locale.ROOT).contains('windows')
        File wrapper = new File(extracted, windows ? 'gradlew.bat' : 'gradlew')
        if (!windows && !wrapper.canExecute()) {
            throw new GradleException(
                    'Extracted source archive gradlew is not executable')
        }
        List<String> command = windows
                ? ['cmd', '/d', '/c', wrapper.absolutePath]
                : [wrapper.absolutePath]
        List<String> focusedTasks = [
                'clean',
                'test',
                'verifyActiveDependencyLane',
                'dependencyPreflight',
                'verifyDependencyModeIsolation'
        ]
        List<String> focusedTests = [
                'blue.coordination.sdk.SdkCanonicalRetainedManagedEpochScenarioTest',
                'blue.coordination.internal.ManagedSameStateEpochPublicationTest',
                'blue.coordination.sdk.SdkManagedDraftAcceptanceTest',
                'blue.coordination.sdk.SdkManagedEpochCycleAcceptanceTest'
        ]
        command.addAll([
                '--no-daemon', '--no-build-cache', '--max-workers=1'
        ])
        command.addAll(['clean', 'test'])
        focusedTests.each { focusedTest ->
            command.addAll(['--tests', focusedTest])
        }
        command.addAll(focusedTasks.drop(2))
        command.add(
                '-PtestJavaVersion=' + providers.gradleProperty(
                        'testJavaVersion').getOrElse('17'))
        if (immutableStagedContracts) {
            command.addAll([
                    '-PblueDependencyMode=immutable-staged-contracts',
                    '-PblueContractsVersion=' +
                            immutableStagedLanguageVersion,
                    '-PblueContractsRepository=' +
                            file(stagedContractsRepositoryValue).canonicalPath,
                    '-PblueContractsManifestSha256=' +
                            stagedContractsManifestIdentity
            ])
        } else {
            command.addAll([
                    '-PblueDependencyMode=published-artifact'
            ])
        }
        Process process = new ProcessBuilder(command)
                .directory(extracted).redirectErrorStream(true).start()
        process.inputStream.eachLine { logger.lifecycle(it) }
        if (process.waitFor() != 0) {
            throw new GradleException(
                    'Extracted source archive smoke build failed')
        }
        File sidecar = new File(
                sourceArchive.parentFile, sourceArchive.name + '.sha256')
        String archiveHash = java.security.MessageDigest
                .getInstance('SHA-256').digest(sourceArchive.bytes)
                .encodeHex().toString()
        if (!sidecar.isFile() || !sidecar.getText('UTF-8')
                .startsWith(archiveHash + '  ' + sourceArchive.name)) {
            throw new GradleException(
                    'Extracted source archive detached checksum differs')
        }
        File receipt = verificationReceipt.get().asFile
        receipt.parentFile.mkdirs()
        def receiptValue = [
                schemaId: 'blue-coordination-contracts10-source-archive-verification-v2',
                archiveName: sourceArchive.name,
                archiveSha256: archiveHash,
                checksumMode: 'DETACHED_SHA256_SIDECAR',
                checksumPath: rootDir.toPath().relativize(
                        sidecar.toPath()).toString().replace('\\', '/'),
                dependencyMode: dependencyMode,
                contractsManifestSha256: immutableStagedContracts
                        ? stagedContractsManifestIdentity : null,
                java: providers.gradleProperty(
                        'testJavaVersion').getOrElse('17'),
                extractedConfiguration: 'PASS',
                compileStatus: 'PASS',
                dependencyIsolationStatus: 'PASS',
                focusedTestsStatus: 'PASS',
                focusedTasks: focusedTasks,
                focusedTests: focusedTests
        ]
        receipt.setText(groovy.json.JsonOutput.prettyPrint(
                groovy.json.JsonOutput.toJson(receiptValue)) + '\n',
                'UTF-8')
    }
}

tasks.register('verifyDependencyModeIsolation') {
    group = 'verification'
    description = 'Proves published and manifest-pinned Contracts lanes are explicit and isolated.'
    inputs.files('settings.gradle', 'build.gradle')
    doLast {
        String settings = file('settings.gradle').getText('UTF-8')
        String buildScript = file('build.gradle').getText('UTF-8')
        if (settings.contains('ProcessBuilder') || settings.contains("'git'")) {
            throw new GradleException(
                    'Ordinary settings must not execute Git')
        }
        if (!settings.contains(".getOrElse('published-artifact')")
                || !buildScript.contains(
                ".getOrElse('published-artifact')")) {
            throw new GradleException(
                    'Published artifacts must remain the default dependency mode')
        }
        def forbiddenLivePlumbing = [
                'include' + 'Build(',
                'dependency' + 'Substitution {',
                'maven' + 'Local()',
                'flat' + 'Dir {'
        ]
        def leaked = forbiddenLivePlumbing.findAll { token ->
            settings.contains(token) || buildScript.contains(token)
        }
        if (!leaked.empty) {
            throw new GradleException(
                    'Implicit dependency plumbing remains: ' + leaked)
        }
        def requiredStagedEvidence = [
                "'immutable-staged-contracts'",
                "'blueContractsRepository'",
                "'blueContractsManifestSha256'",
                "'artifact-manifest.json'",
                "'artifact-manifest.json.sha256'"
        ]
        if (requiredStagedEvidence.any { token ->
            !settings.contains(token) || !buildScript.contains(token)
        }) {
            throw new GradleException(
                    'Manifest-pinned Contracts dependency configuration is incomplete')
        }
        if (!buildScript.contains('exclusiveContent {')
                || !buildScript.contains("includeGroup 'blue.language'")
                || !buildScript.contains(
                "name = 'immutableStagedContracts'")) {
            throw new GradleException(
                    'The staged blue.language group is not repository-exclusive')
        }
        def legacyProperties = [
                'blueLanguageCompositePath',
                'blueBexCompositePath',
                'blueRepositoryCompositePath',
                'blueStagingRepository',
                'bluePublishedRepository'
        ]
        if (legacyProperties.any { property ->
            !settings.contains("'${property}'")
        } || !settings.contains('forbiddenDependencyProperties')) {
            throw new GradleException(
                    'Retired dependency properties are not rejected fail-closed')
        }
    }
}

def publishedDependencyIsolation = tasks.register(
        'verifyPublishedDependencyIsolation') {
    group = 'verification'
    description = 'Resolves the explicit published-artifact graph without included-build substitution.'
    doLast {
        if (dependencyMode != 'published-artifact') {
            throw new GradleException(
                    'verifyPublishedDependencyIsolation requires '
                            + '-PblueDependencyMode=published-artifact')
        }
        def components = configurations.testRuntimeClasspath
                .incoming.resolutionResult.allComponents
        def leakedProjects = components.findAll { component ->
            component.id instanceof
                    org.gradle.api.artifacts.component.ProjectComponentIdentifier
                    && component.id.displayName
                    != "root project '${rootProject.name}'"
        }.collect { component -> component.id.displayName }.sort()
        def selectedBlue = components.findAll { component ->
            component.id instanceof
                    org.gradle.api.artifacts.component.ModuleComponentIdentifier
                    && ['blue.language', 'blue.bex', 'blue.repo'].contains(
                    component.id.group)
        }.collectEntries { component ->
            [(component.id.group + ':' + component.id.module):
                     component.id.version]
        }
        if (!leakedProjects.empty || selectedBlue != publishedBlueCoordinates) {
            throw new GradleException(
                    'Published dependency isolation failed: included projects '
                            + leakedProjects + ', selected modules '
                            + selectedBlue)
        }
        logger.lifecycle(
                'Published dependency lane resolved without sibling substitution.')
    }
}

tasks.register('verifyPublishedArtifactDependencies') {
    group = 'verification'
    description = 'Compiles against the explicit isolated published-artifact graph.'
    if (dependencyMode == 'published-artifact') {
        dependsOn publishedDependencyIsolation, tasks.named('compileJava')
    }
    doLast {
        if (dependencyMode != 'published-artifact') {
            throw new GradleException(
                    'verifyPublishedArtifactDependencies requires '
                            + '-PblueDependencyMode=published-artifact')
        }
        logger.lifecycle(
                'Published dependencies resolve in isolation and provide the required source API.')
    }
}

def immutableStagedContractsDependencies = tasks.register(
        'verifyImmutableStagedContractsDependencies') {
    group = 'verification'
    description = 'Compiles against the manifest-pinned Contracts graph and verifies resolved JAR bytes.'
    if (immutableStagedContracts) {
        dependsOn immutableStagedContractsRepository,
                tasks.named('compileJava')
    }
    doLast {
        if (!immutableStagedContracts) {
            throw new GradleException(
                    'verifyImmutableStagedContractsDependencies requires '
                            + '-PblueDependencyMode=immutable-staged-contracts')
        }
        def manifest = inspectImmutableStagedContractsRepository()
        def failures = []
        def components = configurations.runtimeClasspath
                .incoming.resolutionResult.allComponents
        def leakedProjects = components.findAll { component ->
            component.id instanceof
                    org.gradle.api.artifacts.component.ProjectComponentIdentifier
                    && component.id.displayName
                    != "root project '${rootProject.name}'"
        }.collect { component -> component.id.displayName }.sort()
        if (!leakedProjects.empty || !gradle.includedBuilds.empty) {
            failures << ('project/composite substitution leaked into staged '
                    + 'Contracts mode: ' + leakedProjects
                    + gradle.includedBuilds.collect { it.name }.sort())
        }
        def selectedBlue = components.findAll { component ->
            component.id instanceof
                    org.gradle.api.artifacts.component.ModuleComponentIdentifier
                    && ['blue.language', 'blue.bex', 'blue.repo'].contains(
                    component.id.group)
        }.collectEntries { component ->
            [(component.id.group + ':' + component.id.module):
                     component.id.version]
        }
        if (selectedBlue != immutableStagedBlueCoordinates) {
            failures << ('selected Blue graph differs from exact pins: '
                    + selectedBlue)
        }
        def manifestRuntimeIdentities = manifest.artifacts.findAll { record ->
            record.kind == 'runtime'
        }.collectEntries { record ->
            [(record.coordinate): record.sha256]
        }
        def resolvedLanguageArtifacts = configurations.runtimeClasspath
                .resolvedConfiguration.resolvedArtifacts.findAll { artifact ->
            artifact.moduleVersion.id.group == 'blue.language'
        }
        def expectedLanguageCoordinates = immutableStagedBlueCoordinates.findAll {
            coordinate, ignored -> coordinate.startsWith('blue.language:')
        }.collectEntries { coordinate, expectedVersion ->
            [(coordinate + ':' + expectedVersion):
                     manifestRuntimeIdentities[
                             coordinate + ':' + expectedVersion]]
        }
        def resolvedLanguageIdentities = resolvedLanguageArtifacts
                .collectEntries { artifact ->
            String coordinate = artifact.moduleVersion.id.group + ':' +
                    artifact.name + ':' + artifact.moduleVersion.id.version
            [(coordinate): sha256Identity(artifact.file)]
        }
        if (expectedLanguageCoordinates.any { coordinate, identity ->
            identity == null
        }) {
            failures << 'staged manifest does not bind every selected Language runtime'
        }
        if (resolvedLanguageIdentities != expectedLanguageCoordinates) {
            failures << ('resolved Language artifact bytes differ from '
                    + 'the staged manifest: ' + resolvedLanguageIdentities)
        }
        if (!failures.empty) {
            throw new GradleException(
                    'Immutable staged Contracts dependency graph failed:\n - '
                            + failures.join('\n - '))
        }
        logger.lifecycle(
                'Manifest-pinned Contracts dependencies resolved without fallback: {}',
                stagedContractsManifestIdentity)
    }
}

def activeDependencyLane = tasks.register('verifyActiveDependencyLane') {
    group = 'verification'
    description = 'Verifies the dependency lane selected for this invocation.'
    if (immutableStagedContracts) {
        dependsOn immutableStagedContractsDependencies
    } else {
        dependsOn tasks.named('verifyPublishedArtifactDependencies')
    }
}

tasks.register('verifyTestArchitecture') {
    group = 'verification'
    description = 'Protects test shape, suite isolation, and the JAR-only consumer boundary.'
    def supportSources = fileTree('src/testSupport/java') {
        include '**/*.java'
    }
    def suites = [
            unit: fileTree('src/test/java') { include '**/*Test.java' },
            integration: fileTree('src/integrationTest/java') {
                include '**/*Test.java'
            },
            consumer: fileTree('src/consumerTest/java') {
                include '**/*Test.java'
            },
            scenario: fileTree('src/scenarioTest/java') {
                include '**/*Test.java'
            }
    ]
    inputs.files(suites.values(), supportSources)
    inputs.file('build.gradle')
    dependsOn tasks.named('jar')
    doLast {
        def minimumTests = [unit: 175, integration: 24,
                            consumer: 6, scenario: 2]
        def failures = []
        suites.each { name, sources ->
            int methods = sources.files.sum { source ->
                (source.getText('UTF-8') =~ /(?m)^[ \t]*@Test\b/).count
            } ?: 0
            if (methods < minimumTests[name]) {
                failures << "${name} has ${methods} @Test methods; "
                        + "minimum is ${minimumTests[name]}"
            }
            logger.lifecycle(
                    "${name} tests: ${sources.files.size()} classes, "
                            + "${methods} methods")
            sources.files.sort().each { source ->
                String body = source.getText('UTF-8')
                def tests = body =~ /(?m)^[ \t]*@Test\b/
                def starts = []
                while (tests.find()) {
                    starts << tests.start()
                }
                starts.eachWithIndex { start, index ->
                    int annotationLineEnd = body.indexOf('\n', start)
                    if (annotationLineEnd < 0) {
                        annotationLineEnd = body.length()
                    }
                    String annotationLine = body.substring(
                            start, annotationLineEnd)
                    def indentMatch = annotationLine =~ /^(\s*)@Test\b/
                    if (!indentMatch.find()) {
                        failures << "${source}: test ${index + 1} has an " +
                                'unreadable @Test annotation line'
                        return
                    }
                    String closePattern = ('(?m)^'
                            + java.util.regex.Pattern.quote(
                                    indentMatch.group(1))
                            + '\\}\\s*$')
                    def methodClose = body.substring(start) =~ closePattern
                    if (!methodClose.find()) {
                        failures << "${source}: test ${index + 1} has no " +
                                'matching method close'
                        return
                    }
                    int end = start + methodClose.end()
                    String testBody = body.substring(start, end)
                    def markerRanges = [:]
                    ['given', 'when', 'then'].each { phase ->
                        def marker = testBody =~
                                /(?m)^\s*\/\/ ${phase}\s*$/
                        def ranges = []
                        while (marker.find()) {
                            ranges << [start: marker.start(), end: marker.end()]
                        }
                        markerRanges[phase] = ranges
                    }
                    if (markerRanges.any { phase, ranges ->
                        ranges.size() != 1
                    }) {
                        failures << ("${source}: test ${index + 1} must "
                                + 'contain exactly one // given, // when, '
                                + '// then marker')
                    } else if (!(markerRanges.given[0].start
                            < markerRanges.when[0].start
                            && markerRanges.when[0].start
                            < markerRanges.then[0].start)) {
                        failures << ("${source}: test ${index + 1} must order "
                                + '// given before // when before // then')
                    } else {
                        Closure<Boolean> hasCode = { String phaseBody ->
                            phaseBody.readLines().any { line ->
                                String trimmed = line.trim()
                                !trimmed.isEmpty()
                                        && !trimmed.startsWith('//')
                                        && !trimmed.startsWith('/*')
                                        && !trimmed.startsWith('*')
                                        && !['{', '}'].contains(trimmed)
                            }
                        }
                        String givenBody = testBody.substring(
                                markerRanges.given[0].end,
                                markerRanges.when[0].start)
                        String whenBody = testBody.substring(
                                markerRanges.when[0].end,
                                markerRanges.then[0].start)
                        String thenBody = testBody.substring(
                                markerRanges.then[0].end)
                        if (!hasCode(givenBody)
                                || !hasCode(whenBody)
                                || !hasCode(thenBody)) {
                            failures << ("${source}: test ${index + 1} must "
                                    + 'contain meaningful given, when, and '
                                    + 'then phases')
                        }
                    }
                }
            }
        }

        String integrationSources = fileTree('src/integrationTest/java') {
            include '**/*.java'
        }.files.collect { it.getText('UTF-8') }.join('\n')
        ['BasicTestMetrics', 'RuntimeComparisonWriter', 'LatencySeries']
                .each { historical ->
                    if (integrationSources.contains(historical)) {
                        failures << "release tests depend on historical metric "
                                + "support ${historical}"
                    }
                }
        if (integrationSources.contains('blue.coordination.basic')) {
            failures << 'release tests retain the historical basic package'
        }
        if (supportSources.files.any { source ->
            source.getText('UTF-8') =~ /(?m)^[ \t]*@Test\b/
        }) {
            failures << 'testSupport must contain helpers, not executable tests'
        }

        fileTree('src/consumerTest/java') { include '**/*.java' }
                .each { source ->
                    String body = source.getText('UTF-8')
                    ['blue.coordination.internal',
                     'blue.coordination.processor',
                     'blue.coordination.integration']
                            .each { forbidden ->
                                if (body.contains(forbidden)) {
                                    failures << "consumer imports ${forbidden}: "
                                            + source
                                }
                            }
                }
        File sdkConsumer = file(
                'src/consumerTest/java/blue/coordination/consumer/'
                        + 'SdkBuiltJarConsumerTest.java')
        if (!sdkConsumer.isFile()) {
            failures << 'SDK built-JAR consumer test is missing'
        } else {
            String body = sdkConsumer.getText('UTF-8')
            [
                    'blue.coordination.api',
                    'blue.coordination.internal',
                    'blue.coordination.processor',
                    'blue.language',
                    'blue.bex'
            ].each { forbidden ->
                if (body.contains(forbidden)) {
                    failures << "SDK built-JAR consumer imports ${forbidden}"
                }
            }
            if (!body.contains('blue.coordination.sdk.BlueCoordination')) {
                failures << 'SDK built-JAR consumer does not use BlueCoordination'
            }
        }
        Set<File> consumerClasspath = sourceSets.consumerTest
                .compileClasspath.files.collect { it.canonicalFile } as Set
        Set<File> forbiddenConsumerOutputs = [
                sourceSets.main,
                sourceSets.testFixtures,
                sourceSets.testSupport,
                sourceSets.test,
                sourceSets.integrationTest,
                sourceSets.scenarioTest
        ].collectMany { sourceSet ->
            sourceSet.output.files.collect { it.canonicalFile }
        } as Set
        if (!forbiddenConsumerOutputs.intersect(consumerClasspath).empty) {
            failures << 'consumer compile classpath contains project class outputs'
        }
        File mainJar = tasks.named('jar').get().archiveFile.get().asFile
                .canonicalFile
        if (!consumerClasspath.contains(mainJar)) {
            failures << 'consumer compile classpath does not contain the built JAR'
        }
        Set<File> scenarioCompileClasspath = sourceSets.scenarioTest
                .compileClasspath.files.collect { it.canonicalFile } as Set
        Set<File> scenarioRuntimeClasspath = sourceSets.scenarioTest
                .runtimeClasspath.files.collect { it.canonicalFile } as Set
        Set<File> integrationClassDirs = sourceSets.integrationTest.output
                .classesDirs.files.collect { it.canonicalFile } as Set
        if (!integrationClassDirs.intersect(scenarioCompileClasspath).empty
                || !integrationClassDirs.intersect(
                scenarioRuntimeClasspath).empty) {
            failures << 'scenario classpath contains integration test output'
        }
        Set<File> supportClassDirs = sourceSets.testSupport.output
                .classesDirs.files.collect { it.canonicalFile } as Set
        if (!scenarioCompileClasspath.containsAll(supportClassDirs)
                || !scenarioRuntimeClasspath.containsAll(supportClassDirs)) {
            failures << 'scenario classpath lacks private testSupport output'
        }
        String historicalProject = '../blue-' + 'basic'
        if (file('build.gradle').getText('UTF-8').contains(
                historicalProject)) {
            failures << "release build depends on ${historicalProject}"
        }
        if (!failures.empty) {
            throw new GradleException(failures.join('; '))
        }
    }
}

tasks.register('productionizationCheck') {
    group = 'verification'
    dependsOn 'build', 'validateProductionShape',
            'verifyPublicApiBoundary', 'verifySdkPublicApiBoundary',
            'verifyArtifactContents',
            'verifyPublicationPom', 'verifyDependencyModeIsolation',
            'verifyReleaseMetadata', 'verifyDocumentation',
            'verifySourceArchiveHygiene', 'scenarioTest',
            'verifyTestArchitecture', extractedSourceArchive
}

tasks.register('releaseCheck') {
    group = 'verification'
    description = 'Runs the production, API, artifact, and publication gates.'
    dependsOn 'build', 'validateProductionShape', 'verifyPublicApiBoundary',
            'verifySdkPublicApiBoundary', 'verifyArtifactContents',
            'verifyPublicationPom',
            'verifyDependencyModeIsolation', 'verifyReleaseMetadata',
            'verifyDocumentation', 'verifySourceArchiveHygiene', 'test',
            'integrationTest', 'consumerTest', 'scenarioTest',
            'verifyTestArchitecture', extractedSourceArchive
}

def rcReadiness = tasks.register('verifyRcReadiness') {
    group = 'verification'
    description = 'Runs the published-dependency gate for the bounded external-pilot RC.'
    inputs.files('.cz.toml', 'settings.gradle', 'build.gradle',
            'gradle/published-artifact.lockfile',
            'dynamic-evolution-coordination-handoff-receipt.json',
            'docs/releases/3.0.0-rc.4.md')
    def rcTestSources = files(
            fileTree('src/test/java') { include '**/*Test.java' },
            fileTree('src/testSupport/java') { include '**/*.java' },
            fileTree('src/integrationTest/java') {
                include '**/*Test.java'
            },
            fileTree('src/consumerTest/java') { include '**/*Test.java' },
            fileTree('src/consumerTest/resources'),
            fileTree('src/scenarioTest/java') { include '**/*Test.java' })
    inputs.files(rcTestSources)
    inputs.files(tasks.named('jar').flatMap { it.archiveFile },
            tasks.named('sourcesJar').flatMap { it.archiveFile },
            tasks.named('javadocJar').flatMap { it.archiveFile },
            tasks.named('testFixturesJar').flatMap { it.archiveFile })
    dependsOn 'releaseCheck', 'dependencyPreflight',
            'jar', 'sourcesJar', 'javadocJar', 'testFixturesJar'
    def readinessReport = layout.buildDirectory.file(
            'reports/release/3.0.0-rc.4-readiness.json')
    outputs.file(readinessReport)
    doLast {
        def failures = []
        if (version.toString() != '3.0.0-rc.4') {
            failures << "release version is ${version}; expected 3.0.0-rc.4"
        }
        if (dependencyMode != 'published-artifact') {
            failures << 'published-artifact is not the active dependency mode'
        }
        if (!gradle.includedBuilds.empty) {
            failures << ('included builds leaked into the release: '
                    + gradle.includedBuilds.collect { it.name }.sort())
        }

        String lock = file('gradle/published-artifact.lockfile')
                .getText('UTF-8')
        publishedBlueCoordinates.each { coordinate, expectedVersion ->
            if (!lock.contains("${coordinate}:${expectedVersion}=")) {
                failures << "dependency lock does not pin ${coordinate}:${expectedVersion}"
            }
        }

        def semanticReceipt = new groovy.json.JsonSlurper().parse(
                file('dynamic-evolution-coordination-handoff-receipt.json'))
        def requiredCapabilities = [
                'automaticManagedOccurrenceResolutionSupported',
                'automaticCurrentExactStateResolutionSupported',
                'automaticNewAuthoredInitialDocumentResolutionSupported',
                'typedResourceDemandRetrySupported',
                'suspensionIsNonPublishing',
                'atomicManagedPublicationSupported',
                'activePathRebindSupported',
                'dynamicCycleFormationAndDissolutionSupported',
                'runtimeGeneralizationSupported',
                'typedDocumentTransitionEvidenceSupported',
                'typedOperationRouteDeltaEvidenceSupported'
        ]
        def retainedLimitations = [
                'existingSessionAuthoredInitialAttachmentSupported',
                'historicalRetainedEpochCatchUpSupported',
                'timelineImportAndCompletenessSupported',
                'mandatesSupported',
                'multiNodeDurabilitySupported',
                'productionReady',
                'published',
                'deployed'
        ]
        def java17 = semanticReceipt.verification?.java17
        def java21 = semanticReceipt.verification?.java21
        if (semanticReceipt.schema
                != 'blue.coordination/dynamic-evolution-handoff-receipt/v1'
                || semanticReceipt.status != 'PASS'
                || semanticReceipt.sourceBinding
                        ?.semanticSourceUnderTestCommit
                        != '612f864ec7101bcac5a0cc596ad6b6f11cd10c98'
                || requiredCapabilities.any {
                    (semanticReceipt.capabilities ?: [:])[it] != true
                }
                || retainedLimitations.any {
                    (semanticReceipt.capabilities ?: [:])[it] != false
                }
                || [java17, java21].any { lane ->
                    lane?.status != 'PASS'
                            || lane?.failures != 0
                            || lane?.errors != 0
                            || lane?.skipped != 0
                }
                || semanticReceipt.immutableStage?.published != false) {
            failures << 'retained dynamic-evolution evidence does not authorize the bounded pilot tier'
        }
        String releaseNotes = file('docs/releases/3.0.0-rc.4.md')
                .getText('UTF-8')
        if (!releaseNotes.contains(
                'RC4_RELEASE_TIER: BOUNDED_EXTERNAL_PILOT')
                || !releaseNotes.contains(
                'RC4_DEPENDENCY_MODE: PUBLISHED_ARTIFACTS_ONLY')
                || !releaseNotes.contains(
                'RC4_PUBLIC_ARTIFACT_READY: true')
                || !releaseNotes.contains(
                'RC4_PRODUCTION_READY: false')) {
            failures << 'rc.4 release notes do not state the exact release tier'
        }

        if (System.getenv('CI') != null) {
            Process statusProcess = new ProcessBuilder(
                    'git', 'status', '--porcelain',
                    '--untracked-files=normal').directory(rootDir).start()
            String status = statusProcess.inputStream.getText('UTF-8').trim()
            String error = statusProcess.errorStream.getText('UTF-8').trim()
            if (statusProcess.waitFor() != 0) {
                failures << "cannot inspect release worktree: ${error}"
            } else if (!status.isEmpty()) {
                failures << 'CI release worktree is not clean'
            }
        }

        if (!failures.empty) {
            throw new GradleException(
                    'RC readiness failed:\n - ' + failures.join('\n - '))
        }

        Closure<String> sha256 = { File artifact ->
            java.security.MessageDigest.getInstance('SHA-256')
                    .digest(artifact.bytes).encodeHex().toString()
        }
        def artifacts = [
                mainJar: tasks.named('jar').get().archiveFile.get().asFile,
                sourcesJar: tasks.named('sourcesJar').get()
                        .archiveFile.get().asFile,
                javadocJar: tasks.named('javadocJar').get()
                        .archiveFile.get().asFile,
                testFixturesJar: tasks.named('testFixturesJar').get()
                        .archiveFile.get().asFile
        ]
        long testMethods = rcTestSources.files.sum { source ->
            (source.getText('UTF-8') =~ /(?m)^\s*@Test\b/).count
        } ?: 0L
        File report = readinessReport.get().asFile
        report.parentFile.mkdirs()
        report.setText(groovy.json.JsonOutput.prettyPrint(
                groovy.json.JsonOutput.toJson([
                        schemaId: 'blue-coordination-rc-readiness-v1',
                        release: version.toString(),
                        status: 'PASS_FOR_BOUNDED_EXTERNAL_PILOT',
                        dependencyMode: dependencyMode,
                        dependencies: publishedBlueCoordinates,
                        testMethods: testMethods,
                        semanticEvidence:
                                'dynamic-evolution-coordination-handoff-receipt.json',
                        publicArtifactReady: true,
                        productionReady: false,
                        stableLatencySlaClaimed: false,
                        artifacts: artifacts.collectEntries { name, artifact ->
                            [(name): [
                                    file: artifact.name,
                                    sha256: sha256(artifact)
                            ]]
                        }
                ])) + '\n', 'UTF-8')
    }
}

tasks.register('stageRelease') {
    group = 'publishing'
    description = 'Builds the verified Maven Central staging repository.'
    dependsOn(version.toString() == '3.0.0-rc.4'
            ? rcReadiness
            : tasks.named('releaseCheck'))
    dependsOn 'dependencyPreflight',
            'publishMavenJavaPublicationToStagingRepository'
    doFirst {
        if (dependencyMode != 'published-artifact') {
            throw new GradleException(
                    'stageRelease requires the explicit isolated lane: '
                            + '-PblueDependencyMode=published-artifact')
        }
    }
}

tasks.named('publishMavenJavaPublicationToStagingRepository') {
    dependsOn(version.toString() == '3.0.0-rc.4'
            ? rcReadiness
            : tasks.named('releaseCheck'))
    dependsOn 'dependencyPreflight'
}

tasks.named('releaseCheck') {
    dependsOn activeDependencyLane
}
tasks.named('productionizationCheck') {
    dependsOn activeDependencyLane
}

tasks.matching {
    it.name in ['jreleaserDeploy',
                'jreleaserUpload', 'jreleaserRelease']
}.configureEach {
    dependsOn tasks.named('stageRelease')
}

tasks.named('check') {
    dependsOn 'validateProductionShape', 'verifyPublicApiBoundary',
            'verifySdkPublicApiBoundary',
            'verifyArtifactContents', 'integrationTest', 'consumerTest',
            'verifyTestArchitecture'
}

apply from: 'gradle/coordination-staging.gradle'
