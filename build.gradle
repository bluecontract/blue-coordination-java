plugins {
    id 'java-library'
    id 'java-test-fixtures'
    id 'maven-publish'
    id 'signing'
    id 'org.jreleaser' version '1.25.0'
}

group = 'blue.coordination'
def versionMatches = file('.cz.toml').getText('UTF-8') =~
        /(?m)^version = "([^"]+)"$/
if (!versionMatches.find()) {
    throw new GradleException('Missing version in .cz.toml')
}
version = versionMatches.group(1)

def dependencyMode = providers.gradleProperty('blueDependencyMode')
        .getOrElse('local-composite')
        .trim()
def localDependencies = dependencyMode == 'local-composite'
def publishedRepository = providers.gradleProperty(
        'bluePublishedRepository').orNull

base {
    archivesName = 'blue-coordination-java'
}

repositories {
    if (!localDependencies && publishedRepository != null) {
        exclusiveContent {
            forRepository {
                maven {
                    name = 'publishedBlueRepository'
                    url = uri(publishedRepository)
                    metadataSources { artifact() }
                }
            }
            filter {
                includeModule 'blue.repo', 'blue-repo-java'
                includeModule 'blue.bex', 'blue-bex-core'
                includeModule 'blue.bex', 'blue-bex-contracts'
            }
        }
    }
    mavenCentral()
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
    withSourcesJar()
    withJavadocJar()
}

sourceSets {
    integrationTest
    scenarioTest {
        resources.setSrcDirs(['src/integrationTest/resources'])
    }
    consumerTest {
        resources.setSrcDirs(['src/integrationTest/resources'])
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
    scenarioTestImplementation.extendsFrom testImplementation
    scenarioTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencyLocking {
    lockAllConfigurations()
    if (!localDependencies) {
        lockFile = layout.projectDirectory.file(
                'gradle/published-artifact.lockfile')
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.compilerArgs.addAll([
            '-Xlint:all',
            '-Xlint:-serial',
            '-Xlint:-processing',
            '-Werror'
    ])
}

tasks.withType(Javadoc).configureEach {
    source = fileTree('src/main/java') {
        include 'blue/coordination/api/**/*.java'
        include 'blue/coordination/processor/**/*.java'
    }
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.docEncoding = 'UTF-8'
    options.addBooleanOption('notimestamp', true)
    options.addBooleanOption('Xdoclint:all,-missing', true)
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.withType(Jar).configureEach {
    from('LICENSE') { into 'META-INF' }
}

dependencies {
    api 'blue.language:blue-contracts-core:3.1.0-rc.20'
    implementation 'blue.repo:blue-repo-java:3.0.0-rc.19'
    implementation 'blue.bex:blue-bex-core:1.1.0-rc.3'
    implementation 'blue.bex:blue-bex-contracts:1.1.0-rc.3'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'

    testImplementation platform('org.junit:junit-bom:5.14.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    integrationTestImplementation sourceSets.main.output
    integrationTestImplementation sourceSets.testFixtures.output

    scenarioTestImplementation sourceSets.main.output
    scenarioTestImplementation sourceSets.testFixtures.output
    scenarioTestImplementation sourceSets.integrationTest.output

    consumerTestImplementation files(tasks.named('jar'))
    consumerTestImplementation 'blue.language:blue-contracts-core:3.1.0-rc.20'
    consumerTestImplementation platform('org.junit:junit-bom:5.14.1')
    consumerTestImplementation 'org.junit.jupiter:junit-jupiter'
    consumerTestRuntimeOnly files(configurations.runtimeClasspath)
    consumerTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

components.java.withVariantsFromConfiguration(
        configurations.testFixturesApiElements) { skip() }
components.java.withVariantsFromConfiguration(
        configurations.testFixturesRuntimeElements) { skip() }

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(
                providers.gradleProperty('testJavaVersion')
                        .getOrElse('17') as int)
    }
    maxParallelForks = 1
    maxHeapSize = '2g'
    reports {
        junitXml.required = true
        html.required = true
    }
}

def registerVerificationSuite = {
        String taskName, SourceSet suite, String taskDescription ->
    tasks.register(taskName, Test) {
        group = 'verification'
        description = taskDescription
        testClassesDirs = suite.output.classesDirs
        classpath = suite.runtimeClasspath
        dependsOn tasks.named(suite.classesTaskName)
        shouldRunAfter tasks.named('test')
    }
}

def integrationTest = registerVerificationSuite(
        'integrationTest', sourceSets.integrationTest,
        'Runs the complete compact-engine correctness and atomicity suite.')
def consumerTest = registerVerificationSuite(
        'consumerTest', sourceSets.consumerTest,
        'Runs public-API scenarios compiled against the built JAR only.')
def scenarioTest = registerVerificationSuite(
        'scenarioTest', sourceSets.scenarioTest,
        'Runs realistic NBA and large-host/PayNote convergence scenarios.')
scenarioTest.configure {
    shouldRunAfter integrationTest, consumerTest
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifact tasks.named('testFixturesJar')
            pom {
                name = 'Blue Coordination Java'
                description = 'Deterministic whole-object document coordination runtime.'
                url = 'https://github.com/bluecontract/blue-contract-java'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/license/mit'
                    }
                }
                developers {
                    developer {
                        name = 'Blue'
                        email = 'devsupport@timeline.blue'
                        organization = 'Blue Company'
                    }
                }
                scm {
                    url = 'https://github.com/bluecontract/blue-contract-java'
                    connection = 'scm:git:https://github.com/bluecontract/blue-contract-java.git'
                    developerConnection = 'scm:git:ssh://git@github.com/bluecontract/blue-contract-java.git'
                }
                issueManagement {
                    system = 'GitHub Issues'
                    url = 'https://github.com/bluecontract/blue-contract-java/issues'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'staging'
            url = layout.buildDirectory.dir('staging-deploy')
        }
    }
}

tasks.named('jar') {
    manifest {
        attributes(
                'Automatic-Module-Name': 'blue.coordination',
                'Implementation-Title': 'Blue Coordination Java',
                'Implementation-Version': project.version,
                'Implementation-Vendor': 'Blue Company')
    }
}

signing {
    def signingKey = providers.gradleProperty('signingKey').orNull
    def signingPassword = providers.gradleProperty(
            'signingPassword').orNull
    required = { signingKey != null }
    if (signingKey != null) {
        useInMemoryPgpKeys(signingKey, signingPassword)
    }
    sign publishing.publications.mavenJava
}

if (System.getenv('CI') != null) {
    jreleaser {
        strict = true
        signing {
            pgp {
                active = 'ALWAYS'
                armored = true
            }
        }
        project {
            description = 'Deterministic whole-object document coordination runtime.'
            copyright = 'Copyright 2026 Blue Company. Licensed under the MIT License'
            languages {
                java {
                    version = '17'
                }
            }
        }
        deploy {
            maven {
                mavenCentral {
                    sonatype {
                        active = 'RELEASE'
                        url = 'https://central.sonatype.com/api/v1/publisher'
                        applyMavenCentralRules = true
                        snapshotSupported = false
                        stagingRepository('build/staging-deploy')
                    }
                }
            }
        }
    }
}

def productionSources = fileTree('src/main/java') { include '**/*.java' }
def forbiddenArchitectureTokens = [
        'AutonomousLink', 'TemporalWave', 'ConsistencyMode',
        'ObservingLink', 'CoherentLink', 'SccScheduler',
        'SCCScheduler', 'WeakComponentPlanner'
]

tasks.register('validateProductionShape') {
    group = 'verification'
    description = 'Enforces the production class, line, API, and architecture budgets.'
    inputs.files(productionSources)
    doLast {
        def sources = productionSources.files.sort()
        int classes = sources.size()
        long lines = sources.sum { it.readLines('UTF-8').size() } ?: 0L
        def apiSources = fileTree('src/main/java/blue/coordination/api') {
            include '**/*.java'
        }.files
        def failures = []
        if (classes > 115) failures << "production classes ${classes} > 115"
        // Round 11B adds one canonical source-surface identity helper. Keep
        // the narrowly revised budget explicit rather than minifying it.
        if (lines > 25_700L) failures << "production lines ${lines} > 25700"
        if (apiSources.size() > 16) {
            failures << "public API types ${apiSources.size()} > 16"
        }
        ['engine', 'fastpath'].each { legacy ->
            if (file("src/main/java/blue/coordination/${legacy}").exists()) {
                failures << "legacy package remains: ${legacy}"
            }
        }
        sources.each { source ->
            String relative = projectDir.toPath().relativize(
                    source.toPath()).toString().replace('\\', '/')
            String body = source.getText('UTF-8')
            if (relative.contains('/basic/') || relative.contains('/test/')) {
                failures << "test-named production package: ${relative}"
            }
            if (source.name.contains('Basic') || source.name.contains('Test')) {
                failures << "test-named production type: ${relative}"
            }
            if (body.contains('org.junit')
                    || body.contains('CoordinationDocumentSplitter')) {
                failures << "test or splitter dependency in ${relative}"
            }
            forbiddenArchitectureTokens.each { token ->
                if (body.contains(token)) {
                    failures << "forbidden architecture token ${token} in ${relative}"
                }
            }
        }
        fileTree('src/main/resources').files.each { resource ->
            String body = resource.getText('UTF-8')
            forbiddenArchitectureTokens.each { token ->
                if (body.contains(token)) {
                    failures << "forbidden architecture token ${token} in ${resource}"
                }
            }
        }
        if (!failures.empty) throw new GradleException(failures.join('; '))
        logger.lifecycle(
                "Production shape: ${classes} classes, ${lines} lines, "
                        + "${apiSources.size()} public API types")
    }
}

tasks.register('verifyPublicApiBoundary') {
    group = 'verification'
    description = 'Rejects public signatures that expose implementation packages.'
    dependsOn tasks.named('compileJava')
    doLast {
        def violations = []
        fileTree('src/main/java/blue/coordination/api') {
            include '**/*.java'
        }.each { source ->
            source.eachLine('UTF-8') { line, number ->
                if (!line.stripLeading().startsWith('import ')
                        && line.contains('blue.coordination.internal')) {
                    violations << "${source}:${number}"
                }
            }
        }
        fileTree('src/main/java/blue/coordination/internal') {
            include '**/*.java'
            exclude 'DefaultCoordinationEngine.java'
        }.each { source ->
            String body = source.getText('UTF-8')
            if (body =~ /(?m)^public\s+(?:final\s+|abstract\s+)?(?:class|interface|record|enum)\s+/) {
                violations << "public implementation type ${source}"
            }
        }
        if (!violations.empty) {
            throw new GradleException(
                    "Internal API leakage: ${violations.join(', ')}")
        }
    }
}

tasks.register('dependencyPreflight') {
    group = 'verification'
    description = 'Resolves every release dependency from published repositories.'
    doLast {
        if (dependencyMode != 'published-artifact') {
            throw new GradleException(
                    'dependencyPreflight requires '
                            + '-PblueDependencyMode=published-artifact')
        }
        def releaseDependencies = configurations.detachedConfiguration(
                dependencies.create(
                        'blue.language:blue-contracts-core:3.1.0-rc.20'),
                dependencies.create('blue.repo:blue-repo-java:3.0.0-rc.19'),
                dependencies.create('blue.bex:blue-bex-core:1.1.0-rc.3'),
                dependencies.create(
                        'blue.bex:blue-bex-contracts:1.1.0-rc.3'),
                dependencies.create('org.bouncycastle:bcprov-jdk18on:1.78.1'))
        releaseDependencies.transitive = true
        releaseDependencies.resolutionStrategy.failOnVersionConflict()
        releaseDependencies.resolve()
        logger.lifecycle('All published release dependencies resolved.')
    }
}

tasks.register('verifyArtifactContents') {
    group = 'verification'
    description = 'Rejects legacy, test, and fixture classes in the production JAR.'
    dependsOn tasks.named('jar')
    doLast {
        def forbidden = [
                'blue/coordination/basic/',
                'blue/coordination/test/',
                'blue/coordination/engine/',
                'blue/coordination/fastpath/',
                'myosDemoTest',
                'CoordinationTestControl'
        ] + forbiddenArchitectureTokens
        def violations = []
        zipTree(tasks.named('jar').get().archiveFile).visit { details ->
            if (!details.directory && forbidden.any {
                details.path.contains(it)
            }) {
                violations << details.path
            }
        }
        if (!violations.empty) {
            throw new GradleException(
                    "Unsupported production JAR entries: ${violations}")
        }
    }
}

tasks.register('verifyPublicationPom') {
    group = 'verification'
    dependsOn 'generatePomFileForMavenJavaPublication'
    doLast {
        String pom = layout.buildDirectory.file(
                'publications/mavenJava/pom-default.xml')
                .get().asFile.getText('UTF-8')
        def scopes = [:]
        pom.split('</dependency>').each { block ->
            def groups = (block =~ /<groupId>([^<]+)<\/groupId>/)
                    .collect { it[1] }
            def artifacts = (block =~ /<artifactId>([^<]+)<\/artifactId>/)
                    .collect { it[1] }
            def scope = (block =~ /<scope>([^<]+)<\/scope>/)
            if (!groups.empty && !artifacts.empty) {
                scopes[groups.last() + ':' + artifacts.last()] =
                        scope.find() ? scope.group(1) : 'compile'
            }
        }
        if (scopes['blue.language:blue-contracts-core'] != 'compile') {
            throw new GradleException(
                    'blue-contracts-core must be a compile-scope API dependency')
        }
        ['blue.repo:blue-repo-java', 'blue.bex:blue-bex-core',
         'blue.bex:blue-bex-contracts', 'org.bouncycastle:bcprov-jdk18on']
                .each { coordinate ->
                    if (scopes[coordinate] != 'runtime') {
                        throw new GradleException(
                                "${coordinate} must be runtime scoped")
                    }
                }
        def expectedVersions = [
                'blue.language:blue-contracts-core': '3.1.0-rc.20',
                'blue.repo:blue-repo-java': '3.0.0-rc.19',
                'blue.bex:blue-bex-core': '1.1.0-rc.3',
                'blue.bex:blue-bex-contracts': '1.1.0-rc.3',
                'org.bouncycastle:bcprov-jdk18on': '1.78.1'
        ]
        expectedVersions.each { coordinate, expectedVersion ->
            String artifact = coordinate.substring(
                    coordinate.indexOf(':') + 1)
            def dependency = pom.split('</dependency>').find { block ->
                block.contains("<artifactId>${artifact}</artifactId>")
            }
            if (dependency == null
                    || !dependency.contains(
                    "<version>${expectedVersion}</version>")) {
                throw new GradleException(
                        "${coordinate} must use ${expectedVersion}")
            }
        }
        ['MIT License', '<developers>', '<scm>', '<issueManagement>']
                .each { marker ->
                    if (!pom.contains(marker)) {
                        throw new GradleException(
                                "Publication POM is missing ${marker}")
                    }
                }
        if (pom.contains('SNAPSHOT') || pom.contains('junit')) {
            throw new GradleException(
                    'Release POM contains a snapshot or test dependency')
        }
    }
}

tasks.register('verifyReleaseMetadata') {
    group = 'verification'
    description = 'Validates version, legal metadata, docs, and release artifacts.'
    dependsOn 'jar', 'sourcesJar', 'javadocJar',
            'generatePomFileForMavenJavaPublication'
    String configuredReleaseVersion = version.toString()
    doLast {
        String releaseVersion = configuredReleaseVersion
        if (!(releaseVersion ==~ /\d+\.\d+\.\d+(?:-rc\.\d+)?/)) {
            throw new GradleException(
                    "Version is not a release or RC: ${releaseVersion}")
        }
        if (!file('LICENSE').getText('UTF-8').startsWith('MIT License')) {
            throw new GradleException('LICENSE must contain the MIT License')
        }
        [
                'README.md',
                'START-HERE.md',
                'CHANGELOG.md',
                'CONTRIBUTING.md',
                'SECURITY.md',
                'docs/development/build-and-test.md',
                'docs/development/test-strategy.md',
                'docs/development/releasing.md',
                'docs/releases/3.0.0-rc.1-test-report.md',
                'docs/releases/3.0.0-rc.1-evidence.json',
                'docs/releases/round11-verification.schema.json',
                'docs/reference/public-api.md',
                'docs/reference/metrics.md',
                'docs/operations/failure-model.md'
        ].each { required ->
            if (!file(required).isFile()) {
                throw new GradleException(
                        "Required RC document is missing: ${required}")
            }
        }
        def mainEntries = zipTree(tasks.named('jar').get().archiveFile)
        if (!mainEntries.matching {
            include 'META-INF/LICENSE'
        }.singleFile.isFile()) {
            throw new GradleException('Main JAR is missing META-INF/LICENSE')
        }
        def javadocEntries = zipTree(
                tasks.named('javadocJar').get().archiveFile)
        if (javadocEntries.matching {
            include 'blue/coordination/api/CoordinationEngine.html'
        }.isEmpty() || javadocEntries.matching {
            include 'blue/coordination/processor/CoordinationProcessors.html'
        }.isEmpty()) {
            throw new GradleException(
                    'Javadoc JAR must cover API and processor surfaces')
        }
    }
}

tasks.register('verifyDocumentation') {
    group = 'verification'
    description = 'Validates maintained docs and canonical release evidence.'
    inputs.files(fileTree('docs') { include '**/*.md' },
            'README.md', 'START-HERE.md', 'CHANGELOG.md',
            'CONTRIBUTING.md', 'SECURITY.md',
            'docs/releases/3.0.0-rc.1-evidence.json',
            'docs/releases/round11-verification.schema.json',
            productionSources)
    doLast {
        def failures = []
        inputs.files.files.findAll { it.name.endsWith('.md') }.each { source ->
            String markdown = source.getText('UTF-8')
            def links = markdown =~ /\[[^\]]*\]\(([^)]+)\)/
            links.each { match ->
                String raw = match[1].trim()
                if (raw.startsWith('http://') || raw.startsWith('https://')
                        || raw.startsWith('mailto:') || raw.startsWith('#')) {
                    return
                }
                String path = raw.split('#', 2)[0]
                File target = new File(source.parentFile, path)
                if (!target.exists()) {
                    failures << "${source}: broken link ${raw}"
                }
            }
        }
        if (!failures.empty) {
            throw new GradleException(failures.join('\n'))
        }
        def evidenceFile = file(
                'docs/releases/3.0.0-rc.1-evidence.json')
        def evidence = new groovy.json.JsonSlurper().parse(evidenceFile)
        if (evidence.schemaVersion != '2.0.0'
                || evidence.profile != 'ROUND11_READINESS_CLOSURE') {
            throw new GradleException(
                    'Canonical evidence must use the Round 11 profile')
        }
        def expectedStatuses = [
                'temporalArchitectureReady',
                'inMemoryEngineWorkingReady',
                'providerBackedReady',
                'mandateAgentReady',
                'playgroundLatencyReady',
                'publicRcReady'
        ] as Set
        if ((evidence.status.keySet() as Set) != expectedStatuses) {
            throw new GradleException(
                    'Round 11 evidence must contain the six readiness statuses')
        }
        def allowedStatuses = [
                'PASS', 'PASS_HARD_GATE',
                'BLOCKED', 'BLOCKED_SCOPE', 'BLOCKED_UPSTREAM', 'FAIL'
        ] as Set
        evidence.status.each { key, value ->
            if (!allowedStatuses.contains(value)) {
                failures << "Invalid readiness status ${key}=${value}"
            }
        }
        def requiredFinalStatuses = [
                temporalArchitectureReady: 'PASS',
                inMemoryEngineWorkingReady: 'PASS',
                providerBackedReady: 'BLOCKED_SCOPE',
                mandateAgentReady: 'BLOCKED_UPSTREAM',
                playgroundLatencyReady: 'PASS_HARD_GATE',
                publicRcReady: 'BLOCKED'
        ]
        if (evidence.verdict != 'BLOCKED') {
            failures << 'Final Round 11 verdict must remain BLOCKED'
        }
        requiredFinalStatuses.each { key, expected ->
            if (evidence.status[key] != expected) {
                failures << "Final Round 11 status ${key} must be ${expected}"
            }
        }

        // Candidate identity and the extracted source archive are finalized
        // only after the evidence-producing tree is committed. Every other
        // result must be complete before this report can call itself final.
        def allowedNullPaths = [
                'source.candidateCommit',
                'source.dirtyReason',
                'sourceArchive.sha256',
                'sourceArchive.pendingReason'
        ] as Set
        def allowedPendingPaths = [
                'sourceArchive.extractedConfiguration'
        ] as Set
        Closure rejectUnfinalized
        rejectUnfinalized = { value, String path ->
            if (value == null) {
                if (!allowedNullPaths.contains(path)) {
                    failures << "Final evidence is unfinalized at ${path}"
                }
                return
            }
            if (value == 'PENDING_VERIFICATION') {
                if (!allowedPendingPaths.contains(path)) {
                    failures << "Final evidence is unfinalized at ${path}"
                }
                return
            }
            if (value instanceof Map) {
                value.each { childKey, childValue ->
                    String childPath = path
                            ? "${path}.${childKey}" : childKey.toString()
                    rejectUnfinalized(childValue, childPath)
                }
            } else if (value instanceof List) {
                value.eachWithIndex { childValue, index ->
                    rejectUnfinalized(childValue, "${path}.${index}")
                }
            }
        }
        rejectUnfinalized(evidence, '')

        def actualShape = [
                productionClasses: productionSources.files.size(),
                productionLines: productionSources.files.sum {
                    it.readLines('UTF-8').size()
                } ?: 0L,
                publicApiSourceTypes: fileTree(
                        'src/main/java/blue/coordination/api') {
                    include '**/*.java'
                }.files.size()
        ]
        if (evidence.shape.status != 'PASS') {
            failures << 'Final production-shape evidence must PASS'
        }
        actualShape.each { key, actual ->
            if (evidence.shape[key] != actual) {
                failures << "Production shape ${key} is "
                        + "${evidence.shape[key]}; actual is ${actual}"
            }
        }
        def timelineCapability = evidence.capabilities.find {
            it.id == 'generic-timeline-entry-document-target'
        }
        if (timelineCapability == null
                || timelineCapability.blocker != false) {
            failures << 'Generic Timeline Entry documentId must be optional, not a blocker'
        }
        if (evidence.blockers.any {
            it.id == 'generic-timeline-entry-document-target'
        }) {
            failures << 'Optional generic Timeline target appears in blockers'
        }
        if (!evidence.blockers.any {
            it.id == 'provider-mandate-resolver'
        }) {
            failures << 'Provider-backed Mandate resolver must remain a blocker'
        }
        if (evidence.tests.status == 'PASS') {
            def totals = [
                    'tests', 'classes', 'failures', 'errors', 'skipped'
            ]
            totals.each { key ->
                if (!(evidence.tests[key] instanceof Number)
                        || evidence.tests.suites.any {
                            !(it[key] instanceof Number)
                        }) {
                    failures << "Passing evidence lacks numeric ${key} totals"
                    return
                }
                long suiteTotal = evidence.tests.suites.sum {
                    (it[key] as Number).longValue()
                }
                if (suiteTotal
                        != (evidence.tests[key] as Number).longValue()) {
                    failures << "Round 11 suite ${key} total is inconsistent"
                }
            }
            if (evidence.tests.failures != 0
                    || evidence.tests.errors != 0
                    || evidence.tests.skipped != 0) {
                failures << 'Passing evidence must have no failed or skipped tests'
            }
        }
        def expectedSuites = [
                test: [tests: 217, classes: 29],
                integrationTest: [tests: 73, classes: 31],
                consumerTest: [tests: 5, classes: 1],
                scenarioTest: [tests: 7, classes: 4]
        ]
        if (evidence.tests.status != 'PASS'
                || evidence.tests.tests != 302
                || evidence.tests.classes != 65) {
            failures << 'Final library evidence must contain 302 tests in 65 classes'
        }
        expectedSuites.each { name, expected ->
            def suite = evidence.tests.suites.find { it.name == name }
            if (suite == null
                    || suite.status != 'PASS'
                    || suite.tests != expected.tests
                    || suite.classes != expected.classes
                    || suite.failures != 0
                    || suite.errors != 0
                    || suite.skipped != 0) {
                failures << "Final ${name} suite evidence is inconsistent"
            }
        }
        if ((evidence.runtimes.collect { it.java } as Set)
                != (['17', '21'] as Set)
                || evidence.runtimes.any {
                    it.status != 'PASS'
                            || !(it.durationSeconds instanceof Number)
                            || it.durationSeconds <= 0
                }) {
            failures << 'Java 17 and Java 21 runtime evidence must be complete'
        }

        def expectedProofCounters = [
                'committed-parent-graph-publication-failure':
                        ['parentProcessReruns', 0],
                'child-commit-lagging-parents':
                        ['childProcessReruns', 0],
                'recovery-normalizes-stale-readiness':
                        ['childReplays', 0]
        ]
        evidence.readinessProofs.each { proof ->
            if (proof.status != 'PASS') {
                failures << "Readiness proof ${proof.id} did not PASS"
            }
            def expected = expectedProofCounters[proof.id]
            if (expected != null && proof[expected[0]] != expected[1]) {
                failures << "Readiness proof ${proof.id} repeated PROCESS work"
            }
        }
        if ((evidence.readinessProofs.collect { it.id } as Set) != ([
                'committed-parent-graph-publication-failure',
                'child-commit-lagging-parents',
                'recovery-normalizes-stale-readiness',
                'independent-application-read-preconditions'
        ] as Set)) {
            failures << 'Round 11 readiness proof set is incomplete'
        }
        [
                'businessOnlyTransitionReusesIdentity',
                'realSourceSurfaceChangeInvalidatesIdentity',
                'canonicalOrderingAndDelimiterSafety'
        ].each { key ->
            if (evidence.sourceSurfaceIdentity[key] != 'PASS') {
                failures << "Source-surface identity proof ${key} did not PASS"
            }
        }

        def hostRow = evidence.performance.repeatedP95Rows
                .hostOverheadAroundOneProcess
        double calculatedRegression =
                ((hostRow.round11P95Ms as double)
                        / (hostRow.baselineP95Ms as double) - 1.0d) * 100.0d
        if (evidence.performance.status != 'PASS_HARD_GATE'
                || hostRow.preferredGate != 'MISS'
                || hostRow.hardGate != 'PASS'
                || calculatedRegression
                        > (evidence.performance
                        .hardHostP95RegressionPercent as double)
                || calculatedRegression
                        <= (evidence.performance
                        .preferredHostP95RegressionPercent as double)
                || Math.abs(calculatedRegression
                        - (hostRow.regressionPercent as double)) > 0.0001d) {
            failures << 'Round 11 host p95 gate evidence is inconsistent'
        }
        def sha256Pattern = ~/[0-9a-f]{64}/
        [
                'baselineRuntimeEvidenceSha256',
                'baselineProvenanceSha256',
                'baselineTimingEvidenceSha256',
                'round11RuntimeEvidenceSha256',
                'round11ProvenanceSha256',
                'round11TimingEvidenceSha256'
        ].each { key ->
            if (!(evidence.performance[key] ==~ sha256Pattern)) {
                failures << "Performance evidence lacks valid ${key}"
            }
        }
        def performanceFileHashes = [
                baselineRuntimeComparison:
                        evidence.performance.baselineRuntimeEvidenceSha256,
                baselineRuntimeProvenance:
                        evidence.performance.baselineProvenanceSha256,
                baselineLargeHostTimings:
                        evidence.performance.baselineTimingEvidenceSha256,
                round11RuntimeComparison:
                        evidence.performance.round11RuntimeEvidenceSha256,
                round11RuntimeProvenance:
                        evidence.performance.round11ProvenanceSha256,
                round11LargeHostTimings:
                        evidence.performance.round11TimingEvidenceSha256
        ]
        evidence.performance.evidenceFiles.each { key, relativePath ->
            File retainedEvidence = new File(
                    evidenceFile.parentFile, relativePath.toString())
            if (!retainedEvidence.isFile()) {
                failures << "Retained performance evidence is missing: "
                        + relativePath
            } else {
                String actualHash = java.security.MessageDigest
                        .getInstance('SHA-256')
                        .digest(retainedEvidence.bytes)
                        .encodeHex().toString()
                if (actualHash != performanceFileHashes[key]) {
                    failures << "Retained performance evidence hash differs: "
                            + relativePath
                }
            }
        }
        if (evidence.structuralEvidence.status != 'PASS'
                || evidence.structuralEvidence.requiredZeroCounters.size() != 8
                || evidence.structuralEvidence.requiredZeroCounters.any {
                    key, value -> value != 0
                }) {
            failures << 'Forbidden-work counters must contain eight exact zeroes'
        }
        if (evidence.scenarios.wadowiceStressOracle != 'PASS'
                || evidence.scenarios.nba != 'PASS'
                || evidence.scenarios.canonicalRepositoryWadowice
                != 'NOT_PROVEN') {
            failures << 'Scenario evidence is inconsistent'
        }

        if (evidence.blueBasic.status != 'PASS') {
            failures << 'Historical blue-basic campaign did not PASS'
        } else {
            ['tests', 'classes', 'failures', 'errors', 'skipped'].each { key ->
                long suiteTotal = evidence.blueBasic.suites.sum {
                    (it[key] as Number).longValue()
                }
                if (suiteTotal != (evidence.blueBasic[key] as Number).longValue()) {
                    failures << "blue-basic ${key} total is inconsistent"
                }
            }
            if (evidence.blueBasic.tests != 40
                    || evidence.blueBasic.classes != 27
                    || evidence.blueBasic.failures != 0
                    || evidence.blueBasic.errors != 0
                    || evidence.blueBasic.skipped != 0
                    || evidence.blueBasic.suites.any { it.status != 'PASS' }) {
                failures << 'Historical blue-basic aggregate is inconsistent'
            }
        }
        if (evidence.playground.status != 'PASS'
                || evidence.playground.durationSeconds != 8) {
            failures << 'Playground compile/check evidence is incomplete'
        }
        if (evidence.publicationEvidence.status != 'BLOCKED_UPSTREAM'
                || evidence.publicationEvidence.missingCoordinates.size() != 2
                || evidence.publicationEvidence.externalConsumerSmokeBuild
                != 'BLOCKED_UPSTREAM') {
            failures << 'Published dependency blocker evidence is incomplete'
        }
        if (evidence.artifacts.status != 'PASS') {
            failures << 'Built artifact evidence did not PASS'
        }
        [
                'mainJarSha256', 'sourcesJarSha256',
                'javadocJarSha256', 'testFixturesJarSha256'
        ].each { key ->
            if (!(evidence.artifacts[key] ==~ sha256Pattern)) {
                failures << "Artifact evidence lacks valid ${key}"
            }
        }

        boolean archivePending = evidence.source.candidateCommit == null
                || evidence.sourceArchive.sha256 == null
        if (archivePending) {
            if (evidence.source.candidateCommit != null
                    || evidence.sourceArchive.sha256 != null
                    || evidence.sourceArchive.extractedConfiguration
                    != 'PENDING_VERIFICATION'
                    || !evidence.sourceArchive.pendingReason) {
                failures << 'Candidate/source-archive pending state is inconsistent'
            }
        } else if (!(evidence.source.candidateCommit ==~ /[0-9a-f]{40}/)
                || !(evidence.sourceArchive.sha256 ==~ sha256Pattern)
                || evidence.sourceArchive.extractedConfiguration != 'PASS'
                || evidence.sourceArchive.pendingReason != null) {
            failures << 'Final candidate/source-archive evidence is inconsistent'
        }
        if (!(evidence.source.mainSourceManifestSha256 ==~ sha256Pattern)
                || evidence.sourceArchive.publishedArtifactSmokeBuild
                != 'BLOCKED_UPSTREAM') {
            failures << 'Source manifest/archive evidence is inconsistent'
        }
        String report = file(
                'docs/releases/3.0.0-rc.1-test-report.md')
                .getText('UTF-8')
        expectedStatuses.each { key ->
            if (!report.contains("`${key}`")) {
                failures << "Canonical report omits readiness status ${key}"
            }
            if (!report.contains(
                    "| `${key}` | `${evidence.status[key]}` |")) {
                failures << "Canonical report/evidence status differs for ${key}"
            }
        }
        if (!report.contains(
                "ROUND11_FINAL_VERIFICATION: ${evidence.verdict}")) {
            failures << 'Canonical report verdict differs from machine evidence'
        }
        if (archivePending) {
            if (report.count('PENDING_VERIFICATION') != 1
                    || !report.contains(
                    'archive SHA-256 and extracted configuration result\n'
                            + 'remain `PENDING_VERIFICATION`')) {
                failures << 'Only candidate source-archive finalization may remain pending'
            }
        } else if (report.contains('PENDING_VERIFICATION')) {
            failures << 'Finalized report still contains pending evidence'
        }
        [
                'docs/releases/3.0.0-rc.1-round11-test-report.md',
                'docs/releases/3.0.0-rc.1-round11-evidence.json'
        ].each { duplicate ->
            if (file(duplicate).exists()) {
                failures << "Duplicate release evidence surface remains: ${duplicate}"
            }
        }
        if (!failures.empty) {
            throw new GradleException(failures.join('\n'))
        }
    }
}

tasks.register('verifySourceArchiveHygiene') {
    group = 'verification'
    description = 'Protects the self-contained source-release boundary.'
    inputs.files('.cz.toml', '.gitattributes', 'build.gradle')
    String configuredArchiveVersion = version.toString()
    doLast {
        String versionSource = file('.cz.toml').getText('UTF-8')
        def declaredVersions = versionSource =~
                /(?m)^version = "([^"]+)"$/
        if (!declaredVersions.find()
                || declaredVersions.group(1) != configuredArchiveVersion
                || declaredVersions.find()) {
            throw new GradleException(
                    '.cz.toml must contain one authoritative project version')
        }
        String attributes = file('.gitattributes').getText('UTF-8')
        [
                '*.zip export-ignore',
                'build/** export-ignore',
                '.gradle/** export-ignore',
                '__MACOSX/** export-ignore',
                '._* export-ignore',
                '*.jfr export-ignore',
                '*.hprof export-ignore'
        ].each { rule ->
            if (!attributes.contains(rule)) {
                throw new GradleException(
                        "Source archive rule is missing: ${rule}")
            }
        }
    }
}

tasks.register('verifyPublishedModeIsolation') {
    group = 'verification'
    description = 'Statically proves published mode has no Git or sibling checks.'
    inputs.files('settings.gradle', 'build.gradle')
    doLast {
        String settings = file('settings.gradle').getText('UTF-8')
        if (settings.contains('ProcessBuilder') || settings.contains("'git'")) {
            throw new GradleException(
                    'Ordinary settings must not execute Git')
        }
        if (!settings.contains("dependencyMode == 'local-composite'")) {
            throw new GradleException(
                    'Local composite inclusion is not mode-gated')
        }
    }
}

tasks.register('verifyTestArchitecture') {
    group = 'verification'
    description = 'Protects release-owned test depth and JAR-only consumer isolation.'
    def suites = [
            unit: fileTree('src/test/java') { include '**/*Test.java' },
            integration: fileTree('src/integrationTest/java') {
                include '**/*Test.java'
            },
            consumer: fileTree('src/consumerTest/java') {
                include '**/*Test.java'
            },
            scenario: fileTree('src/scenarioTest/java') {
                include '**/*Test.java'
            }
    ]
    inputs.files(suites.values())
    inputs.file('build.gradle')
    dependsOn tasks.named('jar')
    doLast {
        def minimumTests = [unit: 175, integration: 24,
                            consumer: 5, scenario: 2]
        def failures = []
        suites.each { name, sources ->
            int methods = sources.files.sum { source ->
                (source.getText('UTF-8') =~ /(?m)^\s*@Test\b/).count
            } ?: 0
            if (methods < minimumTests[name]) {
                failures << "${name} has ${methods} @Test methods; "
                        + "minimum is ${minimumTests[name]}"
            }
            logger.lifecycle(
                    "${name} tests: ${sources.files.size()} classes, "
                            + "${methods} methods")
        }

        String integrationSources = fileTree('src/integrationTest/java') {
            include '**/*.java'
        }.files.collect { it.getText('UTF-8') }.join('\n')
        ['BasicTestMetrics', 'RuntimeComparisonWriter', 'LatencySeries']
                .each { historical ->
                    if (integrationSources.contains(historical)) {
                        failures << "release tests depend on historical metric "
                                + "support ${historical}"
                    }
                }
        if (integrationSources.contains('blue.coordination.basic')) {
            failures << 'release tests retain the historical basic package'
        }

        fileTree('src/consumerTest/java') { include '**/*.java' }
                .each { source ->
                    String body = source.getText('UTF-8')
                    ['blue.coordination.internal',
                     'blue.coordination.processor',
                     'blue.coordination.integration']
                            .each { forbidden ->
                                if (body.contains(forbidden)) {
                                    failures << "consumer imports ${forbidden}: "
                                            + source
                                }
                            }
                }
        Set<File> mainOutputs = sourceSets.main.output.files.collect {
            it.canonicalFile
        } as Set
        Set<File> consumerClasspath = sourceSets.consumerTest
                .compileClasspath.files.collect { it.canonicalFile } as Set
        if (!mainOutputs.intersect(consumerClasspath).empty) {
            failures << 'consumer compile classpath contains main source outputs'
        }
        File mainJar = tasks.named('jar').get().archiveFile.get().asFile
                .canonicalFile
        if (!consumerClasspath.contains(mainJar)) {
            failures << 'consumer compile classpath does not contain the built JAR'
        }
        String historicalProject = '../blue-' + 'basic'
        if (file('build.gradle').getText('UTF-8').contains(
                historicalProject)) {
            failures << "release build depends on ${historicalProject}"
        }
        if (!failures.empty) {
            throw new GradleException(failures.join('; '))
        }
    }
}

tasks.register('productionizationCheck') {
    group = 'verification'
    dependsOn 'build', 'validateProductionShape',
            'verifyPublicApiBoundary', 'verifyArtifactContents',
            'verifyPublicationPom', 'verifyPublishedModeIsolation',
            'verifyReleaseMetadata', 'verifyDocumentation',
            'verifySourceArchiveHygiene', 'scenarioTest',
            'verifyTestArchitecture'
}

tasks.register('releaseCheck') {
    group = 'verification'
    description = 'Runs the production, API, artifact, and publication gates.'
    dependsOn 'build', 'validateProductionShape', 'verifyPublicApiBoundary',
            'verifyArtifactContents', 'verifyPublicationPom',
            'verifyPublishedModeIsolation', 'verifyReleaseMetadata',
            'verifyDocumentation', 'verifySourceArchiveHygiene', 'test',
            'integrationTest', 'consumerTest', 'scenarioTest',
            'verifyTestArchitecture'
}

def round11Readiness = tasks.register('verifyRound11Readiness') {
    group = 'verification'
    description = 'Prevents staging until canonical Round 11 evidence permits it.'
    inputs.files('docs/releases/3.0.0-rc.1-test-report.md',
            'docs/releases/3.0.0-rc.1-evidence.json')
    doLast {
        String report = file(
                'docs/releases/3.0.0-rc.1-test-report.md')
                .getText('UTF-8')
        def evidence = new groovy.json.JsonSlurper().parse(
                file('docs/releases/3.0.0-rc.1-evidence.json'))
        def publishableLatency = ['PASS', 'PASS_HARD_GATE'] as Set
        if (evidence.status.temporalArchitectureReady != 'PASS'
                || evidence.status.inMemoryEngineWorkingReady != 'PASS'
                || evidence.status.mandateAgentReady != 'PASS'
                || !publishableLatency.contains(
                        evidence.status.playgroundLatencyReady)
                || evidence.status.publicRcReady != 'PASS'
                || evidence.tests.status != 'PASS'
                || evidence.shape.status != 'PASS'
                || evidence.artifacts.status != 'PASS'
                || !publishableLatency.contains(evidence.performance.status)
                || evidence.runtimes.any { it.status != 'PASS' }
                || evidence.sourceArchive.extractedConfiguration != 'PASS'
                || evidence.sourceArchive.publishedArtifactSmokeBuild != 'PASS'
                || evidence.blockers.any { it.category != 'scope' }
                || evidence.status.values().any {
                    it.toString().startsWith('PENDING')
                }
                || report.contains('PENDING_VERIFICATION')) {
            throw new GradleException(
                    'Canonical Round 11 evidence does not permit staging')
        }
    }
}

tasks.register('stageRelease') {
    group = 'publishing'
    description = 'Builds the verified Maven Central staging repository.'
    dependsOn 'releaseCheck', round11Readiness,
            'publishMavenJavaPublicationToStagingRepository'
}

tasks.named('publishMavenJavaPublicationToStagingRepository') {
    dependsOn round11Readiness
}

if (localDependencies) {
    File localBexCheckout = file(providers.gradleProperty(
            'blueBexCompositePath').getOrElse('../blue-bex-java'))
    File localRepositoryCheckout = file(providers.gradleProperty(
            'blueRepositoryCompositePath')
            .getOrElse('../blue-repository-java'))
    def localSourceInputs = tasks.register('verifyLocalSourceInputs') {
        group = 'verification'
        description = 'Verifies the exact local Repository, BEX, and Language inputs.'
        inputs.files('gradle/bex-source.lock',
                'gradle/repository-source.lock')
        doLast {
            def readLock = { File lock ->
                lock.readLines('UTF-8')
                        .findAll { !it.startsWith('#') && it.contains('=') }
                        .collectEntries { line ->
                            int separator = line.indexOf('=')
                            [(line.substring(0, separator)):
                                     line.substring(separator + 1)]
                        }
            }
            def gitBytes = { File root, String... arguments ->
                def command = ['git', '-C', root.absolutePath]
                command.addAll(arguments as List)
                Process process = new ProcessBuilder(command).start()
                byte[] stdout = process.inputStream.bytes
                String stderr = process.errorStream.getText('UTF-8')
                if (process.waitFor() != 0) {
                    throw new GradleException(
                            "Git failed in ${root}: ${stderr}")
                }
                stdout
            }
            def sha256 = { byte[] bytes ->
                java.security.MessageDigest.getInstance('SHA-256')
                        .digest(bytes).encodeHex().toString()
            }
            def bexLock = readLock(file('gradle/bex-source.lock'))
            def repositoryLock = readLock(
                    file('gradle/repository-source.lock'))
            File bex = localBexCheckout
            File repository = localRepositoryCheckout
            File language = new File(repository, '../blue-language-java')
                    .canonicalFile
            String bexHead = new String(
                    gitBytes(bex, 'rev-parse', 'HEAD'), 'UTF-8').trim()
            String repositoryHead = new String(
                    gitBytes(repository, 'rev-parse', 'HEAD'), 'UTF-8').trim()
            String languageHead = new String(
                    gitBytes(language, 'rev-parse', 'HEAD'), 'UTF-8').trim()
            if (bexHead != bexLock.commit
                    || repositoryHead != repositoryLock.baseCommit
                    || languageHead != repositoryLock.languageCommit) {
                throw new GradleException('Local dependency commit drift')
            }
            if (new String(gitBytes(bex, 'status', '--porcelain'),
                    'UTF-8').trim()
                    || new String(gitBytes(language, 'status', '--porcelain'),
                    'UTF-8').trim()) {
                throw new GradleException(
                        'Pinned BEX and Language inputs must be clean')
            }
            byte[] repositoryDiff = gitBytes(repository, 'diff', '--binary',
                    'HEAD', '--', 'build.gradle', 'settings.gradle',
                    '.cz.toml', 'src/main/java', 'src/main/resources')
            if (sha256(repositoryDiff)
                    != repositoryLock.workspaceDiffSha256) {
                throw new GradleException(
                        'Local Repository production diff fingerprint drift')
            }
            logger.lifecycle('Local source inputs match pinned fingerprints.')
        }
    }
    tasks.named('releaseCheck') {
        dependsOn localSourceInputs
    }

    def localPrerequisites = tasks.register(
            'stageLocalPrerequisiteArtifacts') {
        group = 'publishing'
        description = 'Stages source-built prerequisites for local artifact verification.'
        dependsOn gradle.includedBuild('blue-repository-java').task(':jar')
        dependsOn gradle.includedBuild('blue-bex-java')
                .task(':blue-bex-core:jar')
        dependsOn gradle.includedBuild('blue-bex-java')
                .task(':blue-bex-contracts:jar')
        inputs.files(
                fileTree(new File(localRepositoryCheckout, 'build/libs')) {
                    include 'blue-repo-java-*-SNAPSHOT.jar'
                    exclude '*-sources.jar', '*-javadoc.jar'
                },
                fileTree(new File(localBexCheckout,
                        'blue-bex-core/build/libs')) {
                    include 'blue-bex-core-*-SNAPSHOT.jar'
                    exclude '*-sources.jar', '*-javadoc.jar'
                },
                fileTree(new File(localBexCheckout,
                        'blue-bex-contracts/build/libs')) {
                    include 'blue-bex-contracts-*-SNAPSHOT.jar'
                    exclude '*-sources.jar', '*-javadoc.jar'
                })
        outputs.dir(layout.buildDirectory.dir('local-prerequisites'))
        doLast {
            def targetRoot = layout.buildDirectory
                    .dir('local-prerequisites').get().asFile
            if (targetRoot.exists() && !targetRoot.deleteDir()) {
                throw new GradleException(
                        "Cannot refresh generated artifacts at ${targetRoot}")
            }
            copy {
                from fileTree(new File(
                        localRepositoryCheckout, 'build/libs')) {
                    include 'blue-repo-java-*-SNAPSHOT.jar'
                    exclude '*-sources.jar', '*-javadoc.jar'
                }.singleFile
                into new File(targetRoot,
                        'blue/repo/blue-repo-java/3.0.0-rc.19')
                rename { 'blue-repo-java-3.0.0-rc.19.jar' }
            }
            copy {
                from fileTree(new File(localBexCheckout,
                        'blue-bex-core/build/libs')) {
                    include 'blue-bex-core-*-SNAPSHOT.jar'
                    exclude '*-sources.jar', '*-javadoc.jar'
                }.singleFile
                into new File(targetRoot,
                        'blue/bex/blue-bex-core/1.1.0-rc.3')
                rename { 'blue-bex-core-1.1.0-rc.3.jar' }
            }
            copy {
                from fileTree(
                        new File(localBexCheckout,
                                'blue-bex-contracts/build/libs')) {
                    include 'blue-bex-contracts-*-SNAPSHOT.jar'
                    exclude '*-sources.jar', '*-javadoc.jar'
                }.singleFile
                into new File(targetRoot,
                        'blue/bex/blue-bex-contracts/1.1.0-rc.3')
                rename { 'blue-bex-contracts-1.1.0-rc.3.jar' }
            }
        }
    }
    tasks.named('publishToMavenLocal') {
        dependsOn localPrerequisites
    }
}

