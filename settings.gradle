plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'blue-coordination-java'

def localBlueLanguage = file('../blue-language-java')
if (!localBlueLanguage.isDirectory()) {
    throw new GradleException(
            "Required local blue-language-java build is missing at ${localBlueLanguage}")
}
def localBlueLanguageCanonical = localBlueLanguage.canonicalFile
def requestedBexLanguageComposite =
        providers.gradleProperty('blueLanguageCompositePath')
                .orNull
                ?.trim()
if (requestedBexLanguageComposite
        && file(requestedBexLanguageComposite).canonicalFile
        != localBlueLanguageCanonical) {
    throw new GradleException(
            "blueLanguageCompositePath must resolve to the required local "
                    + "blue-language-java build at "
                    + localBlueLanguageCanonical)
}
/*
 * BEX is itself a composite consumer of Language. Gradle project properties
 * passed to the root are inherited by included builds, while a portable
 * default cannot be declared in this repository's gradle.properties for a
 * sibling-relative path. Expose the canonical path as an org.gradle.project
 * system property before BEX settings are evaluated, so BEX cannot silently
 * compile against its standalone published Language coordinate.
 */
System.setProperty(
        'org.gradle.project.blueLanguageCompositePath',
        localBlueLanguageCanonical.absolutePath)
includeBuild(localBlueLanguage) {
    dependencySubstitution {
        substitute module('blue.language:blue-language-java') using project(':')
    }
}

def localBlueBex = file('../blue-bex-java')
if (!localBlueBex.isDirectory()) {
    throw new GradleException(
            "Required local blue-bex-java build is missing at ${localBlueBex}")
}
includeBuild(localBlueBex) {
    dependencySubstitution {
        substitute module('blue.bex:blue-bex-java') using project(':')
    }
}

def localBlueRepositorySource = file('../blue-repository-java')
if (!localBlueRepositorySource.isDirectory()) {
    throw new GradleException(
            "Required local blue-repository-java build is missing at "
                    + localBlueRepositorySource)
}
def siblingSourceLockFile = file('gradle/blue-sibling-lock.properties')
if (!siblingSourceLockFile.isFile()) {
    throw new GradleException(
            "Required sibling source lock is missing: "
                    + siblingSourceLockFile)
}
def siblingSourceLock = new Properties()
siblingSourceLockFile.withInputStream {
    siblingSourceLock.load(it)
}
def lockedBlueRepositoryCommit =
        siblingSourceLock.getProperty('blueRepositoryCommit')
if (!(lockedBlueRepositoryCommit ==~ /[0-9a-f]{40}/)) {
    throw new GradleException(
            "blueRepositoryCommit must be an exact Git SHA in "
                    + siblingSourceLockFile)
}

def gitText = { File directory, String... arguments ->
    def command = ['git']
    command.addAll(arguments as List)
    def process = new ProcessBuilder(command)
            .directory(directory)
            .redirectErrorStream(true)
            .start()
    def output = process.inputStream.getText('UTF-8').trim()
    def exitCode = process.waitFor()
    if (exitCode != 0) {
        throw new GradleException(
                "Git command failed in ${directory}: "
                        + command + "\n" + output)
    }
    return output
}

def localBlueRepositorySourceCanonical =
        localBlueRepositorySource.canonicalFile
def sourceRepositoryCommit =
        gitText(
                localBlueRepositorySourceCanonical,
                'rev-parse',
                'HEAD')
if (sourceRepositoryCommit != lockedBlueRepositoryCommit) {
    throw new GradleException(
            "Local blue-repository-java HEAD "
                    + sourceRepositoryCommit
                    + " does not match the locked immutable commit "
                    + lockedBlueRepositoryCommit)
}
gitText(
        localBlueRepositorySourceCanonical,
        'cat-file',
        '-e',
        lockedBlueRepositoryCommit + '^{commit}')

/*
 * The user-owned Repository checkout can contain unrelated generated-source
 * work. A composite build pointed at that working tree would compile those
 * changes even while reporting the locked HEAD commit. Materialize the exact
 * local commit in Coordination's ignored Gradle state and include that clean
 * source tree instead. This uses only the local object database, never writes
 * to the Repository checkout, and survives the root project's clean task.
 */
def immutableRepositoryParent =
        file('.gradle/immutable-local-repository').canonicalFile
def immutableBlueRepository =
        new File(
                immutableRepositoryParent,
                lockedBlueRepositoryCommit)
def materializedCommit = {
    if (!immutableBlueRepository.isDirectory()) {
        return null
    }
    try {
        return gitText(
                immutableBlueRepository,
                'rev-parse',
                'HEAD')
    } catch (GradleException ignored) {
        return null
    }
}
if (materializedCommit() != lockedBlueRepositoryCommit) {
    if (immutableBlueRepository.exists()) {
        throw new GradleException(
                "Invalid immutable Repository materialization at "
                        + immutableBlueRepository
                        + "; expected commit "
                        + lockedBlueRepositoryCommit)
    }
    immutableRepositoryParent.mkdirs()
    def temporaryRepository =
            new File(
                    immutableRepositoryParent,
                    lockedBlueRepositoryCommit
                            + '.tmp-'
                            + UUID.randomUUID().toString())
    def cloneCommand = [
            'git',
            'clone',
            '--local',
            '--no-hardlinks',
            '--no-checkout',
            '--',
            localBlueRepositorySourceCanonical.absolutePath,
            temporaryRepository.absolutePath
    ]
    def cloneProcess = new ProcessBuilder(cloneCommand)
            .directory(settingsDir)
            .redirectErrorStream(true)
            .start()
    def cloneOutput =
            cloneProcess.inputStream.getText('UTF-8').trim()
    def cloneExitCode = cloneProcess.waitFor()
    if (cloneExitCode != 0) {
        throw new GradleException(
                "Failed to materialize immutable local Repository: "
                        + cloneCommand + "\n" + cloneOutput)
    }
    gitText(
            temporaryRepository,
            'checkout',
            '--detach',
            lockedBlueRepositoryCommit)
    if (gitText(
            temporaryRepository,
            'rev-parse',
            'HEAD') != lockedBlueRepositoryCommit) {
        throw new GradleException(
                "Immutable Repository materialization selected the wrong "
                        + "commit at " + temporaryRepository)
    }
    def acceptConcurrentMaterialization = {
        Exception moveFailure ->
            if (materializedCommit()
                    != lockedBlueRepositoryCommit
                    || gitText(
                    immutableBlueRepository,
                    'status',
                    '--porcelain',
                    '--untracked-files=no')) {
                throw new GradleException(
                        "Concurrent immutable Repository materialization "
                                + "did not produce the locked clean commit at "
                                + immutableBlueRepository,
                        moveFailure)
            }
            if (!temporaryRepository.deleteDir()) {
                throw new GradleException(
                        "Could not remove redundant immutable Repository "
                                + "materialization at "
                                + temporaryRepository,
                        moveFailure)
            }
    }
    try {
        java.nio.file.Files.move(
                temporaryRepository.toPath(),
                immutableBlueRepository.toPath(),
                java.nio.file.StandardCopyOption.ATOMIC_MOVE)
    } catch (java.nio.file.AtomicMoveNotSupportedException ignored) {
        try {
            java.nio.file.Files.move(
                    temporaryRepository.toPath(),
                    immutableBlueRepository.toPath())
        } catch (java.io.IOException concurrentMoveFailure) {
            acceptConcurrentMaterialization(
                    concurrentMoveFailure)
        }
    } catch (java.io.IOException concurrentMoveFailure) {
        acceptConcurrentMaterialization(
                concurrentMoveFailure)
    }
}
if (gitText(
        immutableBlueRepository,
        'status',
        '--porcelain',
        '--untracked-files=no')) {
    throw new GradleException(
            "Immutable Repository materialization has tracked changes: "
                    + immutableBlueRepository)
}

def requestedRepositoryComposite =
        providers.gradleProperty('blueRepositoryCompositePath')
                .orNull
                ?.trim()
if (requestedRepositoryComposite
        && file(requestedRepositoryComposite).canonicalFile
        != immutableBlueRepository.canonicalFile) {
    throw new GradleException(
            "blueRepositoryCompositePath must resolve to the exact locked "
                    + "local Repository materialization at "
                    + immutableBlueRepository)
}
System.setProperty(
        'org.gradle.project.blueRepositoryCompositePath',
        immutableBlueRepository.absolutePath)
includeBuild(immutableBlueRepository) {
    dependencySubstitution {
        substitute module('blue.repo:blue-repo-java') using project(':')
    }
}
