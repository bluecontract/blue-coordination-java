pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'blue-coordination-java'

def dependencyMode = providers.gradleProperty('blueDependencyMode')
        .getOrElse('published-artifact')
        .trim()
def acceptedDependencyModes = [
        'published-artifact',
        'immutable-staged-contracts',
        'immutable-development-contracts'
] as Set
if (!acceptedDependencyModes.contains(dependencyMode)) {
    throw new GradleException(
            'blueDependencyMode must be published-artifact, '
                    + 'immutable-staged-contracts, or '
                    + 'immutable-development-contracts')
}

def forbiddenDependencyProperties = [
        'blueLanguageCompositePath',
        'blueBexCompositePath',
        'blueRepositoryCompositePath',
        'blueStagingRepository',
        'bluePublishedRepository'
]
def suppliedForbiddenProperties = forbiddenDependencyProperties.findAll {
    providers.gradleProperty(it).isPresent()
}
if (!suppliedForbiddenProperties.empty) {
    throw new GradleException(
            'Retired dependency properties are forbidden: '
                    + suppliedForbiddenProperties.sort())
}

if (dependencyMode in [
        'immutable-staged-contracts',
        'immutable-development-contracts'
]) {
    String expectedContractsVersion = providers.gradleProperty(
            'blueContractsVersion').orNull
    if (expectedContractsVersion == null
            || expectedContractsVersion.isBlank()) {
        throw new GradleException(
                'immutable Contracts modes require an explicit '
                        + '-PblueContractsVersion=<exact manifest version>')
    }
    String repositoryValue = providers.gradleProperty(
            'blueContractsRepository').orNull
    String manifestIdentity = providers.gradleProperty(
            'blueContractsManifestSha256').orNull
    if (repositoryValue == null || repositoryValue.isBlank()) {
        throw new GradleException(
                'immutable-staged-contracts mode requires '
                        + '-PblueContractsRepository=/absolute/path')
    }
    File repositoryPath = new File(repositoryValue)
    if (!repositoryPath.isAbsolute()) {
        throw new GradleException(
                'blueContractsRepository must be an absolute path')
    }
    File repository = repositoryPath.canonicalFile
    if (!repository.isDirectory()) {
        throw new GradleException(
                'blueContractsRepository is not an immutable staged '
                        + 'Contracts repository: ' + repository)
    }
    if (manifestIdentity == null
            || !(manifestIdentity ==~ /sha256:[0-9a-f]{64}/)) {
        throw new GradleException(
                'immutable-staged-contracts mode requires '
                        + '-PblueContractsManifestSha256=sha256:<64 lowercase hex>')
    }
    File manifest = new File(repository, 'artifact-manifest.json')
    File sidecar = new File(repository, 'artifact-manifest.json.sha256')
    if (!manifest.isFile() || java.nio.file.Files.isSymbolicLink(
            manifest.toPath()) || !sidecar.isFile()
            || java.nio.file.Files.isSymbolicLink(sidecar.toPath())) {
        throw new GradleException(
                'blueContractsRepository is missing the regular manifest '
                        + 'and checksum companion')
    }
    String actualIdentity = 'sha256:' + java.security.MessageDigest
            .getInstance('SHA-256').digest(manifest.bytes)
            .encodeHex().toString()
    if (actualIdentity != manifestIdentity) {
        throw new GradleException(
                'blueContractsManifestSha256 does not identify '
                        + 'artifact-manifest.json')
    }
    String expectedSidecar = (actualIdentity.substring('sha256:'.length())
            + '  artifact-manifest.json\n')
    if (sidecar.getText('UTF-8') != expectedSidecar) {
        throw new GradleException(
                'artifact-manifest.json.sha256 does not identify the '
                        + 'staged Contracts manifest')
    }
    if (dependencyMode == 'immutable-development-contracts') {
        String expectedSourceCommit = providers.gradleProperty(
                'blueContractsSourceCommit').orNull
        if (expectedSourceCommit == null
                || !(expectedSourceCommit ==~ /[0-9a-f]{40}/)) {
            throw new GradleException(
                    'immutable-development-contracts mode requires '
                            + '-PblueContractsSourceCommit=<exact lowercase Git identity>')
        }
        def manifestDocument
        try {
            manifestDocument = new groovy.json.JsonSlurper().parse(manifest)
        } catch (RuntimeException exception) {
            throw new GradleException(
                    'Cannot parse immutable development Contracts manifest',
                    exception)
        }
        Set<String> languageFields = [
                'schema', 'stagePurpose', 'releaseReadinessClaimed',
                'builtWithJava', 'groupId', 'version', 'sourceCommit',
                'sourceTree', 'sourceDirty',
                'contractsSpecificationIdentity',
                'contractsFixturePackageIdentity',
                'contractsReleaseIdentity', 'artifacts'
        ] as Set
        if (!(manifestDocument instanceof Map)
                || (manifestDocument.keySet() as Set) != languageFields) {
            throw new GradleException(
                    'development Contracts manifest fields are not canonical')
        }
        if (manifestDocument.schema
                != 'blue-development-maven-repository/1.0'
                || manifestDocument.stagePurpose != 'DEVELOPMENT'
                || manifestDocument.releaseReadinessClaimed != false
                || !(manifestDocument.builtWithJava instanceof Number)
                || manifestDocument.builtWithJava.toString() != '17') {
            throw new GradleException(
                    'blueContractsRepository is not a JDK 17 DEVELOPMENT '
                            + 'Contracts repository')
        }
        if (manifestDocument.sourceCommit != expectedSourceCommit) {
            throw new GradleException(
                    'blueContractsSourceCommit does not match the '
                            + 'development Contracts manifest')
        }
        String expectedVersion = expectedContractsVersion
        if (manifestDocument.version != expectedVersion) {
            throw new GradleException(
                    'blueContractsVersion does not match the development Contracts manifest')
        }
        if (!(expectedVersion ==~ /3\.1\.0-dev\.[0-9a-f]{40}/)
                || manifestDocument.sourceTree == null
                || !(manifestDocument.sourceTree ==~ /[0-9a-f]{40}/)
                || manifestDocument.sourceDirty != false
                || expectedVersion != '3.1.0-dev.' + expectedSourceCommit) {
            throw new GradleException(
                    'DEVELOPMENT Contracts version must bind a clean exact commit')
        }

        String expectedBexVersion = providers.gradleProperty(
                'blueBexVersion').orNull
        def bexProperties = [
                repository: providers.gradleProperty(
                        'blueBexRepository').orNull,
                manifestIdentity: providers.gradleProperty(
                        'blueBexManifestSha256').orNull,
                sourceCommit: providers.gradleProperty(
                        'blueBexSourceCommit').orNull
        ]
        if (!(expectedBexVersion ==~ /1\.1\.0-dev\.[0-9a-f]{40}/)) {
            throw new GradleException(
                    'blueBexVersion must be an exact commit-bound DEVELOPMENT version')
        }
            if (bexProperties.repository == null
                    || bexProperties.repository.isBlank()) {
                throw new GradleException(
                        'commit-bound BEX mode requires '
                                + '-PblueBexRepository=/absolute/path')
            }
            File bexRepositoryPath = new File(bexProperties.repository)
            if (!bexRepositoryPath.isAbsolute()) {
                throw new GradleException(
                        'blueBexRepository must be an absolute path')
            }
            File bexRepository = bexRepositoryPath.canonicalFile
            if (!bexRepository.isDirectory()) {
                throw new GradleException(
                        'blueBexRepository is not an immutable DEVELOPMENT '
                                + 'BEX repository: ' + bexRepository)
            }
            if (bexProperties.manifestIdentity == null
                    || !(bexProperties.manifestIdentity
                    ==~ /sha256:[0-9a-f]{64}/)) {
                throw new GradleException(
                        'commit-bound BEX mode requires '
                                + '-PblueBexManifestSha256=sha256:<64 lowercase hex>')
            }
            if (bexProperties.sourceCommit == null
                    || !(bexProperties.sourceCommit ==~ /[0-9a-f]{40}/)) {
                throw new GradleException(
                        'commit-bound BEX mode requires '
                                + '-PblueBexSourceCommit=<40 lowercase hex>')
            }
            File bexManifest = new File(
                    bexRepository, 'artifact-manifest.json')
            File bexSidecar = new File(
                    bexRepository, 'artifact-manifest.json.sha256')
            if (!bexManifest.isFile()
                    || java.nio.file.Files.isSymbolicLink(
                    bexManifest.toPath())
                    || !bexSidecar.isFile()
                    || java.nio.file.Files.isSymbolicLink(
                    bexSidecar.toPath())) {
                throw new GradleException(
                        'blueBexRepository is missing the regular manifest '
                                + 'and checksum companion')
            }
            String actualBexIdentity = ('sha256:'
                    + java.security.MessageDigest.getInstance('SHA-256')
                    .digest(bexManifest.bytes).encodeHex().toString())
            if (actualBexIdentity != bexProperties.manifestIdentity) {
                throw new GradleException(
                        'blueBexManifestSha256 does not identify '
                                + 'artifact-manifest.json')
            }
            String expectedBexSidecar = actualBexIdentity.substring(
                    'sha256:'.length()) + '  artifact-manifest.json\n'
            if (bexSidecar.getText('UTF-8') != expectedBexSidecar) {
                throw new GradleException(
                        'artifact-manifest.json.sha256 does not identify '
                                + 'the DEVELOPMENT BEX manifest')
            }
            def bexManifestDocument
            try {
                bexManifestDocument = new groovy.json.JsonSlurper().parse(
                        bexManifest)
            } catch (RuntimeException exception) {
                throw new GradleException(
                        'Cannot parse immutable DEVELOPMENT BEX manifest',
                        exception)
            }
            Set<String> bexFields = [
                    'schema', 'stagePurpose', 'releaseReadinessClaimed',
                    'builtWithJava', 'groupId', 'version', 'sourceCommit',
                    'sourceTree', 'sourceDirty',
                    'bexSpecificationIdentity', 'bexFixturePackageIdentity',
                    'bexRegistryPackageIdentity', 'bexGasPackageIdentity',
                    'languageVersion', 'languageSourceCommit',
                    'languageRepositoryManifestIdentity', 'artifacts'
            ] as Set
            if (!(bexManifestDocument instanceof Map)
                    || (bexManifestDocument.keySet() as Set) != bexFields) {
                throw new GradleException(
                        'DEVELOPMENT BEX manifest fields are not canonical')
            }
            if (bexManifestDocument.schema
                    != 'blue-bex-development-repository/1.0'
                    || bexManifestDocument.stagePurpose != 'DEVELOPMENT'
                    || bexManifestDocument.releaseReadinessClaimed != false
                    || !(bexManifestDocument.builtWithJava instanceof Number)
                    || bexManifestDocument.builtWithJava.toString() != '17'
                    || bexManifestDocument.groupId != 'blue.bex'
                    || bexManifestDocument.version != expectedBexVersion
                    || bexManifestDocument.sourceCommit
                    != bexProperties.sourceCommit
                    || !(bexManifestDocument.sourceTree instanceof String)
                    || !(bexManifestDocument.sourceTree
                    ==~ /[0-9a-f]{40}/)
                    || bexManifestDocument.sourceDirty != false
                    || !expectedBexVersion.endsWith(
                    '.' + bexProperties.sourceCommit)) {
                throw new GradleException(
                        'BEX manifest does not match its exact version/source binding')
            }
            if (bexManifestDocument.languageVersion != expectedVersion
                    || bexManifestDocument.languageSourceCommit
                    != expectedSourceCommit
                    || bexManifestDocument.languageRepositoryManifestIdentity
                    != manifestIdentity) {
                throw new GradleException(
                        'BEX manifest does not bind the selected immutable '
                                + 'Language/Contracts repository')
            }
    } else {
        def stagedManifestDocument
        try {
            stagedManifestDocument = new groovy.json.JsonSlurper().parse(
                    manifest)
        } catch (RuntimeException exception) {
            throw new GradleException(
                    'Cannot parse immutable staged Contracts manifest',
                    exception)
        }
        if (!(stagedManifestDocument instanceof Map)
                || stagedManifestDocument.schema
                != 'blue-staged-dependency-repository/1.0'
                || stagedManifestDocument.groupId != 'blue.language'
                || stagedManifestDocument.version
                != expectedContractsVersion) {
            throw new GradleException(
                    'blueContractsVersion does not match the immutable '
                            + 'staged Contracts manifest')
        }
    }
}
