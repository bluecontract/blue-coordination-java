def generateCoordinationSameRunEvidenceReport =
        tasks.register(
                'generateCoordinationSameRunEvidenceReport') {
    group = 'verification'
    description =
            'Derives all working-report counts from the same-run full JUnit, fixed-Repository, flagship, schema, and gas evidence.'
    dependsOn(
            coordinationFullSuitePartitionVerification,
            coordinationExternalBlockerProbeTest)
    inputs.files(
            workingFinalReportSchema,
            workingGasFixtureEvidence,
            workingConformanceManifest)
    outputs.file(
            workingSameRunEvidenceReport)
    outputs.upToDateWhen { false }
    doLast {
        File fullDirectory =
                workingFullResults.get()
                        .asFile
        def full =
                readWorkingJUnit(
                        fullDirectory)
        def partition =
                new JsonSlurper()
                        .parse(
                                workingPartitionReport
                                        .get().asFile)
        def external =
                new JsonSlurper()
                        .parse(
                                externalProbeReport
                                        .get().asFile)
        def reportSchema =
                new JsonSlurper()
                        .parse(
                                workingFinalReportSchema)
        def closedProperties =
                reportSchema.allOf[0]
                        .get('then')
                        .properties
        long requiredBehavior =
                closedProperties
                        .behaviorConformance
                        .properties.required.const
                        .longValue()
        long requiredPortableGas =
                closedProperties
                        .portableGasConformance
                        .properties.required.const
                        .longValue()
        long requiredHostQuota =
                closedProperties
                        .hostQuotaConformance
                        .properties.required.const
                        .longValue()
        long requiredTotal =
                closedProperties
                        .totalConformance
                        .properties.required.const
                        .longValue()
        long requiredFlagship =
                closedProperties
                        .flagshipRuns
                        .properties.required.const
                        .longValue()
        def behavior =
                workingConformanceResult(
                        full,
                        '^blue\\.coordination\\.processor\\.'
                                + 'CoordinationBehaviorFixtureHarnessTest#'
                                + 'coord-(?:chan|e2e|fail|mand|route|'
                                + 'split|time|wf)-[0-9]+@[a-z0-9-]+$',
                        requiredBehavior)
        def portableGas =
                workingConformanceResult(
                        full,
                        '^blue\\.language\\.processor\\.'
                                + 'CoordinationDirectPortableGas'
                                + 'MicrofixtureTest#'
                                + 'shouldExecuteDirectPortableGas'
                                + 'Microfixture\\[[0-9]+\\] '
                                + 'coordination/conformance/fixtures/'
                                + 'gas-micro/[A-Za-z0-9]+\\.yaml$',
                        requiredPortableGas)
        def hostQuota =
                workingConformanceResult(
                        full,
                        '^blue\\.coordination\\.processor\\.'
                                + 'CoordinationHostQuotaFixtureTest#'
                                + 'coordination-host-[a-z0-9-]+ '
                                + '\\[[a-z0-9-]+\\.yaml\\]$',
                        requiredHostQuota)
        def totalConformance = [
                required   :
                        requiredTotal,
                executed   :
                        behavior.executed
                                + portableGas.executed
                                + hostQuota.executed,
                passed     :
                        behavior.passed
                                + portableGas.passed
                                + hostQuota.passed,
                failed     :
                        behavior.failed
                                + portableGas.failed
                                + hostQuota.failed,
                skipped    :
                        behavior.skipped
                                + portableGas.skipped
                                + hostQuota.skipped,
                notExecuted:
                        behavior.notExecuted
                                + portableGas.notExecuted
                                + hostQuota.notExecuted
        ]
        File fixedFile =
                workingFixedRepositoryEvidence
                        .get().asFile
        def fixedRepository =
                fixedFile.isFile()
                        ? new JsonSlurper()
                        .parse(
                                fixedFile)
                        : [
                        status  : 'missing',
                        total   : null,
                        verified: null,
                        failed  : null
                ]
        def fixedRequiredClosure =
                fixedRepository.requiredClosure
                instanceof Map
                        ? fixedRepository.requiredClosure
                        : [
                        eligible       : null,
                        total          : null,
                        audited        : null,
                        verified       : null,
                        missing        : null,
                        invalidEvidence: null,
                        unavailable    : null,
                        incompleteCyclicProof:
                                null
                ]
        File flagshipFile =
                workingFlagshipEvidence
                        .get().asFile
        def flagshipLocality =
                project.ext
                        .coordinationReleaseReadFlagshipLocality
                        .call(
                                flagshipFile)
        String flagshipClass = [
                'blue.coordination.processor.',
                'CoordinationComplexEmbedded',
                'DeterminismFlagshipTest#'
        ].join()
        def flagshipTests =
                full.records.findAll {
                    it.id.toString()
                            .startsWith(
                                    flagshipClass)
                }
        def flagshipFailures =
                flagshipTests.findAll {
                    it.status == 'failed'
                }
        def flagshipSkipped =
                flagshipTests.findAll {
                    it.status == 'skipped'
                }
        String repositoryRuntimeProbeClass = [
                'blue.coordination.processor.',
                'CoordinationRepositoryRuntimeCompatibilityProbeTest#'
        ].join()
        def repositoryRuntimeProbeFailures =
                full.records.findAll {
                    it.id.toString().startsWith(
                            repositoryRuntimeProbeClass)
                            && it.status == 'failed'
                }
        def workingProbeByTest =
                workingProbes.collectEntries { probe ->
                    [(probe.test): probe]
                }
        def externalOutcomeByTest =
                external.outcomes.collectEntries { outcome ->
                    [(outcome.test): outcome]
                }
        def externalVerifierChecks = [
                noInvalidProbes:
                        external.invalidProbes == [],
                declaredCountExact:
                        external.declaredProbes.longValue()
                        == workingExpectedProbes.longValue(),
                executedCountExact:
                        external.executedProbes.longValue()
                        == workingExpectedProbes.longValue(),
                outcomesAccountedFor:
                        external.resolvedProbes.longValue()
                        + external.exactlyBlockedProbes.longValue()
                        == workingExpectedProbes.longValue()
        ]
        boolean externalVerifierGreen =
                externalVerifierChecks.values().every {
                    it == true
                }
        boolean partitionGreen =
                partition.status == 'verified'
                        && partition.observed?.full?.total
                        == workingExpectedFull.longValue()
                        && partition.observed?.working?.total
                        == workingExpectedWorking.longValue()
                        && partition.observed?.probes?.total
                        == workingExpectedProbes.longValue()
        def failuresAreExactDeclaredProbes = { failures ->
            failures.every { failure ->
                    def probe =
                            workingProbeByTest.get(
                                    failure.id)
                    def outcome =
                            externalOutcomeByTest.get(
                                    failure.id)
                    probe != null
                            && failure.failureType
                            == probe.failureType
                            && failure.logicalMessage != null
                            && failure.logicalMessage.startsWith(
                            probe.logicalMessagePrefix)
                            && outcome?.outcome
                            == 'exactly-blocked'
                }
        }
        boolean flagshipFailuresAreExactDeclaredProbes =
                failuresAreExactDeclaredProbes(
                        flagshipFailures)
        boolean repositoryRuntimeFailuresAreExactDeclaredProbes =
                repositoryRuntimeProbeFailures.size() == 3
                        && failuresAreExactDeclaredProbes(
                        repositoryRuntimeProbeFailures)
        boolean flagshipTestsGreen =
                !flagshipTests.isEmpty()
                        && flagshipTests.every {
                    it.status == 'passed'
                }
        boolean flagshipEvidenceVerified =
                flagshipTestsGreen
                        && flagshipLocality.status
                        == 'verified'
        boolean flagshipExternallyBlocked =
                !flagshipFailures.isEmpty()
                        && flagshipSkipped.isEmpty()
                        && flagshipFailures.size()
                        + flagshipTests.count {
                            it.status == 'passed'
                        }
                        == flagshipTests.size()
                        && flagshipFailuresAreExactDeclaredProbes
                        && flagshipLocality.status == 'missing'
                        && partitionGreen
                        && externalVerifierGreen
        boolean flagshipMigratedToEngineGate =
                flagshipTests.isEmpty()
                        && repositoryRuntimeFailuresAreExactDeclaredProbes
                        && flagshipLocality.status == 'missing'
                        && partitionGreen
                        && externalVerifierGreen
        flagshipExternallyBlocked =
                flagshipExternallyBlocked
                        || flagshipMigratedToEngineGate
        long flagshipExecuted =
                flagshipEvidenceVerified
                        ? flagshipLocality.matrixRows
                        : 0L
        long flagshipPassed =
                flagshipEvidenceVerified
                        ? flagshipLocality.matrixRows
                        : 0L
        String flagshipStatus =
                flagshipEvidenceVerified
                        ? 'verified'
                        : (flagshipExternallyBlocked
                        ? 'externally-blocked'
                        : flagshipLocality.status)
        Long forbiddenProviderDemandCount =
                flagshipEvidenceVerified
                        ? flagshipLocality
                        .forbiddenProviderDemandCount
                        : null
        Long forbiddenBackendLoadCount =
                flagshipEvidenceVerified
                        ? flagshipLocality
                        .forbiddenBackendLoadCount
                        : null
        String requiredTraceText =
                workingYamlScalar(
                        workingGasFixtureEvidence,
                        'compositeProofRequiredTraceEntries')
        Long requiredTraceEntries =
                requiredTraceText != null
                        && requiredTraceText ==~ /[0-9]+/
                        ? Long.valueOf(
                        requiredTraceText)
                        : null
        Long observedTraceEntries =
                workingSystemOutMetric(
                        fullDirectory,
                        'blue.coordination.processor.'
                                + 'CoordinationRuntimeGasScalingTest',
                        'coordination.'
                                + 'maximumRuntimeTraceEntriesObserved=')
        def evidenceSources = [
                fullSuite:
                        workingEvidenceSource(
                                fullDirectory),
                partition:
                        workingEvidenceSource(
                                workingPartitionReport
                                        .get().asFile),
                externalBlockers:
                        workingEvidenceSource(
                                externalProbeReport
                                        .get().asFile),
                fixedRepository:
                        workingEvidenceSource(
                                fixedFile),
                flagship:
                        workingEvidenceSource(
                                flagshipFile),
                releaseSchema:
                        workingEvidenceSource(
                                workingFinalReportSchema),
                gasFixtures:
                        workingEvidenceSource(
                                workingGasFixtureEvidence),
                conformanceManifest:
                        workingEvidenceSource(
                                workingConformanceManifest)
        ]
        def completenessChecks = [
                fullSuitePresent:
                        evidenceSources.fullSuite.status
                        == 'present',
                partitionPresent:
                        evidenceSources.partition.status
                        == 'present',
                externalBlockersPresent:
                        evidenceSources.externalBlockers.status
                        == 'present',
                fixedRepositoryPresent:
                        evidenceSources.fixedRepository.status
                        == 'present',
                flagshipEvidenceAccountedFor:
                        flagshipEvidenceVerified
                                ? evidenceSources.flagship.status
                                == 'present'
                                : flagshipExternallyBlocked
                                && evidenceSources.flagship.status
                                == 'missing',
                releaseSchemaPresent:
                        evidenceSources.releaseSchema.status
                        == 'present',
                gasFixturesPresent:
                        evidenceSources.gasFixtures.status
                        == 'present',
                conformanceManifestPresent:
                        evidenceSources.conformanceManifest.status
                        == 'present',
                fullSuiteCountExact:
                        full.total
                        == workingExpectedFull.longValue(),
                partitionVerified:
                        partitionGreen,
                externalVerifierGreen:
                        externalVerifierGreen,
                flagshipFailuresDeclared:
                        flagshipMigratedToEngineGate
                                ? repositoryRuntimeFailuresAreExactDeclaredProbes
                                : flagshipFailures.isEmpty()
                                || flagshipFailuresAreExactDeclaredProbes,
                runtimeTraceMeasured:
                        requiredTraceEntries != null
                        && observedTraceEntries != null,
                flagshipLocalityAccountedFor:
                        flagshipEvidenceVerified
                                ? flagshipLocality
                                .forbiddenProviderDemandCount
                                != null
                                && flagshipLocality
                                .forbiddenBackendLoadCount
                                != null
                                : flagshipExternallyBlocked,
                fixedRepositoryClosureMeasured:
                        fixedRequiredClosure.total
                        instanceof Number
                                && fixedRequiredClosure.verified
                                instanceof Number
                                && fixedRequiredClosure.missing
                                instanceof Number
                                && fixedRequiredClosure.invalidEvidence
                                instanceof Number
                                && fixedRequiredClosure.unavailable
                                instanceof Number,
                fixedRepositoryVersionPresent:
                        fixedRepository.repositoryVersion
                        instanceof String
        ]
        boolean evidenceComplete =
                completenessChecks.values().every {
                    it == true
                }
        def report = [
                schema:
                        'blue-coordination/'
                                + 'same-run-evidence/1.0',
                status:
                        evidenceComplete
                                ? 'complete'
                                : 'incomplete',
                fixedRepository:
                        [
                                version :
                                        fixedRepository
                                                .repositoryVersion,
                                total   :
                                        fixedRequiredClosure.total,
                                audited :
                                        fixedRequiredClosure.audited,
                                verified:
                                        fixedRequiredClosure.verified,
                                missing :
                                        fixedRequiredClosure.missing,
                                invalidEvidence:
                                        fixedRequiredClosure
                                                .invalidEvidence,
                                failed  :
                                        fixedRequiredClosure.total
                                        instanceof Number
                                                && fixedRequiredClosure
                                                .verified
                                                instanceof Number
                                                ? fixedRequiredClosure
                                                .total.longValue()
                                                - fixedRequiredClosure
                                                .verified.longValue()
                                                : null,
                                unavailable:
                                        fixedRequiredClosure.unavailable,
                                incompleteCyclicProof:
                                        fixedRequiredClosure
                                                .incompleteCyclicProof,
                                eligible:
                                        fixedRequiredClosure.eligible,
                                fullCatalog:
                                        [
                                                total   :
                                                        fixedRepository
                                                                .total,
                                                verified:
                                                        fixedRepository
                                                                .verified,
                                                failed  :
                                                        fixedRepository
                                                                .failed,
                                                status  :
                                                        fixedRepository
                                                                .status
                                        ],
                                derivedFrom:
                                        [
                                                'fixedRepository'
                                        ]
                        ],
                conformance:
                        [
                                behavior:
                                        behavior,
                                portableGas:
                                        portableGas,
                                hostQuota:
                                        hostQuota,
                                total:
                                        totalConformance,
                                packageIdentity:
                                        workingYamlScalar(
                                                workingConformanceManifest,
                                                'packageIdentity'),
                                derivedFrom:
                                        [
                                                'fullSuite',
                                                'releaseSchema',
                                                'conformanceManifest'
                                        ]
                        ],
                flagship:
                        [
                                requiredVariants:
                                        requiredFlagship,
                                executedVariants:
                                        flagshipExecuted,
                                passedVariants:
                                        flagshipPassed,
                                status:
                                        flagshipStatus,
                                exactDeclaredProbeFailures:
                                        flagshipMigratedToEngineGate
                                                ? (long) repositoryRuntimeProbeFailures
                                                .size()
                                                : (long) flagshipFailures
                                                .size(),
                                migratedToEngineGate:
                                        flagshipMigratedToEngineGate,
                                derivedFrom:
                                        [
                                                'fullSuite',
                                                'flagship',
                                                'releaseSchema'
                                        ]
                        ],
                providerLocality:
                        [
                                forbiddenProviderDemandCount:
                                        forbiddenProviderDemandCount,
                                forbiddenBackendLoadCount:
                                        forbiddenBackendLoadCount,
                                derivedFrom:
                                        [
                                                'flagship'
                                        ]
                        ],
                runtimeTrace:
                        [
                                requiredEntries:
                                        requiredTraceEntries,
                                observedEntries:
                                        observedTraceEntries,
                                passed:
                                        requiredTraceEntries != null
                                                && requiredTraceEntries
                                                == observedTraceEntries,
                                derivedFrom:
                                        [
                                                'fullSuite',
                                                'gasFixtures'
                                        ]
                        ],
                evidenceSources:
                        evidenceSources,
                completenessChecks:
                        completenessChecks,
                externalVerifierChecks:
                        externalVerifierChecks
        ]
        File target =
                workingSameRunEvidenceReport
                        .get().asFile
        target.parentFile.mkdirs()
        target.text =
                JsonOutput.prettyPrint(
                        JsonOutput.toJson(
                                report)) + '\n'
        if (!evidenceComplete) {
            throw new GradleException(
                    'Same-run Coordination evidence is incomplete; see '
                            + target)
        }
    }
}

