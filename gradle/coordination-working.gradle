def generateCoordinationSameRunEvidenceReport =
        tasks.register(
                'generateCoordinationSameRunEvidenceReport') {
    group = 'verification'
    description =
            'Derives all working-report counts from the same-run full JUnit, fixed-Repository, flagship, schema, and gas evidence.'
    dependsOn(
            coordinationFullSuitePartitionVerification)
    inputs.files(
            workingFinalReportSchema,
            workingGasFixtureEvidence,
            workingConformanceManifest)
    outputs.file(
            workingSameRunEvidenceReport)
    outputs.upToDateWhen { false }
    doLast {
        File fullDirectory =
                workingFullResults.get()
                        .asFile
        def full =
                readWorkingJUnit(
                        fullDirectory)
        def reportSchema =
                new JsonSlurper()
                        .parse(
                                workingFinalReportSchema)
        def closedProperties =
                reportSchema.allOf[0]
                        .get('then')
                        .properties
        long requiredBehavior =
                closedProperties
                        .behaviorConformance
                        .properties.required.const
                        .longValue()
        long requiredPortableGas =
                closedProperties
                        .portableGasConformance
                        .properties.required.const
                        .longValue()
        long requiredHostQuota =
                closedProperties
                        .hostQuotaConformance
                        .properties.required.const
                        .longValue()
        long requiredTotal =
                closedProperties
                        .totalConformance
                        .properties.required.const
                        .longValue()
        long requiredFlagship =
                closedProperties
                        .flagshipRuns
                        .properties.required.const
                        .longValue()
        def behavior =
                workingConformanceResult(
                        full,
                        '^blue\\.coordination\\.processor\\.'
                                + 'CoordinationBehaviorFixtureHarnessTest#'
                                + 'coord-(?:chan|e2e|fail|mand|route|'
                                + 'split|time|wf)-[0-9]+@[a-z0-9-]+$',
                        requiredBehavior)
        def portableGas =
                workingConformanceResult(
                        full,
                        '^blue\\.language\\.processor\\.'
                                + 'CoordinationDirectPortableGas'
                                + 'MicrofixtureTest#'
                                + 'shouldExecuteDirectPortableGas'
                                + 'Microfixture\\[[0-9]+\\] '
                                + 'coordination/conformance/fixtures/'
                                + 'gas-micro/[A-Za-z0-9]+\\.yaml$',
                        requiredPortableGas)
        def hostQuota =
                workingConformanceResult(
                        full,
                        '^blue\\.coordination\\.processor\\.'
                                + 'CoordinationHostQuotaFixtureTest#'
                                + 'coordination-host-[a-z0-9-]+ '
                                + '\\[[a-z0-9-]+\\.yaml\\]$',
                        requiredHostQuota)
        def totalConformance = [
                required   :
                        requiredTotal,
                executed   :
                        behavior.executed
                                + portableGas.executed
                                + hostQuota.executed,
                passed     :
                        behavior.passed
                                + portableGas.passed
                                + hostQuota.passed,
                failed     :
                        behavior.failed
                                + portableGas.failed
                                + hostQuota.failed,
                skipped    :
                        behavior.skipped
                                + portableGas.skipped
                                + hostQuota.skipped,
                notExecuted:
                        behavior.notExecuted
                                + portableGas.notExecuted
                                + hostQuota.notExecuted
        ]
        File fixedFile =
                workingFixedRepositoryEvidence
                        .get().asFile
        def fixedRepository =
                fixedFile.isFile()
                        ? new JsonSlurper()
                        .parse(
                                fixedFile)
                        : [
                        status  : 'missing',
                        total   : null,
                        verified: null,
                        failed  : null
                ]
        def fixedRequiredClosure =
                fixedRepository.requiredClosure
                instanceof Map
                        ? fixedRepository.requiredClosure
                        : [
                        eligible       : null,
                        total          : null,
                        audited        : null,
                        verified       : null,
                        missing        : null,
                        invalidEvidence: null,
                        unavailable    : null,
                        incompleteCyclicProof:
                                null
                ]
        File flagshipFile =
                workingFlagshipEvidence
                        .get().asFile
        def flagshipLocality =
                project.ext
                        .coordinationReleaseReadFlagshipLocality
                        .call(
                                flagshipFile)
        String flagshipClass =
                'blue.coordination.processor.'
                        + 'CoordinationComplexEmbedded'
                        + 'DeterminismFlagshipTest#'
        def flagshipTests =
                full.records.findAll {
                    it.id.toString()
                            .startsWith(
                                    flagshipClass)
                }
        boolean flagshipTestsGreen =
                !flagshipTests.isEmpty()
                        && flagshipTests.every {
                    it.status == 'passed'
                }
        long flagshipPassed =
                flagshipTestsGreen
                        && flagshipLocality.status
                        == 'verified'
                        ? flagshipLocality.matrixRows
                        : 0L
        String requiredTraceText =
                workingYamlScalar(
                        workingGasFixtureEvidence,
                        'compositeProofRequiredTraceEntries')
        Long requiredTraceEntries =
                requiredTraceText != null
                        && requiredTraceText ==~ /[0-9]+/
                        ? Long.valueOf(
                        requiredTraceText)
                        : null
        Long observedTraceEntries =
                workingSystemOutMetric(
                        fullDirectory,
                        'blue.coordination.processor.'
                                + 'CoordinationRuntimeGasScalingTest',
                        'coordination.'
                                + 'maximumRuntimeTraceEntriesObserved=')
        def evidenceSources = [
                fullSuite:
                        workingEvidenceSource(
                                fullDirectory),
                partition:
                        workingEvidenceSource(
                                workingPartitionReport
                                        .get().asFile),
                fixedRepository:
                        workingEvidenceSource(
                                fixedFile),
                flagship:
                        workingEvidenceSource(
                                flagshipFile),
                releaseSchema:
                        workingEvidenceSource(
                                workingFinalReportSchema),
                gasFixtures:
                        workingEvidenceSource(
                                workingGasFixtureEvidence),
                conformanceManifest:
                        workingEvidenceSource(
                                workingConformanceManifest)
        ]
        boolean evidenceComplete =
                evidenceSources.fullSuite.status
                        == 'present'
                        && evidenceSources.partition.status
                        == 'present'
                        && evidenceSources.fixedRepository.status
                        == 'present'
                        && evidenceSources.flagship.status
                        == 'present'
                        && evidenceSources.releaseSchema.status
                        == 'present'
                        && evidenceSources.gasFixtures.status
                        == 'present'
                        && evidenceSources
                        .conformanceManifest.status
                        == 'present'
                        && full.total == 899L
                        && requiredTraceEntries != null
                        && observedTraceEntries != null
                        && flagshipLocality
                        .forbiddenProviderDemandCount
                        != null
                        && flagshipLocality
                        .forbiddenBackendLoadCount
                        != null
                        && fixedRequiredClosure.total
                        instanceof Number
                        && fixedRequiredClosure.verified
                        instanceof Number
                        && fixedRequiredClosure.missing
                        instanceof Number
                        && fixedRequiredClosure.invalidEvidence
                        instanceof Number
                        && fixedRequiredClosure.unavailable
                        instanceof Number
                        && fixedRepository.repositoryVersion
                        instanceof String
        def report = [
                schema:
                        'blue-coordination/'
                                + 'same-run-evidence/1.0',
                status:
                        evidenceComplete
                                ? 'complete'
                                : 'incomplete',
                fixedRepository:
                        [
                                version :
                                        fixedRepository
                                                .repositoryVersion,
                                total   :
                                        fixedRequiredClosure.total,
                                audited :
                                        fixedRequiredClosure.audited,
                                verified:
                                        fixedRequiredClosure.verified,
                                missing :
                                        fixedRequiredClosure.missing,
                                invalidEvidence:
                                        fixedRequiredClosure
                                                .invalidEvidence,
                                unavailable:
                                        fixedRequiredClosure.unavailable,
                                incompleteCyclicProof:
                                        fixedRequiredClosure
                                                .incompleteCyclicProof,
                                eligible:
                                        fixedRequiredClosure.eligible,
                                fullCatalog:
                                        [
                                                total   :
                                                        fixedRepository
                                                                .total,
                                                verified:
                                                        fixedRepository
                                                                .verified,
                                                failed  :
                                                        fixedRepository
                                                                .failed,
                                                status  :
                                                        fixedRepository
                                                                .status
                                        ],
                                derivedFrom:
                                        [
                                                'fixedRepository'
                                        ]
                        ],
                conformance:
                        [
                                behavior:
                                        behavior,
                                portableGas:
                                        portableGas,
                                hostQuota:
                                        hostQuota,
                                total:
                                        totalConformance,
                                packageIdentity:
                                        workingYamlScalar(
                                                workingConformanceManifest,
                                                'packageIdentity'),
                                derivedFrom:
                                        [
                                                'fullSuite',
                                                'releaseSchema',
                                                'conformanceManifest'
                                        ]
                        ],
                flagship:
                        [
                                requiredVariants:
                                        requiredFlagship,
                                executedVariants:
                                        flagshipLocality.matrixRows,
                                passedVariants:
                                        flagshipPassed,
                                status:
                                        flagshipLocality.status,
                                derivedFrom:
                                        [
                                                'fullSuite',
                                                'flagship',
                                                'releaseSchema'
                                        ]
                        ],
                providerLocality:
                        [
                                forbiddenProviderDemandCount:
                                        flagshipLocality
                                                .forbiddenProviderDemandCount,
                                forbiddenBackendLoadCount:
                                        flagshipLocality
                                                .forbiddenBackendLoadCount,
                                derivedFrom:
                                        [
                                                'flagship'
                                        ]
                        ],
                runtimeTrace:
                        [
                                requiredEntries:
                                        requiredTraceEntries,
                                observedEntries:
                                        observedTraceEntries,
                                passed:
                                        requiredTraceEntries != null
                                                && requiredTraceEntries
                                                == observedTraceEntries,
                                derivedFrom:
                                        [
                                                'fullSuite',
                                                'gasFixtures'
                                        ]
                        ],
                evidenceSources:
                        evidenceSources
        ]
        File target =
                workingSameRunEvidenceReport
                        .get().asFile
        target.parentFile.mkdirs()
        target.text =
                JsonOutput.prettyPrint(
                        JsonOutput.toJson(
                                report)) + '\n'
        if (!evidenceComplete) {
            throw new GradleException(
                    'Same-run Coordination evidence is incomplete; see '
                            + target)
        }
    }
}

