def workingBlueRepositoryCompositePath =
        (providers.gradleProperty('blueRepositoryCompositePath')
                .orNull
                ?: System.getProperty(
                        'org.gradle.project.blueRepositoryCompositePath'))
                ?.trim()
if (workingBlueRepositoryCompositePath == null
        || workingBlueRepositoryCompositePath.isEmpty()) {
    throw new GradleException(
            'The exact locked local Repository composite path is missing.')
}
def workingBlueRepositoryComposite =
        file(workingBlueRepositoryCompositePath).canonicalFile
if (!workingBlueRepositoryComposite.isDirectory()) {
    throw new GradleException(
            'The exact locked local Repository composite is missing: '
                    + workingBlueRepositoryComposite)
}

def workingCatalogFile =
        file('gradle/coordination-external-blockers.json')
def workingSiblingInputsEvidence =
        layout.buildDirectory.file(
                'reports/latest-language-embedded-collections/'
                        + 'sibling-inputs.json')
def workingResolvedDependencyLockEvidence =
        layout.buildDirectory.file(
                'reports/latest-language-embedded-collections/'
                        + 'resolved-dependency-lock.json')
def workingSiblingLockFile =
        file('gradle/blue-sibling-lock.properties')
def workingSiblingLock = new Properties()
workingSiblingLockFile.withInputStream {
    workingSiblingLock.load(it)
}
def workingCatalog =
        new JsonSlurper().parse(workingCatalogFile)
def workingBlockers =
        workingCatalog.blockers as List
if (workingCatalog.schema
        != 'blue-coordination/external-blockers/1.2') {
    throw new GradleException(
            'Unsupported Coordination external-blocker catalog schema: '
                    + workingCatalog.schema)
}
def workingExpectedSuite =
        workingCatalog.expectedSuite
def workingExpectedFull =
        workingExpectedSuite?.full
def workingExpectedWorking =
        workingExpectedSuite?.working
def workingExpectedProbes =
        workingExpectedSuite?.probes
if (!(workingExpectedFull instanceof Number)
        || !(workingExpectedWorking instanceof Number)
        || !(workingExpectedProbes instanceof Number)
        || workingExpectedFull.longValue() <= 0L
        || workingExpectedWorking.longValue() < 0L
        || workingExpectedProbes.longValue() < 0L
        || workingExpectedFull.longValue()
        != workingExpectedWorking.longValue()
        + workingExpectedProbes.longValue()) {
    throw new GradleException(
            'The external-blocker catalog must declare one exact '
                    + 'full = working + probes suite partition.')
}
def workingFingerprints =
        workingBlockers.collect {
            [
                    failureType:
                            it.failureType,
                    logicalMessagePrefix:
                            it.logicalMessagePrefix
            ]
        }
if (workingFingerprints.any {
    !(it.failureType instanceof String)
            || it.failureType.trim().isEmpty()
            || !(it.logicalMessagePrefix instanceof String)
            || it.logicalMessagePrefix.trim().isEmpty()
}
        || workingFingerprints.toSet().size()
        != workingFingerprints.size()) {
    throw new GradleException(
            'Every external-blocker family must declare one unique, '
                    + 'non-empty failureType/logicalMessagePrefix pair.')
}
def workingProbes =
        workingBlockers.collectMany { blocker ->
            blocker.probes.collect { probe ->
                [
                        blockerId     : blocker.id,
                        owner         : blocker.owner,
                        category      : blocker.category,
                        test          : probe.test,
                        failureType:
                                blocker.failureType,
                        logicalMessagePrefix:
                                blocker.logicalMessagePrefix
                ]
            }
        }
if (workingProbes.size()
        != workingExpectedProbes.longValue()
        || workingProbes.collect {
            it.test
        }.toSet().size()
        != workingExpectedProbes.longValue()
        || workingBlockers.any { blocker ->
            !(blocker.probes instanceof List)
                    || blocker.probes.isEmpty()
                    || blocker.probes.any { probe ->
                !(probe instanceof Map)
                        || probe.keySet()
                        != (['test'] as Set)
                        || !(probe.test instanceof String)
                        || probe.test.trim().isEmpty()
            }
        }) {
    throw new GradleException(
            'The external-blocker catalog must contain exactly '
                    + workingExpectedProbes + ' '
                    + 'unique, test-only probe declarations.')
}
if (workingBlockers.any { blocker ->
    !(blocker.id instanceof String)
            || blocker.id.trim().isEmpty()
            || blocker.owner != 'blue-repository-java'
            || blocker.status != 'open'
            || !(blocker.category instanceof String)
            || blocker.category.trim().isEmpty()
            || !(blocker.reproductionCommand instanceof String)
            || blocker.reproductionCommand.trim().isEmpty()
            || !(blocker.notes instanceof String)
            || blocker.notes.trim().isEmpty()
            || !(blocker.firstObservedAgainst instanceof Map)
            || blocker.firstObservedAgainst.commit
            != workingSiblingLock.getProperty('blueRepositoryCommit')
            || blocker.firstObservedAgainst.version
            != workingSiblingLock.getProperty('blueRepositoryLocalVersion')
}) {
    throw new GradleException(
            'Every open external blocker must be bound to the exact locked '
                    + 'Repository commit and local version.')
}
def workingBehaviorFixtureClass =
        'blue.coordination.processor.CoordinationBehaviorFixtureHarnessTest'
def workingBehaviorFixtureMethod =
        'blue.coordination.processor.CoordinationBehaviorFixtureHarnessTest.' +
                'shouldExecuteOneAuthoredBehaviorCaseAgainstProductionApis'
def workingDeepLocalityClass =
        'blue.coordination.processor.CoordinationDocumentSplitterDeepLocalityTest'
def workingDeepLocalityMethod =
        'blue.coordination.processor.CoordinationDocumentSplitterDeepLocalityTest.' +
                'shouldDemandOnlySelectedChainsAndAllowListedBodies'
def workingProbeClass = { probe ->
    probe.test.substring(
            0, probe.test.indexOf('#'))
}
def workingProbeName = { probe ->
    probe.test.substring(
            probe.test.indexOf('#') + 1)
}
def workingDynamicProbes =
        workingProbes.findAll { probe ->
            workingProbeClass(probe)
                    == workingBehaviorFixtureClass
                    && workingProbeName(probe)
                    .startsWith('coord-')
                    && workingProbeName(probe)
                    .contains('@')
        }
def workingDynamicCaseIds =
        workingDynamicProbes.collect {
            workingProbeName(it)
        }
def workingDeepLocalityParameterizedProbes =
        workingProbes.findAll { probe ->
            workingProbeClass(probe)
                    == workingDeepLocalityClass
                    && !workingProbeName(probe)
                    .startsWith('should')
        }
def workingInitializationErrorProbes =
        workingProbes.findAll { probe ->
            workingProbeName(probe)
                    == 'initializationError'
        }
def workingSpecialProbes =
        (workingDynamicProbes
                + workingDeepLocalityParameterizedProbes
                + workingInitializationErrorProbes)
                .toSet()
def workingStandardProbes =
        workingProbes.findAll { probe ->
            !workingSpecialProbes.contains(probe)
        }
def workingStandardSelectors =
        workingStandardProbes.collect { probe ->
            probe.test.replace('#', '.')
        }.toSet()
def workingParameterizedSelectors =
        new LinkedHashSet<String>()
if (!workingDynamicProbes.isEmpty()) {
    workingParameterizedSelectors.add(
            workingBehaviorFixtureMethod)
}
if (!workingDeepLocalityParameterizedProbes.isEmpty()) {
    workingParameterizedSelectors.add(
            workingDeepLocalityMethod)
}
def workingInitializationErrorClassSelectors =
        workingInitializationErrorProbes.collect { probe ->
            workingProbeClass(probe)
        }.toSet()
def workingProbeSelectors =
        new LinkedHashSet<String>()
workingProbeSelectors.addAll(
        workingStandardSelectors)
workingProbeSelectors.addAll(
        workingParameterizedSelectors)
workingProbeSelectors.addAll(
        workingInitializationErrorClassSelectors)

def workingFixtureProbes =
        workingProbes.findAll { probe ->
            workingProbeClass(probe)
                    == workingBehaviorFixtureClass
        }
if (workingFixtureProbes.size()
        != workingDynamicProbes.size()
        + workingFixtureProbes.count { probe ->
            workingProbeName(probe)
                    .startsWith('should')
        }) {
    throw new GradleException(
            'Every authored behavior probe must be either one exact '
                    + 'coord-...@... case ID or one exact should... method.')
}

def configureWorkingTest = { Test testTask ->
    testTask.group = 'verification'
    testTask.testClassesDirs =
            sourceSets.test.output.classesDirs
    testTask.classpath =
            sourceSets.test.runtimeClasspath
    testTask.dependsOn tasks.named('testClasses')
    testTask.useJUnitPlatform()
    testTask.maxHeapSize = '2g'
    testTask.maxParallelForks = 1
    testTask.forkEvery = 0L
    testTask.javaLauncher =
            javaToolchains.launcherFor {
                languageVersion =
                        JavaLanguageVersion.of(8)
            }
    testTask.reports {
        junitXml.required = true
        html.required = true
    }
    testTask.outputs.upToDateWhen { false }
    testTask.testLogging {
        events 'PASSED', 'FAILED', 'SKIPPED'
        showStandardStreams = true
    }
}

def coordinationWorkingEvidenceTest =
        tasks.register(
                'coordinationWorkingEvidenceTest',
                Test) { workingTest ->
    description =
            'Captures the complete Coordination-owned test surface while excluding only catalogued exact probes.'
    configureWorkingTest(workingTest)
    workingTest.ignoreFailures = true
    workingTest.systemProperty(
            'coordination.behavior.excludeCaseIds',
            workingDynamicCaseIds.join(','))
    workingTest.systemProperty(
            'coordination.fixed.repository.report',
            layout.buildDirectory.file(
                    'reports/coordination-working/'
                            + 'working-fixed-repository.json')
                    .get().asFile.absolutePath)
    workingTest.systemProperty(
            'coordination.flagship.report',
            layout.buildDirectory.file(
                    'reports/coordination-working/'
                            + 'working-flagship-trace.md')
                    .get().asFile.absolutePath)
    workingTest.filter {
        includeTestsMatching('*')
        workingProbeSelectors.each { selector ->
            excludeTestsMatching(
                    selector)
        }
    }
}

def coordinationExternalBlockerProbeEvidenceTest =
        tasks.register(
                'coordinationExternalBlockerProbeEvidenceTest',
                Test) { probeTest ->
    description =
            'Executes every exact external-blocker probe and retains failures for fingerprint verification.'
    configureWorkingTest(probeTest)
    probeTest.ignoreFailures = true
    probeTest.systemProperty(
            'coordination.behavior.includeCaseIds',
            workingDynamicCaseIds.join(','))
    probeTest.systemProperty(
            'coordination.fixed.repository.report',
            layout.buildDirectory.file(
                    'reports/coordination-working/'
                            + 'probe-fixed-repository.json')
                    .get().asFile.absolutePath)
    probeTest.systemProperty(
            'coordination.flagship.report',
            layout.buildDirectory.file(
                    'reports/coordination-working/'
                            + 'probe-flagship-trace.md')
                    .get().asFile.absolutePath)
    probeTest.filter {
        if (workingProbes.isEmpty()) {
            includeTestsMatching(
                    '__coordination_no_external_blockers__')
            setFailOnNoMatchingTests(false)
        } else {
            workingProbeSelectors.each { selector ->
                includeTestsMatching(
                        selector)
            }
        }
    }
}

def normalizedWorkingTestId = {
    String className,
    String name ->
        String normalizedName =
                name != null
                        && name.endsWith('()')
                        ? name.substring(
                        0, name.length() - 2)
                        : name
        def dynamic =
                normalizedName == null
                        ? null
                        : (normalizedName =~
                        /^[0-9]+: (.+)$/)
        if (dynamic != null
                && dynamic.matches()
                && className
                == 'blue.coordination.processor.'
                + 'CoordinationBehaviorFixtureHarnessTest') {
            normalizedName =
                    dynamic.group(1)
        }
        className + '#' + normalizedName
}

def readWorkingJUnit = { File directory ->
    def records =
            new ArrayList<Map<String, Object>>()
    fileTree(directory) {
        include 'TEST-*.xml'
    }.files.sort { left, right ->
        left.name <=> right.name
    }.each { resultFile ->
        def suite =
                new XmlSlurper(
                        false, false)
                        .parse(resultFile)
        suite.testcase.each { testCase ->
            def failure =
                    testCase.failure.size() > 0
                            ? testCase.failure[0]
                            : (testCase.error.size() > 0
                            ? testCase.error[0]
                            : null)
            String status =
                    failure != null
                            ? 'failed'
                            : (testCase.skipped.size() > 0
                            ? 'skipped'
                            : 'passed')
            String failureType =
                    failure == null
                            ? null
                            : failure.@type
                            .toString()
            String rawMessage =
                    failure == null
                            ? null
                            : failure.@message
                            .toString()
            String logicalMessage =
                    rawMessage
            if (logicalMessage != null
                    && failureType != null
                    && !failureType.isEmpty()) {
                String wrapper =
                        failureType + ': '
                if (logicalMessage.startsWith(
                        wrapper)) {
                    logicalMessage =
                            logicalMessage.substring(
                                    wrapper.length())
                }
            }
            records.add([
                    id     :
                            normalizedWorkingTestId(
                                    testCase.@classname
                                            .toString(),
                                    testCase.@name
                                            .toString()),
                    status : status,
                    failureType:
                            failureType,
                    message:
                            rawMessage,
                    logicalMessage:
                            logicalMessage,
                    resultFile:
                            resultFile.absolutePath
            ])
        }
    }
    records.sort { left, right ->
        left.id <=> right.id
    }
    long failed =
            records.count {
                it.status == 'failed'
            }
    long skipped =
            records.count {
                it.status == 'skipped'
            }
    [
            total  : (long) records.size(),
            passed : (long) records.size()
                    - failed - skipped,
            failed : failed,
            skipped: skipped,
            records: records
    ]
}

def externalProbeReport =
        layout.buildDirectory.file(
                'reports/coordination-working/'
                        + 'external-blockers.json')

def coordinationExternalBlockerProbeTest =
        tasks.register(
                'coordinationExternalBlockerProbeTest') {
    group = 'verification'
    description =
            'Accepts each exact blocker probe only when it passes or reproduces its declared diagnostic.'
    dependsOn coordinationExternalBlockerProbeEvidenceTest
    inputs.file(workingCatalogFile)
    outputs.file(externalProbeReport)
    outputs.upToDateWhen { false }
    doLast {
        def evidence =
                readWorkingJUnit(
                        file(
                                'build/test-results/'
                                        + 'coordinationExternal'
                                        + 'BlockerProbeEvidenceTest'))
        def byId =
                new LinkedHashMap<String, Object>()
        evidence.records.each { record ->
            if (byId.put(
                    record.id, record) != null) {
                throw new GradleException(
                        'Duplicate external probe result: '
                                + record.id)
            }
        }
        def outcomes =
                new ArrayList<Map<String, Object>>()
        def invalid =
                new ArrayList<String>()
        workingProbes.each { probe ->
            def record =
                    byId.remove(probe.test)
            String outcome
            if (record == null) {
                outcome = 'missing'
                invalid.add(
                        probe.test + ': missing')
            } else if (record.status
                    == 'passed') {
                outcome = 'resolved'
            } else if (record.status
                    == 'failed'
                    && record.failureType
                    == probe.failureType
                    && record.logicalMessage != null
                    && record.logicalMessage.startsWith(
                    probe.logicalMessagePrefix)) {
                outcome = 'exactly-blocked'
            } else {
                outcome = 'invalid'
                invalid.add(
                        probe.test
                                + ': expected failure type '
                                + probe.failureType
                                + ' and logical-message prefix '
                                + probe.logicalMessagePrefix
                                + ' but observed '
                                + record)
            }
            outcomes.add([
                    blockerId:
                            probe.blockerId,
                    owner    : probe.owner,
                    category : probe.category,
                    test     : probe.test,
                    expectedFailureType:
                            probe.failureType,
                    expectedLogicalMessagePrefix:
                            probe.logicalMessagePrefix,
                    outcome  : outcome,
                    failureType:
                            record == null
                                    ? null
                                    : record.failureType,
                    message  :
                            record == null
                                    ? null
                                    : record.message,
                    logicalMessage:
                            record == null
                                    ? null
                                    : record.logicalMessage
            ])
        }
        if (!byId.isEmpty()) {
            invalid.add(
                    'Unexpected probe results: '
                            + byId.keySet())
        }
        def report = [
                schema          :
                        'blue-coordination/'
                                + 'external-blocker-report/1.0',
                catalogSchema   :
                        workingCatalog.schema,
                declaredProbes  :
                        (long) workingProbes.size(),
                executedProbes  :
                        evidence.total,
                resolvedProbes  :
                        (long) outcomes.count {
                            it.outcome == 'resolved'
                        },
                exactlyBlockedProbes:
                        (long) outcomes.count {
                            it.outcome == 'exactly-blocked'
                        },
                invalidProbes   :
                        Collections.unmodifiableList(
                                invalid),
                outcomes        : outcomes
        ]
        File target =
                externalProbeReport.get()
                        .asFile
        target.parentFile.mkdirs()
        target.text =
                JsonOutput.prettyPrint(
                        JsonOutput.toJson(
                                report)) + '\n'
        if (!invalid.isEmpty()
                || evidence.skipped != 0L
                || evidence.total
                != workingProbes.size()) {
            throw new GradleException(
                    'External blocker probes changed; see '
                            + target)
        }
    }
}

def coordinationWorkingTest =
        tasks.register(
                'coordinationWorkingTest') {
    group = 'verification'
    description =
            'Fails for every Coordination-owned, fixture-owned, unclassified, or skipped working-surface test.'
    dependsOn coordinationWorkingEvidenceTest
    doLast {
        def evidence =
                readWorkingJUnit(
                        file(
                                'build/test-results/'
                                        + 'coordinationWorking'
                                        + 'EvidenceTest'))
        if (evidence.failed != 0L
                || evidence.skipped != 0L
                || evidence.total == 0L) {
            def failures =
                    evidence.records.findAll {
                        it.status != 'passed'
                    }
            throw new GradleException(
                    'Coordination working test surface is red: '
                            + failures)
        }
    }
}

def workingSha256 = { File source ->
    if (source == null
            || !source.isFile()) {
        return null
    }
    def digest =
            java.security.MessageDigest
                    .getInstance('SHA-256')
    source.withInputStream { input ->
        byte[] buffer = new byte[8192]
        int read
        while ((read = input.read(buffer)) >= 0) {
            if (read > 0) {
                digest.update(
                        buffer, 0, read)
            }
        }
    }
    digest.digest().collect {
        String.format(
                java.util.Locale.ROOT,
                '%02x',
                it & 0xff)
    }.join()
}

def workingGit = {
    File directory,
    String... arguments ->
        def command =
                new ArrayList<String>()
        command.add('git')
        command.addAll(
                Arrays.asList(arguments))
        Process process =
                new ProcessBuilder(command)
                        .directory(directory)
                        .redirectErrorStream(true)
                        .start()
        String output =
                process.inputStream
                        .getText('UTF-8')
                        .trim()
        if (process.waitFor() != 0) {
            throw new GradleException(
                    "Git command failed: ${command}\n"
                            + output)
        }
        output
}

def workingPlainJar = { File directory ->
    def jars =
            fileTree(
                    new File(
                            directory,
                            'build/libs')) {
                include '*.jar'
                exclude '*-sources.jar'
                exclude '*-javadoc.jar'
                exclude '*-tests.jar'
            }.files.sort {
                it.name
            }
    jars.isEmpty()
            ? null
            : jars.last()
}

def workingSourceState = { File directory ->
    String status =
            workingGit(
                    directory,
                    'status',
                    '--porcelain')
    [
            state:
                    status.isEmpty()
                            ? 'clean'
                            : 'dirty',
            entries:
                    status.isEmpty()
                            ? 0L
                            : (long) status
                            .readLines()
                            .size()
    ]
}

def workingEvidenceSource = { File source ->
    if (source == null) {
        return [
                path  : null,
                sha256: null,
                files : 0L,
                status: 'missing'
        ]
    }
    if (source.isFile()) {
        return [
                path  : source.absolutePath,
                sha256: workingSha256(source),
                files : 1L,
                status: 'present'
        ]
    }
    if (!source.isDirectory()) {
        return [
                path  : source.absolutePath,
                sha256: null,
                files : 0L,
                status: 'missing'
        ]
    }
    def entries =
            fileTree(source) {
                include 'TEST-*.xml'
            }.files.collect { evidenceFile ->
                [
                        source  : evidenceFile,
                        relative:
                                source.toPath()
                                        .relativize(
                                                evidenceFile.toPath())
                                        .toString()
                                        .replace(
                                                File.separatorChar,
                                                '/' as char)
                ]
            }.sort { left, right ->
                left.relative <=> right.relative
            }
    if (entries.isEmpty()) {
        return [
                path  : source.absolutePath,
                sha256: null,
                files : 0L,
                status: 'missing'
        ]
    }
    def digest =
            java.security.MessageDigest
                    .getInstance('SHA-256')
    entries.each { entry ->
        digest.update(
                entry.relative.getBytes(
                        'UTF-8'))
        digest.update(0 as byte)
        entry.source.withInputStream { input ->
            byte[] buffer = new byte[8192]
            int read
            while ((read = input.read(buffer)) >= 0) {
                if (read > 0) {
                    digest.update(
                            buffer, 0, read)
                }
            }
        }
        digest.update(0 as byte)
    }
    [
            path  : source.absolutePath,
            sha256:
                    digest.digest().collect {
                        String.format(
                                java.util.Locale.ROOT,
                                '%02x',
                                it & 0xff)
                    }.join(),
            files : (long) entries.size(),
            status: 'present'
    ]
}

def workingInventory = {
    List<Map<String, Object>> records ->
        def inventory =
                new TreeMap<String, Long>()
        records.each { record ->
            String id =
                    record.id.toString()
            inventory.put(
                    id,
                    (inventory.get(id)
                            ?: 0L) + 1L)
        }
        inventory
}

def workingInventoryDifference = {
    Map<String, Long> left,
    Map<String, Long> right ->
        def difference =
                new TreeMap<String, Long>()
        left.each { id, count ->
            long remaining =
                    count - (right.get(id)
                            ?: 0L)
            if (remaining > 0L) {
                difference.put(
                        id, remaining)
            }
        }
        difference
}

def workingInventorySum = {
    Map<String, Long> left,
    Map<String, Long> right ->
        def sum =
                new TreeMap<String, Long>()
        [left, right].each { inventory ->
            inventory.each { id, count ->
                sum.put(
                        id,
                        (sum.get(id)
                                ?: 0L) + count)
            }
        }
        sum
}

