                        workingSiblingLock.getProperty(
                                'blueBexCoreJarSha256'),
                'blue.bex:blue-bex-contracts':
                        workingSiblingLock.getProperty(
                                'blueBexContractsJarSha256'),
                'blue.repo:blue-repo-java':
                        workingSiblingLock.getProperty(
                                'blueRepositoryJarSha256')
        ]
        def expectedProjectComponents = [
                'blue.language:blue-language-model':
                        [build: ':blue-language-java', project: ':blue-language-model'],
                'blue.language:blue-language-core':
                        [build: ':blue-language-java', project: ':blue-language-core'],
                'blue.language:blue-language-mapping':
                        [build: ':blue-language-java', project: ':blue-language-mapping'],
                'blue.language:blue-contracts-core':
                        [build: ':blue-language-java', project: ':blue-contracts-core'],
                'blue.bex:blue-bex-core':
                        [build: ':blue-bex-java', project: ':blue-bex-core'],
                'blue.bex:blue-bex-contracts':
                        [build: ':blue-bex-java', project: ':blue-bex-contracts']
        ]
        boolean dependencyTopologyVerified =
                resolvedDependencyLock?.schema
                == 'blue-coordination/latest-blue-dependency-lock/1.0'
                        && resolvedDependencyLock?.status == 'verified'
                        && resolvedDependencyLock?.mode == 'local-composite'
                        && resolvedDependencyLock?.aggregateRetention
                        == [language: 'not-selected', bex: 'not-selected']
                        && (resolvedDependencyLock?.resolvedComponents
                        ?.keySet() as Set) == expectedDependencyCoordinates
                        && (resolvedDependencyLock?.artifacts
                        ?.keySet() as Set) == expectedDependencyCoordinates
                        && siblingInputs?.schema
                        == 'blue-coordination/latest-blue-sibling-inputs/1.0'
                        && siblingInputs?.status == 'verified'
                        && siblingInputs?.packageIdentities?.languageRegistry
                        == workingSiblingLock.getProperty(
                        'blueLanguageRegistrySha256')
                        && siblingInputs?.packageIdentities?.contractsRegistry
                        == workingSiblingLock.getProperty(
                        'blueContractsRegistrySha256')
                        && siblingInputs?.failures == []
                        && resolvedDependencyLock?.siblingInputReceipt?.sha256
                        == workingSha256(siblingInputsFile)
        def dependencyCoordinates =
                new TreeMap<String, Object>()
        expectedDependencyCoordinates.sort().each { coordinate ->
            def component = resolvedDependencyLock.resolvedComponents
                    .get(coordinate)
            def artifact = resolvedDependencyLock.artifacts
                    .get(coordinate)
            File artifactFile = file(artifact.file.toString())
            boolean artifactVerified = artifactFile.isFile()
                    && artifact.sha256
                    == expectedDependencyHashes.get(coordinate)
                    && workingSha256(artifactFile) == artifact.sha256
            def expectedProject = expectedProjectComponents.get(coordinate)
            boolean componentVerified = expectedProject == null
                    ? component.componentType.toString()
                    .endsWith('ModuleComponentIdentifier')
                    && component.selectedVersion
                    == workingSiblingLock.getProperty(
                    'blueRepositoryLocalVersion')
                    : component.componentType.toString()
                    .endsWith('ProjectComponentIdentifier')
                    && component.buildPath == expectedProject.build
                    && component.projectPath == expectedProject.project
            dependencyTopologyVerified = dependencyTopologyVerified
                    && artifactVerified
                    && componentVerified
            dependencyCoordinates.put(
                    coordinate,
                    [
                            selectedVersion: component.selectedVersion,
                            componentType : component.componentType,
                            buildPath     : component.buildPath,
                            projectPath   : component.projectPath,
                            artifact      : artifactFile.absolutePath,
                            artifactSha256: artifact.sha256,
                            verified      : artifactVerified
                                    && componentVerified
                    ])
        }
        def blockedOutcomes =
                external.outcomes.findAll {
                    it.outcome
                    == 'exactly-blocked'
                }
        boolean workingEligible =
                workingTests.failed == 0L
                        && workingTests.skipped == 0L
                        && external.invalidProbes
                        .isEmpty()
                        && sameRun.status == 'complete'
                        && partition.status == 'verified'
                        && dependencyTopologyVerified
                        && coordinationJar.isFile()
                        && sourcesJar.isFile()
                        && javadocJar.isFile()
                        && sourceArchive.isFile()
        def coordinationCoordinate = [
                commit     :
                        workingGit(
                                projectDir,
                                'rev-parse',
                                'HEAD'),
                version    :
                        project.version
                                .toString(),
                sourceState:
                        workingSourceState(
                                projectDir),
                jar        :
                        coordinationJar
                                .absolutePath,
                jarSha256  :
                        workingSha256(
                                coordinationJar)
        ]
        def dependencyLock = [
                schema      :
                        'blue-coordination/'
                                + 'local-dependency-lock/2.0',
                version     : 2,
                coordination:
                        coordinationCoordinate,
                dependencies:
                        dependencyCoordinates,
                sourceReceipts:
                        [
                                resolvedDependencyLock: [
                                        path  : resolvedDependencyLockFile.absolutePath,
                                        sha256: workingSha256(resolvedDependencyLockFile)
                                ],
                                siblingInputs: [
                                        path  : siblingInputsFile.absolutePath,
                                        sha256: workingSha256(siblingInputsFile)
                                ]
                        ]
        ]
        File dependencyLockTarget =
                workingDependencyLock.get()
                        .asFile
        dependencyLockTarget.parentFile.mkdirs()
        dependencyLockTarget.text =
                JsonOutput.prettyPrint(
                        JsonOutput.toJson(
                                dependencyLock)) + '\n'
        def report = [
                schema :
                        'blue-coordination/'
                                + 'working-report/1.0',
                version: 1,
                workingEligible:
                        workingEligible,
                publicReleaseEligible:
                        false,
                coordination:
                        coordinationCoordinate,
                dependencies:
                        dependencyCoordinates,
                dependencyTopology:
                        [
                                status: dependencyTopologyVerified
                                        ? 'verified'
                                        : 'invalid',
                                aggregateRetention:
                                        resolvedDependencyLock.aggregateRetention,
                                resolvedDependencyLockSha256:
                                        workingSha256(resolvedDependencyLockFile),
                                siblingInputsSha256:
                                        workingSha256(siblingInputsFile)
                        ],
                fixedRepository: [
                        version :
                                sameRun
                                        .fixedRepository
                                        .version,
                        verified:
                                sameRun
                                        .fixedRepository
                                        .verified,
                        total   :
                                sameRun
                                        .fixedRepository
                                        .total,
                        failed  :
                                sameRun
                                        .fixedRepository
                                        .failed
                ],
                workingTests: [
                        total  :
                                workingTests.total,
                        passed :
                                workingTests.passed,
                        failed :
                                workingTests.failed,
                        skipped:
                                workingTests.skipped
                ],
                externalProbes: [
                        declared:
                                external.declaredProbes,
                        executed:
                                external.executedProbes,
                        resolved:
                                external.resolvedProbes,
                        blocked :
                                external.exactlyBlockedProbes,
                        invalid :
                                external.invalidProbes
                                        .size()
                ],
                coordinationOwnedFailures:
                        [],
                fixtureFailures:
                        [],
                externalBlockers:
                        workingBlockers.collect {
                            blocker ->
                                [
                                        id    :
                                                blocker.id,
                                        owner :
                                                blocker.owner,
                                        status:
                                                blockedOutcomes.any {
                                                    it.blockerId
                                                    == blocker.id
                                                }
                                                        ? 'open'
                                                        : 'resolved'
                                ]
                        },
                unclassifiedFailures:
                        [],
                conformance:
                        [
                                executable:
                                        sameRun.conformance
                                                .total.passed,
                                required:
                                        sameRun.conformance
                                                .total.required,
                                behavior:
                                        [
                                                executable:
                                                        sameRun.conformance
                                                                .behavior
                                                                .passed,
                                                required:
                                                        sameRun.conformance
                                                                .behavior
                                                                .required
                                        ],
                                portableGas:
                                        [
                                                executable:
                                                        sameRun.conformance
                                                                .portableGas
                                                                .passed,
                                                required:
                                                        sameRun.conformance
                                                                .portableGas
                                                                .required
                                        ],
                                hostQuota:
                                        [
                                                executable:
                                                        sameRun.conformance
                                                                .hostQuota
                                                                .passed,
                                                required:
                                                        sameRun.conformance
                                                                .hostQuota
                                                                .required
                                        ],
                                packageIdentity:
                                        sameRun.conformance
                                                .packageIdentity,
                                sameRunResult:
                                        sameRun.conformance
                        ],
                flagship: [
                        executableVariants:
                                sameRun
                                        .flagship
                                        .passedVariants,
                        requiredVariants  :
                                sameRun
                                        .flagship
                                        .requiredVariants
                ],
                forbiddenProviderDemandCount:
                        sameRun.providerLocality
                                .forbiddenProviderDemandCount,
                runtimeTraceMaximum:
                        sameRun.runtimeTrace
                                .observedEntries,
                testPartition:
                        partition,
                evidenceSources:
                        [
                                workingTests:
                                        workingEvidenceSource(
                                                workingSurfaceResults
                                                        .get().asFile),
                                externalProbes:
                                        workingEvidenceSource(
                                                externalProbeReport
                                                        .get().asFile),
                                sameRunEvidence:
                                        workingEvidenceSource(
                                                workingSameRunEvidenceReport
                                                        .get().asFile),
                                partition:
                                        workingEvidenceSource(
                                                workingPartitionReport
                                                        .get().asFile),
                                siblingInputs:
                                        workingEvidenceSource(
                                                siblingInputsFile),
                                resolvedDependencyLock:
                                        workingEvidenceSource(
                                                resolvedDependencyLockFile),
                                derived:
                                        sameRun
                                                .evidenceSources
                        ],
                artifacts: [
                        jar: [
                                path  :
                                        coordinationJar
                                                .absolutePath,
                                sha256:
                                        workingSha256(
                                                coordinationJar)
                        ],
                        sourcesJar: [
                                path  :
                                        sourcesJar
                                                .absolutePath,
                                sha256:
                                        workingSha256(
                                                sourcesJar)
                        ],
                        javadocJar: [
                                path  :
                                        javadocJar
                                                .absolutePath,
                                sha256:
                                        workingSha256(
                                                javadocJar)
                        ],
                        sourceArchive: [
                                path  :
                                        sourceArchive
                                                .absolutePath,
                                sha256:
                                        workingSha256(
                                                sourceArchive)
                        ],
                        dependencyLock: [
                                path  :
                                        dependencyLockTarget
                                                .absolutePath,
                                sha256:
                                        workingSha256(
                                                dependencyLockTarget)
                        ]
                ],
                commands: [
                        './gradlew coordinationWorkingVerification '
                                + '--offline --no-daemon '
                                + '-PtestJfr=false',
                        './gradlew coordinationReleaseEvidenceTest '
                                + '--offline --no-daemon '
                                + '-PtestJfr=false'
                ]
        ]
        File jsonTarget =
                workingFinalJson.get()
                        .asFile
        jsonTarget.parentFile.mkdirs()
        jsonTarget.text =
                JsonOutput.prettyPrint(
                        JsonOutput.toJson(
                                report)) + '\n'
        File markdownTarget =
                workingFinalMarkdown.get()
                        .asFile
        markdownTarget.text =
                """# Coordination working verification

- Working eligible: `${report.workingEligible}`
- Public release eligible: `${report.publicReleaseEligible}`
- Working tests: `${workingTests.passed}/${workingTests.total}` passed, `${workingTests.failed}` failed, `${workingTests.skipped}` skipped
- External probes: `${external.exactlyBlockedProbes}` exactly blocked, `${external.resolvedProbes}` resolved, `${external.invalidProbes.size()}` invalid
- Coordination-owned failures: `0`
- Fixture failures: `0`
- Unclassified failures: `0`
- Executable conformance: `${sameRun.conformance.total.passed}/${sameRun.conformance.total.required}` (`${sameRun.conformance.behavior.passed}/${sameRun.conformance.behavior.required}` behavior, `${sameRun.conformance.portableGas.passed}/${sameRun.conformance.portableGas.required}` portable gas, `${sameRun.conformance.hostQuota.passed}/${sameRun.conformance.hostQuota.required}` host quota)
- Executable flagship variants: `${sameRun.flagship.passedVariants}/${sameRun.flagship.requiredVariants}`
- Fixed Repository audit: `${sameRun.fixedRepository.verified}/${sameRun.fixedRepository.total}`
- Forbidden provider demands: `${sameRun.providerLocality.forbiddenProviderDemandCount}`
- Maximum runtime trace entries: `${sameRun.runtimeTrace.observedEntries}`
- Test partition: `${partition.observed.full.total} = ${partition.observed.working.total} + ${partition.observed.probes.total}` (`${partition.status}`)

Public release eligibility is determined only by the strict release gate; this working report does not claim it.
"""
        if (!workingEligible) {
            throw new GradleException(
                    'Coordination working report is red: '
                            + jsonTarget)
        }
    }
}

def coordinationWorkingVerification =
        tasks.register(
                'coordinationWorkingVerification') {
    group = 'verification'
    description =
            'Builds usable local artifacts and verifies every unblocked Coordination capability.'
    dependsOn generateCoordinationWorkingReport
    doLast {
        def report =
                new JsonSlurper()
                        .parse(
                                workingFinalJson.get()
                                        .asFile)
        if (report.workingEligible != true
                || report.publicReleaseEligible != false
                || !report.coordinationOwnedFailures
                .isEmpty()
                || !report.fixtureFailures.isEmpty()
                || !report.unclassifiedFailures
                .isEmpty()
                || report.workingTests.failed != 0
                || report.workingTests.skipped != 0
                || report.externalProbes.invalid != 0
                || report.dependencyTopology?.status != 'verified'
                || report.testPartition?.status
                != 'verified'
                || report.testPartition
                ?.observed?.full?.total
                != workingExpectedFull.longValue()
                || report.testPartition
                ?.observed?.working?.total
                != workingExpectedWorking.longValue()
                || report.testPartition
                ?.observed?.probes?.total
                != workingExpectedProbes.longValue()
                || report.evidenceSources
                ?.sameRunEvidence?.status != 'present'
                || report.evidenceSources
                ?.partition?.status != 'present'
                || report.evidenceSources
                ?.siblingInputs?.status != 'present'
                || report.evidenceSources
                ?.resolvedDependencyLock?.status != 'present') {
            throw new GradleException(
                    'Coordination working verification failed; see '
                            + workingFinalJson.get()
                            .asFile)
        }
    }
}

ext.coordinationWorkingVerificationTask =
        coordinationWorkingVerification

if (project.ext.has(
        'coordinationReleaseRegisterRequiredEvidenceGate')) {
    project.ext
            .coordinationReleaseRegisterRequiredEvidenceGate
            .call(
                    'coordinationFullSuitePartitionVerification')
    project.ext
            .coordinationReleaseRegisterRequiredEvidenceGate
            .call(
                    'generateCoordinationSameRunEvidenceReport')
}
