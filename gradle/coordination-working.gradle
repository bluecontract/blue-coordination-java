                unclassifiedFailures:
                        [],
                conformance:
                        [
                                executable:
                                        sameRun.conformance
                                                .total.passed,
                                required:
                                        sameRun.conformance
                                                .total.required,
                                behavior:
                                        [
                                                executable:
                                                        sameRun.conformance
                                                                .behavior
                                                                .passed,
                                                required:
                                                        sameRun.conformance
                                                                .behavior
                                                                .required
                                        ],
                                portableGas:
