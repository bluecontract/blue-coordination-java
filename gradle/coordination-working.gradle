import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import groovy.xml.XmlSlurper
import org.gradle.api.GradleException
import org.gradle.api.tasks.testing.Test

def workingBlueRepositoryCompositePath =
        (providers.gradleProperty('blueRepositoryCompositePath')
                .orNull
                ?: System.getProperty(
                        'org.gradle.project.blueRepositoryCompositePath'))
                ?.trim()
if (workingBlueRepositoryCompositePath == null
        || workingBlueRepositoryCompositePath.isEmpty()) {
    throw new GradleException(
            'The exact locked local Repository composite path is missing.')
}
def workingBlueRepositoryComposite =
        file(workingBlueRepositoryCompositePath).canonicalFile
if (!workingBlueRepositoryComposite.isDirectory()) {
    throw new GradleException(
            'The exact locked local Repository composite is missing: '
                    + workingBlueRepositoryComposite)
}

def workingCatalogFile =
        file('gradle/coordination-external-blockers.json')
def workingCatalog =
        new JsonSlurper().parse(workingCatalogFile)
def workingBlockers =
        workingCatalog.blockers as List
if (workingCatalog.schema
        != 'blue-coordination/external-blockers/1.1') {
    throw new GradleException(
            'Unsupported Coordination external-blocker catalog schema: '
                    + workingCatalog.schema)
}
def workingFingerprintPrefixes =
        workingBlockers.collect {
            it.fingerprintPrefix
        }
if (workingFingerprintPrefixes.any {
    !(it instanceof String)
            || it.trim().isEmpty()
            || !it.endsWith(':')
}
        || workingFingerprintPrefixes.toSet().size()
        != workingFingerprintPrefixes.size()) {
    throw new GradleException(
            'Every external-blocker family must declare one unique, '
                    + 'non-empty fingerprintPrefix ending in a colon.')
}
def workingProbes =
        workingBlockers.collectMany { blocker ->
            blocker.probes.collect { probe ->
                [
                        blockerId     : blocker.id,
                        owner         : blocker.owner,
                        category      : blocker.category,
                        test          : probe.test,
                        fingerprintPrefix:
                                blocker.fingerprintPrefix
                ]
            }
        }
if (workingProbes.size() != 57
        || workingProbes.collect {
            it.test
        }.toSet().size() != 57
        || workingBlockers.any { blocker ->
            !(blocker.probes instanceof List)
                    || blocker.probes.isEmpty()
                    || blocker.probes.any { probe ->
                !(probe instanceof Map)
                        || probe.keySet()
                        != (['test'] as Set)
                        || !(probe.test instanceof String)
                        || probe.test.trim().isEmpty()
            }
        }) {
    throw new GradleException(
            'The external-blocker catalog must contain exactly 57 '
                    + 'unique, test-only probe declarations.')
}
def workingDynamicCaseIds =
        workingProbes.findAll {
            it.test.startsWith(
                    'blue.coordination.processor.'
                            + 'CoordinationBehaviorFixtureHarnessTest#')
        }.collect {
            it.test.substring(
                    it.test.indexOf('#') + 1)
        }
def workingStandardProbes =
        workingProbes.findAll {
            !it.test.startsWith(
                    'blue.coordination.processor.'
                            + 'CoordinationBehaviorFixtureHarnessTest#')
        }

def configureWorkingTest = { Test testTask ->
    testTask.group = 'verification'
    testTask.testClassesDirs =
            sourceSets.test.output.classesDirs
    testTask.classpath =
            sourceSets.test.runtimeClasspath
    testTask.dependsOn tasks.named('testClasses')
    testTask.useJUnitPlatform()
    testTask.maxHeapSize = '2g'
    testTask.maxParallelForks = 1
    testTask.forkEvery = 0L
    testTask.javaLauncher =
            javaToolchains.launcherFor {
                languageVersion =
                        JavaLanguageVersion.of(8)
            }
    testTask.reports {
        junitXml.required = true
        html.required = true
    }
    testTask.outputs.upToDateWhen { false }
    testTask.testLogging {
        events 'PASSED', 'FAILED', 'SKIPPED'
        showStandardStreams = true
    }
}

def coordinationWorkingEvidenceTest =
        tasks.register(
                'coordinationWorkingEvidenceTest',
                Test) { workingTest ->
    description =
            'Captures the complete Coordination-owned test surface while excluding only catalogued exact probes.'
    configureWorkingTest(workingTest)
    workingTest.ignoreFailures = true
    workingTest.systemProperty(
            'coordination.behavior.excludeCaseIds',
            workingDynamicCaseIds.join(','))
    workingTest.systemProperty(
            'coordination.fixed.repository.report',
            layout.buildDirectory.file(
                    'reports/coordination-working/'
                            + 'working-fixed-repository.json')
                    .get().asFile.absolutePath)
    workingTest.systemProperty(
            'coordination.flagship.report',
            layout.buildDirectory.file(
                    'reports/coordination-working/'
                            + 'working-flagship-trace.md')
                    .get().asFile.absolutePath)
    workingTest.filter {
        includeTestsMatching('*')
        workingStandardProbes.each { probe ->
            excludeTestsMatching(
                    probe.test.replace(
                            '#', '.'))
        }
    }
}

def coordinationExternalBlockerProbeEvidenceTest =
        tasks.register(
                'coordinationExternalBlockerProbeEvidenceTest',
                Test) { probeTest ->
    description =
            'Executes every exact external-blocker probe and retains failures for fingerprint verification.'
    configureWorkingTest(probeTest)
    probeTest.ignoreFailures = true
    probeTest.systemProperty(
            'coordination.behavior.includeCaseIds',
            workingDynamicCaseIds.join(','))
    probeTest.systemProperty(
            'coordination.fixed.repository.report',
            layout.buildDirectory.file(
                    'reports/coordination-working/'
                            + 'probe-fixed-repository.json')
                    .get().asFile.absolutePath)
    probeTest.systemProperty(
            'coordination.flagship.report',
            layout.buildDirectory.file(
                    'reports/coordination-working/'
                            + 'probe-flagship-trace.md')
                    .get().asFile.absolutePath)
    probeTest.filter {
        workingStandardProbes.each { probe ->
            includeTestsMatching(
                    probe.test.replace(
                            '#', '.'))
        }
        if (!workingDynamicCaseIds.isEmpty()) {
            includeTestsMatching(
                    'blue.coordination.processor.'
                            + 'CoordinationBehaviorFixtureHarnessTest.'
                            + 'shouldExecuteOneAuthoredBehaviorCase'
                            + 'AgainstProductionApis')
        }
    }
}

def normalizedWorkingTestId = {
    String className,
    String name ->
        String normalizedName =
                name != null
                        && name.endsWith('()')
                        ? name.substring(
                        0, name.length() - 2)
                        : name
        def dynamic =
                normalizedName == null
                        ? null
                        : (normalizedName =~
                        /^[0-9]+: (.+)$/)
        if (dynamic != null
                && dynamic.matches()
                && className
                == 'blue.coordination.processor.'
                + 'CoordinationBehaviorFixtureHarnessTest') {
            normalizedName =
                    dynamic.group(1)
        }
        className + '#' + normalizedName
}

def readWorkingJUnit = { File directory ->
    def records =
            new ArrayList<Map<String, Object>>()
    fileTree(directory) {
        include 'TEST-*.xml'
    }.files.sort { left, right ->
        left.name <=> right.name
    }.each { resultFile ->
        def suite =
                new XmlSlurper(
                        false, false)
                        .parse(resultFile)
        suite.testcase.each { testCase ->
            def failure =
                    testCase.failure.size() > 0
                            ? testCase.failure[0]
                            : (testCase.error.size() > 0
                            ? testCase.error[0]
                            : null)
            String status =
                    failure != null
                            ? 'failed'
                            : (testCase.skipped.size() > 0
                            ? 'skipped'
                            : 'passed')
            String failureType =
                    failure == null
                            ? null
                            : failure.@type
                            .toString()
            String rawMessage =
                    failure == null
                            ? null
                            : failure.@message
                            .toString()
            String logicalMessage =
                    rawMessage
            if (logicalMessage != null
                    && failureType != null
                    && !failureType.isEmpty()) {
                String wrapper =
                        failureType + ': '
                if (logicalMessage.startsWith(
                        wrapper)) {
                    logicalMessage =
                            logicalMessage.substring(
                                    wrapper.length())
                }
            }
            records.add([
                    id     :
                            normalizedWorkingTestId(
                                    testCase.@classname
                                            .toString(),
                                    testCase.@name
                                            .toString()),
                    status : status,
                    failureType:
                            failureType,
                    message:
                            rawMessage,
                    logicalMessage:
                            logicalMessage,
                    resultFile:
                            resultFile.absolutePath
            ])
        }
    }
    records.sort { left, right ->
        left.id <=> right.id
    }
    long failed =
            records.count {
                it.status == 'failed'
            }
    long skipped =
            records.count {
                it.status == 'skipped'
            }
    [
            total  : (long) records.size(),
            passed : (long) records.size()
                    - failed - skipped,
            failed : failed,
            skipped: skipped,
            records: records
    ]
}

def externalProbeReport =
        layout.buildDirectory.file(
                'reports/coordination-working/'
                        + 'external-blockers.json')

def coordinationExternalBlockerProbeTest =
        tasks.register(
                'coordinationExternalBlockerProbeTest') {
    group = 'verification'
    description =
            'Accepts each exact blocker probe only when it passes or reproduces its declared diagnostic.'
    dependsOn coordinationExternalBlockerProbeEvidenceTest
    inputs.file(workingCatalogFile)
    outputs.file(externalProbeReport)
    outputs.upToDateWhen { false }
    doLast {
        def evidence =
                readWorkingJUnit(
                        file(
                                'build/test-results/'
                                        + 'coordinationExternal'
                                        + 'BlockerProbeEvidenceTest'))
        def byId =
                new LinkedHashMap<String, Object>()
        evidence.records.each { record ->
            if (byId.put(
                    record.id, record) != null) {
                throw new GradleException(
                        'Duplicate external probe result: '
                                + record.id)
            }
        }
        def outcomes =
                new ArrayList<Map<String, Object>>()
        def invalid =
                new ArrayList<String>()
        workingProbes.each { probe ->
            def record =
                    byId.remove(probe.test)
            String outcome
            if (record == null) {
                outcome = 'missing'
                invalid.add(
                        probe.test + ': missing')
            } else if (record.status
                    == 'passed') {
                outcome = 'resolved'
            } else if (record.status
                    == 'failed'
                    && record.logicalMessage != null
                    && record.logicalMessage.startsWith(
                    probe.fingerprintPrefix)) {
                outcome = 'exactly-blocked'
            } else {
                outcome = 'invalid'
                invalid.add(
                        probe.test
                                + ': expected logical-message prefix '
                                + probe.fingerprintPrefix
                                + ' but observed '
                                + record)
            }
            outcomes.add([
                    blockerId:
                            probe.blockerId,
                    owner    : probe.owner,
                    category : probe.category,
                    test     : probe.test,
                    fingerprintPrefix:
                            probe.fingerprintPrefix,
                    outcome  : outcome,
                    failureType:
                            record == null
                                    ? null
                                    : record.failureType,
                    message  :
                            record == null
                                    ? null
                                    : record.message,
                    logicalMessage:
                            record == null
                                    ? null
                                    : record.logicalMessage
            ])
        }
        if (!byId.isEmpty()) {
            invalid.add(
                    'Unexpected probe results: '
                            + byId.keySet())
        }
        def report = [
                schema          :
                        'blue-coordination/'
                                + 'external-blocker-report/1.0',
                catalogSchema   :
                        workingCatalog.schema,
                declaredProbes  :
                        (long) workingProbes.size(),
                executedProbes  :
                        evidence.total,
                resolvedProbes  :
                        (long) outcomes.count {
                            it.outcome == 'resolved'
                        },
                exactlyBlockedProbes:
                        (long) outcomes.count {
                            it.outcome == 'exactly-blocked'
                        },
                invalidProbes   :
                        Collections.unmodifiableList(
                                invalid),
                outcomes        : outcomes
        ]
        File target =
                externalProbeReport.get()
                        .asFile
        target.parentFile.mkdirs()
        target.text =
                JsonOutput.prettyPrint(
                        JsonOutput.toJson(
                                report)) + '\n'
        if (!invalid.isEmpty()
                || evidence.skipped != 0L
                || evidence.total
                != workingProbes.size()) {
            throw new GradleException(
                    'External blocker probes changed; see '
                            + target)
        }
    }
}

def coordinationWorkingTest =
        tasks.register(
                'coordinationWorkingTest') {
    group = 'verification'
    description =
            'Fails for every Coordination-owned, fixture-owned, unclassified, or skipped working-surface test.'
    dependsOn coordinationWorkingEvidenceTest
    doLast {
        def evidence =
                readWorkingJUnit(
                        file(
                                'build/test-results/'
                                        + 'coordinationWorking'
                                        + 'EvidenceTest'))
        if (evidence.failed != 0L
                || evidence.skipped != 0L
                || evidence.total == 0L) {
            def failures =
                    evidence.records.findAll {
                        it.status != 'passed'
                    }
            throw new GradleException(
                    'Coordination working test surface is red: '
                            + failures)
        }
    }
}

def workingSha256 = { File source ->
    if (source == null
            || !source.isFile()) {
        return null
    }
    def digest =
            java.security.MessageDigest
                    .getInstance('SHA-256')
    source.withInputStream { input ->
        byte[] buffer = new byte[8192]
        int read
        while ((read = input.read(buffer)) >= 0) {
            if (read > 0) {
                digest.update(
                        buffer, 0, read)
            }
        }
    }
    digest.digest().collect {
        String.format(
                java.util.Locale.ROOT,
                '%02x',
                it & 0xff)
    }.join()
}

def workingGit = {
    File directory,
    String... arguments ->
        def command =
                new ArrayList<String>()
        command.add('git')
        command.addAll(
                Arrays.asList(arguments))
        Process process =
                new ProcessBuilder(command)
                        .directory(directory)
                        .redirectErrorStream(true)
                        .start()
        String output =
                process.inputStream
                        .getText('UTF-8')
                        .trim()
        if (process.waitFor() != 0) {
            throw new GradleException(
                    "Git command failed: ${command}\n"
                            + output)
        }
        output
}

def workingPlainJar = { File directory ->
    def jars =
            fileTree(
                    new File(
                            directory,
                            'build/libs')) {
                include '*.jar'
                exclude '*-sources.jar'
                exclude '*-javadoc.jar'
                exclude '*-tests.jar'
            }.files.sort {
                it.name
            }
    jars.isEmpty()
            ? null
            : jars.last()
}

def workingSourceState = { File directory ->
    String status =
            workingGit(
                    directory,
                    'status',
                    '--porcelain')
    [
            state:
                    status.isEmpty()
                            ? 'clean'
                            : 'dirty',
            entries:
                    status.isEmpty()
                            ? 0L
                            : (long) status
                            .readLines()
                            .size()
    ]
}

def workingEvidenceSource = { File source ->
    if (source == null) {
        return [
                path  : null,
                sha256: null,
                files : 0L,
                status: 'missing'
        ]
    }
    if (source.isFile()) {
        return [
                path  : source.absolutePath,
                sha256: workingSha256(source),
                files : 1L,
                status: 'present'
        ]
    }
    if (!source.isDirectory()) {
        return [
                path  : source.absolutePath,
                sha256: null,
                files : 0L,
                status: 'missing'
        ]
    }
    def entries =
            fileTree(source) {
                include 'TEST-*.xml'
            }.files.collect { evidenceFile ->
                [
                        source  : evidenceFile,
                        relative:
                                source.toPath()
                                        .relativize(
                                                evidenceFile.toPath())
                                        .toString()
                                        .replace(
                                                File.separatorChar,
                                                '/' as char)
                ]
            }.sort { left, right ->
                left.relative <=> right.relative
            }
    if (entries.isEmpty()) {
        return [
                path  : source.absolutePath,
                sha256: null,
                files : 0L,
                status: 'missing'
        ]
    }
    def digest =
            java.security.MessageDigest
                    .getInstance('SHA-256')
    entries.each { entry ->
        digest.update(
                entry.relative.getBytes(
                        'UTF-8'))
        digest.update(0 as byte)
        entry.source.withInputStream { input ->
            byte[] buffer = new byte[8192]
            int read
            while ((read = input.read(buffer)) >= 0) {
                if (read > 0) {
                    digest.update(
                            buffer, 0, read)
                }
            }
        }
        digest.update(0 as byte)
    }
    [
            path  : source.absolutePath,
            sha256:
                    digest.digest().collect {
                        String.format(
                                java.util.Locale.ROOT,
                                '%02x',
                                it & 0xff)
                    }.join(),
            files : (long) entries.size(),
            status: 'present'
    ]
}

def workingInventory = {
    List<Map<String, Object>> records ->
        def inventory =
                new TreeMap<String, Long>()
        records.each { record ->
            String id =
                    record.id.toString()
            inventory.put(
                    id,
                    (inventory.get(id)
                            ?: 0L) + 1L)
        }
        inventory
}

def workingInventoryDifference = {
    Map<String, Long> left,
    Map<String, Long> right ->
        def difference =
                new TreeMap<String, Long>()
        left.each { id, count ->
            long remaining =
                    count - (right.get(id)
                            ?: 0L)
            if (remaining > 0L) {
                difference.put(
                        id, remaining)
            }
        }
        difference
}

def workingInventorySum = {
    Map<String, Long> left,
    Map<String, Long> right ->
        def sum =
                new TreeMap<String, Long>()
        [left, right].each { inventory ->
            inventory.each { id, count ->
                sum.put(
                        id,
                        (sum.get(id)
                                ?: 0L) + count)
            }
        }
        sum
}

def workingPartitionReport =
        layout.buildDirectory.file(
                'reports/coordination-working/'
                        + 'test-partition.json')
def workingFullResults =
        layout.buildDirectory.dir(
                'test-results/'
                        + 'coordinationReleaseEvidenceTest')
def workingSurfaceResults =
        layout.buildDirectory.dir(
                'test-results/'
                        + 'coordinationWorkingEvidenceTest')
def workingProbeResults =
        layout.buildDirectory.dir(
                'test-results/'
                        + 'coordinationExternal'
                        + 'BlockerProbeEvidenceTest')

def coordinationFullSuitePartitionVerification =
        tasks.register(
                'coordinationFullSuitePartitionVerification') {
    group = 'verification'
    description =
            'Proves that the exact 899-case ordinary suite is the disjoint multiset union of 842 working cases and 57 catalogued probes.'
    dependsOn(
            tasks.named(
                    'coordinationReleaseEvidenceTest'),
            coordinationWorkingEvidenceTest,
            coordinationExternalBlockerProbeEvidenceTest)
    inputs.file(workingCatalogFile)
    outputs.file(workingPartitionReport)
    outputs.upToDateWhen { false }
    doLast {
        File fullDirectory =
                workingFullResults.get()
                        .asFile
        File surfaceDirectory =
                workingSurfaceResults.get()
                        .asFile
        File probeDirectory =
                workingProbeResults.get()
                        .asFile
        def full =
                readWorkingJUnit(
                        fullDirectory)
        def surface =
                readWorkingJUnit(
                        surfaceDirectory)
        def probes =
                readWorkingJUnit(
                        probeDirectory)
        def fullInventory =
                workingInventory(
                        full.records)
        def surfaceInventory =
                workingInventory(
                        surface.records)
        def probeInventory =
                workingInventory(
                        probes.records)
        def combinedInventory =
                workingInventorySum(
                        surfaceInventory,
                        probeInventory)
        def overlap =
                new TreeMap<String, Long>()
        surfaceInventory.each { id, count ->
            long shared =
                    Math.min(
                            count,
                            probeInventory.get(id)
                                    ?: 0L)
            if (shared > 0L) {
                overlap.put(
                        id, shared)
            }
        }
        def missing =
                workingInventoryDifference(
                        fullInventory,
                        combinedInventory)
        def extra =
                workingInventoryDifference(
                        combinedInventory,
                        fullInventory)
        def catalogInventory =
                new TreeMap<String, Long>()
        workingProbes.each { probe ->
            catalogInventory.put(
                    probe.test,
                    (catalogInventory.get(
                            probe.test)
                            ?: 0L) + 1L)
        }
        def catalogMissing =
                workingInventoryDifference(
                        catalogInventory,
                        probeInventory)
        def catalogExtra =
                workingInventoryDifference(
                        probeInventory,
                        catalogInventory)
        String dynamicPrefix =
                'blue.coordination.processor.'
                        + 'CoordinationBehaviorFixtureHarnessTest#'
        def observedDynamicCaseIds =
                new TreeSet<String>(
                        probeInventory.keySet()
                                .findAll {
                                    it.startsWith(
                                            dynamicPrefix)
                                }
                                .collect {
                                    it.substring(
                                            dynamicPrefix.length())
                                })
        def expectedDynamicCaseIds =
                new TreeSet<String>(
                        workingDynamicCaseIds)
        boolean exactCounts =
                full.total == 899L
                        && surface.total == 842L
                        && probes.total == 57L
                        && fullInventory.size() == 899
                        && surfaceInventory.size() == 842
                        && probeInventory.size() == 57
        boolean passed =
                exactCounts
                        && overlap.isEmpty()
                        && missing.isEmpty()
                        && extra.isEmpty()
                        && catalogMissing.isEmpty()
                        && catalogExtra.isEmpty()
                        && observedDynamicCaseIds
                        == expectedDynamicCaseIds
                        && fullInventory
                        == combinedInventory
        def report = [
                schema:
                        'blue-coordination/'
                                + 'test-partition/1.0',
                status:
                        passed
                                ? 'verified'
                                : 'invalid',
                expected:
                        [
                                full    : 899L,
                                working : 842L,
                                probes  : 57L
                        ],
                observed:
                        [
                                full:
                                        [
                                                total :
                                                        full.total,
                                                unique:
                                                        (long) fullInventory
                                                                .size()
                                        ],
                                working:
                                        [
                                                total :
                                                        surface.total,
                                                unique:
                                                        (long) surfaceInventory
                                                                .size()
                                        ],
                                probes:
                                        [
                                                total :
                                                        probes.total,
                                                unique:
                                                        (long) probeInventory
                                                                .size()
                                        ]
                        ],
                multisetUnionMatches:
                        fullInventory
                        == combinedInventory,
                overlap:
                        overlap,
                missing:
                        missing,
                extra:
                        extra,
                catalogMissing:
                        catalogMissing,
                catalogExtra:
                        catalogExtra,
                expectedDynamicCaseIds:
                        new ArrayList<String>(
                                expectedDynamicCaseIds),
                observedDynamicCaseIds:
                        new ArrayList<String>(
                                observedDynamicCaseIds),
                evidenceSources:
                        [
                                catalog:
                                        workingEvidenceSource(
                                                workingCatalogFile),
                                full:
                                        workingEvidenceSource(
                                                fullDirectory),
                                working:
                                        workingEvidenceSource(
                                                surfaceDirectory),
                                probes:
                                        workingEvidenceSource(
                                                probeDirectory)
                        ]
        ]
        File target =
                workingPartitionReport.get()
                        .asFile
        target.parentFile.mkdirs()
        target.text =
                JsonOutput.prettyPrint(
                        JsonOutput.toJson(
                                report)) + '\n'
        if (!passed) {
            throw new GradleException(
                    'Coordination test partition is invalid; see '
                            + target)
        }
    }
}

def workingYamlScalar = {
    File source,
    String key ->
        if (source == null
                || !source.isFile()) {
            return null
        }
        String prefix =
                key + ':'
        String line =
                source.readLines(
                        'UTF-8')
                        .find {
                            it.startsWith(
                                    prefix)
                        }
        line == null
                ? null
                : line.substring(
                        prefix.length())
                        .trim()
}

def workingConformanceResult = {
    Map<String, Object> evidence,
    String exactIdPattern,
    long required ->
        def pattern =
                java.util.regex.Pattern
                        .compile(
                                exactIdPattern)
        def records =
                evidence.records.findAll {
                    pattern.matcher(
                            it.id.toString())
                            .matches()
                }
        long failed =
                records.count {
                    it.status == 'failed'
                }
        long skipped =
                records.count {
                    it.status == 'skipped'
                }
        [
                required   : required,
                executed   :
                        (long) records.size(),
                passed     :
                        (long) records.size()
                                - failed
                                - skipped,
                failed     : failed,
                skipped    : skipped,
                notExecuted:
                        Math.max(
                                0L,
                                required
                                        - (long) records.size())
        ]
}

def workingSystemOutMetric = {
    File resultsDirectory,
    String suiteName,
    String metricPrefix ->
        def values =
                new ArrayList<String>()
        fileTree(resultsDirectory) {
            include 'TEST-*.xml'
        }.files.sort { left, right ->
            left.name <=> right.name
        }.each { resultFile ->
            def suite =
                    new XmlSlurper(
                            false, false)
                            .parse(resultFile)
            if (suite.@name.toString()
                    == suiteName) {
                suite.'system-out'.text()
                        .readLines()
                        .findAll {
                            it.startsWith(
                                    metricPrefix)
                        }.each { line ->
                            values.add(
                                    line.substring(
                                            metricPrefix.length()))
                        }
            }
        }
        if (values.size() != 1
                || !(values[0] ==~ /[0-9]+/)) {
            return null
        }
        Long.valueOf(
                values[0])
}

