def coordinationFullSuitePartitionVerification =
        tasks.register(
                'coordinationFullSuitePartitionVerification') {
    group = 'verification'
    description =
            'Proves that the exact catalogued ordinary suite is the disjoint multiset union of its working cases and external probes.'
    dependsOn(
            tasks.named(
                    'coordinationReleaseEvidenceTest'),
            coordinationWorkingEvidenceTest,
            coordinationExternalBlockerProbeEvidenceTest)
    inputs.file(workingCatalogFile)
    outputs.file(workingPartitionReport)
    outputs.upToDateWhen { false }
    doLast {
        File fullDirectory =
                workingFullResults.get()
                        .asFile
        File surfaceDirectory =
                workingSurfaceResults.get()
                        .asFile
        File probeDirectory =
                workingProbeResults.get()
                        .asFile
        def full =
                readWorkingJUnit(
                        fullDirectory)
        def surface =
                readWorkingJUnit(
                        surfaceDirectory)
        def probes =
                readWorkingJUnit(
                        probeDirectory)
        def fullInventory =
                workingInventory(
                        full.records)
        def surfaceInventory =
                workingInventory(
                        surface.records)
        def probeInventory =
                workingInventory(
                        probes.records)
        def combinedInventory =
                workingInventorySum(
                        surfaceInventory,
                        probeInventory)
        def overlap =
                new TreeMap<String, Long>()
        surfaceInventory.each { id, count ->
            long shared =
                    Math.min(
                            count,
                            probeInventory.get(id)
                                    ?: 0L)
            if (shared > 0L) {
                overlap.put(
                        id, shared)
            }
        }
        def missing =
                workingInventoryDifference(
                        fullInventory,
                        combinedInventory)
        def extra =
                workingInventoryDifference(
                        combinedInventory,
                        fullInventory)
        def catalogInventory =
                new TreeMap<String, Long>()
        workingProbes.each { probe ->
            catalogInventory.put(
                    probe.test,
                    (catalogInventory.get(
                            probe.test)
                            ?: 0L) + 1L)
        }
        def catalogMissing =
                workingInventoryDifference(
                        catalogInventory,
                        probeInventory)
        def catalogExtra =
                workingInventoryDifference(
                        probeInventory,
                        catalogInventory)
        String dynamicPrefix =
                'blue.coordination.processor.CoordinationBehaviorFixtureHarnessTest#'
        def observedDynamicCaseIds =
                new TreeSet<String>(
                        probeInventory.keySet()
                                .findAll {
                                    it.startsWith(
                                            dynamicPrefix)
                                }
                                .collect {
                                    it.substring(
                                            dynamicPrefix.length())
                                }
                                .findAll {
                                    it.startsWith('coord-')
                                            && it.contains('@')
                                })
        def expectedDynamicCaseIds =
                new TreeSet<String>(
                        workingDynamicCaseIds)
        boolean exactCounts =
                full.total
                        == workingExpectedFull.longValue()
                        && surface.total
                        == workingExpectedWorking.longValue()
                        && probes.total
                        == workingExpectedProbes.longValue()
                        && fullInventory.size()
                        == workingExpectedFull.longValue()
                        && surfaceInventory.size()
                        == workingExpectedWorking.longValue()
                        && probeInventory.size()
                        == workingExpectedProbes.longValue()
        boolean passed =
                exactCounts
                        && overlap.isEmpty()
                        && missing.isEmpty()
                        && extra.isEmpty()
                        && catalogMissing.isEmpty()
                        && catalogExtra.isEmpty()
                        && observedDynamicCaseIds
                        == expectedDynamicCaseIds
                        && fullInventory
                        == combinedInventory
        def report = [
                schema:
                        'blue-coordination/'
                                + 'test-partition/1.0',
                status:
                        passed
                                ? 'verified'
                                : 'invalid',
                expected:
                        [
                                full    : workingExpectedFull.longValue(),
                                working : workingExpectedWorking.longValue(),
                                probes  : workingExpectedProbes.longValue()
                        ],
                observed:
                        [
                                full:
                                        [
                                                total :
                                                        full.total,
                                                unique:
                                                        (long) fullInventory
                                                                .size()
                                        ],
                                working:
                                        [
                                                total :
                                                        surface.total,
                                                unique:
                                                        (long) surfaceInventory
                                                                .size()
                                        ],
                                probes:
                                        [
                                                total :
                                                        probes.total,
                                                unique:
                                                        (long) probeInventory
                                                                .size()
                                        ]
                        ],
                multisetUnionMatches:
                        fullInventory
                        == combinedInventory,
                overlap:
                        overlap,
                missing:
                        missing,
                extra:
                        extra,
                catalogMissing:
                        catalogMissing,
                catalogExtra:
                        catalogExtra,
                expectedDynamicCaseIds:
                        new ArrayList<String>(
                                expectedDynamicCaseIds),
                observedDynamicCaseIds:
                        new ArrayList<String>(
                                observedDynamicCaseIds),
                evidenceSources:
                        [
                                catalog:
                                        workingEvidenceSource(
                                                workingCatalogFile),
                                full:
                                        workingEvidenceSource(
                                                fullDirectory),
                                working:
                                        workingEvidenceSource(
                                                surfaceDirectory),
                                probes:
                                        workingEvidenceSource(
                                                probeDirectory)
                        ]
        ]
        File target =
                workingPartitionReport.get()
                        .asFile
        target.parentFile.mkdirs()
        target.text =
                JsonOutput.prettyPrint(
                        JsonOutput.toJson(
                                report)) + '\n'
        if (!passed) {
            throw new GradleException(
                    'Coordination test partition is invalid; see '
                            + target)
        }
    }
}

def workingYamlScalar = {
    File source,
    String key ->
        if (source == null
                || !source.isFile()) {
            return null
        }
        String prefix =
                key + ':'
        String line =
                source.readLines(
                        'UTF-8')
                        .find {
                            it.startsWith(
                                    prefix)
                        }
        line == null
                ? null
                : line.substring(
                        prefix.length())
                        .trim()
}

def workingConformanceResult = {
    Map<String, Object> evidence,
    String exactIdPattern,
    long required ->
        def pattern =
                java.util.regex.Pattern
                        .compile(
                                exactIdPattern)
        def records =
                evidence.records.findAll {
                    pattern.matcher(
                            it.id.toString())
                            .matches()
                }
        long failed =
                records.count {
                    it.status == 'failed'
                }
        long skipped =
                records.count {
                    it.status == 'skipped'
                }
        [
                required   : required,
                executed   :
                        (long) records.size(),
                passed     :
                        (long) records.size()
                                - failed
                                - skipped,
                failed     : failed,
                skipped    : skipped,
                notExecuted:
                        Math.max(
                                0L,
                                required
                                        - (long) records.size())
        ]
}

def workingSystemOutMetric = {
    File resultsDirectory,
    String suiteName,
    String metricPrefix ->
        def values =
                new ArrayList<String>()
        fileTree(resultsDirectory) {
            include 'TEST-*.xml'
        }.files.sort { left, right ->
            left.name <=> right.name
        }.each { resultFile ->
            def suite =
                    new XmlSlurper(
                            false, false)
                            .parse(resultFile)
            if (suite.@name.toString()
                    == suiteName) {
                suite.'system-out'.text()
                        .readLines()
                        .findAll {
                            it.startsWith(
                                    metricPrefix)
                        }.each { line ->
                            values.add(
                                    line.substring(
                                            metricPrefix.length()))
                        }
            }
        }
        if (values.size() != 1
                || !(values[0] ==~ /[0-9]+/)) {
            return null
        }
        Long.valueOf(
                values[0])
}

