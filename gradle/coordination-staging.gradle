def sha256Hex = { File input ->
    MessageDigest digest = MessageDigest.getInstance('SHA-256')
    input.withInputStream { stream ->
        byte[] buffer = new byte[8192]
        int count
        while ((count = stream.read(buffer)) != -1) {
            digest.update(buffer, 0, count)
        }
    }
    digest.digest().encodeHex().toString()
}
def sha256IdentityFor = { File input -> 'sha256:' + sha256Hex(input) }
def canonicalJson = { Object value ->
    JsonOutput.prettyPrint(JsonOutput.toJson(value)) + '\n'
}
def regularFile = { File input ->
    Files.isRegularFile(input.toPath(), LinkOption.NOFOLLOW_LINKS)
            && !Files.isSymbolicLink(input.toPath())
}
def writeChecksum = { File input ->
    File checksum = new File(input.parentFile, input.name + '.sha256')
    checksum.setText(sha256Hex(input) + '  ' + input.name + '\n', 'UTF-8')
}
def relativeFiles = { File root, List<String> failures ->
    if (!root.isDirectory()) {
        failures << "repository does not exist ${root}"
        return [] as Set
    }
    Set<String> result = new TreeSet<>()
    def paths = Files.walk(root.toPath())
    try {
        paths.forEach { path ->
            if (path == root.toPath()) {
                return
            }
            if (Files.isSymbolicLink(path)) {
                failures << ('symbolic link in staged repository '
                        + root.toPath().relativize(path))
            } else if (Files.isRegularFile(path, LinkOption.NOFOLLOW_LINKS)) {
                result.add(root.toPath().relativize(path).toString()
                        .replace(File.separator, '/'))
            }
        }
    } finally {
        paths.close()
    }
    result
}
def sameTree = { File left, File right ->
    List<String> failures = []
    Set<String> leftPaths = relativeFiles(left, failures)
    Set<String> rightPaths = relativeFiles(right, failures)
    if (!failures.empty || leftPaths != rightPaths) {
        return false
    }
    leftPaths.every { relative ->
        Files.mismatch(new File(left, relative).toPath(),
                new File(right, relative).toPath()) == -1L
    }
}
def moveDirectory = { File source, File target ->
    try {
        Files.move(source.toPath(), target.toPath(),
                StandardCopyOption.ATOMIC_MOVE)
    } catch (AtomicMoveNotSupportedException ignored) {
        Files.move(source.toPath(), target.toPath())
    }
}
def checkedAbsoluteRepository = { String propertyName ->
    String value = providers.gradleProperty(propertyName).orNull
    if (value == null || value.isBlank()) {
        throw new GradleException(
                "-${'P'}${propertyName}=/absolute/path is required")
    }
    File path = new File(value)
    if (!path.isAbsolute()) {
        throw new GradleException("${propertyName} must be an absolute path")
    }
    if (Files.isSymbolicLink(path.toPath())) {
        throw new GradleException("${propertyName} must not be a symbolic link")
    }
    path.canonicalFile
}
def checkedSha256Property = { String propertyName ->
    String value = providers.gradleProperty(propertyName).orNull
    if (value == null || !(value ==~ /sha256:[0-9a-f]{64}/)) {
        throw new GradleException(
                "-${'P'}${propertyName}=sha256:<64 lowercase hex> is required")
    }
    value
}
def manifestEnvelope = {
        String repositoryProperty, String identityProperty, String label ->
    File repository = checkedAbsoluteRepository(repositoryProperty)
    String expectedIdentity = checkedSha256Property(identityProperty)
    File manifestFile = new File(repository, 'artifact-manifest.json')
    File sidecar = new File(repository, 'artifact-manifest.json.sha256')
    List<String> failures = []
    if (!Files.isDirectory(repository.toPath(), LinkOption.NOFOLLOW_LINKS)
            || Files.isSymbolicLink(repository.toPath())) {
        failures << "${label} repository is not a regular directory"
    }
    if (repository.toPath().startsWith(rootDir.canonicalFile.toPath())) {
        failures << "${label} repository must be outside the Coordination source tree"
    }
    if (!regularFile(manifestFile) || !regularFile(sidecar)) {
        failures << "${label} repository lacks its regular manifest and checksum"
    }
    if (!failures.empty) {
        throw new GradleException(
                "${label} repository failed:\n - "
                        + failures.join('\n - '))
    }
    String actualIdentity = sha256IdentityFor(manifestFile)
    if (actualIdentity != expectedIdentity) {
        failures << ("${label} manifest identity is ${actualIdentity}; "
                + "expected ${expectedIdentity}")
    }
    String expectedSidecar = sha256Hex(manifestFile)
            + '  artifact-manifest.json\n'
    if (sidecar.getText('UTF-8') != expectedSidecar) {
        failures << "${label} manifest checksum companion differs"
    }
    def manifest
    try {
        manifest = new JsonSlurper().parse(manifestFile)
    } catch (RuntimeException exception) {
        throw new GradleException(
                "Cannot parse ${label} repository manifest", exception)
    }
    if (!(manifest instanceof Map)) {
        failures << "${label} repository manifest is not an object"
    }
    if (!failures.empty) {
        throw new GradleException(
                "${label} repository failed:\n - "
                        + failures.join('\n - '))
    }
    [
            repository: repository,
            manifest: manifest,
            manifestIdentity: actualIdentity
    ]
}
def expectedRepositoryRecords = {
        String group, String version, Set<String> artifacts,
        Map<String, String> kinds ->
    List<Map<String, String>> result = []
    artifacts.toList().sort().each { artifact ->
        kinds.keySet().toList().sort().each { kind ->
            String base = group.replace('.', '/') + '/' + artifact + '/'
                    + version + '/' + artifact + '-' + version
            result << [
                    coordinate: group + ':' + artifact + ':' + version,
                    kind: kind,
                    path: base + kinds[kind],
                    checksumPath: base + kinds[kind] + '.sha256'
            ]
        }
    }
    result
}
def verifyClosedUpstreamRepository = {
        Map envelope, List<Map<String, String>> expectedRecords,
        int expectedFileCount, String label ->
    File repository = envelope.repository
    Map manifest = envelope.manifest
    List<String> failures = []
    def records = manifest.artifacts instanceof List
            ? manifest.artifacts : []
    if (!(manifest.artifacts instanceof List)) {
        failures << "${label} manifest artifacts must be a list"
    }
    Set<String> recordFields = [
            'coordinate',
            'kind',
            'path',
            'checksumPath',
            'sha256',
            'bytes'
    ] as Set
    Set<String> expectedFiles = [
            'artifact-manifest.json',
            'artifact-manifest.json.sha256'
    ] as Set
    expectedRecords.eachWithIndex { expected, index ->
        def record = index < records.size() ? records[index] : null
        Set<String> actualFields = record instanceof Map
                ? record.keySet() as Set : [] as Set
        if (!(record instanceof Map) || actualFields != recordFields) {
            failures << ("${label} artifact record ${index} fields differ; "
                    + "expected ${recordFields.toList().sort()}")
            return
        }
        if (record.coordinate != expected.coordinate
                || record.kind != expected.kind
                || record.path != expected.path
                || record.checksumPath != expected.checksumPath) {
            failures << "${label} artifact record ${index} is noncanonical"
            return
        }
        expectedFiles.add(expected.path)
        expectedFiles.add(expected.checksumPath)
        File payload = new File(repository, expected.path).canonicalFile
        File checksum = new File(repository, expected.checksumPath)
                .canonicalFile
        if (!payload.toPath().startsWith(repository.toPath())
                || !checksum.toPath().startsWith(repository.toPath())) {
            failures << "${label} artifact path escapes the repository at ${index}"
            return
        }
        if (!regularFile(payload) || !regularFile(checksum)) {
            failures << "${label} artifact payload/checksum is missing at ${index}"
            return
        }
        String payloadIdentity = sha256IdentityFor(payload)
        if (record.sha256 != payloadIdentity) {
            failures << "${label} artifact digest differs at ${index}"
        }
        if (!(record.bytes instanceof Number)
                || record.bytes.toString() != payload.length().toString()) {
            failures << "${label} artifact byte count differs at ${index}"
        }
        String expectedChecksum = sha256Hex(payload)
                + '  ' + payload.name + '\n'
        if (checksum.getText('UTF-8') != expectedChecksum) {
            failures << "${label} artifact checksum differs at ${index}"
        }
    }
    if (records.size() != expectedRecords.size()) {
        failures << ("${label} manifest has ${records.size()} artifact records; "
                + "expected ${expectedRecords.size()}")
    }
    if (expectedFiles.size() != expectedFileCount) {
        failures << ("${label} expected closure has ${expectedFiles.size()} "
                + "files; expected ${expectedFileCount}")
    }
    Set<String> actualFiles = relativeFiles(repository, failures)
    if (actualFiles != expectedFiles) {
        failures << ("${label} repository closure differs; missing "
                + (expectedFiles - actualFiles).toList().sort()
                + ', unexpected '
                + (actualFiles - expectedFiles).toList().sort())
    }
    if (!failures.empty) {
        throw new GradleException(
                "${label} repository failed:\n - "
                        + failures.join('\n - '))
    }
}
def checkedSourceCommit = {
    String expected = providers.gradleProperty(
            'coordinationSourceCommit').orNull
    if (expected == null || !(expected ==~ /[0-9a-f]{40}|[0-9a-f]{64}/)) {
        throw new GradleException(
                '-PcoordinationSourceCommit=<exact Git commit> is required')
    }
    Process headProcess = new ProcessBuilder(
            'git', 'rev-parse', '--verify', 'HEAD^{commit}')
            .directory(rootDir).redirectErrorStream(true).start()
    String head = headProcess.inputStream.getText('UTF-8').trim()
    if (headProcess.waitFor() != 0 || head != expected) {
        throw new GradleException(
                "coordinationSourceCommit ${expected} does not identify HEAD ${head}")
    }
    Process statusProcess = new ProcessBuilder(
            'git', 'status', '--porcelain', '--untracked-files=normal')
            .directory(rootDir).redirectErrorStream(true).start()
    String status = statusProcess.inputStream.getText('UTF-8').trim()
    if (statusProcess.waitFor() != 0) {
        throw new GradleException('Cannot inspect the Coordination worktree')
    }
    if (!status.isEmpty()) {
        throw new GradleException(
                'Immutable Coordination staging requires a clean worktree')
    }
    expected
}
def checkedCoordinationSourceProvenance = {
    String sourceCommit = checkedSourceCommit()
    Map<String, Object> provenance = [sourceCommit: sourceCommit]
    if (coordinationDependencyMode == 'immutable-development-contracts') {
        if (JavaVersion.current() != JavaVersion.VERSION_17) {
            throw new GradleException(
                    'Development Coordination staging requires JDK 17; current JVM is '
                            + JavaVersion.current())
        }
        if (!(sourceCommit ==~ /[0-9a-f]{40}/)
                || coordinationStageVersion
                != '3.0.0-dev.' + sourceCommit) {
            throw new GradleException(
                    'Development Coordination version must bind the clean 40-hex HEAD')
        }
        Process treeProcess = new ProcessBuilder(
                'git', 'rev-parse', '--verify', 'HEAD^{tree}')
                .directory(rootDir).redirectErrorStream(true).start()
        String sourceTree = treeProcess.inputStream.getText('UTF-8').trim()
        if (treeProcess.waitFor() != 0
                || !(sourceTree ==~ /[0-9a-f]{40}/)) {
            throw new GradleException(
                    'Cannot identify the exact Coordination source tree')
        }
        provenance.putAll([
                stagePurpose: 'DEVELOPMENT',
                releaseReadinessClaimed: false,
                builtWithJava: 17,
                sourceTree: sourceTree,
                sourceDirty: false
        ])
    }
    provenance
}
def inspectStagedContractsBinding = {
