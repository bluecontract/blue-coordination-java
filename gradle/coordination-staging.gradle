def inspectDependencyBindings = {
    if (coordinationDependencyMode == 'immutable-staged-contracts') {
        return [
                mode: coordinationDependencyMode,
                contracts: inspectStagedContractsBinding(),
                bex: null
        ]
    }
    if (coordinationDependencyMode == 'immutable-development-contracts') {
        Map language = inspectDevelopmentLanguageBinding()
        return [
                mode: coordinationDependencyMode,
                contracts: language,
                bex: inspectDevelopmentBexBinding(language)
        ]
    }
    throw new GradleException(
            'Coordination staging requires immutable-staged-contracts or '
                    + 'immutable-development-contracts')
}
def publicationFiles = { File repository ->
    String base = coordinationStageGroup.replace('.', '/') +
            '/' + coordinationStageArtifact + '/' +
            coordinationStageVersion + '/' +
            coordinationStageArtifact + '-' + coordinationStageVersion
    [
            [kind: 'javadoc', path: base + '-javadoc.jar'],
            [kind: 'pom', path: base + '.pom'],
            [kind: 'runtime', path: base + '.jar'],
            [kind: 'sources', path: base + '-sources.jar']
    ].collect { value -> value + [file: new File(repository, value.path)] }
}
def resolvedDependencyRecords = {
    def artifacts = configurations.runtimeClasspath.resolvedConfiguration
            .resolvedArtifacts.collect { artifact ->
        String coordinate = artifact.moduleVersion.id.group + ':' +
                artifact.name + ':' + artifact.moduleVersion.id.version
        [
                coordinate: coordinate,
                classifier: artifact.classifier,
                extension: artifact.extension,
                fileName: artifact.file.name,
                bytes: artifact.file.length(),
                sha256: sha256IdentityFor(artifact.file)
        ]
    }.sort { left, right ->
        (left.coordinate <=> right.coordinate)
                ?: (String.valueOf(left.classifier)
                <=> String.valueOf(right.classifier))
                ?: (left.extension <=> right.extension)
                ?: (left.fileName <=> right.fileName)
    }
    if (artifacts.collect { record ->
        record.coordinate + ':' + record.classifier + ':' + record.extension
    }.toSet().size() != artifacts.size()) {
        throw new GradleException(
                'Resolved Coordination dependency identities are ambiguous')
    }
    artifacts
}
def resolvedBexRuntimeIdentities = { List<Map<String, Object>> dependencies ->
    dependencies.findAll { record ->
        record.coordinate.startsWith('blue.bex:')
    }.collectEntries { record ->
        [(String.valueOf(record.coordinate)): String.valueOf(record.sha256)]
    }
}
def verifyResolvedUpstreamArtifacts = {
    Map bindings, List<Map<String, Object>> dependencies ->
    Map<String, String> expectedLanguage = bindings.contracts.manifest.artifacts
            .findAll { record -> record.kind == 'runtime' }
            .collectEntries { record ->
        [(String.valueOf(record.coordinate)): String.valueOf(record.sha256)]
    }
    if (bindings.mode == 'immutable-staged-contracts') {
        expectedLanguage = expectedLanguage.findAll { coordinate, ignored ->
            !coordinate.startsWith('blue.language:blue-conformance:')
        }
    }
    Map<String, String> actualLanguage = dependencies.findAll { record ->
        record.coordinate.startsWith('blue.language:')
    }.collectEntries { record ->
        [(String.valueOf(record.coordinate)): String.valueOf(record.sha256)]
    }
    if (actualLanguage != expectedLanguage
            || expectedLanguage.values().any { it == null }) {
        throw new GradleException(
                'Resolved Language bytes differ from the exact upstream manifest')
    }
    if (bindings.mode == 'immutable-development-contracts') {
        Map<String, String> expectedBex = bindings.bex.manifest.artifacts
                .findAll { record ->
            record.kind == 'runtime'
                    && selectedDevelopmentBexArtifacts.any { artifact ->
                record.coordinate.startsWith('blue.bex:' + artifact + ':')
            }
        }.collectEntries { record ->
            [(String.valueOf(record.coordinate)):
                     String.valueOf(record.sha256)]
        }
        Map<String, String> actualBex = resolvedBexRuntimeIdentities(
                dependencies)
        if (actualBex != expectedBex
                || expectedBex.size() != 2
                || expectedBex.values().any { it == null }) {
            throw new GradleException(
                    'Resolved BEX bytes differ from the exact development manifest')
        }
    }
}
def expectedStageManifest = {
    File repository, Map sourceProvenance, Map bindings,
    List<Map<String, Object>> dependencies ->
    List<Map<String, Object>> artifacts = publicationFiles(repository)
            .collect { value ->
        File input = value.file
        if (!regularFile(input)) {
            throw new GradleException(
                    "Required staged publication is missing ${input}")
        }
        [
                bytes: input.length(),
                checksumPath: value.path + '.sha256',
                coordinate: coordinationStageGroup + ':' +
                        coordinationStageArtifact + ':' +
                        coordinationStageVersion,
                kind: value.kind,
                path: value.path,
                sha256: sha256IdentityFor(input)
        ]
    }.sort { left, right ->
        (left.coordinate <=> right.coordinate)
                ?: (left.kind <=> right.kind)
                ?: (left.path <=> right.path)
    }
    Map<String, Object> manifest = [
            schema: coordinationStageSchema,
            groupId: coordinationStageGroup,
            artifactId: coordinationStageArtifact,
            version: coordinationStageVersion,
            sourceCommit: sourceProvenance.sourceCommit,
            contracts: [
                    manifestIdentity: bindings.contracts.manifestIdentity,
                    sourceCommit: bindings.contracts.sourceCommit,
                    specificationIdentity:
                            bindings.contracts.specificationIdentity,
                    fixturePackageIdentity:
                            bindings.contracts.fixturePackageIdentity,
                    releaseIdentity: bindings.contracts.releaseIdentity
            ],
            dependencies: dependencies,
            artifacts: artifacts
    ]
    if (bindings.mode == 'immutable-development-contracts') {
        manifest.putAll([
                stagePurpose: sourceProvenance.stagePurpose,
                releaseReadinessClaimed:
                        sourceProvenance.releaseReadinessClaimed,
                builtWithJava: sourceProvenance.builtWithJava,
                sourceTree: sourceProvenance.sourceTree,
                sourceDirty: sourceProvenance.sourceDirty,
                dependencyMode: bindings.mode
        ])
        manifest.contracts.putAll([
                schema: bindings.contracts.schema,
                version: bindings.contracts.version,
                sourceTree: bindings.contracts.sourceTree,
                sourceDirty: bindings.contracts.sourceDirty,
                builtWithJava: bindings.contracts.builtWithJava
        ])
        manifest.bex = [
                schema: bindings.bex.schema,
                manifestIdentity: bindings.bex.manifestIdentity,
                version: bindings.bex.version,
                sourceCommit: bindings.bex.sourceCommit,
                sourceTree: bindings.bex.sourceTree,
                sourceDirty: bindings.bex.sourceDirty,
                builtWithJava: bindings.bex.builtWithJava,
                specificationIdentity: bindings.bex.specificationIdentity,
                fixturePackageIdentity: bindings.bex.fixturePackageIdentity,
                registryPackageIdentity: bindings.bex.registryPackageIdentity,
                gasPackageIdentity: bindings.bex.gasPackageIdentity,
                languageRepositoryManifestIdentity:
                        bindings.contracts.manifestIdentity
        ]
    }
    manifest
}
def verifyClosedStage = {
    File repository, Map expectedManifest ->
    List<String> failures = []
    File manifestFile = new File(repository, 'artifact-manifest.json')
    File sidecar = new File(repository, 'artifact-manifest.json.sha256')
    if (!regularFile(manifestFile)
            || manifestFile.getText('UTF-8') != canonicalJson(expectedManifest)) {
        failures << 'artifact manifest does not bind the exact staged bytes'
    }
    if (!regularFile(sidecar)
            || !regularFile(manifestFile)
            || sidecar.getText('UTF-8') != sha256Hex(manifestFile)
            + '  artifact-manifest.json\n') {
        failures << 'artifact manifest checksum companion differs'
    }
    Set<String> expectedPaths = [
            'artifact-manifest.json',
            'artifact-manifest.json.sha256'
    ] as Set
    expectedManifest.artifacts.each { record ->
        File payload = new File(repository, record.path)
        File checksum = new File(repository, record.checksumPath)
        expectedPaths.add(record.path)
        expectedPaths.add(record.checksumPath)
        if (!regularFile(payload) || !regularFile(checksum)) {
            failures << "missing regular staged payload ${record.path}"
        } else {
            if (sha256IdentityFor(payload) != record.sha256
                    || payload.length() != record.bytes) {
                failures << "staged payload identity differs ${record.path}"
            }
            if (checksum.getText('UTF-8') != sha256Hex(payload)
                    + '  ' + payload.name + '\n') {
                failures << "staged checksum differs ${record.checksumPath}"
            }
        }
    }
    Set<String> actualPaths = relativeFiles(repository, failures)
    if (actualPaths != expectedPaths) {
        failures << ('staged repository closure differs; missing '
                + (expectedPaths - actualPaths).toList().sort()
                + ', unexpected '
                + (actualPaths - expectedPaths).toList().sort())
    }
    if (!failures.empty) {
        throw new GradleException(
                'Immutable Coordination repository failed:\n - '
                        + failures.join('\n - '))
    }
    sha256IdentityFor(manifestFile)
}

