            'blueContractsRepository',
            'blueContractsManifestSha256',
            'Immutable staged Contracts')
    Map manifest = envelope.manifest
    String expectedVersion = providers.gradleProperty(
            'blueContractsVersion').orNull
    List<String> failures = []
    if (expectedVersion == null || expectedVersion.isBlank()) {
        failures << 'blueContractsVersion is required for immutable staged Contracts'
    }
    if (manifest.schema != 'blue-staged-dependency-repository/1.0') {
        failures << "unexpected manifest schema ${manifest.schema}"
    }
    if (manifest.groupId != 'blue.language') {
        failures << "unexpected groupId ${manifest.groupId}"
    }
    if (manifest.version != expectedVersion) {
        failures << "unexpected version ${manifest.version}"
    }
    if (!(manifest.sourceCommit instanceof String)
            || !(manifest.sourceCommit ==~ /[0-9a-f]{40}|[0-9a-f]{64}/)) {
        failures << 'sourceCommit is not an exact Git identity'
    }
    [
            'contractsSpecificationIdentity',
            'contractsFixturePackageIdentity',
            'contractsReleaseIdentity'
    ].each { field ->
        if (!(manifest[field] instanceof String)
                || !(manifest[field] ==~ /sha256:[0-9a-f]{64}/)) {
            failures << "${field} is not a SHA-256 identity"
        }
    }
    if (!failures.empty) {
        throw new GradleException(
                'Immutable staged Contracts repository failed:\n - '
                        + failures.join('\n - '))
    }
    verifyClosedUpstreamRepository(
            envelope,
            expectedRepositoryRecords(
                    'blue.language',
                    expectedVersion,
                    stagedLanguageArtifacts,
                    [
                            javadoc: '-javadoc.jar',
                            pom: '.pom',
                            runtime: '.jar',
                            sources: '-sources.jar'
                    ]),
            58,
            'Immutable staged Contracts')
    [
            repository: envelope.repository,
            manifest: manifest,
            manifestIdentity: envelope.manifestIdentity,
            sourceCommit: manifest.sourceCommit,
            specificationIdentity: manifest.contractsSpecificationIdentity,
            fixturePackageIdentity: manifest.contractsFixturePackageIdentity,
            releaseIdentity: manifest.contractsReleaseIdentity
    ]
}
