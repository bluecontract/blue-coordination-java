                lanes: lanes
        ]), 'UTF-8')
    }
}

def inspectPublicSurface = { File jar, File javap ->
    Map<String, Set<String>> inventory = new TreeMap<>()
    ZipFile zip = new ZipFile(jar)
    List<String> classes
    try {
        classes = Collections.list(zip.entries()).findAll { entry ->
            !entry.directory && entry.name.endsWith('.class')
                    && !entry.name.endsWith('module-info.class')
                    && (entry.name.startsWith('blue/coordination/api/')
                    || entry.name.startsWith('blue/coordination/sdk/')
                    || entry.name.startsWith('blue/coordination/processor/'))
        }.collect { entry ->
            entry.name.substring(0, entry.name.length() - 6)
                    .replace('/', '.')
        }.sort()
    } finally {
        zip.close()
    }
    classes.each { className ->
        Process process = new ProcessBuilder(
                javap.absolutePath, '-protected', '-s',
                '-classpath', jar.absolutePath, className)
                .redirectErrorStream(true).start()
        List<String> lines = process.inputStream.getText('UTF-8')
                .readLines().collect { it.trim() }.findAll {
            !it.isEmpty() && !it.startsWith('Compiled from')
        }
        if (process.waitFor() != 0) {
            throw new GradleException(
                    "javap failed for ${className}: ${lines.join(' ')}")
        }
        int declarationIndex = lines.findIndexOf { line ->
            line.endsWith('{')
        }
        if (declarationIndex < 0
                || !lines[declarationIndex].startsWith('public ')) {
            return
        }
        Set<String> entries = new TreeSet<>()
        entries.add('TYPE ' + lines[declarationIndex])
        String pending = null
        lines.drop(declarationIndex + 1).each { line ->
            if (line == '}') {
                if (pending != null) {
                    entries.add('MEMBER ' + pending)
                    pending = null
                }
            } else if (line.startsWith('descriptor:')) {
                if (pending != null) {
                    entries.add('MEMBER ' + pending + ' | ' + line)
                    pending = null
                }
            } else {
                if (pending != null) {
                    entries.add('MEMBER ' + pending)
                }
                pending = line
            }
        }
        if (pending != null) {
            entries.add('MEMBER ' + pending)
        }
        inventory[className] = entries
    }
    inventory
}

def verifyAcceptedBaseApiCompatibility = tasks.register(
        'verifyAcceptedBaseApiCompatibility') {
    group = 'verification'
    description = 'Rejects API or binary removals against the exact published Coordination rc.4 JAR.'
    dependsOn tasks.named('jar')
    inputs.property('acceptedCompatibilityCoordinate',
            acceptedCompatibilityCoordinate)
    inputs.property('acceptedCompatibilityJarSha256',
            acceptedCompatibilityJarSha256)
    inputs.property('acceptedCompatibilitySourceCommit',
            acceptedCompatibilitySourceCommit)
    outputs.upToDateWhen { false }
    doLast {
        def resolvedArtifacts = acceptedCompatibilityArtifact
                .resolvedConfiguration.resolvedArtifacts
        if (resolvedArtifacts.size() != 1) {
            throw new GradleException(
                    'Published compatibility resolution selected '
                            + resolvedArtifacts.size()
                            + ' artifacts; expected exactly one')
        }
        def baselineArtifact = resolvedArtifacts.iterator().next()
        String selectedCoordinate = [
                baselineArtifact.moduleVersion.id.group,
                baselineArtifact.name,
                baselineArtifact.moduleVersion.id.version
        ].join(':')
        File baselineJar = baselineArtifact.file
        File currentJar = tasks.named('jar').get()
                .archiveFile.get().asFile
        if (selectedCoordinate != acceptedCompatibilityCoordinate
                || baselineArtifact.extension != 'jar'
                || baselineArtifact.classifier != null
                || !regularFile(baselineJar)
                || !regularFile(currentJar)) {
            throw new GradleException(
                    'Published compatibility resolution did not return the '
                            + 'exact runtime JAR ' + acceptedCompatibilityCoordinate)
        }
        String baselineJarSha256 = sha256Hex(baselineJar)
        if (baselineJarSha256 != acceptedCompatibilityJarSha256) {
            throw new GradleException(
                    'Published compatibility JAR identity differs for '
                            + acceptedCompatibilityCoordinate + ': sha256:'
                            + baselineJarSha256)
        }
        def launcher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(17)
        }.get()
        String javapName = System.getProperty('os.name')
                .toLowerCase(Locale.ROOT).contains('windows')
                ? 'javap.exe' : 'javap'
        File javap = launcher.metadata.installationPath
                .file('bin/' + javapName).asFile
        Map<String, Set<String>> baseline = inspectPublicSurface(
                baselineJar, javap)
        Map<String, Set<String>> current = inspectPublicSurface(
                currentJar, javap)
        List<String> removedClasses = (baseline.keySet()
                - current.keySet()).toList().sort()
        Map<String, List<String>> removedEntries = new TreeMap<>()
        baseline.each { className, entries ->
            if (current.containsKey(className)) {
                List<String> removed = (entries - current[className])
                        .toList().sort()
                if (!removed.empty) {
                    removedEntries[className] = removed
                }
            }
        }
        int addedClasses = (current.keySet() - baseline.keySet()).size()
        int addedEntries = current.collect { className, entries ->
            baseline.containsKey(className)
                    ? (entries - baseline[className]).size()
                    : entries.size()
        }.sum() ?: 0
        boolean compatible = removedClasses.isEmpty()
                && removedEntries.isEmpty()
        File report = layout.buildDirectory.file(
                'reports/dynamic-evolution/api-binary-compatibility.json')
                .get().asFile
        report.parentFile.mkdirs()
        report.setText(canonicalJson([
                schema: 'blue-coordination-api-binary-compatibility/2.0',
                status: compatible ? 'PASS' : 'FAIL',
                acceptedBaseCoordinate: acceptedCompatibilityCoordinate,
                acceptedBaseJarSha256: 'sha256:'
                        + acceptedCompatibilityJarSha256,
                acceptedBaseSourceCommit:
                        acceptedCompatibilitySourceCommit,
                currentVersion: coordinationStageVersion,
                baselinePublicClasses: baseline.size(),
                currentPublicClasses: current.size(),
                addedClasses: addedClasses,
                addedEntries: addedEntries,
                removedClasses: removedClasses,
                removedEntries: removedEntries
        ]), 'UTF-8')
        if (!compatible) {
            throw new GradleException(
                    'Public API/binary compatibility failed against '
                            + acceptedCompatibilityCoordinate
                            + '; see ' + report)
        }
    }
}

def verifyCoordinationStagingLanePolicyLogic = tasks.register(
        'verifyCoordinationStagingLanePolicyLogic') {
    group = 'verification'
    description = 'Regression-tests compatibility coverage for immutable candidate lanes.'
    doLast {
        Map<String, Boolean> vectors = [
                'published-artifact': false,
                'immutable-staged-contracts': true,
                'immutable-development-contracts': true,
                'unsupported': false
        ]
        vectors.each { mode, expected ->
            boolean actual = requiresImmutableCandidateCompatibility(mode)
            if (actual != expected) {
                throw new GradleException(
                        "Immutable candidate compatibility policy differs for ${mode}")
            }
        }
        Map<String, Set<String>> protectedGroupVectors = [
                'immutable-staged-contracts': [
                        'blue.coordination', 'blue.language'] as Set,
                'immutable-development-contracts': [
                        'blue.coordination', 'blue.language', 'blue.bex'] as Set,
                'published-artifact': [] as Set,
                'unsupported': [] as Set
        ]
        protectedGroupVectors.each { mode, expected ->
            Set<String> actual = stagedConsumerProtectedGroupsFor(mode)
            if (actual != expected) {
                throw new GradleException(
                        "Staged-consumer protected groups differ for ${mode}: ${actual}")
            }
        }
        String identity = 'sha256:' + ('a' * 64)
        List<Map<String, Object>> bexResolution = [
                [coordinate: 'blue.bex:blue-bex-core:1.1.0-dev.'
                        + ('b' * 40), sha256: identity],
                [coordinate: 'blue.bex:blue-bex-contracts:1.1.0-dev.'
                        + ('b' * 40), sha256: identity],
                [coordinate: 'blue.bex:unexpected-module:1.0.0',
                        sha256: identity]
        ]
        if (resolvedBexRuntimeIdentities(bexResolution).size() != 3) {
            throw new GradleException(
                    'Direct staging filtered an unexpected resolved BEX module')
        }
    }
}

tasks.register('verifyCoordinationStagingTooling') {
    group = 'verification'
    description = 'Protects the isolated, fail-closed staged-consumer boundary.'
    dependsOn verifyCoordinationStagingLanePolicyLogic
    inputs.files('gradle/coordination-staging.gradle',
            fileTree('smoke-tests/staged-coordination'))
    doLast {
        String staging = file('gradle/coordination-staging.gradle')
                .getText('UTF-8')
        String fixture = fileTree('smoke-tests/staged-coordination')
                .files.sort().collect { it.getText('UTF-8') }.join('\n')
        def failures = []
        ['maven' + 'Local()', 'include' + 'Build(', 'flat' + 'Dir {']
                .each { forbidden ->
            if (staging.contains(forbidden)
                    || fixture.contains(forbidden)) {
                failures << "forbidden dependency fallback ${forbidden}"
            }
        }
        [
                'assembleImmutableStagedCoordinationRepository',
                'verifyImmutableStagedCoordinationRepository',
                'stagedCoordinationConsumer',
                'stagedCoordinationConsumerJava17',
                'stagedCoordinationConsumerJava21',
                "buildName = 'staged-coordination-java' + javaVersion",
                'staged-consumer-java17.json',
                'staged-consumer-java21.json',
                'verifyAcceptedBaseApiCompatibility',
                'coordinationSourceCommit',
                'coordinationStagedRepository',
                'blue-development-maven-repository/1.0',
                'blue-bex-development-repository/1.0',
                'blueBexRepository',
                'blueBexManifestSha256',
                'blueBexSourceCommit',
                'releaseReadinessClaimed',
                'sourceDirty',
                'expectedFileCount',
                'blue.coordination:blue-coordination-java:3.0.0-rc.4',
                'a8dc99f5bcc62902496ee3bdb5e8f085b78d9781e7928ef20f5a83b65581cd34',
                'acf02f3ce7c141e4fc9eabb6f19dacde471e30f4',
                'https://repo1.maven.org/maven2',
                'deactivateDependencyLocking()'
        ].each { required ->
            if (!staging.contains(required)) {
                failures << "missing staging contract ${required}"
            }
        }
        [
                "'git', " + "'archive'",
                'blue-coordination-java-3.0.0-' + 'rc.3.jar',
                'c6f9c80d0a33c6c209c7' + 'ba3d2b8bff89a223fc5f'
        ].each { retired ->
            if (staging.contains(retired)) {
                failures << "retired source-built compatibility base ${retired}"
            }
        }
        if (!fixture.contains("includeGroup 'blue.coordination'")
                || !fixture.contains("includeGroup 'blue.language'")
                || !fixture.contains("includeGroup 'blue.bex'")) {
            failures << 'consumer repositories are not group-exclusive'
        }
        [
                "providers.gradleProperty('testJavaVersion')",
                'options.release = 17',
                'javaLauncher =',
                'Runtime.version().feature()',
                'runtimeVersionAssertion'
        ].each { required ->
            if (!fixture.contains(required)) {
                failures << "missing staged-consumer runtime contract ${required}"
            }
        }
        if (!failures.empty) {
            throw new GradleException(failures.join('; '))
        }
    }
}

tasks.register('dynamicEvolutionCoordinationHandoff') {
    group = 'verification'
    description = 'Runs compatibility, immutable staging, and isolated consumer gates.'
    dependsOn verifyAcceptedBaseApiCompatibility,
            stagedCoordinationConsumer
}

tasks.named('releaseCheck') {
    dependsOn tasks.named('verifyCoordinationStagingTooling')
    if (coordinationUsesImmutableContracts) {
        dependsOn verifyAcceptedBaseApiCompatibility
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyCoordinationStagingTooling')
}
