def currentRepositoryLock = new Properties()
file('gradle/blue-sibling-lock.properties').withInputStream {
    currentRepositoryLock.load(it)
}

sourceSets {
    repositoryJarSmoke {
        java.srcDir 'src/repositoryJarSmoke/java'
        resources.srcDir 'src/repositoryJarSmoke/resources'
    }
}

dependencies {
    repositoryJarSmokeImplementation files(
            System.getProperty(
                    'org.gradle.project.blueRepositoryArtifactPath'))
    repositoryJarSmokeImplementation(
            "blue.language:blue-language-java:"
                    + currentRepositoryLock.blueLanguageVersion)
}

def repositoryJarSmokeSha256 = { File input ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    input.withInputStream { stream ->
        byte[] buffer = new byte[8192]
        int read
        while ((read = stream.read(buffer)) >= 0) {
            if (read > 0) {
                digest.update(buffer, 0, read)
            }
        }
    }
    digest.digest().encodeHex().toString()
}

def repositoryJarSmokeReport = layout.buildDirectory.file(
        'reports/current-local-repository/jar-consumer-smoke.json')

tasks.register('localRepositoryJarConsumerSmoke', JavaExec) {
    group = 'verification'
    description = 'Runs one isolated runtime admission case against the hash-verified local Repository JAR.'
    dependsOn tasks.named('repositoryJarSmokeClasses')
    classpath = sourceSets.repositoryJarSmoke.runtimeClasspath
    mainClass.set(
            'blue.coordination.repository.CurrentRepositoryJarSmoke')
    args(
            repositoryJarSmokeReport.get().asFile.absolutePath,
            currentRepositoryLock.blueRepositoryBlueId,
            currentRepositoryLock.blueRepositoryJarSha256)
    outputs.file(repositoryJarSmokeReport)
    doFirst {
        File repositoryJar = file(System.getProperty(
                'org.gradle.project.blueRepositoryArtifactPath'))
        String observed = repositoryJarSmokeSha256(repositoryJar)
        if (observed != currentRepositoryLock.blueRepositoryJarSha256) {
            throw new GradleException(
                    "Local Repository JAR digest differs: ${observed}")
        }
        delete(repositoryJarSmokeReport.get().asFile)
    }
}
