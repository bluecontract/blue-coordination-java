/*
 * Focused Java 17 acceptance module for the compact Coordination runtime.
 * It has no dependency on myosDemoTest and does not enter the legacy evidence
 * inventory.
 */
sourceSets {
    basicTest {
        java.setSrcDirs(['src/basicTest/java'])
        resources.setSrcDirs(['src/basicTest/resources'])
        compileClasspath += sourceSets.main.output \
                + sourceSets.coordinationTestSupport.output
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    basicTestImplementation.extendsFrom testImplementation
    basicTestCompileOnly.extendsFrom testCompileOnly
    basicTestRuntimeOnly.extendsFrom testRuntimeOnly
}

tasks.named('compileBasicTestJava', JavaCompile) {
    javaCompiler.set(javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(17)
    })
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    options.release.set(17)
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll([
            '-Xlint:all',
            '-Xlint:-serial',
            '-Werror'
    ])
}

def basicMetricsDirectory = layout.buildDirectory.dir('reports/basic-test/metrics')

def configureBasicTest = { Test task ->
    task.dependsOn tasks.named('basicTestClasses')
    task.testClassesDirs = sourceSets.basicTest.output.classesDirs
    task.classpath = sourceSets.basicTest.runtimeClasspath
    task.javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    })
    task.useJUnitPlatform()
    task.systemProperty 'junit.jupiter.execution.parallel.enabled', 'false'
    task.systemProperty 'basic.test.metrics.dir',
            basicMetricsDirectory.get().asFile.absolutePath
    def requestedStrictPerformance =
            System.getProperty('basic.strictPerformance')
    if (requestedStrictPerformance != null) {
        task.systemProperty 'basic.strictPerformance',
                requestedStrictPerformance
    }
    task.outputs.dir(basicMetricsDirectory)
    task.outputs.upToDateWhen { false }
    task.outputs.doNotCacheIf('contains wall-clock diagnostics') { true }
    task.doFirst {
        project.delete(basicMetricsDirectory.get().asFile)
    }
    task.maxHeapSize = '2g'
    task.maxParallelForks = 1
    // Keep one worker alive: first-seen and warm samples are labelled inside
    // the tests instead of paying a fresh JVM/JIT tax for every class.
    task.forkEvery = 0L
    task.reports {
        junitXml.required = true
        html.required = true
    }
    task.testLogging {
        events 'FAILED', 'SKIPPED'
        showStandardStreams = true
        exceptionFormat = 'full'
    }
    task.doFirst {
        if (project.hasProperty('basicJfrFile')) {
            def recording = project.file(
                    project.property('basicJfrFile')).absoluteFile
            recording.parentFile.mkdirs()
            task.jvmArgs "-XX:StartFlightRecording=filename=${recording},settings=profile,dumponexit=true"
        }
    }
}

tasks.register('basicSmokeTest', Test) {
    group = 'verification'
    description = 'Runs the compact engine architecture, append, ownership, and rollback smoke gate.'
    configureBasicTest(delegate)
    filter {
        includeTestsMatching 'blue.coordination.basic.ArchitectureGuardTest'
        includeTestsMatching 'blue.coordination.basic.BasicCounterTest'
        includeTestsMatching 'blue.coordination.basic.WholeRequestLatencyParityTest'
        includeTestsMatching 'blue.coordination.basic.AutonomousRootIsolationTest'
        includeTestsMatching 'blue.coordination.basic.FailureRetryAtomicityTest.failedProcessorManagedParentRevisionRestoresJournalFrontier'
    }
}

tasks.register('basicTest', Test) {
    group = 'verification'
    description = 'Runs compact Coordination correctness and diagnostic tests.'
    configureBasicTest(delegate)
    useJUnitPlatform {
        excludeTags 'runtimeCampaign', 'performance', 'scenario'
    }
}

tasks.register('basicScenarioTest', Test) {
    group = 'verification'
    description = 'Runs realistic NBA and large host/PayNote scenarios.'
    configureBasicTest(delegate)
    useJUnitPlatform {
        includeTags 'scenario'
        excludeTags 'runtimeCampaign'
    }
}

tasks.register('basicPerformanceTest', Test) {
    group = 'verification'
    description = 'Runs only opt-in basicTest latency and scaling contracts.'
    configureBasicTest(delegate)
    useJUnitPlatform {
        includeTags 'performance'
    }
    systemProperty 'basic.strictPerformance', 'true'
}

tasks.register('basicRuntimeCampaign', Test) {
    group = 'verification'
    description = 'Runs strict same-source basicTest runtime evidence campaign.'
    configureBasicTest(delegate)
    useJUnitPlatform {
        includeTags 'runtimeCampaign'
    }
    minHeapSize = '128m'
    maxHeapSize = '1g'
    jvmArgs '-XX:+UseG1GC'
    systemProperty 'basic.strictPerformance', 'true'
    systemProperty 'blue.basic.strictPerformance', 'true'
    systemProperty 'basic.runtime.documentSamples',
            providers.gradleProperty('basicRuntimeDocumentSamples')
                    .getOrElse('30')
    systemProperty 'blue.basic.runtimeReport',
            layout.buildDirectory
                    .file('reports/basicTest/runtime-comparison.md')
                    .get().asFile.absolutePath
    outputs.files(
            layout.buildDirectory.file(
                    'reports/basicTest/runtime-comparison.md'),
            layout.buildDirectory.file(
                    'reports/basicTest/runtime-comparison.json'))
}
