/*
 * The existing topology tasks validate the exact sibling commits, BEX
 * receipt, nested BEX -> Language composite, six focused project artifacts,
 * and immutable local Repository binary. This additional receipt proves that
 * the dedicated example source set resolves that same seven-artifact graph
 * and has not reintroduced aggregate/conformance artifacts.
 */
def verifyMyosDemoDependencyClasspath = tasks.register(
        'verifyMyosDemoDependencyClasspath') {
    group = 'verification'
    description =
            'Verifies the exact focused Blue graph used by the MyOS examples.'
    dependsOn(
            'verifyLatestBlueSiblingInputs',
            'writeLatestBlueDependencyLock',
            'verifyNestedLocalCompositeDependencies',
            'writeLocalCompositeDependencyEvidence')
    inputs.file(myosResolvedDependencyLock)
    inputs.file(myosSiblingInputs)
    outputs.file(myosDependencyReport)
    outputs.upToDateWhen { false }
    doFirst {
        delete(myosDependencyReport.get().asFile)
    }
    doLast {
        File authoritativeFile =
                myosResolvedDependencyLock.get().asFile
        def authoritative = new JsonSlurper().parse(authoritativeFile)
        def failures = new ArrayList<String>()
        if (authoritative?.schema
                != 'blue-coordination/latest-blue-dependency-lock/1.0'
                || authoritative?.status != 'verified'
                || authoritative?.mode
                != 'published-language-local-bex-repository'
                || authoritative?.failures != []) {
            failures.add(
                    'The authoritative focused dependency lock is not verified.')
        }

        def configuration = configurations.myosDemoTestRuntimeClasspath
        def resolution = configuration.incoming.resolutionResult
        def blueComponents = resolution.allComponents.findAll { component ->
            component.moduleVersion != null
                    && component.moduleVersion.group in [
                    'blue.language',
                    'blue.bex',
                    'blue.repo'
            ]
        }
        def byCoordinate = blueComponents.groupBy { component ->
            "${component.moduleVersion.group}:${component.moduleVersion.name}"
                    .toString()
        }
        def resolved = new TreeMap<String, Object>()
        byCoordinate.each { coordinate, matches ->
            if (matches.size() != 1) {
                failures.add(
                        "Expected one component for ${coordinate}; found "
                                + matches.size())
                return
            }
            def component = matches[0]
            def identifier = component.id
            def value = [
                    selectedVersion: component.moduleVersion.version,
                    componentType : identifier.class.simpleName
            ]
            if (identifier instanceof ProjectComponentIdentifier) {
                value.buildPath = identifier.build.buildPath.toString()
                value.projectPath = identifier.projectPath.toString()
            } else if (identifier instanceof ModuleComponentIdentifier) {
                value.module = identifier.displayName
            }
            resolved.put(coordinate, value)
        }

        def artifacts = new TreeMap<String, Object>()
        configuration.resolvedConfiguration.resolvedArtifacts
                .findAll { artifact ->
                    artifact.moduleVersion.id.group in [
                            'blue.language',
                            'blue.bex',
                            'blue.repo'
                    ] && artifact.extension == 'jar'
                }
                .sort { left, right ->
                    String leftCoordinate =
                            "${left.moduleVersion.id.group}:${left.name}"
                    String rightCoordinate =
                            "${right.moduleVersion.id.group}:${right.name}"
                    leftCoordinate <=> rightCoordinate
                }
                .each { artifact ->
                    String coordinate =
                            "${artifact.moduleVersion.id.group}:${artifact.name}"
                    if (artifacts.containsKey(coordinate)) {
                        failures.add(
                                "Multiple example artifacts resolved for "
                                        + coordinate)
                    }
                    artifacts.put(
                            coordinate,
                            [
                                    file  : artifact.file.absolutePath,
                                    bytes : artifact.file.length(),
                                    sha256: myosSha256(artifact.file)
                            ])
                }

        def expectedComponents = authoritative?.resolvedComponents
                instanceof Map
                ? authoritative.resolvedComponents
                : [:]
        def expectedArtifacts = authoritative?.artifacts instanceof Map
                ? authoritative.artifacts
                : [:]
        if ((resolved.keySet() as Set)
                != (expectedComponents.keySet() as Set)) {
            failures.add(
                    'Example Blue components differ from the authoritative '
                            + "focused set: ${resolved.keySet()}")
        }
        if ((artifacts.keySet() as Set)
                != (expectedArtifacts.keySet() as Set)) {
            failures.add(
                    'Example Blue artifacts differ from the authoritative '
                            + "focused set: ${artifacts.keySet()}")
        }
        expectedComponents.each { coordinate, expected ->
            def actual = resolved.get(coordinate)
            if (actual == null
                    || actual.selectedVersion != expected.selectedVersion
                    || actual.componentType != expected.componentType
                    || (expected.buildPath != null
                    && actual.buildPath != expected.buildPath)
                    || (expected.projectPath != null
                    && actual.projectPath != expected.projectPath)) {
                failures.add(
                        "Example component ${coordinate}=${actual}; expected "
                                + expected)
            }
        }
        expectedArtifacts.each { coordinate, expected ->
            def actual = artifacts.get(coordinate)
            if (actual == null
                    || actual.sha256 != expected.sha256
                    || actual.bytes != expected.bytes) {
                failures.add(
                        "Example artifact ${coordinate}=${actual}; expected "
                                + "SHA-256 ${expected.sha256} and bytes "
                                + expected.bytes)
            }
        }
        def forbiddenCoordinates = artifacts.keySet().findAll { coordinate ->
            coordinate in [
                    'blue.language:blue-language-java',
                    'blue.language:blue-conformance',
                    'blue.bex:blue-bex-java'
            ]
        }
        if (!forbiddenCoordinates.isEmpty()) {
            failures.add(
                    'Example classpath contains aggregate/conformance Blue '
                            + "artifacts: ${forbiddenCoordinates}")
        }

        def report = [
                schema                 :
                        'blue-coordination/myos-demo-dependency-lock/1.0',
                status                 : failures.isEmpty()
                        ? 'verified'
                        : 'failed',
                configuration          : configuration.name,
                authoritativeLock      : [
                        path  : authoritativeFile.absolutePath,
                        sha256: myosSha256(authoritativeFile)
                ],
                siblingInputs          : myosEvidenceSource(
                        myosSiblingInputs.get().asFile),
                resolvedComponents     : resolved,
                artifacts              : artifacts,
                aggregateAndConformance: [
                        status     : forbiddenCoordinates.isEmpty()
                                ? 'absent'
                                : 'present',
                        coordinates: forbiddenCoordinates.sort()
                ],
                failures               : failures.sort()
        ]
        myosWriteJson(myosDependencyReport.get().asFile, report)
        if (!failures.isEmpty()) {
            throw new GradleException(
                    'MyOS demo dependency preflight failed: ' + failures)
        }
    }
}

/*
 * Observation and strict rejection are separate so the aggregate report can
 * remain truthful even when a style regression is present.
 */
def inspectMyosDemoSourceStyle = tasks.register(
        'inspectMyosDemoSourceStyle') {
    group = 'verification'
    description =
            'Writes deterministic source-quality evidence for MyOS examples.'
    def sources = fileTree('src/myosDemoTest/java') {
        include '**/*.java'
    }
    inputs.files(sources)
    outputs.file(myosSourceStyleReport)
    outputs.upToDateWhen { false }
    doFirst {
        delete(myosSourceStyleReport.get().asFile)
    }
    doLast {
        def violations = new ArrayList<Map<String, String>>()
        def testInventory = new ArrayList<String>()
        def performanceTestInventory = new ArrayList<String>()
        def javaFiles = sources.files.sort { left, right ->
            projectDir.toPath().relativize(left.toPath()).toString()
                    <=> projectDir.toPath().relativize(right.toPath())
                    .toString()
        }
        javaFiles.each { source ->
            String relative = projectDir.toPath()
                    .relativize(source.toPath())
                    .toString()
                    .replace(File.separatorChar, '/' as char)
            String text = source.getText('UTF-8')
            def forbidden = [
                    [pattern: ~/(?s)\bnew\s+(?:blue\.language\.model\.)?Node\s*\(/,
                     token  : 'new Node(',
                     reason : 'imperative Blue document construction'],
                    [pattern: ~/\bSystem\s*\.\s*out\b/,
                     token  : 'System.out',
                     reason : 'console logging in business examples'],
                    [pattern: ~/\bSystem\s*\.\s*err\b/,
                     token  : 'System.err',
                     reason : 'console logging in business examples'],
                    [pattern: ~/\bThread\s*\.\s*sleep\s*\(/,
                     token  : 'Thread.sleep',
                     reason : 'sleep-based synchronization']
            ]
            if (!myosTimingInfrastructureSources.contains(relative)) {
                forbidden.addAll([
                        [pattern: ~/\bSystem\s*\.\s*nanoTime\s*\(/,
                         token  : 'System.nanoTime',
                         reason : 'ad hoc benchmark/timing code'],
                        [pattern: ~/\b(?:System\s*\.\s*)?currentTimeMillis\s*\(/,
                         token  : 'currentTimeMillis',
                         reason : 'ad hoc benchmark/timing code']
                ])
            }
            forbidden.each { check ->
                if (check.pattern.matcher(text).find()) {
                    violations.add([
                            path  : relative,
                            token : check.token,
                            reason: check.reason
                    ])
                }
            }
            if (source.name.endsWith('Test.java')) {
                int testCount = (text =~ /(?m)^\s*@Test\s*$/).count
                def testMethods = new ArrayList<String>()
                def performanceTestMethods = new ArrayList<Boolean>()
                def testMethodStarts = new ArrayList<Integer>()
                def matcher = (text =~ /(?s)@Test\s+(?:@[^\n]+\s+)*(?:public\s+|protected\s+|private\s+)?void\s+([A-Za-z_][A-Za-z0-9_]*)\s*\(/)
                while (matcher.find()) {
                    testMethods.add(matcher.group(1).toString())
                    performanceTestMethods.add(
                            matcher.group(0).contains(
                                    '@Tag("performance")'))
                    testMethodStarts.add(matcher.start())
                }
                if (testMethods.size() != testCount) {
                    violations.add([
                            path  : relative,
                            token : '@Test',
                            reason: 'every JUnit method must be a void method'
                    ])
                }
                testMethods.findAll { !it.startsWith('should') }.each {
                    method ->
                        violations.add([
                                path  : relative,
                                token : method,
                                reason: 'JUnit method names must start with should'
                        ])
                }
                testMethods.eachWithIndex { method, index ->
                    int end = index + 1 < testMethodStarts.size()
                            ? testMethodStarts[index + 1]
                            : text.length()
                    String methodRegion = text.substring(
                            testMethodStarts[index], end)
                    [
                            '// given': 'given',
                            '// when' : 'when',
                            '// then' : 'then'
                    ].each { marker, label ->
                        int count = methodRegion.count(marker)
                        if (count != 1) {
                            violations.add([
                                    path  : relative,
                                    token : method + ':' + marker,
                                    reason: "expected one ${label} section "
                                            + "in ${method}; found ${count}"
                            ])
                        }
                    }
                }
                def packageMatcher =
                        (text =~ /(?m)^\s*package\s+([A-Za-z_][A-Za-z0-9_.]*)\s*;/)
                String packageName = packageMatcher.find()
                        ? packageMatcher.group(1)
                        : ''
                String className = source.name.substring(
                        0, source.name.length() - '.java'.length())
                testMethods.eachWithIndex { method, index ->
                    String testId = (packageName.isEmpty()
                            ? className
                            : packageName + '.' + className) + '#' + method
                    testInventory.add(testId)
                    if (performanceTestMethods[index]) {
                        performanceTestInventory.add(testId)
                    }
                }
            }
        }
        violations.sort { left, right ->
            int pathOrder = left.path <=> right.path
            if (pathOrder != 0) {
                return pathOrder
            }
            int tokenOrder = left.token <=> right.token
            return tokenOrder != 0
                    ? tokenOrder
                    : left.reason <=> right.reason
        }
        testInventory.sort()
        performanceTestInventory.sort()
        def correctnessTestInventory = testInventory.findAll { testId ->
            !performanceTestInventory.contains(testId)
        }
        def report = [
                schema             :
                        'blue-coordination/myos-demo-source-style/1.0',
                status             : violations.isEmpty()
                        ? 'passed'
                        : 'failed',
                javaFiles          : (long) javaFiles.size(),
                testMethods        : testInventory,
                correctnessTestMethods: correctnessTestInventory,
                performanceTestMethods: performanceTestInventory,
                businessTestMethods:
                        (long) testInventory.count {
                            String testId ->
                                int separator = testId.indexOf('#')
                                separator > 0
                                        && myosExampleByClass.containsKey(
                                        testId.substring(0, separator))
                        },
                violations         : violations
        ]
        myosWriteJson(myosSourceStyleReport.get().asFile, report)
    }
}

def verifyMyosDemoSourceStyle = tasks.register(
        'verifyMyosDemoSourceStyle') {
    group = 'verification'
    description =
            'Rejects imperative construction, noisy code, and malformed business tests.'
    dependsOn inspectMyosDemoSourceStyle
    inputs.file(myosSourceStyleReport)
    doLast {
        def report = new JsonSlurper().parse(
                myosSourceStyleReport.get().asFile)
        if (report.status != 'passed'
                || !(report.violations instanceof List)
                || !report.violations.isEmpty()) {
            throw new GradleException(
                    'MyOS demo source-style verification failed; see '
                            + myosSourceStyleReport.get().asFile)
        }
    }
}

/*
 * Round-two removals are architectural constraints, not review conventions.
 * Assemble retired names from fragments so this gate can scan its own Gradle
 * source without exempting the verification implementation.
 */
def verifyMyosRoundTwoStaticProhibitions = tasks.register(
        'verifyMyosRoundTwoStaticProhibitions') {
    group = 'verification'
    description =
            'Rejects retired dispatch helpers, target-key appends, and operation literals.'

    def broadSources = files(
            fileTree('src'),
            file('README.md'),
            fileTree('docs'),
            fileTree('gradle'))
    def timelineSources = files(
            fileTree('src/myosDemoTest'),
            file('README.md'),
            fileTree('docs'))
    def operationSources = files(
            fileTree('src/myosDemoTest/java/blue/coordination/examples/support'),
            fileTree('src/main/java/blue/coordination/engine'))
    inputs.files(broadSources, timelineSources, operationSources)
    outputs.upToDateWhen { false }

    doLast {
        def retiredDispatchNames = [
                'richestRoute' + 'Groups',
                'deliver' + 'Matching',
                'deliverSameEntry' + 'Matching'
        ]
        def quotedAlternatives = { List<String> values ->
            values.collect { value ->
                java.util.regex.Pattern.quote(value)
            }.join('|')
        }
        def rules = [
                [id     : 'retired-dispatch-api',
                 sources: broadSources,
                 pattern: java.util.regex.Pattern.compile(
                         quotedAlternatives(retiredDispatchNames))],
                [id     : 'target-key-timeline-append',
                 sources: timelineSources,
                 pattern: java.util.regex.Pattern.compile(
                         'append\\s*\\(\\s*"[^"]+"\\s*,')],
                [id     : 'operation-name-literal',
                 sources: operationSources,
                 pattern: java.util.regex.Pattern.compile(
                         java.util.regex.Pattern.quote(
                                 'authorize' + 'Amount'))]
        ]
        def violations = new ArrayList<Map<String, Object>>()
        rules.each { rule ->
            rule.sources.files.findAll { source ->
                source.isFile()
            }.sort { left, right ->
                projectDir.toPath().relativize(left.toPath()).toString()
                        <=> projectDir.toPath().relativize(right.toPath())
                        .toString()
            }.each { source ->
                String relative = projectDir.toPath()
                        .relativize(source.toPath())
                        .toString()
                        .replace(File.separatorChar, '/' as char)
                String text = source.getText('UTF-8')
                def matcher = rule.pattern.matcher(text)
                while (matcher.find()) {
                    violations.add([
                            path: relative,
                            line: 1L + text.substring(0, matcher.start())
                                    .count('\n'),
                            rule: rule.id
                    ])
                }
            }
        }
        violations.sort { left, right ->
            int pathOrder = left.path <=> right.path
            if (pathOrder != 0) {
                return pathOrder
            }
            int lineOrder = left.line <=> right.line
            return lineOrder != 0
                    ? lineOrder
                    : left.rule <=> right.rule
        }
        if (!violations.isEmpty()) {
            String details = violations.collect { violation ->
                "${violation.path}:${violation.line}: ${violation.rule}"
            }.join(System.lineSeparator())
            throw new GradleException(
                    'MyOS round-two static prohibitions failed:'
                            + System.lineSeparator() + details)
        }
    }
}

/*
 * This is the strict, single-execution MyOS campaign. Reports consume its
 * JUnit XML and evidence without rerunning any behavior.
 */
def coordinationMyosDemoTest = tasks.register(
        'coordinationMyosDemoTest', Test) {
    group = 'verification'
    description = 'Runs the executable MyOS/Playground business examples.'
    dependsOn(
            tasks.named('myosDemoTestClasses'),
            verifyMyosDemoDependencyClasspath,
            inspectMyosDemoSourceStyle)
    testClassesDirs = sourceSets.myosDemoTest.output.classesDirs
    classpath = sourceSets.coordinationTestSupport.output \
            + sourceSets.myosDemoTest.runtimeClasspath
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    })
    useJUnitPlatform {
        if (!myosPerformanceGatesEnabled) {
            excludeTags 'performance'
        }
    }
    systemProperty(
            'junit.jupiter.execution.parallel.enabled',
            'false')
    systemProperty(
            'coordination.performance.gates',
            Boolean.toString(myosPerformanceGatesEnabled))
    [
            'coordination.performance.paynote.samples',
            'coordination.performance.operation.samples',
            'myos.demo.latencyEvidenceDir'
    ].each { forwardedProperty ->
        String supplied = System.getProperty(forwardedProperty)
        if (supplied != null && !supplied.trim().isEmpty()) {
            systemProperty(forwardedProperty, supplied)
        }
    }
    systemProperty(
            'myos.demo.runtimeEvidence',
            myosRuntimeEvidence.get().asFile.absolutePath)
    systemProperty(
            'myos.demo.runtimeEvidenceShards',
            myosRuntimeEvidenceShards.get().asFile.absolutePath)
    systemProperty(
            'myos.demo.documentsEvidence',
            myosDocumentsManifest.get().asFile.absolutePath)
    def requestedOperationTiming =
            System.getProperty('myos.demo.operationTiming')
    def operationTimingDestination = requestedOperationTiming != null
            && !requestedOperationTiming.trim().isEmpty()
            ? requestedOperationTiming
            : (myosPerformanceGatesEnabled
            ? layout.buildDirectory.file(
                    'reports/myos-demo-examples/'
                            + 'performance-operation-timing.json')
                    .get().asFile.absolutePath
            : null)
    if (operationTimingDestination != null) {
        systemProperty(
                'myos.demo.operationTiming',
                operationTimingDestination)
    }
    def requestedJfr = System.getProperty('myos.demo.jfr')
    if (requestedJfr != null && !requestedJfr.trim().isEmpty()) {
        File jfrDestination = file(requestedJfr)
                .absoluteFile
        jvmArgs(
                '-XX:FlightRecorderOptions=stackdepth=256',
                '-XX:StartFlightRecording=filename='
                        + jfrDestination.absolutePath
                        + ',settings=profile,dumponexit=true')
        doFirst {
            jfrDestination.parentFile.mkdirs()
            if (jfrDestination.exists()
                    && !jfrDestination.delete()) {
                throw new GradleException(
                        'Could not replace MyOS JFR recording: '
                                + jfrDestination)
            }
        }
    }
    maxHeapSize = '4g'
    maxParallelForks = 1
    forkEvery = 0L
    failFast = false
    ignoreFailures = false
    reports {
        junitXml.required = true
        html.required = true
    }
    outputs.files(
            myosRuntimeEvidence,
            myosDocumentsManifest)
    outputs.dir(myosRuntimeEvidenceShards)
    outputs.upToDateWhen { false }
    doFirst {
        delete(
                myosRuntimeEvidence.get().asFile,
                myosRuntimeEvidenceShards.get().asFile,
                myosDocumentsManifest.get().asFile)
        if (operationTimingDestination != null) {
            delete(file(operationTimingDestination))
        }
        mkdir(myosRuntimeEvidenceShards.get().asFile)
    }
    testLogging {
        events 'FAILED', 'SKIPPED'
        showStandardStreams = false
        exceptionFormat = 'full'
    }
}

/*
 * Capture the current source/dependency baseline without trusting a retained
 * engine receipt from an earlier invocation. The engine gate remains an
 * explicit post-example command, so its baseline status is truthfully
 * notExecuted here.
 */
def generateMyosDemoBaselineReport = tasks.register(
        'generateMyosDemoBaselineReport') {
    group = 'verification'
    description =
            'Records exact source and dependency inputs for the MyOS example run.'
    dependsOn verifyMyosDemoDependencyClasspath
    inputs.files(
            myosDependencyReport,
            myosSiblingInputs)
    outputs.file(myosBaselineReport)
    outputs.upToDateWhen { false }
    doFirst {
        delete(myosBaselineReport.get().asFile)
    }
    doLast {
        def topology = project.ext.latestBlueDependencyTopology
        def sourceState = { File root ->
            String status = myosGit(root, 'status', '--porcelain')
            [
                    commit : myosGit(root, 'rev-parse', 'HEAD'),
                    state  : status.isEmpty() ? 'clean' : 'dirty',
                    entries: status.isEmpty()
                            ? 0L
                            : (long) status.readLines().size()
            ]
        }
        def dependency = new JsonSlurper().parse(
                myosDependencyReport.get().asFile)
        def report = [
                schema           :
                        'blue-coordination/myos-demo-baseline/1.0',
                status           : dependency.status == 'verified'
                        ? 'notExecuted'
                        : 'failed',
                repositories     : [
                        coordination: sourceState(projectDir),
                        language    : sourceState(topology.languageRoot),
                        bex         : sourceState(topology.bexRoot),
                        repository  : sourceState(
                                topology.repositorySourceRoot)
                ],
                siblingLock      : [
                        path  : topology.lockFile.absolutePath,
                        sha256: myosSha256(topology.lockFile)
                ],
                dependencyReceipt: myosEvidenceSource(
                        myosDependencyReport.get().asFile),
                artifacts        : dependency.artifacts,
                engineWorkingGate: [
                        task  : 'coordinationProcessingEngineWorkingVerification',
                        status: 'notExecuted',
                        reason:
                                'The prompt requires this as a separate post-example invocation; retained historical reports are not consumed.'
                ],
                externalBlockers : []
        ]
        myosWriteJson(myosBaselineReport.get().asFile, report)
    }
}

/*
 * Source-set separation is a Gradle default, but the RC evidence verifies the
 * produced artifacts rather than trusting configuration intent. The source
 * distribution is intentionally excluded: it should carry the executable
 * examples, while the published binary/sources/Javadoc/API must not.
 */
def inspectMyosDemoPublishedArtifactIsolation = tasks.register(
        'inspectMyosDemoPublishedArtifactIsolation') {
    group = 'verification'
    description =
            'Proves Java 17 example classes do not contaminate published artifacts.'
    dependsOn(
            tasks.named('jar'),
            tasks.named('sourcesJar'),
            tasks.named('javadocJar'),
            tasks.named('verifyJava8Bytecode'),
            tasks.named('generateCoordinationPublicApiReport'))
    inputs.files(
            tasks.named('jar').flatMap { it.archiveFile },
            tasks.named('sourcesJar').flatMap { it.archiveFile },
            tasks.named('javadocJar').flatMap { it.archiveFile },
            myosJava8BytecodeReport,
            myosPublicApiReport)
    outputs.file(myosArtifactIsolationReport)
    outputs.upToDateWhen { false }
    doFirst {
        delete(myosArtifactIsolationReport.get().asFile)
    }
    doLast {
        String forbiddenPath = 'blue/coordination/examples/'
        def archiveEvidence = new TreeMap<String, Object>()
        def violations = new ArrayList<String>()
        def archives = [
                binary : tasks.named('jar').get()
                        .archiveFile.get().asFile,
                sources: tasks.named('sourcesJar').get()
                        .archiveFile.get().asFile,
                javadoc: tasks.named('javadocJar').get()
                        .archiveFile.get().asFile
        ]
        archives.each { label, archive ->
            def zip = new java.util.zip.ZipFile(archive)
            def forbiddenEntries
            try {
                forbiddenEntries = Collections.list(zip.entries())
                        .findAll { entry ->
                            !entry.directory
                                    && entry.name.startsWith(forbiddenPath)
                        }
                        .collect { it.name }
                        .sort()
            } finally {
                zip.close()
            }
            if (!forbiddenEntries.isEmpty()) {
                violations.add(
                        "${label} artifact contains MyOS example entries: "
                                + forbiddenEntries)
            }
            archiveEvidence.put(
                    label,
                    [
                            path            : archive.absolutePath,
                            sha256          : myosSha256(archive),
                            bytes           : archive.length(),
                            forbiddenEntries: forbiddenEntries
                    ])
        }

        File bytecodeFile = myosJava8BytecodeReport.get().asFile
        def bytecodeProperties = new Properties()
        bytecodeFile.withInputStream {
            bytecodeProperties.load(it)
        }
        if (bytecodeProperties.getProperty('compatible') != 'true') {
            violations.add(
                    'The published binary is not Java 8 bytecode compatible.')
        }

        File apiFile = myosPublicApiReport.get().asFile
        def api = new JsonSlurper().parse(apiFile)
        def apiExampleClasses = api?.classes instanceof List
                ? api.classes.findAll { value ->
            value?.name?.toString()
                    ?.startsWith('blue.coordination.examples.')
        }.collect { it.name.toString() }.sort()
                : []
        if (!apiExampleClasses.isEmpty()) {
            violations.add(
                    'The public API inventory contains MyOS example classes: '
                            + apiExampleClasses)
        }

        def mainClasses = sourceSets.main.output.classesDirs.files.collect {
            it.canonicalPath
        } as Set
        def exampleClasses =
                sourceSets.myosDemoTest.output.classesDirs.files.collect {
                    it.canonicalPath
                } as Set
        def sharedOutputDirectories = mainClasses.intersect(exampleClasses)
        if (!sharedOutputDirectories.isEmpty()) {
            violations.add(
                    'Main and MyOS example source sets share class output '
                            + 'directories: ' + sharedOutputDirectories)
        }

        def report = [
                schema                 :
                        'blue-coordination/myos-demo-artifact-isolation/1.0',
                status                 : violations.isEmpty()
                        ? 'passed'
                        : 'failed',
                forbiddenPublishedPath : forbiddenPath,
                archives               : archiveEvidence,
                java8Bytecode           : [
                        path   : bytecodeFile.absolutePath,
                        sha256 : myosSha256(bytecodeFile),
                        status : bytecodeProperties.getProperty('compatible')
                                == 'true' ? 'passed' : 'failed',
                        maximumObservedMajorVersion:
                                bytecodeProperties.getProperty(
                                        'maximumObservedMajorVersion')
                ],
                publicApi              : [
                        path          : apiFile.absolutePath,
                        sha256        : myosSha256(apiFile),
                        exampleClasses: apiExampleClasses
                ],
                sharedOutputDirectories:
                        sharedOutputDirectories.toList().sort(),
                violations             : violations.sort()
        ]
        myosWriteJson(myosArtifactIsolationReport.get().asFile, report)
    }
}

def verifyMyosDemoPublishedArtifactIsolation = tasks.register(
        'verifyMyosDemoPublishedArtifactIsolation') {
    group = 'verification'
    description =
            'Rejects MyOS Java 17 contamination of published artifacts.'
    dependsOn inspectMyosDemoPublishedArtifactIsolation
    inputs.file(myosArtifactIsolationReport)
    doLast {
        def report = new JsonSlurper().parse(
                myosArtifactIsolationReport.get().asFile)
        if (report.status != 'passed'
                || !(report.violations instanceof List)
                || !report.violations.isEmpty()) {
            throw new GradleException(
                    'MyOS demo artifact isolation failed; see '
                            + myosArtifactIsolationReport.get().asFile)
        }
    }
}

def myosNormalizeTestId = { String className, String testName ->
    String normalized = testName == null ? '' : testName.trim()
    if (normalized.endsWith('()')) {
        normalized = normalized.substring(0, normalized.length() - 2)
    }
    className + '#' + normalized
}

def myosReadJUnit = { File directory ->
    def records = new ArrayList<Map<String, Object>>()
    if (directory.isDirectory()) {
        fileTree(directory) {
            include 'TEST-*.xml'
        }.files.sort { left, right ->
            left.name <=> right.name
        }.each { resultFile ->
            def suite = new XmlSlurper(false, false).parse(resultFile)
            suite.testcase.each { testCase ->
                def failure = testCase.failure.size() > 0
                        ? testCase.failure[0]
                        : (testCase.error.size() > 0
                        ? testCase.error[0]
                        : null)
                String status = failure != null
                        ? 'failed'
                        : (testCase.skipped.size() > 0
                        ? 'skipped'
                        : 'passed')
                records.add([
                        id         : myosNormalizeTestId(
                                testCase.@classname.toString(),
                                testCase.@name.toString()),
                        className  : testCase.@classname.toString(),
                        name       : testCase.@name.toString(),
                        status     : status,
                        failureType: failure == null
                                ? null
                                : failure.@type.toString(),
                        message    : failure == null
                                ? null
                                : failure.@message.toString(),
                        failureBody: failure == null
                                ? null
                                : failure.text().toString(),
                        resultFile : resultFile.absolutePath
                ])
            }
        }
    }
    records.sort { left, right -> left.id <=> right.id }
    long failed = records.count { it.status == 'failed' }
    long skipped = records.count { it.status == 'skipped' }
    [
            total  : (long) records.size(),
            passed : (long) records.size() - failed - skipped,
            failed : failed,
            skipped: skipped,
            records: records
    ]
}

