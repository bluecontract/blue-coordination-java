                    || !positiveLong(sample.elapsedNanos)
                    || !finiteNonNegative(sample.elapsedSeconds)
                    || !positiveLong(sample.affectedRootCount)
                    || !(sample.affectedRootCount.longValue() in [1L, 2L])
                    || !positiveLong(sample.processCallCount)
                    || sample.processCallCount.longValue()
                    != sample.affectedRootCount.longValue()
                    || !nonNegativeLong(sample.totalGas)
                    || !nonNegativeLong(sample.outboxEventCount)
                    || !(sample.work instanceof Map)
                    || !(sample.work.engine instanceof Map)
                    || !positiveLong(
                    sample.work.engine.processCompletions)
                    || sample.work.engine.processCompletions.longValue()
                    != sample.affectedRootCount.longValue()
                    || !positiveLong(sample.work.engine.commitAttempts)
                    || sample.work.engine.commitAttempts.longValue()
                    != sample.affectedRootCount.longValue()
                    || !positiveLong(sample.work.engine.committed)
