        def firstSeenReceipt = readJson(
                round4FirstSeenEvidence.get().asFile,
                'first-seen-performance-receipt',
                'blue.coordination/wadowice-latency-campaign/1.0')
        def warmReceipt = readJson(
                round4WarmCampaignEvidence.get().asFile,
                'warm-operation-performance-receipt',
                'blue.coordination/wadowice-latency-campaign/1.0')
        def expectedLatencyReceipts = [
                firstSeen: [
                        receipt             : firstSeenReceipt,
                        file                : round4FirstSeenEvidence.get()
                                .asFile,
                        campaign            :
                                'wadowice-attach-paynote-first-seen',
                        sampleKind          : 'firstSeenExactEvent',
                        operationNames      : round4FirstSeenOperationNames,
                        latencyBudgetPolicy : 'uniform/1.0',
                        campaignTotals      : false,
                        orderSparseProof    : true
                ],
                warm     : [
                        receipt             : warmReceipt,
                        file                : round4WarmCampaignEvidence.get()
                                .asFile,
