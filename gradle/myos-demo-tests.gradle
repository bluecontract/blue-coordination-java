    }
}

[
        coordinationRound4CoreVerification,
        coordinationMyosRound4Correctness,
        coordinationMyosRound4Differential,
        coordinationMyosRound4Performance
].each { round4Task ->
    round4Task.configure {
        dependsOn prepareCoordinationMyosRound4Evidence
    }
}

/*
 * Source-set separation is a Gradle default, but the RC evidence verifies the
 * produced artifacts rather than trusting configuration intent. The source
 * distribution is intentionally excluded: it should carry the executable
 * examples, while the published binary/sources/Javadoc/API must not.
 */
def inspectMyosDemoPublishedArtifactIsolation = tasks.register(
        'inspectMyosDemoPublishedArtifactIsolation') {
    group = 'verification'
    description =
            'Proves Java 17 example classes do not contaminate published artifacts.'
    dependsOn(
            tasks.named('jar'),
            tasks.named('sourcesJar'),
            tasks.named('javadocJar'),
            tasks.named('verifyJava8Bytecode'),
            tasks.named('generateCoordinationPublicApiReport'))
    inputs.files(
            tasks.named('jar').flatMap { it.archiveFile },
            tasks.named('sourcesJar').flatMap { it.archiveFile },
            tasks.named('javadocJar').flatMap { it.archiveFile },
            myosJava8BytecodeReport,
            myosPublicApiReport)
    outputs.file(myosArtifactIsolationReport)
    outputs.upToDateWhen { false }
    doFirst {
        delete(myosArtifactIsolationReport.get().asFile)
    }
    doLast {
        String forbiddenPath = 'blue/coordination/examples/'
        def archiveEvidence = new TreeMap<String, Object>()
        def violations = new ArrayList<String>()
        def archives = [
                binary : tasks.named('jar').get()
                        .archiveFile.get().asFile,
                sources: tasks.named('sourcesJar').get()
                        .archiveFile.get().asFile,
                javadoc: tasks.named('javadocJar').get()
                        .archiveFile.get().asFile
        ]
        archives.each { label, archive ->
            def zip = new java.util.zip.ZipFile(archive)
            def forbiddenEntries
            try {
                forbiddenEntries = Collections.list(zip.entries())
                        .findAll { entry ->
                            !entry.directory
                                    && entry.name.startsWith(forbiddenPath)
                        }
                        .collect { it.name }
                        .sort()
            } finally {
                zip.close()
            }
            if (!forbiddenEntries.isEmpty()) {
                violations.add(
                        "${label} artifact contains MyOS example entries: "
                                + forbiddenEntries)
            }
            archiveEvidence.put(
                    label,
                    [
                            path            : archive.absolutePath,
                            sha256          : myosSha256(archive),
                            bytes           : archive.length(),
                            forbiddenEntries: forbiddenEntries
                    ])
        }

        File bytecodeFile = myosJava8BytecodeReport.get().asFile
        def bytecodeProperties = new Properties()
        bytecodeFile.withInputStream {
            bytecodeProperties.load(it)
        }
        if (bytecodeProperties.getProperty('compatible') != 'true') {
            violations.add(
                    'The published binary is not Java 8 bytecode compatible.')
        }

        File apiFile = myosPublicApiReport.get().asFile
        def api = new JsonSlurper().parse(apiFile)
        def apiExampleClasses = api?.classes instanceof List
                ? api.classes.findAll { value ->
            value?.name?.toString()
                    ?.startsWith('blue.coordination.examples.')
        }.collect { it.name.toString() }.sort()
                : []
        if (!apiExampleClasses.isEmpty()) {
            violations.add(
                    'The public API inventory contains MyOS example classes: '
                            + apiExampleClasses)
        }

        def mainClasses = sourceSets.main.output.classesDirs.files.collect {
            it.canonicalPath
        } as Set
        def exampleClasses =
                sourceSets.myosDemoTest.output.classesDirs.files.collect {
                    it.canonicalPath
                } as Set
        def sharedOutputDirectories = mainClasses.intersect(exampleClasses)
        if (!sharedOutputDirectories.isEmpty()) {
            violations.add(
                    'Main and MyOS example source sets share class output '
                            + 'directories: ' + sharedOutputDirectories)
        }

        def report = [
                schema                 :
                        'blue-coordination/myos-demo-artifact-isolation/1.0',
                status                 : violations.isEmpty()
                        ? 'passed'
                        : 'failed',
                forbiddenPublishedPath : forbiddenPath,
                archives               : archiveEvidence,
                java8Bytecode           : [
                        path   : bytecodeFile.absolutePath,
                        sha256 : myosSha256(bytecodeFile),
                        status : bytecodeProperties.getProperty('compatible')
                                == 'true' ? 'passed' : 'failed',
                        maximumObservedMajorVersion:
                                bytecodeProperties.getProperty(
                                        'maximumObservedMajorVersion')
                ],
                publicApi              : [
                        path          : apiFile.absolutePath,
                        sha256        : myosSha256(apiFile),
                        exampleClasses: apiExampleClasses
                ],
                sharedOutputDirectories:
                        sharedOutputDirectories.toList().sort(),
                violations             : violations.sort()
        ]
        myosWriteJson(myosArtifactIsolationReport.get().asFile, report)
    }
}

def verifyMyosDemoPublishedArtifactIsolation = tasks.register(
        'verifyMyosDemoPublishedArtifactIsolation') {
    group = 'verification'
    description =
            'Rejects MyOS Java 17 contamination of published artifacts.'
    dependsOn inspectMyosDemoPublishedArtifactIsolation
    inputs.file(myosArtifactIsolationReport)
    doLast {
        def report = new JsonSlurper().parse(
                myosArtifactIsolationReport.get().asFile)
        if (report.status != 'passed'
                || !(report.violations instanceof List)
                || !report.violations.isEmpty()) {
            throw new GradleException(
                    'MyOS demo artifact isolation failed; see '
                            + myosArtifactIsolationReport.get().asFile)
        }
    }
}

def myosNormalizeTestId = { String className, String testName ->
    String normalized = testName == null ? '' : testName.trim()
    if (normalized.endsWith('()')) {
        normalized = normalized.substring(0, normalized.length() - 2)
    }
    className + '#' + normalized
}

def myosReadJUnit = { File directory ->
    def records = new ArrayList<Map<String, Object>>()
    if (directory.isDirectory()) {
        fileTree(directory) {
            include 'TEST-*.xml'
        }.files.sort { left, right ->
            left.name <=> right.name
        }.each { resultFile ->
            def suite = new XmlSlurper(false, false).parse(resultFile)
            suite.testcase.each { testCase ->
                def failure = testCase.failure.size() > 0
                        ? testCase.failure[0]
                        : (testCase.error.size() > 0
                        ? testCase.error[0]
                        : null)
                String status = failure != null
                        ? 'failed'
                        : (testCase.skipped.size() > 0
                        ? 'skipped'
                        : 'passed')
                records.add([
                        id         : myosNormalizeTestId(
                                testCase.@classname.toString(),
                                testCase.@name.toString()),
                        className  : testCase.@classname.toString(),
                        name       : testCase.@name.toString(),
                        status     : status,
                        failureType: failure == null
                                ? null
                                : failure.@type.toString(),
                        message    : failure == null
                                ? null
                                : failure.@message.toString(),
                        failureBody: failure == null
                                ? null
                                : failure.text().toString(),
                        resultFile : resultFile.absolutePath
                ])
            }
        }
    }
    records.sort { left, right -> left.id <=> right.id }
    long failed = records.count { it.status == 'failed' }
    long skipped = records.count { it.status == 'skipped' }
    [
            total  : (long) records.size(),
            passed : (long) records.size() - failed - skipped,
            failed : failed,
            skipped: skipped,
            records: records
    ]
}

/*
 * The final Round-4 receipt is a projection of same-invocation raw evidence,
 * never a second benchmark or an estimate. It is deliberately a finalizer:
 * a failed Test task should still leave a machine-readable false-readiness
 * report whenever Gradle was able to produce JUnit XML.
 */
def generateCoordinationMyosRound4Evidence = tasks.register(
        'generateCoordinationMyosRound4Evidence') {
    group = 'verification'
    description =
            'Aggregates truthful same-run Round-4 source, parity, JUnit, and timing evidence.'
    mustRunAfter(
            coordinationRound4CoreVerification,
            coordinationMyosRound4Correctness,
            coordinationMyosRound4Differential,
            coordinationMyosRound4Performance)
    inputs.files(
            myosBaselineReport,
            round4FirstSeenEvidence,
            round4WarmCampaignEvidence,
            round4OperationTimingEvidence,
            myosSourceStyleReport,
            myosArtifactIsolationReport,
            round4ExternalBlockerEvidence,
            round4WorkingGateEvidence,
            file('gradle/coordination-external-blockers.json')).optional()
    inputs.file(round4EvidenceSchemaFile)
    inputs.file(round4FailureEvidenceSchemaFile)
    inputs.dir(round4ParityEvidence).optional()
    outputs.file(round4FinalEvidence)
    outputs.upToDateWhen { false }
    doFirst {
        acquireRound4CampaignLock()
        delete(round4FinalEvidence.get().asFile)
    }
    doLast {
        def blockers = new ArrayList<Map<String, String>>()
        boolean finalEvidenceWritten = false
        def addBlocker = { String owner,
                           String identity,
                           String description ->
            blockers.add([
                    owner      : owner,
                    identity   : identity,
                    description: description
            ])
        }
        try {
        def readJson = { File source,
                         String identity,
                         String expectedSchema ->
            if (!source.isFile()) {
                addBlocker(
                        'coordination',
                        identity,
                        'Required same-run JSON receipt is missing: '
                                + source.absolutePath)
                return null
            }
            try {
                def value = new JsonSlurper().parse(source)
                if (!(value instanceof Map)
                        || value.schema != expectedSchema) {
                    addBlocker(
                            'coordination',
                            identity,
                            'Receipt has an unsupported schema at '
                                    + source.absolutePath + ': '
                                    + value?.schema)
                    return null
                }
                value
            } catch (Exception failure) {
                addBlocker(
                        'coordination',
                        identity,
                        'Receipt is not valid JSON at '
                                + source.absolutePath + ': '
                                + failure.class.name + ': '
                                + failure.message)
                null
            }
        }
        def nonBlank = { value ->
            value instanceof String && !value.trim().isEmpty()
        }
        def nonNegativeLong = { value ->
            value instanceof Number
                    && value.longValue() >= 0L
                    && value.doubleValue()
                    == (double) value.longValue()
        }
        def positiveLong = { value ->
            nonNegativeLong(value) && value.longValue() > 0L
        }

        def baseline = readJson(
                myosBaselineReport.get().asFile,
                'round4-baseline',
                'blue-coordination/myos-demo-baseline/1.0')
        def baselineRepositories = baseline instanceof Map
                && baseline.repositories instanceof Map
                ? baseline.repositories
                : [:]
        def baselineSiblingLock = baseline instanceof Map
                && baseline.siblingLock instanceof Map
                ? baseline.siblingLock
                : [:]
        boolean baselineStructureValid = baseline instanceof Map
                && baseline.status instanceof String
                && ['coordination', 'language', 'bex', 'repository'].every {
            String name ->
                def sourceState = baselineRepositories.get(name)
                sourceState instanceof Map
                        && round4IsGitCommit(sourceState.commit)
                        && round4IsSha256(sourceState.dirtyFingerprint)
        }
                && round4IsSha256(baselineSiblingLock.sha256)
        if (baseline instanceof Map && !baselineStructureValid) {
            addBlocker(
                    'coordination',
                    'round4-baseline-shape',
                    'The same-run baseline has invalid repository or lock '
                            + 'identity fields and was rejected.')
            baselineRepositories = [:]
            baselineSiblingLock = [:]
        }
        def topology = project.ext.latestBlueDependencyTopology
        def currentSources = new LinkedHashMap<String, Object>()
        [
                coordination: projectDir,
                language    : topology.languageRoot,
                bex         : topology.bexRoot,
                repository  : topology.repositorySourceRoot
        ].each { String name, File root ->
            try {
                currentSources.put(name, myosSourceState(root))
            } catch (Exception failure) {
                addBlocker(
                        name == 'coordination' ? 'coordination' : name,
                        'source-state-' + name,
                        'Could not capture final Git state for '
                                + root.absolutePath + ': '
                                + failure.class.name + ': '
                                + failure.message)
            }
        }

        def tests = new LinkedHashMap<String, Object>()
        def sameRunTaskOutcome = { String taskName ->
            def observedTask = tasks.findByName(taskName)
            boolean executed = observedTask != null
                    && observedTask.state.executed
            boolean passed = executed
                    && observedTask.state.failure == null
                    && !observedTask.state.skipped
            [
                    executed: executed,
                    passed  : passed,
                    failure : observedTask?.state?.failure
            ]
        }
        def recordRequiredGate = { String key,
                                   String taskName,
                                   boolean receiptValid,
                                   File receiptFile ->
            def outcome = sameRunTaskOutcome(taskName)
            boolean passed = outcome.passed && receiptValid
            tests.put('gate.' + key, [
                    executed: outcome.executed ? 1L : 0L,
                    passed  : passed ? 1L : 0L,
                    failed  : outcome.executed && !passed ? 1L : 0L,
                    skipped : outcome.executed ? 0L : 1L,
                    report  : receiptFile == null
                            ? 'gradle-task:' + taskName
                            : receiptFile.absolutePath
            ])
            if (!passed) {
                addBlocker(
                        'coordination',
                        'required-gate-' + key,
                        'Required same-run gate ' + taskName
                                + ' did not pass'
                                + (receiptValid
                                ? ''
                                : ' with a valid receipt')
                                + (outcome.failure == null
                                ? '.'
                                : ': ' + outcome.failure.class.name + ': '
                                + (outcome.failure.message
                                ?: 'No exception message was provided.')))
            }
            passed
        }

        def sourceStyle = readJson(
                myosSourceStyleReport.get().asFile,
                'round4-source-style',
                'blue-coordination/myos-demo-source-style/1.0')
        boolean sourceStyleReceiptValid = sourceStyle instanceof Map
                && sourceStyle.status == 'passed'
                && sourceStyle.violations instanceof List
                && sourceStyle.violations.isEmpty()
        def artifactIsolation = readJson(
                myosArtifactIsolationReport.get().asFile,
                'round4-artifact-isolation',
                'blue-coordination/myos-demo-artifact-isolation/1.0')
        boolean artifactIsolationReceiptValid =
                artifactIsolation instanceof Map
                        && artifactIsolation.status == 'passed'
                        && artifactIsolation.violations instanceof List
                        && artifactIsolation.violations.isEmpty()
        boolean sourceStyleGateReady = recordRequiredGate(
                'sourceStyle',
                'verifyMyosDemoSourceStyle',
                sourceStyleReceiptValid,
                myosSourceStyleReport.get().asFile)
        boolean staticProhibitionsGateReady = recordRequiredGate(
                'staticProhibitions',
                'verifyMyosRoundTwoStaticProhibitions',
                true,
                null)
        boolean binaryCompatibilityGateReady = recordRequiredGate(
                'binaryCompatibility',
                'binaryCompatibilityCheck',
                true,
                null)
        boolean artifactIsolationGateReady = recordRequiredGate(
                'artifactIsolation',
                'verifyMyosDemoPublishedArtifactIsolation',
                artifactIsolationReceiptValid,
                myosArtifactIsolationReport.get().asFile)
        boolean mandatoryBuildGatesReady = sourceStyleGateReady
                && staticProhibitionsGateReady
                && binaryCompatibilityGateReady
                && artifactIsolationGateReady
        boolean sameInvocationPrepared =
                prepareCoordinationMyosRound4Evidence.get().state.executed
                        && prepareCoordinationMyosRound4Evidence.get()
                        .state.failure == null
        tests.put('source.sameGradleInvocationPreparation', [
                executed: sameInvocationPrepared ? 1L : 0L,
                passed  : sameInvocationPrepared ? 1L : 0L,
                failed  : sameInvocationPrepared ? 0L : 1L,
                skipped : 0L,
                report  : myosBaselineReport.get().asFile.absolutePath
        ])
        if (!sameInvocationPrepared) {
            addBlocker(
                    'coordination',
                    'same-invocation-preparation-missing',
                    'Round-4 receipts were not cleared and initialized in '
                            + 'this Gradle invocation; retained files cannot '
                            + 'establish readiness.')
        }
        boolean coordinationUnchanged = false
        boolean frozenSiblingsUnchanged = true
        ['coordination', 'language', 'bex', 'repository'].each {
            String name ->
                def before = baselineRepositories.get(name)
                def after = currentSources.get(name)
                boolean unchanged = before instanceof Map
                        && after instanceof Map
                        && before.commit == after.commit
                        && before.dirtyFingerprint
                        == after.dirtyFingerprint
                if (name == 'coordination') {
                    coordinationUnchanged = unchanged
                } else {
                    frozenSiblingsUnchanged &= unchanged
                }
                String evidenceKey = (
                        'source.' + name
                                + '.beforeCommit='
                                + (before?.commit ?: 'missing')
                                + '.beforeDirtyFingerprint='
                                + (before?.dirtyFingerprint ?: 'missing')
                                + '.afterCommit='
                                + (after?.commit ?: 'missing')
                                + '.afterDirtyFingerprint='
                                + (after?.dirtyFingerprint ?: 'missing'))
                tests.put(evidenceKey, [
                        executed: 1L,
                        passed  : unchanged ? 1L : 0L,
                        failed  : unchanged ? 0L : 1L,
                        skipped : 0L,
                        report  : myosBaselineReport.get().asFile.absolutePath
                ])
                if (!unchanged) {
                    addBlocker(
                            name == 'coordination' ? 'coordination' : name,
                            'source-drift-' + name,
                            'Before/after commit and dirty fingerprint differ; '
                                    + evidenceKey)
                }
        }
        String beforeSiblingLock = baselineSiblingLock.sha256
        String afterSiblingLock = myosSha256(topology.lockFile)
        boolean siblingLockUnchanged = nonBlank(beforeSiblingLock)
                && beforeSiblingLock == afterSiblingLock
        tests.put(
                'source.siblingLock.before=' +
                        (beforeSiblingLock ?: 'missing')
                        + '.after=' + (afterSiblingLock ?: 'missing'),
                [
                        executed: 1L,
                        passed  : siblingLockUnchanged ? 1L : 0L,
                        failed  : siblingLockUnchanged ? 0L : 1L,
                        skipped : 0L,
                        report  : topology.lockFile.absolutePath
                ])
        if (!siblingLockUnchanged) {
            frozenSiblingsUnchanged = false
            addBlocker(
                    'coordination',
                    'frozen-sibling-lock-drift',
                    'The frozen sibling lock SHA-256 changed from '
                            + beforeSiblingLock + ' to ' + afterSiblingLock)
        }

        def junitCampaigns = [
                core        : 'coordinationRound4CoreVerification',
                correctness : 'coordinationMyosRound4Correctness',
                differential: 'coordinationMyosRound4Differential',
                performance : 'coordinationMyosRound4Performance'
        ]
        def junitEvidence = new LinkedHashMap<String, Object>()
        junitCampaigns.each { String label, String taskName ->
            File junitDirectory = file('build/test-results/' + taskName)
            def outcome
            try {
                outcome = myosReadJUnit(junitDirectory)
            } catch (Exception failure) {
                addBlocker(
                        'coordination',
                        'junit-' + label + '-unreadable',
                        'Could not parse exact JUnit outcomes at '
                                + junitDirectory.absolutePath + ': '
                                + failure.class.name + ': '
                                + failure.message)
                outcome = [
                        total  : 0L,
                        passed : 0L,
                        failed : 0L,
                        skipped: 0L,
                        records: []
                ]
            }
            junitEvidence.put(label, outcome)
            tests.put(label, [
                    executed: outcome.total,
                    passed  : outcome.passed,
                    failed  : outcome.failed,
                    skipped : outcome.skipped,
                    report  : junitDirectory.absolutePath
            ])
            def expectedSelectors = round4ExpectedJUnitSelectors.get(label)
            def expectedSelectorCounts = round4SelectorMultiset(
                    expectedSelectors)
            def observedSelectorCounts = round4SelectorMultiset(
                    outcome.records.collect { record -> record.id })
            def duplicateExpectedSelectors = expectedSelectorCounts
                    .findAll { String selector, Long count -> count > 1L }
                    .keySet()
                    .toList()
            def missingSelectors = new ArrayList<String>()
            expectedSelectorCounts.each { String selector, Long count ->
                long observed = observedSelectorCounts.containsKey(selector)
                        ? observedSelectorCounts.get(selector)
                        : 0L
                for (long occurrence = observed;
                        occurrence < count;
                        occurrence++) {
                    missingSelectors.add(selector)
                }
            }
            def unexpectedSelectors = new ArrayList<String>()
            observedSelectorCounts.each { String selector, Long count ->
                long expected = expectedSelectorCounts.containsKey(selector)
                        ? expectedSelectorCounts.get(selector)
                        : 0L
                for (long occurrence = expected;
                        occurrence < count;
                        occurrence++) {
                    unexpectedSelectors.add(selector)
                }
            }
            boolean exactSelectorInventory =
                    duplicateExpectedSelectors.isEmpty()
                            && expectedSelectorCounts
                            == observedSelectorCounts
            expectedSelectors.eachWithIndex { String selector, int index ->
                boolean present = observedSelectorCounts.containsKey(selector)
                tests.put(
                        String.format(
                                java.util.Locale.ROOT,
                                '%s.required.%03d.%s',
                                label,
                                index + 1,
                                selector),
                        [
                                executed: present ? 1L : 0L,
                                passed  : present ? 1L : 0L,
                                failed  : present ? 0L : 1L,
                                skipped : 0L,
                                report  : junitDirectory.absolutePath
                        ])
                if (!present) {
                    addBlocker(
                            'coordination',
                            'junit-' + label + '-required-' + (index + 1),
                            'Required Round-4 JUnit selector was not observed: '
                                    + selector)
                }
            }
            outcome.missingSelectors = missingSelectors
            outcome.unexpectedSelectors = unexpectedSelectors
            outcome.duplicateExpectedSelectors =
                    duplicateExpectedSelectors
            outcome.selectorInventoryExact = exactSelectorInventory
            tests.put(label + '.selectorInventory', [
                    executed: 1L,
                    passed  : exactSelectorInventory ? 1L : 0L,
                    failed  : exactSelectorInventory ? 0L : 1L,
                    skipped : 0L,
                    report  : junitDirectory.absolutePath
            ])
            duplicateExpectedSelectors.eachWithIndex {
                String selector, int index ->
                    addBlocker(
                            'coordination',
                            'junit-' + label + '-duplicate-expected-'
                                    + (index + 1),
                            'Round-4 expected JUnit inventory contains a '
                                    + 'duplicate selector: ' + selector)
            }
            unexpectedSelectors.eachWithIndex {
                String selector, int index ->
                    addBlocker(
                            'coordination',
                            'junit-' + label + '-unexpected-' + (index + 1),
                            'Unexpected or duplicate Round-4 JUnit selector '
                                    + 'was observed: ' + selector)
            }
            if (outcome.total == 0L) {
                addBlocker(
                        'coordination',
                        'junit-' + label + '-missing',
                        'No same-run JUnit testcase was found for '
                                + taskName)
            }
            outcome.records.eachWithIndex { record, int index ->
                String recordKey = String.format(
                        java.util.Locale.ROOT,
                        '%s.junit.%06d.%s',
                        label,
                        index + 1,
                        record.id)
                tests.put(recordKey, [
                        executed: 1L,
                        passed  : record.status == 'passed' ? 1L : 0L,
                        failed  : record.status == 'failed' ? 1L : 0L,
                        skipped : record.status == 'skipped' ? 1L : 0L,
                        report  : record.resultFile
                ])
                if (record.status != 'passed') {
                    addBlocker(
                            'coordination',
                            'junit-' + label + '-' + (index + 1),
                            record.id + ' was ' + record.status
                                    + (record.failureType == null
                                    ? ''
                                    : ' (' + record.failureType + ')')
                                    + (record.message == null
                                    || record.message.isEmpty()
                                    ? ''
                                    : ': ' + record.message))
                }
            }
        }
        def junitPassed = { String label ->
            def outcome = junitEvidence.get(label)
            outcome.total > 0L
                    && outcome.failed == 0L
                    && outcome.skipped == 0L
                    && outcome.passed == outcome.total
                    && outcome.selectorInventoryExact == true
                    && outcome.missingSelectors instanceof List
                    && outcome.missingSelectors.isEmpty()
                    && outcome.unexpectedSelectors instanceof List
                    && outcome.unexpectedSelectors.isEmpty()
                    && outcome.duplicateExpectedSelectors instanceof List
                    && outcome.duplicateExpectedSelectors.isEmpty()
        }

        def parity = [
                eventShapeComparisons: 0L,
                sparseRootComparisons: 0L,
                planningComparisons  : 0L,
                projectionComparisons: 0L,
                transitionComparisons: 0L,
                mismatches           : 0L
        ]
        def parityCategories = [
                'eventShapeComparisons',
                'sparseRootComparisons',
                'planningComparisons',
                'projectionComparisons',
                'transitionComparisons'
        ] as Set
        boolean parityReceiptsValid = true
        File parityDirectory = round4ParityEvidence.get().asFile
        def parityFiles = parityDirectory.isDirectory()
                ? fileTree(parityDirectory) {
            include '*.json'
        }.files.sort { left, right ->
            left.absolutePath <=> right.absolutePath
        }
                : []
        parityFiles.eachWithIndex { File receiptFile, int index ->
            try {
                def receipt = new JsonSlurper().parse(receiptFile)
                def requiredKeys = [
                        'schema', 'category', 'comparisons', 'mismatches'
                ] as Set
                boolean valid = receipt instanceof Map
                        && receipt.keySet() == requiredKeys
                        && receipt.schema
                        == 'blue-coordination/myos-round4-parity-receipt/1.0'
                        && parityCategories.contains(receipt.category)
                        && nonNegativeLong(receipt.comparisons)
                        && nonNegativeLong(receipt.mismatches)
                if (!valid) {
                    parityReceiptsValid = false
                    addBlocker(
                            'coordination',
                            'parity-receipt-' + (index + 1),
                            'Malformed parity receipt was not counted: '
                                    + receiptFile.absolutePath)
                    return
                }
                String category = receipt.category
                parity.put(
                        category,
                        Math.addExact(
                                ((Number) parity.get(category)).longValue(),
