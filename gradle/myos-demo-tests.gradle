def coordinationMyosRound4Performance = tasks.register(
        'coordinationMyosRound4Performance', Test) {
    group = 'verification'
    description =
            'Runs the opt-in first-seen PayNote and 17-operation Round-4 gates.'
    configureMyosRound4Test(delegate)
    useJUnitPlatform {
        includeTags 'performance'
    }
    systemProperty 'coordination.performance.gates', 'true'
    systemProperty(
            'coordination.performance.paynote.samples',
            System.getProperty(
                    'coordination.performance.paynote.samples', '100'))
    systemProperty(
            'coordination.performance.paynote.stabilization.samples',
            System.getProperty(
                    'coordination.performance.paynote.stabilization.samples',
                    '30'))
    systemProperty(
            'coordination.performance.operation.samples',
            System.getProperty(
                    'coordination.performance.operation.samples', '100'))
    systemProperty(
            'myos.demo.latencyEvidenceDir',
            round4Reports.get().asFile.absolutePath)
    systemProperty(
            'myos.demo.operationTiming',
            round4OperationTimingEvidence.get().asFile.absolutePath)
    filter {
        includeTestsMatching(
                'blue.coordination.examples.WadowiceAttachPayNoteLatencyTest.shouldKeepFirstSeenExactEventP95WithinOneSecond')
        includeTestsMatching(
                'blue.coordination.examples.WadowiceOperationLatencyCampaignTest.shouldKeepEveryReportedOperationP95WithinOneSecond')
        includeTestsMatching(
                'blue.coordination.examples.WadowicePayNoteAppendFastPathTest.shouldKeepTheFirstSeenPayNoteAppendBelowTwoHundredFiftyMilliseconds')
        failOnNoMatchingTests = true
    }
    jvmArgs(
            '-XX:+UseG1GC',
            '-XX:MaxGCPauseMillis=50')
    outputs.files(
            round4FirstSeenEvidence,
            round4WarmCampaignEvidence,
            round4OperationTimingEvidence)
    doFirst {
        delete(
                round4FirstSeenEvidence.get().asFile,
                round4WarmCampaignEvidence.get().asFile,
                round4OperationTimingEvidence.get().asFile)
        mkdir(round4Reports.get().asFile)
    }
    doLast {
        [
                round4FirstSeenEvidence.get().asFile,
                round4WarmCampaignEvidence.get().asFile
        ].each { File evidenceFile ->
            if (!evidenceFile.isFile()) {
                throw new GradleException(
                        'Round-4 performance evidence is missing: '
                                + evidenceFile)
            }
            def evidence = new JsonSlurper().parse(evidenceFile)
            if (evidence.schema
                    != 'blue.coordination/wadowice-latency-campaign/1.0'
                    || evidence.workingReady != true) {
                throw new GradleException(
                        'Round-4 performance evidence failed closed: '
                                + evidenceFile)
            }
        }
        File timingFile = round4OperationTimingEvidence.get().asFile
        if (!timingFile.isFile()) {
            throw new GradleException(
                    'Round-4 operation timing evidence is missing: '
                            + timingFile)
        }
        def timing = new JsonSlurper().parse(timingFile)
        if (timing.schema
                != 'blue.coordination/myos-operation-timing/1.1'
                || !(timing.operations instanceof List)
                || timing.operations.isEmpty()) {
            throw new GradleException(
                    'Round-4 operation timing evidence failed closed: '
                            + timingFile)
        }
        def firstSeen = timing.operations.findAll { operation ->
            operation.sampleKind == 'firstSeenExactEvent'
                    && operation.caseId != null
                    && operation.caseId.toString().startsWith(
                    'paynote-latency-first-seen-')
        }
        def phaseSamples = [
                entryIdentity          : [],
                eventAdmission         : [],
                appendPublication      : [],
                indexedPlanning        : [],
                contractsProcess       : [],
                subscriptionProjection : [],
                fragmentTransition     : [],
                commit                 : [],
                commitPublicationWall  : [],
                endToEnd               : []
        ]
        def phaseFailures = new ArrayList<String>()
        def parallelSamples = new ArrayList<Map<String, Object>>()
        firstSeen.eachWithIndex { operation, int sampleIndex ->
            if (operation.processObserved != true
                    || ((Number) operation.affectedRootCount)
                    .intValue() != 2
                    || !(operation.deliveries instanceof List)
                    || operation.deliveries.size() != 2) {
                phaseFailures.add(
                        "firstSeen[${sampleIndex}] is not one exact "
                                + 'two-Root append/commit sample')
                return
            }
            def appendPhases = operation.appendPhasesNanos
            if (!(appendPhases instanceof Map)) {
                phaseFailures.add(
                        "firstSeen[${sampleIndex}] lacks append phases")
                return
            }
            phaseSamples.entryIdentity.add(
                    ((Number) appendPhases.entryBuild).longValue())
            phaseSamples.eventAdmission.add(
                    ((Number) appendPhases.eventPrepareSplitAdmission)
                            .longValue())
            phaseSamples.appendPublication.add(
                    ((Number) operation.appendTotalNanos).longValue())
            phaseSamples.endToEnd.add(
                    ((Number) operation.appendAndProcessTotalNanos)
                            .longValue())

            def preparationIntervals = new ArrayList<Map<String, Object>>()
            def commitIntervals = new ArrayList<Map<String, Object>>()
            operation.deliveries.each { delivery ->
                def phases = delivery.enginePhasesNanos
                def wall = delivery.wallPhasesNanos
                if (!(phases instanceof Map)
                        || !(wall instanceof Map)) {
                    phaseFailures.add(
                            "firstSeen[${sampleIndex}] lacks Root phases")
                    return
                }
                phaseSamples.indexedPlanning.add(
                        ((Number) phases.indexedPlan).longValue())
                phaseSamples.contractsProcess.add(
                        ((Number) phases.contractsProcess).longValue())
                phaseSamples.subscriptionProjection.add(
                        ((Number) phases.subscriptionProjection).longValue())
                phaseSamples.fragmentTransition.add(
                        ((Number) phases.fragmentTransitionPlanning)
                                .longValue())
                phaseSamples.commit.add(
                        ((Number) phases.commit).longValue())
                phaseSamples.commitPublicationWall.add(
                        ((Number) wall.commitPublication).longValue())
                preparationIntervals.add([
                        documentKey: delivery.documentKey,
                        thread     : delivery.preparationThread,
                        startNanos : ((Number) delivery.deliveryStartedNanos)
                                .longValue(),
                        endNanos   : ((Number) delivery.preparationEndedNanos)
                                .longValue()
                ])
                commitIntervals.add([
                        documentKey: delivery.documentKey,
                        startNanos : ((Number) delivery.commitStartedNanos)
                                .longValue(),
                        endNanos   : ((Number) delivery.commitEndedNanos)
                                .longValue()
                ])
            }
            if (preparationIntervals.size() == 2
                    && commitIntervals.size() == 2) {
                long preparationStart = preparationIntervals
                        .collect { it.startNanos }.min()
                long preparationEnd = preparationIntervals
                        .collect { it.endNanos }.max()
                long slowerPreparation = preparationIntervals.collect {
                    it.endNanos - it.startNanos
                }.max()
                boolean preparationOverlap = preparationIntervals
                        .collect { it.startNanos }.max()
                        < preparationIntervals
                        .collect { it.endNanos }.min()
                def orderedCommits = commitIntervals.sort {
                    left, right -> left.startNanos <=> right.startNanos
                }
                def commitOrder = orderedCommits.collect {
                    it.documentKey
                }
                boolean canonicalCommitOrder = commitOrder == [
                        'package-order',
                        'package-paynote'
                ]
                boolean commitsDoNotOverlap =
                        orderedCommits[0].endNanos
                                <= orderedCommits[1].startNanos
                boolean wallWithinBudget = preparationEnd
                        - preparationStart
                        <= Math.ceil(slowerPreparation * 1.20d)
                boolean distinctWorkers = preparationIntervals
                        .collect { it.thread }.toSet().size() >= 2
                parallelSamples.add([
                        sampleIndex          : sampleIndex,
                        preparationIntervals: preparationIntervals,
                        preparationOverlap  : preparationOverlap,
                        distinctWorkers     : distinctWorkers,
                        wallNanos           : preparationEnd
                                - preparationStart,
                        slowerRootNanos      : slowerPreparation,
                        wallWithinBudget     : wallWithinBudget,
                        commitOrder         : commitOrder,
                        canonicalCommitOrder: canonicalCommitOrder,
                        commitsDoNotOverlap : commitsDoNotOverlap
                ])
                if (((Number) timing.environment.availableProcessors)
                        .intValue() >= 2
                        && (!preparationOverlap
                        || !distinctWorkers
                        || !wallWithinBudget)) {
                    phaseFailures.add(
                            "firstSeen[${sampleIndex}] failed parallel "
                                    + 'preparation contract')
                }
                if (!commitsDoNotOverlap) {
                    phaseFailures.add(
                            "firstSeen[${sampleIndex}] overlapped commits")
                }
                if (!canonicalCommitOrder) {
                    phaseFailures.add(
                            "firstSeen[${sampleIndex}] commit order was "
                                    + commitOrder + '; expected '
                                    + "['package-order', 'package-paynote']")
                }
            }
        }
        def phaseBudgets = [
                entryIdentity         : [40000000L, 80000000L, 100L],
                eventAdmission        : [80000000L, 150000000L, 100L],
                appendPublication     : [150000000L, 250000000L, 100L],
                indexedPlanning       : [100000000L, 180000000L, 200L],
                contractsProcess      : [250000000L, 400000000L, 200L],
                subscriptionProjection: [60000000L, 100000000L, 200L],
                fragmentTransition    : [80000000L, 140000000L, 200L],
                commit                : [50000000L, 100000000L, 200L],
                commitPublicationWall : [50000000L, 100000000L, 200L],
                endToEnd              : [1000000000L, 1500000000L, 100L]
        ]
        def phaseSummaries = new LinkedHashMap<String, Object>()
        phaseBudgets.each { String phase, List<Long> budget ->
            List<Long> samples = phaseSamples.get(phase)
            if (samples.size() < budget[2]) {
                phaseFailures.add(
                        "${phase} has ${samples.size()} samples; required "
                                + budget[2])
                return
            }
            def distribution = round4Distribution(samples)
            boolean passed = distribution.p95Nanos <= budget[0]
                    && distribution.maximumNanos <= budget[1]
            distribution.p95SlaNanos = budget[0]
            distribution.maximumSlaNanos = budget[1]
            distribution.passed = passed
            phaseSummaries.put(phase, distribution)
            if (!passed) {
                phaseFailures.add(
                        "${phase} p95=${distribution.p95Nanos}, max="
                                + distribution.maximumNanos)
            }
        }
        timing.round4FirstSeenGate = [
                status         : phaseFailures.isEmpty()
                        ? 'passed'
                        : 'failed',
                exactSampleCount: (long) firstSeen.size(),
                phaseSummaries : phaseSummaries,
                parallelSamples: parallelSamples,
                failures       : phaseFailures
        ]
        myosWriteJson(timingFile, timing)
        if (!phaseFailures.isEmpty()) {
            throw new GradleException(
                    'Round-4 first-seen phase/parallel gate failed: '
                            + phaseFailures)
        }
    }
}

