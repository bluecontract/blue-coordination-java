def myosSha256 = { File source ->
    if (source == null || !source.isFile()) {
        return null
    }
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    source.withInputStream { input ->
        byte[] buffer = new byte[8192]
        int read
        while ((read = input.read(buffer)) >= 0) {
            if (read > 0) {
                digest.update(buffer, 0, read)
            }
        }
    }
    digest.digest().collect {
        String.format(java.util.Locale.ROOT, '%02x', it & 0xff)
    }.join()
}

def myosGit = { File directory, String... arguments ->
    def command = new ArrayList<String>()
    command.add('git')
    command.addAll(Arrays.asList(arguments))
    def process = new ProcessBuilder(command)
            .directory(directory)
            .redirectErrorStream(true)
            .start()
    String output = process.inputStream.getText('UTF-8').trim()
    if (process.waitFor() != 0) {
        throw new GradleException(
                "Git command failed in ${directory}: ${command}\n${output}")
    }
    output
}

def myosWriteJson = { File target, Object value ->
    target.parentFile.mkdirs()
    target.setText(
            JsonOutput.prettyPrint(JsonOutput.toJson(value)) + '\n',
            'UTF-8')
}

def myosEvidenceSource = { File source ->
    [
            path  : source == null ? null : source.absolutePath,
            sha256: myosSha256(source),
            status: source != null && source.isFile()
                    ? 'present'
                    : 'missing'
    ]
}

