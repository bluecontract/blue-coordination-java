        }
        if (!physicalSlicesVerified) {
            blockingReasons.add(
                    'The bounded Root/Emb1/Emb2 physical-slice proof is absent or invalid.')
        }
        if (!wadowicePreparedVerified) {
            blockingReasons.add(
                    'The one-pass Wadowice preparation/checkpoint proof is absent or invalid.')
        }

        def report = [
                schema                 :
                        'blue-coordination/myos-demo-final/1.1',
                status                 : workingReady ? 'passed' : 'failed',
                workingReady           : workingReady,
                sourceSet              : [
                        name       : 'myosDemoTest',
                        javaRelease: 17,
                        testJvm    : 17,
                        maxForks   : 1,
                        forkEvery  : 0
                ],
                sourceIdentity         : [
                        coordination: baseline.repositories.coordination,
                        language    : siblingInputs.language,
                        bex         : siblingInputs.bex,
                        repository  : siblingInputs.repository
                ],
                dependencyGraph       : dependency,
                artifacts             : artifacts.archives,
                documents             : [
                        expected         : expectedDocumentCount,
                        observed         :
                                (long) documentRecords.size(),
                        catalog          : catalogDocumentCount,
                        generatedFixtures: generatedFixtureCount,
                        status           : documentsVerified
                                ? 'verified'
                                : 'missing',
                        evidence         : myosEvidenceSource(documentsFile)
                ],
                tests                 : [
                        expected            : (long) expectedTests.size(),
                        businessMethods     : style.businessTestMethods,
                        total               : tests.total,
                        passed              : tests.passed,
                        failed              : tests.failed,
                        skipped             : tests.skipped,
                        missing             : missingTests,
                        unexpected          : unexpectedTests,
                        unclassified        : unclassifiedTests,
                        unclassifiedFailures: unclassifiedFailures,
                        missingDeclaredClasses:
                                missingDeclaredTestClasses,
                        overlappingRegistries:
                                overlappingTestRegistries,
                        perExample          : perExample
                ],
                roundTwoAcceptance      : [
                        status : roundTwoCampaignVerified
                                ? 'verified'
                                : 'missing',
                        required: requiredRoundTwoTestIds,
                        missing : missingRoundTwoTests,
                        nonPassing: nonPassingRoundTwoTests
                ],
                processing            : [
                        transitions               : (long) transitions.size(),
                        perExample                : transitionsByExample,
                        forbiddenReadCount        : forbiddenReads,
                        fallbackReadCount         : fallbackReads,
                        backendLoadedFragmentCount:
                                backendLoadedFragments,
                        backendLoadedBytes        : backendLoadedBytes,
                        selectedScopes            : transitions.collect {
                            transition ->
                                [
                                        exampleId: transition.exampleId,
                                        caseId   : transition.caseId,
                                        paths    : transition.selectedScopeOrder
                                                instanceof List
                                                ? new ArrayList(
                                                transition.selectedScopeOrder)
                                                : []
                                ]
                        },
                        runtimeEvidence           :
                                myosEvidenceSource(runtimeFile)
                ],
                measuredWork         : [
                        status        : measuredWorkVerified
                                ? 'verified'
                                : 'missing',
                        counterSources: [
                                host  : [
                                        owner  :
                                                'MyOsDemoRuntime/MyOsWorkRecorder',
                                        methods: [
                                                'addDocument',
                                                'append',
                                                'process'
                                        ]
                                ],
                                engine: [
                                        owner  :
                                                'CoordinationProcessingEngine/CoordinationEngineWorkRecorder',
                                        methods: [
                                                'onPlan',
                                                'onBatchLoad',
                                                'onProcessComplete',
                                                'onCommit'
                                        ]
                                ],
                                store : [
                                        owner  :
                                                'InMemoryCoordinationFragmentStore',
                                        methods: [
                                                'fetchByBlueId',
                                                'fetchResultByBlueId',
                                                'readAll',
                                                'readCanonical',
                                                'readProcessingAll',
                                                'readProcessing',
                                                'readRepresentations',
                                                'readRepresentationsByInventory'
                                        ]
                                ]
                        ],
                        cases         : [
                                authorization    : authorizationSummary,
                                restaurantLocality: restaurantSummary,
                                fastFork         : fastForkSummary
                        ]
                ],
                physicalSlices       : [
                        status : physicalSlicesVerified
                                ? 'verified'
                                : 'missing',
                        records: physicalSliceObservations
                ],
                wadowicePrepared     : [
                        status                        :
                                wadowicePreparedVerified
                                        ? 'verified'
                                        : 'missing',
                        sourceRuntimeId               :
                                preparedSourceSummary?.runtimeId,
                        preparationExecutions        :
                                preparedSourceSummaries.size() == 1
                                        ? 1L
                                        : null,
                        checkpoints                  : preparedCheckpoints,
                        commonPrefixProcessCalls     :
                                commonPrefixProcessCalls,
                        branchSuffixProcessCalls     :
                                branchSuffixProcessCalls,
                        totalBranchSuffixProcessCalls:
                                totalBranchSuffixProcessCalls,
                        fourBusinessBranchProcessCalls:
                                fourBusinessBranchProcessCalls
                ],
                wadowiceLocality      : [
                        status       : wadowiceLocalityVerified
                                ? 'verified'
                                : 'missing',
                        requiredPaths: requiredWadowiceScopeOrder,
                        observedRuns : (long) wadowiceLocalityTransitions.size()
                ],
                sourceStyle           : style,
                artifactIsolation     : artifacts,
                knownExternalBlockers : [],
                evidenceSources       : [
                        baseline       : myosEvidenceSource(
                                myosBaselineReport.get().asFile),
                        dependencyLock : myosEvidenceSource(
                                myosDependencyReport.get().asFile),
                        siblingInputs  : myosEvidenceSource(
                                myosSiblingInputs.get().asFile),
                        sourceStyle    : myosEvidenceSource(
                                myosSourceStyleReport.get().asFile),
                        artifactIsolation:
                                myosEvidenceSource(
                                        myosArtifactIsolationReport
                                                .get().asFile),
                        junitDirectory : [
                                path  : junitDirectory.absolutePath,
                                files : junitDirectory.isDirectory()
                                        ? (long) fileTree(junitDirectory) {
                                    include 'TEST-*.xml'
                                }.files.size()
                                        : 0L,
                                status: junitDirectory.isDirectory()
                                        ? 'present'
                                        : 'missing'
                        ]
                ],
                blockingReasons        : blockingReasons.unique().sort()
        ]
        myosWriteJson(myosFinalJson.get().asFile, report)

        File markdown = myosFinalMarkdown.get().asFile
        markdown.parentFile.mkdirs()
        markdown.withWriter('UTF-8') { writer ->
            writer.writeLine('# MyOS demo example verification')
            writer.writeLine('')
            writer.writeLine("- Status: `${report.status}`")
            writer.writeLine("- Working ready: `${report.workingReady}`")
            writer.writeLine(
                    "- Documents: `${report.documents.observed}/"
                            + "${report.documents.expected}`")
            writer.writeLine(
                    "- Tests: `${tests.passed} passed, ${tests.failed} failed, "
                            + "${tests.skipped} skipped`")
            writer.writeLine(
                    "- PROCESS transitions: `${transitions.size()}`")
            writer.writeLine(
                    "- Forbidden/fallback reads: `${forbiddenReads}/${fallbackReads}`")
            writer.writeLine(
                    "- Wadowice locality: `${report.wadowiceLocality.status}`")
            writer.writeLine(
                    "- Measured work: `${report.measuredWork.status}`")
            writer.writeLine(
                    "- Physical slices: `${report.physicalSlices.status}`")
            writer.writeLine(
                    "- Wadowice prepared fixture: `${report.wadowicePrepared.status}`")
            writer.writeLine(
                    "- Wadowice PROCESS calls (prefix/suffix/all branches): "
                            + "`${report.wadowicePrepared.commonPrefixProcessCalls}/"
                            + "${report.wadowicePrepared.totalBranchSuffixProcessCalls}/"
                            + "${report.wadowicePrepared.fourBusinessBranchProcessCalls}`")
            writer.writeLine('')
            writer.writeLine('## Per-example tests')
            writer.writeLine('')
            writer.writeLine('| Example | Passed | Failed | Skipped | Transitions |')
            writer.writeLine('|---|---:|---:|---:|---:|')
            perExample.each { exampleId, counts ->
                writer.writeLine(
                        "| ${exampleId} | ${counts.passed} | ${counts.failed} | "
                                + "${counts.skipped} | "
                                + "${transitionsByExample.get(exampleId)} |")
            }
            writer.writeLine('')
            writer.writeLine('## Blocking reasons')
            writer.writeLine('')
            if (report.blockingReasons.isEmpty()) {
                writer.writeLine('- None.')
            } else {
                report.blockingReasons.each { reason ->
                    writer.writeLine('- ' + reason)
                }
            }
            writer.writeLine('')
            writer.writeLine('The report is derived only from evidence produced or deleted in this Gradle invocation; retained historical engine reports are not used.')
        }
    }
}

verifyMyosDemoDependencyClasspath.configure {
    actions.clear()
    setDependsOn([
            tasks.named('verifyLatestBlueSiblingInputs'),
            tasks.named('writeLatestBlueDependencyLock')
    ])
    doLast {
        File authoritativeFile = myosResolvedDependencyLock.get().asFile
        def authoritative = new JsonSlurper().parse(authoritativeFile)
        def failures = []
        if (authoritative.status != 'verified'
                || authoritative.mode
                != 'published-language-local-bex-repository') {
            failures.add('The authoritative dependency receipt is not verified.')
        }
        def components = new TreeMap<String, Object>()
        configurations.myosDemoTestRuntimeClasspath.incoming
                .resolutionResult.allComponents.each { component ->
            def id = component.id
            if (id instanceof ModuleComponentIdentifier
                    && id.group in ['blue.language', 'blue.repo', 'blue.bex']) {
                components["${id.group}:${id.module}".toString()] = [
                        kind   : 'module',
                        version: id.version
                ]
            } else if (id instanceof ProjectComponentIdentifier
                    && id.projectPath in [
                    ':blue-bex-core', ':blue-bex-contracts']) {
                components['blue.bex:' + id.projectName] = [
                        kind       : 'project',
                        projectPath: id.projectPath,
                        version    : project.ext.latestBlueDependencyTopology
                                .lock.blueBexLocalVersion
                ]
            }
        }
        def forbidden = [
                'blue.language:blue-language-java',
                'blue.language:blue-conformance',
                'blue.bex:blue-bex-java'
        ].findAll { components.containsKey(it) }
        if (!forbidden.isEmpty()) {
            failures.add("Aggregate artifacts selected: ${forbidden}")
        }
        components.findAll { key, value ->
            key.startsWith('blue.language:')
        }.each { key, value ->
            if (value.kind != 'module'
                    || value.version != '3.1.0-rc.20') {
                failures.add("${key} is not published 3.1.0-rc.20")
            }
        }
        def artifacts = new TreeMap<String, Object>()
        configurations.myosDemoTestRuntimeClasspath.incoming
                .artifactView { }.artifacts.artifacts.each { artifact ->
            def id = artifact.id.componentIdentifier
            String key = null
            if (id instanceof ModuleComponentIdentifier
                    && id.group in ['blue.language', 'blue.repo', 'blue.bex']) {
                key = "${id.group}:${id.module}"
            } else if (id instanceof ProjectComponentIdentifier
                    && id.projectPath in [
                    ':blue-bex-core', ':blue-bex-contracts']) {
                key = 'blue.bex:' + id.projectName
            }
            if (key != null) {
                artifacts[key] = [
                        fileName: artifact.file.name,
                        sha256  : myosSha256(artifact.file)
                ]
            }
        }
        def report = [
                schema              :
                        'blue-coordination/myos-demo-dependency-lock/1.1',
                status              : failures.isEmpty()
                        ? 'verified' : 'failed',
                authoritativeReceipt: myosEvidenceSource(authoritativeFile),
                components          : components,
                artifacts           : artifacts,
                aggregateArtifacts  : forbidden,
                failures            : failures
        ]
        myosWriteJson(myosDependencyReport.get().asFile, report)
        if (!failures.isEmpty()) {
            throw new GradleException(
                    "MyOS dependency classpath failed: ${failures}")
        }
    }
}

tasks.register('coordinationExamplesVerification') {
    group = 'verification'
    description =
            'Fails closed unless every shipped MyOS business example and evidence gate is green.'
    dependsOn generateMyosDemoFinalReport,
            verifyMyosRoundTwoStaticProhibitions
    inputs.file(myosFinalJson)
    doLast {
        File reportFile = myosFinalJson.get().asFile
        def report = new JsonSlurper().parse(reportFile)
        if (report.schema
                != 'blue-coordination/myos-demo-final/1.1'
                || report.status != 'passed'
                || report.workingReady != true
                || report.measuredWork?.status != 'verified'
                || report.physicalSlices?.status != 'verified'
                || report.wadowicePrepared?.status != 'verified'
                || report.wadowicePrepared?.preparationExecutions != 1
                || report.wadowicePrepared?.commonPrefixProcessCalls != 19
                || report.wadowicePrepared.totalBranchSuffixProcessCalls != 10
                || report.wadowicePrepared.fourBusinessBranchProcessCalls != 29
                || !(report.blockingReasons instanceof List)
                || !report.blockingReasons.isEmpty()) {
            throw new GradleException(
                    'MyOS demo examples are not working-ready; see '
                            + reportFile)
        }
    }
}

