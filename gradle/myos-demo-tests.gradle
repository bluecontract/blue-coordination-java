                ]),
        performance : [
                'blue.coordination.examples.WadowiceAttachPayNoteLatencyTest#shouldKeepFirstSeenExactEventP95WithinOneSecond',
                'blue.coordination.examples.WadowiceOperationLatencyCampaignTest#shouldKeepEveryReportedOperationP95WithinOneSecond',
                'blue.coordination.examples.WadowicePayNoteAppendFastPathTest#shouldKeepTheFirstSeenPayNoteAppendBelowTwoHundredFiftyMilliseconds'
        ]
].collectEntries { label, selectors ->
    [(label): Collections.unmodifiableList(new ArrayList<String>(selectors))]
}.asImmutable()
def round4NearestRank = { List<Long> values, double percentile ->
    if (values == null || values.isEmpty()) {
        throw new GradleException(
                'Round-4 distribution requires at least one raw sample')
    }
    def ordered = values.collect { value ->
        long checked = ((Number) value).longValue()
        if (checked < 0L) {
            throw new GradleException(
                    'Round-4 latency samples must be non-negative')
        }
        checked
    }.sort()
    int rank = Math.max(1, (int) Math.ceil(percentile * ordered.size()))
    ordered[Math.min(ordered.size(), rank) - 1]
}
def round4Distribution = { List<Long> values ->
    def checked = values.collect { value ->
        ((Number) value).longValue()
    }
    double mean = checked.sum(0L) / (double) checked.size()
    double variance = checked.collect { value ->
        double delta = value - mean
        delta * delta
    }.sum(0.0d) / checked.size()
    [
            sampleCount : (long) checked.size(),
            minimumNanos: checked.min(),
            p50Nanos    : round4NearestRank(checked, 0.50d),
            p90Nanos    : round4NearestRank(checked, 0.90d),
            p95Nanos    : round4NearestRank(checked, 0.95d),
            p99Nanos    : round4NearestRank(checked, 0.99d),
            maximumNanos: checked.max(),
            meanNanos   : mean,
            standardDeviationNanos: Math.sqrt(variance)
    ]
}

def configureMyosRound4Test = { Test task ->
    task.dependsOn(
            tasks.named('myosDemoTestClasses'),
            verifyMyosDemoDependencyClasspath,
            inspectMyosDemoSourceStyle)
