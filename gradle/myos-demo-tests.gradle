def myosSha256 = { File source ->
    if (source == null || !source.isFile()) {
        return null
    }
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    source.withInputStream { input ->
        byte[] buffer = new byte[8192]
        int read
        while ((read = input.read(buffer)) >= 0) {
            if (read > 0) {
                digest.update(buffer, 0, read)
            }
        }
    }
    digest.digest().collect {
        String.format(java.util.Locale.ROOT, '%02x', it & 0xff)
    }.join()
}

def myosSha256Bytes = { byte[] value ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    digest.update(value)
    digest.digest().collect {
        String.format(java.util.Locale.ROOT, '%02x', it & 0xff)
    }.join()
}

/*
 * Unlike the human-facing Git helper below, this preserves stdout byte for
 * byte. Dirty-state evidence must cover both index/worktree patches and the
 * contents of every untracked file; trimmed text output cannot do that.
 */
def myosGitBytes = { File directory, String... arguments ->
    def command = new ArrayList<String>()
    command.add('git')
    command.addAll(Arrays.asList(arguments))
    def process = new ProcessBuilder(command)
            .directory(directory)
            .start()
    def stdout = new ByteArrayOutputStream()
    def stderr = new ByteArrayOutputStream()
    def readerFailure = new java.util.concurrent.atomic.AtomicReference<
            Throwable>()
    def copy = { InputStream input, OutputStream output ->
        try {
            byte[] buffer = new byte[8192]
            int read
            while ((read = input.read(buffer)) >= 0) {
                if (read > 0) {
                    output.write(buffer, 0, read)
                }
            }
        } catch (Throwable failure) {
            readerFailure.compareAndSet(null, failure)
        } finally {
            input.close()
        }
    }
    def stdoutReader = new Thread(
            { copy(process.inputStream, stdout) } as Runnable,
            'myos-git-stdout')
    def stderrReader = new Thread(
            { copy(process.errorStream, stderr) } as Runnable,
            'myos-git-stderr')
    stdoutReader.start()
    stderrReader.start()
    int exit = process.waitFor()
    stdoutReader.join()
    stderrReader.join()
    if (readerFailure.get() != null) {
        throw new GradleException(
                "Could not read Git output in ${directory}: ${command}",
                readerFailure.get())
    }
    if (exit != 0) {
        String diagnostic = new String(
                stderr.size() > 0
                        ? stderr.toByteArray()
                        : stdout.toByteArray(),
                java.nio.charset.StandardCharsets.UTF_8).trim()
        throw new GradleException(
                "Git command failed in ${directory}: ${command}\n"
                        + diagnostic)
    }
    stdout.toByteArray()
}

def myosGit = { File directory, String... arguments ->
    def command = new ArrayList<String>()
    command.add('git')
    command.addAll(Arrays.asList(arguments))
    def process = new ProcessBuilder(command)
            .directory(directory)
            .redirectErrorStream(true)
            .start()
    String output = process.inputStream.getText('UTF-8').trim()
    if (process.waitFor() != 0) {
        throw new GradleException(
                "Git command failed in ${directory}: ${command}\n${output}")
    }
    output
}

/*
 * Versioned, deterministic dirty-state fingerprint. Framing every byte field
 * prevents concatenation ambiguity. Index and worktree patches are retained
 * independently, and untracked paths, kinds, lengths, and raw contents are
 * included in sorted path order.
 */
def myosSourceStateSnapshot = { File root ->
    byte[] status = myosGitBytes(
            root,
            'status', '--porcelain', '-z', '--untracked-files=all')
    byte[] lineStatus = myosGitBytes(
            root,
            'status', '--porcelain', '--untracked-files=all')
    byte[] indexDiff = myosGitBytes(
            root,
            'diff', '--cached', '--binary', '--full-index',
            '--no-ext-diff', '--no-textconv', 'HEAD', '--')
    byte[] worktreeDiff = myosGitBytes(
            root,
            'diff', '--binary', '--full-index',
            '--no-ext-diff', '--no-textconv', '--')
    byte[] untrackedListing = myosGitBytes(
            root,
            'ls-files', '--others', '--exclude-standard', '-z')
    def untrackedPaths = new String(
            untrackedListing,
            java.nio.charset.StandardCharsets.UTF_8)
            .split('\u0000', -1)
            .findAll { !it.isEmpty() }
            .sort()
    def dirtyDigest = java.security.MessageDigest.getInstance('SHA-256')
    def untrackedDigest = java.security.MessageDigest.getInstance('SHA-256')
    def updateFrame = { java.security.MessageDigest digest,
                        String label,
                        byte[] value ->
        byte[] header = (label + '\u0000' + value.length + '\u0000')
                .getBytes(java.nio.charset.StandardCharsets.UTF_8)
        digest.update(header)
        digest.update(value)
    }
    updateFrame(
            dirtyDigest,
            'domain',
            'blue-coordination/git-dirty-fingerprint/1.0'.getBytes(
                    java.nio.charset.StandardCharsets.UTF_8))
    updateFrame(dirtyDigest, 'status', status)
    updateFrame(dirtyDigest, 'index-diff', indexDiff)
    updateFrame(dirtyDigest, 'worktree-diff', worktreeDiff)
    updateFrame(
            untrackedDigest,
            'domain',
            'blue-coordination/git-untracked-content/1.0'.getBytes(
                    java.nio.charset.StandardCharsets.UTF_8))
    untrackedPaths.each { String relativePath ->
        File entry = new File(root, relativePath)
        byte[] pathBytes = relativePath.getBytes(
                java.nio.charset.StandardCharsets.UTF_8)
        String kind
        byte[] contents
        if (java.nio.file.Files.isSymbolicLink(entry.toPath())) {
            kind = 'symlink'
            contents = java.nio.file.Files.readSymbolicLink(entry.toPath())
                    .toString()
                    .getBytes(java.nio.charset.StandardCharsets.UTF_8)
        } else if (entry.isFile()) {
            kind = 'file'
            contents = java.nio.file.Files.readAllBytes(entry.toPath())
        } else {
            throw new GradleException(
                    'Untracked Git entry is neither a file nor a symlink: '
                            + entry)
        }
        updateFrame(untrackedDigest, 'path', pathBytes)
        updateFrame(
                untrackedDigest,
                'kind',
                kind.getBytes(java.nio.charset.StandardCharsets.UTF_8))
        updateFrame(untrackedDigest, 'contents', contents)
        updateFrame(dirtyDigest, 'untracked-path', pathBytes)
        updateFrame(
                dirtyDigest,
                'untracked-kind',
                kind.getBytes(java.nio.charset.StandardCharsets.UTF_8))
        updateFrame(dirtyDigest, 'untracked-contents', contents)
    }
    def hexadecimal = { byte[] value ->
        value.collect {
            String.format(java.util.Locale.ROOT, '%02x', it & 0xff)
        }.join()
    }
    [
            commit          : myosGit(root, 'rev-parse', 'HEAD'),
            state           : status.length == 0 ? 'clean' : 'dirty',
            entries         : lineStatus.length == 0
                    ? 0L
                    : (long) new String(
                    lineStatus,
                    java.nio.charset.StandardCharsets.UTF_8)
                    .readLines().size(),
            dirtyFingerprint: hexadecimal(dirtyDigest.digest()),
            tracked         : [
                    indexDiffSha256   : myosSha256Bytes(indexDiff),
                    worktreeDiffSha256: myosSha256Bytes(worktreeDiff)
            ],
            untracked       : [
                    count         : (long) untrackedPaths.size(),
                    paths         : untrackedPaths,
                    contentsSha256: hexadecimal(untrackedDigest.digest())
            ]
    ]
}

/*
 * Git and the working tree are read through separate system calls. Capture the
 * complete state twice and reject a moving tree instead of publishing a
 * fingerprint assembled from two different instants.
 */
def myosSourceState = { File root ->
    def first = myosSourceStateSnapshot(root)
    def second = myosSourceStateSnapshot(root)
    if (first != second) {
        throw new GradleException(
                'Git source state changed while it was being fingerprinted: '
                        + root.absolutePath)
    }
    first
}

def myosWriteJson = { File target, Object value ->
    target.parentFile.mkdirs()
    target.setText(
            JsonOutput.prettyPrint(JsonOutput.toJson(value)) + '\n',
            'UTF-8')
}

def myosEvidenceSource = { File source ->
    [
            path  : source == null ? null : source.absolutePath,
            sha256: myosSha256(source),
            status: source != null && source.isFile()
                    ? 'present'
                    : 'missing'
    ]
}

