/*
 * Capture the current source/dependency baseline without trusting a retained
 * engine receipt from an earlier invocation. The engine gate remains an
 * explicit post-example command, so its baseline status is truthfully
 * notExecuted here.
 */
def generateMyosDemoBaselineReport = tasks.register(
        'generateMyosDemoBaselineReport') {
    group = 'verification'
    description =
            'Records exact source and dependency inputs for the MyOS example run.'
    dependsOn verifyMyosDemoDependencyClasspath
    inputs.files(
            myosDependencyReport,
            myosSiblingInputs,
            file('gradle/coordination-external-blockers.json'))
    outputs.file(myosBaselineReport)
    outputs.upToDateWhen { false }
    doFirst {
        acquireRound4CampaignLock()
        delete(myosBaselineReport.get().asFile)
    }
    doLast {
        def topology = project.ext.latestBlueDependencyTopology
        def dependency = new JsonSlurper().parse(
                myosDependencyReport.get().asFile)
        File externalBlockerFile =
                file('gradle/coordination-external-blockers.json')
        def externalBlockerCatalog = new JsonSlurper().parse(
                externalBlockerFile)
        def openExternalBlockers = externalBlockerCatalog.blockers
                .findAll { blocker -> blocker.status == 'open' }
                .collect { blocker ->
                    [
                            id                  : blocker.id,
                            owner               : blocker.owner,
                            status              : blocker.status,
                            category            : blocker.category,
                            firstObservedAgainst:
                                    blocker.firstObservedAgainst,
                            failureType         : blocker.failureType,
                            logicalMessagePrefix:
                                    blocker.logicalMessagePrefix,
                            reproductionCommand:
                                    blocker.reproductionCommand,
                            notes               : blocker.notes,
                            probeCount          : blocker.probes instanceof List
                                    ? (long) blocker.probes.size()
                                    : 0L
                    ]
                }
        def report = [
                schema           :
                        'blue-coordination/myos-demo-baseline/1.0',
                status           : dependency.status == 'verified'
                        ? 'notExecuted'
                        : 'failed',
                repositories     : [
                        coordination: myosSourceState(projectDir),
                        language    : myosSourceState(topology.languageRoot),
                        bex         : myosSourceState(topology.bexRoot),
                        repository  : myosSourceState(
                                topology.repositorySourceRoot)
                ],
                siblingLock      : [
                        path  : topology.lockFile.absolutePath,
                        sha256: myosSha256(topology.lockFile)
                ],
                dependencyReceipt: myosEvidenceSource(
                        myosDependencyReport.get().asFile),
                artifacts        : dependency.artifacts,
                engineWorkingGate: [
                        task  : 'coordinationProcessingEngineWorkingVerification',
                        status: 'notExecuted',
                        reason:
                                'The prompt requires this as a separate post-example invocation; retained historical reports are not consumed.'
                ],
                externalBlockerCatalog: myosEvidenceSource(
                        externalBlockerFile),
                externalBlockers : openExternalBlockers
        ]
        myosWriteJson(myosBaselineReport.get().asFile, report)
    }
}

