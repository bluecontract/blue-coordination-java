                        && round4IsBlueId(root.rootBefore)
                        && round4IsBlueId(root.rootAfter)
                        && round4IsSha256(root.inventoryBefore)
                        && round4IsSha256(root.inventoryAfter)
                        && root.receiptStatus == 'COMMITTED'
                        && positiveLong(root.attempt)
                        && !root.phasesNanos.isEmpty()
                        && !root.work.isEmpty()
                        && nonNegativeLong(root.prepareStartedNanos)
                        && nonNegativeLong(root.prepareCompletedNanos)
                        && nonNegativeLong(root.commitStartedNanos)
                        && nonNegativeLong(root.commitCompletedNanos)
                        && root.prepareStartedNanos
                        <= root.prepareCompletedNanos
                        && root.prepareCompletedNanos
                        <= root.commitStartedNanos
                        && root.commitStartedNanos
                        <= root.commitCompletedNanos
                if (!rootComplete) {
                    samplesComplete = false
                    addBlocker(
                            'coordination',
                            'timing-sample-' + (sampleIndex + 1)
                                    + '-root-' + (rootIndex + 1),
                            'A processed first-seen Root lacks an exact '
                                    + 'identity, receipt, phase, or interval.')
                }
                roots.add(root)
            }
            def sample = [
                    case         : operation.caseId,
                    operation    : operation.operation,
                    eventBlueId  : operation.entryBlueId,
                    roots        : roots,
                    appendNanos  : nonNegativeLong(operation.appendTotalNanos)
                            ? operation.appendTotalNanos.longValue()
                            : operation.appendTotalNanos,
                    endToEndNanos: nonNegativeLong(
                            operation.appendAndProcessTotalNanos)
                            ? operation.appendAndProcessTotalNanos.longValue()
                            : operation.appendAndProcessTotalNanos
            ]
            boolean sampleComplete = nonBlank(sample.case)
                    && nonBlank(sample.operation)
                    && round4IsBlueId(sample.eventBlueId)
                    && !sample.roots.isEmpty()
                    && operation.affectedRootCount instanceof Number
                    && operation.affectedRootCount.longValue()
                    == sample.roots.size()
                    && nonNegativeLong(sample.appendNanos)
                    && nonNegativeLong(sample.endToEndNanos)
            if (!sampleComplete) {
                samplesComplete = false
                addBlocker(
                        'coordination',
                        'timing-sample-' + (sampleIndex + 1),
                        'A processed first-seen operation lacks an exact '
                                + 'event identity, Root set, or raw interval.')
            }
            samples.add(sample)
            addSummary('append.roots' + roots.size(), sample.appendNanos)
            addSummary('endToEnd.roots' + roots.size(), sample.endToEndNanos)
            if (operation.appendPhasesNanos instanceof Map) {
                operation.appendPhasesNanos.each {
                    String phase, value ->
                        addSummary('append.' + phase, value)
                }
            }
        }
        if (firstSeenOperations.size() < 100) {
            samplesComplete = false
            addBlocker(
                    'coordination',
                    'timing-first-seen-sample-count',
                    'Expected at least 100 processed paynote-latency-first-seen '
                            + 'timing samples; observed '
                            + firstSeenOperations.size())
        }
        def distribution = { List<Long> values ->
            def measured = round4Distribution(values)
            [
                    count       : measured.sampleCount,
                    minimumNanos: measured.minimumNanos,
                    p50Nanos    : measured.p50Nanos,
                    p95Nanos    : measured.p95Nanos,
                    p99Nanos    : measured.p99Nanos,
                    maximumNanos: measured.maximumNanos,
                    meanNanos   : measured.meanNanos
            ]
        }
        def summaries = new LinkedHashMap<String, Object>()
        summaryValues.each { String name, List<Long> values ->
            if (!values.isEmpty()) {
                summaries.put(name, distribution(values))
            }
        }
        def timingGate = timing?.round4FirstSeenGate
        boolean timingGatePassed = timingGate instanceof Map
                && timingGate.status == 'passed'
                && timingGate.exactSampleCount instanceof Number
                && timingGate.exactSampleCount.longValue() >= 100L
                && timingGate.failures instanceof List
                && timingGate.failures.isEmpty()
        tests.put('performance.operationTimingGate', [
                executed: timing instanceof Map ? 1L : 0L,
                passed  : timingGatePassed ? 1L : 0L,
                failed  : timing instanceof Map && !timingGatePassed ? 1L : 0L,
                skipped : 0L,
                report  : round4OperationTimingEvidence.get().asFile
                        .absolutePath
        ])
        if (timing instanceof Map && !timingGatePassed) {
            addBlocker(
                    'coordination',
                    'timing-first-seen-gate',
                    'The same-run first-seen phase/parallel timing gate '
                            + 'did not pass.')
        }

        File externalBlockerFile =
                file('gradle/coordination-external-blockers.json')
        def externalCatalog = readJson(
                externalBlockerFile,
                'external-blocker-catalog',
                'blue-coordination/external-blockers/1.2')
        def catalogBlockers = externalCatalog?.blockers instanceof List
                ? externalCatalog.blockers
                : []
        def catalogBlockerIds = catalogBlockers.collect { blocker ->
            blocker instanceof Map ? blocker.id : null
        }
        def catalogProbeBindings = new LinkedHashMap<String, String>()
        boolean catalogProbesUnique = true
        catalogBlockers.each { blocker ->
            if (blocker instanceof Map && blocker.probes instanceof List) {
                blocker.probes.each { probe ->
                    String test = probe instanceof Map
                            ? probe.test?.toString()
                            : null
                    if (!nonBlank(test)
                            || catalogProbeBindings.put(
                            test,
                            blocker.id?.toString()) != null) {
                        catalogProbesUnique = false
                    }
                }
            }
        }
        boolean externalCatalogValid = externalCatalog instanceof Map
                && !catalogBlockers.isEmpty()
                && catalogBlockerIds.every { nonBlank(it) }
                && catalogBlockerIds.toSet().size()
                == catalogBlockerIds.size()
                && catalogProbesUnique
                && catalogBlockers.every { blocker ->
            blocker instanceof Map
                    && nonBlank(blocker.id)
                    && nonBlank(blocker.owner)
                    && blocker.status in ['open', 'closed']
                    && nonBlank(blocker.category)
                    && nonBlank(blocker.failureType)
                    && nonBlank(blocker.logicalMessagePrefix)
                    && nonBlank(blocker.reproductionCommand)
                    && nonBlank(blocker.notes)
                    && blocker.firstObservedAgainst instanceof Map
                    && blocker.probes instanceof List
                    && !blocker.probes.isEmpty()
                    && blocker.probes.every { probe ->
                probe instanceof Map
                        && probe.keySet() == (['test'] as Set)
                        && nonBlank(probe.test)
            }
        }
        if (externalCatalog instanceof Map && !externalCatalogValid) {
            addBlocker(
                    'external-catalog',
                    'external-blocker-catalog-shape',
                    'The external-blocker catalog does not contain a unique, '
                            + 'complete blocker/probe declaration set.')
        }

        def externalProbeReceipt = readJson(
                round4ExternalBlockerEvidence.get().asFile,
                'external-blocker-same-run-evidence',
                'blue-coordination/external-blocker-report/1.0')
        def probeOutcomes = externalProbeReceipt?.outcomes instanceof List
                ? externalProbeReceipt.outcomes
                : []
        def outcomeTests = probeOutcomes.collect { outcome ->
            outcome instanceof Map ? outcome.test : null
        }
        def catalogById = catalogBlockers.collectEntries { blocker ->
            blocker instanceof Map && nonBlank(blocker.id)
                    ? [(blocker.id.toString()): blocker]
                    : [:]
        }
        boolean externalProbeReceiptValid = externalCatalogValid
                && externalProbeReceipt instanceof Map
                && nonNegativeLong(externalProbeReceipt.declaredProbes)
                && externalProbeReceipt.declaredProbes.longValue()
                == catalogProbeBindings.size()
                && nonNegativeLong(externalProbeReceipt.executedProbes)
                && externalProbeReceipt.executedProbes.longValue()
                == catalogProbeBindings.size()
                && externalProbeReceipt.invalidProbes instanceof List
                && externalProbeReceipt.invalidProbes.isEmpty()
                && probeOutcomes.size() == catalogProbeBindings.size()
                && outcomeTests.every { nonBlank(it) }
                && outcomeTests.toSet()
                == catalogProbeBindings.keySet().toSet()
                && outcomeTests.toSet().size() == outcomeTests.size()
                && probeOutcomes.every { outcome ->
            if (!(outcome instanceof Map)
                    || !(outcome.outcome in ['resolved', 'exactly-blocked'])) {
                return false
            }
            String test = outcome.test?.toString()
            String blockerId = catalogProbeBindings.get(test)
            def blocker = catalogById.get(blockerId)
            blocker instanceof Map
                    && outcome.blockerId == blockerId
                    && outcome.owner == blocker.owner
                    && outcome.category == blocker.category
                    && outcome.expectedFailureType == blocker.failureType
                    && outcome.expectedLogicalMessagePrefix
                    == blocker.logicalMessagePrefix
                    && (outcome.outcome == 'resolved'
                    || (outcome.failureType == blocker.failureType
                    && nonBlank(outcome.logicalMessage)
                    && outcome.logicalMessage.toString().startsWith(
                    blocker.logicalMessagePrefix.toString())))
        }
                && externalProbeReceipt.resolvedProbes instanceof Number
                && externalProbeReceipt.resolvedProbes.longValue()
                == probeOutcomes.count { it.outcome == 'resolved' }
                && externalProbeReceipt.exactlyBlockedProbes instanceof Number
                && externalProbeReceipt.exactlyBlockedProbes.longValue()
                == probeOutcomes.count {
            it.outcome == 'exactly-blocked'
        }
        boolean externalProbeGateReady = recordRequiredGate(
                'externalBlockerProbe',
                'coordinationExternalBlockerProbeTest',
                externalProbeReceiptValid,
                round4ExternalBlockerEvidence.get().asFile)

        def sameRunExternalStatus = new TreeMap<String, String>()
        if (externalProbeReceiptValid) {
            catalogBlockers.each { blocker ->
                boolean blocked = probeOutcomes.any { outcome ->
                    outcome.blockerId == blocker.id
                            && outcome.outcome == 'exactly-blocked'
                }
                sameRunExternalStatus.put(
                        blocker.id.toString(),
                        blocked ? 'open' : 'resolved')
            }
        }
        def workingGateReceipt = readJson(
                round4WorkingGateEvidence.get().asFile,
                'coordination-working-same-run-evidence',
                'blue-coordination/working-report/1.0')
        def workingExternalStatuses =
                workingGateReceipt?.externalBlockers instanceof List
                        ? workingGateReceipt.externalBlockers.collectEntries {
            blocker ->
                blocker instanceof Map && nonBlank(blocker.id)
                        ? [(blocker.id.toString()): blocker.status]
                        : [:]
        }
                        : [:]
        boolean workingGateReceiptValid = externalProbeReceiptValid
                && workingGateReceipt instanceof Map
                && workingGateReceipt.workingEligible == true
                && workingGateReceipt.publicReleaseEligible == false
                && workingGateReceipt.coordinationOwnedFailures instanceof List
                && workingGateReceipt.coordinationOwnedFailures.isEmpty()
                && workingGateReceipt.fixtureFailures instanceof List
                && workingGateReceipt.fixtureFailures.isEmpty()
                && workingGateReceipt.unclassifiedFailures instanceof List
                && workingGateReceipt.unclassifiedFailures.isEmpty()
                && workingGateReceipt.externalProbes instanceof Map
                && workingGateReceipt.externalProbes.declared
                == externalProbeReceipt.declaredProbes
                && workingGateReceipt.externalProbes.executed
                == externalProbeReceipt.executedProbes
                && workingGateReceipt.externalProbes.resolved
                == externalProbeReceipt.resolvedProbes
                && workingGateReceipt.externalProbes.blocked
                == externalProbeReceipt.exactlyBlockedProbes
                && workingGateReceipt.externalProbes.invalid == 0
                && workingExternalStatuses == sameRunExternalStatus
        boolean workingGateReady = recordRequiredGate(
                'coordinationWorking',
                'coordinationWorkingVerification',
                workingGateReceiptValid,
                round4WorkingGateEvidence.get().asFile)

        def currentExternalBlockers = externalProbeGateReady
                ? catalogBlockers.findAll { blocker ->
            sameRunExternalStatus.get(blocker.id.toString()) == 'open'
        }
                : catalogBlockers.findAll { blocker ->
            blocker instanceof Map && blocker.status == 'open'
        }
        currentExternalBlockers.each { blocker ->
            long blockedProbeCount = externalProbeReceiptValid
                    ? probeOutcomes.count { outcome ->
                outcome.blockerId == blocker.id
                        && outcome.outcome == 'exactly-blocked'
            }
                    : 0L
            addBlocker(
                    'external-catalog',
                    blocker.id?.toString() ?: 'unnamed-external-blocker',
                    (externalProbeGateReady
                            ? 'Same-run probe outcome remains blocked; '
                            : 'Same-run probe outcome is unavailable; '
                            + 'preserving the declared blocker; ')
                            + 'owner=' + blocker.owner
                            + ', category=' + blocker.category
                            + ', firstObservedAgainst='
                            + JsonOutput.toJson(blocker.firstObservedAgainst)
                            + ', failure=' + blocker.failureType
                            + ': ' + blocker.logicalMessagePrefix
                            + ', probes='
                            + (blocker.probes instanceof List
                            ? blocker.probes.size()
                            : 0)
                            + ', exactlyBlockedProbes=' + blockedProbeCount
                            + '. ' + blocker.notes
                            + ' Reproduce: '
                            + blocker.reproductionCommand)
        }

        boolean baselineReady = sameInvocationPrepared
                && baselineStructureValid
                && baseline.status == 'notExecuted'
        boolean semanticTestsReady = junitPassed('core')
                && junitPassed('correctness')
                && junitPassed('differential')
        boolean performanceEvidenceReady = junitPassed('performance')
                && latencyReceiptValidity.firstSeen == true
                && latencyReceiptValidity.warm == true
                && timingStructureValid
                && machineComplete
                && samplesComplete
                && firstSeenOperations.size() >= 100
                && orderSparseTimingBindingsValid
                && timingGatePassed
                && !summaries.isEmpty()
        boolean myosReady = baselineReady
                && coordinationUnchanged
                && frozenSiblingsUnchanged
                && mandatoryBuildGatesReady
                && externalProbeGateReady
                && workingGateReady
                && semanticTestsReady
                && parityReady
        boolean performanceReady = myosReady
                && performanceEvidenceReady
        boolean repositoryReady = myosReady
                && performanceReady
                && frozenSiblingsUnchanged
                && siblingLockUnchanged
                && externalCatalogValid
                && currentExternalBlockers.isEmpty()

        def coordinationSource = currentSources.coordination instanceof Map
                ? currentSources.coordination
                : baselineRepositories.coordination
        def source = [
                coordinationCommit: coordinationSource?.commit
                        ?: null,
                dirtyFingerprint : coordinationSource?.dirtyFingerprint
                        ?: null,
                frozenSiblings   : [
                        language  : currentSources.language?.commit
                                ?: baselineRepositories.language?.commit
                                ?: null,
                        bex       : currentSources.bex?.commit
                                ?: baselineRepositories.bex?.commit
                                ?: null,
                        repository: currentSources.repository?.commit
                                ?: baselineRepositories.repository?.commit
                                ?: null
                ]
        ]
        def readiness = [
                myosReady       : myosReady,
                performanceReady: performanceReady,
                repositoryReady : repositoryReady
        ]
        def report = [
                schema    : 'blue-coordination/myos-round4-evidence/1.0',
                source    : source,
                machine   : machine,
                parity    : parity,
                samples   : samples,
                summaries : summaries,
                tests     : tests,
                blockers  : blockers,
                readiness : readiness
        ]
        if (myosReady && performanceReady) {
            project.ext.requireCheckedJsonSchema.call(
                    report,
                    round4EvidenceSchemaFile,
                    'Round-4 success evidence')
            myosWriteJson(round4FinalEvidence.get().asFile, report)
            finalEvidenceWritten = true
        } else {
            def failedReport = [
                    schema         :
                            'blue-coordination/myos-round4-evidence-failure/1.0',
                    attemptedSchema:
                            'blue-coordination/myos-round4-evidence/1.0',
                    status         : 'failed',
                    evidence       : [
                            source   : source,
                            machine  : machine,
                            parity   : parity,
                            samples  : samples,
                            summaries: summaries,
                            tests    : tests
                    ],
                    blockers       : blockers,
                    readiness      : readiness
            ]
            project.ext.requireCheckedJsonSchema.call(
                    failedReport,
                    round4FailureEvidenceSchemaFile,
                    'Round-4 failed evidence')
            myosWriteJson(round4FinalEvidence.get().asFile, failedReport)
            finalEvidenceWritten = true
            throw new GradleException(
                    'Round-4 evidence failed closed; see '
                            + round4FinalEvidence.get().asFile)
        }
        } catch (Throwable failure) {
            if (!finalEvidenceWritten) {
                def fallbackBlockers = blockers.collect { blocker ->
                    [
                            owner      : blocker.owner?.toString()
                                    ?: 'coordination',
                            identity   : blocker.identity?.toString()
                                    ?: 'round4-aggregation',
                            description: blocker.description?.toString()
                                    ?: 'Round-4 aggregation was incomplete.'
                    ]
                }
                fallbackBlockers.add([
                        owner      : 'coordination',
                        identity   : 'round4-aggregation-exception',
                        description: failure.class.name + ': '
                                + (failure.message
                                ?: 'No exception message was provided.')
                ])
                def fallback = [
                        schema         :
                                'blue-coordination/myos-round4-evidence-failure/1.0',
                        attemptedSchema:
                                'blue-coordination/myos-round4-evidence/1.0',
                        status         : 'aggregationFailed',
                        failure        : [
                                type   : failure.class.name,
                                message: failure.message
                                        ?: 'No exception message was provided.'
                        ],
                        blockers       : fallbackBlockers,
                        readiness      : [
                                myosReady       : false,
                                performanceReady: false,
                                repositoryReady : false
                        ]
                ]
                try {
                    project.ext.requireCheckedJsonSchema.call(
                            fallback,
                            round4FailureEvidenceSchemaFile,
                            'Round-4 aggregation-failure evidence')
                    myosWriteJson(
                            round4FinalEvidence.get().asFile,
                            fallback)
                    finalEvidenceWritten = true
                } catch (Throwable writeFailure) {
                    failure.addSuppressed(writeFailure)
                }
            }
            throw failure
        }
    }
}

/*
 * Only the complete lifecycle task finalizes the aggregate receipt. Individual
 * campaign lanes remain independently runnable and cannot fail merely because
 * lanes that were not requested have no same-run evidence.
 */

def generateMyosDemoFinalReport = tasks.register(
        'generateMyosDemoFinalReport') {
    group = 'verification'
    description =
            'Writes truthful same-run JSON and Markdown MyOS example evidence.'
    dependsOn(
            generateMyosDemoBaselineReport,
            inspectMyosDemoSourceStyle,
            coordinationMyosDemoTest,
            inspectMyosDemoPublishedArtifactIsolation)
    inputs.files(
            myosDependencyReport,
            myosBaselineReport,
            myosSourceStyleReport,
            myosArtifactIsolationReport,
            myosSiblingInputs)
    inputs.property(
            'runtimeEvidenceSha256',
            providers.provider {
                myosSha256(myosRuntimeEvidence.get().asFile) ?: 'missing'
            })
    inputs.property(
            'documentsManifestSha256',
            providers.provider {
                myosSha256(myosDocumentsManifest.get().asFile) ?: 'missing'
            })
    inputs.dir(
            layout.buildDirectory.dir(
                    'test-results/coordinationMyosDemoTest'))
    outputs.files(myosFinalJson, myosFinalMarkdown)
    outputs.upToDateWhen { false }
    doFirst {
        delete(
                myosFinalJson.get().asFile,
                myosFinalMarkdown.get().asFile)
    }
    doLast {
        File junitDirectory = file(
                'build/test-results/coordinationMyosDemoTest')
        def tests = myosReadJUnit(junitDirectory)
        def style = new JsonSlurper().parse(
                myosSourceStyleReport.get().asFile)
        def dependency = new JsonSlurper().parse(
                myosDependencyReport.get().asFile)
        def baseline = new JsonSlurper().parse(
                myosBaselineReport.get().asFile)
        def artifacts = new JsonSlurper().parse(
                myosArtifactIsolationReport.get().asFile)
        def siblingInputs = new JsonSlurper().parse(
                myosSiblingInputs.get().asFile)
        File runtimeFile = myosRuntimeEvidence.get().asFile
        File documentsFile = myosDocumentsManifest.get().asFile
        def runtime = runtimeFile.isFile()
                ? new JsonSlurper().parse(runtimeFile)
                : null
        def documents = documentsFile.isFile()
                ? new JsonSlurper().parse(documentsFile)
                : null

        def expectedTestInventory = myosPerformanceGatesEnabled
                ? style.testMethods
                : style.correctnessTestMethods
        def expectedTests = expectedTestInventory instanceof List
                ? expectedTestInventory.collect { it.toString() }.sort()
                : []
        def actualTests = tests.records.collect {
            it.id.toString()
        }.sort()
        def missingTests = expectedTests.findAll {
            !actualTests.contains(it)
        }
        def unexpectedTests = actualTests.findAll {
            !expectedTests.contains(it)
        }

        def exampleByClass = myosExampleByClass
        def infrastructureOnlyTestClasses =
                myosInfrastructureOnlyTestClasses
        def declaredTestClasses = new TreeSet<String>()
        declaredTestClasses.addAll(exampleByClass.keySet())
        declaredTestClasses.addAll(infrastructureOnlyTestClasses)
        def declaredSourceTests = style.testMethods instanceof List
                ? style.testMethods
                : []
        def sourceTestClasses = declaredSourceTests.collect { testId ->
            int separator = testId.indexOf('#')
            separator > 0 ? testId.substring(0, separator) : testId
        }.toSet()
        def missingDeclaredTestClasses = declaredTestClasses.findAll {
            !sourceTestClasses.contains(it)
        }.sort()
        def overlappingTestRegistries = exampleByClass.keySet().findAll {
            infrastructureOnlyTestClasses.contains(it)
        }.sort()
        def requiredRoundTwoTestIds = [
                'blue.coordination.examples.TimelineFirstCounterExampleTest#shouldAppendToTheTimelineThenLetTheEnvironmentFindTheCounter',
                'blue.coordination.examples.support.TimelineCanonicalAppendTest#shouldLeaveTimelineAndJournalUnchangedWhenAdmissionFails',
                'blue.coordination.examples.support.TimelineCanonicalAppendTest#shouldUseCanonicalJournalMetadataInsteadOfForgedRecordFields',
                'blue.coordination.examples.support.TimelineCanonicalAppendTest#shouldNotExposeTimelineMutationAsPublicApi',
                'blue.coordination.examples.TimelineFirstCompleteFanoutExampleTest#shouldSelectEveryMatchingRootForThreeUnrelatedOperationNames',
                'blue.coordination.examples.TimelineFirstChunkEquivalenceExampleTest#shouldProduceIdenticalResultsAtChunkSizesOneTwoAndOneTwentyEight',
                'blue.coordination.examples.TimelineFirstNestedAttachmentExampleTest#shouldAdoptAnAlreadyProcessedEmb2AndFanOutLaterWorkInChunks',
                'blue.coordination.examples.TimelineFirstNestedAttachmentExampleTest#shouldNeverOverrideExplicitManagedIdentityFromABlueIdReference',
                'blue.coordination.examples.support.MyOsLateAttachmentTopologyTest#shouldGraftCurrentStateAndNeverReplayEntriesAtAdmissionHighWater',
                'blue.coordination.examples.support.MyOsLateAttachmentTopologyTest#shouldRejectCycleWithoutPublishingPartialReplacement',
                'blue.coordination.examples.support.MyOsLateAttachmentTopologyTest#shouldRejectDirectSelfCycleBeforePublishingStagedAdmission',
                'blue.coordination.examples.support.MyOsLateAttachmentTopologyTest#shouldNeverInferLogicalIdentityFromEqualContent',
                'blue.coordination.examples.support.MyOsLateAttachmentTopologyTest#shouldReconcileRemovalInBothTopologyDirections',
                'blue.coordination.examples.support.MyOsLateAttachmentTopologyTest#shouldInitializeOneLogicalDocumentExactlyOnceUnderContention',
                'blue.coordination.examples.support.MyOsInverseAndChunkIndexTest#shouldMaintainExactBidirectionalTimelineMembership',
                'blue.coordination.examples.CoordinationPhysicalSlicePlannerTest#shouldSelectOnlyEmb1Emb2PhysicalRootsAndExcludeSibling',
                'blue.coordination.examples.support.CoordinationPhysicalSliceLoaderTest#shouldLoadAndReconstructOnlyTheSelectedEmbeddedRootClosure',
                'blue.coordination.examples.support.CoordinationPhysicalSliceLoaderTest#shouldRejectAStoreBodyThatDoesNotMatchItsSelectedIdentity',
                'blue.coordination.examples.WadowiceHotelDinnerOrderExampleTest#shouldCaptureAndConfirmTheCompleteHotelAndDinnerOrder',
                'blue.coordination.examples.WadowiceHotelDinnerOrderExampleTest#shouldCancelRestaurantWithinRangeAndRefundOnlyItsComponent',
                'blue.coordination.examples.WadowiceHotelDinnerOrderExampleTest#shouldCompleteDinnerWithTenPercentAdjustment',
                'blue.coordination.examples.WadowiceHotelDinnerOrderExampleTest#shouldDeclineLateCancellationWithoutChangingRestaurantState',
                'blue.coordination.examples.WadowiceHotelDinnerLocalityTest#shouldLoadOnlyTheTwoRestaurantBranchesForOneRestaurantEntry',
                'blue.coordination.examples.WadowiceRestaurantIndexedLocalityBudgetTest#shouldRouteRestaurantConfirmationWithoutScanningTheOrderRoot',
                'blue.coordination.examples.WadowicePreparedFixtureTest#shouldBuildAllPurposefulCheckpointsInOneLinearPreparation',
                'blue.coordination.examples.WadowicePreparedFixtureTest#shouldForkWithoutParsingInitializingReadingOrReplayingHistory',
                'blue.coordination.examples.WadowicePreparedFixtureTest#shouldKeepOneMutatedBranchItsClosedSiblingAndSourceIsolated',
                'blue.coordination.examples.WadowiceMeasuredWorkBudgetTest#shouldPrepareOneAuthorizationEntryForExactlyTwoRoots',
                'blue.coordination.examples.WadowiceMeasuredWorkBudgetTest#shouldConfirmBothOccurrencesInOneSparseRootProcess',
                'blue.coordination.examples.support.MyOsEvidenceShardingTest#shouldWriteBoundedRuntimeShardsAndAggregateThemExactlyOnce',
                'blue.coordination.examples.support.MyOsEvidenceShardingTest#shouldRejectDuplicateRuntimeAndTransitionIdentities',
                'blue.coordination.examples.MyOsDemoDocumentIntegrityTest#shouldParseAndIdentifyEveryPortableBlueDocument',
                'blue.coordination.examples.support.ManagedDocumentDynamicLinkReconciliationTest#shouldReconcileProcessAddedAndRemovedManagedLinkAcrossEveryIndex',
                'blue.coordination.examples.support.ManagedDocumentDynamicLinkReconciliationTest#shouldRejectDynamicCycleBeforePublishingAnyMutableRegistry'
        ]
        def missingRoundTwoTests = requiredRoundTwoTestIds.findAll {
            !actualTests.contains(it)
        }
        def nonPassingRoundTwoTests = requiredRoundTwoTestIds.findAll {
            String requiredId ->
                tests.records.any { record ->
                    record.id == requiredId && record.status != 'passed'
                }
        }
        boolean roundTwoCampaignVerified = missingRoundTwoTests.isEmpty()
                && nonPassingRoundTwoTests.isEmpty()
        def perExample = new TreeMap<String, Object>()
        exampleByClass.values().toSet().sort().each { exampleId ->
            def records = tests.records.findAll { record ->
                exampleByClass.get(record.className) == exampleId
            }
            perExample.put(
                    exampleId,
                    [
                            total  : (long) records.size(),
                            passed : (long) records.count {
                                it.status == 'passed'
                            },
                            failed : (long) records.count {
                                it.status == 'failed'
                            },
                            skipped: (long) records.count {
                                it.status == 'skipped'
                            }
                    ])
        }
        def unclassifiedTests = tests.records.findAll { record ->
            !exampleByClass.containsKey(record.className)
                    && !infrastructureOnlyTestClasses.contains(record.className)
        }

        def unclassifiedFailures = unclassifiedTests.findAll { record ->
            record.status == 'failed'
        }

