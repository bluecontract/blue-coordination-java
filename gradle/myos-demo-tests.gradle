        def finiteNonNegative = { value ->
            value instanceof Number
                    && Double.isFinite(value.doubleValue())
                    && value.doubleValue() >= 0.0d
        }
        def zeroMapField = { value, String field ->
            value instanceof Map
                    && nonNegativeLong(value[field])
                    && value[field].longValue() == 0L
        }
        def rawSampleHasNoFallback = { sample ->
            def work = sample instanceof Map ? sample.work : null
            def projection = work instanceof Map
                    ? work.projection : null
            def transition = work instanceof Map
                    ? work.fragmentTransition : null
            def referenceCut = work instanceof Map
                    ? work.referenceCut : null
            sample instanceof Map
                    && zeroMapField(sample, 'localityFallbackReadCount')
                    && zeroMapField(sample, 'forbiddenReadCount')
                    && zeroMapField(
                    sample,
                    'subscriptionProjectionColdFallbackCount')
                    && zeroMapField(projection, 'coldProjectionFallbacks')
                    && zeroMapField(projection, 'fullProjectorFallbacks')
                    && zeroMapField(projection, 'catalogFallbacks')
                    && zeroMapField(transition, 'typedFallbackCount')
                    && transition.typedFallbacksByReason instanceof Map
                    && transition.typedFallbacksByReason.isEmpty()
                    && zeroMapField(transition, 'fullBlueprintAttempts')
                    && zeroMapField(transition, 'fullResultClones')
                    && zeroMapField(
                    transition,
                    'fullRootMaterializations')
                    && zeroMapField(referenceCut, 'fullRootUses')
                    && zeroMapField(
                    referenceCut,
                    'plannedArtifactFallbacks')
                    && zeroMapField(referenceCut, 'identityFailures')
                    && zeroMapField(referenceCut, 'canonicalSingleReads')
                    && zeroMapField(work, 'eventSplits')
        }
        def validOrderSparseProof = { sample ->
            def proof = sample instanceof Map
                    ? sample.orderRootSparseProof : null
            def referenceCut = sample instanceof Map
                    && sample.work instanceof Map
                    ? sample.work.referenceCut : null
            if (!(proof instanceof Map)
                    || proof.documentKey != 'package-order'
                    || !nonBlank(proof.sessionId)
                    || !round4IsBlueId(proof.rootBlueId)
                    || round4NormalizedSha256(proof.inventoryIdentity)
                    == null
                    || !positiveLong(proof.inventoryFragmentCount)
                    || !nonNegativeLong(
                    proof.allRootMaterializedFragmentUpperBound)
                    || !(referenceCut instanceof Map)
                    || !positiveLong(referenceCut.processRootSelections)
                    || referenceCut.processRootSelections.longValue()
                    != sample.affectedRootCount.longValue()
                    || !nonNegativeLong(
                    referenceCut.processMaterializedFragments)
                    || proof.allRootMaterializedFragmentUpperBound
                    .longValue()
                    != referenceCut.processMaterializedFragments
                    .longValue()
                    || !finiteNonNegative(
                    proof.maximumPossibleMaterializationFraction)
                    || !(proof.maximumAllowedFraction instanceof Number)
                    || proof.maximumAllowedFraction.doubleValue() != 0.20d
                    || proof.passed != true) {
                return false
            }
            double calculated =
                    proof.allRootMaterializedFragmentUpperBound.longValue()
                            / (double) proof.inventoryFragmentCount
                            .longValue()
            Math.abs(calculated
                    - proof.maximumPossibleMaterializationFraction
                    .doubleValue()) <= 1.0e-12d
                    && calculated <= 0.20d
        }
        def validRawLatencySample = { sample,
                                      Set<String> expectedOperations ->
            if (!(sample instanceof Map)
                    || !expectedOperations.contains(sample.operation)
