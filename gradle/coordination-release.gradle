                                            requirement.parameter))
                        } as Set
                if (matching.isEmpty()) {
                    invalidJmhResults.add(
                            "${benchmarkName}: missing")
                } else if (requirement.parameter != null
                        && observedValues != requirement.values) {
                    invalidJmhResults.add(
                            "${benchmarkName}: expected "
                                    + "${requirement.parameter}="
                                    + requirement.values
                                    + ", observed "
                                    + observedValues)
                }
                matching.each { result ->
                    def primary =
                            result.primaryMetric
                                    instanceof Map
                                    ? result.primaryMetric
                                    : [:]
                    def secondary =
                            result.secondaryMetrics
                                    instanceof Map
                                    ? result.secondaryMetrics
                                    : [:]
                    def missingMetrics =
                            requirement.metrics
                                    .findAll {
