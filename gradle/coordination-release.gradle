                        && (fixedCatalog
                        .selectedRepositoryArtifactSha256
                        ==~ /[0-9a-f]{64}/)
                        && fixedRequiredClosure.repositoryVersion
                        == repositoryManifestValue.repositoryVersion
                        && fixedRequiredClosure
                        .repositoryManifestBlueId
                        == repositoryManifestValue
                        .repositoryVersionBlueId
                        && fixedRequiredClosure
                        .repositoryManifestSha256
                        == artifacts.fixedRepositoryManifestSha256
                        && fixedRequiredClosure.repositoryHeadCommit
                        == coordinates.repository.commit
        if (!fixedRequiredClosureCountsMatch
                || !fixedCatalogDiagnosticComplete
                || !fixedCatalogIdentityMatches) {
            blockers.add(
                    'The exact '
                            + requiredFixedTotal
                            + '-definition required fixed Repository closure '
                            + 'is not fully verified under '
                            + 'BOUND_SOURCE_CONTENT, or its informative '
                            + 'full-catalog audit does not match the '
                            + 'same-run Repository identities.')
        }

        boolean sameRunMetricsMatch =
                sameRun.conformance
                        ?.behavior?.required
                        == behavior.required
                        && sameRun.conformance
                        ?.behavior?.executed
                        == behavior.executed
                        && sameRun.conformance
                        ?.behavior?.passed
                        == behavior.passed
                        && sameRun.conformance
                        ?.portableGas?.required
                        == portableGas.required
                        && sameRun.conformance
                        ?.portableGas?.executed
                        == portableGas.executed
                        && sameRun.conformance
                        ?.portableGas?.passed
                        == portableGas.passed
                        && sameRun.conformance
                        ?.hostQuota?.required
                        == hostQuota.required
                        && sameRun.conformance
                        ?.hostQuota?.executed
                        == hostQuota.executed
                        && sameRun.conformance
                        ?.hostQuota?.passed
                        == hostQuota.passed
                        && sameRun.conformance
                        ?.total?.required
                        == totalConformance.required
                        && sameRun.conformance
                        ?.total?.executed
                        == totalConformance.executed
                        && sameRun.conformance
                        ?.total?.passed
                        == totalConformance.passed
                        && sameRun.flagship
                        ?.requiredVariants
                        == requiredFlagshipRuns
                        && sameRun.flagship
                        ?.passedVariants
                        == flagshipRuns
                        && sameRun.runtimeTrace
                        ?.requiredEntries
                        == requiredTraceEntries
                        && sameRun.runtimeTrace
                        ?.observedEntries
                        == traceEntries
                        && sameRun.fixedRepository
                        ?.total
                        == fixedCatalog.total
                        && sameRun.fixedRepository
                        ?.verified
                        == fixedCatalog.verified
                        && sameRun.fixedRepository
                        ?.failed
                        == fixedCatalog.failed
                        && sameRun.providerLocality
                        ?.forbiddenProviderDemandCount
                        == flagshipLocality
                        .forbiddenProviderDemandCount
                        && sameRun.providerLocality
                        ?.forbiddenBackendLoadCount
                        == flagshipLocality
                        .forbiddenBackendLoadCount
        if (!sameRunMetricsMatch) {
            blockers.add(
                    'The strict release metrics do not exactly match the '
                            + 'same-run machine-readable evidence bundle.')
        }

        def evidenceSources = [
                fullSuite:
                        releaseEvidenceSource(
                                releaseTestResults
                                        .get().asFile),
                partition:
                        releaseEvidenceSource(
                                partitionFile),
                sameRun:
                        releaseEvidenceSource(
                                sameRunFile),
                blockerCatalog:
                        releaseEvidenceSource(
                                releaseExternalBlockerCatalogFile),
                fixedRepository:
                        releaseEvidenceSource(
                                fixedCatalogReport),
                flagship:
                        releaseEvidenceSource(
                                flagshipFile),
                derived:
                        sameRun.evidenceSources
        ]

        def failureCases =
                tests.records.findAll {
                    it.status == 'failed'
                }.collect {
                    [
                            id      : it.id,
                            category: it.category,
                            message : it.message
                    ]
                }
        def skippedCases =
                tests.records.findAll {
                    it.status == 'skipped'
                }.collect {
                    it.id
                }
        long dependencyEvidenceFailures =
                tests.records.count {
                    it.status == 'failed'
                            && it.category
                            == 'dependency-evidence-before-coordination'
                }
        long coordinationEvidenceFailures =
                tests.failed - dependencyEvidenceFailures

        boolean releaseEligible =
                blockers.isEmpty()
        def report = [
                schema :
                        'blue.coordination/release-result/1.0',
                status :
                        releaseEligible
                                ? 'complete'
                                : 'blocked',
                repository:
                        coordinates.coordination,
                dependencies:
                        [
                                language  :
                                        coordinates.language,
                                bex       :
                                        coordinates.bex,
                                repository:
                                        coordinates.repository
                        ],
                requiredReleaseGates:
                        releaseGates,
                testPartition:
                        [
                                verified:
                                        partitionVerified,
                                parseError:
                                        partitionParseError,
                                receipt:
                                        partition
                        ],
                sameRunEvidence:
                        [
                                complete:
                                        sameRunEvidenceComplete,
                                metricsMatch:
                                        sameRunMetricsMatch,
                                parseError:
                                        sameRunParseError,
                                receipt:
                                        sameRun
                        ],
                evidenceSources:
                        evidenceSources,
                focusedSuites:
                        focusedSuites,
                siblingSourceLocks:
                        siblingSourceLocks,
                publishedDependencyAlignment:
                        publishedAlignment,
                runtimeIdentities:
                        [
                                languageCoreRegistry:
                                        'sha256:b705171a6ca62c990792bcb78db9d921caf5b0ed06370648b9a81769d69dd71e',
                                contractsRuntimeRegistry:
                                        'sha256:67ce3101449c5bca9e6093b081da239d5d699fdc02182a058d3ad795c6c6120b',
                                coordinationRuntimeRegistry:
                                        coordinationRuntimeRegistryIdentity,
                                coordinationRuntimeRegistrationInventorySha256:
                                        artifacts.runtimeRegistrationInventorySha256,
                                coordinationProjectionCatalogSha256:
                                        artifacts.projectionCatalogSha256
                        ],
                gasManifestIdentity:
                        gasPackageIdentity,
                hostQuotaScheduleIdentity:
                        hostQuotaScheduleIdentity,
                fixturePackageIdentity:
                        fixturePackageIdentity,
                subscriptionProjectionAlgorithmIdentity:
                        projectionAlgorithmIdentity,
                timelineEntryProjectionIdentity:
                        timelineEntryProjectionIdentity,
                fragmentationProfileIdentity:
                        fragmentationProfileIdentity,
                publicApiDigest:
                        api.publicApiDigest,
                tests :
                        [
                                total  :
                                        tests.required,
                                required:
                                        tests.required,
                                executed:
                                        tests.executed,
                                passed :
                                        tests.passed,
                                failed :
                                        tests.failed,
                                skipped:
                                        tests.skipped,
                                notExecuted:
                                        tests.notExecuted,
                                resultFiles:
                                        tests.resultFiles,
                                malformed:
                                        tests.malformed,
                                hardFullSuiteInventoryMatches:
                                        fullSuiteInventoryMatches,
                                hardTestFallbackUsed:
                                        usingHardTestFallback,
                                failedBeforeCoordinationBehaviorBecauseOfDependencyEvidence:
                                        dependencyEvidenceFailures,
                                failedBecauseOfCoordinationBehaviorOrEvidence:
                                        coordinationEvidenceFailures,
                                failedCases:
                                        failureCases,
                                skippedCases:
                                        skippedCases
                        ],
                conformance:
                        [
                                behavior   : behavior,
                                portableGas:
                                        portableGas,
                                hostQuota  : hostQuota,
                                total      :
                                        totalConformance
                        ],
                conformanceClosure:
                        [
                                declaredPackageIdentity:
                                        fixturePackageIdentity,
                                calculatedPackageIdentity:
                                        calculatedFixturePackageIdentity,
                                packageIdentityMatches:
                                        fixturePackageIdentityMatches,
                                gasManifestBindings:
                                        [
                                                portable:
                                                        [
                                                                declared:
                                                                        declaredPortableGasRawSha256,
                                                                observed:
                                                                        observedPortableGasRawSha256,
                                                                matches:
                                                                        portableGasManifestBindingMatches
                                                        ],
                                                hostQuota:
                                                        [
                                                                declared:
                                                                        declaredHostQuotaRawSha256,
                                                                observed:
                                                                        observedHostQuotaRawSha256,
                                                                matches:
                                                                        hostQuotaManifestBindingMatches
                                                        ]
                                        ],
                                manifest:
                                        conformanceManifestState,
                                manifestComplete:
                                        conformanceManifestComplete,
                                manifestCandidate:
                                        conformanceManifestCandidate,
                                sameRunTestsGreen:
                                        sameRunConformanceGreen,
                                receiptPresent:
                                        conformanceReceiptFile
                                                .isFile(),
                                receiptComplete:
                                        conformanceReceiptComplete,
                                receiptSha256:
                                        artifacts
                                                .conformanceReceiptSha256,
                                receiptIdentityMatches:
                                        conformanceReceiptIdentitiesMatch,
                                receiptIdentityComparisons:
                                        conformanceReceiptIdentityComparisons,
                                parseError:
                                        conformanceReceiptParseError
                        ],
                flagship:
                        [
                                required:
                                        requiredFlagshipRuns,
                                passed  : flagshipRuns
                        ],
                repeatedCounterTrace:
                        [
                                requiredEntries:
                                        requiredTraceEntries,
                                observedEntries:
                                        traceEntries,
                                passed         :
                                        traceGreen
                        ],
                fixedRepository:
                        [
                                expectedManifestBlueId:
                                        expectedRepositoryBlueId,
                                observedManifestBlueId:
                                        repositoryManifestValue
                                                .repositoryVersionBlueId,
                                manifestCompatible:
                                        repositoryManifestCompatible,
                                requiredClosureCountsMatch:
                                        fixedRequiredClosureCountsMatch,
                                fullCatalogDiagnosticComplete:
                                        fixedCatalogDiagnosticComplete,
                                sameRunIdentityMatch:
                                        fixedCatalogIdentityMatches,
                                requiredClosure:
                                        fixedRequiredClosure,
                                catalogAudit:
                                        fixedCatalog
                        ],
                providerLocality:
                        [
                                status:
                                        flagshipLocality.status,
                                matrixRows:
                                        flagshipLocality.matrixRows,
                                forbiddenProviderDemandCount:
                                        flagshipLocality
                                                .forbiddenProviderDemandCount,
                                forbiddenBackendLoadCount:
                                        flagshipLocality
                                                .forbiddenBackendLoadCount,
                                totals:
                                        flagshipLocality.totals,
                                variants:
                                        flagshipLocality.variants,
                                identitySets:
                                        flagshipLocality.identitySets,
                                invalidReasons:
                                        flagshipLocality
                                                .invalidReasons,
                                flagshipEvidencePresent:
                                        flagshipFile.isFile(),
                                loopEvidencePresent:
                                        releaseLoopEvidence
                                                .get().asFile
                                                .isFile(),
                                jmhBenchmarkCount:
                                        jmhResults instanceof List
                                                ? jmhResults.size()
                                                : 0,
                                benchmarkResults:
                                        benchmarkEvidence
                        ],
                forbiddenProviderDemandCount:
                        flagshipLocality
                                .forbiddenProviderDemandCount,
                binaryCompatibility:
                        binaryCompatibility,
                binaryCompatibilityBreaks:
                        binaryCompatibilityBreaks,
                javaBytecode:
                        javaBytecode,
                archiveReproducibility:
                        reproducible
                                ? 'passed'
                                : 'failed-or-not-executed',
                artifacts:
                        artifacts,
                releaseEligible:
                        releaseEligible,
                blockingReasons:
                        new ArrayList<String>(
                                new LinkedHashSet<String>(
                                        blockers))
        ]
        File jsonFile =
                finalJsonReport.get().asFile
        jsonFile.parentFile.mkdirs()
        jsonFile.setText(
                JsonOutput.prettyPrint(
                        JsonOutput.toJson(report))
                        + '\n',
                'UTF-8')
        File markdownFile =
                finalMarkdownReport.get().asFile
        markdownFile.parentFile.mkdirs()
        markdownFile.withWriter('UTF-8') { writer ->
            writer.writeLine(
                    '# Blue Coordination release verification')
            writer.writeLine('')
            writer.writeLine(
                    "- Release eligible: `${releaseEligible}`")
            writer.writeLine(
                    "- Tests: `${tests.passed}/${tests.required}` "
                            + "passed; `${tests.failed}` failed; "
                            + "`${tests.skipped}` skipped; "
                            + "`${tests.notExecuted}` not executed")
            writer.writeLine(
                    "- Conformance: `${totalConformance.passed}/"
                            + "${totalConformance.required}`")
            writer.writeLine(
                    "- Flagship: `${flagshipRuns}/"
                            + "${requiredFlagshipRuns}`")
            writer.writeLine(
                    "- Repeated-counter trace: "
                            + "`${traceEntries ?: 'not-executed'}/"
                            + "${requiredTraceEntries}`")
            writer.writeLine(
                    "- Fixed Repository: "
                            + "`${fixedCatalog.verified}/"
                            + "${fixedCatalog.total}`")
            writer.writeLine(
                    '- Test partition: `'
                            + "${partition.observed?.full?.total} = "
                            + "${partition.observed?.working?.total} + "
                            + "${partition.observed?.probes?.total}` "
                            + "(`${partition.status}`)")
            writer.writeLine(
                    "- Public API: `${api.publicApiDigest ?: 'missing'}`")
            writer.writeLine(
                    '- Sibling source locks: '
                            + "`${siblingSourceLocks.status}`")
            writer.writeLine(
                    '- Published dependency alignment: '
                            + "`${publishedAlignment.status}`")
            writer.writeLine(
                    '- Forbidden provider demands: '
                            + "`${flagshipLocality.forbiddenProviderDemandCount}`")
            writer.writeLine('')
            writer.writeLine('## Blocking reasons')
            writer.writeLine('')
            if (report.blockingReasons.isEmpty()) {
                writer.writeLine('- None.')
            } else {
                report.blockingReasons.each {
                    writer.writeLine("- ${it}")
                }
            }
            writer.writeLine('')
            writer.writeLine('## Exact source identities')
            writer.writeLine('')
            coordinates.each { key, value ->
                writer.writeLine(
                        "- `${key}`: `${value.commit}` / "
                                + "`${value.version}` / "
                                + "`${value.sourceState.state}`")
            }
            writer.writeLine('')
            writer.writeLine('## Artifact SHA-256')
            writer.writeLine('')
            artifacts.each { key, value ->
                writer.writeLine(
                        "- `${key}`: `${value ?: 'missing'}`")
            }
            writer.writeLine('')
            writer.writeLine(
                    'This report is written even for a red candidate. '
                            + 'A dependency-evidence failure is never '
                            + 'reported as a passing Coordination result.')
        }
        } catch (Exception reportingFailure) {
            logger.error(
                    'Coordination release report generation failed.',
                    reportingFailure)
            writeReleaseReportingFailure(
                    reportingFailure)
        }
    }
}

def finalCoordinationVerification =
        tasks.register(
                'finalCoordinationVerification') {
    group = 'verification'
    description = 'Runs the clean hard release graph, writes evidence after every gate completes, and rejects every blocker.'
    dependsOn(
            releaseRequiredGateTaskNames.collect {
                tasks.named(it)
            })
    finalizedBy generateCoordinationReleaseFinalReport
}

generateCoordinationReleaseFinalReport.configure {
    doLast {
        if (!gradle.taskGraph.hasTask(
                finalCoordinationVerification.get())) {
            return
        }
        File reportFile =
                finalJsonReport.get().asFile
        if (!reportFile.isFile()) {
            throw new GradleException(
                    'Coordination release report is missing.')
        }
        def report =
                new JsonSlurper()
                        .parse(reportFile)
        if (report.releaseEligible != true
                || !(report.blockingReasons instanceof List)
                || !report.blockingReasons.isEmpty()
                || !(report.requiredReleaseGates instanceof Map)
                || report.requiredReleaseGates.size()
                != releaseRequiredGateTaskNames.size()
                || report.requiredReleaseGates.values().any {
                    it.status != 'passed'
                }
                || report.siblingSourceLocks?.status
                != 'verified'
                || report.publishedDependencyAlignment
                ?.verified != true
                || report.tests?.executed
                != report.tests?.required
                || report.tests?.notExecuted != 0
                || report.conformanceClosure
                ?.manifestComplete != true
                || report.conformanceClosure
                ?.receiptComplete != true
                || report.conformanceClosure
                ?.receiptIdentityMatches != true
                || report.testPartition
                ?.verified != true
                || report.sameRunEvidence
                ?.complete != true
                || report.sameRunEvidence
                ?.metricsMatch != true
                || !(report.evidenceSources
                instanceof Map)
                || report.evidenceSources
                .isEmpty()
                || report.forbiddenProviderDemandCount
                != 0) {
            throw new GradleException(
                    'Coordination release remains blocked; see '
                            + reportFile)
        }
    }
}

/*
 * Every hard gate finalizes the same report task. Gradle schedules that shared
 * finalizer after the hard gates that can run, while still reaching it when
 * one gate fails and normal execution stops without --continue. Attaching the
 * finalizer only to `clean` and constraining it with `mustRunAfter` all gates
 * suppresses it after an early failure because the unexecuted ordering
 * predecessors can never be satisfied. The predicate keeps standalone hard
 * gates from creating a release receipt unless the final graph was requested.
 */
generateCoordinationReleaseFinalReport.configure {
    /*
     * Prefer the report after every hard gate while keeping the ordering
     * soft. A hard mustRunAfter edge suppresses this finalizer when an early
     * failure prevents later gates from executing; no ordering lets the
     * shared finalizer race a still-running Test task and observe incomplete
     * JUnit evidence.
     */
    shouldRunAfter(
            releaseRequiredGateTaskNames.collect {
                tasks.named(it)
            })
    onlyIf {
        gradle.taskGraph.hasTask(
                finalCoordinationVerification.get())
                || gradle.startParameter.taskNames.any { requested ->
            requested
                    == 'generateCoordinationReleaseFinalReport'
                    || requested.endsWith(
                    ':generateCoordinationReleaseFinalReport')
        }
    }
}
releaseRequiredGateTaskNames.each { taskName ->
    tasks.named(taskName).configure {
        finalizedBy(
                generateCoordinationReleaseFinalReport)
    }
}

/*
 * When clean and any other task share a graph, every producer runs after
 * clean.  Depending on clean alone does not order sibling dependencies and
 * can otherwise let a compiler or archive run before the deletion task.
 */
def coordinationReleaseClean =
        tasks.named('clean')
tasks.configureEach { candidate ->
    if (candidate.name != 'clean') {
        candidate.mustRunAfter(
                coordinationReleaseClean)
    }
}

ext.coordinationReleaseRegisterRequiredEvidenceGate = {
    String taskName ->
        if (releaseRequiredGateTaskNames
                .contains(
                        taskName)) {
            return
        }
        def gate =
                tasks.named(
                        taskName)
        releaseRequiredGateTaskNames.add(
                taskName)
        finalCoordinationVerification.configure {
            dependsOn gate
        }
        generateCoordinationReleaseFinalReport.configure {
            shouldRunAfter gate
        }
        gate.configure {
            finalizedBy(
                    generateCoordinationReleaseFinalReport)
        }
}

ext.finalCoordinationVerificationTask =
        finalCoordinationVerification
