def sha256FileRelease = { File source ->
    if (source == null || !source.isFile()) {
        return null
    }
    def digest =
            java.security.MessageDigest
                    .getInstance('SHA-256')
    source.withInputStream { input ->
        byte[] buffer = new byte[8192]
        int read
        while ((read = input.read(buffer)) >= 0) {
            if (read > 0) {
                digest.update(buffer, 0, read)
            }
        }
    }
    digest.digest().collect {
        String.format(
                java.util.Locale.ROOT,
                '%02x',
                it & 0xff)
    }.join()
}

def releaseEvidenceSource = { File source ->
    if (source == null) {
        return [
                path  : null,
                sha256: null,
                files : 0L,
                status: 'missing'
        ]
    }
    if (source.isFile()) {
        return [
                path  : source.absolutePath,
                sha256:
                        sha256FileRelease(
                                source),
                files : 1L,
                status: 'present'
        ]
    }
    if (!source.isDirectory()) {
        return [
                path  : source.absolutePath,
                sha256: null,
                files : 0L,
                status: 'missing'
        ]
    }
    def entries =
            fileTree(source) {
                include 'TEST-*.xml'
            }.files.collect { evidenceFile ->
                [
                        source  : evidenceFile,
                        relative:
                                source.toPath()
                                        .relativize(
                                                evidenceFile.toPath())
                                        .toString()
                                        .replace(
                                                File.separatorChar,
                                                '/' as char)
                ]
            }.sort { left, right ->
                left.relative <=> right.relative
            }
    if (entries.isEmpty()) {
        return [
                path  : source.absolutePath,
                sha256: null,
                files : 0L,
                status: 'missing'
        ]
    }
    def digest =
            java.security.MessageDigest
                    .getInstance('SHA-256')
    entries.each { entry ->
        digest.update(
                entry.relative.getBytes(
                        'UTF-8'))
        digest.update(0 as byte)
        entry.source.withInputStream { input ->
            byte[] buffer = new byte[8192]
            int read
            while ((read = input.read(buffer)) >= 0) {
                if (read > 0) {
                    digest.update(
                            buffer, 0, read)
                }
            }
        }
        digest.update(0 as byte)
    }
    [
            path  : source.absolutePath,
            sha256:
                    digest.digest().collect {
                        String.format(
                                java.util.Locale.ROOT,
                                '%02x',
                                it & 0xff)
                    }.join(),
            files : (long) entries.size(),
            status: 'present'
    ]
}

def readReleaseProperties = { File source ->
    if (source == null || !source.isFile()) {
        return null
    }
    def properties = new Properties()
    source.withInputStream {
        properties.load(it)
    }
    def normalized =
            new TreeMap<String, String>()
    properties.each { key, value ->
        normalized.put(
                key.toString(),
                value.toString())
    }
    normalized
}

def calculatedReleaseConformanceIdentity = {
    File packageDirectory ->
        if (packageDirectory == null
                || !packageDirectory.isDirectory()) {
            return null
        }
        def entries =
                fileTree(packageDirectory)
                        .files.collect { source ->
                    [
                            source  : source,
                            relative:
                                    packageDirectory.toPath()
                                            .relativize(
                                                    source.toPath())
                                            .toString()
                                            .replace(
                                                    java.io.File
                                                            .separatorChar,
                                                    '/' as char)
                    ]
                }.sort { left, right ->
                    left.relative <=> right.relative
                }
        if (entries.isEmpty()) {
            return null
        }
        def digest =
                java.security.MessageDigest
                        .getInstance('SHA-256')
        entries.each { entry ->
            byte[] content = entry.source.bytes
            if (entry.relative == 'manifest.yaml') {
                String normalized =
                        new String(
                                content,
                                'UTF-8')
                                .replaceAll(
                                        '(?m)^packageIdentity:.*$',
                                        'packageIdentity: null')
                content =
                        normalized.getBytes(
                                'UTF-8')
            }
            digest.update(
                    entry.relative.getBytes(
                            'UTF-8'))
            digest.update(0 as byte)
            digest.update(content)
            digest.update(0 as byte)
        }
        'sha256:' + digest.digest().collect {
            String.format(
                    java.util.Locale.ROOT,
                    '%02x',
                    it & 0xff)
        }.join()
}

def releaseTaskOutcome = { String taskName ->
    def task = tasks.named(taskName).get()
    def state = task.state
    String status
    if (state.failure != null) {
        status = 'failed'
    } else if (state.noSource) {
        status = 'no-source'
    } else if (state.upToDate
            || state.skipMessage == 'FROM-CACHE'
            || (state.executed && !state.skipped)) {
        status = 'passed'
    } else if (state.skipped) {
        status = 'skipped'
    } else {
        status = 'not-executed'
    }
    [
            status     : status,
            executed   : state.executed,
            didWork    : state.didWork,
            upToDate   : state.upToDate,
            fromCache  :
                    state.skipMessage
                            == 'FROM-CACHE',
            skipped    : state.skipped,
            skipMessage:
                    state.skipMessage,
            failure    :
                    state.failure == null
                            ? null
                            : state.failure.message
    ]
}

def gitReleaseText = {
    File directory, String... arguments ->
        def command = new ArrayList<String>()
        command.add('git')
        command.addAll(Arrays.asList(arguments))
        Process process = new ProcessBuilder(command)
                .directory(directory)
                .redirectErrorStream(true)
                .start()
        String output =
                process.inputStream
                        .getText('UTF-8')
                        .trim()
        int exitCode = process.waitFor()
        if (exitCode != 0) {
            throw new GradleException(
                    "Git command failed in ${directory}: "
                            + command + '\n' + output)
        }
        output
}

def projectReleaseState = { File directory ->
    String status = gitReleaseText(
            directory,
            'status',
            '--porcelain',
            '--untracked-files=all')
    [
            state  : status.isEmpty() ? 'clean' : 'dirty',
            entries:
                    status.isEmpty()
                            ? 0L
                            : (long) status.readLines().size()
    ]
}

def readCzReleaseVersion = { File directory ->
    File source = new File(directory, '.cz.toml')
    if (!source.isFile()) {
        return null
    }
    def match = source.readLines('UTF-8').find {
        it ==~ /\s*version\s*=\s*"[^"]+"\s*/
    }
    if (match == null) {
        return null
    }
    def matcher =
            java.util.regex.Pattern
                    .compile(/"([^"]+)"/)
                    .matcher(match)
    matcher.find() ? matcher.group(1) : null
}

def yamlReleaseScalar = { File source, String key ->
    if (source == null || !source.isFile()) {
        return null
    }
    String prefix = key + ':'
    def matches = source.readLines('UTF-8').findAll {
        it.startsWith(prefix)
    }
    if (matches.size() != 1) {
        return null
    }
    String value =
            matches[0]
                    .substring(prefix.length())
                    .trim()
    value.isEmpty() ? null : value
}

def javaReleaseStringConstant = {
    File source, String constantName ->
        if (source == null || !source.isFile()) {
            return null
        }
        def matcher =
                java.util.regex.Pattern.compile(
                        '(?s)\\b(?:public\\s+)?static\\s+final\\s+String\\s+'
                                + java.util.regex.Pattern.quote(
                                constantName)
                                + '\\s*=\\s*"([^"]+)"\\s*;')
                        .matcher(
                                source.getText('UTF-8'))
        def values = new ArrayList<String>()
        while (matcher.find()) {
            values.add(
                    matcher.group(1))
        }
        values.size() == 1
                ? values[0]
                : null
}

def yamlProjectionVersionRelease = {
    File source, String projectionId ->
        if (source == null || !source.isFile()) {
            return null
        }
        boolean selected = false
        for (String line : source.readLines('UTF-8')) {
            String trimmed = line.trim()
            if (trimmed.startsWith('- id:')) {
                selected =
                        trimmed.substring(
                                '- id:'.length())
                                .trim()
                                == projectionId
                continue
            }
            if (selected
                    && trimmed.startsWith('version:')) {
                String value =
                        trimmed.substring(
                                'version:'.length())
                                .trim()
                return value.isEmpty()
                        ? null
                        : value
            }
        }
        null
}

def classifyReleaseFailure = {
    String className,
    String testName,
    String failureType,
    String message ->
    String logicalMessage =
            message == null
                    ? ''
                    : message
    if (failureType != null
            && !failureType.isEmpty()) {
        String wrapper =
                failureType + ': '
        if (logicalMessage.startsWith(
                wrapper)) {
            logicalMessage =
                    logicalMessage.substring(
                            wrapper.length())
        }
    }
    String normalizedTestName =
            testName != null
                    && testName.endsWith('()')
                    ? testName.substring(
                    0, testName.length() - 2)
                    : testName
    def dynamicTestName =
            normalizedTestName == null
                    ? null
                    : (normalizedTestName =~
                    /^[0-9]+: (.+)$/)
    if (dynamicTestName != null
            && dynamicTestName.matches()
            && className
            == 'blue.coordination.processor.CoordinationBehaviorFixtureHarnessTest') {
        normalizedTestName =
                dynamicTestName.group(1)
    }
    String testId =
            className + '#' + normalizedTestName
    def exactExternalProbe =
            releaseExternalProbes.find {
                it.test == testId
                        && logicalMessage.startsWith(
                        it.fingerprintPrefix)
            }
    if (exactExternalProbe != null) {
        return 'dependency-evidence-before-coordination'
    }
    'coordination-behavior-or-evidence'
}

def readReleaseJUnit = { File directory ->
    def records = new ArrayList<Map<String, Object>>()
    long required = 0L
    def malformedSuites =
            new ArrayList<String>()
    def resultFiles = fileTree(directory) {
        include 'TEST-*.xml'
    }.files.sort { left, right ->
        left.name <=> right.name
    }
    resultFiles.each { resultFile ->
        def suite =
                new XmlSlurper(
                        false, false)
                        .parse(resultFile)
        String declaredTests =
                suite.@tests.toString()
        if (!(declaredTests ==~ /[0-9]+/)) {
            malformedSuites.add(
                    resultFile.name
                            + ':missing-tests-count')
        } else {
            required +=
                    Long.parseLong(
                            declaredTests)
        }
        suite.testcase.each { testCase ->
            def failure =
                    testCase.failure.size() > 0
                            ? testCase.failure[0]
                            : (testCase.error.size() > 0
                            ? testCase.error[0]
                            : null)
            String status =
                    failure != null
                            ? 'failed'
                            : (testCase.skipped.size() > 0
                            ? 'skipped'
                            : 'passed')
            String message =
                    failure == null
                            ? null
                            : failure.@message.toString()
            String failureType =
                    failure == null
                            ? null
                            : failure.@type.toString()
            String logicalMessage =
                    message
            if (logicalMessage != null
                    && failureType != null
                    && !failureType.isEmpty()) {
                String wrapper =
                        failureType + ': '
                if (logicalMessage.startsWith(
                        wrapper)) {
                    logicalMessage =
                            logicalMessage.substring(
                                    wrapper.length())
                }
            }
            records.add([
                    id       :
                            testCase.@classname.toString()
                                    + '#'
                                    + testCase.@name.toString(),
                    className:
                            testCase.@classname.toString(),
                    name     :
                            testCase.@name.toString(),
                    status   : status,
                    category :
                            status == 'failed'
                                    ? classifyReleaseFailure(
                                    testCase.@classname
                                            .toString(),
                                    testCase.@name
                                            .toString(),
                                    failureType,
                                    message)
                                    : status,
                    failureType:
                            failureType,
                    message  : message,
                    logicalMessage:
                            logicalMessage
            ])
        }
    }
    records.sort { left, right ->
        left.id <=> right.id
    }
    long failed = records.count {
        it.status == 'failed'
    }
    long skipped = records.count {
        it.status == 'skipped'
    }
    long executed =
            (long) records.size()
    long notExecuted =
            Math.max(
                    0L,
                    required - executed)
    if (executed > required) {
        malformedSuites.add(
                'executed-testcases-exceed-declared-tests')
    }
    [
            total       : required,
            required    : required,
            executed    : executed,
            passed      : executed
                    - failed - skipped,
            failed      : failed,
            skipped     : skipped,
            notExecuted : notExecuted,
            resultFiles : (long) resultFiles.size(),
            malformed   : malformedSuites,
            records     : records
    ]
}

def classConformanceResult = {
    Map<String, Object> evidence,
    String className,
    Long required,
    String exactNamePattern ->
        def pattern =
                java.util.regex.Pattern.compile(
                        exactNamePattern)
        def records = evidence.records.findAll {
            it.className == className
                    && pattern.matcher(
                    it.name)
                    .matches()
        }
        long passed = records.count {
            it.status == 'passed'
        }
        long failed = records.count {
            it.status == 'failed'
        }
        long skipped = records.count {
            it.status == 'skipped'
        }
        [
                required   : required,
                executed   : (long) records.size(),
                passed     : passed,
                failed     : failed,
                skipped    : skipped,
                notExecuted:
                        Math.max(
                                0L,
                                required
                                        - (long) records.size())
        ]
}

def readReleaseFlagshipLocality = { File source ->
    def empty = [
            status                         : 'missing',
            matrixRows                     : 0L,
            forbiddenProviderDemandCount   : null,
            forbiddenBackendLoadCount      : null,
            totals                         : [:],
            variants                       : [:],
            identitySets                   : [:],
            invalidReasons                 :
                    ['flagship evidence is missing']
    ]
    if (source == null || !source.isFile()) {
        return empty
    }
    try {
        def exactEvidence =
                project.ext
                        .coordinationReleaseReadExactFlagshipEvidence
                        .call(source)
        List<String> lines =
                source.readLines('UTF-8')
        def expectedVariants = [
                'descendants-only',
                'Root D1,D2'
        ]
        def identitySets =
                exactEvidence.identitySets

        def metricNames = [
                'requested',
                'backendLoaded',
                'backendTrips',
                'requestedBytes',
                'backendLoadedBytes',
                'selectedBodies',
                'selectedBytes',
                'gas'
        ]
        def zeroMetrics = {
            def values =
                    new LinkedHashMap<String, Long>()
            metricNames.each {
                values.put(it, 0L)
            }
            values
        }
        def totals = zeroMetrics()
        def variants =
                new LinkedHashMap<String, Object>()
        expectedVariants.each {
            variants.put(
                    it,
                    zeroMetrics())
        }
        def rowPattern =
                java.util.regex.Pattern.compile(
                        '^\\| (descendants-only|Root D1,D2) '
                                + '\\| (INLINE|REFERENCES|PARTIAL|SPLITTER) '
                                + '\\| (COLD|WARM) '
                                + '\\| (ONE_FRAGMENT|BOUNDED_BATCH) '
                                + '\\| SUCCESS '
                                + '\\| ([0-9]+) \\| ([0-9]+) \\| ([0-9]+) '
                                + '\\| ([0-9]+) \\| ([0-9]+) \\| ([0-9]+) '
                                + '\\| ([0-9]+) \\| ([0-9]+) \\|$')
        long matrixRows = 0L
        lines.each { line ->
            def matcher =
                    rowPattern.matcher(
                            line)
            if (matcher.matches()) {
                matrixRows++
                def variantMetrics =
                        variants.get(
                                matcher.group(1))
                for (int index = 0;
                     index < metricNames.size();
                     index++) {
                    String name =
                            metricNames[index]
                    long value =
                            Long.parseLong(
                                    matcher.group(
                                            index + 5))
                    totals.put(
                            name,
                            totals.get(name)
                                    + value)
                    variantMetrics.put(
                            name,
                            variantMetrics.get(name)
                                    + value)
                }
            }
        }

        def invalidReasons =
                new ArrayList<String>()
        if (matrixRows != 32L) {
            invalidReasons.add(
                    "expected 32 matrix rows, found ${matrixRows}")
        }
        def localityBytes =
                exactEvidence.localityBytes
        if (!(localityBytes instanceof Map)
                || !(localityBytes
                .storedFragmentBytes instanceof Map)
                || !(localityBytes
                .forbiddenDecoyFragmentBytes instanceof Map)
                || !(localityBytes
                .selectedBodyBytes instanceof Map)) {
            invalidReasons.add(
                    'strict parser returned no locality-byte totals')
        } else {
            expectedVariants.each { expectedVariant ->
                def variantMetrics =
                        variants.get(
                                expectedVariant)
                variantMetrics.put(
                        'storedFragmentBytes',
                        localityBytes
                                .storedFragmentBytes
                                .get(
                                expectedVariant))
                variantMetrics.put(
                        'forbiddenDecoyFragmentBytes',
                        localityBytes
                                .forbiddenDecoyFragmentBytes
                                .get(
                                expectedVariant))
                variantMetrics.put(
                        'selectedBodyBytesPerRun',
                        localityBytes
                                .selectedBodyBytes
                                .get(
                                expectedVariant))
            }
        }

        long forbiddenProviderDemandCount = 0L
        long forbiddenBackendLoadCount = 0L
        expectedVariants.each { expectedVariant ->
            String prefix =
                    expectedVariant + '/'
            def selected =
                    identitySets.get(
                            prefix
                                    + 'Selected body BlueIds')
            def requested =
                    identitySets.get(
                            prefix
                                    + 'Provider requested BlueIds')
            def backendLoaded =
                    identitySets.get(
                            prefix
                                    + 'Provider backend-loaded BlueIds')
            def forbidden =
                    identitySets.get(
                            prefix
                                    + 'Forbidden BlueIds')
            if (!(selected instanceof List)
                    || !(requested instanceof List)
                    || !(backendLoaded instanceof List)
                    || !(forbidden instanceof List)) {
                invalidReasons.add(
                        'missing identity-set inventory for '
                                + expectedVariant)
            } else {
                def forbiddenSet =
                        new LinkedHashSet<String>(
                                forbidden)
                def demandedForbidden =
                        new LinkedHashSet<String>(
                                requested)
                demandedForbidden.retainAll(
                        forbiddenSet)
                forbiddenProviderDemandCount +=
                        demandedForbidden.size()
                def loadedForbidden =
                        new LinkedHashSet<String>(
                                backendLoaded)
                loadedForbidden.retainAll(
                        forbiddenSet)
                forbiddenBackendLoadCount +=
                        loadedForbidden.size()
            }
        }
        [
                status:
                        invalidReasons.isEmpty()
                                ? 'verified'
                                : 'invalid',
                matrixRows:
                        matrixRows,
                forbiddenProviderDemandCount:
                        forbiddenProviderDemandCount,
                forbiddenBackendLoadCount:
                        forbiddenBackendLoadCount,
                totals:
                        totals,
                variants:
                        variants,
                identitySets:
                        identitySets,
                invalidReasons:
                        invalidReasons
        ]
    } catch (Exception invalidEvidence) {
        [
                status:
                        'invalid',
                matrixRows:
                        0L,
                forbiddenProviderDemandCount:
                        null,
                forbiddenBackendLoadCount:
                        null,
                totals:
                        [:],
                variants:
                        [:],
                identitySets:
                        [:],
                invalidReasons:
                        [
                                invalidEvidence.message
                                        ?: invalidEvidence
                                        .class.name
                        ]
        ]
    }
}

