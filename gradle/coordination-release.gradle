        != releaseFingerprintPrefixes.size()) {
    throw new GradleException(
            'Every external-blocker family must declare one unique, '
                    + 'non-empty fingerprintPrefix ending in a colon.')
}
def releaseExternalProbes =
        releaseExternalBlockers.collectMany {
            blocker ->
                blocker.probes.collect {
                    probe ->
                        [
                                blockerId:
                                        blocker.id,
                                owner    :
                                        blocker.owner,
                                test     :
                                        probe.test,
                                fingerprintPrefix:
                                        blocker.fingerprintPrefix
                        ]
                }
        }
if (releaseExternalProbes.size() != 57
        || releaseExternalProbes.collect {
            it.test
        }.toSet().size() != 57
        || releaseExternalBlockers.any { blocker ->
            !(blocker.probes instanceof List)
                    || blocker.probes.isEmpty()
                    || blocker.probes.any { probe ->
                !(probe instanceof Map)
                        || probe.keySet()
                        != (['test'] as Set)
                        || !(probe.test instanceof String)
                        || probe.test.trim().isEmpty()
            }
        }) {
    throw new GradleException(
            'The external-blocker catalog must contain exactly 57 '
                    + 'unique, test-only probe declarations.')
}
