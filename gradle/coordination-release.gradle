/*
 * Always-truthful release evidence.
 *
 * The ordinary test and verification tasks remain hard failures.  This
 * capture lane is deliberately separate: it executes the same test classes
 * with ignoreFailures enabled only so a red candidate can still leave an
 * exact machine-readable receipt.  finalCoordinationVerification reads that
 * receipt and fails whenever releaseEligible is false.
 */

