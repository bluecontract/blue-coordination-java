def generateCoordinationBaselineReport =
        tasks.register(
                'generateCoordinationBaselineReport') {
    group = 'verification'
    description = 'Restores the immutable pre-edit Coordination baseline after clean.'
    inputs.file(baselineSource)
    outputs.file(baselineReport)
    outputs.upToDateWhen { false }
    doLast {
        if (!baselineSource.isFile()) {
            throw new GradleException(
                    "Coordination baseline source is missing: "
                            + baselineSource)
        }
        def parsed =
                new JsonSlurper()
                        .parse(baselineSource)
        if (!(parsed instanceof Map)
                || parsed.schema
                != 'blue.coordination/release-baseline/1.0'
                || parsed.fullTest?.total != 781
                || parsed.fullTest?.passed != 542
                || parsed.fullTest
                        ?.failedBecauseOfCoordinationBehavior
                        != 123
                || parsed.fullTest
                        ?.failedBeforeCoordinationBehaviorBecauseOfDependencyEvidence
                        != 116) {
            throw new GradleException(
                    "Coordination baseline source is not the "
                            + "captured pre-edit result")
        }
        File target =
                baselineReport.get().asFile
        target.parentFile.mkdirs()
        target.bytes = baselineSource.bytes
    }
}

def writeReleaseReportingFailure = {
    Exception reportingFailure ->
        def releaseGates =
                new LinkedHashMap<String, Object>()
        releaseRequiredGateTaskNames.each { taskName ->
            try {
                releaseGates.put(
                        taskName,
                        releaseTaskOutcome(
                                taskName))
            } catch (Exception unavailableState) {
                releaseGates.put(
                        taskName,
                        [
                                status     : 'not-executed',
                                executed   : false,
                                didWork    : false,
                                upToDate   : false,
                                fromCache  : false,
                                skipped    : false,
                                skipMessage: null,
                                failure    :
                                        unavailableState.message
                                                ?: unavailableState
                                                .class.name
                        ])
            }
        }
        String failureMessage =
                reportingFailure.message
                        ?: reportingFailure.class.name
        def report = [
                schema:
                        'blue.coordination/release-result/1.0',
                status:
                        'blocked',
                requiredReleaseGates:
                        releaseGates,
                releaseEligible:
                        false,
                blockingReasons:
                        [
                                'Release-report generation failed: '
                                        + reportingFailure.class.name
                                        + ': '
                                        + failureMessage
                        ],
                reportingFailure:
                        [
                                type   :
                                        reportingFailure.class.name,
                                message:
                                        failureMessage
                        ]
        ]
        File jsonFile =
                finalJsonReport.get().asFile
        jsonFile.parentFile.mkdirs()
        jsonFile.setText(
                JsonOutput.prettyPrint(
                        JsonOutput.toJson(report))
                        + '\n',
                'UTF-8')
        File markdownFile =
                finalMarkdownReport.get().asFile
        markdownFile.parentFile.mkdirs()
        markdownFile.withWriter('UTF-8') { writer ->
            writer.writeLine(
                    '# Blue Coordination release verification')
            writer.writeLine('')
            writer.writeLine('- Release eligible: `false`')
            writer.writeLine('')
            writer.writeLine('## Blocking reasons')
            writer.writeLine('')
            writer.writeLine(
                    '- Release-report generation failed: `'
                            + reportingFailure.class.name
                            + '`: '
                            + failureMessage)
            writer.writeLine('')
            writer.writeLine(
                    'This fail-closed receipt replaced any previous '
                            + 'report from an earlier invocation.')
        }
}

def generateCoordinationReleaseFinalReport =
        tasks.register(
                'generateCoordinationReleaseFinalReport') {
    group = 'verification'
    description = 'Always writes exact release JSON/Markdown, including all blockers for red candidates.'
    /*
     * Deliberately has no task dependencies. It is the finalizer that records
     * missing, failed, skipped, and not-executed hard gates; depending on any
     * hard gate here would suppress the report when that dependency fails.
     */
    outputs.files(
            finalJsonReport,
            finalMarkdownReport)
    outputs.upToDateWhen { false }
    doFirst {
        delete(
                finalJsonReport.get().asFile,
                finalMarkdownReport.get().asFile)
    }
    doLast {
        try {
        def blockers =
                new ArrayList<String>()
        File partitionFile =
                releasePartitionEvidence
                        .get().asFile
        File sameRunFile =
                releaseSameRunEvidence
                        .get().asFile
        def partition = [
                status  : 'missing',
                observed: [:]
        ]
        String partitionParseError = null
        if (partitionFile.isFile()) {
            try {
                partition =
                        new JsonSlurper()
                                .parse(
                                        partitionFile)
            } catch (Exception invalidPartition) {
                partitionParseError =
                        invalidPartition.message
                                ?: invalidPartition
                                .class.name
            }
        }
        boolean partitionVerified =
                partitionParseError == null
                        && partition.status
                        == 'verified'
                        && partition
                        .multisetUnionMatches == true
                        && partition
                        .observed?.full?.total == 899
                        && partition
                        .observed?.full?.unique == 899
                        && partition
                        .observed?.working?.total == 842
                        && partition
                        .observed?.working?.unique == 842
                        && partition
                        .observed?.probes?.total == 57
                        && partition
                        .observed?.probes?.unique == 57
                        && partition.overlap
                        instanceof Map
                        && partition.overlap.isEmpty()
                        && partition.missing
                        instanceof Map
                        && partition.missing.isEmpty()
                        && partition.extra
                        instanceof Map
                        && partition.extra.isEmpty()
                        && partition.catalogMissing
                        instanceof Map
                        && partition.catalogMissing
                        .isEmpty()
                        && partition.catalogExtra
                        instanceof Map
                        && partition.catalogExtra
                        .isEmpty()
        if (!partitionVerified) {
            blockers.add(
                    'The same-run full-suite partition is not the exact '
                            + '899 = 842 + 57 disjoint multiset union'
                            + (partitionParseError == null
                            ? '.'
                            : ': ' + partitionParseError + '.'))
        }
        def sameRun = [
                status       : 'missing',
                conformance  : [:],
                flagship     : [:],
                runtimeTrace : [:],
                fixedRepository:
                        [:],
                providerLocality:
                        [:],
                evidenceSources:
                        [:]
        ]
        String sameRunParseError = null
        if (sameRunFile.isFile()) {
            try {
                sameRun =
                        new JsonSlurper()
                                .parse(
                                        sameRunFile)
            } catch (Exception invalidSameRun) {
                sameRunParseError =
                        invalidSameRun.message
                                ?: invalidSameRun
                                .class.name
            }
        }
        boolean sameRunEvidenceComplete =
                sameRunParseError == null
                        && sameRun.status
                        == 'complete'
                        && sameRun.evidenceSources
                        instanceof Map
                        && !sameRun.evidenceSources
                        .isEmpty()
                        && sameRun.evidenceSources
                        .values().every {
                    it.status == 'present'
                            && it.path
                            instanceof String
                            && it.sha256
                            instanceof String
                            && it.sha256
                            ==~ /[0-9a-f]{64}/
                }
        if (!sameRunEvidenceComplete) {
            blockers.add(
                    'The same-run machine-readable evidence bundle is '
                            + 'missing, invalid, or incomplete'
                            + (sameRunParseError == null
                            ? '.'
                            : ': ' + sameRunParseError + '.'))
        }
        def releaseGates =
                new LinkedHashMap<String, Object>()
        releaseRequiredGateTaskNames.each { taskName ->
            def outcome =
                    releaseTaskOutcome(
                            taskName)
            releaseGates.put(
                    taskName,
                    outcome)
            if (outcome.status != 'passed') {
                blockers.add(
                        "Required release gate ${taskName} is "
                                + "${outcome.status}.")
            }
        }

        def focusedSuites =
                new LinkedHashMap<String, Object>()
        releaseFocusedTaskNames.each { taskName ->
            Map<String, Object> suite =
                    readReleaseJUnit(
                            layout.buildDirectory.dir(
                                    "test-results/${taskName}")
                                    .get().asFile)
            focusedSuites.put(
                    taskName,
                    [
                            required   :
                                    suite.required,
                            executed   :
                                    suite.executed,
                            passed     :
                                    suite.passed,
                            failed     :
                                    suite.failed,
                            skipped    :
                                    suite.skipped,
                            notExecuted:
                                    suite.notExecuted,
                            resultFiles:
                                    suite.resultFiles,
                            malformed  :
                                    suite.malformed
                    ])
            if (suite.required <= 0L
                    || suite.executed
                    != suite.required
                    || suite.failed != 0L
                    || suite.skipped != 0L
                    || suite.notExecuted != 0L
                    || !suite.malformed.isEmpty()) {
                blockers.add(
                        "Focused suite ${taskName} is missing, "
                                + 'incomplete, malformed, or red.')
            }
        }

        Map<String, Object> releaseEvidenceTests =
                readReleaseJUnit(
                        releaseTestResults
                                .get().asFile)
        Map<String, Object> hardTests =
                readReleaseJUnit(
                        releaseHardTestResults
                                .get().asFile)
        boolean usingHardTestFallback =
                releaseEvidenceTests.required <= 0L
                        && hardTests.required > 0L
        Map<String, Object> tests =
                usingHardTestFallback
                        ? hardTests
                        : releaseEvidenceTests
        if (tests.required <= 0L
                || tests.executed
                != tests.required
                || tests.notExecuted != 0L
                || !tests.malformed.isEmpty()) {
            blockers.add(
                    'The same-run release test XML is missing, '
                            + 'malformed, or incomplete.')
        }
        if (tests.failed != 0L
                || tests.skipped != 0L) {
            blockers.add(
                    "Same-run tests are not green: "
                            + "${tests.failed} failed, "
                            + "${tests.skipped} skipped.")
        }
        boolean fullSuiteInventoryMatches =
                releaseEvidenceTests.required > 0L
                        && hardTests.required > 0L
                        && hardTests.executed
                        == hardTests.required
                        && hardTests.notExecuted == 0L
                        && hardTests.malformed.isEmpty()
                        && hardTests.records.collect {
                    it.id
                } == releaseEvidenceTests.records.collect {
                    it.id
                }
        if (!fullSuiteInventoryMatches) {
            blockers.add(
                    'The hard full-suite and release-evidence JUnit '
                            + 'inventories do not match exactly.')
        }

        Long requiredBehaviorEvidence =
                sameRun.conformance
                        ?.behavior?.required
                instanceof Number
                        ? sameRun.conformance
                        .behavior.required
                        .longValue()
                        : null
        Long requiredPortableGasEvidence =
                sameRun.conformance
                        ?.portableGas?.required
                instanceof Number
                        ? sameRun.conformance
                        .portableGas.required
                        .longValue()
                        : null
        Long requiredHostQuotaEvidence =
                sameRun.conformance
                        ?.hostQuota?.required
                instanceof Number
                        ? sameRun.conformance
                        .hostQuota.required
                        .longValue()
                        : null
        Long requiredTotalEvidence =
                sameRun.conformance
                        ?.total?.required
                instanceof Number
                        ? sameRun.conformance
                        .total.required
                        .longValue()
                        : null
        long requiredBehavior =
                requiredBehaviorEvidence == null
                        ? -1L
                        : requiredBehaviorEvidence
        long requiredPortableGas =
                requiredPortableGasEvidence == null
                        ? -1L
                        : requiredPortableGasEvidence
        long requiredHostQuota =
                requiredHostQuotaEvidence == null
                        ? -1L
                        : requiredHostQuotaEvidence
        long requiredTotal =
                requiredTotalEvidence == null
                        ? -1L
                        : requiredTotalEvidence
        def behavior = classConformanceResult(
                tests,
                'blue.coordination.processor.'
                        + 'CoordinationBehaviorFixtureHarnessTest',
                requiredBehavior,
                '^[0-9]+: coord-(?:chan|e2e|fail|mand|route|split|time|wf)-[0-9]+@[a-z0-9-]+$')
        def portableGas = classConformanceResult(
                tests,
                'blue.language.processor.'
                        + 'CoordinationDirectPortableGasMicrofixtureTest',
                requiredPortableGas,
                '^shouldExecuteDirectPortableGasMicrofixture'
                        + '\\[[0-9]+\\] coordination/conformance/fixtures/'
                        + 'gas-micro/[A-Za-z0-9]+\\.yaml$')
        def hostQuota = classConformanceResult(
                tests,
                'blue.coordination.processor.'
                        + 'CoordinationHostQuotaFixtureTest',
                requiredHostQuota,
                '^coordination-host-[a-z0-9-]+ '
                        + '\\[[a-z0-9-]+\\.yaml\\]$')
        def totalConformance = [
                required   : requiredTotal,
                executed   :
                        behavior.executed
                                + portableGas.executed
                                + hostQuota.executed,
                passed     :
                        behavior.passed
                                + portableGas.passed
                                + hostQuota.passed,
                failed     :
                        behavior.failed
                                + portableGas.failed
                                + hostQuota.failed,
                skipped    :
                        behavior.skipped
                                + portableGas.skipped
                                + hostQuota.skipped,
                notExecuted:
                        behavior.notExecuted
                                + portableGas.notExecuted
                                + hostQuota.notExecuted
        ]
        if (requiredBehavior < 0L
                || requiredPortableGas < 0L
                || requiredHostQuota < 0L
                || requiredTotal < 0L
                || requiredBehavior
                + requiredPortableGas
                + requiredHostQuota
                != requiredTotal
                || behavior.executed
                != requiredBehavior
                || behavior.passed
                != requiredBehavior
                || portableGas.executed
                != requiredPortableGas
                || portableGas.passed
                != requiredPortableGas
                || hostQuota.executed
                != requiredHostQuota
                || hostQuota.passed
                != requiredHostQuota
                || totalConformance.executed
                != requiredTotal
                || totalConformance.passed
                != requiredTotal
                || totalConformance.failed != 0L
                || totalConformance.skipped != 0L) {
            blockers.add(
                    'Closed executable conformance is not '
                            + "${requiredBehavior}/${requiredBehavior} "
                            + 'behavior, '
                            + "${requiredPortableGas}/"
                            + "${requiredPortableGas} portable gas, "
                            + "${requiredHostQuota}/"
                            + "${requiredHostQuota} host quota, and "
                            + "${requiredTotal}/${requiredTotal} total.")
        }

        def flagshipRecords =
                tests.records.findAll {
                    it.className
                            == ('blue.coordination.processor.'
                            + 'CoordinationComplexEmbeddedDeterminismFlagshipTest')
                }
        boolean flagshipTestsGreen =
                !flagshipRecords.isEmpty()
                        && flagshipRecords.every {
                    it.status == 'passed'
                }
        Long requiredFlagshipEvidence =
                sameRun.flagship
                        ?.requiredVariants
                instanceof Number
                        ? sameRun.flagship
                        .requiredVariants
                        .longValue()
                        : null
        long requiredFlagshipRuns =
                requiredFlagshipEvidence == null
                        ? -1L
                        : requiredFlagshipEvidence
        long flagshipRuns = 0L
        File flagshipFile =
                releaseFlagshipEvidence
                        .get().asFile
        def flagshipLocality =
                readReleaseFlagshipLocality(
                        flagshipFile)
        if (flagshipTestsGreen
                && flagshipLocality.status
                == 'verified'
                && flagshipLocality.matrixRows
                == requiredFlagshipRuns) {
            flagshipRuns =
                    flagshipLocality.matrixRows
        }
        if (requiredFlagshipRuns < 0L
                || flagshipRuns
                != requiredFlagshipRuns) {
            blockers.add(
                    'The exact flagship representation/provider '
                            + "matrix is ${flagshipRuns}/"
                            + "${requiredFlagshipRuns}.")
        }
        if (flagshipLocality
                .forbiddenProviderDemandCount != 0L
                || flagshipLocality
                .forbiddenBackendLoadCount != 0L) {
            blockers.add(
                    'Flagship provider locality is not exact: '
                            + flagshipLocality.invalidReasons
                            + ', forbidden demands='
                            + flagshipLocality
                            .forbiddenProviderDemandCount
                            + ', forbidden backend loads='
                            + flagshipLocality
                            .forbiddenBackendLoadCount
                            + '.')
        }

        Long traceEntries = null
        fileTree(
                releaseTestResults
                        .get().asFile) {
            include 'TEST-*.xml'
        }.files.each { resultFile ->
            def suite =
                    new XmlSlurper(
                            false, false)
                            .parse(resultFile)
            if (suite.@name.toString()
                    == ('blue.coordination.processor.'
                    + 'CoordinationRuntimeGasScalingTest')) {
                suite.'system-out'.text()
                        .readLines()
                        .findAll {
                            it.startsWith(
                                    'coordination.maximumRuntimeTraceEntriesObserved=')
                        }.each { line ->
                            traceEntries =
                                    Long.valueOf(
                                            line.substring(
                                                    line.indexOf('=') + 1))
                        }
            }
        }
        Long requiredTraceEvidence =
                sameRun.runtimeTrace
                        ?.requiredEntries
                instanceof Number
                        ? sameRun.runtimeTrace
                        .requiredEntries
                        .longValue()
                        : null
        long requiredTraceEntries =
                requiredTraceEvidence == null
                        ? -1L
                        : requiredTraceEvidence
        boolean traceGreen =
                traceEntries != null
                        && requiredTraceEntries >= 0L
                        && traceEntries.longValue()
                        == requiredTraceEntries
        if (!traceGreen) {
            blockers.add(
                    'The same-run repeated-counter trace did not '
                            + 'prove exactly '
                            + requiredTraceEntries
                            + ' retained entries.')
        }

        def projectionAlgorithmIdentities =
                new TreeSet<String>()
        def coordinationRuntimeRegistryIdentities =
                new TreeSet<String>()
        fileTree(
                releaseTestResults
                        .get().asFile) {
            include 'TEST-*.xml'
        }.files.each { resultFile ->
            def suite =
                    new XmlSlurper(
                            false, false)
                            .parse(resultFile)
            suite.'system-out'.text()
                    .readLines()
                    .each { line ->
                if (line.startsWith(
                        'coordination.subscriptionProjectionAlgorithmIdentity=')) {
                    projectionAlgorithmIdentities.add(
                            line.substring(
                                    line.indexOf('=') + 1))
                }
                if (line.startsWith(
                        'coordination.runtimeRegistryIdentity=')) {
                    coordinationRuntimeRegistryIdentities.add(
                            line.substring(
                                    line.indexOf('=') + 1))
                }
            }
        }
        String projectionAlgorithmIdentity =
                projectionAlgorithmIdentities.size() == 1
                        ? projectionAlgorithmIdentities.first()
                        : null
        String coordinationRuntimeRegistryIdentity =
                coordinationRuntimeRegistryIdentities.size() == 1
                        ? coordinationRuntimeRegistryIdentities.first()
                        : null
        if (projectionAlgorithmIdentity == null
                || coordinationRuntimeRegistryIdentity == null) {
            blockers.add(
                    'Same-run subscription projection/runtime '
                            + 'identities are missing or inconsistent.')
        }

        File repositoryManifest =
                new File(
                        releaseBlueRepositoryComposite,
                        'src/main/resources/blue/repo/manifest.json')
        File conformanceManifestForRepository =
                file('src/test/resources/coordination/conformance/'
                        + 'manifest.yaml')
        def repositoryManifestValue =
                repositoryManifest.isFile()
                        ? new JsonSlurper()
                        .parse(repositoryManifest)
                        : [:]
        String expectedRepositoryBlueId =
                yamlReleaseScalar(
                        conformanceManifestForRepository,
                        'fixedRepositoryVersionBlueId')
        String expectedRepositoryVersion =
                yamlReleaseScalar(
                        conformanceManifestForRepository,
                        'fixedRepositoryVersion')
        boolean repositoryManifestCompatible =
                repositoryManifestValue.repositoryVersion
                        == expectedRepositoryVersion
                        && repositoryManifestValue
                        .repositoryVersionBlueId
                        == expectedRepositoryBlueId
        if (!repositoryManifestCompatible) {
            blockers.add(
                    'The observed fixed Repository manifest identity '
                            + repositoryManifestValue
                            .repositoryVersionBlueId
                            + ' does not equal the conformance-bound '
                            + expectedRepositoryBlueId + '.')
        }

        File fixedCatalogReport =
                releaseFixedRepositoryEvidence
                        .get().asFile
        def fixedCatalog =
                fixedCatalogReport.isFile()
                        ? new JsonSlurper()
                        .parse(fixedCatalogReport)
                        : [
                        status         : 'not-executed',
                        providerMode   : null,
                        total          : 0L,
                        verified       : 0L,
                        failed         : 0L,
                        cyclicSetCount: 0L
                ]

        def dependencyDirectories = [
                coordination: projectDir,
                language    :
                        file('../blue-language-java'),
                bex         :
                        file('../blue-bex-java'),
                repository  :
                        releaseBlueRepositoryComposite
        ]
        def sourceStates =
                new LinkedHashMap<String, Object>()
        dependencyDirectories.each { key, directory ->
            sourceStates.put(
                    key,
                    projectReleaseState(directory))
        }
        sourceStates.each { key, value ->
            if (value.state != 'clean') {
                blockers.add(
                        "${key} source state is ${value.state} "
                                + "(${value.entries} paths).")
            }
        }

        File binaryReport =
                file("$buildDir/reports/binary-compatibility/"
                        + 'blue-coordination-java.txt')
        def binaryReportLines =
                binaryReport.isFile()
                        ? binaryReport.readLines('UTF-8')
                        : []
        def binaryCompatibilityBreaks =
                binaryReportLines.findAll {
                    it.startsWith(
                            'documentedPreFinalRemoval=')
                            || it.startsWith(
                            'problem=')
                }
        String binaryCompatibility =
                binaryReport.isFile()
                        && binaryReportLines
                        .contains('compatible=true')
                        && binaryCompatibilityBreaks
                        .isEmpty()
                        ? 'passed'
                        : (binaryReport.isFile()
                        ? 'failed'
                        : 'not-executed')
        if (binaryCompatibility != 'passed') {
            blockers.add(
                    'Binary compatibility did not pass in the '
                            + 'same release graph.')
        }

        File bytecodeReport =
                file("$buildDir/reports/bytecode/"
                        + 'java8-bytecode.txt')
        String javaBytecode =
                bytecodeReport.isFile()
                        && bytecodeReport.readLines('UTF-8')
                        .contains('compatible=true')
                        ? 'java-8'
                        : (bytecodeReport.isFile()
                        ? 'incompatible'
                        : 'not-executed')
        if (javaBytecode != 'java-8') {
            blockers.add(
                    'Java 8 bytecode verification did not pass '
                            + 'in the same release graph.')
        }

        File reproducibilityReport =
                file("$buildDir/reports/reproducibility/"
                        + 'archives.txt')
        boolean reproducible =
                reproducibilityReport.isFile()
                        && reproducibilityReport
                        .readLines('UTF-8')
                        .findAll {
                            it.endsWith('.reproducible=true')
                        }.size() == 4
        if (!reproducible) {
            blockers.add(
                    'All four Coordination-owned archives were not '
                            + 'proved byte-for-byte reproducible.')
        }

        File jmhReport =
                file("$buildDir/reports/jmh/jmh-results.json")
        def jmhResults =
                jmhReport.isFile()
                        ? new JsonSlurper()
                        .parse(jmhReport)
                        : []
        def requiredJmhParameters = [
                'blue.coordination.processor.SubscriptionProjectionPlanningBenchmark.projectCurrent':
                        [
                                parameter: 'channelCount',
                                values   : [
                                        '10',
                                        '100',
                                        '1000',
                                        '10000'
                                ] as Set,
                                metrics  : [
                                        'snapshotOccurrences',
                                        'snapshotBytes'
                                ] as Set
                        ],
                'blue.coordination.processor.SubscriptionProjectionPlanningBenchmark.planSparseIndexedEvent':
                        [
                                parameter: 'channelCount',
                                values   : [
                                        '10',
                                        '100',
                                        '1000',
                                        '10000'
                                ] as Set,
                                metrics  : [
                                        'snapshotOccurrences',
                                        'snapshotBytes',
                                        'plannerCandidates',
                                        'providerDemandCount',
                                        'providerDemandBytes'
                                ] as Set
                        ],
                'blue.coordination.processor.FragmentAdmissionBenchmark.splitAndAdmitFreshInventory':
                        [
                                parameter: 'leafCount',
                                values   : [
