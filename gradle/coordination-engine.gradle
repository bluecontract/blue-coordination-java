def configureCoordinationEngineTest = { Test testTask ->
    testTask.group = 'verification'
    testTask.testClassesDirs = sourceSets.test.output.classesDirs
    testTask.classpath = sourceSets.test.runtimeClasspath
    testTask.dependsOn tasks.named('testClasses')
    testTask.useJUnitPlatform()
    testTask.ignoreFailures = true
    testTask.maxHeapSize = '2g'
    testTask.maxParallelForks = 1
    testTask.forkEvery = 0L
    testTask.javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(8)
    }
    testTask.reports {
        junitXml.required = true
        html.required = true
    }
    testTask.outputs.upToDateWhen { false }
    testTask.testLogging {
        events 'PASSED', 'FAILED', 'SKIPPED'
        showStandardStreams = true
    }
}

def coordinationEnginePhaseTestSelectors = [
        'blue.coordination.processor.CoordinationDeliveryPlanningCompatibilityTest',
        'blue.coordination.processor.CoordinationProcessorsTest.shouldKeepPublishedSemanticTypeIdentitiesAsTheDefaultProfile',
        'blue.coordination.processor.CoordinationProcessorsTest.shouldRejectCustomSemanticIdentityWithMismatchedProviderContent',
        'blue.coordination.processor.CoordinationRuntimeRegistrationsTest.shouldExposeStableIdentityForTheSuppliedProcessorGeneration',
        'blue.coordination.processor.RepositoryIndependentCoordinationRuntimeSmokeTest'
]

/*
 * The source-controlled release/working/probe partition predates the engine
 * phase. Keep engine-package tests out of that legacy partition and verify the
 * engine plus Repository-independent flagship in the dedicated tasks below.
 * Locked-Repository processor probes remain classified by the external-
 * blocker catalog.
 */
[
        'coordinationReleaseEvidenceTest',
        'coordinationWorkingEvidenceTest'
].each { legacyTaskName ->
    tasks.named(legacyTaskName, Test) { legacyTest ->
        legacyTest.filter {
            excludeTestsMatching('blue.coordination.engine.*')
            excludeTestsMatching(
                    'blue.coordination.processor.CoordinationComplexEmbeddedDeterminismFlagshipTest')
            coordinationEnginePhaseTestSelectors.each { selector ->
                excludeTestsMatching(selector)
            }
        }
    }
}

def coordinationProcessingEngineTest =
        tasks.register('coordinationProcessingEngineTest', Test) {
            engineTest ->
    description =
            'Runs engine API, successful PROCESS/commit, 10x10 campaign, and documentation verification.'
    configureCoordinationEngineTest(engineTest)
    engineTest.filter {
        includeTestsMatching(
                'blue.coordination.engine.CoordinationProcessingEngineApiTest')
        includeTestsMatching(
                'blue.coordination.engine.CoordinationProcessingEngineTest')
        includeTestsMatching(
                'blue.coordination.engine.CoordinationProcessingEngineTenByTenCampaignTest')
        includeTestsMatching(
                'blue.coordination.engine.CoordinationInventoryRootViewCacheTest')
        includeTestsMatching(
                'blue.coordination.engine.EngineDocumentationTest')
        coordinationEnginePhaseTestSelectors.each { selector ->
            includeTestsMatching(selector)
        }
    }
}

def coordinationProcessingEngineTckTest =
        tasks.register('coordinationProcessingEngineTckTest', Test) {
            tckTest ->
    description =
            'Runs the engine value, transition-policy, fragment-store, session-store, and memo-store contracts.'
    configureCoordinationEngineTest(tckTest)
    tckTest.mustRunAfter(coordinationProcessingEngineTest)
    tckTest.filter {
        includeTestsMatching('blue.coordination.engine.api.*')
        includeTestsMatching('blue.coordination.engine.internal.*')
        includeTestsMatching('blue.coordination.engine.memory.*')
    }
}

