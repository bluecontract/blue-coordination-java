                                        repositoryFlagshipStrictExecution,
                                linkage    : repositoryFlagshipLinkageExecution,
                                gate       : repositoryFlagshipGateExecution
                        ]
                ],
                conclusion       :
                        campaignReady && exactFlagshipReady
                                ? 'The 10x10 campaign and exact 32-run repository-independent flagship are verified from this invocation.'
                                : 'The flagship is incomplete or red; failed same-run test evidence is retained without substituting expected results.'
        ]

        def flagshipLocalityTotals = [
                processRuns       : 0L,
                requested         : 0L,
                backendLoaded     : 0L,
                backendTrips      : 0L,
                requestedBytes    : 0L,
                backendLoadedBytes: 0L,
                selectedBodies    : 0L,
                selectedBytes     : 0L,
                gas               : 0L
        ]
        def selectedBodyIdentities = new TreeSet<String>()
        if (exactFlagshipReady) {
            exactRepositoryFlagship.orderedStreams
                    .representationProviderMatrix.each { row ->
                def cells = row.split('\\|').collect {
                    it.trim()
                }.findAll { !it.isEmpty() }
                flagshipLocalityTotals.processRuns++
                flagshipLocalityTotals.requested +=
                        Long.parseLong(cells[5])
                flagshipLocalityTotals.backendLoaded +=
                        Long.parseLong(cells[6])
                flagshipLocalityTotals.backendTrips +=
                        Long.parseLong(cells[7])
                flagshipLocalityTotals.requestedBytes +=
                        Long.parseLong(cells[8])
                flagshipLocalityTotals.backendLoadedBytes +=
                        Long.parseLong(cells[9])
                flagshipLocalityTotals.selectedBodies +=
                        Long.parseLong(cells[10])
                flagshipLocalityTotals.selectedBytes +=
                        Long.parseLong(cells[11])
                flagshipLocalityTotals.gas +=
                        Long.parseLong(cells[12])
            }
            exactRepositoryFlagship.identitySets.each { key, identities ->
                if (key.endsWith('/Selected body BlueIds')) {
                    selectedBodyIdentities.addAll(identities)
                }
            }
        }
        boolean localityReady = campaignReady
                && exactFlagshipReady
                && bundleLoaderSummary.status == 'passed'
                && invocationBoundaryReady
        def localityReport = [
                schema           :
                        'blue.coordination/processing-engine-locality/1.0',
                status           : localityReady ? 'verified' : 'red',
                workingReady     : localityReady,
                localityReady    : localityReady,
                planningSmoke    : [
                        status : planningSmokeSameRun
                                ? 'passed'
                                : 'not-run',
                        tests  : performanceSameRun.invocations,
                        passed : performanceSameRun.passed,
                        failed : performanceSameRun.failed,
                        skipped: performanceSameRun.skipped,
                        cases  : planningSmokeSameRun
                                ? planningSmokeRecords
                                : []
                ],
                requestLocalBundle: [
                        constructedByEngine: engineSourceText.contains(
                                'bundleLoader.load('),
                        passedToBlueContracts:
                                requestLocalProviderPassedToContracts,
                        invocationConstructed:
                                platformInvocationConstructed,
                        diagnosticsAvailableFromCompletedTransition:
                                authoritativeDiagnosticsRetained,
                        loaderTck: bundleLoaderSummary
                ],
                measured         : [
                        providerRequests     : exactFlagshipReady,
                        backendLoadedFragments: exactFlagshipReady,
                        backendTrips        : exactFlagshipReady,
                        loadedBytes         : exactFlagshipReady,
                        selectedBodies      : exactFlagshipReady,
                        forbiddenReads      : exactFlagshipReady
                ],
                flagshipTotals   : exactFlagshipReady
                        ? flagshipLocalityTotals
                        : null,
                distinctSelectedBodyBlueIds:
                        exactFlagshipReady
                                ? new ArrayList<String>(
                                selectedBodyIdentities)
                                : [],
                forbiddenReads   : exactFlagshipReady ? 0L : null,
                conclusion       :
                        localityReady
                                ? 'The exact request-local provider and authoritative diagnostics are verified by the same-run 10x10, loader-TCK, and 32-run flagship evidence.'
                                : 'Physical locality remains unverified until the same-run campaign, loader TCK, invocation binding, and exact 32-run flagship are all green.'
        ]

        File performanceReceiptFile =
                coordinationEnginePerformanceSameRunJson.get().asFile
        def performanceReceipt = coordinationEngineReadJson(
                performanceReceiptFile)
        def performanceReceiptValidation =
                validateCoordinationEnginePerformanceReceipt(
                        performanceReceipt)
        boolean performanceSourceIdentityMatches =
                performanceReceipt?.profile?.coordinationCommit ==
                        sourceIdentity.coordination.commit
                        && performanceReceipt?.profile?.languageCommit ==
                        sourceIdentity.siblings.language.commit
                        && performanceReceipt?.profile?.bexCommit ==
                        sourceIdentity.siblings.bex.commit
                        && performanceReceipt?.profile
                        ?.dependencyLockSha256 ==
                        sourceIdentity.receipts.resolvedDependencyLock.sha256
                        && performanceReceipt?.profile
                        ?.coordinationSourceSha256 ==~ /[0-9a-f]{64}/
        if (!performanceSourceIdentityMatches) {
            performanceReceiptValidation.diagnostics.add(
                    'Receipt source commits, source digest, or dependency lock do not match this report invocation.')
            performanceReceiptValidation.status = 'red'
            performanceReceiptValidation.performanceReady = false
        }
        boolean performanceReceiptSameInvocation =
                performanceReceiptExecution.status == 'passed'
                        && performanceReceiptEvidence.status == 'passed'
                        && performanceReceiptEvidence.total > 0L
        if (!performanceReceiptSameInvocation) {
            performanceReceiptValidation.diagnostics.add(
                    'The strict performance receipt tests did not pass in this invocation.')
            performanceReceiptValidation.status = 'red'
            performanceReceiptValidation.performanceReady = false
        }
        boolean performanceReceiptVerified =
                performanceReceiptValidation.status == 'verified'
        boolean performanceReady = performanceReceiptVerified
                && performanceReceipt?.performanceReady == true
        def phaseSampleCounts = new LinkedHashMap<String, Long>()
        def metricSampleCounts = new LinkedHashMap<String, Long>()
        def unavailablePhaseCells = new LinkedHashMap<String, Long>()
        def unavailableMetricCells = new LinkedHashMap<String, Long>()
        def phaseInventory = performanceReceipt?.phaseInventory instanceof List
                ? performanceReceipt.phaseInventory
                : []
        def metricInventory = performanceReceipt?.metricInventory instanceof List
                ? performanceReceipt.metricInventory
                : []
        phaseInventory.each { phase ->
            phaseSampleCounts[phase] = (long) (performanceReceipt?.cells ?: [])
                    .findAll {
                        it?.phases?.get(phase)?.status == 'available'
                    }.inject(0L) { total, cell ->
                        total + (cell.phases[phase].count ?: 0L)
                    }
            unavailablePhaseCells[phase] =
                    (long) (performanceReceipt?.cells ?: []).count {
                        it?.phases?.get(phase)?.status == 'unavailable'
                    }
        }
        metricInventory.each { metric ->
            metricSampleCounts[metric] = (long) (performanceReceipt?.cells ?: [])
                    .findAll {
                        it?.metrics?.get(metric)?.status == 'available'
                    }.inject(0L) { total, cell ->
                        total + (cell.metrics[metric].count ?: 0L)
                    }
            unavailableMetricCells[metric] =
                    (long) (performanceReceipt?.cells ?: []).count {
                        it?.metrics?.get(metric)?.status == 'unavailable'
                    }
        }
        def performanceReport = [
                schema           :
                        'blue.coordination/processing-engine-performance/1.0',
                status           : performanceReceiptVerified
                        ? performanceReceipt.status
                        : 'red',
                workingReady     : planningSmokeSameRun
                        && performanceReceiptVerified
                        && performanceReady,
                performanceReady : performanceReady,
                mode             : performanceReady
                        ? 'bounded-same-run-measurement'
                        : 'not-measured',
                sameRunSmoke     : performanceSameRun,
                sameRunCapture   : performanceReceiptSameRun,
                retainedJUnitEvidence:
                        performanceExecution.status == 'passed'
                                && performanceReceiptExecution.status
                                == 'passed'
                                ? null
                                : [
                                smoke  : performanceEvidence.findAll {
                                    it.key != 'records'
                                },
                                receipt: performanceReceiptEvidence.findAll {
                                    it.key != 'records'
                                }
                        ],
                receipt          : [
                        path      :
                                'build/reports/coordination-engine/performance-same-run.json',
                        sha256    : performanceReceiptFile.isFile()
                                ? coordinationEngineSha256(
                                performanceReceiptFile)
                                : null,
                        status    : performanceReceipt?.status,
                        validation: performanceReceiptValidation,
                        profile   : performanceReceipt?.profile,
                        matrix    : performanceReceipt?.matrix,
                        semanticEquivalence:
                                performanceReceipt?.semanticEquivalence,
                        comparisonEligible:
                                performanceReceipt?.comparisonEligible,
                        speedupClaims:
                                performanceReceipt?.speedupClaims ?: []
                ],
                measurements     : [
                        phaseSamples    : phaseSampleCounts,
                        metricSamples   : metricSampleCounts,
                        unavailablePhaseCells: unavailablePhaseCells,
                        unavailableMetricCells: unavailableMetricCells
                ],
                admissionPlanningSmoke:
                        planningSmokeSameRun ? 'passed' : 'not-run',
                processPerformance : performanceReady
                        ? 'measured'
                        : 'not-measured',
                conclusion       :
                        performanceReady
                                ? 'The strict 54-cell receipt contains same-source, same-JVM, same-machine samples after semantic equality; it makes no speedup claim.'
                                : 'The strict receipt records every unavailable phase and metric explicitly; no benchmark was run and no speedup is claimed until semantic gates and an adapter are enabled.'
        ]

        def aggregateTests = [
                invocations: (engineSameRun.invocations
                        + tckSameRun.invocations
                        + performanceSameRun.invocations
                        + performanceReceiptSameRun.invocations),
                passed     : (engineSameRun.passed
                        + tckSameRun.passed
                        + performanceSameRun.passed
                        + performanceReceiptSameRun.passed),
                failed     : (engineSameRun.failed
                        + tckSameRun.failed
                        + performanceSameRun.failed
                        + performanceReceiptSameRun.failed),
                skipped    : (engineSameRun.skipped
                        + tckSameRun.skipped
                        + performanceSameRun.skipped
                        + performanceReceiptSameRun.skipped)
        ]
        def engineBlockers = new ArrayList<Map<String, Object>>()
        def requireEngineEvidence = {
            boolean ready, String id, String reason, Object evidence ->
            if (!ready) {
                engineBlockers.add([
                        id      : id,
                        owner   : 'blue-contract-java',
                        status  : 'open-same-run',
                        reason  : reason,
                        evidence: evidence
                ])
            }
        }
        requireEngineEvidence(
                engineSameRun.status == 'passed'
                        && engineSameRun.invocations > 0L,
                'engine-test-lane',
                'The same-run engine test task is missing, failed, or skipped.',
                engineSameRun)
        requireEngineEvidence(
                basicEngineSummary.status == 'passed',
                'engine-process-commit',
                'Basic PROCESS, commit, retry, progress-only, conflict, session, or lifecycle evidence is incomplete.',
                basicEngineSummary)
        requireEngineEvidence(
                campaignReady,
                'engine-10x10-campaign',
                'The complete same-run 10x10 consecutive-event campaign is not green.',
                campaignSummary)
        requireEngineEvidence(
                tckSameRun.status == 'passed'
                        && tckSameRun.invocations > 0L,
                'engine-storage-tck',
                'The same-run storage, loader, transition, and memo TCK lane is incomplete.',
                tckSameRun)
        requireEngineEvidence(
                incrementalSummary.status == 'passed',
                'engine-incremental-fragmentation',
                'Incremental fragmentation differential evidence is incomplete.',
                incrementalSummary)
        requireEngineEvidence(
                exactFlagshipReady,
                'engine-repository-independent-flagship',
                'The exact 32-run repository-independent flagship is missing or red.',
                flagshipReport.repositoryIndependentRuntime)
        requireEngineEvidence(
                localityReady,
                'engine-physical-locality',
                'Request-local provider handoff or physical-locality evidence is incomplete.',
                localityReport)
        requireEngineEvidence(
                planningSmokeSameRun,
                'engine-performance-smoke',
                'The bounded representation/prefetch smoke did not pass in this invocation.',
                performanceSameRun)
        requireEngineEvidence(
                performanceReport.workingReady,
                'engine-performance-evidence-contract',
                'The strict 9x3x2 receipt is missing, stale, structurally invalid, or lacks the required measured phases and metrics.',
                performanceReport.receipt)
        requireEngineEvidence(
                apiTestsSameRun && publicApiSameRun,
                'engine-public-api',
                'The engine and canonical public API inventories are not verified from this invocation.',
                apiReport)
        requireEngineEvidence(
                packageGraph.cycleCount == 0L,
                'engine-package-graph',
                'The production package graph contains cycles.',
                packageGraph)
        requireEngineEvidence(
                sourceIdentity.status == 'verified',
                'engine-source-identity',
                'Sibling commits or exact dependency artifacts are not verified.',
                sourceIdentity)
        requireEngineEvidence(
                externalCatalogValid,
                'engine-release-blocker-catalog',
                'The separate immutable Repository blocker catalog is invalid or missing.',
                externalBlockerCatalog)
        boolean workingReady = engineBlockers.isEmpty()
        def releaseBlockers = externalBlockerSummaries.findAll {
            it.status == 'open'
        }
        boolean releaseReady = workingReady && releaseBlockers.isEmpty()
        def finalReport = [
                schema           :
                        'blue.coordination/processing-engine-verification/1.0',
                status           : workingReady ? 'passed' : 'blocked',
                workingReady     : workingReady,
                releaseReady     : releaseReady,
                publicRcClaim    : false,
                capabilityStatus : [
                        apiShape           : apiReport.status,
                        admissionPlanning  : planningSmokeSameRun
                                ? 'verified'
                                : 'red',
                        process            : basicEngineSummary.status,
                        tenByTenCampaign   : campaignSummary.status,
                        incrementalFragmentation:
                                incrementalSummary.status,
                        repositoryIndependentFlagship:
                                exactFlagshipReady
                                        ? 'verified'
                                        : 'not-same-run',
                        packageTopology    : packageGraph.status,
                        physicalLocality   : localityReport.status,
                        processPerformance : performanceReport.status
                ],
                sameRunTests     : [
                        engine    : engineSameRun,
                        tck       : tckSameRun,
                        performanceSmoke: performanceSameRun,
                        performanceEvidence: performanceReceiptSameRun,
                        aggregate : aggregateTests
                ],
                tenByTenCampaign : campaignSummary,
                incrementalFragmentation: incrementalSummary,
                storageTck       : [
                        status : tckSameRun.status,
                        total  : tckSameRun.invocations,
                        passed : tckSameRun.passed,
                        failed : tckSameRun.failed,
                        skipped: tckSameRun.skipped
                ],
                locality         : [
                        status         : localityReport.status,
                        flagshipTotals : localityReport.flagshipTotals,
                        forbiddenReads : localityReport.forbiddenReads
                ],
                retainedJUnitEvidence: [
                        engine    : engineExecution.status == 'passed'
                                ? null
                                : engineEvidence.findAll {
                                    it.key != 'records'
                                },
                        tck       : tckExecution.status == 'passed'
                                ? null
                                : tckEvidence.findAll {
                                    it.key != 'records'
                                },
                        performanceSmoke:
                                performanceExecution.status == 'passed'
                                        ? null
                                        : performanceEvidence.findAll {
                                            it.key != 'records'
                                        },
                        performanceEvidence:
                                performanceReceiptExecution.status == 'passed'
                                        ? null
                                        : performanceReceiptEvidence.findAll {
                                            it.key != 'records'
                                        }
                ],
                repositoryIndependentFlagship:
                        flagshipReport.repositoryIndependentRuntime,
                sourceIdentity   : sourceIdentity,
                externalBlockerCatalog: externalBlockerCatalog,
                packageGraph     : packageGraph,
                evidenceGates    : [
                        publicApiInventory: publicApiExecution,
                        repositoryIndependentFlagship:
                                repositoryFlagshipGateExecution,
                        binaryCompatibility: [
                                task  : 'binaryCompatibilityCheck',
                                status: 'required-by-working-verification'
                        ],
                        reproducibleArchives: [
                                task  : 'verifyReproducibleArchives',
                                status: 'required-by-working-verification'
                        ],
                        existingWorkingVerification: [
                                task  : 'coordinationWorkingVerification',
                                status: 'required-by-working-verification'
                        ]
                ],
                sourceObservations: [
                        platformInvocationConstructed:
                                platformInvocationConstructed,
                        requestLocalProviderPassedToContracts:
                                requestLocalProviderPassedToContracts,
                        authoritativeDiagnosticsRetained:
                                authoritativeDiagnosticsRetained
                ],
                blockers         : engineBlockers,
                blockingReasons  : engineBlockers.collect {
                    it.id + ': ' + it.reason
                },
                releaseBlockingReasons:
                        releaseBlockers.collect {
                            it.id + ': owned by ' + it.owner
                        },
                reports          : [
                        flagship :
                                'build/reports/coordination-engine/flagship.json',
                        locality :
                                'build/reports/coordination-engine/locality.json',
                        performance:
                                'build/reports/coordination-engine/performance.json',
                        performanceReceipt:
                                'build/reports/coordination-engine/performance-same-run.json',
                        api      :
                                'build/reports/coordination-engine/api.json'
                ],
                conclusion       : workingReady
                        ? (releaseReady
                        ? 'The working engine and release lanes are verified; no public-RC claim is made by this report.'
                        : 'The Repository-independent working engine is verified; immutable Repository blockers keep release readiness false.')
                        : 'Same-run engine evidence is incomplete or red; no working, release, or public-RC claim is made.'
        ]

        writeCoordinationEngineJson(
                coordinationEngineApiJson.get().asFile,
                apiReport)
        writeCoordinationEngineJson(
                coordinationEngineFlagshipJson.get().asFile,
                flagshipReport)
        writeCoordinationEngineJson(
                coordinationEngineLocalityJson.get().asFile,
                localityReport)
        writeCoordinationEngineJson(
                coordinationEnginePerformanceJson.get().asFile,
                performanceReport)
        writeCoordinationEngineJson(
                coordinationEngineFinalJson.get().asFile,
                finalReport)

        File markdown = coordinationEngineFinalMarkdown.get().asFile
        markdown.parentFile.mkdirs()
        markdown.withWriter('UTF-8') { writer ->
            writer.writeLine('# Coordination processing engine verification')
            writer.writeLine('')
            writer.writeLine("- Status: `${finalReport.status}`")
            writer.writeLine("- Working ready: `${finalReport.workingReady}`")
            writer.writeLine("- Release ready: `${finalReport.releaseReady}`")
            writer.writeLine("- Public RC claim: `${finalReport.publicRcClaim}`")
            writer.writeLine("- Same-run test invocations: `${aggregateTests.invocations}`")
            writer.writeLine("- Passed: `${aggregateTests.passed}`")
            writer.writeLine("- Failed: `${aggregateTests.failed}`")
            writer.writeLine("- Skipped: `${aggregateTests.skipped}`")
            writer.writeLine("- 10x10 campaign: `${campaignSummary.passed}/${campaignSummary.total}`")
            writer.writeLine("- Repository-independent flagship runs: `${verifiedRepositoryFlagshipVariants}/32`")
            writer.writeLine("- Forbidden provider reads: `${localityReport.forbiddenReads}`")
            writer.writeLine("- Performance receipt: `${performanceReport.status}`")
            writer.writeLine("- Performance ready: `${performanceReport.performanceReady}`")
            writer.writeLine('')
            writer.writeLine('## Engine working-lane blockers')
            writer.writeLine('')
            if (engineBlockers.isEmpty()) {
                writer.writeLine('- None.')
            } else {
                engineBlockers.each { blocker ->
                    writer.writeLine(
                            "- `${blocker.id}` (${blocker.owner}): "
                                    + blocker.reason)
                }
            }
            writer.writeLine('')
            writer.writeLine('## Immutable Repository release blockers')
            writer.writeLine('')
            if (releaseBlockers.isEmpty()) {
                writer.writeLine('- None.')
            } else {
                releaseBlockers.each { blocker ->
                    writer.writeLine(
                            "- `${blocker.id}` (${blocker.owner})")
                }
            }
            writer.writeLine('')
            writer.writeLine('## Report qualification')
            writer.writeLine('')
            writer.writeLine(finalReport.conclusion)
        }
    }
}

def coordinationProcessingEngineWorkingVerification =
        tasks.register('coordinationProcessingEngineWorkingVerification') {
    group = 'verification'
    description =
            'Fails closed unless same-run PROCESS/commit, 10x10, TCK, locality, 32-run flagship, and performance-receipt contract evidence is green.'
    dependsOn(
            coordinationProcessingEngineReport,
            tasks.named('coordinationRepositoryIndependentRuntimeFlagship'),
            tasks.named('coordinationWorkingVerification'),
            tasks.named('generateCoordinationPublicApiReport'),
            tasks.named('binaryCompatibilityCheck'),
            tasks.named('verifyReproducibleArchives'))
    inputs.file(coordinationEngineFinalJson)
    doLast {
        File reportFile = coordinationEngineFinalJson.get().asFile
        if (!reportFile.isFile()) {
            throw new GradleException(
                    'Coordination engine final report is missing: '
                            + reportFile)
        }
        def report = new JsonSlurper().parse(reportFile)
        if (report.workingReady != true
                || report.releaseReady != false
                || report.publicRcClaim != false
                || report.status != 'passed'
                || report.packageGraph?.cycleCount != 0
                || report.sourceIdentity?.status != 'verified'
                || report.externalBlockerCatalog?.status
                != 'verified-input'
                || report.repositoryIndependentFlagship?.status
                != 'verified'
                || !(report.blockingReasons instanceof List)
                || !report.blockingReasons.isEmpty()) {
            throw new GradleException(
                    'Coordination processing engine is not working-ready; '
                            + 'see ' + reportFile)
        }
    }
}

/*
 * When the diagnostic report and strict flagship share a working-verification
 * graph, persist the report before the strict Test task is allowed to stop the
 * build.  This ordering changes no strict dependency or failure behavior.
 */
tasks.named('coordinationFlagshipTest', Test) {
    mustRunAfter(coordinationProcessingEngineReport)
}

ext.coordinationProcessingEngineTestTask =
        coordinationProcessingEngineTest
ext.coordinationProcessingEngineTckTestTask =
        coordinationProcessingEngineTckTest
ext.coordinationProcessingEnginePerformanceSmokeTask =
        coordinationProcessingEnginePerformanceSmoke
ext.coordinationProcessingEnginePerformanceEvidenceTask =
        coordinationProcessingEnginePerformanceEvidence
ext.coordinationProcessingEngineFlagshipObservationTask =
        coordinationProcessingEngineFlagshipObservation
ext.coordinationProcessingEngineReportTask =
        coordinationProcessingEngineReport
ext.coordinationProcessingEngineWorkingVerificationTask =
        coordinationProcessingEngineWorkingVerification
