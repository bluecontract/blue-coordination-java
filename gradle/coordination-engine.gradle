/*
 * The release flagship remains strict.  This separate lane exists only so a
 * report invocation can observe and serialize a red flagship deterministically
 * instead of being aborted by the Test task before its report action runs.
 */
def coordinationProcessingEngineFlagshipObservation =
        tasks.register(
                'coordinationProcessingEngineFlagshipObservation',
                Test) { flagshipObservation ->
    description =
            'Observes the Repository-independent runtime flagship for truthful same-run engine reporting.'
    configureCoordinationEngineTest(flagshipObservation)
    flagshipObservation.mustRunAfter(
            coordinationProcessingEnginePerformanceSmoke)
    flagshipObservation.filter {
        includeTestsMatching(
                'blue.coordination.processor.CoordinationComplexEmbeddedDeterminismFlagshipTest')
    }
    flagshipObservation.systemProperty(
            'coordination.flagship.report',
            coordinationEngineFlagshipObservationTrace.get().asFile.absolutePath)
    flagshipObservation.outputs.file(
            coordinationEngineFlagshipObservationTrace)
    flagshipObservation.doFirst {
        delete(coordinationEngineFlagshipObservationTrace.get().asFile)
    }
}

/*
 * This lane always validates the bounded receipt contract. It runs the real
 * repository-independent adapter only after its prerequisite semantic tasks
 * passed in this invocation. An operator may disable measurement explicitly;
 * the resulting receipt then records unavailability rather than numbers.
 */
def coordinationProcessingEnginePerformanceEvidence =
        tasks.register(
                'coordinationProcessingEnginePerformanceEvidence',
                Test) { performanceEvidence ->
    description =
            'Validates and writes the strict 9x3x2 real engine performance receipt after same-run semantic gates pass.'
    configureCoordinationEngineTest(performanceEvidence)
    performanceEvidence.dependsOn(
            coordinationProcessingEngineTest,
            coordinationProcessingEngineTckTest,
            coordinationProcessingEnginePerformanceSmoke,
            coordinationProcessingEngineFlagshipObservation,
            tasks.named(
                    'verifyRepositoryIndependentCoordinationFlagshipLinkage'),
            tasks.named('verifyLatestBlueSiblingInputs'),
            tasks.named('writeLatestBlueDependencyLock'))
    performanceEvidence.mustRunAfter(
            coordinationProcessingEngineFlagshipObservation)
    performanceEvidence.filter {
        includeTestsMatching(
                'blue.coordination.engine.performance.CoordinationEnginePerformanceEvidenceTest')
    }
    performanceEvidence.outputs.file(
            coordinationEnginePerformanceSameRunJson)
    performanceEvidence.doFirst {
        File target = coordinationEnginePerformanceSameRunJson
                .get().asFile
        delete(target)

        Properties locks = new Properties()
        File lockFile = file('gradle/blue-sibling-lock.properties')
        if (lockFile.isFile()) {
            lockFile.withInputStream { input -> locks.load(input) }
        }
        def gitProcess = new ProcessBuilder(
                ['git', 'rev-parse', 'HEAD'])
                .directory(projectDir)
                .redirectErrorStream(true)
                .start()
        String coordinationCommit =
                gitProcess.inputStream.getText('UTF-8').trim()
        if (gitProcess.waitFor() != 0 || coordinationCommit.isEmpty()) {
            coordinationCommit = 'unavailable:coordination-git-commit'
        }

        def sha256 = { File source ->
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            source.withInputStream { input ->
                byte[] buffer = new byte[8192]
                int read
                while ((read = input.read(buffer)) >= 0) {
                    if (read > 0) digest.update(buffer, 0, read)
                }
            }
            digest.digest().collect {
                String.format(
                        java.util.Locale.ROOT,
                        '%02x',
                        it & 0xff)
            }.join()
        }
        def sourceDigest =
                java.security.MessageDigest.getInstance('SHA-256')
        fileTree(projectDir) {
            include 'src/**/*.java'
            include 'src/**/*.json'
            include 'src/**/*.yaml'
            include 'src/**/*.yml'
            include 'src/**/*.md'
            include 'gradle/**/*.gradle'
            include 'gradle/**/*.json'
            include 'gradle/**/*.properties'
            include 'build.gradle'
            include 'settings.gradle'
            include 'gradle.properties'
        }.files.sort { left, right ->
            relativePath(left) <=> relativePath(right)
        }.each { source ->
            sourceDigest.update(
                    relativePath(source).getBytes('UTF-8'))
            sourceDigest.update([0] as byte[])
            source.withInputStream { input ->
                byte[] buffer = new byte[8192]
                int read
                while ((read = input.read(buffer)) >= 0) {
                    if (read > 0) {
                        sourceDigest.update(buffer, 0, read)
                    }
                }
            }
            sourceDigest.update([0] as byte[])
        }
        String coordinationSourceSha256 = sourceDigest.digest().collect {
            String.format(
                    java.util.Locale.ROOT,
                    '%02x',
                    it & 0xff)
        }.join()
        File dependencyLockFile = file(
                'build/reports/latest-language-embedded-collections/resolved-dependency-lock.json')
        String dependencyLockSha256 = dependencyLockFile.isFile()
                ? sha256(dependencyLockFile)
                : 'unavailable:resolved-dependency-lock'

        def junitGreen = { String taskName ->
            def resultFiles = fileTree(
                    "${buildDir}/test-results/${taskName}") {
                include 'TEST-*.xml'
            }.files
            long testCases = 0L
            boolean green = !resultFiles.isEmpty()
            resultFiles.each { resultFile ->
                def suite = new XmlSlurper(
                        false, false).parse(resultFile)
                testCases += suite.testcase.size()
                green &= suite.testcase.every { testCase ->
                    testCase.failure.size() == 0
                            && testCase.error.size() == 0
                            && testCase.skipped.size() == 0
                }
            }
            green && testCases > 0L
        }
        boolean linkageGreen = tasks.named(
                'verifyRepositoryIndependentCoordinationFlagshipLinkage')
                .get().state.with { state ->
                    state.executed
                            && state.didWork
                            && state.failure == null
                }
        boolean semanticGatesObservedGreen = linkageGreen
                && junitGreen('coordinationProcessingEngineTest')
                && junitGreen('coordinationProcessingEngineTckTest')
                && junitGreen(
                'coordinationProcessingEnginePerformanceSmoke')
                && junitGreen(
                'coordinationProcessingEngineFlagshipObservation')
        boolean measurementDisabled = Boolean.parseBoolean(
                (project.findProperty(
                        'coordinationEnginePerformanceSkipMeasurements')
                        ?: 'false').toString())

        performanceEvidence.systemProperty(
                'coordination.performance.receipt',
                target.absolutePath)
        performanceEvidence.systemProperty(
                'coordination.performance.runId',
                'coordination-engine-' + coordinationCommit + '-'
                        + coordinationSourceSha256.substring(0, 12))
        performanceEvidence.systemProperty(
                'coordination.performance.coordinationCommit',
                coordinationCommit)
        performanceEvidence.systemProperty(
                'coordination.performance.languageCommit',
                locks.getProperty(
                        'blueLanguageCommit',
                        'unavailable:blueLanguageCommit'))
        performanceEvidence.systemProperty(
                'coordination.performance.bexCommit',
                locks.getProperty(
                        'blueBexCommit',
                        'unavailable:blueBexCommit'))
        performanceEvidence.systemProperty(
                'coordination.performance.coordinationSourceSha256',
                coordinationSourceSha256)
        performanceEvidence.systemProperty(
                'coordination.performance.dependencyLockSha256',
                dependencyLockSha256)
        performanceEvidence.systemProperty(
                'coordination.performance.datasetIdentity',
                'blue.coordination/engine-performance-datasets/1.0')
        performanceEvidence.systemProperty(
                'coordination.performance.environmentIdentity',
                'blue.coordination/engine-performance-environment/1.0')
        performanceEvidence.systemProperty(
                'coordination.performance.warmupIterations',
                project.findProperty(
                        'coordinationEnginePerformanceWarmups') ?: '1')
        performanceEvidence.systemProperty(
                'coordination.performance.measurementIterations',
                project.findProperty(
                        'coordinationEnginePerformanceMeasurements') ?: '5')

        Object configuredAdapter = project.findProperty(
                'coordinationEnginePerformanceAdapter')
        String adapter = configuredAdapter != null
                && !configuredAdapter.toString().trim().isEmpty()
                ? configuredAdapter.toString().trim()
                : ('blue.coordination.engine.performance.'
                        + 'RealCoordinationEnginePerformanceScenarioAdapter')
        if (!measurementDisabled) {
            performanceEvidence.systemProperty(
                    'coordination.performance.adapter',
                    adapter)
        }
        performanceEvidence.systemProperty(
                'coordination.performance.semanticGatesGreen',
                Boolean.toString(
                        !measurementDisabled
                                && semanticGatesObservedGreen))
    }
}

def normalizeCoordinationEngineTestName = { String name ->
    name != null && name.endsWith('()')
            ? name.substring(0, name.length() - 2)
            : name
}

def normalizeCoordinationEngineDiagnostic = { String message ->
    if (message == null) return null
    String normalized = message
            .replace(projectDir.absolutePath, '<project>')
            .replace(System.getProperty('user.home'), '<home>')
            .replaceAll(/\s+/, ' ')
            .trim()
    normalized.isEmpty() ? null : normalized
}

def readCoordinationEngineJUnit = { String taskName ->
    File resultDirectory = file("${buildDir}/test-results/${taskName}")
    def records = new ArrayList<Map<String, Object>>()
    fileTree(resultDirectory) {
        include 'TEST-*.xml'
    }.files.sort { left, right ->
        left.name <=> right.name
    }.each { resultFile ->
        def suite = new XmlSlurper(false, false).parse(resultFile)
        suite.testcase.each { testCase ->
            def failure = testCase.failure.size() > 0
                    ? testCase.failure[0]
                    : (testCase.error.size() > 0
                    ? testCase.error[0]
                    : null)
            String status = failure != null
                    ? 'failed'
                    : (testCase.skipped.size() > 0
                    ? 'skipped'
                    : 'passed')
            String className = testCase.@classname.toString()
            String methodName = normalizeCoordinationEngineTestName(
                    testCase.@name.toString())
            records.add([
                    id         : className + '#' + methodName,
                    className  : className,
                    methodName : methodName,
                    status     : status,
                    failureType: failure == null
                            ? null
                            : failure.@type.toString(),
                    diagnostic : failure == null
                            ? null
                            : normalizeCoordinationEngineDiagnostic(
                            failure.@message.toString())
            ])
        }
    }
    records.sort { left, right -> left.id <=> right.id }
    long failed = records.count { it.status == 'failed' }
    long skipped = records.count { it.status == 'skipped' }
    [
            task   : taskName,
            status : records.isEmpty()
                    ? 'missing'
                    : (failed == 0L && skipped == 0L
                    ? 'passed'
                    : 'red'),
            total  : (long) records.size(),
            passed : (long) records.size() - failed - skipped,
            failed : failed,
            skipped: skipped,
            records: records
    ]
}

def coordinationEngineSha256 = { File source ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    source.withInputStream { input ->
        byte[] buffer = new byte[8192]
        int read
        while ((read = input.read(buffer)) >= 0) {
            if (read > 0) digest.update(buffer, 0, read)
        }
    }
    digest.digest().collect {
        String.format(java.util.Locale.ROOT, '%02x', it & 0xff)
    }.join()
}

def coordinationEnginePublicTypes = {
    def publicTypePattern = ~/(?m)^public\s+(?:final\s+|abstract\s+)?(?:class|interface|enum)\s+([A-Za-z_$][A-Za-z0-9_$]*)\b/
    def packagePattern = ~/(?m)^package\s+([A-Za-z_$][A-Za-z0-9_$.]*)\s*;/
    def types = new ArrayList<Map<String, Object>>()
    fileTree('src/main/java/blue/coordination/engine') {
        include '**/*.java'
    }.files.sort { left, right ->
        project.relativePath(left) <=> project.relativePath(right)
    }.each { source ->
        String text = source.getText('UTF-8')
        def packageMatcher = packagePattern.matcher(text)
        def typeMatcher = publicTypePattern.matcher(text)
        if (packageMatcher.find() && typeMatcher.find()) {
            String packageName = packageMatcher.group(1)
            String typeName = typeMatcher.group(1)
            types.add([
                    name        : packageName + '.' + typeName,
                    source      : project.relativePath(source),
                    sourceSha256: coordinationEngineSha256(source)
            ])
        }
    }
    types.sort { left, right -> left.name <=> right.name }
}

def coordinationEngineTaskExecution = { String taskName ->
    def task = tasks.named(taskName).get()
    def state = task.state
    boolean scheduled = gradle.taskGraph.hasTask(task)
    boolean successfulExecution = scheduled
            && state.executed
            && state.failure == null
            && state.didWork
    [
            task     : taskName,
            status   : successfulExecution
                    ? 'passed'
                    : (scheduled && state.failure != null
                    ? 'failed'
                    : (scheduled ? 'not-executed' : 'not-scheduled')),
            scheduled: scheduled,
            executed : state.executed,
            didWork  : state.didWork
    ]
}

def coordinationEngineReadJson = { File source ->
    if (!source.isFile()) return null
    new JsonSlurper().parse(source)
}

def validateCoordinationEnginePerformanceReceipt = { receipt ->
    def diagnostics = new ArrayList<String>()
    def requireEvidence = { boolean condition, String diagnostic ->
        if (!condition) diagnostics.add(diagnostic)
    }
    def scenarios = [
            'simple-root-event',
            'selected-depth-2',
            'deep-a25-event',
            'composite-channel-event',
            'all-timelines-channel-event',
            'document-update-cascade',
            'triggered-event-cascade',
            'collection-member-add-remove-readd',
            '10-consecutive-deep-events'
    ]
    def modes = [
            'fragment-native-indexed',
            'current-root-compatibility',
            'full-inline-control'
    ]
    def caches = ['cold', 'warm']
    def phases = [
            'plan',
            'bundle-load',
            'process',
            'fragment-transition',
            'commit',
            'end-to-end'
    ]
    def metrics = [
            'provider-request-count',
            'batch-count',
            'fallback-count',
            'loaded-bytes',
            'materialized-node-count',
            'selected-body-count',
            'allocation-bytes',
            'retained-heap-bytes'
    ]
    def expectedCells = new TreeMap<String, Map<String, String>>()
    scenarios.each { scenario ->
        modes.each { mode ->
            caches.each { cache ->
                String id = scenario + '/' + mode + '/' + cache
                expectedCells.put(id, [
                        scenario      : scenario,
                        comparisonMode: mode,
                        cache         : cache
                ])
            }
        }
    }

    requireEvidence(
            receipt instanceof Map,
            'Receipt is missing or is not an object.')
    requireEvidence(
            receipt?.schema ==
                    'blue.coordination/engine-performance-evidence/1.0',
            'Receipt schema is not the strict engine-performance schema.')
    requireEvidence(
            receipt?.requiredScenarios == scenarios,
            'Scenario inventory is not the required ordered nine.')
    requireEvidence(
            receipt?.comparisonModes == modes,
            'Comparison inventory is not the required ordered three.')
    requireEvidence(
            receipt?.cacheStates == caches,
            'Cache inventory is not cold/warm.')
    requireEvidence(
            receipt?.phaseInventory == phases,
            'Phase inventory is incomplete or out of order.')
    requireEvidence(
            receipt?.metricInventory == metrics,
            'Metric inventory is incomplete or out of order.')
    requireEvidence(
            receipt?.matrix?.requiredCells == 54
                    && receipt?.matrix?.scenarioCount == 9
                    && receipt?.matrix?.comparisonModeCount == 3
                    && receipt?.matrix?.cacheStateCount == 2,
            'Matrix dimensions are not exactly 9x3x2.')
    requireEvidence(
            receipt?.speedupClaims instanceof List
                    && receipt.speedupClaims.isEmpty(),
            'Unqualified speedup claims are forbidden.')
    requireEvidence(
            receipt?.profile instanceof Map
                    && receipt.profile.machine instanceof Map
                    && !receipt.profile.machine.isEmpty(),
            'Machine/JVM profile is missing.')
    requireEvidence(
            receipt?.profile?.warmupIterations instanceof Number
                    && receipt.profile.warmupIterations >= 0
                    && receipt.profile.warmupIterations <= 20,
            'Warmup count must be bounded to 0..20.')
    requireEvidence(
            receipt?.profile?.measurementIterations instanceof Number
                    && receipt.profile.measurementIterations >= 1
                    && receipt.profile.measurementIterations <= 100,
            'Measurement count must be bounded to 1..100.')
    [
            'runId',
            'coordinationCommit',
            'languageCommit',
            'bexCommit',
            'coordinationSourceSha256',
            'dependencyLockSha256',
            'datasetGeneratorIdentity',
            'semanticEnvironmentIdentity'
    ].each { field ->
        requireEvidence(
                receipt?.profile?.get(field) instanceof String
                        && !receipt.profile[field].trim().isEmpty(),
                'Profile field is missing: ' + field)
    }
    requireEvidence(
            receipt?.profile?.coordinationSourceSha256 ==~ /[0-9a-f]{64}/,
            'Coordination source-tree SHA-256 is invalid.')
    requireEvidence(
            receipt?.profile?.dependencyLockSha256 ==~ /[0-9a-f]{64}/,
            'Resolved dependency-lock SHA-256 is invalid.')

    def cells = receipt?.cells instanceof List
            ? receipt.cells
            : []
    requireEvidence(
            cells.size() == 54,
            'Receipt must contain exactly 54 cells.')
    def observedIds = cells.collect { it?.id }
    requireEvidence(
            observedIds.toSet() == expectedCells.keySet()
                    && observedIds.size() == observedIds.toSet().size(),
            'Receipt cell identities do not exactly cover the matrix.')

    def nearestRank = { List values, double percentile ->
        def ordered = values.collect {
            ((Number) it).longValue()
        }.sort()
        int rank = (int) Math.ceil(
                percentile * ordered.size() / 100.0d)
        ordered[Math.max(1, rank) - 1]
    }
    def validateDistribution = {
        Object candidate, String cellId, String fieldId ->
        requireEvidence(
                candidate instanceof Map,
                cellId + ' is missing distribution ' + fieldId)
        if (!(candidate instanceof Map)) return
        if (candidate.status == 'available') {
            def samples = candidate.samples instanceof List
                    ? candidate.samples
                    : []
            boolean nonNegative = !samples.isEmpty()
                    && samples.every {
                        it instanceof Number && it.longValue() >= 0L
                    }
            requireEvidence(
                    nonNegative,
                    cellId + '/' + fieldId
                            + ' has no authoritative non-negative samples.')
            if (nonNegative) {
                def ordered = samples.collect {
                    it.longValue()
                }.sort()
                requireEvidence(
                        candidate.count == samples.size()
                                && candidate.minimum == ordered.first()
                                && candidate.maximum == ordered.last()
                                && candidate.p50 == nearestRank(samples, 50.0d)
                                && candidate.p95 == nearestRank(samples, 95.0d)
                                && candidate.p99 == nearestRank(samples, 99.0d),
                        cellId + '/' + fieldId
                                + ' percentile summary does not match raw samples.')
            }
        } else if (candidate.status == 'unavailable') {
            requireEvidence(
                    candidate.reason instanceof String
                            && !candidate.reason.trim().isEmpty()
                            && candidate.samples instanceof List
                            && candidate.samples.isEmpty(),
                    cellId + '/' + fieldId
                            + ' must carry one explicit unavailable reason and no samples.')
        } else {
            requireEvidence(
                    false,
                    cellId + '/' + fieldId
                            + ' has an unsupported distribution status.')
        }
    }

    cells.each { cell ->
        String cellId = cell?.id
        def expected = expectedCells[cellId]
        requireEvidence(
                expected != null
                        && cell?.scenario == expected?.scenario
                        && cell?.comparisonMode == expected?.comparisonMode
                        && cell?.cache == expected?.cache,
                'Cell dimensions do not match its identity: ' + cellId)
        requireEvidence(
                cell?.phases instanceof Map
                        && cell.phases.keySet() == phases.toSet(),
                cellId + ' phase fields are incomplete.')
        requireEvidence(
                cell?.metrics instanceof Map
                        && cell.metrics.keySet() == metrics.toSet(),
                cellId + ' metric fields are incomplete.')
        phases.each { phase ->
            validateDistribution(cell?.phases?.get(phase), cellId, phase)
        }
        metrics.each { metric ->
            validateDistribution(cell?.metrics?.get(metric), cellId, metric)
        }
    }
    def semanticFields = [
            'status',
            'finalRootBlueId',
            'finalRootValueSha256',
            'rootEventsSha256',
            'gas',
            'namedTraceSha256',
            'checkpointsSha256',
            'subscriptionDeltaSha256'
    ].toSet()
    if (receipt?.status != 'unavailable') {
        scenarios.each { scenario ->
            def scenarioCells = cells.findAll {
                it?.scenario == scenario
            }
            def expectedDataset = scenarioCells.isEmpty()
                    ? null
                    : scenarioCells.first().datasetSha256
            def expectedSemantics = scenarioCells.isEmpty()
                    ? null
                    : scenarioCells.first().semantics
            requireEvidence(
                    scenarioCells.size() == 6
                            && expectedDataset instanceof String
                            && !expectedDataset.trim().isEmpty()
                            && expectedSemantics instanceof Map
                            && expectedSemantics.keySet() == semanticFields
                            && expectedSemantics.gas instanceof Number
                            && expectedSemantics.gas.longValue() >= 0L
                            && scenarioCells.every {
                        it.datasetSha256 == expectedDataset
                                && it.semantics == expectedSemantics
                    },
                    scenario + ' does not have one identical dataset and semantic fingerprint across all six cells.')
        }
    }

    boolean unavailable = receipt?.status == 'unavailable'
    boolean completed = receipt?.status == 'verified'
            || receipt?.status == 'complete-with-unavailable-metrics'
    requireEvidence(
            unavailable || completed,
            'Receipt status is unsupported.')
    if (unavailable) {
        requireEvidence(
                receipt.performanceReady == false
                        && receipt.comparisonEligible == false
                        && receipt.semanticEquivalence == 'not-executed'
                        && receipt.matrix?.completedCells == 0
                        && cells.every { cell ->
                    cell?.status == 'not-executed'
                            && cell?.reason instanceof String
                            && !cell.reason.trim().isEmpty()
                            && cell?.phases?.values()?.every {
                        it?.status == 'unavailable'
                    }
                            && cell?.metrics?.values()?.every {
                        it?.status == 'unavailable'
                    }
                },
                'Unavailable receipt contains completed or measured evidence.')
    }
    if (completed) {
        requireEvidence(
                receipt.comparisonEligible == true
                        && receipt.semanticEquivalence == 'verified'
                        && receipt.matrix?.completedCells == 54
                        && cells.every { cell ->
                    cell?.status == 'completed'
                            && cell?.sampleCount ==
                            receipt.profile.measurementIterations
                            && cell?.datasetSha256 instanceof String
                            && !cell.datasetSha256.trim().isEmpty()
                            && cell?.semantics instanceof Map
                            && cell.phases.values().every { distribution ->
                        distribution.status != 'available'
                                || distribution.count == cell.sampleCount
                    }
                            && cell.metrics.values().every { distribution ->
                        distribution.status != 'available'
                                || distribution.count == cell.sampleCount
                    }
                },
                'Completed receipt lacks exact samples or semantic evidence.')
        def engineRequiredMetrics = [
                'provider-request-count',
                'batch-count',
                'fallback-count',
                'loaded-bytes',
                'selected-body-count'
        ]
        boolean requiredMeasurementsAvailable = cells.every { cell ->
            def requiredPhases = cell.comparisonMode == 'full-inline-control'
                    ? ['process', 'end-to-end']
                    : phases
            def requiredMetrics =
                    cell.comparisonMode == 'full-inline-control'
                            ? ['selected-body-count']
                            : engineRequiredMetrics
            requiredPhases.every {
                cell.phases[it]?.status == 'available'
            } && requiredMetrics.every {
                cell.metrics[it]?.status == 'available'
            }
        }
        requireEvidence(
                receipt.performanceReady == requiredMeasurementsAvailable
                        && (receipt.status == 'verified')
                        == requiredMeasurementsAvailable,
                'performanceReady does not match required measurements.')
    }

    [
            status     : diagnostics.isEmpty() ? 'verified' : 'red',
            diagnostics: diagnostics,
            receiptStatus: receipt?.status,
            performanceReady:
                    diagnostics.isEmpty()
                            && receipt?.performanceReady == true,
            completedCells:
                    receipt?.matrix?.completedCells ?: 0L,
            requiredCells:
                    receipt?.matrix?.requiredCells ?: 54L
    ]
}

def coordinationEngineGitOutput = { List<String> arguments ->
    try {
        def command = new ArrayList<String>()
        command.add('git')
        command.addAll(arguments)
        def process = new ProcessBuilder(command)
                .directory(projectDir)
                .redirectErrorStream(true)
                .start()
        String output = process.inputStream.getText('UTF-8').trim()
        process.waitFor() == 0 ? output : null
    } catch (Exception ignored) {
        null
    }
}

def coordinationEnginePackageGraph = {
    def packagePattern =
            ~/(?m)^package\s+([A-Za-z_$][A-Za-z0-9_$.]*)\s*;/
    def importPattern =
            ~/(?m)^import\s+(?:static\s+)?([A-Za-z_$][A-Za-z0-9_$.]*)\s*;/
    def sources = fileTree('src/main/java') {
        include '**/*.java'
    }.files.sort { left, right ->
        project.relativePath(left) <=> project.relativePath(right)
    }
    def sourcePackages = new TreeMap<File, String>()
    def packages = new TreeSet<String>()
    sources.each { source ->
        def packageMatcher = packagePattern.matcher(source.getText('UTF-8'))
        if (packageMatcher.find()) {
            String packageName = packageMatcher.group(1)
            sourcePackages.put(source, packageName)
            packages.add(packageName)
        }
    }
    def edges = new TreeMap<String, Set<String>>()
    packages.each { packageName ->
        edges.put(packageName, new TreeSet<String>())
    }
    sourcePackages.each { source, sourcePackage ->
        String text = source.getText('UTF-8')
        def importMatcher = importPattern.matcher(text)
        while (importMatcher.find()) {
            String importedName = importMatcher.group(1)
            String importedPackage = packages.findAll { packageName ->
                importedName == packageName
                        || importedName.startsWith(packageName + '.')
            }.sort { left, right -> right.length() <=> left.length() }
                    .find { true }
            if (importedPackage != null
                    && importedPackage != sourcePackage) {
                edges.get(sourcePackage).add(importedPackage)
            }
        }
    }
    def reachableFrom = { String start ->
        def reached = new TreeSet<String>()
        def pending = new ArrayDeque<String>()
        pending.add(start)
        while (!pending.isEmpty()) {
            String current = pending.removeFirst()
            edges.get(current).each { target ->
                if (reached.add(target)) pending.addLast(target)
            }
        }
        reached
    }
    def reachability = new TreeMap<String, Set<String>>()
    packages.each { packageName ->
        reachability.put(packageName, reachableFrom(packageName))
    }
    def assigned = new TreeSet<String>()
    def cycles = new ArrayList<List<String>>()
    packages.each { packageName ->
        if (!assigned.contains(packageName)) {
            def component = packages.findAll { candidate ->
                candidate == packageName
                        || (reachability.get(packageName).contains(candidate)
                        && reachability.get(candidate).contains(packageName))
            }.sort()
            assigned.addAll(component)
            if (component.size() > 1) cycles.add(component)
        }
    }
    def serializedEdges = new ArrayList<Map<String, String>>()
    edges.each { source, targets ->
        targets.each { target ->
            serializedEdges.add([from: source, to: target])
        }
    }
    [
            status      : cycles.isEmpty() ? 'passed' : 'red',
            packageCount: (long) packages.size(),
            edgeCount   : (long) serializedEdges.size(),
            cycleCount  : (long) cycles.size(),
            cycles      : cycles,
            edges       : serializedEdges
    ]
}

def writeCoordinationEngineJson = { File target, Object value ->
