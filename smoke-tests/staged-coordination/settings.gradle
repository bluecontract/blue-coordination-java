def sha256Hex = { File input ->
    MessageDigest digest = MessageDigest.getInstance('SHA-256')
    input.withInputStream { stream ->
        byte[] buffer = new byte[8192]
        int count
        while ((count = stream.read(buffer)) != -1) {
            digest.update(buffer, 0, count)
        }
    }
    digest.digest().encodeHex().toString()
}
def regularFile = { File input ->
    Files.isRegularFile(input.toPath(), LinkOption.NOFOLLOW_LINKS)
            && !Files.isSymbolicLink(input.toPath())
}
def checkedRepository = { String propertyName ->
    String value = providers.gradleProperty(propertyName).orNull
    if (value == null || value.isBlank()) {
        throw new GradleException("-${'P'}${propertyName} is required")
    }
    File path = new File(value)
    if (!path.isAbsolute()
            || !Files.isDirectory(path.canonicalFile.toPath(),
            LinkOption.NOFOLLOW_LINKS)
            || Files.isSymbolicLink(path.toPath())) {
        throw new GradleException(
                "${propertyName} must be an absolute regular repository")
    }
    path.canonicalFile
}
def checkedManifest = {
        File repository, String propertyName, String label ->
    String expected = providers.gradleProperty(propertyName).orNull
    if (expected == null || !(expected ==~ /sha256:[0-9a-f]{64}/)) {
        throw new GradleException(
                "-${'P'}${propertyName}=sha256:<64 lowercase hex> is required")
    }
    File manifestFile = new File(repository, 'artifact-manifest.json')
    File sidecar = new File(repository, 'artifact-manifest.json.sha256')
    if (!regularFile(manifestFile) || !regularFile(sidecar)) {
        throw new GradleException(
                "${label} repository manifest or sidecar is missing")
    }
    String hash = sha256Hex(manifestFile)
    if (expected != 'sha256:' + hash
            || sidecar.getText('UTF-8')
            != hash + '  artifact-manifest.json\n') {
        throw new GradleException(
                "${label} repository manifest identity differs")
    }
    def manifest
    try {
        manifest = new JsonSlurper().parse(manifestFile)
    } catch (RuntimeException exception) {
        throw new GradleException(
                "Cannot parse ${label} repository manifest", exception)
    }
    if (!(manifest instanceof Map)) {
        throw new GradleException(
                "${label} repository manifest is not an object")
    }
    [manifest: manifest, identity: expected]
}
def relativeFiles = { File repository, List<String> failures ->
    Set<String> files = new TreeSet<>()
    def stream = Files.walk(repository.toPath())
    try {
        stream.forEach { path ->
            if (path == repository.toPath()) {
                return
            }
            if (Files.isSymbolicLink(path)) {
                failures << ('symbolic link in repository '
                        + repository.toPath().relativize(path))
            } else if (Files.isRegularFile(
                    path, LinkOption.NOFOLLOW_LINKS)) {
                files.add(repository.toPath().relativize(path)
                        .toString().replace(File.separator, '/'))
            }
        }
    } finally {
        stream.close()
    }
    files
}
def expectedRecords = {
        String group, String version, Set<String> artifacts,
        Map<String, String> kinds ->
    List<Map<String, String>> records = []
    artifacts.toList().sort().each { artifact ->
        kinds.keySet().toList().sort().each { kind ->
            String base = (group.replace('.', '/') + '/' + artifact + '/'
                    + version + '/' + artifact + '-' + version)
            records << [
                    coordinate: group + ':' + artifact + ':' + version,
                    kind: kind,
                    path: base + kinds[kind],
                    checksumPath: base + kinds[kind] + '.sha256'
            ]
        }
    }
    records
}
def verifyRepositoryClosure = {
        File repository, Map manifest,
        List<Map<String, String>> expectedArtifacts,
        int expectedFileCount, String label ->
    List<String> failures = []
    def records = manifest.artifacts instanceof List
            ? manifest.artifacts : []
    if (!(manifest.artifacts instanceof List)) {
        failures << 'manifest artifacts must be a list'
    }
    Set<String> recordFields = [
            'coordinate', 'kind', 'path', 'checksumPath', 'sha256', 'bytes'
    ] as Set
    Set<String> expectedFiles = [
            'artifact-manifest.json', 'artifact-manifest.json.sha256'
    ] as Set
    expectedArtifacts.eachWithIndex { expected, index ->
        def record = index < records.size() ? records[index] : null
        Set<String> fields = record instanceof Map
                ? record.keySet() as Set : [] as Set
        if (!(record instanceof Map) || fields != recordFields) {
            failures << "artifact record ${index} fields differ"
            return
        }
        if (record.coordinate != expected.coordinate
                || record.kind != expected.kind
                || record.path != expected.path
                || record.checksumPath != expected.checksumPath) {
            failures << "artifact record ${index} is noncanonical"
            return
        }
        expectedFiles.add(expected.path)
        expectedFiles.add(expected.checksumPath)
        File payload = new File(repository, expected.path).canonicalFile
        File checksum = new File(repository, expected.checksumPath)
                .canonicalFile
        if (!payload.toPath().startsWith(repository.toPath())
                || !checksum.toPath().startsWith(repository.toPath())) {
            failures << "artifact path ${index} escapes the repository"
            return
        }
        if (!regularFile(payload) || !regularFile(checksum)) {
            failures << "artifact payload/checksum ${index} is missing"
            return
        }
        String hash = sha256Hex(payload)
        if (record.sha256 != 'sha256:' + hash) {
            failures << "artifact digest ${index} differs"
        }
        if (!(record.bytes instanceof Number)
                || record.bytes.toString() != payload.length().toString()) {
            failures << "artifact byte count ${index} differs"
        }
        if (checksum.getText('UTF-8')
                != hash + '  ' + payload.name + '\n') {
            failures << "artifact checksum ${index} differs"
        }
    }
    if (records.size() != expectedArtifacts.size()) {
        failures << ('manifest has ' + records.size()
                + ' artifact records; expected ' + expectedArtifacts.size())
    }
    if (expectedFiles.size() != expectedFileCount) {
        failures << ('expected closure has ' + expectedFiles.size()
                + ' files; expected ' + expectedFileCount)
    }
    Set<String> actualFiles = relativeFiles(repository, failures)
    if (actualFiles != expectedFiles) {
        failures << ('repository closure differs; missing '
                + (expectedFiles - actualFiles).toList().sort()
                + ', unexpected '
                + (actualFiles - expectedFiles).toList().sort())
    }
    if (!failures.empty) {
        throw new GradleException(
                "${label} repository failed:\n - "
                        + failures.join('\n - '))
    }
}

