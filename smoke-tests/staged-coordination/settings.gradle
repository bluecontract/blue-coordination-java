import groovy.json.JsonSlurper
import org.gradle.api.initialization.resolve.RepositoriesMode

pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'blue-coordination-staged-consumer'

def checkedRepository = { String propertyName ->
    String value = providers.gradleProperty(propertyName).orNull
    if (value == null || value.isBlank()) {
        throw new GradleException("-${'P'}${propertyName} is required")
    }
    File path = new File(value)
    if (!path.isAbsolute() || !path.canonicalFile.isDirectory()) {
        throw new GradleException("${propertyName} must be an absolute repository")
    }
    path.canonicalFile
}
def checkedManifest = { File repository, String propertyName ->
    String expected = providers.gradleProperty(propertyName).orNull
    if (expected == null || !(expected ==~ /sha256:[0-9a-f]{64}/)) {
        throw new GradleException("-${'P'}${propertyName}=sha256:<hex> is required")
    }
    File manifest = new File(repository, 'artifact-manifest.json')
    File sidecar = new File(repository, 'artifact-manifest.json.sha256')
    if (!manifest.isFile() || java.nio.file.Files.isSymbolicLink(
            manifest.toPath()) || !sidecar.isFile()
            || java.nio.file.Files.isSymbolicLink(sidecar.toPath())) {
        throw new GradleException('repository manifest or sidecar is missing')
    }
    String hash = java.security.MessageDigest.getInstance('SHA-256')
            .digest(manifest.bytes).encodeHex().toString()
    if (expected != 'sha256:' + hash
            || sidecar.getText('UTF-8')
            != hash + '  artifact-manifest.json\n') {
        throw new GradleException('repository manifest identity differs')
    }
    new JsonSlurper().parse(manifest)
}

File coordinationRepository = checkedRepository('coordinationRepository')
File contractsRepository = checkedRepository('contractsRepository')
def coordinationManifest = checkedManifest(
        coordinationRepository, 'coordinationManifestSha256')
def contractsManifest = checkedManifest(
        contractsRepository, 'contractsManifestSha256')
if (coordinationManifest.groupId != 'blue.coordination'
        || contractsManifest.groupId != 'blue.language'
        || coordinationManifest.contracts.manifestIdentity
        != providers.gradleProperty('contractsManifestSha256').get()) {
    throw new GradleException(
            'staged Coordination and Contracts manifests are not bound')
}

def checkedVersion = { Map manifest, String propertyName, String base ->
    String requested = providers.gradleProperty(propertyName)
            .getOrElse(String.valueOf(manifest.version))
    if (requested != manifest.version) {
        throw new GradleException(
                "${propertyName} differs from its immutable manifest")
    }
    if (requested.contains('-dev.')) {
        if (manifest.stagePurpose != 'DEVELOPMENT'
                || manifest.releaseReadinessClaimed != false
                || !(manifest.builtWithJava instanceof Number)
                || manifest.builtWithJava.toString() != '17'
                || !(manifest.sourceCommit instanceof String)
                || !(manifest.sourceCommit ==~ /[0-9a-f]{40}/)
                || !(manifest.sourceTree instanceof String)
                || !(manifest.sourceTree ==~ /[0-9a-f]{40}/)
                || !(manifest.sourceDirty instanceof Boolean)) {
            throw new GradleException(
                    'DEVELOPMENT consumer requires exact source-tree provenance')
        }
        String boundVersion = manifest.sourceDirty
                ? base + '-dev.tree.' + manifest.sourceTree
                : base + '-dev.' + manifest.sourceCommit
        if (requested != boundVersion) {
            throw new GradleException(
                    'DEVELOPMENT consumer version does not bind its exact source identity')
        }
    }
    requested
}
String selectedCoordinationVersion = checkedVersion(
        coordinationManifest, 'coordinationVersion', '3.0.0')
String selectedContractsVersion = checkedVersion(
        contractsManifest, 'contractsVersion', '3.1.0')
if (coordinationManifest.contracts.sourceCommit != contractsManifest.sourceCommit) {
    throw new GradleException('staged consumer Contracts source identities differ')
}
gradle.extensions.extraProperties.set('stagedConsumerVersions', [
        coordination: selectedCoordinationVersion,
        contracts: selectedContractsVersion
])
gradle.extensions.extraProperties.set('stagedConsumerSourceProvenance', [
        coordinationSourceCommit: coordinationManifest.sourceCommit,
        coordinationSourceTree: coordinationManifest.sourceTree,
        coordinationSourceDirty: coordinationManifest.sourceDirty,
        contractsSourceCommit: contractsManifest.sourceCommit,
        contractsSourceTree: contractsManifest.sourceTree,
        contractsSourceDirty: contractsManifest.sourceDirty
])

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        exclusiveContent {
            forRepository {
                maven {
                    name = 'immutableCoordination'
                    url = uri(coordinationRepository)
                    metadataSources {
                        mavenPom()
                        artifact()
                    }
                }
            }
            filter { includeGroup 'blue.coordination' }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'immutableContracts'
                    url = uri(contractsRepository)
                    metadataSources {
                        mavenPom()
                        artifact()
                    }
                }
            }
            filter { includeGroup 'blue.language' }
        }
        mavenCentral()
    }
}
